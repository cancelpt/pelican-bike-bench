<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · Pelican on a Bicycle</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 20%, #22344d 0%, #0d1622 70%);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #cfe4f5;
    overflow: hidden;
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 18px;
  }
  h1 {
    margin: 0;
    font-size: clamp(18px, 3vw, 30px);
    font-weight: 600;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #ffd27d, #8fe3ff, #ffd27d);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 6s linear infinite;
    background-size: 200% 100%;
  }
  @keyframes shine { to { background-position: -200% 0; } }
  .hint { margin: 0; font-size: 13px; opacity: .55; letter-spacing: 1px; }
  .stage {
    width: min(96vw, 1100px);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 26px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
  }
  svg { display: block; width: 100%; height: auto; }

  /* ---------- 车轮旋转 ---------- */
  /* 车轮周期 1.466s × 轮周长 2π×70 ≈ 440px → 地面速度 300px/s，与 slide 保持一致 */
  .wheel {
    transform-box: view-box;
    animation: spin 1.466s linear infinite;
  }
  .wheel.rear  { transform-origin: 250px 330px; }
  .wheel.front { transform-origin: 530px 330px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 地面 / 远山 滚动 ---------- */
  /* 平移量 300px 必须是所有滚动元素平铺周期(150/100px)的整数倍，避免跳帧 */
  .scroll-loop { animation: slide 1s linear infinite; }
  @keyframes slide { to { transform: translateX(-300px); } }

  /* ---------- 云朵飘动 ---------- */
  .cloud { transform-box: view-box; animation-name: drift; animation-timing-function: linear; animation-iteration-count: infinite; }
  @keyframes drift {
    from { transform: translateX(960px); }
    to   { transform: translateX(-320px); }
  }
  .cloud.c1 { animation-duration: 26s; animation-delay: -3s;  }
  .cloud.c2 { animation-duration: 34s; animation-delay: -14s; }
  .cloud.c3 { animation-duration: 20s; animation-delay: -9s;  }

  /* ---------- 太阳光芒 ---------- */
  .rays {
    transform-box: view-box;
    transform-origin: 662px 96px;
    animation: spin 44s linear infinite reverse;
    opacity: .55;
  }

  /* ---------- 翅膀扇动 ---------- */
  .wing {
    transform-box: view-box;
    transform-origin: 356px 178px;
    animation: flap 0.62s ease-in-out infinite;
  }
  @keyframes flap {
    0%, 100% { transform: rotate(0deg)  scaleY(1); }
    50%      { transform: rotate(-17deg) scaleY(.88); }
  }
  .wing-back {
    transform-box: view-box;
    transform-origin: 344px 186px;
    animation: flapBack 0.62s ease-in-out infinite;
  }
  @keyframes flapBack {
    0%, 100% { transform: rotate(2deg); }
    50%      { transform: rotate(12deg); }
  }

  /* ---------- 鸟喙 / 喉囊摆动 ---------- */
  .pouch {
    transform-box: view-box;
    transform-origin: 470px 132px;
    animation: wobble 0.73s ease-in-out infinite;
  }
  @keyframes wobble {
    0%, 100% { transform: rotate(-2.5deg) scale(1); }
    50%      { transform: rotate(3deg)  scale(1.06); }
  }

  /* ---------- 头部轻微点头 ---------- */
  .head {
    transform-box: view-box;
    transform-origin: 432px 142px;
    animation: nod 0.73s ease-in-out infinite;
  }
  @keyframes nod {
    0%, 100% { transform: rotate(-2deg); }
    50%      { transform: rotate(2.5deg); }
  }

  /* ---------- 尾羽抖动 ---------- */
  .tail {
    transform-box: view-box;
    transform-origin: 306px 208px;
    animation: tail 0.73s ease-in-out infinite;
  }
  @keyframes tail {
    0%, 100% { transform: rotate(-3deg); }
    50%      { transform: rotate(5deg); }
  }

  /* ---------- 速度线 ---------- */
  .speedlines { animation: rush .75s linear infinite; }
  @keyframes rush { to { transform: translateX(-300px); } }

  /* ---------- 远处小鸟 ---------- */
  .bird { transform-box: view-box; }
  .bird .bwing {
    transform-box: view-box;
    animation: birdflap 0.42s ease-in-out infinite;
  }
  @keyframes birdflap {
    0%, 100% { transform: scaleY(1); }
    50%      { transform: scaleY(.35); }
  }
  .flock { animation: drift 30s linear infinite; transform-box: view-box; }

  /* ---------- 贴纸式阴影呼吸 ---------- */
  .ground-shadow {
    transform-box: view-box;
    transform-origin: 390px 402px;
    animation: shadowPulse 0.73s ease-in-out infinite;
  }
  @keyframes shadowPulse {
    0%, 100% { transform: scaleX(1);    opacity: .30; }
    50%      { transform: scaleX(.92);  opacity: .22; }
  }
</style>
</head>

  <p class="hint">纯 SVG + CSS + 一点点 JavaScript 实现的二维动画 · 双腿会踩踏板，翅膀会扇动，风景向后飞驰</p>
</div>

<script>
(() => {
  const CX = 392, CY = 334;      // 牙盘（曲柄）中心
  const CRANK_R = 40;            // 曲柄长度
  const L1 = 62, L2 = 62;        // 大腿 / 小腿长度
  const HIP_X = 348, HIP_Y = 252;// 髋关节基准位置

  const legNear  = document.getElementById('legNear');
  const legNearShade = document.getElementById('legNearShade');
  const legFar   = document.getElementById('legFar');
  const legFarShade = document.getElementById('legFarShade');
  const pedalNear = document.getElementById('pedalNear');
  const pedalFar  = document.getElementById('pedalFar');
  const footNear  = document.getElementById('footNear');
  const footFar   = document.getElementById('footFar');
  const crankset  = document.getElementById('crankset');
  const rider     = document.getElementById('rider');

  // 两点式 IK：由髋部和脚踝位置求膝盖
  function knee(hip, ankle) {
    const dx = ankle.x - hip.x, dy = ankle.y - hip.y;
    let d = Math.hypot(dx, dy);
    const maxD = (L1 + L2) * 0.995, minD = Math.abs(L1 - L2) + 4;
    d = Math.min(Math.max(d, minD), maxD);
    const ux = dx / (Math.hypot(dx, dy) || 1), uy = dy / (Math.hypot(dx, dy) || 1);
    const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(L1 * L1 - a * a, 0));
    // 膝盖朝前（+x / -y 方向鼓出）
    return {
      x: hip.x + ux * a + uy * h,
      y: hip.y + uy * a - ux * h
    };
  }

  function setLeg(poly, polyShade, hip, ankle) {
    const k = knee(hip, ankle);
    const pts = `${hip.x},${hip.y} ${k.x},${k.y} ${ankle.x},${ankle.y}`;
    poly.setAttribute('points', pts);
    // 阴影/高光略微偏移，形成立体感
    polyShade.setAttribute('points',
      `${hip.x + 2},${hip.y - 4} ${k.x + 2},${k.y - 4} ${ankle.x + 1},${ankle.y - 3}`);
  }

  let angle = 0;
  let last = performance.now();

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    // 与车轮同速旋转（车轮 CSS 周期 1.466s 转 2π，对应地面 300px/s）
    angle += (Math.PI * 2 / 1.466) * dt;

    // 身体随踩踏轻微起伏
    const bob = Math.sin(angle * 2) * 3.2;
    rider.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);

    // 曲柄
    crankset.setAttribute('transform', `rotate(${angle * 180 / Math.PI} ${CX} ${CY})`);

    // 两个脚踏（相差 180°）
    const pNear = {
      x: CX + Math.cos(angle) * CRANK_R,
      y: CY + Math.sin(angle) * CRANK_R
    };
    const pFar = {
      x: CX + Math.cos(angle + Math.PI) * CRANK_R,
      y: CY + Math.sin(angle + Math.PI) * CRANK_R
    };
    pedalNear.setAttribute('transform', `translate(${pNear.x.toFixed(2)} ${pNear.y.toFixed(2)})`);
    pedalFar.setAttribute('transform',  `translate(${pFar.x.toFixed(2)} ${pFar.y.toFixed(2)})`);

    // 脚掌跟随脚踏，踩踏时轻微摆动
    const tilt = Math.sin(angle) * 9;
    footNear.setAttribute('transform',
      `translate(${pNear.x.toFixed(2)} ${(pNear.y - 5).toFixed(2)}) rotate(${tilt.toFixed(2)})`);
    footFar.setAttribute('transform',
      `translate(${pFar.x.toFixed(2)} ${(pFar.y - 5).toFixed(2)}) rotate(${(-tilt).toFixed(2)})`);

    // 髋部跟随身体起伏
    const hipNear = { x: HIP_X, y: HIP_Y + bob };
    const hipFar  = { x: HIP_X - 12, y: HIP_Y + bob - 4 };

    setLeg(legNear, legNearShade, hipNear, pNear);
    setLeg(legFar,  legFarShade,  hipFar,  pFar);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
