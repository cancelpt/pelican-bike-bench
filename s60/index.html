<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(180deg, #87CEEB 0%, #E0F7FA 60%, #A5D6A7 60%, #66BB6A 100%);
    overflow: hidden;
  }
  svg {
    width: 800px;
    height: 600px;
  }
  /* 云朵飘动 */
  .cloud {
    animation: drift 20s linear infinite;
  }
  .cloud:nth-child(2) {
    animation-duration: 30s;
    animation-delay: -10s;
  }
  @keyframes drift {
    from { transform: translateX(-200px); }
    to { transform: translateX(900px); }
  }
  /* 车轮旋转 */
  .wheel {
    animation: spin 1s linear infinite;
    transform-origin: center;
    transform-box: fill-box;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  /* 鹈鹕身体上下颠簸 */
  .pelican-body {
    animation: bounce 0.5s ease-in-out infinite;
    transform-origin: center;
    transform-box: fill-box;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  /* 翅膀扇动 */
  .wing {
    animation: flap 0.4s ease-in-out infinite alternate;
    transform-origin: 10px 0px;
    transform-box: fill-box;
  }
  @keyframes flap {
    from { transform: rotate(-10deg); }
    to { transform: rotate(15deg); }
  }
  /* 踏板转动 */
  .pedal {
    animation: pedal 1s linear infinite;
    transform-origin: center;
    transform-box: fill-box;
  }
  @keyframes pedal {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  /* 整体轻微摇摆 */
  .bike-group {
    animation: sway 2s ease-in-out infinite;
    transform-origin: center bottom;
    transform-box: fill-box;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-1deg); }
    50% { transform: rotate(1deg); }
  }
  /* 水波 */
  .wave {
    animation: wave 3s ease-in-out infinite;
  }
  .wave:nth-child(2) {
    animation-delay: -1.5s;
  }
  @keyframes wave {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(15px); }
  }
</style>
</head>
<body>

<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 太阳 -->
  <circle cx="680" cy="80" r="50" fill="#FFD54F">
    <animate attributeName="r" values="50;55;50" dur="3s" repeatCount="indefinite"/>
  </circle>
  <g fill="#FFD54F" opacity="0.6">
    <line x1="680" y1="15" x2="680" y2="0" stroke="#FFD54F" stroke-width="3"/>
    <line x1="730" y1="30" x2="745" y2="15" stroke="#FFD54F" stroke-width="3"/>
    <line x1="745" y1="80" x2="760" y2="80" stroke="#FFD54F" stroke-width="3"/>
    <line x1="730" y1="130" x2="745" y2="145" stroke="#FFD54F" stroke-width="3"/>
    <line x1="680" y1="145" x2="680" y2="160" stroke="#FFD54F" stroke-width="3"/>
    <line x1="630" y1="130" x2="615" y2="145" stroke="#FFD54F" stroke-width="3"/>
    <line x1="615" y1="80" x2="600" y2="80" stroke="#FFD54F" stroke-width="3"/>
    <line x1="630" y1="30" x2="615" y2="15" stroke="#FFD54F" stroke-width="3"/>
  </g>

  <!-- 云朵 -->
  <g class="cloud">
    <ellipse cx="100" cy="80" rx="50" ry="25" fill="white" opacity="0.9"/>
    <ellipse cx="140" cy="70" rx="40" ry="22" fill="white" opacity="0.9"/>
    <ellipse cx="70" cy="75" rx="35" ry="20" fill="white" opacity="0.9"/>
  </g>
  <g class="cloud">
    <ellipse cx="400" cy="50" rx="45" ry="20" fill="white" opacity="0.8"/>
    <ellipse cx="440" cy="42" rx="35" ry="18" fill="white" opacity="0.8"/>
    <ellipse cx="370" cy="45" rx="30" ry="16" fill="white" opacity="0.8"/>
  </g>

  <!-- 远山 -->
  <polygon points="0,420 150,280 300,420" fill="#81C784" opacity="0.5"/>
  <polygon points="200,420 400,250 600,420" fill="#66BB6A" opacity="0.4"/>
  <polygon points="500,420 650,300 800,420" fill="#81C784" opacity="0.5"/>

  <!-- 地面 -->
  <rect x="0" y="420" width="800" height="180" fill="#A5D6A7"/>
  <!-- 道路 -->
  <rect x="0" y="460" width="800" height="60" fill="#9E9E9E" rx="5"/>
  <line x1="0" y1="490" x2="800" y2="490" stroke="#FDD835" stroke-width="3" stroke-dasharray="30,20"/>

  <!-- 水波（路边小水塘） -->
  <g transform="translate(600, 530)">
    <ellipse class="wave" cx="0" cy="0" rx="60" ry="10" fill="#4FC3F7" opacity="0.6"/>
    <ellipse class="wave" cx="0" cy="8" rx="50" ry="8" fill="#29B6F6" opacity="0.5"/>
  </g>

  <!-- 自行车 + 鹈鹕 组合 -->
  <g class="bike-group" transform="translate(250, 280)">

    <!-- 后轮 -->
    <g class="wheel" transform="translate(0, 130)">
      <circle cx="0" cy="0" r="55" fill="none" stroke="#333" stroke-width="4"/>
      <circle cx="0" cy="0" r="48" fill="none" stroke="#555" stroke-width="2"/>
      <!-- 辐条 -->
      <line x1="-48" y1="0" x2="48" y2="0" stroke="#888" stroke-width="1.5"/>
      <line x1="0" y1="-48" x2="0" y2="48" stroke="#888" stroke-width="1.5"/>
      <line x1="-34" y1="-34" x2="34" y2="34" stroke="#888" stroke-width="1.5"/>
      <line x1="34" y1="-34" x2="-34" y2="34" stroke="#888" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="6" fill="#333"/>
    </g>

    <!-- 前轮 -->
    <g class="wheel" transform="translate(140, 130)">
      <circle cx="0" cy="0" r="55" fill="none" stroke="#333" stroke-width="4"/>
      <circle cx="0" cy="0" r="48" fill="none" stroke="#555" stroke-width="2"/>
      <line x1="-48" y1="0" x2="48" y2="0" stroke="#888" stroke-width="1.5"/>
      <line x1="0" y1="-48" x2="0" y2="48" stroke="#888" stroke-width="1.5"/>
      <line x1="-34" y1="-34" x2="34" y2="34" stroke="#888" stroke-width="1.5"/>
      <line x1="34" y1="-34" x2="-34" y2="34" stroke="#888" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="6" fill="#333"/>
    </g>

    <!-- 车架 -->
    <g stroke="#E53935" stroke-width="5" fill="none" stroke-linecap="round">
      <!-- 后叉 -->
      <line x1="0" y1="130" x2="-10" y2="70"/>
      <!-- 座管 -->
      <line x1="-10" y1="70" x2="10" y2="65"/>
      <!-- 上管 -->
      <line x1="10" y1="65" x2="100" y2="65"/>
      <!-- 下管 -->
      <line x1="-10" y1="70" x2="100" y2="65"/>
      <!-- 前叉 -->
      <line x1="100" y1="65" x2="140" y2="130"/>
      <!-- 后上叉 -->
      <line x1="0" y1="130" x2="20" y2="65"/>
    </g>

    <!-- 脚踏板曲柄 -->
    <g class="pedal" transform="translate(50, 100)">
      <circle cx="0" cy="0" r="8" fill="#333"/>
      <line x1="0" y1="0" x2="20" y2="0" stroke="#333" stroke-width="4"/>
      <rect x="16" y="-6" width="12" height="8" rx="2" fill="#666"/>
      <line x1="0" y1="0" x2="-20" y2="0" stroke="#333" stroke-width="4"/>
      <rect x="-28" y="-6" width="12" height="8" rx="2" fill="#666"/>
    </g>

    <!-- 链条（简化） -->
    <ellipse cx="25" cy="115" rx="28" ry="15" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="4,2"/>

    <!-- 车座 -->
    <path d="M-5,60 Q10,55 25,60" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="10" cy="58" rx="18" ry="6" fill="#5D4037"/>

    <!-- 车把 -->
    <g stroke="#333" stroke-width="4" fill="none" stroke-linecap="round">
      <line x1="100" y1="65" x2="110" y2="50"/>
      <line x1="105" y1="48" x2="120" y2="55"/>
      <line x1="105" y1="48" x2="95" y2="42"/>
    </g>

    <!-- 鹈鹕身体 -->
    <g class="pelican-body" transform="translate(10, 0)">
      <!-- 身体 -->
      <ellipse cx="0" cy="30" rx="30" ry="35" fill="#FAFAFA" stroke="#DDD" stroke-width="1"/>
      <!-- 肚子 -->
      <ellipse cx="0" cy="40" rx="22" ry="20" fill="#F5F5F5"/>

      <!-- 脖子 -->
      <path d="M-5,0 Q-15,-30 -5,-55 Q0,-65 5,-55 Q15,-30 5,0" fill="#FAFAFA" stroke="#DDD" stroke-width="1"/>

      <!-- 头 -->
      <ellipse cx="0" cy="-65" rx="16" ry="14" fill="#FAFAFA" stroke="#DDD" stroke-width="1"/>

      <!-- 眼睛 -->
      <circle cx="-6" cy="-68" r="4" fill="white"/>
      <circle cx="-5" cy="-68" r="2.5" fill="#333"/>
      <circle cx="-4" cy="-69" r="1" fill="white"/>
      <circle cx="6" cy="-68" r="4" fill="white"/>
      <circle cx="7" cy="-68" r="2.5" fill="#333"/>
      <circle cx="8" cy="-69" r="1" fill="white"/>

      <!-- 喙 -->
      <path d="M-8,-58 Q0,-52 8,-58 L12,-50 Q10,-38 0,-36 Q-10,-38 -12,-50 Z" fill="#FFB74D" stroke="#E65100" stroke-width="0.5"/>
      <!-- 喉囊 -->
      <path d="M-6,-50 Q0,-42 6,-50 Q8,-40 0,-37 Q-8,-40 -6,-50" fill="#FFCC80" opacity="0.8"/>
      <!-- 喙上的环 -->
      <line x1="-4" y1="-53" x2="4" y2="-53" stroke="#E65100" stroke-width="1"/>

      <!-- 翅膀 -->
      <g class="wing" transform="translate(-20, 20)">
        <path d="M0,0 Q-25,10 -30,30 Q-20,25 -10,20 Q-25,35 -20,45 Q-10,35 0,25 Q-15,40 -10,50 Q0,35 5,20 Q-5,30 0,0" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.5"/>
      </g>

      <!-- 尾羽 -->
      <path d="M-15,55 Q-30,65 -35,75 Q-25,68 -15,65 Q-28,72 -30,80 Q-20,72 -10,65" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="0.5"/>

      <!-- 腿 -->
      <g stroke="#FFB74D" stroke-width="4" stroke-linecap="round">
        <line x1="-8" y1="60" x2="30" y2="95"/>
        <line x1="8" y1="60" x2="70" y2="95"/>
      </g>
      <!-- 脚蹼 -->
      <g fill="#FFB74D">
        <ellipse cx="32" cy="98" rx="10" ry="4"/>
        <ellipse cx="72" cy="98" rx="10" ry="4"/>
      </g>

      <!-- 帽子（骑行帽） -->
      <path d="M-14,-72 Q0,-85 14,-72" fill="#E53935"/>
      <ellipse cx="0" cy="-72" rx="16" ry="4" fill="#C62828"/>
      <!-- 帽檐 -->
      <path d="M14,-72 Q20,-70 22,-66" fill="#C62828" stroke="#C62828" stroke-width="2"/>
    </g>
  </g>

  <!-- 小鸟飞过 -->
  <g opacity="0.7">
    <path d="M550,120 Q560,115 570,120" fill="none" stroke="#333" stroke-width="1.5">
      <animate attributeName="d" values="M550,120 Q560,115 570,120;M550,120 Q560,125 570,120;M550,120 Q560,115 570,120" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M570,120 Q580,115 590,120" fill="none" stroke="#333" stroke-width="1.5">
      <animate attributeName="d" values="M570,120 Q580,115 590,120;M570,120 Q580,125 590,120;M570,120 Q580,115 590,120" dur="1s" repeatCount="indefinite"/>
    </path>
    <animateTransform attributeName="transform" type="translate" values="0,0;30,-5;60,0" dur="8s" repeatCount="indefinite"/>
  </g>

  <!-- 花朵装饰 -->
  <g transform="translate(80, 520)">
    <circle cx="0" cy="0" r="6" fill="#F48FB1"/>
    <circle cx="-5" cy="-4" r="4" fill="#F48FB1"/>
    <circle cx="5" cy="-4" r="4" fill="#F48FB1"/>
    <circle cx="-5" cy="4" r="4" fill="#F48FB1"/>
    <circle cx="5" cy="4" r="4" fill="#F48FB1"/>
    <circle cx="0" cy="0" r="3" fill="#FFD54F"/>
    <line x1="0" y1="6" x2="0" y2="25" stroke="#66BB6A" stroke-width="2"/>
  </g>
  <g transform="translate(160, 535)">
    <circle cx="0" cy="0" r="5" fill="#CE93D8"/>
    <circle cx="-4" cy="-3" r="3.5" fill="#CE93D8"/>
    <circle cx="4" cy="-3" r="3.5" fill="#CE93D8"/>
    <circle cx="-4" cy="3" r="3.5" fill="#CE93D8"/>
    <circle cx="4" cy="3" r="3.5" fill="#CE93D8"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFD54F"/>
    <line x1="0" y1="5" x2="0" y2="20" stroke="#66BB6A" stroke-width="2"/>
  </g>
  <g transform="translate(500, 525)">
    <circle cx="0" cy="0" r="5" fill="#FF8A80"/>
    <circle cx="-4" cy="-3" r="3.5" fill="#FF8A80"/>
    <circle cx="4" cy="-3" r="3.5" fill="#FF8A80"/>
    <circle cx="-4" cy="3" r="3.5" fill="#FF8A80"/>
    <circle cx="4" cy="3" r="3.5" fill="#FF8A80"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFD54F"/>
    <line x1="0" y1="5" x2="0" y2="22" stroke="#66BB6A" stroke-width="2"/>
  </g>

  <!-- 文字 -->
  <text x="400" y="580" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5D4037" font-weight="bold">🚴 鹈鹕骑自行车 🐦</text>
</svg>

</body>
</html>
