<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelican Riding a Bike</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #E3F2FD;
    font-family: sans-serif;
  }
  svg {
    width: min(100vw, 1000px);
    height: auto;
  }
  /* 车身 + 鹈鹕整体上下起伏、轻微摇摆（周期与曲柄一致） */
  .rider {
    transform-box: view-box;
    transform-origin: 450px 430px;
    animation: bob 0.55s ease-in-out infinite alternate;
  }
  @keyframes bob {
    from { transform: translate(0, 0) rotate(-0.8deg); }
    to   { transform: translate(0, -9px) rotate(1.2deg); }
  }
  /* 地面虚线向后滚动，营造前进感 */
  .dashmove {
    transform-box: view-box;
    animation: dash 1.1s linear infinite;
  }
  @keyframes dash {
    from { transform: translateX(0); }
    to   { transform: translateX(-60px); }
  }
  /* 云朵缓慢漂移 */
  .cloud { transform-box: view-box; }
  .c1 { animation: drift 16s ease-in-out infinite alternate; }
  .c2 { animation: drift 24s ease-in-out infinite alternate; }
  .c3 { animation: drift 13s ease-in-out infinite alternate-reverse; }
  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(110px); }
  }
</style>
</head>
<body>

<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7EC8F2"/>
      <stop offset="100%" stop-color="#DFF3FF"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="900" height="520" fill="url(#sky)"/>

  <!-- 标题 -->
  <text x="450" y="52" text-anchor="middle" font-family="'Comic Sans MS', cursive, sans-serif"
        font-size="32" font-weight="bold" fill="#37474F">Pelican Riding a Bike</text>

  <!-- 太阳 -->
  <g>
    <circle cx="120" cy="110" r="42" fill="#FFD54F"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 120 110" to="360 120 110" dur="40s" repeatCount="indefinite"/>
      <line x1="120" y1="48" x2="120" y2="32" stroke="#FFE082" stroke-width="6" stroke-linecap="round"/>
      <line x1="120" y1="48" x2="120" y2="32" stroke="#FFE082" stroke-width="6" stroke-linecap="round" transform="rotate(45 120 110)"/>
      <line x1="120" y1="48" x2="120" y2="32" stroke="#FFE082" stroke-width="6" stroke-linecap="round" transform="rotate(90 120 110)"/>
      <line x1="120" y1="48" x2="120" y2="32" stroke="#FFE082" stroke-width="6" stroke-linecap="round" transform="rotate(135 120 110)"/>
    </g>
  </g>

  <!-- 云朵 -->
  <g class="cloud c1">
    <ellipse cx="200" cy="95" rx="52" ry="20" fill="#fff" opacity="0.95"/>
    <ellipse cx="168" cy="84" rx="30" ry="18" fill="#fff" opacity="0.95"/>
    <ellipse cx="236" cy="86" rx="26" ry="16" fill="#fff" opacity="0.95"/>
  </g>
  <g class="cloud c2">
    <ellipse cx="610" cy="60" rx="46" ry="18" fill="#fff" opacity="0.9"/>
    <ellipse cx="580" cy="52" rx="26" ry="15" fill="#fff" opacity="0.9"/>
    <ellipse cx="642" cy="54" rx="22" ry="13" fill="#fff" opacity="0.9"/>
  </g>
  <g class="cloud c3">
    <ellipse cx="790" cy="150" rx="40" ry="16" fill="#fff" opacity="0.85"/>
    <ellipse cx="762" cy="142" rx="24" ry="13" fill="#fff" opacity="0.85"/>
    <ellipse cx="820" cy="144" rx="20" ry="11" fill="#fff" opacity="0.85"/>
  </g>

  <!-- 远景丘陵 -->
  <path d="M0 470 Q 160 400 340 470 T 680 470 T 900 460 L 900 520 L 0 520 Z" fill="#A5D6A7"/>
  <path d="M0 495 Q 260 430 520 495 T 900 495 L 900 520 L 0 520 Z" fill="#81C784" opacity="0.8"/>

  <!-- 草地 -->
  <rect x="0" y="500" width="900" height="24" fill="#8BC34A"/>

  <!-- 路面 -->
  <rect x="0" y="524" width="900" height="76" fill="#B0BEC5"/>
  <rect x="0" y="524" width="900" height="3" fill="#ECEFF1"/>
  <rect x="0" y="597" width="900" height="3" fill="#ECEFF1"/>

  <!-- 滚动的路面虚线 -->
  <g class="dashmove">
    <g>
      <rect x="-60"  y="550" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="0"    y="550" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="60"   y="550" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="120"  y="550" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="180"  y="550" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="240"  y="550" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="300"  y="550" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="360"  y="550" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="420"  y="550" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="480"  y="550" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="540"  y="550" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="600"  y="550" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="660"  y="550" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="720"  y="550" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="780"  y="550" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="840"  y="550" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="900"  y="550" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="960"  y="550" width="44" height="7" rx="2" fill="#ECEFF1"/>
    </g>
    <g>
      <rect x="-60"  y="580" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="0"    y="580" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="60"   y="580" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="120"  y="580" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="180"  y="580" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="240"  y="580" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="300"  y="580" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="360"  y="580" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="420"  y="580" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="480"  y="580" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="540"  y="580" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="600"  y="580" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="660"  y="580" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="720"  y="580" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="780"  y="580" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="840"  y="580" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="900"  y="580" width="44" height="7" rx="2" fill="#ECEFF1"/>
      <rect x="960"  y="580" width="44" height="7" rx="2" fill="#ECEFF1"/>
    </g>
  </g>

  <!-- 车身阴影 -->
  <ellipse cx="450" cy="530" rx="235" ry="13" fill="rgba(55,71,79,0.18)"/>

  <!-- ============ 车身 + 鹈鹕（整体起伏） ============ -->
  <g class="rider">

    <!-- 自行车 -->
    <g class="bike">
      <!-- 后轮 -->
      <g>
        <circle cx="280" cy="430" r="90" fill="none" stroke="#263238" stroke-width="9"/>
        <circle cx="280" cy="430" r="80" fill="none" stroke="#90A4AE" stroke-width="3"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 280 430" to="360 280 430" dur="1.1s" repeatCount="indefinite"/>
          <line x1="280" y1="340" x2="280" y2="520" stroke="#90A4AE" stroke-width="1.5"/>
          <line x1="280" y1="340" x2="280" y2="520" stroke="#90A4AE" stroke-width="1.5" transform="rotate(60 280 430)"/>
          <line x1="280" y1="340" x2="280" y2="520" stroke="#90A4AE" stroke-width="1.5" transform="rotate(120 280 430)"/>
          <circle cx="280" cy="343" r="3" fill="#E53935"/>
        </g>
        <circle cx="280" cy="430" r="7" fill="#546E7A"/>
      </g>

      <!-- 前轮 -->
      <g>
        <circle cx="620" cy="430" r="90" fill="none" stroke="#263238" stroke-width="9"/>
        <circle cx="620" cy="430" r="80" fill="none" stroke="#90A4AE" stroke-width="3"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 620 430" to="360 620 430" dur="1.1s" repeatCount="indefinite"/>
          <line x1="620" y1="340" x2="620" y2="520" stroke="#90A4AE" stroke-width="1.5"/>
          <line x1="620" y1="340" x2="620" y2="520" stroke="#90A4AE" stroke-width="1.5" transform="rotate(60 620 430)"/>
          <line x1="620" y1="340" x2="620" y2="520" stroke="#90A4AE" stroke-width="1.5" transform="rotate(120 620 430)"/>
          <circle cx="620" cy="343" r="3" fill="#E53935"/>
        </g>
        <circle cx="620" cy="430" r="7" fill="#546E7A"/>
      </g>

      <!-- 车架 -->
      <g stroke-linecap="round" stroke-linejoin="round">
        <line x1="418" y1="348" x2="582" y2="340" stroke="#E53935" stroke-width="9"/>
        <line x1="450" y1="430" x2="600" y2="372" stroke="#E53935" stroke-width="9"/>
        <line x1="450" y1="430" x2="415" y2="345" stroke="#E53935" stroke-width="9"/>
        <line x1="280" y1="430" x2="450" y2="430" stroke="#37474F" stroke-width="7"/>
        <line x1="280" y1="430" x2="415" y2="345" stroke="#37474F" stroke-width="5"/>
        <line x1="582" y1="340" x2="600" y2="372" stroke="#37474F" stroke-width="11"/>
        <line x1="600" y1="372" x2="620" y2="430" stroke="#37474F" stroke-width="7"/>
        <line x1="582" y1="340" x2="573" y2="306" stroke="#37474F" stroke-width="7"/>
        <line x1="543" y1="300" x2="612" y2="306" stroke="#37474F" stroke-width="7"/>
        <line x1="415" y1="345" x2="400" y2="322" stroke="#546E7A" stroke-width="6"/>
      </g>

      <!-- 座垫 -->
      <ellipse cx="398" cy="316" rx="32" ry="9" transform="rotate(-12 398 316)" fill="#263238"/>

      <!-- 后飞轮 + 链条 -->
      <circle cx="280" cy="430" r="11" fill="#546E7A"/>
      <line x1="288" y1="422" x2="452" y2="424" stroke="#90A4AE" stroke-width="2.5"/>
      <line x1="288" y1="438" x2="452" y2="436" stroke="#90A4AE" stroke-width="2.5"/>

      <!-- 车把 -->
      <circle cx="543" cy="300" r="6" fill="#263238"/>
      <circle cx="612" cy="306" r="6" fill="#263238"/>

      <!-- 曲柄组：牙盘 + 曲柄 + 踏板 + 小腿（绕中轴旋转，与车轮同步） -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 450 430" to="360 450 430" dur="1.1s" repeatCount="indefinite"/>
        <circle cx="450" cy="430" r="24" fill="none" stroke="#90A4AE" stroke-width="3"/>
        <circle cx="450" cy="430" r="9" fill="#546E7A"/>
        <!-- 后侧曲柄与小腿 -->
        <line x1="450" y1="430" x2="398" y2="430" stroke="#37474F" stroke-width="8"/>
        <path d="M450 430 Q 424 412 400 426" fill="none" stroke="#C9882F" stroke-width="17" stroke-linecap="round"/>
        <path d="M450 430 Q 424 412 400 426" fill="none" stroke="#D99A33" stroke-width="12" stroke-linecap="round"/>
        <rect x="380" y="421" width="32" height="12" rx="4" fill="#455A64"/>
        <!-- 前侧曲柄与小腿 -->
        <line x1="450" y1="430" x2="502" y2="430" stroke="#78909C" stroke-width="8"/>
        <path d="M450 430 Q 478 412 502 426" fill="none" stroke="#C9882F" stroke-width="17" stroke-linecap="round"/>
        <path d="M450 430 Q 478 412 502 426" fill="none" stroke="#E9A13B" stroke-width="12" stroke-linecap="round"/>
        <rect x="488" y="421" width="32" height="12" rx="4" fill="#546E7A"/>
      </g>
    </g>

    <!-- 鹈鹕 -->
    <g class="pelican">
      <!-- 尾巴 -->
      <path d="M318 262 Q 272 248 256 232 Q 280 290 326 298 Z" fill="#F8FAFC" stroke="#AEB6BE" stroke-width="2.5"/>

      <!-- 静态大腿（连接身体与中轴） -->
      <line x1="398" y1="344" x2="452" y2="428" stroke="#C9882F" stroke-width="17" stroke-linecap="round"/>
      <line x1="398" y1="344" x2="452" y2="428" stroke="#E9A13B" stroke-width="12" stroke-linecap="round"/>

      <!-- 身体 -->
      <ellipse cx="370" cy="292" rx="62" ry="56" transform="rotate(-10 370 292)" fill="#F8FAFC" stroke="#AEB6BE" stroke-width="2.5"/>

      <!-- 腹部羽毛 -->
      <path d="M408 330 Q 436 356 448 380 Q 424 382 400 360 Z" fill="#F8FAFC" stroke="#AEB6BE" stroke-width="2"/>

      <!-- 脖子 -->
      <path d="M400 268 C 424 240, 448 222, 466 214 C 463 228, 450 248, 430 262 Z" fill="#F8FAFC" stroke="#AEB6BE" stroke-width="2.5"/>

      <!-- 头 -->
      <circle cx="472" cy="206" r="30" fill="#F8FAFC" stroke="#AEB6BE" stroke-width="2.5"/>

      <!-- 头顶羽冠 -->
      <path d="M452 184 Q 444 158 464 156 Q 468 172 474 178 Z" fill="#F7A41D" stroke="#C9821E" stroke-width="1.5"/>

      <!-- 眼睛 -->
      <circle cx="481" cy="197" r="8" fill="#fff" stroke="#AEB6BE" stroke-width="1.5"/>
      <circle cx="484" cy="197" r="4" fill="#263238"/>
      <circle cx="486" cy="195" r="1.4" fill="#fff"/>

      <!-- 上喙 -->
      <path d="M494 192 Q 590 176 662 194 Q 604 202 498 202 Z" fill="#F7A41D" stroke="#C9821E" stroke-width="2"/>

      <!-- 喉囊（下垂的橙色大囊） -->
      <path d="M496 202 Q 596 216 662 194 Q 642 262 562 262 Q 518 258 496 230 Z" fill="#FFB03B" stroke="#C9821E" stroke-width="2"/>
      <path d="M540 200 Q 546 236 558 256" fill="none" stroke="#E68A1E" stroke-width="1.6" opacity="0.55"/>
      <path d="M588 198 Q 592 234 604 256" fill="none" stroke="#E68A1E" stroke-width="1.6" opacity="0.55"/>
      <path d="M636 196 Q 636 228 636 248" fill="none" stroke="#E68A1E" stroke-width="1.6" opacity="0.55"/>

      <!-- 手臂（搭在车把上） -->
      <path d="M402 282 Q 480 298 566 308" fill="none" stroke="#AEB6BE" stroke-width="13" stroke-linecap="round"/>
      <path d="M402 282 Q 480 298 566 308" fill="none" stroke="#F8FAFC" stroke-width="9" stroke-linecap="round"/>
      <circle cx="572" cy="311" r="7" fill="#F8FAFC" stroke="#AEB6BE" stroke-width="2"/>

      <!-- 翅膀（扑扇） -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-30 396 258; 8 396 258; -30 396 258"
                          keyTimes="0; 0.5; 1" dur="0.7s" repeatCount="indefinite"/>
        <path d="M398 262 C 384 222, 342 214, 312 226 C 296 232, 296 254, 318 262 C 334 268, 360 276, 382 279 C 394 281, 402 274, 398 262 Z"
              fill="#EEF1F3" stroke="#AEB6BE" stroke-width="2.5"/>
        <path d="M314 258 C 302 244, 298 233, 306 228 C 312 235, 322 244, 326 253 C 322 258, 317 260, 314 258 Z" fill="#37474F"/>
        <path d="M352 234 Q 348 252 358 266" fill="none" stroke="#AEB6BE" stroke-width="2"/>
        <path d="M372 236 Q 368 254 376 268" fill="none" stroke="#AEB6BE" stroke-width="2"/>
      </g>
    </g>

  </g>

</svg>

</body>
</html>
