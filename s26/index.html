<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#bfe5e8">
  <title>Pelican Coast Ride</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-rounded, "Avenir Next", "Segoe UI", sans-serif;
      background: #bfe5e8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 280px;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #bfe5e8;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      isolation: isolate;
      overflow: hidden;
      background: #bfe5e8;
    }

    .scene {
      display: block;
      width: 100%;
      height: 100%;
    }

    .playback {
      position: absolute;
      z-index: 4;
      top: max(18px, env(safe-area-inset-top));
      right: max(18px, env(safe-area-inset-right));
      display: grid;
      width: 46px;
      height: 46px;
      padding: 0;
      place-items: center;
      border: 1px solid rgb(32 58 64 / 22%);
      border-radius: 50%;
      color: #203a40;
      background: rgb(255 253 246 / 82%);
      box-shadow: 0 8px 24px rgb(32 58 64 / 14%);
      font: inherit;
      font-size: 19px;
      line-height: 1;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 160ms ease, background-color 160ms ease;
    }

    .playback:hover {
      transform: translateY(-2px);
      background: #fffdf6;
    }

    .playback:focus-visible {
      outline: 3px solid #e85f46;
      outline-offset: 3px;
    }

    .sky-stripe {
      opacity: 0.24;
    }

    .sun-rays {
      transform-box: fill-box;
      transform-origin: center;
      animation: sun-turn 24s linear infinite;
    }

    .cloud {
      animation: cloud-drift 28s linear infinite;
    }

    .cloud--two {
      animation-duration: 36s;
      animation-delay: -17s;
    }

    .cloud--three {
      animation-duration: 43s;
      animation-delay: -29s;
    }

    .wave-runner {
      animation: wave-drift 6s linear infinite;
    }

    .shore-glint {
      animation: glint 2.8s ease-in-out infinite alternate;
    }

    .far-sail {
      animation: sail 18s linear infinite;
    }

    .road-dashes {
      animation: road-run 1.05s linear infinite;
    }

    .speed-line {
      animation: speed-run 1.2s linear infinite;
    }

    .speed-line--two {
      animation-delay: -0.48s;
    }

    .speed-line--three {
      animation-delay: -0.82s;
    }

    .ride-scale {
      transform-box: view-box;
      transform-origin: 600px 475px;
    }

    .ride-unit {
      animation: rider-bob 0.58s ease-in-out infinite alternate;
    }

    .bike-shadow {
      transform-box: fill-box;
      transform-origin: center;
      animation: shadow-breathe 0.58s ease-in-out infinite alternate;
    }

    .wheel-spin,
    .crank-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: wheel-turn 0.82s linear infinite;
    }

    .crank-spin {
      animation-duration: 0.82s;
    }

    .leg--near {
      transform-box: view-box;
      transform-origin: 547px 392px;
      animation: leg-near 0.82s ease-in-out infinite alternate;
    }

    .leg--far {
      transform-box: view-box;
      transform-origin: 520px 393px;
      animation: leg-far 0.82s ease-in-out infinite alternate;
    }

    .front-wing {
      transform-box: view-box;
      transform-origin: 552px 312px;
      animation: wing-steer 1.16s ease-in-out infinite alternate;
    }

    .pelican-head {
      transform-box: view-box;
      transform-origin: 622px 208px;
      animation: head-bob 1.16s ease-in-out infinite alternate;
    }

    .eye-lid {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 5.2s linear infinite;
    }

    .scarf-tail {
      transform-box: view-box;
      transform-origin: 584px 250px;
      animation: scarf-wave 0.72s ease-in-out infinite alternate;
    }

    .feather-tip {
      animation: feather-ruffle 0.62s ease-in-out infinite alternate;
    }

    .feather-tip--two {
      animation-delay: -0.26s;
    }

    .basket-flower {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: flower-sway 1.1s ease-in-out infinite alternate;
    }

    .paused * {
      animation-play-state: paused !important;
    }

    @keyframes sun-turn {
      to { transform: rotate(360deg); }
    }

    @keyframes cloud-drift {
      from { transform: translateX(-180px); }
      to { transform: translateX(1380px); }
    }

    @keyframes wave-drift {
      from { transform: translateX(0); }
      to { transform: translateX(-180px); }
    }

    @keyframes glint {
      from { opacity: 0.35; }
      to { opacity: 0.85; }
    }

    @keyframes sail {
      from { transform: translateX(-190px); }
      to { transform: translateX(1360px); }
    }

    @keyframes road-run {
      from { transform: translateX(0); }
      to { transform: translateX(-240px); }
    }

    @keyframes speed-run {
      0% { transform: translateX(220px); opacity: 0; }
      20% { opacity: 0.65; }
      100% { transform: translateX(-500px); opacity: 0; }
    }

    @keyframes rider-bob {
      from { transform: translateY(0); }
      to { transform: translateY(-5px); }
    }

    @keyframes shadow-breathe {
      from { transform: scaleX(1); opacity: 0.16; }
      to { transform: scaleX(0.94); opacity: 0.11; }
    }

    @keyframes wheel-turn {
      to { transform: rotate(360deg); }
    }

    @keyframes leg-near {
      from { transform: rotate(14deg); }
      to { transform: rotate(-15deg); }
    }

    @keyframes leg-far {
      from { transform: rotate(-14deg); }
      to { transform: rotate(15deg); }
    }

    @keyframes wing-steer {
      from { transform: rotate(1deg); }
      to { transform: rotate(-3deg); }
    }

    @keyframes head-bob {
      from { transform: rotate(-1deg) translateY(0); }
      to { transform: rotate(1deg) translateY(2px); }
    }

    @keyframes blink {
      0%, 46%, 50%, 100% { transform: scaleY(1); }
      48% { transform: scaleY(0.08); }
    }

    @keyframes scarf-wave {
      from { transform: rotate(4deg) scaleX(1); }
      to { transform: rotate(-5deg) scaleX(0.92); }
    }

    @keyframes feather-ruffle {
      from { transform: translateX(0); }
      to { transform: translateX(-6px); }
    }

    @keyframes flower-sway {
      from { transform: rotate(-3deg); }
      to { transform: rotate(4deg); }
    }

    @media (max-aspect-ratio: 3 / 4) {
      .ride-scale {
        transform: scale(0.69) translateY(105px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .stage * {
        animation-play-state: paused !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <svg class="scene" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="scene-title scene-description">

      <g transform="translate(104 267)">

        <g class="road-dashes" fill="#efc75c">

      <g fill="none" stroke="#a89c8d" stroke-width="5" stroke-linecap="round" opacity="0.48">

          </g>

          <g transform="translate(566 526)">
            <g class="crank-spin">
              <circle r="25" fill="#f4b83f" stroke="#203a40" stroke-width="7" />

          </g>

          <!-- Rear rack and picnic roll -->

          </g>

            <path d="M346 423 H298" />

      </g>

      <!-- Foreground plants -->
      <g transform="translate(88 641)" fill="none" stroke="#4f8a62" stroke-width="7" stroke-linecap="round">
        <path d="M0 58 Q1 18 20 0 M18 58 Q27 24 54 13 M-5 58 Q-13 31 -31 22" />

        <path d="M0 58 Q1 18 20 0 M18 58 Q27 24 54 13 M-5 58 Q-13 31 -31 22" />
      </g>
    </svg>

    <button class="playback" id="playback" type="button" aria-label="Pause animation" title="Pause animation">
      <span aria-hidden="true">&#x23F8;</span>
    </button>
  </main>

  <script>
    const stage = document.querySelector('#stage');
    const playback = document.querySelector('#playback');
    const icon = playback.querySelector('span');

    playback.addEventListener('click', () => {
      const isPaused = stage.classList.toggle('paused');
      icon.textContent = isPaused ? '\u25B6' : '\u23F8';
      playback.setAttribute('aria-label', isPaused ? 'Play animation' : 'Pause animation');
      playback.setAttribute('title', isPaused ? 'Play animation' : 'Pause animation');
    });
  </script>
</body>
</html>
