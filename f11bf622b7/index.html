<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f2a3d; }
  body { display: flex; align-items: center; justify-content: center; }
  svg { width: min(100vw, 160vh); height: auto; display: block; border-radius: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, .45); }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鹈鹕骑自行车的动画">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fb3ee"/>
      <stop offset=".6" stop-color="#a9defa"/>
      <stop offset="1" stop-color="#eaf8ff"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fff6c2" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff6c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f93c9"/>
      <stop offset="1" stop-color="#74cfe8"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#626a78"/>
      <stop offset="1" stop-color="#474e5b"/>
    </linearGradient>
    <radialGradient id="bodyGrad" cx=".45" cy=".35" r=".75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".7" stop-color="#f6f7f9"/>
      <stop offset="1" stop-color="#dfe4ea"/>
    </radialGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc233"/>
      <stop offset="1" stop-color="#f58220"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdd7a"/>
      <stop offset="1" stop-color="#ffab2e"/>
    </linearGradient>

    <g id="cloud" fill="#fff">
      <ellipse cx="0" cy="0" rx="46" ry="15"/>
      <circle cx="-18" cy="-9" r="16"/>
      <circle cx="6" cy="-16" r="21"/>
      <circle cx="28" cy="-6" r="13"/>
    </g>

    <g id="palm">
      <path d="M0 0 Q-6 -45 4 -92" fill="none" stroke="#9a6b3f" stroke-width="8" stroke-linecap="round"/>
      <g fill="none" stroke="#2f9e5b" stroke-width="6" stroke-linecap="round">
        <path d="M4 -92 Q30 -112 56 -92"/>
        <path d="M4 -92 Q34 -100 50 -74"/>
        <path d="M4 -92 Q-22 -114 -48 -96"/>
        <path d="M4 -92 Q-26 -100 -42 -76"/>
        <path d="M4 -92 Q8 -120 26 -122"/>
        <path d="M4 -92 Q-4 -120 -22 -124"/>
      </g>
      <circle cx="1" cy="-88" r="4" fill="#6f4a2a"/>
      <circle cx="8" cy="-86" r="4" fill="#6f4a2a"/>
    </g>

    <g id="wheel">
      <circle r="57" fill="none" stroke="#2b2f3a" stroke-width="7"/>
      <circle r="51.5" fill="none" stroke="#c9d1da" stroke-width="2.5"/>
      <g stroke="#aeb7c2" stroke-width="1.4">
        <line x1="-51" y1="0" x2="51" y2="0"/>
        <line x1="0" y1="-51" x2="0" y2="51"/>
        <line x1="-36" y1="-36" x2="36" y2="36"/>
        <line x1="-36" y1="36" x2="36" y2="-36"/>
        <line x1="-47" y1="-19.5" x2="47" y2="19.5"/>
        <line x1="-19.5" y1="-47" x2="19.5" y2="47"/>
        <line x1="-47" y1="19.5" x2="47" y2="-19.5"/>
        <line x1="-19.5" y1="47" x2="19.5" y2="-47"/>
      </g>
      <rect x="-3" y="-42" width="6" height="13" rx="2" fill="#ff8a3d"/>
      <rect x="-3" y="29" width="6" height="13" rx="2" fill="#ff8a3d"/>
      <circle r="5" fill="#6b7480"/>
    </g>
  </defs>

  <!-- 天空 / 太阳 / 云 -->
  <rect width="800" height="300" fill="url(#skyGrad)"/>
  <circle cx="650" cy="90" r="95" fill="url(#sunGlow)"/>
  <g stroke="#ffe27a" stroke-width="4" stroke-linecap="round" opacity=".8">
    <animateTransform attributeName="transform" type="rotate" from="0 650 90" to="360 650 90" dur="40s" repeatCount="indefinite"/>
    <line x1="650" y1="34" x2="650" y2="20"/>
    <line x1="650" y1="146" x2="650" y2="160"/>
    <line x1="594" y1="90" x2="580" y2="90"/>
    <line x1="706" y1="90" x2="720" y2="90"/>
    <line x1="610.4" y1="50.4" x2="600.5" y2="40.5"/>
    <line x1="689.6" y1="129.6" x2="699.5" y2="139.5"/>
    <line x1="610.4" y1="129.6" x2="600.5" y2="139.5"/>
    <line x1="689.6" y1="50.4" x2="699.5" y2="40.5"/>
  </g>
  <circle cx="650" cy="90" r="40" fill="#ffd84d"/>

  <g class="par" data-f="0.02" data-p="800" opacity=".85">
    <g id="cloudsA">
      <use href="#cloud" transform="translate(120 70) scale(1.1)"/>
      <use href="#cloud" transform="translate(520 110) scale(.8)"/>

    <use href="#cloudsA" x="800"/>
  </g>
  <g class="par" data-f="0.04" data-p="800">
    <g id="cloudsB">
      <use href="#cloud" transform="translate(300 150) scale(1.3)"/>
      <use href="#cloud" transform="translate(700 60) scale(.9)"/>
    </g>
    <use href="#cloudsB" x="800"/>
  </g>

  <!-- 远处小岛与灯塔 -->
  <g class="par" data-f="0.05" data-p="800">
    <g id="isles">
      <g transform="translate(648 232)">
        <rect width="8" height="30" fill="#fff"/>
        <rect y="8" width="8" height="6" fill="#e5484d"/>
        <rect y="20" width="8" height="6" fill="#e5484d"/>
        <rect x="-2" y="-6" width="12" height="6" fill="#ffe27a"/>
        <path d="M-3 -6 L4 -13 L11 -6 Z" fill="#e5484d"/>
      </g>
      <path d="M20 292 Q70 252 130 272 Q170 282 215 266 Q275 242 335 292 Z" fill="#7fb7c9"/>
      <path d="M470 292 Q530 256 595 272 Q650 244 715 278 Q735 286 750 292 Z" fill="#8cc0cf"/>

    <use href="#isles" x="800"/>
  </g>

  <!-- 大海 -->
  <rect y="292" width="800" height="110" fill="url(#seaGrad)"/>
  <line x1="0" y1="292.5" x2="800" y2="292.5" stroke="#d6f3ff" stroke-width="1.5" opacity=".7"/>
  <g stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".55">

    <line class="wave" data-f="0.10" data-p="188" x1="-100" y1="324" x2="900" y2="324" stroke-dasharray="26 90 12 60"/>

  </g>

  <!-- 帆船 -->
  <g class="par" data-f="0.08" data-p="800">
    <g id="boat" transform="translate(250 318)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-3;3;-3" dur="4s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="0" y2="-42" stroke="#7a5a3a" stroke-width="2"/>
        <path d="M2 -4 L2 -40 L22 -4 Z" fill="#fff"/>
        <path d="M-2 -6 L-2 -32 L-17 -6 Z" fill="#ffe9c7"/>
        <path d="M-22 0 L22 0 L15 9 L-15 9 Z" fill="#e5484d"/>
      </g>
    </g>
    <use href="#boat" x="800"/>
  </g>

  <!-- 沙滩 -->
  <g class="par" data-f="0.6" data-p="800">
    <g id="sand">
      <path d="M0 380 Q100 368 200 378 T400 378 T600 378 T800 380 L800 402 L0 402 Z" fill="#f4e2b0"/>
      <path d="M0 380 Q100 368 200 378 T400 378 T600 378 T800 380" fill="none" stroke="#fff" stroke-width="3" opacity=".8"/>
      <line x1="330" y1="356" x2="330" y2="394" stroke="#8a6a4a" stroke-width="2.5"/>
      <path d="M304 360 Q330 334 356 360 Z" fill="#ff6b6b"/>
      <path d="M321 360 Q330 334 339 360 Z" fill="#fff"/>
      <rect x="342" y="388" width="26" height="6" rx="2" fill="#4dabf7"/>
    </g>
    <use href="#sand" x="800"/>
  </g>

  <!-- 棕榈树 -->
  <g class="par" data-f="0.8" data-p="800">
    <g id="palms">
      <use href="#palm" transform="translate(130 396) scale(1.15)"/>
      <use href="#palm" transform="translate(585 396) scale(.9)"/>
    </g>
    <use href="#palms" x="800"/>
  </g>
  <!-- 栏杆 -->
  <line class="wave" data-f="1" data-p="80" x1="-100" y1="389" x2="900" y2="389" stroke="#f5f1e8" stroke-width="22" stroke-dasharray="5 75"/>
  <line x1="0" y1="378" x2="800" y2="378" stroke="#f5f1e8" stroke-width="4"/>
  <line x1="0" y1="388" x2="800" y2="388" stroke="#f5f1e8" stroke-width="2.5"/>

  <!-- 公路 -->
  <rect y="400" width="800" height="100" fill="url(#roadGrad)"/>
  <rect y="398" width="800" height="5" fill="#dfe5ea"/>
  <line class="wave" data-f="1" data-p="90" x1="-100" y1="458" x2="900" y2="458" stroke="#ffe27a" stroke-width="5" stroke-dasharray="48 42"/>
  <ellipse id="shadow" cx="400" cy="404" rx="150" ry="7" fill="#1c2230" opacity=".28"/>
  <!-- 远侧腿与踏板（在车架后面） -->
  <line id="crankF" x1="385" y1="345" x2="385" y2="369" stroke="#59616d" stroke-width="5" stroke-linecap="round"/>
  <rect id="pedalF" x="-11" y="-3" width="22" height="6" rx="2" fill="#1f232c"/>
  <polyline id="legF" fill="none" stroke="#c9741a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path id="footF" d="M-9 -2 L13 -5 L18 1 L-8 3 Z" fill="#c9741a"/>

  <!-- 车轮 -->
  <use id="wheelR" href="#wheel" transform="translate(290 340)"/>
  <use id="wheelFr" href="#wheel" transform="translate(510 340)"/>

  <!-- 车篮与鱼 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-7 513 228;7 513 228;-7 513 228" dur="0.6s" repeatCount="indefinite"/>
    <path d="M508 230 C504 216 508 206 511 199 L502 186 L513 191 L524 186 L516 200 C520 208 521 218 519 230 Z" fill="#8ecae6"/>
    <path d="M511 199 L502 186 L513 191 L524 186 L516 200 Z" fill="#5fa8d3"/>
  </g>
  <line x1="478" y1="250" x2="496" y2="242" stroke="#8d96a3" stroke-width="3" stroke-linecap="round"/>
  <path d="M492 226 L534 226 L528 257 L498 257 Z" fill="#c8955a"/>
  <g stroke="#a6713a" stroke-width="1.5" fill="none">
    <path d="M494 236 L532 236 M496 246 L530 246"/>
    <path d="M503 226 L506 257 M513 226 L513 257 M523 226 L520 257"/>
  </g>
  <rect x="490" y="223" width="46" height="5" rx="2.5" fill="#a6713a"/>

  <!-- 车架 -->
  <g fill="none" stroke="#e63946" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M385 345 L290 340 L359 262"/>
    <path d="M385 345 L357 255"/>
    <path d="M359 262 L476 248"/>
    <path d="M385 345 L481 266"/>
    <path d="M474 240 L483 270" stroke-width="8"/>
    <path d="M483 270 Q496 310 510 340" stroke-width="5"/>
  </g>
  <path d="M357 255 L353 241 M474 240 L470 222" fill="none" stroke="#8d96a3" stroke-width="4" stroke-linecap="round"/>
  <path d="M332 238 Q350 230 376 236 Q381 240 372 242 L338 243 Q330 243 332 238 Z" fill="#2b2f3a"/>
  <path d="M470 222 Q462 211 450 214" fill="none" stroke="#2b2f3a" stroke-width="5" stroke-linecap="round"/>

  <!-- 链条与牙盘 -->
  <g stroke="#3d434f" stroke-width="2.2" stroke-dasharray="3 2">
    <line class="wave" data-f="-0.18" data-p="5" x1="290" y1="333" x2="386" y2="330"/>
    <line class="wave" data-f="0.18" data-p="5" x1="290" y1="347" x2="384" y2="360"/>
  </g>
  <circle cx="290" cy="340" r="7" fill="#59616d"/>
  <circle cx="385" cy="345" r="15" fill="#f1f3f5" stroke="#59616d" stroke-width="3.5"/>
  <circle cx="385" cy="345" r="5" fill="#59616d"/>

  <!-- 近侧踏板与腿 -->
  <line id="crankN" x1="385" y1="345" x2="385" y2="321" stroke="#6b7480" stroke-width="5" stroke-linecap="round"/>
  <rect id="pedalN" x="-11" y="-3" width="22" height="6" rx="2" fill="#2b2f3a"/>
  <polyline id="legN" fill="none" stroke="#f28c1e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path id="footN" d="M-9 -2 L13 -5 L18 1 L-8 3 Z" fill="#f28c1e"/>
  <!-- 鹈鹕 -->
  <g id="pelican">
    <path d="M300 190 L256 200 L270 207 L252 214 L270 218 L260 228 L304 222 Z" fill="#e6eaf0"/>
    <ellipse cx="345" cy="193" rx="60" ry="44" transform="rotate(-12 345 193)" fill="url(#bodyGrad)"/>

    <g id="head">
      <path id="scarf2" d="M384 147 Q366 152 348 162 L350 171 Q368 160 384 154 Z" fill="#c92a35"/>
      <path id="scarf1" d="M384 143 Q362 138 340 146 L338 157 Q362 150 384 151 Z" fill="#e63946"/>
      <path d="M384 176 C404 160 384 128 404 108" fill="none" stroke="#fbfbf9" stroke-width="22" stroke-linecap="round"/>
      <path id="pouch" d="M424 106 L522 121 Q480 152 440 138 Q426 130 424 106 Z" fill="url(#pouchGrad)"/>
      <path d="M420 92 L520 114 L522 122 L422 109 Z" fill="url(#beakGrad)"/>
      <path d="M518 113.5 L528 116 Q535 120 529 127 L521 122 Z" fill="#e2571d"/>
      <path d="M432 101 L516 119" stroke="#d9691a" stroke-width="1.2" opacity=".55"/>
      <path d="M394 92 L376 84 L390 98 L374 98 L391 106 Z" fill="#fbfbf9"/>
      <circle cx="408" cy="104" r="19" fill="#fbfbf9"/>
      <ellipse cx="417" cy="99" rx="7.5" ry="6.5" fill="#ffd76a"/>
      <ellipse id="eye" cx="418" cy="99" rx="3.2" ry="3.2" fill="#1f2430"/>
      <circle cx="419.2" cy="97.8" r="1.1" fill="#fff"/>
      <rect x="381" y="141" width="27" height="11" rx="4" fill="#e63946" transform="rotate(-4 394 146)"/>
    </g>

    <!-- 翅膀（握住车把） -->
    <path d="M318 180 C340 160 392 170 422 194 L457 207 Q463 213 457 219 L444 222 C416 230 378 238 346 226 C322 217 306 198 318 180 Z" fill="#e6eaf0"/>
    <path d="M440 204 L457 207 Q464 213 457 219 L442 223 Q448 213 440 204 Z" fill="#3b4252"/>
    <path d="M336 196 Q380 200 428 208 M342 210 Q386 220 436 216" fill="none" stroke="#c5ccd6" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- 前景草丛 -->
  <g class="par" data-f="1.5" data-p="800" fill="#3c9a4e">
    <g id="tufts">
      <path d="M40 500 Q46 470 50 500 Q58 462 62 500 Q70 476 72 500 Z"/>
      <path d="M330 500 Q334 478 338 500 Q346 468 350 500 Q356 482 358 500 Z"/>
      <path d="M610 500 Q616 472 620 500 Q628 464 632 500 Q640 480 642 500 Z"/>
      <circle cx="58" cy="474" r="4" fill="#ffd43b"/>
      <circle cx="628" cy="476" r="4" fill="#ff8fab"/>
    </g>
    <use href="#tufts" x="800"/>
  </g>
</svg>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const SPEED = 300;                                  // 地面速度 px/s
  const WHEEL_R = 60;                                 // 车轮半径
  const GEAR = 1.4;                                   // 车轮转速 / 踏板转速
  const BB = { x: 385, y: 345 }, CRANK = 24;          // 中轴位置与曲柄长度
  const HIP = { x: 362, y: 226 }, L1 = 73, L2 = 73;   // 髋部位置与大腿、小腿长度

  const pars = [...document.querySelectorAll('.par')];
  const dashes = [...document.querySelectorAll('.wave')];
  const pelican = $('pelican'), head = $('head'), pouch = $('pouch'), eye = $('eye');
  const scarf1 = $('scarf1'), scarf2 = $('scarf2'), shadow = $('shadow');
  const wheelR = $('wheelR'), wheelFr = $('wheelFr');
  const near = { crank: $('crankN'), pedal: $('pedalN'), leg: $('legN'), foot: $('footN') };
  const far = { crank: $('crankF'), pedal: $('pedalF'), leg: $('legF'), foot: $('footF') };
  const f = n => n.toFixed(2);

  // 两段腿的逆运动学：脚踩在踏板上，膝盖朝前弯
  function pedalLeg(side, theta, bob) {
    const px = BB.x + CRANK * Math.cos(theta), py = BB.y + CRANK * Math.sin(theta);
    side.crank.setAttribute('x2', f(px));
    side.crank.setAttribute('y2', f(py));
    side.pedal.setAttribute('transform', `translate(${f(px)} ${f(py)})`);
    const fx = px - 2, fy = py - 5, hx = HIP.x, hy = HIP.y + bob;
    const dx = fx - hx, dy = fy - hy;
    const d = Math.min(Math.hypot(dx, dy), L1 + L2 - 0.5);
    const a = Math.acos((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d));
    const ang = Math.atan2(dy, dx) - a;
    const kx = hx + L1 * Math.cos(ang), ky = hy + L1 * Math.sin(ang);
    side.leg.setAttribute('points', `${f(hx)},${f(hy)} ${f(kx)},${f(ky)} ${f(fx)},${f(fy)}`);
    side.foot.setAttribute('transform', `translate(${f(fx)} ${f(fy)}) rotate(${f(Math.sin(theta) * 12)})`);
  }

  function frame(now) {
    const t = now / 1000;
    const dist = t * SPEED;
    const wheelDeg = (dist / WHEEL_R * 180 / Math.PI) % 360;
    const theta = dist / WHEEL_R / GEAR;
    const bob = Math.sin(theta * 2) * 1.6;

    // 视差背景与虚线（路面标线、栏杆、海浪、链条）
    for (const g of pars) g.setAttribute('transform', `translate(${f(-((dist * g.dataset.f) % g.dataset.p))} 0)`);
    for (const l of dashes) l.setAttribute('stroke-dashoffset', f((dist * l.dataset.f) % l.dataset.p));

    wheelR.setAttribute('transform', `translate(290 340) rotate(${f(wheelDeg)})`);
    wheelFr.setAttribute('transform', `translate(510 340) rotate(${f(wheelDeg)})`);

    pedalLeg(far, theta + Math.PI, bob);
    pedalLeg(near, theta, bob);

    // 身体起伏、点头、影子
    pelican.setAttribute('transform', `translate(0 ${f(bob)})`);
    head.setAttribute('transform', `rotate(${f(Math.sin(theta * 2 + 0.6) * 1.8)} 386 170)`);
    shadow.setAttribute('rx', f(150 + bob * 2));

    // 喉囊晃动
    const wx = Math.sin(theta * 2 + 1) * 4, wy = Math.sin(theta * 2) * 5;
    pouch.setAttribute('d', `M424 106 L522 121 Q${f(480 + wx)} ${f(152 + wy)} 440 138 Q426 130 424 106 Z`);

    // 眨眼
    eye.setAttribute('ry', t % 3.8 < 0.14 ? 0.5 : 3.2);

    // 围巾随风飘动
    const a1 = Math.sin(t * 9) * 5, b1 = Math.sin(t * 9 - 1.2) * 7;
    const a2 = Math.sin(t * 9 + 2) * 4, b2 = Math.sin(t * 9 + 0.8) * 6;
    scarf1.setAttribute('d', `M384 143 Q362 ${f(138 + a1)} 340 ${f(146 + b1)} L338 ${f(157 + b1)} Q362 ${f(150 + a1)} 384 151 Z`);
    scarf2.setAttribute('d', `M384 147 Q366 ${f(152 + a2)} 348 ${f(162 + b2)} L350 ${f(171 + b2)} Q368 ${f(160 + a2)} 384 154 Z`);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
