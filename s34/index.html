<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #17222f;
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, sans-serif;
  }
  svg {
    width: min(96vw, 960px); height: auto;
    border-radius: 18px;
    box-shadow: 0 24px 70px rgba(0,0,0,.45);
  }
  /* 车轮旋转 */
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 背景滚动（每组元素宽 800，复制两份实现无缝循环） */
  .clouds { animation: scroll 24s linear infinite; }
  .hills  { animation: scroll 9s  linear infinite; }
  .trees  { animation: scroll 2.6s linear infinite; }
  @keyframes scroll { to { transform: translateX(-800px); } }

  /* 路面虚线 */
  .lane  { animation: dash 1s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -350; } }

  /* 链条流动 */
  .chain { animation: chain .5s linear infinite; }
  @keyframes chain { to { stroke-dashoffset: -16; } }

  /* 骑行颠簸 */
  .rider { animation: bob .55s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }

  /* 头部点动 */
  .head { transform-origin: 350px 205px; animation: nod 1.5s ease-in-out infinite; }
  @keyframes nod { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(4deg); } }

  /* 尾羽摆动 */
  .tail { transform-origin: 252px 232px; animation: wag 1.5s ease-in-out infinite; }
  @keyframes wag { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(6deg); } }
</style>
</head>
<body>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑自行车的动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f0"/>
      <stop offset="1" stop-color="#e6f4fb"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6dbb5a"/>
      <stop offset="1" stop-color="#4d9a44"/>
    </linearGradient>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="38" ry="18" fill="#fff"/>
      <ellipse cx="-28" cy="6" rx="24" ry="14" fill="#fff"/>
      <ellipse cx="30" cy="6" rx="26" ry="14" fill="#fff"/>
      <ellipse cx="5" cy="-12" rx="22" ry="14" fill="#fff"/>
    </g>
    <g id="hillset">
      <path d="M0 340 C 120 260, 220 280, 320 330 C 420 380, 520 250, 640 300 C 720 335, 760 320, 800 340 L800 420 L0 420 Z" fill="#8fcf8a"/>
      <path d="M0 380 C 150 330, 260 350, 400 375 C 540 400, 660 330, 800 380 L800 420 L0 420 Z" fill="#79c070"/>
    </g>
    <g id="tree">
      <rect x="-4" y="-10" width="8" height="30" fill="#7a4f2b"/>
      <polygon points="0,-70 -26,-10 26,-10" fill="#2f7d46"/>
      <polygon points="0,-50 -20,-2 20,-2" fill="#3a9456"/>
    </g>
    <g id="treeset">
      <use href="#tree" x="60"  y="410"/>
      <use href="#tree" x="210" y="412" transform="scale(1)" />
      <use href="#tree" x="400" y="410"/>
      <use href="#tree" x="560" y="413"/>
      <use href="#tree" x="700" y="410"/>
    </g>
    <g id="wheel">
      <circle r="60" fill="none" stroke="#2b2b2b" stroke-width="10"/>
      <circle r="54" fill="none" stroke="#cfd4da" stroke-width="3"/>
      <g class="spin" stroke="#b9c0c8" stroke-width="2">
        <line x1="0" y1="-54" x2="0" y2="54"/>
        <line x1="-54" y1="0" x2="54" y2="0"/>
        <line x1="-38" y1="-38" x2="38" y2="38"/>
        <line x1="-38" y1="38" x2="38" y2="-38"/>
        <line x1="-52" y1="-14" x2="52" y2="14"/>
        <line x1="-52" y1="14" x2="52" y2="-14"/>
        <line x1="-14" y1="-52" x2="14" y2="52"/>
        <line x1="-14" y1="52" x2="14" y2="-52"/>
        <circle r="6" fill="#555" stroke="none"/>
        <circle r="3" fill="#f2c14e" stroke="none" cx="0" cy="-46"/>
      </g>
    </g>
  </defs>

  <!-- 天空与太阳 -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="90" r="42" fill="#ffd764"/>
  <circle cx="680" cy="90" r="56" fill="#ffd764" opacity=".25"/>

  <!-- 云 -->
  <g class="clouds" opacity=".9">
    <use href="#cloud" x="120" y="110"/>
    <use href="#cloud" x="420" y="70" transform="scale(1)"/>
    <use href="#cloud" x="920" y="110"/>
    <use href="#cloud" x="1220" y="70"/>
  </g>

  <!-- 远山 -->
  <g class="hills">
    <use href="#hillset" x="0"/>
    <use href="#hillset" x="800"/>
  </g>

  <!-- 树 -->
  <g class="trees">
    <use href="#treeset" x="0"/>
    <use href="#treeset" x="800"/>
  </g>

  <!-- 路面 -->
  <rect x="0" y="420" width="800" height="50" fill="#5a5f66"/>
  <line class="lane" x1="0" y1="446" x2="800" y2="446" stroke="#f4e6a0" stroke-width="5" stroke-dasharray="40 30"/>
  <rect x="0" y="470" width="800" height="30" fill="url(#grass)"/>

  <!-- 阴影 -->
  <ellipse cx="350" cy="424" rx="210" ry="9" fill="#000" opacity=".22"/>

  <g class="rider">
    <!-- 远侧腿（在车架后） -->
    <path id="legFar" d="" fill="none" stroke="#d9862f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon id="footFar" points="-9,-2 14,-5 24,1 14,5 -9,5" fill="#d9862f"/>
    <line id="crankFar" x1="330" y1="350" x2="330" y2="350" stroke="#3a3f45" stroke-width="6" stroke-linecap="round"/>
    <rect id="pedalFar" x="0" y="0" width="24" height="6" rx="2" fill="#3a3f45"/>

    <!-- 车轮 -->
    <use href="#wheel" x="220" y="360"/>
    <use href="#wheel" x="480" y="360"/>

    <!-- 链条 -->
    <g class="chain" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="6 2">
      <circle cx="330" cy="350" r="30"/>
      <circle cx="220" cy="360" r="12"/>
      <line x1="330" y1="320" x2="220" y2="348"/>
      <line x1="330" y1="380" x2="220" y2="372"/>
    </g>

    <!-- 车架 -->
    <g fill="none" stroke="#d63b3b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <line x1="330" y1="350" x2="290" y2="262"/>   <!-- 座管 -->
      <line x1="330" y1="350" x2="455" y2="278"/>   <!-- 下管 -->
      <line x1="290" y1="262" x2="452" y2="268"/>   <!-- 上管 -->
      <line x1="330" y1="350" x2="220" y2="360"/>   <!-- 后下叉 -->
      <line x1="290" y1="262" x2="220" y2="360"/>   <!-- 后上叉 -->
      <line x1="455" y1="278" x2="480" y2="360"/>   <!-- 前叉 -->
      <line x1="455" y1="278" x2="447" y2="244"/>   <!-- 车头管 -->
    </g>
    <!-- 车把 -->
    <path d="M447 244 C 440 236, 428 236, 424 246" fill="none" stroke="#2b2b2b" stroke-width="7" stroke-linecap="round"/>
    <circle cx="424" cy="248" r="6" fill="#222"/>
    <!-- 车座 -->
    <path d="M268 258 Q 292 248 318 260 Q 292 270 268 258 Z" fill="#2b2b2b"/>
    <!-- 曲柄中轴 -->
    <circle cx="330" cy="350" r="8" fill="#3a3f45"/>

    <!-- 鹈鹕 -->
    <g class="tail">
      <polygon points="262,212 212,222 256,236 208,246 262,254" fill="#e4e0d7"/>
    </g>
    <!-- 身体 -->
    <ellipse cx="300" cy="222" rx="60" ry="40" fill="#f7f4ee" transform="rotate(-8 300 222)"/>
    <ellipse cx="300" cy="236" rx="46" ry="22" fill="#ece8e0" transform="rotate(-8 300 236)"/>
    <!-- 折叠的远侧翅膀 -->
    <path d="M276 200 Q 330 178 366 218 Q 330 246 274 234 Z" fill="#e6e2da" stroke="#d5d0c6" stroke-width="2"/>

    <!-- 颈部与头部 -->
    <g class="head">
      <path d="M338 212 C 372 205, 384 192, 384 160" fill="none" stroke="#f7f4ee" stroke-width="26" stroke-linecap="round"/>
      <circle cx="390" cy="152" r="25" fill="#f7f4ee"/>
      <!-- 头顶羽毛 -->
      <path d="M372 132 q -6 -14 4 -18 q -2 10 6 12 Z" fill="#e4e0d7"/>
      <!-- 喙 -->
      <path d="M406 144 L 512 158 L 410 160 Z" fill="#f2a33a"/>
      <path d="M410 158 Q 456 192 512 158 L 410 165 Z" fill="#e68b3f"/>
      <line x1="410" y1="159" x2="506" y2="158" stroke="#c96f2b" stroke-width="1.5"/>
      <!-- 眼睛 -->
      <circle cx="398" cy="142" r="5" fill="#222"/>
      <circle cx="399.5" cy="140.5" r="1.6" fill="#fff"/>
    </g>

    <!-- 近侧翅膀，伸向车把 -->
    <path d="M320 214 Q 380 200 424 246" fill="none" stroke="#f7f4ee" stroke-width="20" stroke-linecap="round"/>
    <path d="M320 214 Q 380 200 424 246" fill="none" stroke="#d5d0c6" stroke-width="2" stroke-dasharray="0 14 40 200" opacity=".6"/>
    <circle cx="424" cy="246" r="9" fill="#f7f4ee"/>

    <!-- 近侧曲柄、脚踏、腿 -->
    <line id="crankNear" x1="330" y1="350" x2="330" y2="350" stroke="#4b5158" stroke-width="6" stroke-linecap="round"/>
    <path id="legNear" d="" fill="none" stroke="#f2a33a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect id="pedalNear" x="0" y="0" width="24" height="6" rx="2" fill="#4b5158"/>
    <polygon id="footNear" points="-9,-2 14,-5 24,1 14,5 -9,5" fill="#f2a33a"/>
  </g>
</svg>

<script>
  // 双骨骼反向运动学：髋关节固定，脚随脚踏转动，膝盖始终朝前
  const HIP = { x: 298, y: 252 };
  const CRANK = { x: 330, y: 350 };
  const CRANK_LEN = 28;
  const THIGH = 66, SHIN = 66;
  const PERIOD = 1500; // 脚踏转一圈的毫秒数

  const $ = id => document.getElementById(id);
  const legNear = $('legNear'), legFar = $('legFar');
  const crankNear = $('crankNear'), crankFar = $('crankFar');
  const pedalNear = $('pedalNear'), pedalFar = $('pedalFar');
  const footNear = $('footNear'), footFar = $('footFar');

  function knee(target) {
    const dx = target.x - HIP.x, dy = target.y - HIP.y;
    let d = Math.hypot(dx, dy);
    d = Math.max(1, Math.min(d, THIGH + SHIN - 0.5));
    const base = Math.atan2(dy, dx);
    const cosA = Math.max(-1, Math.min(1, (THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d)));
    const A = Math.acos(cosA);
    const k1 = { x: HIP.x + THIGH * Math.cos(base - A), y: HIP.y + THIGH * Math.sin(base - A) };
    const k2 = { x: HIP.x + THIGH * Math.cos(base + A), y: HIP.y + THIGH * Math.sin(base + A) };
    return k1.x > k2.x ? k1 : k2;
  }

  function place(angle, leg, crank, pedal, foot) {
    const p = { x: CRANK.x + CRANK_LEN * Math.cos(angle), y: CRANK.y + CRANK_LEN * Math.sin(angle) };
    const k = knee(p);
    leg.setAttribute('d', `M${HIP.x} ${HIP.y} L${k.x.toFixed(1)} ${k.y.toFixed(1)} L${p.x.toFixed(1)} ${p.y.toFixed(1)}`);
    crank.setAttribute('x2', p.x); crank.setAttribute('y2', p.y);
    pedal.setAttribute('x', p.x - 12); pedal.setAttribute('y', p.y - 3);
    foot.setAttribute('transform', `translate(${p.x.toFixed(1)} ${(p.y - 4).toFixed(1)})`);
  }

  function frame(t) {
    const angle = (t / PERIOD) * Math.PI * 2; // 顺时针（画面向右前进）
    place(angle, legNear, crankNear, pedalNear, footNear);
    place(angle + Math.PI, legFar, crankFar, pedalFar, footFar);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
