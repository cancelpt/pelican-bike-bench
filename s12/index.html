<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>鹈鹕骑自行车</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17324d;
        --sky: #b9e8f3;
        --water: #64c6d1;
        --sun: #ffd064;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #d8f4f6;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .stage {
        position: relative;
        width: min(100vw, 1400px);
        height: min(100vh, 820px);
        min-height: 560px;
        overflow: hidden;
        background: var(--sky);
        isolation: isolate;
      }

      svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .motion { transform-box: fill-box; transform-origin: center; }
      .cloud-drift { animation: drift 24s linear infinite; }
      .cloud-drift.slow { animation-duration: 34s; animation-delay: -11s; }
      .bird-bob { animation: bob 1.05s ease-in-out infinite; }
      .wheel-spin { animation: spin 0.72s linear infinite; transform-origin: center; }
      .pedal-spin { animation: spin 0.72s linear infinite reverse; transform-origin: 50% 50%; }
      .leg-left { animation: leg-left 0.72s ease-in-out infinite; transform-origin: 50% 5%; }
      .leg-right { animation: leg-right 0.72s ease-in-out infinite; transform-origin: 50% 5%; }
      .tail-sway { animation: tail 1.05s ease-in-out infinite; transform-origin: 90% 55%; }
      .feather-flick { animation: feather 1.05s ease-in-out infinite; transform-origin: 50% 60%; }
      .road-flow { animation: road 1.4s linear infinite; }

      .paused * { animation-play-state: paused !important; }

      .controls {
        position: absolute;
        right: 22px;
        bottom: 20px;
        z-index: 5;
        display: flex;
        gap: 8px;
      }

      .control {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        padding: 0;
        border: 1px solid rgba(23, 50, 77, .2);
        border-radius: 50%;
        color: var(--ink);
        background: rgba(255, 255, 255, .68);
        box-shadow: 0 6px 18px rgba(43, 101, 113, .14);
        cursor: pointer;
        transition: transform .2s ease, background .2s ease;
      }

      .control:hover { transform: translateY(-2px); background: #fff; }
      .control:focus-visible { outline: 3px solid rgba(255, 208, 100, .9); outline-offset: 3px; }
      .control svg { width: 20px; height: 20px; }

      @keyframes drift { from { transform: translateX(-180px); } to { transform: translateX(1480px); } }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes leg-left { 0%, 100% { transform: rotate(24deg); } 50% { transform: rotate(-27deg); } }
      @keyframes leg-right { 0%, 100% { transform: rotate(-27deg); } 50% { transform: rotate(24deg); } }
      @keyframes tail { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(6deg); } }
      @keyframes feather { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-4deg); } }
      @keyframes road { from { transform: translateX(0); } to { transform: translateX(-180px); } }

      @media (max-width: 700px) {
        .stage { min-height: 460px; }
        .controls { right: 14px; bottom: 14px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .motion { animation-play-state: paused !important; }
      }
    </style>
  </head>
  <body>
    <main class="stage" id="stage" aria-label="鹈鹕骑自行车的 SVG 动画">
      <svg viewBox="0 0 1400 820" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
        <title id="title">鹈鹕骑自行车</title>
        <desc id="desc">一只戴着黄色头盔的鹈鹕在海边骑着红色自行车，车轮和双腿持续运动。</desc>

        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#9cdeef" />
            <stop offset="1" stop-color="#d8f4f1" />
          </linearGradient>
          <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#55becb" />
            <stop offset="1" stop-color="#2e9fae" />
          </linearGradient>
          <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#41566a" />
            <stop offset="1" stop-color="#263849" />
          </linearGradient>
          <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
            <feGaussianBlur stdDeviation="10" />
          </filter>
          <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" />
          </filter>
          <clipPath id="roadClip"><rect x="0" y="596" width="1400" height="224" /></clipPath>
        </defs>

        <rect width="1400" height="820" fill="url(#sky)" />
        <circle cx="1120" cy="150" r="72" fill="#ffe08a" opacity=".95" />
        <circle cx="1120" cy="150" r="104" fill="#ffe08a" opacity=".18" filter="url(#soft)" />

        <g class="cloud-drift motion" fill="#f9ffff" opacity=".78">
          <path d="M-40 190c28-42 87-36 106-2 36-28 98-2 91 38H-40z" />
          <path d="M820 98c21-36 71-32 89-3 29-23 77-1 72 33H820z" />
        </g>
        <g class="cloud-drift slow motion" fill="#f9ffff" opacity=".6">
          <path d="M300 146c22-34 67-29 82-3 29-22 77-1 71 34H300z" />
        </g>

        <path d="M0 405c150-75 270-70 426-10 129 50 266 42 385-10 162-71 347-37 589 74v168H0z" fill="#8ad2ca" />
        <path d="M0 447c147-71 278-36 409 13 130 49 258 40 394-19 184-80 385-20 597 86v119H0z" fill="#63bbb9" opacity=".9" />
        <path d="M0 514c178-34 281-2 413 28 150 35 273 24 427-41 187-79 351-51 560 26v130H0z" fill="url(#sea)" />
        <path d="M0 563c167-39 290-8 423 22 164 36 301 20 448-36 191-72 347-42 529 8v75H0z" fill="#3aaab8" opacity=".76" />
        <g fill="none" stroke="#a9e8e7" stroke-width="5" stroke-linecap="round" opacity=".5">
          <path d="M105 492h95M475 531h124M1010 514h146M1210 551h112" />
          <path d="M238 573h72M736 578h132M930 580h78" />
        </g>

        <path d="M0 596h1400v224H0z" fill="url(#road)" />
        <path d="M0 596h1400v17H0z" fill="#d9e0d4" opacity=".8" />
        <g clip-path="url(#roadClip)" opacity=".22" fill="#1b2837">
          <path d="M0 700l125-29 28 0-123 34zM312 654l128-29 29 0-126 34zM785 710l136-34 30 0-136 39zM1190 645l125-29 28 0-125 34z" />
        </g>
        <g class="road-flow motion" fill="#f4d57e">
          <rect x="20" y="701" width="118" height="11" rx="5" />
          <rect x="258" y="701" width="118" height="11" rx="5" />
          <rect x="496" y="701" width="118" height="11" rx="5" />
          <rect x="734" y="701" width="118" height="11" rx="5" />
          <rect x="972" y="701" width="118" height="11" rx="5" />
          <rect x="1210" y="701" width="118" height="11" rx="5" />
        </g>

        <ellipse cx="710" cy="693" rx="265" ry="27" fill="#112b3b" opacity=".26" filter="url(#shadow)" />

        <g class="bird-bob motion" transform="translate(0 -5)">
          <g transform="translate(505 302)">
            <path class="tail-sway motion" d="M38 148c-57 21-95 22-137 1 33-18 78-45 124-79z" fill="#7c4d3a" stroke="#5b3a31" stroke-width="7" stroke-linejoin="round" />
            <path d="M75 53c25-28 76-42 121-22 40 18 61 60 47 102-15 45-70 72-123 54-52-18-74-87-45-134z" fill="#efe8d9" stroke="#5b3a31" stroke-width="8" />
            <path d="M99 76c21-20 54-31 86-20 29 10 51 41 46 71-6 41-57 61-97 43-39-18-59-62-35-94z" fill="#fbf8ed" />
            <path d="M91 47c4-45 38-68 84-64 34 3 60 26 67 59-27 8-51 22-76 32-21 8-46 5-75-27z" fill="#f7f0df" stroke="#5b3a31" stroke-width="8" />
            <path d="M94 -9c18-35 61-48 99-25 18 10 33 26 40 49l-30 10-13-22-27 34-25-26-22 27z" fill="#e8b84f" stroke="#5b3a31" stroke-width="7" stroke-linejoin="round" />
            <circle cx="167" cy="31" r="8" fill="#17324d" />
            <circle cx="170" cy="28" r="2.5" fill="#fff" />
            <path d="M187 57c30 0 92 4 133 26-41 29-96 38-139 20-25-11-34-30 6-46z" fill="#e88456" stroke="#5b3a31" stroke-width="8" stroke-linejoin="round" />
            <path d="M300 82c-24 13-55 19-82 19" fill="none" stroke="#bb5f45" stroke-width="5" stroke-linecap="round" />
            <path d="M107 132c-24 25-29 67-7 94 34 42 100 39 136 2 22-24 31-66 15-96-38 28-95 28-144 0z" fill="#f2ead9" stroke="#5b3a31" stroke-width="8" />
            <path class="feather-flick motion" d="M119 153c-18 18-22 49-10 69M145 146c-10 27-11 54 2 75M172 147c-5 25 1 49 13 67" fill="none" stroke="#d9ccb6" stroke-width="6" stroke-linecap="round" />
            <path d="M129 222c11 28 31 41 62 42" fill="none" stroke="#d2c4ac" stroke-width="5" stroke-linecap="round" />

            <g transform="translate(126 205)">
              <path d="M47 18c-1 27-8 53-19 75" fill="none" stroke="#d06d49" stroke-width="12" stroke-linecap="round" />
              <path class="leg-left motion" d="M28 87l49 31" fill="none" stroke="#e88456" stroke-width="12" stroke-linecap="round" />
              <path class="leg-right motion" d="M31 87l-39 40" fill="none" stroke="#e88456" stroke-width="12" stroke-linecap="round" />
              <ellipse cx="80" cy="119" rx="20" ry="8" fill="#e88456" stroke="#5b3a31" stroke-width="5" />
              <ellipse cx="-10" cy="129" rx="20" ry="8" fill="#e88456" stroke="#5b3a31" stroke-width="5" />
            </g>
          </g>

          <g transform="translate(550 518)">
            <path d="M0 0L202 0L274 120" fill="none" stroke="#d84f4d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M202 0L274 120L0 0" fill="none" stroke="#d84f4d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M90 0h113" fill="none" stroke="#d84f4d" stroke-width="9" stroke-linecap="round" />
            <path d="M-3 0l-29-42" fill="none" stroke="#d84f4d" stroke-width="8" stroke-linecap="round" />
            <path d="M-30-42h33" fill="none" stroke="#17324d" stroke-width="8" stroke-linecap="round" />
            <path d="M202 0l11-47" fill="none" stroke="#17324d" stroke-width="8" stroke-linecap="round" />
            <path d="M204-47h38" fill="none" stroke="#17324d" stroke-width="8" stroke-linecap="round" />
            <path d="M90 0l35 4" fill="none" stroke="#17324d" stroke-width="7" stroke-linecap="round" />
            <circle cx="0" cy="0" r="66" fill="#283d4d" stroke="#f4d57e" stroke-width="8" />
            <circle cx="274" cy="120" r="66" fill="#283d4d" stroke="#f4d57e" stroke-width="8" />
            <g class="wheel-spin motion" fill="none" stroke="#9db5bb" stroke-width="3" opacity=".75">
              <circle cx="0" cy="0" r="53" /><path d="M0-53V53M-53 0H53M-37-37L37 37M37-37L-37 37" />
            </g>
            <g class="wheel-spin motion" fill="none" stroke="#9db5bb" stroke-width="3" opacity=".75">
              <circle cx="274" cy="120" r="53" /><path d="M274 67v106M221 120h106M237 83l74 74M311 83l-74 74" />
            </g>
            <g class="pedal-spin motion" transform="translate(90 0)">
              <circle r="17" fill="#d84f4d" stroke="#17324d" stroke-width="5" />
              <path d="M0 0l40-25M0 0l-36 24" stroke="#17324d" stroke-width="6" stroke-linecap="round" />
              <rect x="38" y="-31" width="23" height="9" rx="4" fill="#f4d57e" />
              <rect x="-57" y="20" width="23" height="9" rx="4" fill="#f4d57e" />
            </g>
            <path d="M104-2L154-42" fill="none" stroke="#d84f4d" stroke-width="8" stroke-linecap="round" />
          </g>
        </g>

        <g transform="translate(94 655)" opacity=".75">
          <path d="M0 67c25-48 46-69 46-69s21 21 46 69z" fill="#286d69" />
          <path d="M42 67c20-53 49-80 49-80s22 27 36 80z" fill="#348a78" />
          <path d="M29 67c6-28 12-51 17-69M74 67c5-34 11-61 17-79" stroke="#214f55" stroke-width="5" />
        </g>
        <g transform="translate(1210 648) scale(.8)" opacity=".62">
          <path d="M0 79c22-54 46-81 46-81s23 27 48 81z" fill="#286d69" />
          <path d="M49 79c21-61 51-90 51-90s22 29 35 90z" fill="#348a78" />
          <path d="M30 79c7-38 12-63 16-81M77 79c5-37 12-68 18-90" stroke="#214f55" stroke-width="5" />
        </g>
      </svg>

      <div class="controls">
        <button class="control" id="toggle" type="button" aria-label="暂停动画" title="暂停动画">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12M16 6v12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" /></svg>
        </button>
      </div>
    </main>

    <script>
      const stage = document.querySelector('#stage');
      const toggle = document.querySelector('#toggle');
      const playIcon = '<path d="M9 6.5v11l8-5.5z" fill="currentColor" />';
      const pauseIcon = '<path d="M8 6v12M16 6v12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />';

      toggle.addEventListener('click', () => {
        const paused = stage.classList.toggle('paused');
        toggle.setAttribute('aria-label', paused ? '继续动画' : '暂停动画');
        toggle.setAttribute('title', paused ? '继续动画' : '暂停动画');
        toggle.querySelector('svg').innerHTML = paused ? playIcon : pauseIcon;
      });
    </script>
  </body>
</html>
