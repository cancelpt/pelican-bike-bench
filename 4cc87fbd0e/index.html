<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕骑自行车 · SVG 2D 动画</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17324d;
      --muted: #5f7384;
      --paper: #f7f3ea;
      --line: rgba(23, 50, 77, 0.15);
      --coral: #ef705e;
      --teal: #2e9a9a;
      --yellow: #f2c64e;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    .scene-shell {
      position: relative;
      width: min(100vw, 1500px);
      height: min(100vh, 900px);
      min-height: 520px;
      overflow: hidden;
      isolation: isolate;
      background: #d9f1f0;
    }

    .scene-shell::before,
    .scene-shell::after {
      content: "";
      position: absolute;
      z-index: 4;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.62);
    }

    .scene-shell::before {
      inset: 18px;
      border-radius: 12px;
    }

    .scene-shell::after {
      inset: 25px;
      border-radius: 8px;
      border-color: rgba(23, 50, 77, 0.08);
    }

    .scene {
      display: block;
      width: 100%;
      height: 100%;
    }

    .title-lockup {
      position: absolute;
      z-index: 5;
      top: clamp(40px, 8vh, 82px);
      left: clamp(42px, 7vw, 112px);
      pointer-events: none;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 10px;
      color: var(--coral);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.18em;
    }

    .eyebrow::before {
      content: "";
      width: 28px;
      height: 3px;
      border-radius: 2px;
      background: var(--coral);
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(30px, 4.6vw, 68px);
      font-weight: 900;
      letter-spacing: 0.02em;
      line-height: 0.98;
    }

    .subtitle {
      margin: 13px 0 0;
      color: var(--muted);
      font-size: clamp(12px, 1.25vw, 17px);
      letter-spacing: 0.08em;
    }

    .badge {
      position: absolute;
      z-index: 5;
      top: clamp(40px, 8vh, 82px);
      right: clamp(42px, 7vw, 112px);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border: 1px solid rgba(23, 50, 77, 0.12);
      border-radius: 7px;
      background: rgba(247, 243, 234, 0.7);
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.1em;
      backdrop-filter: blur(8px);
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 4px rgba(46, 154, 154, 0.15);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .caption {
      position: absolute;
      z-index: 5;
      bottom: clamp(34px, 7vh, 70px);
      left: clamp(42px, 7vw, 112px);
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(23, 50, 77, 0.65);
      font-size: 12px;
      letter-spacing: 0.12em;
    }

    .caption-line {
      width: 38px;
      height: 1px;
      background: rgba(23, 50, 77, 0.4);
    }

    .scene.is-paused * {
      animation-play-state: paused !important;
    }

    .scene-action {
      position: absolute;
      right: clamp(42px, 7vw, 112px);
      bottom: clamp(30px, 6vh, 62px);
      z-index: 6;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(23, 50, 77, 0.18);
      border-radius: 50%;
      background: rgba(247, 243, 234, 0.78);
      color: var(--ink);
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease;
      backdrop-filter: blur(8px);
    }

    .scene-action:hover { transform: translateY(-2px); background: #fffaf0; }
    .scene-action:focus-visible { outline: 3px solid rgba(239, 112, 94, 0.4); outline-offset: 3px; }
    .scene-action svg { width: 18px; height: 18px; fill: currentColor; }
    .scene-action .pause-icon { display: block; }
    .scene-action .play-icon { display: none; }
    .scene.is-paused ~ .scene-action .pause-icon { display: none; }
    .scene.is-paused ~ .scene-action .play-icon { display: block; }

    .sky-speckle { opacity: 0.23; }

    .cloud {
      animation: drift 25s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .cloud.slow { animation-duration: 38s; animation-delay: -15s; }
    .cloud.fast { animation-duration: 22s; animation-delay: -8s; }

    .sea-line { animation: sea-shimmer 4s ease-in-out infinite; }
    .sea-line.delay-1 { animation-delay: -1.4s; }
    .sea-line.delay-2 { animation-delay: -2.8s; }

    .road-dash { animation: road-flow 1.3s linear infinite; }
    .road-dash.delay-1 { animation-delay: -0.44s; }
    .road-dash.delay-2 { animation-delay: -0.88s; }

    .bike-rider {
      animation: rider-bob 0.65s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center bottom;
    }

    .wheel {
      transform-box: fill-box;
      transform-origin: center;
      animation: wheel-spin 1.1s linear infinite;
    }

    .pedal-crank {
      transform-box: fill-box;
      transform-origin: center;
      animation: wheel-spin 1.1s linear infinite;
    }

    .leg-front {
      transform-box: fill-box;
      transform-origin: 50% 0%;
      animation: leg-front 1.1s ease-in-out infinite;
    }

    .leg-back {
      transform-box: fill-box;
      transform-origin: 50% 0%;
      animation: leg-back 1.1s ease-in-out infinite;
    }

    .wing {
      transform-box: fill-box;
      transform-origin: 78% 28%;
      animation: wing-flutter 1.6s ease-in-out infinite;
    }

    .neck-feather { animation: feather-sway 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
    .neck-feather.f2 { animation-delay: -0.2s; }
    .neck-feather.f3 { animation-delay: -0.4s; }
    .neck-feather.f4 { animation-delay: -0.6s; }

    @keyframes drift {
      0% { transform: translateX(-150px); }
      100% { transform: translateX(1350px); }
    }

    @keyframes sea-shimmer {
      0%, 100% { opacity: 0.35; transform: translateX(0); }
      50% { opacity: 0.72; transform: translateX(14px); }
    }

    @keyframes road-flow { to { transform: translateX(-140px); } }

    @keyframes rider-bob {
      0%, 100% { transform: translateY(0) rotate(-0.5deg); }
      50% { transform: translateY(-5px) rotate(0.5deg); }
    }

    @keyframes wheel-spin { to { transform: rotate(360deg); } }

    @keyframes leg-front {
      0%, 100% { transform: rotate(25deg); }
      50% { transform: rotate(-30deg); }
    }

    @keyframes leg-back {
      0%, 100% { transform: rotate(-28deg); }
      50% { transform: rotate(28deg); }
    }

    @keyframes wing-flutter {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-5deg) translateY(-2px); }
    }

    @keyframes feather-sway {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(3deg); }
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(46, 154, 154, 0.14); }
      50% { box-shadow: 0 0 0 6px rgba(46, 154, 154, 0.03); }
    }

    @media (max-width: 680px) {
      .scene-shell { min-height: 100svh; }
      .title-lockup { top: 45px; left: 34px; }
      .badge { top: auto; right: 34px; bottom: 36px; padding: 9px 11px; font-size: 10px; }
      .caption { left: 34px; bottom: 84px; font-size: 10px; }
      .scene-action { right: 34px; bottom: 80px; }
      .scene-shell::before { inset: 12px; }
      .scene-shell::after { inset: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>

    <div class="title-lockup">
      <p class="eyebrow">COASTAL RIDE</p>
      <h1>鹈鹕骑行日</h1>
      <p class="subtitle">沿着海风，慢慢把春天骑醒</p>
    </div>

    <div class="badge" aria-label="动画正在播放">
      <span class="badge-dot" aria-hidden="true"></span>
      <span>LIVE LOOP</span>
    </div>

    <div class="caption" aria-hidden="true">
      <span class="caption-line"></span>
      <span>SEA BREEZE / 02:14 PM</span>
    </div>

    <button class="scene-action" type="button" aria-label="暂停动画" title="暂停 / 播放">
      <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>
      <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg>
    </button>
  </main>

  <script>
    const scene = document.querySelector('.scene');
    const action = document.querySelector('.scene-action');

    action.addEventListener('click', () => {
      const paused = scene.classList.toggle('is-paused');
      action.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
    });
  </script>
</body>
</html>
