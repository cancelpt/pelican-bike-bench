  const tau = 2 * Math.PI, degrees = 180 / Math.PI;
  const cadence = tau / 2.64, gearRatio = 25 / 16, rollingRadius = 86 * 1.05;
  const crank = { x: 294, y: 416, r: 30 };
  const seat = { x: 242, y: 276 };
  const upper = 86, lower = 105;
  const n = Object.fromEntries([
    'back-spin','front-spin','far-crank','near-crank','gear','pelican','steering-wing',
    'scarf-low','scarf-high','pannier','eye-open','gulls','sail','ripples',
    'clouds','hills','islands','shores','banks','road','verge'
  ].map(id => [id,get(id)]));
  const leg = (side,x,y) => ({
    x, y, thigh:get(side+'-thigh'), shank:get(side+'-shank'), step:get(side+'-step')
  });
  const far = leg('far',241,258), near = leg('near',264,261);
  const f = value => value.toFixed(3);
  const set = (node, transform) => node.setAttribute('transform',transform);
  const turn = (node,angle,x,y) => set(node,'rotate('+f(angle)+(x === undefined?'':' '+x+' '+y)+')');
  const move = (node,x,y) => set(node,'translate('+f(x)+' '+f(y)+')');
  const scroll = (node,distance,period=1200) => move(node,-(distance%period),0);
  function segment(node,x,y,toX,toY) {
    const angle = Math.atan2(toY-y,toX-x)*degrees-90;
    set(node,'translate('+f(x)+' '+f(y)+') rotate('+f(angle)+')');
  }
  function pedalLeg(part,angle,rock,lift) {
    // Rotate the hip with the body; solve the bird's backwards-folding hock
    // using the pedal as the fixed target. The platform always stays level.
    const cx=Math.cos(rock), sx=Math.sin(rock), ox=part.x-seat.x, oy=part.y-seat.y;
    const hx=seat.x+ox*cx-oy*sx, hy=seat.y+ox*sx+oy*cx+lift;
    const px=crank.x+crank.r*Math.cos(angle), py=crank.y+crank.r*Math.sin(angle);
    const ax=px-8, ay=py-8, dx=ax-hx, dy=ay-hy, d=Math.hypot(dx,dy);
    const along=(upper*upper-lower*lower+d*d)/(2*d);
    const across=Math.sqrt(Math.max(0,upper*upper-along*along));
    const kx=hx+(along*dx-across*dy)/d, ky=hy+(along*dy+across*dx)/d;
    segment(part.thigh,hx,hy,kx,ky);
    segment(part.shank,kx,ky,ax,ay);
    move(part.step,px,py);
  }
  function draw(t) {
    const angle=.54+t*cadence, phase=angle%tau, a=phase*degrees;
    const rolling=t*cadence*gearRatio, travel=rolling*rollingRadius;
    const wheel=(rolling%tau)*degrees;
    turn(n['back-spin'],wheel); turn(n['front-spin'],wheel+13);
    turn(n['near-crank'],a); turn(n['far-crank'],a+180); turn(n.gear,a);

    const nod=.82*Math.sin(phase-.54), rock=nod/degrees;
    const lift=-.75*(1-Math.cos(2*phase-.6));
    set(n.pelican,'translate(0 '+f(lift)+') rotate('+f(nod)+' '+seat.x+' '+seat.y+')');
    pedalLeg(near,phase,rock,lift);
    pedalLeg(far,phase+Math.PI,rock,lift);
    turn(n['steering-wing'],nod*.44+.23*Math.sin(phase*2),405,231);
    turn(n.pannier,.48*Math.sin(phase*2-.8),114,309);
    turn(n['scarf-high'],2.45*Math.sin(t*4+.25)+1.05*Math.sin(t*6.7),278,142);
    turn(n['scarf-low'],2*Math.sin(t*4-.95)+.85*Math.sin(t*5.9),278,145);
    const blink=(t+2.3)%7.2;
    const opening=blink<.23?1-.94*Math.pow(Math.sin(Math.PI*blink/.23),2):1;
    set(n['eye-open'],'scale(1 '+f(opening)+')');

    // The contact patch travels one circumference per wheel revolution.
    // The remote layers cover smaller distances at the same camera speed.
    scroll(n.road,travel); scroll(n.verge,travel*1.12);
    scroll(n.banks,travel*.27); scroll(n.shores,travel*.103);
    scroll(n.islands,travel*.012); scroll(n.hills,travel*.0034);
    scroll(n.clouds,travel*.007); scroll(n.ripples,travel*.057,277);
    move(n.gulls,-21*Math.sin(t*.073),2.5*Math.sin(t*.42));
    set(n.sail,'translate('+f(-19*Math.sin(t*.055))+' '+f(1.1*Math.sin(t*1.2))+') rotate('+f(.6*Math.sin(t*.97))+' 1003 350)');
  }

  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)');
  const button=get('playback'), icon=get('control-icon'), label=get('control-text');
  let playing=!reduce.matches, manual=false, elapsed=0, previous=null, frame=0;
  function tick(now) {
    frame=0;
    if (!playing || document.hidden) { previous=null; return; }
    if (previous!==null) elapsed+=Math.min((now-previous)/1000,.1);
    previous=now;
    draw(elapsed);
    frame=window.requestAnimationFrame(tick);
  }
  function sync() {
    if (frame) window.cancelAnimationFrame(frame);
    frame=0; previous=null;
    label.textContent=playing?'暂停':'播放';
    button.setAttribute('aria-label',playing?'暂停动画':'播放动画');
    icon.setAttribute('d',playing?'M3 2h3v12H3zm7 0h3v12h-3z':'M4 1.8 14 8 4 14.2Z');
    if (playing && !document.hidden) frame=window.requestAnimationFrame(tick);
  }
  function toggle() { manual=true; playing=!playing; sync(); }
  button.addEventListener('click',toggle);
  document.addEventListener('keydown',event=>{
    if (event.code!=='Space'||event.target===button||event.altKey||event.ctrlKey||event.metaKey) return;
    event.preventDefault();
    if (!event.repeat) toggle();
  });
  document.addEventListener('visibilitychange',sync);
  const changeMotion=event=>{
    if (event.matches) { playing=false; manual=false; sync(); }
    else if (!manual) { playing=true; sync(); }
  };
  if (reduce.addEventListener) reduce.addEventListener('change',changeMotion);
  else if (reduce.addListener) reduce.addListener(changeMotion);
  draw(0); sync();
})();
</script>
</body>
</html>
