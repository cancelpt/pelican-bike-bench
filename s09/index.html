<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a3b">
  <title>Pelican Pedal Parade</title>
  <style>
    :root {
      --ink: #102a3b;
      --sky: #90d8e7;
      --sea: #45b2c4;
      --sand: #f4d78c;
      --coral: #e85c4d;
      --yellow: #ffc94f;
      --cream: #fff7df;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      background: var(--ink);
      color: var(--cream);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      position: relative;
      display: grid;
      min-height: 100vh;
      place-items: center;
      isolation: isolate;
      background: var(--ink);
    }

    .scene {
      width: min(100vw, 1480px);
      height: min(100vh, 940px);
      display: block;
    }

    .controls {
      position: fixed;
      right: clamp(16px, 3vw, 34px);
      bottom: clamp(16px, 3vw, 34px);
      z-index: 2;
      display: flex;
      gap: 10px;
    }

    .icon-button {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border: 2px solid var(--cream);
      border-radius: 50%;
      background: var(--ink);
      color: var(--cream);
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, color 160ms ease;
    }

    .icon-button:hover {
      background: var(--cream);
      color: var(--ink);
      transform: translateY(-2px);
    }

    .icon-button:focus-visible {
      outline: 3px solid var(--yellow);
      outline-offset: 3px;
    }

    .icon-button svg { width: 21px; height: 21px; fill: currentColor; }
    .play-icon { display: none; }
    .is-paused .pause-icon { display: none; }
    .is-paused .play-icon { display: block; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .cloud { animation: drift 22s linear infinite; }
    .cloud.slow { animation-duration: 31s; animation-direction: reverse; }
    .sun-rays { animation: ray-turn 38s linear infinite; transform-origin: 173px 128px; }
    .wave { animation: waves 4s ease-in-out infinite; }
    .wave.alt { animation-delay: -2.2s; }
    .road-dashes { animation: road-scroll 1.1s linear infinite; }
    .wheel { animation: wheel-spin 0.95s linear infinite; transform-box: fill-box; transform-origin: center; }
    .rider { animation: rider-bob 0.95s ease-in-out infinite; transform-origin: 617px 408px; }
    .wing { animation: wing-flutter 0.95s ease-in-out infinite; transform-box: fill-box; transform-origin: 578px 405px; }
    .tail-feather { animation: tail-flick 1.9s ease-in-out infinite; transform-box: fill-box; transform-origin: 542px 419px; }
    .pedal-set { animation: pedal-turn 0.95s linear infinite; transform-box: fill-box; transform-origin: 620px 519px; }
    .leg-front { animation: leg-front-pump 0.95s ease-in-out infinite; transform-box: fill-box; transform-origin: 610px 430px; }
    .leg-back { animation: leg-back-pump 0.95s ease-in-out infinite; transform-box: fill-box; transform-origin: 633px 430px; }
    .beak-lower { animation: beak-chatter 5.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 693px 329px; }
    .spark { animation: sparkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .spark.delay { animation-delay: -1.2s; }
    .seagull { animation: gull-glide 8s ease-in-out infinite; }

    .is-paused .animated { animation-play-state: paused !important; }

    @keyframes drift {
      from { transform: translateX(-70px); }
      to { transform: translateX(72px); }
    }

    @keyframes ray-turn { to { transform: rotate(360deg); } }

    @keyframes waves {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(24px); }
    }

    @keyframes road-scroll { to { transform: translateX(-84px); } }
    @keyframes wheel-spin { to { transform: rotate(360deg); } }

    @keyframes rider-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes wing-flutter {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      50% { transform: rotate(-7deg) translateY(-3px); }
    }

    @keyframes tail-flick {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(6deg); }
    }

    @keyframes pedal-turn { to { transform: rotate(360deg); } }

    @keyframes leg-front-pump {
      0%, 100% { transform: rotate(-9deg); }
      50% { transform: rotate(15deg); }
    }

    @keyframes leg-back-pump {
      0%, 100% { transform: rotate(11deg); }
      50% { transform: rotate(-13deg); }
    }

    @keyframes beak-chatter {
      0%, 78%, 100% { transform: rotate(0deg); }
      84%, 91% { transform: rotate(4deg); }
    }

    @keyframes sparkle {
      0%, 100% { opacity: .2; transform: scale(.7); }
      50% { opacity: 1; transform: scale(1.14); }
    }

    @keyframes gull-glide {
      0%, 100% { transform: translateX(0) translateY(0); }
      50% { transform: translateX(55px) translateY(-13px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .animated { animation: none !important; }
    }

    @media (max-aspect-ratio: 4 / 5) {
      .scene { width: 132vh; height: auto; }
    }
  </style>
</head>
<body>

    <div class="controls">
      <button class="icon-button" id="motion-toggle" type="button" aria-label="Pause animation" title="Pause animation">
        <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
        <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>
      </button>
    </div>
  </main>

  <script>
    const artboard = document.getElementById('artboard');
    const motionToggle = document.getElementById('motion-toggle');

    motionToggle.addEventListener('click', () => {
      const paused = artboard.classList.toggle('is-paused');
      motionToggle.setAttribute('aria-label', paused ? 'Play animation' : 'Pause animation');
      motionToggle.setAttribute('title', paused ? 'Play animation' : 'Pause animation');
    });
  </script>
</body>
</html>
