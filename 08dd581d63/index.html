<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑自行车 - 2D SVG 动画</title>
  <style>
    :root {
      --bg-top: #56ccf2;
      --bg-mid: #8ae0ff;
      --bg-bottom: #fff3d1;
      --panel-bg: rgba(255, 255, 255, 0.85);
      --panel-text: #1e3a5f;
      --accent: #ff6b4a;
    }

    body.sunset {
      --bg-top: #2c1654;
      --bg-mid: #d65db1;
      --bg-bottom: #ff9671;
    }

    body.night {
      --bg-top: #0b132b;
      --bg-mid: #1c2541;
      --bg-bottom: #3a506b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 58%, var(--bg-bottom) 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      transition: background 0.8s ease;
    }

    .stage-wrapper {
      position: relative;
      width: min(96vw, 1100px);
      aspect-ratio: 16 / 10;
      border-radius: 28px;
      overflow: hidden;
      box-shadow:
        0 25px 60px rgba(15, 32, 58, 0.32),
        0 0 0 6px rgba(255, 255, 255, 0.45);
      background: transparent;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 控制栏 */
    .controls {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      border-radius: 999px;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      color: var(--panel-text);
      font-size: 14px;
      font-weight: 600;
      z-index: 10;
    }

    .controls button {
      border: none;
      background: #ffffff;
      color: #1e3a5f;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.15s ease, background 0.2s ease, color 0.2s ease;
    }

    .controls button:hover {
      transform: translateY(-2px);
      background: #ff6b4a;
      color: #ffffff;
    }

    .controls button:active {
      transform: translateY(0);
    }

    .controls input[type="range"] {
      accent-color: var(--accent);
      width: 100px;
      cursor: pointer;
    }

    .divider {
      width: 1px;
      height: 18px;
      background: rgba(30, 58, 95, 0.2);
    }

    /* 车铃声波动画 */
    .ring-wave {
      opacity: 0;
      transform-origin: 518px 228px;
    }

    .ring-wave.active {
      animation: ringPulse 0.65s ease-out forwards;
    }

    @keyframes ringPulse {
      0% {
        opacity: 0.95;
        transform: scale(0.4);
      }
      100% {
        opacity: 0;
        transform: scale(2.4);
      }
    }
  </style>
</head>
<body>

  <div class="stage-wrapper">
    <svg id="scene" viewBox="0 0 1000 625" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 天空与海洋渐变 -->
        <linearGradient id="skyGradDay" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#3aa6ff" />
          <stop offset="55%" stop-color="#8be2ff" />
          <stop offset="100%" stop-color="#fff4cc" />
        </linearGradient>

        <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#0077b6" />
          <stop offset="100%" stop-color="#00b4d8" />
        </linearGradient>

        <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#434a54" />
          <stop offset="100%" stop-color="#2c3138" />
        </linearGradient>

        <!-- 鹈鹕羽毛与大嘴渐变 -->
        <linearGradient id="bodyFeather" x1="15%" y1="10%" x2="85%" y2="90%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="70%" stop-color="#f5f8fc" />
          <stop offset="100%" stop-color="#d8e3f0" />
        </linearGradient>

        <linearGradient id="wingFeather" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="65%" stop-color="#edf2f8" />
          <stop offset="100%" stop-color="#cfd9e6" />
        </linearGradient>

        <linearGradient id="upperBeakGrad" x1="0%" y1="0%" x2="100%" y2="20%">
          <stop offset="0%" stop-color="#ffd166" />
          <stop offset="65%" stop-color="#ffb703" />
          <stop offset="100%" stop-color="#fb8500" />
        </linearGradient>

        <linearGradient id="pouchGrad" x1="20%" y1="0%" x2="60%" y2="100%">
          <stop offset="0%" stop-color="#ff9f1c" />
          <stop offset="45%" stop-color="#ff7b00" />
          <stop offset="100%" stop-color="#e04f00" />
        </linearGradient>

        <linearGradient id="legGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff9f1c" />
          <stop offset="100%" stop-color="#e76f00" />
        </linearGradient>

        <linearGradient id="farLegGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#d97706" />
          <stop offset="100%" stop-color="#b45309" />
        </linearGradient>

        <!-- 自行车车架涂装渐变 -->
        <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00d2b4" />
          <stop offset="50%" stop-color="#00a896" />
          <stop offset="100%" stop-color="#028090" />
        </linearGradient>

        <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="50%" stop-color="#cfd8dc" />
          <stop offset="100%" stop-color="#90a4ae" />
        </linearGradient>

        <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff9c4" stop-opacity="1" />
          <stop offset="45%" stop-color="#ffe066" stop-opacity="0.85" />
          <stop offset="100%" stop-color="#ffd166" stop-opacity="0" />
        </radialGradient>

        <!-- 车头灯光束 -->
        <linearGradient id="headlightBeam" x1="0%" y1="50%" x2="100%" y2="50%">
          <stop offset="0%" stop-color="#fff8b0" stop-opacity="0.7" />
          <stop offset="100%" stop-color="#fff8b0" stop-opacity="0" />
        </linearGradient>

        <!-- 复用单个车轮模板（半径 80） -->
        <g id="bikeWheel">
          <!-- 外胎 -->
          <circle cx="0" cy="0" r="80" fill="none" stroke="#23272e" stroke-width="14" />
          <!-- 复古奶油白胎壁 -->
          <circle cx="0" cy="0" r="71" fill="none" stroke="#fdf6e2" stroke-width="5" />
          <!-- 铝合金轮圈 -->
          <circle cx="0" cy="0" r="66" fill="none" stroke="#b0bec5" stroke-width="4" />
          <!-- 辐条组 -->
          <g stroke="#d9e2ec" stroke-width="1.8" stroke-linecap="round">
            <line x1="-65" y1="0" x2="65" y2="0" />
            <line x1="0" y1="-65" x2="0" y2="65" />
            <line x1="-46" y1="-46" x2="46" y2="46" />
            <line x1="-46" y1="46" x2="46" y2="-46" />
            <line x1="-60" y1="-25" x2="60" y2="25" />
            <line x1="-25" y1="-60" x2="25" y2="60" />
            <line x1="-60" y1="25" x2="60" y2="-25" />
            <line x1="-25" y1="60" x2="25" y2="-60" />
          </g>
          <!-- 车轮反光片（让旋转更明显） -->
          <rect x="42" y="-5" width="12" height="10" rx="3" fill="#ff9f1c" />
          <rect x="-54" y="-5" width="12" height="10" rx="3" fill="#ff9f1c" />
          <!-- 气门嘴 -->
          <rect x="-2" y="57" width="4" height="8" rx="1" fill="#546e7a" />
          <!-- 花鼓内圈 -->
          <circle cx="0" cy="0" r="11" fill="#eceff1" stroke="#607d8b" stroke-width="3" />
          <circle cx="0" cy="0" r="4" fill="#37474f" />
        </g>
      </defs>

      <!-- ================= 1. 背景层（天空、太阳、云朵、大海、远景） ================= -->
      <!-- 太阳 / 月亮 -->
      <g id="celestial" transform="translate(800, 125)">
        <circle cx="0" cy="0" r="88" fill="url(#sunGlow)" />
        <circle cx="0" cy="0" r="42" fill="#fff3b0" />
      </g>

      <!-- 夜空繁星（夜间模式显现） -->
      <g id="starsLayer" opacity="0" fill="#ffffff" style="transition: opacity 0.8s ease;">
        <circle cx="120" cy="70" r="2" />
        <circle cx="240" cy="45" r="1.5" />
        <circle cx="380" cy="95" r="2.2" />
        <circle cx="520" cy="55" r="1.8" />
        <circle cx="660" cy="80" r="2.4" />
        <circle cx="890" cy="60" r="1.6" />
        <circle cx="170" cy="145" r="1.5" />
        <circle cx="450" cy="140" r="1.4" />
        <circle cx="720" cy="160" r="2" />
      </g>

      <!-- 远景流云 -->
      <g id="cloudsLayer" opacity="0.9">
        <g class="cloud" data-speed="0.35" transform="translate(140, 95)">
          <path d="M 0,20 Q 15,-5 42,5 Q 65,-18 98,2 Q 128,-5 140,20 Z" fill="#ffffff" opacity="0.85" />
        </g>
        <g class="cloud" data-speed="0.55" transform="translate(520, 70) scale(1.2)">
          <path d="M 0,22 Q 20,-8 50,4 Q 78,-20 112,4 Q 138,0 150,22 Z" fill="#ffffff" opacity="0.75" />
        </g>
        <g class="cloud" data-speed="0.25" transform="translate(840, 150) scale(0.85)">
          <path d="M 0,20 Q 15,-5 42,5 Q 65,-18 98,2 Q 128,-5 140,20 Z" fill="#ffffff" opacity="0.8" />
        </g>
      </g>

      <!-- 远景海鸥 -->
      <g id="seagullsLayer" stroke="#335c67" stroke-width="2.6" fill="none" stroke-linecap="round">
        <path id="gull1" d="M 210,155 Q 222,143 232,153 Q 242,143 254,155" />
        <path id="gull2" d="M 650,120 Q 659,110 667,118 Q 675,110 684,120" />
      </g>

      <!-- 远景海岛与灯塔（缓慢视差移动） -->
      <g id="distantIslands">
        <path d="M -80,395 Q 60,335 210,395 Z" fill="#70b5c8" opacity="0.55" />
        <path d="M 640,395 Q 790,320 960,395 Z" fill="#63a7bc" opacity="0.5" />
        <!-- 小灯塔 -->
        <g transform="translate(785, 302)">
          <polygon points="-7,45 -4,0 4,0 7,45" fill="#ffffff" />
          <polygon points="-5.5,28 -4.5,14 4.5,14 5.5,28" fill="#e63946" />
          <rect x="-6" y="-5" width="12" height="5" rx="1" fill="#1d3557" />
          <polygon points="-8,-5 0,-13 8,-5" fill="#e63946" />
        </g>
      </g>

      <!-- 蔚蓝大海与波浪 -->
      <rect x="0" y="390" width="1000" height="85" fill="url(#seaGrad)" />
      <g id="seaWaves" stroke="#90e0ef" stroke-width="2.5" stroke-linecap="round" opacity="0.65">
        <line x1="60" y1="412" x2="125" y2="412" />
        <line x1="280" y1="430" x2="365" y2="430" />
        <line x1="510" y1="408" x2="575" y2="408" />
        <line x1="740" y1="425" x2="830" y2="425" />
        <line x1="910" y1="414" x2="970" y2="414" />
      </g>

      <!-- 海滨散步道护栏与沙滩过渡 -->
      <rect x="0" y="458" width="1000" height="24" fill="#f4d58d" />
      <rect x="0" y="476" width="1000" height="8" fill="#d4b475" />

      <!-- 公路与斑马标线 -->
      <rect x="0" y="484" width="1000" height="141" fill="url(#roadGrad)" />
      <line x1="0" y1="490" x2="1000" y2="490" stroke="#f8f9fa" stroke-width="3" opacity="0.6" />

      <!-- 动态路面中心虚线 -->
      <line id="roadDashes" x1="-200" y1="548" x2="1200" y2="548"
            stroke="#ffd166" stroke-width="6" stroke-linecap="round"
            stroke-dasharray="56 64" />

      <!-- 路边掠过的小石子/速度线 -->
      <g id="roadPebbles" fill="#6c757d" opacity="0.65">
        <rect x="150" y="585" width="18" height="4" rx="2" />
        <rect x="420" y="515" width="12" height="3" rx="1.5" />
        <rect x="760" y="592" width="24" height="4" rx="2" />
        <rect x="920" y="520" width="15" height="3" rx="1.5" />
      </g>

      <!-- 自行车底部地面投影 -->
      <ellipse id="bikeShadow" cx="475" cy="526" rx="235" ry="14" fill="#16191d" opacity="0.42" />


      <!-- ================= 2. 鹈鹕与自行车主体系统 ================= -->
      <g id="pelicanBikeRig">

        <!-- 2.1 远端肢体层（在车架后方：左翅膀、左腿、左曲柄） -->
        <g id="farSideLayer">
          <!-- 远端左翅膀（握住远端车把） -->
          <path id="leftWing"
                d="M 410,205 Q 485,205 568,236"
                fill="none" stroke="#dbe4ee" stroke-width="22" stroke-linecap="round" />

          <!-- 远端左曲柄（五通 455,442） -->
          <line id="leftCrank" x1="455" y1="442" x2="455" y2="404"
                stroke="#78909c" stroke-width="8" stroke-linecap="round" />

          <!-- 远端左脚踏板 -->
          <g id="leftPedalGroup" transform="translate(455, 404)">
            <rect x="-16" y="-4" width="32" height="8" rx="3" fill="#37474f" stroke="#263238" stroke-width="1.5" />
          </g>

          <!-- 远端左腿（大腿 + 小腿 + 橙色大脚蹼） -->
          <path id="leftThigh" d="M 398,278 L 460,340" stroke="url(#farLegGrad)" stroke-width="13" stroke-linecap="round" fill="none" />
          <path id="leftShin" d="M 460,340 L 455,404" stroke="url(#farLegGrad)" stroke-width="10" stroke-linecap="round" fill="none" />
          <circle id="leftKnee" cx="460" cy="340" r="7" fill="#c26404" />
          <!-- 左脚蹼 -->
          <path id="leftFoot" d="M -8,-6 L 26,-2 L 18,5 L -10,4 Z" fill="#d97706" />
        </g>

        <!-- 2.2 前后车轮（中心：后轮 315,442 | 前轮 635,442） -->
        <g id="rearWheel" transform="translate(315, 442)">
          <use href="#bikeWheel" />
        </g>
        <g id="frontWheel" transform="translate(635, 442)">
          <use href="#bikeWheel" />
        </g>

        <!-- 2.3 自行车车架与配件（随车身轻微弹性震动） -->
        <g id="bikeFrameGroup">
          <!-- 后挡泥板 & 前挡泥板 -->
          <path d="M 226,435 A 89,89 0 0 1 386,386" fill="none" stroke="#fdf6e2" stroke-width="8" stroke-linecap="round" />
          <path d="M 558,395 A 89,89 0 0 1 716,404" fill="none" stroke="#fdf6e2" stroke-width="8" stroke-linecap="round" />

          <!-- 后货架与装鱼竹篓 -->
          <g id="rearRack">
            <line x1="315" y1="442" x2="275" y2="338" stroke="#90a4ae" stroke-width="4" stroke-linecap="round" />
            <line x1="335" y1="400" x2="322" y2="338" stroke="#90a4ae" stroke-width="4" stroke-linecap="round" />
            <line x1="265" y1="338" x2="395" y2="338" stroke="#cfd8dc" stroke-width="6" stroke-linecap="round" />
            <!-- 竹篓里露出的小鱼尾巴 -->
            <g transform="translate(298, 310)">
              <rect x="-24" y="0" width="48" height="28" rx="6" fill="#d4a373" stroke="#9c6644" stroke-width="2.5" />
              <line x1="-22" y1="10" x2="22" y2="10" stroke="#9c6644" stroke-width="2" />
              <line x1="-22" y1="19" x2="22" y2="19" stroke="#9c6644" stroke-width="2" />
              <!-- 竹篓里的小鱼尾 -->
              <path id="basketFishTail" d="M 4,0 L 16,-14 L 12,-2 L 22,-7 L 10,2 Z" fill="#48cae4" stroke="#0077b6" stroke-width="1.5" />
            </g>
          </g>

          <!-- 链条传动系统（后飞轮 315,442 到 五通牙盘 455,442） -->
          <g id="drivetrain">
            <!-- 链条上下边（动态虚线滚动） -->
            <path id="bikeChain"
                  d="M 315,430 L 455,416 A 26,26 0 1 1 455,468 L 315,454 A 12,12 0 1 1 315,430 Z"
                  fill="none" stroke="#37474f" stroke-width="4.5" stroke-dasharray="7 5" />
            <!-- 后飞轮 -->
            <circle cx="315" cy="442" r="14" fill="#90a4ae" stroke="#455a64" stroke-width="3" />
          </g>

          <!-- 经典复古自行车车架 -->
          <g stroke="url(#frameGrad)" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <!-- 后下叉 -->
            <line x1="315" y1="442" x2="455" y2="442" stroke-width="10" />
            <!-- 后上叉 -->
            <path d="M 315,442 Q 355,375 398,320" stroke-width="9" />
            <!-- 中管（立管） -->
            <line x1="455" y1="442" x2="398" y2="320" stroke-width="12" />
            <!-- 下管（优雅弧度） -->
            <path d="M 455,442 Q 525,405 586,322" stroke-width="13" />
            <!-- 上管（复古巡航双曲管） -->
            <path d="M 398,320 Q 490,326 580,298" stroke-width="11" />
            <!-- 前叉 -->
            <path d="M 584,312 Q 602,388 635,442" stroke-width="11" />
            <!-- 头管 -->
            <line x1="577" y1="286" x2="588" y2="328" stroke-width="14" />
          </g>

          <!-- 车架高光细节 -->
          <path d="M 402,320 Q 490,326 577,298" fill="none" stroke="#80ffdb" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

          <!-- 座管与复古皮鞍座 -->
          <line x1="398" y1="320" x2="389" y2="288" stroke="url(#chromeGrad)" stroke-width="8" stroke-linecap="round" />
          <path d="M 358,284 Q 388,292 420,280 Q 426,288 408,295 Q 375,302 355,292 Z"
                fill="#7f4f24" stroke="#582f0e" stroke-width="2.5" />

          <!-- 车把立管与复古燕把 -->
          <path d="M 577,286 L 566,240 Q 562,226 544,230 L 516,244"
                fill="none" stroke="url(#chromeGrad)" stroke-width="8" stroke-linecap="round" />
          <!-- 远端把套 -->
          <line x1="556" y1="234" x2="574" y2="240" stroke="#7f4f24" stroke-width="10" stroke-linecap="round" />

          <!-- 复古车头灯与光束 -->
          <polygon id="lightBeam" points="598,274 880,210 880,360" fill="url(#headlightBeam)" opacity="0.25" />
          <g transform="translate(592, 274)">
            <path d="M -8,-10 L 6,-12 A 12,12 0 0 1 6,12 L -8,10 Z" fill="#cfd8dc" stroke="#607d8b" stroke-width="2" />
            <ellipse cx="6" cy="0" rx="3" ry="10" fill="#fff9db" />
          </g>

          <!-- 车铃与声波 -->
          <g transform="translate(546, 224)">
            <path d="M -9,0 A 9,9 0 0 1 9,0 Z" fill="#ffd166" stroke="#d97706" stroke-width="2" />
          </g>
          <g id="bellWave" class="ring-wave">
            <circle cx="546" cy="220" r="16" fill="none" stroke="#ffd166" stroke-width="3" />
            <circle cx="546" cy="220" r="26" fill="none" stroke="#ff9f1c" stroke-width="2" stroke-dasharray="6 4" />
          </g>

          <!-- 大齿盘（五通中心 455, 442） -->
          <g id="chainring" transform="translate(455, 442)">
            <circle cx="0" cy="0" r="27" fill="#eceff1" stroke="#607d8b" stroke-width="4" />
            <circle cx="0" cy="0" r="20" fill="none" stroke="#90a4ae" stroke-width="3" stroke-dasharray="8 6" />
            <!-- 五角星镂空盘爪 -->
            <line x1="-22" y1="0" x2="22" y2="0" stroke="#90a4ae" stroke-width="4" />
            <line x1="0" y1="-22" x2="0" y2="22" stroke="#90a4ae" stroke-width="4" />
            <circle cx="0" cy="0" r="8" fill="#546e7a" />
          </g>
        </g>

        <!-- 2.4 鹈鹕身体、脖颈、头部与大喉囊（坐在车座上，随踩踏有活力地起伏） -->
        <g id="pelicanBodyGroup">
          <!-- 翘起的尾羽 -->
          <g id="tailFeathers" transform="translate(342, 265)">
            <path d="M 0,0 Q -36,-12 -46,-28 Q -28,-28 -10,-12" fill="#37474f" />
            <path d="M 2,-4 Q -32,-24 -38,-42 Q -18,-36 0,-14" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5" />
            <path d="M 8,-8 Q -18,-32 -22,-48 Q -6,-38 8,-16" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5" />
          </g>

          <!-- 肥硕饱满的鹈鹕身躯 -->
          <path d="M 338,262
                   C 326,225 352,170 404,162
                   C 456,154 488,186 486,232
                   C 484,274 446,296 392,292
                   C 360,290 345,280 338,262 Z"
                fill="url(#bodyFeather)" stroke="#cfd9e6" stroke-width="2.5" />

        <!-- 2.5 近端肢体与近端曲柄层（在车架前方：右曲柄、右腿、右翅膀） -->

            <!-- 脚蹼分趾纹路 -->

                  fill="url(#wingFeather)" stroke="#b8c7d9" stroke-width="2.5" stroke-linejoin="round" />
            <!-- 鹈鹕翅膀标志性的深炭黑初级飞羽翼尖（握住车把） -->
            <path id="rightWingTip"
                  d="M 488,258 C 504,255 516,250 524,244 C 516,235 500,235 486,238 C 494,244 494,252 488,258 Z"
                  fill="#2b3440" />

  <script>
    (() => {
      // 核心元素引用
      const rearWheel = document.getElementById('rearWheel');
      const frontWheel = document.getElementById('frontWheel');
      const chainring = document.getElementById('chainring');
      const bikeChain = document.getElementById('bikeChain');
      const roadDashes = document.getElementById('roadDashes');
      const bikeShadow = document.getElementById('bikeShadow');

      const bikeFrameGroup = document.getElementById('bikeFrameGroup');
      const pelicanBodyGroup = document.getElementById('pelicanBodyGroup');
      const pelicanHeadGroup = document.getElementById('pelicanHeadGroup');
      const headCrest = document.getElementById('headCrest');
      const tailFeathers = document.getElementById('tailFeathers');
      const scarfTail1 = document.getElementById('scarfTail1');
      const scarfTail1Stripe = document.getElementById('scarfTail1Stripe');

      const pouchPath = document.getElementById('pouchPath');
      const pouchFold1 = document.getElementById('pouchFold1');
      const pouchFold2 = document.getElementById('pouchFold2');
      const pouchFish = document.getElementById('pouchFish');
      const upperBeakGroup = document.getElementById('upperBeakGroup');
      const eyelid = document.getElementById('eyelid');

      const rightCrank = document.getElementById('rightCrank');
      const leftCrank = document.getElementById('leftCrank');
      const leftPedalGroup = document.getElementById('leftPedalGroup');

      const rightThigh = document.getElementById('rightThigh');
      const rightShin = document.getElementById('rightShin');
      const rightKnee = document.getElementById('rightKnee');
      const rightFootGroup = document.getElementById('rightFootGroup');
      const thighFeathers = document.getElementById('thighFeathers');

      const leftThigh = document.getElementById('leftThigh');
      const leftShin = document.getElementById('leftShin');
      const leftKnee = document.getElementById('leftKnee');
      const leftFoot = document.getElementById('leftFoot');

      const rightWingPath = document.getElementById('rightWingPath');
      const rightWingTip = document.getElementById('rightWingTip');
      const rightWingFeatherLine = document.getElementById('rightWingFeatherLine');
      const leftWing = document.getElementById('leftWing');

      const basketFishTail = document.getElementById('basketFishTail');
      const clouds = Array.from(document.querySelectorAll('.cloud'));
      const seaWaves = document.getElementById('seaWaves');
      const roadPebbles = document.getElementById('roadPebbles');
      const gull1 = document.getElementById('gull1');
      const gull2 = document.getElementById('gull2');
      const bubble1 = document.getElementById('bubble1');
      const bubble2 = document.getElementById('bubble2');
      const bubble3 = document.getElementById('bubble3');

      // 机械几何常数
      const CRANK_X = 455;
      const CRANK_Y = 442;
      const CRANK_R = 36;

      // 髋关节基准坐标与大腿/小腿长度（2-Bone IK）
      const HIP_BASE_X = 398;
      const HIP_BASE_Y = 278;
      const L1 = 96; // 大腿长
      const L2 = 98; // 小腿长

      // 动画状态
      let crankAngle = 0;
      let wheelAngle = 0;
      let dashOffset = 0;
      let chainOffset = 0;
      let speedMultiplier = 1.0;
      let fishJumpTimer = 0;
      let lastTime = performance.now();

      // 云朵位置状态
      const cloudStates = [
        { x: 140, y: 95, scale: 1.0, speed: 18 },
        { x: 520, y: 70, scale: 1.2, speed: 28 },
        { x: 840, y: 150, scale: 0.85, speed: 14 }
      ];

      /**
       * 二连杆逆运动学（2-Bone IK）：根据髋关节与脚踝位置计算膝关节坐标
       * 膝盖朝向右侧（车头方向）弯曲
       */
      function solveLegIK(hx, hy, ax, ay) {
        const dx = ax - hx;
        const dy = ay - hy;
        const rawDist = Math.hypot(dx, dy);
        const minDist = Math.abs(L1 - L2) + 1;
        const maxDist = L1 + L2 - 1;
        const d = Math.min(Math.max(rawDist, minDist), maxDist);

        const baseAngle = Math.atan2(dy, dx);
        const cosAlpha = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
        const alpha = Math.acos(Math.min(1, Math.max(-1, cosAlpha)));

        // 膝盖向车头方向（角度减小方向）弯曲
        const kneeAngle = baseAngle - alpha;
        return {
          kx: hx + L1 * Math.cos(kneeAngle),
          ky: hy + L1 * Math.sin(kneeAngle)
        };
      }

      // 主渲染循环
      function animate(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;

        const angularVel = 4.2 * speedMultiplier; // 曲柄角速度 rad/s
        crankAngle += angularVel * dt;
        wheelAngle += angularVel * 1.9 * dt * (180 / Math.PI);
        dashOffset += 270 * speedMultiplier * dt;
        chainOffset -= 95 * speedMultiplier * dt;

        // 1. 车轮、牙盘、链条与路面旋转平移
        rearWheel.setAttribute('transform', `translate(315, 442) rotate(${wheelAngle % 360})`);
        frontWheel.setAttribute('transform', `translate(635, 442) rotate(${wheelAngle % 360})`);
        chainring.setAttribute('transform', `translate(455, 442) rotate(${(crankAngle * 180 / Math.PI) % 360})`);
        bikeChain.setAttribute('stroke-dashoffset', chainOffset.toFixed(1));
        roadDashes.setAttribute('stroke-dashoffset', dashOffset.toFixed(1));

        // 2. 车身与鹈鹕躯干的律动（每踩两下上下起伏两次）
        const bobY = Math.sin(crankAngle * 2) * 5.5;
        const pitchDeg = Math.cos(crankAngle * 2) * 1.6;
        const frameBounceY = Math.sin(crankAngle * 2 - 0.4) * 1.8;

        bikeFrameGroup.setAttribute('transform', `translate(0, ${frameBounceY.toFixed(2)})`);
        pelicanBodyGroup.setAttribute(
          'transform',
          `translate(0, ${bobY.toFixed(2)}) rotate(${pitchDeg.toFixed(2)}, 410, 240)`
        );
        bikeShadow.setAttribute('rx', (235 + bobY * 1.8).toFixed(1));

        // 3. 头部、冠羽、尾羽与大喉囊的次级物理跟随动画（果冻感）
        const headNod = Math.sin(crankAngle * 2 - 0.7) * 3.8;
        pelicanHeadGroup.setAttribute('transform', `translate(462, 168) rotate(${headNod.toFixed(2)}, 10, -40)`);

        const crestFlutter = Math.sin(now * 0.018 * speedMultiplier) * 8;
        headCrest.setAttribute('transform', `translate(10, -96) rotate(${crestFlutter.toFixed(1)})`);

        const tailWag = Math.sin(crankAngle * 2 - 0.5) * 6;
        tailFeathers.setAttribute('transform', `translate(342, 265) rotate(${tailWag.toFixed(1)})`);

        // 喉囊弹性晃动 + 捉鱼鼓起效果
        let fishBoost = 0;
        if (fishJumpTimer > 0) {
          fishJumpTimer = Math.max(0, fishJumpTimer - dt);
          fishBoost = Math.sin(fishJumpTimer * Math.PI * 3) * 18;
        }
        const pouchSag = Math.sin(crankAngle * 2 - 1.1) * 8 + Math.abs( fishBoost ) * 0.7;
        const pouchSway = Math.cos(crankAngle * 2 - 0.8) * 5;
        const pMidY = (74 + pouchSag).toFixed(1);
        const pMidX = (54 + pouchSway).toFixed(1);

        pouchPath.setAttribute(
          'd',
          `M -4,4 C 8,${(56 + pouchSag * 0.7).toFixed(1)} ${pMidX},${pMidY} 96,${(52 + pouchSag * 0.6).toFixed(1)} C 122,38 136,16 142,2 Z`
        );
        pouchFold1.setAttribute('d', `M 22,12 Q ${48 + pouchSway},${(46 + pouchSag * 0.65).toFixed(1)} 88,36`);
        pouchFold2.setAttribute('d', `M 45,10 Q ${68 + pouchSway * 0.6},${(32 + pouchSag * 0.45).toFixed(1)} 108,22`);

        // 喉囊里的小鱼活蹦乱跳
        const fishCycle = Math.sin(now * 0.005) * 4 + fishBoost;
        const fishRot = -18 + Math.cos(now * 0.008) * 12 + (fishBoost * 0.8);
        const beakOpen = Math.max(0, (fishCycle - 1) * 0.45);
        pouchFish.setAttribute('transform', `translate(58, ${(11 - fishCycle).toFixed(1)}) rotate(${fishRot.toFixed(1)})`);
        upperBeakGroup.setAttribute('transform', `translate(44, -84) rotate(${(-beakOpen).toFixed(2)})`);

        // 后货架竹篓里的小鱼尾摆动
        const tailFlip = Math.sin(now * 0.012) * 10;
        basketFishTail.setAttribute('transform', `rotate(${tailFlip.toFixed(1)}, 8, 0)`);

        // 定期自然眨眼
        const blinkPhase = now % 3800;
        const blinkScale = (blinkPhase > 3620 && blinkPhase < 3760)
          ? Math.sin(((blinkPhase - 3620) / 140) * Math.PI)
          : 0;
        eyelid.setAttribute('transform', `scale(1, ${blinkScale.toFixed(2)})`);

        // 4. 围巾迎风波动
        const w1 = Math.sin(now * 0.012 * speedMultiplier) * 14;
        const w2 = Math.cos(now * 0.012 * speedMultiplier) * 16;
        const scarfD = `M 442,172 Q 380,${(156 + w1).toFixed(1)} 320,${(174 - w1 * 0.8).toFixed(1)} Q 290,${(182 + w2).toFixed(1)} 264,${(168 - w2).toFixed(1)}`;
        scarfTail1.setAttribute('d', scarfD);
        scarfTail1Stripe.setAttribute('d', scarfD);

        // 5. 左右双腿与曲柄踏板逆运动学（IK）计算
        const hipX = HIP_BASE_X;
        const hipY = HIP_BASE_Y + bobY;

        // 右腿（近端，相位 crankAngle）
        const rPedalX = CRANK_X + CRANK_R * Math.cos(crankAngle);
        const rPedalY = CRANK_Y + CRANK_R * Math.sin(crankAngle);
        const rAnkleX = rPedalX - 4;
        const rAnkleY = rPedalY - 6;
        const rKnee = solveLegIK(hipX, hipY, rAnkleX, rAnkleY);

        rightCrank.setAttribute('x2', rPedalX.toFixed(1));
        rightCrank.setAttribute('y2', rPedalY.toFixed(1));
        rightThigh.setAttribute('d', `M ${hipX.toFixed(1)},${hipY.toFixed(1)} L ${rKnee.kx.toFixed(1)},${rKnee.ky.toFixed(1)}`);
        rightShin.setAttribute('d', `M ${rKnee.kx.toFixed(1)},${rKnee.ky.toFixed(1)} L ${rAnkleX.toFixed(1)},${rAnkleY.toFixed(1)}`);
        rightKnee.setAttribute('cx', rKnee.kx.toFixed(1));
        rightKnee.setAttribute('cy', rKnee.ky.toFixed(1));

        const footTilt = Math.sin(crankAngle) * 8;
        rightFootGroup.setAttribute(
          'transform',
          `translate(${rPedalX.toFixed(1)}, ${rPedalY.toFixed(1)}) rotate(${footTilt.toFixed(1)})`
        );
        thighFeathers.setAttribute('transform', `translate(0, ${bobY.toFixed(1)})`);

        // 左腿（远端，相位 crankAngle + π）
        const lAngle = crankAngle + Math.PI;
        const lPedalX = CRANK_X + CRANK_R * Math.cos(lAngle);
        const lPedalY = CRANK_Y + CRANK_R * Math.sin(lAngle);
        const lAnkleX = lPedalX - 4;
        const lAnkleY = lPedalY - 6;
        const lKnee = solveLegIK(hipX + 4, hipY - 4, lAnkleX, lAnkleY);

        leftCrank.setAttribute('x2', lPedalX.toFixed(1));
        leftCrank.setAttribute('y2', lPedalY.toFixed(1));
        leftPedalGroup.setAttribute('transform', `translate(${lPedalX.toFixed(1)}, ${lPedalY.toFixed(1)})`);
        leftThigh.setAttribute('d', `M ${(hipX + 4).toFixed(1)},${(hipY - 4).toFixed(1)} L ${lKnee.kx.toFixed(1)},${lKnee.ky.toFixed(1)}`);
        leftShin.setAttribute('d', `M ${lKnee.kx.toFixed(1)},${lKnee.ky.toFixed(1)} L ${lAnkleX.toFixed(1)},${lAnkleY.toFixed(1)}`);
        leftKnee.setAttribute('cx', lKnee.kx.toFixed(1));
        leftKnee.setAttribute('cy', lKnee.ky.toFixed(1));
        leftFoot.setAttribute('transform', `translate(${lPedalX.toFixed(1)}, ${lPedalY.toFixed(1)})`);

        // 6. 双翅连接肩膀（随身体浮动）与车把（固定在车架上）
        const shoulderY = 208 + bobY;
        const handY = 244 + frameBounceY;
        const elbowY = 266 + bobY * 0.65;
        rightWingPath.setAttribute(
          'd',
          `M 412,${shoulderY.toFixed(1)} C 402,${(shoulderY + 40).toFixed(1)} 432,${(elbowY + 6).toFixed(1)} 468,${elbowY.toFixed(1)} C 492,${(elbowY - 4).toFixed(1)} 508,${(handY + 10).toFixed(1)} 520,${handY.toFixed(1)} C 508,${(handY - 12).toFixed(1)} 486,${(elbowY - 34).toFixed(1)} 465,${(elbowY - 31).toFixed(1)} C 444,${(elbowY - 28).toFixed(1)} 432,${(shoulderY + 8).toFixed(1)} 412,${shoulderY.toFixed(1)} Z`
        );
        rightWingTip.setAttribute(
          'd',
          `M 488,${(elbowY - 8).toFixed(1)} C 504,${(handY + 11).toFixed(1)} 516,${(handY + 6).toFixed(1)} 524,${handY.toFixed(1)} C 516,${(handY - 9).toFixed(1)} 500,${(handY - 9).toFixed(1)} 486,${(elbowY - 28).toFixed(1)} C 494,${(elbowY - 22).toFixed(1)} 494,${(elbowY - 14).toFixed(1)} 488,${(elbowY - 8).toFixed(1)} Z`
        );
        rightWingFeatherLine.setAttribute(
          'd',
          `M 424,${(shoulderY + 26).toFixed(1)} Q 456,${(elbowY - 12).toFixed(1)} 492,${(handY + 2).toFixed(1)}`
        );
        leftWing.setAttribute(
          'd',
          `M 410,${(shoulderY - 3).toFixed(1)} Q 485,${(shoulderY - 2).toFixed(1)} 568,${(236 + frameBounceY).toFixed(1)}`
        );

        // 7. 背景视差（云朵、海浪、路面小石子、海鸥、水泡泡）
        cloudStates.forEach((c, idx) => {
          c.x -= c.speed * speedMultiplier * dt;
          if (c.x < -180) c.x = 1060;
          clouds[idx].setAttribute('transform', `translate(${c.x.toFixed(1)}, ${c.y}) scale(${c.scale})`);
        });

        const waveShift = -((now * 0.04 * speedMultiplier) % 120);
        seaWaves.setAttribute('transform', `translate(${waveShift.toFixed(1)}, 0)`);

        const pebbleShift = -((now * 0.28 * speedMultiplier) % 260);
        roadPebbles.setAttribute('transform', `translate(${pebbleShift.toFixed(1)}, 0)`);

        const flap = Math.sin(now * 0.008) * 7;
        gull1.setAttribute('d', `M 210,${(155 + flap).toFixed(1)} Q 222,143 232,153 Q 242,143 254,${(155 + flap).toFixed(1)}`);
        gull2.setAttribute('d', `M 650,${(120 - flap * 0.8).toFixed(1)} Q 659,110 667,118 Q 675,110 684,${(120 - flap * 0.8).toFixed(1)}`);

        // 小鱼吐出的水泡向后飘散
        const bPhase = (now * 0.08 * speedMultiplier) % 140;
        bubble1.setAttribute('cx', (635 - bPhase).toFixed(1));
        bubble1.setAttribute('cy', (96 - Math.sin(bPhase * 0.08) * 10).toFixed(1));
        bubble1.setAttribute('opacity', Math.max(0, 1 - bPhase / 140).toFixed(2));

        const bPhase2 = (now * 0.08 * speedMultiplier + 48) % 140;
        bubble2.setAttribute('cx', (635 - bPhase2).toFixed(1));
        bubble2.setAttribute('cy', (84 - Math.cos(bPhase2 * 0.08) * 8).toFixed(1));
        bubble2.setAttribute('opacity', Math.max(0, 1 - bPhase2 / 140).toFixed(2));

        const bPhase3 = (now * 0.08 * speedMultiplier + 95) % 140;
        bubble3.setAttribute('cx', (635 - bPhase3).toFixed(1));
        bubble3.setAttribute('cy', (108 - Math.sin(bPhase3 * 0.06) * 12).toFixed(1));
        bubble3.setAttribute('opacity', Math.max(0, 1 - bPhase3 / 140).toFixed(2));

        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);

      // 交互控件绑定
      const speedSlider = document.getElementById('speedSlider');
      const feedBtn = document.getElementById('feedBtn');
      const bellBtn = document.getElementById('bellBtn');
      const themeBtn = document.getElementById('themeBtn');
      const bellWave = document.getElementById('bellWave');
      const starsLayer = document.getElementById('starsLayer');
      const lightBeam = document.getElementById('lightBeam');

      speedSlider.addEventListener('input', (e) => {
        speedMultiplier = parseFloat(e.target.value);
      });

      feedBtn.addEventListener('click', () => {
        fishJumpTimer = 1.0;
      });

      bellBtn.addEventListener('click', () => {
        bellWave.classList.remove('active');
        void bellWave.offsetWidth;
        bellWave.classList.add('active');
      });

      const themes = ['day', 'sunset', 'night'];
      let themeIdx = 0;
      themeBtn.addEventListener('click', () => {
        themeIdx = (themeIdx + 1) % themes.length;
        document.body.classList.remove('sunset', 'night');
        const mode = themes[themeIdx];
        if (mode !== 'day') {
          document.body.classList.add(mode);
        }
        starsLayer.setAttribute('opacity', mode === 'night' ? '0.95' : mode === 'sunset' ? '0.35' : '0');
        lightBeam.setAttribute('opacity', mode === 'night' ? '0.85' : mode === 'sunset' ? '0.55' : '0.2');
      });
    })();
  </script>
</body>
</html>
