  <g stroke="#d62828" fill="none" stroke-linecap="round" stroke-linejoin="round">

  <line id="shinB" x1="0" y1="0" x2="0" y2="0" stroke="#d97706" stroke-width="6" stroke-linecap="round"/>

  <line id="shinF" x1="0" y1="0" x2="0" y2="0" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
</svg>

<script>
  const C = { x: 410, y: 360 }, R = 26;
  const H = { x: 342, y: 213 };
  const L1 = 95, L2 = 95;

  const $ = (id) => document.getElementById(id);
  const thighB = $('thighB'), shinB = $('shinB'), thighF = $('thighF'), shinF = $('shinF');
  const footB = $('footB'), footF = $('footF'), pedalB = $('pedalB'), pedalF = $('pedalF');
  const crank = $('crank'), spokesR = $('spokesR'), spokesF = $('spokesF');

  function line(el, x1, y1, x2, y2) {
    el.setAttribute('x1', x1); el.setAttribute('y1', y1);
    el.setAttribute('x2', x2); el.setAttribute('y2', y2);
  }
  function place(g, x, y) {
    g.setAttribute('transform', 'translate(' + x + ' ' + y + ')');
  }
  function knee(f) {
    const dx = f.x - H.x, dy = f.y - H.y;
    const d = Math.hypot(dx, dy) || 1;
    const dc = Math.min(d, L1 + L2 - 1);
    const a = (L1 * L1 - L2 * L2 + dc * dc) / (2 * dc);
    const h = Math.sqrt(Math.max(L1 * L1 - a * a, 0));
    const ux = dx / d, uy = dy / d;
    return { x: H.x + a * ux + h * uy, y: H.y + a * uy - h * ux };
  }
  function drawLeg(thigh, shin, foot, pedal, ang) {
    const f = { x: C.x + R * Math.cos(ang), y: C.y + R * Math.sin(ang) };
    const k = knee(f);
    line(thigh, H.x, H.y, k.x, k.y);
    line(shin, k.x, k.y, f.x, f.y);
    place(foot, f.x, f.y);
    place(pedal, f.x, f.y);
  }

  let ang = 0, last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    ang += 2.6 * dt;

    drawLeg(thighF, shinF, footF, pedalF, ang);
    drawLeg(thighB, shinB, footB, pedalB, ang + Math.PI);

    crank.setAttribute('transform', 'rotate(' + (ang * 180 / Math.PI) + ' 410 360)');
    const w = -(ang * R / 70) * 180 / Math.PI;
    spokesR.setAttribute('transform', 'rotate(' + w + ' 260 360)');
    spokesF.setAttribute('transform', 'rotate(' + w + ' 560 360)');

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
