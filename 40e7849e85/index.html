<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelican Express — a bicycle ride</title>
<style>
  :root {
    color-scheme: dark;
    --cream: #f5ead8;
    --coral: #e76a50;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: grid;
    place-items: center;
    min-height: 100svh;
    padding: 28px;
    overflow-x: hidden;
    background:
      radial-gradient(70% 55% at 50% 4%, rgba(231, 160, 92, 0.18), transparent 70%),
      radial-gradient(120% 110% at 50% 0%, #204c46 0%, #12302e 46%, #081b1b 100%);
    color: var(--cream);
    font-family: "Segoe UI", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  }

  .frame {
    width: min(1120px, 94vw, calc((100svh - 118px) * 5 / 3));
    margin: 0;
    position: relative;
    z-index: 1;
  }

  .frame::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: 8% 6% -4%;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(255, 202, 137, 0.24), transparent 68%);
    filter: blur(50px);
    pointer-events: none;
  }

  .scene {
    display: block;
    width: 100%;
    height: auto;
    overflow: hidden;
    border-radius: clamp(18px, 2.6vw, 30px);
    background: #a6d9e4;
    box-shadow:
      0 44px 90px -34px rgba(0, 0, 0, 0.8),
      0 12px 30px -18px rgba(0, 0, 0, 0.6),
      0 0 0 1px rgba(247, 237, 218, 0.16),
      inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    animation: arrive 1s cubic-bezier(.2, .8, .2, 1) both;
  }

  figcaption {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    margin-top: 18px;
    padding: 0 10px;
    color: rgba(245, 234, 216, 0.52);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.25em;
    line-height: 1.6;
    text-transform: uppercase;
    animation: caption-in 1.1s 0.15s ease both;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: rgba(250, 239, 221, 0.9);
    letter-spacing: 0.3em;
  }

  .brand::before {
    content: "";
    width: 6px;
    height: 6px;
    flex: none;
    border-radius: 50%;
    background: var(--coral);
    box-shadow: 0 0 12px rgba(231, 106, 80, 0.8);
  }

  .meta { white-space: nowrap; }

  @keyframes arrive {
    from { opacity: 0; transform: translateY(20px) scale(0.985); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes caption-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- scene animation ---------- */
  .cloud {
    animation: cloud-bob 8s ease-in-out infinite alternate;
    will-change: transform;
  }

  .sky-bird {
    animation: bird-bob 5.5s ease-in-out infinite alternate;
    transform-box: fill-box;
    transform-origin: center;
  }

  .sun-rays {
    transform-box: view-box;
    transform-origin: 840px 128px;
    animation: sun-spin 150s linear infinite;
  }

  .scroll-far {
    animation: scroll-left 64s linear infinite;
  }

  .scroll-mid {
    animation: scroll-left 19s linear infinite;
  }

  .road-dashes {
    animation: road-dashes 0.9s linear infinite;
  }

  .road-dashes-soft {
    animation: road-dashes 2.4s linear infinite;
  }

  .chain-line {
    animation: chain-run 0.55s linear infinite;
  }

  .chain-line-bottom {
    animation-direction: reverse;
  }

  .scarf-tails {
    transform-box: view-box;
    transform-origin: 503px 248px;
    animation: scarf-flutter 2.1s ease-in-out infinite;
    will-change: transform;
  }

  .eye-group {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 6.4s ease-in-out infinite;
  }

  @keyframes cloud-bob {
    from { transform: translate(0, 0); }
    to   { transform: translate(11px, -7px); }
  }

  @keyframes bird-bob {
    from { transform: translate(0, 0) rotate(-1deg); }
    to   { transform: translate(-13px, -5px) rotate(1.5deg); }
  }

  @keyframes sun-spin {
    to { transform: rotate(360deg); }
  }

  @keyframes scroll-left {
    from { transform: translateX(0); }
    to   { transform: translateX(-1000px); }
  }

  @keyframes road-dashes {
    to { stroke-dashoffset: 125; }
  }

  @keyframes chain-run {
    to { stroke-dashoffset: -18; }
  }

  @keyframes scarf-flutter {
    0%, 100% { transform: rotate(-1.4deg) skewY(-0.8deg); }
    50%      { transform: rotate(2.2deg) skewY(1.4deg); }
  }

  @keyframes blink {
    0%, 91%, 100% { transform: scaleY(1); }
    94%           { transform: scaleY(0.08); }
    97%           { transform: scaleY(1); }
  }

  @media (max-width: 620px) {
    body { padding: 14px; }
    .frame { width: min(96vw, calc((100svh - 92px) * 5 / 3)); }
    figcaption {
      margin-top: 12px;
      padding: 0 4px;
      font-size: 8px;
      letter-spacing: 0.19em;
    }
    .brand { letter-spacing: 0.22em; }
    .meta { letter-spacing: 0.14em; }
  }

  @media (prefers-reduced-motion: reduce) {
    .scene, figcaption { animation: none; }
    .cloud,
    .sky-bird,
    .sun-rays,
    .scroll-far,
    .scroll-mid,
    .road-dashes,
    .road-dashes-soft,
    .chain-line,
    .scarf-tails,
    .eye-group {
      animation: none;
    }
  }
</style>
</head>

  <script>
    (function () {
      "use strict";

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const byId = (id) => document.getElementById(id);
      const round = (value) => Math.round(value * 100) / 100;

      const crank = { x: 480, y: 451, radius: 38 };
      const wheels = [byId("wheel-rear"), byId("wheel-front")].filter(Boolean);
      const chainring = byId("chainring");

      const far = {
        hip: { x: 426, y: 352 },
        l1: 86,
        l2: 88,
        arm: byId("crank-far-arm"),
        pedal: byId("pedal-far"),
        thighOutline: byId("far-thigh-outline"),
        shinOutline: byId("far-shin-outline"),
        thigh: byId("far-thigh"),
        shin: byId("far-shin"),
        foot: byId("foot-far")
      };

      const near = {
        hip: { x: 436, y: 354 },
        l1: 88,
        l2: 90,
        arm: byId("crank-near-arm"),
        pedal: byId("pedal-near"),
        thighOutline: byId("near-thigh-outline"),
        shinOutline: byId("near-shin-outline"),
        thigh: byId("near-thigh"),
        shin: byId("near-shin"),
        foot: byId("foot-near")
      };

      function solveKnee(hip, ankle, l1, l2) {
        const rawX = ankle.x - hip.x;
        const rawY = ankle.y - hip.y;
        const rawLength = Math.hypot(rawX, rawY) || 1;
        const ux = rawX / rawLength;
        const uy = rawY / rawLength;
        const length = Math.min(Math.max(rawLength, Math.abs(l1 - l2) + 0.01), l1 + l2 - 0.01);
        const along = (l1 * l1 - l2 * l2 + length * length) / (2 * length);
        const height = Math.sqrt(Math.max(0, l1 * l1 - along * along));
        const baseX = hip.x + ux * along;
        const baseY = hip.y + uy * along;
        const optionA = { x: baseX - uy * height, y: baseY + ux * height };
        const optionB = { x: baseX + uy * height, y: baseY - ux * height };

        /* Pelican knees bend toward the front of the bicycle. */
        return optionA.x > optionB.x ? optionA : optionB;
      }

      function drawLeg(leg, pedal, tilt) {
        if (!leg.thigh || !leg.shin || !leg.foot) return;

        const ankle = { x: pedal.x - 4, y: pedal.y - 12 };
        const knee = solveKnee(leg.hip, ankle, leg.l1, leg.l2);
        const thighPath = "M" + round(leg.hip.x) + " " + round(leg.hip.y) + " L" + round(knee.x) + " " + round(knee.y);
        const shinPath = "M" + round(knee.x) + " " + round(knee.y) + " L" + round(ankle.x) + " " + round(ankle.y);

        [leg.thighOutline, leg.thigh].forEach((path) => path && path.setAttribute("d", thighPath));
        [leg.shinOutline, leg.shin].forEach((path) => path && path.setAttribute("d", shinPath));
        leg.foot.setAttribute(
          "transform",
          "translate(" + round(ankle.x) + " " + round(ankle.y) + ") rotate(" + round(tilt) + ")"
        );
      }

      function drawFrame(time) {
        const wheelAngle = ((time * 0.42) % 360).toFixed(2);
        wheels.forEach((wheel) => wheel.setAttribute("transform", "rotate(" + wheelAngle + ")"));

        const crankAngle = (time / 1900) * Math.PI * 2 + 0.8;
        if (chainring) {
          chainring.setAttribute("transform", "rotate(" + ((crankAngle * 180) / Math.PI).toFixed(2) + " 480 451)");
        }

        const nearPedal = {
          x: crank.x + crank.radius * Math.cos(crankAngle),
          y: crank.y + crank.radius * Math.sin(crankAngle)
        };
        const farPedal = {
          x: crank.x - crank.radius * Math.cos(crankAngle),
          y: crank.y - crank.radius * Math.sin(crankAngle)
        };

        if (near.arm) {
          near.arm.setAttribute("x2", round(nearPedal.x));
          near.arm.setAttribute("y2", round(nearPedal.y));
        }
        if (far.arm) {
          far.arm.setAttribute("x2", round(farPedal.x));
          far.arm.setAttribute("y2", round(farPedal.y));
        }
        if (near.pedal) {
          near.pedal.setAttribute("transform", "translate(" + round(nearPedal.x) + " " + round(nearPedal.y) + ")");
        }
        if (far.pedal) {
          far.pedal.setAttribute("transform", "translate(" + round(farPedal.x) + " " + round(farPedal.y) + ")");
        }

        drawLeg(far, farPedal, Math.sin(crankAngle + Math.PI) * 5);
        drawLeg(near, nearPedal, Math.sin(crankAngle) * 5);
      }

      if (reduceMotion) {
        drawFrame(420);
      } else {
        let startTime;
        const animate = (now) => {
          if (startTime === undefined) startTime = now;
          drawFrame(now - startTime);
          window.requestAnimationFrame(animate);
        };
        window.requestAnimationFrame(animate);
      }
    })();
  </script>
