<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · 2D 动画</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1d2530;
  }
  svg {
    width: 92vw;
    max-width: 1000px;
    height: auto;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
  }
</style>
</head>
<body>
<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鹈鹕骑自行车的2D动画">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec9f5"/>
      <stop offset="1" stop-color="#eaf9ff"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#565d66"/>
      <stop offset="1" stop-color="#3f444c"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe7f2"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb054"/>
      <stop offset="1" stop-color="#ff8a1f"/>
    </linearGradient>
  </defs>

  <!-- 天空与太阳 -->
  <rect x="0" y="0" width="1000" height="600" fill="url(#skyGrad)"/>
  <g id="rays" stroke="#ffd76e" stroke-width="4" stroke-linecap="round">
    <line x1="140" y1="42" x2="140" y2="58"/>
    <line x1="140" y1="162" x2="140" y2="178"/>
    <line x1="72" y1="110" x2="88" y2="110"/>
    <line x1="192" y1="110" x2="208" y2="110"/>
    <line x1="93" y1="63" x2="104" y2="74"/>
    <line x1="176" y1="146" x2="187" y2="157"/>
    <line x1="187" y1="63" x2="176" y2="74"/>
    <line x1="104" y1="146" x2="93" y2="157"/>
  </g>
  <circle cx="140" cy="110" r="45" fill="#ffd76e"/>

  <!-- 云 -->
  <g id="cloud1" fill="#ffffff" opacity="0.92">
    <ellipse cx="0" cy="0" rx="36" ry="16"/><ellipse cx="28" cy="4" rx="26" ry="13"/><ellipse cx="-27" cy="5" rx="24" ry="12"/>
  </g>
  <g id="cloud2" fill="#ffffff" opacity="0.85">
    <ellipse cx="0" cy="0" rx="42" ry="17"/><ellipse cx="34" cy="5" rx="28" ry="13"/><ellipse cx="-32" cy="6" rx="26" ry="12"/>
  </g>
  <g id="cloud3" fill="#ffffff" opacity="0.8">
    <ellipse cx="0" cy="0" rx="30" ry="13"/><ellipse cx="22" cy="4" rx="22" ry="11"/><ellipse cx="-22" cy="4" rx="20" ry="10"/>
  </g>

  <!-- 远山与草地 -->
  <path d="M0 478 Q200 372 420 478 Q640 382 860 478 Q1040 402 1280 478 L1280 500 L0 500 Z" fill="#b7e3a0"/>
  <path d="M0 486 Q250 430 520 486 Q780 436 1280 486 L1280 500 L0 500 Z" fill="#a5d98d"/>
  <rect x="0" y="472" width="1000" height="18" fill="#8fd071"/>
  <g id="bush1" fill="#6cb85f">
    <ellipse cx="0" cy="474" rx="26" ry="14"/><ellipse cx="20" cy="478" rx="20" ry="11"/><ellipse cx="-20" cy="478" rx="18" ry="10"/>
  </g>
  <g id="bush2" fill="#5aab4e">
    <ellipse cx="0" cy="476" rx="20" ry="11"/><ellipse cx="16" cy="479" rx="15" ry="9"/><ellipse cx="-16" cy="479" rx="14" ry="8"/>
  </g>

  <!-- 公路 -->
  <rect x="0" y="490" width="1000" height="110" fill="url(#roadGrad)"/>
  <rect x="0" y="490" width="1000" height="7" fill="#6b7280"/>
  <line id="roadDash" x1="-80" y1="546" x2="1080" y2="546" stroke="#f4d35e" stroke-width="7" stroke-dasharray="55 45" stroke-linecap="round"/>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round">
    <line class="speedline" x1="150" y1="258" x2="212" y2="258"/>
    <line class="speedline" x1="128" y1="300" x2="200" y2="300"/>
    <line class="speedline" x1="158" y1="342" x2="216" y2="342"/>
  </g>

  <!-- 远侧腿（在车架后面） -->
  <path id="legF" fill="none" stroke="#d9821b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path id="footF" d="M-13 2 Q0 -4 13 3 Q18 6 12 9 L-12 9 Q-16 6 -13 2 Z" fill="#d9821b"/>

  <!-- 自行车 -->
  <g id="bike">
    <!-- 后轮 -->
    <g transform="translate(330 430)">
      <circle r="70" fill="none" stroke="#2b2f36" stroke-width="14"/>
      <circle r="58" fill="none" stroke="#9aa3ad" stroke-width="4"/>
      <g id="spokesR" stroke="#c6ccd4" stroke-width="2.5">
        <line x1="-58" y1="0" x2="58" y2="0"/>
        <line x1="0" y1="-58" x2="0" y2="58"/>
        <line x1="-41" y1="-41" x2="41" y2="41"/>
        <line x1="-41" y1="41" x2="41" y2="-41"/>
        <circle cx="0" cy="-48" r="4" fill="#e05252" stroke="none"/>
      </g>
      <circle r="8" fill="#565d66"/>
    </g>
    <!-- 前轮 -->
    <g transform="translate(630 430)">
      <circle r="70" fill="none" stroke="#2b2f36" stroke-width="14"/>
      <circle r="58" fill="none" stroke="#9aa3ad" stroke-width="4"/>
      <g id="spokesF" stroke="#c6ccd4" stroke-width="2.5">
        <line x1="-58" y1="0" x2="58" y2="0"/>
        <line x1="0" y1="-58" x2="0" y2="58"/>
        <line x1="-41" y1="-41" x2="41" y2="41"/>
        <line x1="-41" y1="41" x2="41" y2="-41"/>
        <circle cx="0" cy="-48" r="4" fill="#e05252" stroke="none"/>
      </g>
      <circle r="8" fill="#565d66"/>
    </g>

    <!-- 链条 -->
    <line id="chain" x1="330" y1="421" x2="465" y2="424" stroke="#3a3f46" stroke-width="4.5" stroke-dasharray="7 5"/>
    <line x1="330" y1="439" x2="465" y2="456" stroke="#3a3f46" stroke-width="4.5" stroke-dasharray="7 5"/>
    <circle cx="330" cy="430" r="9" fill="#565d66" stroke="#3a3f46" stroke-width="2"/>

    <!-- 远侧曲柄与踏板 -->
    <g transform="translate(465 440)">
      <g id="crankF"><line x1="0" y1="0" x2="45" y2="0" stroke="#a83535" stroke-width="9" stroke-linecap="round"/></g>
    </g>
    <rect id="pedalF" x="-16" y="-5" width="32" height="10" rx="3" fill="#1c2026"/>

    <!-- 车架 -->
    <g stroke="#e05252" stroke-width="10" stroke-linecap="round" fill="none">
      <line x1="465" y1="440" x2="330" y2="430"/>
      <line x1="330" y1="430" x2="428" y2="338"/>
      <line x1="465" y1="440" x2="424" y2="332"/>
      <line x1="465" y1="440" x2="590" y2="340"/>
      <line x1="428" y1="345" x2="580" y2="330"/>
      <line x1="590" y1="340" x2="630" y2="430"/>
    </g>
    <line x1="578" y1="318" x2="590" y2="340" stroke="#e05252" stroke-width="13" stroke-linecap="round"/>
    <line x1="578" y1="318" x2="586" y2="304" stroke="#565d66" stroke-width="7" stroke-linecap="round"/>
    <path d="M586 304 Q590 296 578 294 L560 293" fill="none" stroke="#2b2f36" stroke-width="7" stroke-linecap="round"/>
    <circle cx="560" cy="293" r="5.5" fill="#23272e"/>

    <!-- 座杆与车座 -->
    <line x1="424" y1="332" x2="421" y2="316" stroke="#565d66" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="418" cy="310" rx="30" ry="10" fill="#3a3f46"/>

    <!-- 近侧牙盘、曲柄与踏板 -->
    <circle cx="465" cy="440" r="16" fill="#565d66" stroke="#3a3f46" stroke-width="2.5"/>
    <g transform="translate(465 440)">
      <g id="crankN"><line x1="0" y1="0" x2="45" y2="0" stroke="#e05252" stroke-width="9" stroke-linecap="round"/></g>
      <circle r="6" fill="#d7dce2"/>
    </g>
    <rect id="pedalN" x="-16" y="-5" width="32" height="10" rx="3" fill="#2b2f36"/>
  </g>

  <!-- 鹈鹕（随踏频上下起伏） -->
  <g id="pelican">
    <!-- 尾羽 -->
    <path d="M352 240 L296 226 L344 264 Z" fill="#e4edf5" stroke="#c9d6e2" stroke-width="1.5"/>
    <path d="M350 272 L300 274 L342 292 Z" fill="#e4edf5" stroke="#c9d6e2" stroke-width="1.5"/>
    <!-- 身体 -->
    <path d="M340 265 Q340 205 420 202 Q505 200 512 258 Q515 305 445 322 Q365 330 340 265 Z"
          fill="url(#bodyGrad)" stroke="#c9d6e2" stroke-width="2"/>
    <!-- 翅膀（搭在车把上） -->
    <path d="M452 238 Q520 250 560 292 Q572 304 560 306 Q510 302 470 278 Q444 260 452 238 Z"
          fill="#e2ecf6" stroke="#c9d6e2" stroke-width="2"/>
    <path d="M470 262 Q510 276 548 298" fill="none" stroke="#c9d6e2" stroke-width="1.5"/>
    <path d="M462 274 Q500 288 532 304" fill="none" stroke="#c9d6e2" stroke-width="1.5"/>
    <!-- 脖子 -->
    <path d="M472 228 Q515 205 545 192" fill="none" stroke="#c9d6e2" stroke-width="34" stroke-linecap="round"/>
    <path d="M472 228 Q515 205 545 192" fill="none" stroke="#fbfdff" stroke-width="28" stroke-linecap="round"/>
    <!-- 头 -->
    <circle cx="555" cy="185" r="26" fill="#fbfdff" stroke="#c9d6e2" stroke-width="2"/>
    <!-- 头盔 -->
    <ellipse cx="555" cy="159" rx="30" ry="13" fill="#e05252"/>
    <path d="M540 150 Q555 145 570 150" fill="none" stroke="#ffd76e" stroke-width="3" stroke-linecap="round"/>
    <!-- 大嘴与喉囊 -->
    <path d="M560 176 Q625 182 672 205 L668 213 Q615 197 558 191 Z" fill="url(#beakGrad)" stroke="#e8820c" stroke-width="1"/>
    <path d="M562 192 Q640 200 662 210 Q664 232 630 240 Q585 244 566 214 Z" fill="#ff8a1f" stroke="#e0740c" stroke-width="1"/>
    <!-- 眼睛 -->
    <circle cx="549" cy="179" r="7.5" fill="#ffffff" stroke="#c9d6e2" stroke-width="1"/>
    <circle cx="552" cy="180" r="4" fill="#2b2f36"/>
    <circle cx="550" cy="177.5" r="1.4" fill="#ffffff"/>
  </g>

  <!-- 近侧腿与脚（踩在近侧踏板上） -->
  <path id="legN" fill="none" stroke="#ff9f2e" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path id="footN" d="M-13 2 Q0 -4 13 3 Q18 6 12 9 L-12 9 Q-16 6 -13 2 Z" fill="#ff9f2e" stroke="#e0740c" stroke-width="1"/>
</svg>

<script>
(function () {
  const S = id => document.getElementById(id);
  const legN = S('legN'), legF = S('legF'), footN = S('footN'), footF = S('footF');
  const pedalN = S('pedalN'), pedalF = S('pedalF');
  const crankN = S('crankN'), crankF = S('crankF');
  const spokesR = S('spokesR'), spokesF = S('spokesF');
  const pelican = S('pelican'), roadDash = S('roadDash'), chain = S('chain'), rays = S('rays');
  const clouds = [S('cloud1'), S('cloud2'), S('cloud3')];
  const bushes = [S('bush1'), S('bush2')];
  const speedLines = Array.from(document.querySelectorAll('.speedline'));

  // 几何参数：曲柄中心、曲柄半径、髋关节、大小腿长度
  const CX = 465, CY = 440, R = 45, L1 = 95, L2 = 95, HX = 420, HY = 325;
  const DEG = 180 / Math.PI;

  // 两段式反向运动学：由髋与脚位置求膝盖，膝盖朝前（bend=1）
  function solveKnee(hx, hy, fx, fy) {
    let dx = fx - hx, dy = fy - hy;
    let d = Math.hypot(dx, dy);
    d = Math.max(Math.min(d, L1 + L2 - 0.5), Math.abs(L1 - L2) + 0.5);
    const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    const ux = dx / d, uy = dy / d;
    return [hx + ux * a + uy * h, hy + uy * a - ux * h];
  }

  function setLeg(leg, foot, hx, hy, px, py) {
    const fx = px, fy = py - 7;                 // 踩在踏板面上
    const [kx, ky] = solveKnee(hx, hy, fx, fy);
    leg.setAttribute('d', 'M' + hx + ' ' + hy + ' L' + kx.toFixed(1) + ' ' + ky.toFixed(1) + ' L' + fx + ' ' + fy);
    foot.setAttribute('transform', 'translate(' + fx + ' ' + (py - 3) + ')');
  }

  function wrap(x) { return ((x % 1150) + 1150) % 1150 - 75; }

  let t0 = performance.now();
  function frame(now) {
    const t = (now - t0) / 1000;
    const th = 1.7 * t;                          // 曲柄角速度
    const deg = th * DEG;
    const wheelDeg = deg * 2.4;                  // 齿比 → 车轮转速

    crankN.setAttribute('transform', 'rotate(' + deg + ')');
    crankF.setAttribute('transform', 'rotate(' + (deg + 180) + ')');
    spokesR.setAttribute('transform', 'rotate(' + wheelDeg + ')');
    spokesF.setAttribute('transform', 'rotate(' + wheelDeg + ')');
    roadDash.setAttribute('stroke-dashoffset', (-280 * t) % 100);
    chain.setAttribute('stroke-dashoffset', (-90 * t) % 24);
    rays.setAttribute('transform', 'rotate(' + ((t * 4) % 360) + ' 140 110)');

    const bob = 3 * Math.sin(2 * th);            // 蹬踏带来的身体起伏
    pelican.setAttribute('transform', 'translate(0 ' + bob.toFixed(2) + ')');

    const hx = HX, hy = HY + bob;
    const px1 = CX + R * Math.cos(th), py1 = CY + R * Math.sin(th);
    const px2 = CX - R * Math.cos(th), py2 = CY - R * Math.sin(th);
    setLeg(legN, footN, hx, hy, px1, py1);
    setLeg(legF, footF, hx, hy, px2, py2);
    pedalN.setAttribute('transform', 'translate(' + px1.toFixed(1) + ' ' + py1.toFixed(1) + ')');
    pedalF.setAttribute('transform', 'translate(' + px2.toFixed(1) + ' ' + py2.toFixed(1) + ')');

    const cx = [12, 18, 9], cy = [95, 160, 60], x0 = [150, 620, 880];
    clouds.forEach((c, i) => c.setAttribute('transform',
      'translate(' + wrap(x0[i] - cx[i] * t).toFixed(1) + ' ' + cy[i] + ')'));
    bushes.forEach((b, i) => b.setAttribute('transform',
      'translate(' + wrap(i * 520 - 280 * t).toFixed(1) + ' 0)'));
    speedLines.forEach((l, i) =>
      l.setAttribute('opacity', (0.25 + 0.25 * Math.sin(t * 7 + i * 2)).toFixed(2)));

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
