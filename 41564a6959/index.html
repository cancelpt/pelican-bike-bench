<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #e9f4fb;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg {
    width: min(960px, 96vw);
    height: auto;
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(40, 80, 120, .18);
    background: #cfeefb;
  }

  /* ---- CSS 动画部分 ---- */
  /* 地面速度线：向后移动营造前进感 */
  .dashline {
    stroke-dasharray: 42 58;
    animation: dashmove .8s linear infinite;
  }
  @keyframes dashmove {
    to { stroke-dashoffset: -100; }
  }

  /* 灌木丛循环滚动（两份拼接，平移一个拼接宽度后无缝循环） */
  .bushes { animation: scroll-bushes 7s linear infinite; }
  @keyframes scroll-bushes {
    to { transform: translateX(-900px); }
  }

  /* 云朵循环漂移 */
  .cloud-slow { animation: drift1 70s linear infinite; }
  .cloud-fast { animation: drift2 45s linear infinite; }
  @keyframes drift1 { to { transform: translateX(-1300px); } }
  @keyframes drift2 { to { transform: translateX(-1300px); } }
</style>
</head>
<body>

<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车前进">
  <title>鹈鹕骑自行车</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aee3f7"/>
      <stop offset="1" stop-color="#eaf9ff"/>
    </linearGradient>
  </defs>

  <!-- ===== 背景 ===== -->
  <rect x="0" y="0" width="900" height="600" fill="url(#sky)"/>

  <!-- 太阳（光芒缓慢旋转） -->
  <g>
    <g stroke="#FFD93B" stroke-width="6" stroke-linecap="round">
      <line x1="760" y1="38"  x2="760" y2="22"/>
      <line x1="760" y1="182" x2="760" y2="198"/>
      <line x1="688" y1="110" x2="672" y2="110"/>
      <line x1="832" y1="110" x2="848" y2="110"/>
      <line x1="709" y1="59"  x2="698" y2="48"/>
      <line x1="811" y1="161" x2="822" y2="172"/>
      <line x1="811" y1="59"  x2="822" y2="48"/>
      <line x1="709" y1="161" x2="698" y2="172"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 760 110" to="360 760 110" dur="60s" repeatCount="indefinite"/>
    </g>
    <circle cx="760" cy="110" r="42" fill="#FFD93B"/>
    <circle cx="760" cy="110" r="42" fill="#FFE98A" opacity=".5"/>
  </g>

  <!-- 云（两份相同内容拼接，循环平移） -->
  <g class="cloud-slow" fill="#ffffff" opacity=".92">
    <g>
      <circle cx="150" cy="90" r="24"/><circle cx="182" cy="82" r="30"/>
      <circle cx="216" cy="92" r="22"/>
      <rect x="132" y="88" width="104" height="26" rx="13"/>
    </g>
    <g transform="translate(1300,0)">
      <circle cx="150" cy="90" r="24"/><circle cx="182" cy="82" r="30"/>
      <circle cx="216" cy="92" r="22"/>
      <rect x="132" y="88" width="104" height="26" rx="13"/>
    </g>
  </g>
  <g class="cloud-fast" fill="#ffffff" opacity=".8">
    <g>
      <circle cx="620" cy="170" r="18"/><circle cx="646" cy="162" r="24"/>
      <circle cx="674" cy="172" r="17"/>
      <rect x="606" y="168" width="84" height="20" rx="10"/>
    </g>
    <g transform="translate(1300,0)">
      <circle cx="620" cy="170" r="18"/><circle cx="646" cy="162" r="24"/>
      <circle cx="674" cy="172" r="17"/>
      <rect x="606" y="168" width="84" height="20" rx="10"/>
    </g>
  </g>

  <!-- ===== 地面 ===== -->
  <rect x="0" y="470" width="900" height="14" fill="#7FBF6A"/>
  <rect x="0" y="484" width="900" height="116" fill="#D9C08A"/>
  <line x1="0" y1="470" x2="900" y2="470" stroke="#5d9e4e" stroke-width="4"/>

  <!-- 滚动的灌木丛 -->
  <g class="bushes">
    <g fill="#6FB35C" stroke="#56994a" stroke-width="3">
      <circle cx="80"  cy="458" r="20"/><circle cx="104" cy="462" r="14"/>
      <circle cx="300" cy="460" r="16"/><circle cx="322" cy="464" r="11"/>
      <circle cx="520" cy="456" r="22"/><circle cx="548" cy="462" r="15"/>
      <circle cx="740" cy="460" r="15"/><circle cx="762" cy="464" r="10"/>
      <circle cx="860" cy="458" r="18"/><circle cx="884" cy="463" r="12"/>
    </g>
    <g transform="translate(900,0)" fill="#6FB35C" stroke="#56994a" stroke-width="3">
      <circle cx="80"  cy="458" r="20"/><circle cx="104" cy="462" r="14"/>
      <circle cx="300" cy="460" r="16"/><circle cx="322" cy="464" r="11"/>
      <circle cx="520" cy="456" r="22"/><circle cx="548" cy="462" r="15"/>
      <circle cx="740" cy="460" r="15"/><circle cx="762" cy="464" r="10"/>
      <circle cx="860" cy="458" r="18"/><circle cx="884" cy="463" r="12"/>
    </g>
  </g>

  <!-- 地面速度线 -->
  <g stroke="#B6985C" stroke-width="5" stroke-linecap="round">
    <line class="dashline" x1="0" y1="505" x2="900" y2="505"/>
    <line class="dashline" x1="0" y1="540" x2="900" y2="540" style="animation-duration:.65s"/>
    <line class="dashline" x1="0" y1="572" x2="900" y2="572" style="animation-duration:1.1s"/>
  </g>

  <!-- 车轮阴影 -->
  <ellipse cx="300" cy="472" rx="82" ry="6" fill="rgba(0,0,0,.08)"/>
  <ellipse cx="560" cy="472" rx="82" ry="6" fill="rgba(0,0,0,.08)"/>

  <!-- ===== 自行车 ===== -->
  <!-- 后轮 -->
  <g>
    <circle cx="300" cy="400" r="70" fill="none" stroke="#2b2b2b" stroke-width="10"/>
    <circle cx="300" cy="400" r="58" fill="#F4F6F7" stroke="#9AA0A6" stroke-width="4"/>
    <g stroke="#7d848c" stroke-width="3">
      <line x1="244" y1="400" x2="356" y2="400"/>
      <line x1="300" y1="344" x2="300" y2="456"/>
      <line x1="260.4" y1="360.4" x2="339.6" y2="439.6"/>
      <line x1="339.6" y1="360.4" x2="260.4" y2="439.6"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 300 400" to="360 300 400" dur="2s" repeatCount="indefinite"/>
    </g>
    <circle cx="300" cy="400" r="7" fill="#555"/>
  </g>

  <!-- 前轮 -->
  <g>
    <circle cx="560" cy="400" r="70" fill="none" stroke="#2b2b2b" stroke-width="10"/>
    <circle cx="560" cy="400" r="58" fill="#F4F6F7" stroke="#9AA0A6" stroke-width="4"/>
    <g stroke="#7d848c" stroke-width="3">
      <line x1="504" y1="400" x2="616" y2="400"/>
      <line x1="560" y1="344" x2="560" y2="456"/>
      <line x1="520.4" y1="360.4" x2="599.6" y2="439.6"/>
      <line x1="599.6" y1="360.4" x2="520.4" y2="439.6"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 560 400" to="360 560 400" dur="2s" repeatCount="indefinite"/>
    </g>
    <circle cx="560" cy="400" r="7" fill="#555"/>
  </g>

  <!-- 车架 -->
  <g stroke="#2E9BB8" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="300" y1="400" x2="430" y2="385"/>   <!-- 后下叉 -->
    <line x1="430" y1="385" x2="368" y2="300"/>   <!-- 座管 -->
    <line x1="368" y1="300" x2="300" y2="400" stroke-width="5"/> <!-- 后上叉 -->
    <line x1="430" y1="385" x2="545" y2="290"/>   <!-- 下管 -->
    <line x1="372" y1="302" x2="545" y2="290"/>   <!-- 上管 -->
    <line x1="548" y1="299" x2="560" y2="400"/>   <!-- 前叉 -->
  </g>
  <!-- 车把 -->
  <line x1="545" y1="290" x2="538" y2="248" stroke="#2E9BB8" stroke-width="6" stroke-linecap="round"/>
  <line x1="538" y1="248" x2="514" y2="241" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <circle cx="514" cy="241" r="6" fill="#333"/>
  <!-- 车座 -->
  <line x1="368" y1="306" x2="362" y2="290" stroke="#888" stroke-width="5"/>
  <ellipse cx="356" cy="288" rx="24" ry="7" fill="#6B4423"/>

  <!-- 链条与牙盘 -->
  <circle cx="300" cy="400" r="8" fill="#ccc" stroke="#555" stroke-width="3"/>
  <line x1="300" y1="392" x2="430" y2="369" stroke="#666" stroke-width="3"/>
  <line x1="300" y1="408" x2="430" y2="401" stroke="#666" stroke-width="3"/>
  <circle cx="430" cy="385" r="16" fill="#EFEFEF" stroke="#555" stroke-width="4"/>

  <!-- ===== 曲柄组（含鹈鹕的腿和脚，绕中轴整圈旋转） ===== -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      from="0 430 385" to="360 430 385" dur="2s" repeatCount="indefinite"/>

    <!-- 远侧（左）曲柄 + 左腿 + 左脚 -->
    <line x1="430" y1="385" x2="400" y2="385" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <rect x="376" y="379" width="24" height="7" rx="3" fill="#222"/>
    <line x1="445" y1="435" x2="400" y2="385" stroke="#F5A623" stroke-width="10" stroke-linecap="round"/>
    <circle cx="445" cy="435" r="5.5" fill="#F5A623"/>
    <polygon points="398,378 434,383 438,389 414,394 396,390"
      fill="#F5A623" stroke="#D98A1F" stroke-width="1.5"/>

    <!-- 近侧（右）曲柄 + 右腿 + 右脚 -->
    <line x1="430" y1="385" x2="460" y2="385" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <rect x="448" y="379" width="24" height="7" rx="3" fill="#222"/>
    <line x1="415" y1="335" x2="460" y2="385" stroke="#F5A623" stroke-width="10" stroke-linecap="round"/>
    <circle cx="415" cy="335" r="5.5" fill="#F5A623"/>
    <polygon points="452,378 488,383 492,389 468,394 450,390"
      fill="#F5A623" stroke="#D98A1F" stroke-width="1.5"/>

    <circle cx="430" cy="385" r="5" fill="#333"/>
  </g>

  <!-- ===== 鹈鹕（整体轻微上下颠动） ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -4; 0 0" dur="1s" repeatCount="indefinite"/>

    <!-- 尾巴 -->
    <polygon points="318,222 262,196 280,220 258,218 310,244"
      fill="#E9EBEE" stroke="#C9CCD1" stroke-width="2"/>

    <!-- 身体 -->
    <ellipse cx="395" cy="240" rx="92" ry="60" fill="#FAFAF7" stroke="#D8D8D3" stroke-width="2"/>

    <!-- 翅膀（握住车把，轻轻扇动） -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-3 400 232; 5 400 232; -3 400 232" dur="2s" repeatCount="indefinite"/>
      <path d="M398,228 C440,208 496,220 532,244 C524,252 516,256 506,256
               C460,260 420,258 396,254 Z"
        fill="#E9EBEE" stroke="#C9CCD1" stroke-width="2"/>
      <circle cx="524" cy="245" r="8" fill="#E9EBEE" stroke="#C9CCD1" stroke-width="2"/>
    </g>

    <!-- 脖子 + 头（整体轻微点头） -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 458 212; -3 458 212; 0 458 212" dur="2s" repeatCount="indefinite"/>

      <!-- 脖子 -->
      <path d="M458,216 C482,200 474,170 494,148"
        stroke="#FAFAF7" stroke-width="24" stroke-linecap="round" fill="none"/>

      <!-- 头 -->
      <circle cx="500" cy="134" r="23" fill="#FAFAF7" stroke="#D8D8D3" stroke-width="2"/>
      <!-- 头顶小羽冠 -->
      <polygon points="484,116 468,98 478,118 466,108 482,124"
        fill="#FAFAF7" stroke="#D8D8D3" stroke-width="1.5"/>

      <!-- 围巾 -->
      <path d="M462,154 Q478,146 492,154 L490,166 Q476,158 464,164 Z" fill="#E2574C"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0 462 158; -7 462 158; 0 462 158" dur="1s" repeatCount="indefinite"/>
        <polygon points="464,156 420,142 402,156 430,168 462,164" fill="#E2574C"/>
      </g>

      <!-- 眼睛（会眨眼） -->
      <ellipse cx="505" cy="127" rx="3.8" ry="4.2" fill="#222">
        <animate attributeName="ry" values="4.2;4.2;0.4;4.2;4.2"
          keyTimes="0;0.88;0.92;0.96;1" dur="5s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="506.5" cy="125.5" r="1.3" fill="#fff"/>

      <!-- 上喙 -->
      <path d="M514,122 C540,126 600,140 632,152 C636,155 632,160 626,160
               C600,156 548,148 516,146 Z"
        fill="#FFC93C" stroke="#E0A92E" stroke-width="2"/>
      <!-- 喉囊 -->
      <path d="M516,146 C560,150 606,156 626,160 C622,186 590,200 556,194
               C532,190 518,172 516,146 Z"
        fill="#FF9F45" stroke="#E0A92E" stroke-width="2"/>
    </g>
  </g>
</svg>

</body>
</html>
