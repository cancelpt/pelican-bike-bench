<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(#cfe8ff, #ffffff);
  }
  svg {
    max-width: 96vw;
    max-height: 96vh;
  }
</style>
</head>
<body>

<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只白鹈鹕骑着一辆红色自行车">
  <defs>
    <!-- 天空渐变 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ecdf0"/>
      <stop offset="0.65" stop-color="#cfe9fa"/>
      <stop offset="1" stop-color="#eaf6ff"/>
    </linearGradient>

    <!-- 云朵（颜色由 use 处继承） -->
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="30" ry="18"/>
      <ellipse cx="26" cy="-12" rx="26" ry="18"/>
      <ellipse cx="52" cy="-2" rx="28" ry="20"/>
      <ellipse cx="74" cy="-10" rx="18" ry="12"/>
      <ellipse cx="36" cy="6" rx="54" ry="16"/>
    </g>

    <!-- 车轮（以轮心为原点） -->
    <g id="wheel">
      <circle r="58" fill="none" stroke="#353a3f" stroke-width="9"/>
      <circle r="50" fill="none" stroke="#8a919a" stroke-width="2.5"/>
      <!-- 8 根辐条 -->
      <line x1="46" y1="0" x2="7" y2="0" stroke="#9aa1a8" stroke-width="2"/>
      <line x1="32.5" y1="32.5" x2="4.9" y2="4.9" stroke="#9aa1a8" stroke-width="2"/>
      <line x1="0" y1="46" x2="0" y2="7" stroke="#9aa1a8" stroke-width="2"/>
      <line x1="-32.5" y1="32.5" x2="-4.9" y2="4.9" stroke="#9aa1a8" stroke-width="2"/>
      <line x1="-46" y1="0" x2="-7" y2="0" stroke="#9aa1a8" stroke-width="2"/>
      <line x1="-32.5" y1="-32.5" x2="-4.9" y2="-4.9" stroke="#9aa1a8" stroke-width="2"/>
      <line x1="0" y1="-46" x2="0" y2="-7" stroke="#9aa1a8" stroke-width="2"/>
      <line x1="32.5" y1="-32.5" x2="4.9" y2="-4.9" stroke="#9aa1a8" stroke-width="2"/>
      <circle r="6" fill="#6a7076"/>
    </g>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="900" height="600" fill="url(#sky)"/>

  <!-- 太阳（光芒缓慢旋转） -->
  <g transform="translate(812,86)">
    <circle r="56" fill="#ffd166" opacity="0.25"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="48s" repeatCount="indefinite"/>
      <circle r="44" fill="#ffd166"/>
      <g stroke="#ffd166" stroke-width="5" stroke-linecap="round">
        <line x1="60" y1="0" x2="74" y2="0"/>
        <line x1="42.4" y1="42.4" x2="52.3" y2="52.3"/>
        <line x1="0" y1="60" x2="0" y2="74"/>
        <line x1="-42.4" y1="42.4" x2="-52.3" y2="52.3"/>
        <line x1="-60" y1="0" x2="-74" y2="0"/>
        <line x1="-42.4" y1="-42.4" x2="-52.3" y2="-52.3"/>
        <line x1="0" y1="-60" x2="0" y2="-74"/>
        <line x1="42.4" y1="-42.4" x2="52.3" y2="-52.3"/>
      </g>
    </g>
  </g>

  <!-- 飘动的云 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-220 118; 1120 118" dur="46s" repeatCount="indefinite"/>
    <use href="#cloud" fill="#ffffff"/>
  </g>
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="-300 62; 1200 62" dur="62s" begin="-25s" repeatCount="indefinite"/>
    <use href="#cloud" fill="#f4faff" transform="scale(0.75)"/>
  </g>
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="-260 196; 1160 196" dur="78s" begin="-40s" repeatCount="indefinite"/>
    <use href="#cloud" fill="#ffffff" transform="scale(0.9)"/>
  </g>

  <!-- 草地与马路 -->
  <rect x="0" y="478" width="900" height="36" fill="#83c982"/>
  <rect x="0" y="478" width="900" height="4" fill="#6fba6e"/>
  <rect x="0" y="510" width="900" height="90" fill="#98a0a8"/>
  <rect x="0" y="510" width="900" height="7" fill="#7f8892"/>

  <!-- 马路虚线（左移，暗示前进） -->
  <line x1="-20" y1="558" x2="920" y2="558" stroke="#f2f2f2" stroke-width="6" stroke-dasharray="40 30">
    <animate attributeName="stroke-dashoffset" from="0" to="-420" dur="1s" repeatCount="indefinite"/>
  </line>

  <!-- 车后的速度线 -->
  <g stroke="#9fc2e8" stroke-width="5" stroke-linecap="round" stroke-dasharray="24 76">
    <animate attributeName="stroke-dashoffset" from="0" to="-300" dur="0.7s" repeatCount="indefinite"/>
    <line x1="30" y1="355" x2="170" y2="355"/>
    <line x1="55" y1="390" x2="170" y2="390"/>
    <line x1="30" y1="425" x2="150" y2="425"/>
  </g>

  <!-- 阴影 -->
  <ellipse cx="395" cy="516" rx="205" ry="9" fill="#000000" opacity="0.12"/>

  <!-- 后轮 -->
  <g transform="translate(230,450)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- 前轮 -->
  <g transform="translate(560,450)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- 飞轮 / 链条 -->
  <circle cx="230" cy="450" r="11" fill="none" stroke="#7d848c" stroke-width="4"/>
  <circle cx="380" cy="450" r="7.5" fill="#5a5f66"/>
  <circle cx="380" cy="450" r="21" fill="none" stroke="#7d848c" stroke-width="4"/>
  <line x1="230" y1="441" x2="380" y2="431" stroke="#6b7178" stroke-width="2.5"/>
  <line x1="230" y1="459" x2="380" y2="469" stroke="#6b7178" stroke-width="2.5"/>

  <!-- 车架（珊瑚红） -->
  <g stroke="#e05252" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="230" y1="450" x2="380" y2="450"/>
    <line x1="230" y1="450" x2="302" y2="331"/>
    <line x1="380" y1="450" x2="302" y2="333"/>
    <line x1="302" y1="330" x2="527" y2="324"/>
    <line x1="380" y1="450" x2="525" y2="364"/>
    <line x1="530" y1="318" x2="526" y2="368" stroke-width="10"/>
    <path d="M 528,346 C 516,396 524,428 557,447" stroke-width="7"/>
  </g>

  <!-- 座管与车座 -->
  <line x1="305" y1="332" x2="301" y2="316" stroke="#555" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="297" cy="311" rx="26" ry="9" fill="#4b4b4b" transform="rotate(-6 297 311)"/>

  <!-- 车把 -->
  <line x1="529" y1="322" x2="547" y2="283" stroke="#4d5258" stroke-width="7" stroke-linecap="round"/>
  <path d="M 547,283 C 566,269 588,271 594,281" fill="none" stroke="#4d5258" stroke-width="7" stroke-linecap="round"/>
  <line x1="584" y1="275" x2="596" y2="284" stroke="#333" stroke-width="8" stroke-linecap="round"/>

  <!-- 曲柄与脚踏（绕中轴旋转） -->
  <g transform="translate(380,450)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="28" stroke="#555" stroke-width="7" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="0" y2="-28" stroke="#555" stroke-width="7" stroke-linecap="round"/>
      <rect x="-16" y="24" width="32" height="8" rx="2" fill="#444"/>
      <rect x="-16" y="-32" width="32" height="8" rx="2" fill="#444"/>
    </g>
  </g>

  <!-- 鹈鹕整体（轻微起伏 + 前后摇摆） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-1.2 300 330; 1.2 300 330; -1.2 300 330" dur="0.9s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="0.9s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>

      <!-- 尾部羽毛（轻轻摇摆） -->
      <g fill="#e9e0c8">
        <animateTransform attributeName="transform" type="rotate" values="-4 200 275; 4 200 275; -4 200 275" dur="1.6s" repeatCount="indefinite"/>
        <ellipse cx="188" cy="288" rx="36" ry="9" transform="rotate(24 188 288)"/>
        <ellipse cx="180" cy="304" rx="33" ry="8" transform="rotate(36 180 304)"/>
        <ellipse cx="182" cy="318" rx="28" ry="7" transform="rotate(48 182 318)"/>
      </g>

      <!-- 身体 -->
      <ellipse cx="285" cy="265" rx="88" ry="74" fill="#f7f3e8" stroke="#e4dcc8" stroke-width="1.5"/>

      <!-- 腿（绕髋部前后摆，轴点随身体起伏） -->
      <!-- 远侧腿 -->
      <g transform="translate(306,334)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-29; -40; -29" dur="0.9s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
          <path d="M 0,0 Q 18,78 -10,134" fill="none" stroke="#dd9130" stroke-width="9" stroke-linecap="round"/>
          <path d="M -12,132 L -30,143 Q -18,153 -2,145 Z" fill="#dd9130" stroke="#b26f1d" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M -15,138 L -23,146 M -8,141 L -12,148" stroke="#b26f1d" stroke-width="1.5" stroke-linecap="round"/>
        </g>
      </g>

      <!-- 近侧腿 -->
      <g transform="translate(292,332)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-40; -29; -40" dur="0.9s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
          <path d="M 0,0 Q 16,76 -12,132" fill="none" stroke="#f2a63c" stroke-width="9" stroke-linecap="round"/>
          <path d="M -14,130 L -32,142 Q -20,152 -4,144 Z" fill="#f2a63c" stroke="#d98a26" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M -17,137 L -25,145 M -10,140 L -14,147" stroke="#d98a26" stroke-width="1.5" stroke-linecap="round"/>
        </g>
      </g>

      <!-- 翅膀（缓慢拍动） -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-8 290 250; -1 290 250; -8 290 250" dur="1.6s" repeatCount="indefinite"/>
        <ellipse cx="300" cy="252" rx="55" ry="26" fill="#e9e0c8" transform="rotate(-10 300 252)"/>
      </g>

      <!-- 颈部（粗描边） -->
      <path d="M 328,224 C 352,164 412,124 452,146" fill="none" stroke="#faf6ec" stroke-width="26" stroke-linecap="round"/>

      <!-- 头 -->
      <g>
        <circle cx="455" cy="133" r="27" fill="#faf6ec" stroke="#e4dcc8" stroke-width="1.5"/>
        <!-- 头冠 -->
        <path d="M 439,108 Q 445,96 455,103 Q 449,102 451,111 Z" fill="#f3ecd9"/>
        <!-- 眨眼 -->
        <g transform="translate(466,122)">
          <g>
            <animateTransform attributeName="transform" type="scale" values="1 1; 1 0.06; 1 1" dur="3.6s" keyTimes="0;0.04;0.08" repeatCount="indefinite"/>
            <circle r="5" fill="#333333"/>
            <circle cx="2" cy="-1.6" r="1.7" fill="#ffffff"/>
          </g>
        </g>
        <!-- 上喙 -->
        <path d="M 473,121 Q 515,109 560,127 Q 528,123 479,131 Z" fill="#f3a53a" stroke="#d98a26" stroke-width="1.5" stroke-linejoin="round"/>
        <!-- 喉囊 -->
        <path d="M 478,131 C 488,174 527,188 551,151 C 532,149 512,143 497,136 Z" fill="#ef8a68" stroke="#e07756" stroke-width="1.5" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- 标题 -->
  <text x="30" y="62" font-size="26" font-family="Georgia, serif" font-style="italic" fill="#4d7ea8" opacity="0.9">Pelican Ride</text>
</svg>

</body>
</html>
