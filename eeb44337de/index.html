<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: radial-gradient(circle at 50% 20%, #1d2b3a 0%, #0b1017 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #cfd8e3;
  }

  h1 {
    font-size: clamp(18px, 3.4vw, 28px);
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #eaf2ff;
    text-shadow: 0 0 22px rgba(120, 190, 255, 0.35);
  }

  .stage {
    width: min(94vw, 900px);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.07);
  }

  svg { display: block; width: 100%; height: auto; background: #bfe6f7; }

  .cloud { animation: drift var(--dur) linear infinite; animation-delay: var(--delay); }
  @keyframes drift {
    from { transform: translateX(990px); }
    to   { transform: translateX(-330px); }
  }

  .rays { animation: spin 26s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .trees { animation: scrollBy 1.8s linear infinite; }
  @keyframes scrollBy {
    from { transform: translateX(0); }
    to   { transform: translateX(-700px); }
  }

  .dashes { animation: dashMove 0.55s linear infinite; }
  @keyframes dashMove {
    from { transform: translateX(0); }
    to   { transform: translateX(-160px); }
  }

  .speed { animation: zip 0.5s linear infinite; }
  @keyframes zip {
    0%   { transform: translateX(120px); opacity: 0; }
    18%  { opacity: 0.85; }
    100% { transform: translateX(-620px); opacity: 0; }
  }

  .puff { animation: puffOut 1.05s ease-out infinite; }
  @keyframes puffOut {
    0%   { transform: translate(0, 0) scale(0.35); opacity: 0.9; }
    100% { transform: translate(-90px, -34px) scale(1.5); opacity: 0; }
  }

  .wing-flap { animation: flap 0.42s ease-in-out infinite alternate; }
  @keyframes flap {
    from { transform: rotate(-13deg); }
    to   { transform: rotate(17deg); }
  }
</style>
</head>
<body>

<h1>Pelican on a Bicycle</h1>

<div class="stage">
<svg id="scene" viewBox="0 0 900 600" role="img" aria-label="一只鹈鹕骑自行车的二维动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#5fc4ef"/>

    </linearGradient>
    <linearGradient id="roadG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b6472"/>
      <stop offset="100%" stop-color="#333a45"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dfe6ee"/>
    </linearGradient>
    <linearGradient id="beakG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffc44d"/>
      <stop offset="100%" stop-color="#f59f1b"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="470" fill="url(#sky)"/>

      <line x1="66"  y1="0" x2="88"  y2="0"/>

      <line x1="47"  y1="-47" x2="62"  y2="-62"/>
      <line x1="-47" y1="47"  x2="-62" y2="62"/>
      <line x1="47"  y1="47"  x2="62"  y2="62"/>

    <circle r="42" fill="#ffe071"/>
    <circle r="42" fill="none" stroke="#ffd244" stroke-width="5"/>

  <g transform="translate(0,74)">

  <path id="legFar" d="" fill="none" stroke="#c98862" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path id="thighFar" d="" fill="none" stroke="#e9dfd2" stroke-width="19" stroke-linecap="round"/>

  <g id="bike" fill="none" stroke="#e0533f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <line x1="340" y1="302" x2="400" y2="435"/>
    <line x1="400" y1="435" x2="492" y2="322"/>
    <line x1="340" y1="304" x2="492" y2="320"/>
    <line x1="342" y1="304" x2="312" y2="425"/>
    <line x1="400" y1="435" x2="312" y2="425"/>
    <path d="M498 340 L530 425"/>
    <path d="M492 316 L498 342"/>
    <path d="M494 318 L470 294 L446 288"/>
  </g>
  <path d="M494 318 L470 294 L446 288" fill="none" stroke="#2b3138" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="428" y="280" width="34" height="12" rx="6" fill="#2b3138"/>

  <path d="M330 306 L352 306 L348 296 L334 296 Z" fill="#2b3138"/>
  <path d="M322 292 Q340 282 360 290 Q366 296 360 300 L328 300 Q318 298 322 292 Z" fill="#3c434c"/>

  <ellipse cx="362" cy="266" rx="66" ry="52" transform="rotate(-7 362 266)" fill="url(#bodyG)"/>
  <ellipse cx="360" cy="286" rx="52" ry="32" transform="rotate(-7 360 286)" fill="#cfd9e4" opacity="0.55"/>

  <path d="M300 250 L232 266 L240 284 L306 290 Z" fill="#f2f5f9" stroke="#cdd6e0" stroke-width="2"/>
  <path d="M306 258 L246 270 M306 272 L248 281 M308 282 L252 288" stroke="#cdd6e0" stroke-width="2"/>

  <g transform="translate(362,232)">
    <g class="wing-flap" style="transform-origin:0 0;">
      <path d="M0 -6 C-24 -22 -74 -26 -110 -2 C-82 30 -30 44 6 34 Z" fill="#cfd8e3"/>
      <path d="M-14 12 C-44 20 -80 16 -108 0 M-10 22 C-38 32 -70 30 -98 14" stroke="#b6c1cf" stroke-width="3" fill="none"/>
    </g>
  </g>

  <g id="neckGroup">
    <path d="M390 240 C386 184 424 150 452 128 L480 152 C452 176 424 216 424 254 Z" fill="url(#bodyG)"/>
    <path d="M414 236 C412 194 438 166 458 148 L470 156 C446 178 428 210 428 246 Z" fill="#ffffff" opacity="0.7"/>

    <g transform="translate(470,118)">
      <ellipse cx="0" cy="0" rx="27" ry="26" fill="url(#bodyG)"/>

      <path d="M484 108 Q550 116 602 130 Q550 136 486 132 Z" fill="url(#beakG)"/>
      <path id="pouch" d="M486 132 Q552 138 600 130 Q596 154 560 176 Q516 174 486 132 Z" fill="#ffd98a"/>
      <path d="M486 132 Q552 138 600 130" fill="none" stroke="#e08c14" stroke-width="2.5"/>
      <path d="M500 118 Q548 124 590 133" fill="none" stroke="#e0a02a" stroke-width="2" opacity="0.7"/>
      <path d="M600 128 L620 134 L618 140 L600 136 Z" fill="#8fd0e8"/>
      <path d="M600 128 L620 134 L618 140 L600 136 Z" fill="none" stroke="#5fb0cc" stroke-width="1.5"/>
      <circle cx="9" cy="-9" r="7.5" fill="#ffffff"/>
      <circle cx="10" cy="-9" r="4.6" fill="#20262e"/>
      <circle cx="11.6" cy="-10.6" r="1.6" fill="#ffffff"/>
      <path d="M442 112 C444 84 496 82 498 112 C502 114 502 122 496 122 L444 122 C438 122 438 114 442 112 Z" fill="#e14b4b"/>
      <path d="M496 110 L516 116 L514 124 L494 119 Z" fill="#c93b3b"/>
      <path d="M446 106 C456 96 486 94 494 106" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.55"/>
    </g>
  </g>

  <g transform="translate(400,435)">
    <g id="crankNear">
      <line x1="0" y1="0" x2="0" y2="28" stroke="#3d454e" stroke-width="10" stroke-linecap="round"/>
      <g transform="translate(0,28)">
        <g id="platNear">
          <rect x="-16" y="1" width="32" height="9" rx="3" fill="#22262b"/>
          <path d="M-20 -1 L10 -1 L10 8 L-20 8 Z" fill="#f2b6a0"/>
          <path d="M10 -1 L32 1 L32 8 L10 8 Z" fill="#f2b6a0"/>
          <path d="M24 0 L32 1 M24 5 L32 6" stroke="#d9906f" stroke-width="1.4"/>

  <path id="legNear" d="" fill="none" stroke="#f2b6a0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path id="thighNear" d="" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>

  <g transform="translate(362,232)">
    <g class="wing-flap" style="--d:0s; transform-origin:0 0; animation-delay:-0.21s;">
      <path d="M0 -8 C-26 -26 -80 -30 -118 -4 C-88 32 -32 48 8 38 Z" fill="#ffffff"/>
      <path d="M-16 14 C-48 24 -86 20 -116 2 M-12 26 C-42 38 -76 36 -106 18" stroke="#cbd5e1" stroke-width="3.5" fill="none"/>
      <path d="M-2 4 C-28 8 -62 8 -92 -2" stroke="#e3e9f0" stroke-width="4" fill="none"/>
    </g>
  </g>

  <g class="speed" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <line x1="120" y1="300" x2="250" y2="300"/>
    <line x1="70"  y1="340" x2="190" y2="340"/>
    <line x1="150" y1="380" x2="260" y2="380"/>

  <g class="speed" style="animation-delay:-0.25s;" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <line x1="200" y1="260" x2="300" y2="260"/>
    <line x1="130" y1="420" x2="240" y2="420"/>

  <g transform="translate(258,486)">
    <circle class="puff" r="12" fill="#ffffff" opacity="0.75"/>
    <circle class="puff" style="animation-delay:-0.35s;" r="9"  fill="#ffffff" opacity="0.6"/>
    <circle class="puff" style="animation-delay:-0.7s;"  r="14" fill="#ffffff" opacity="0.45"/>
  </g>
</svg>
</div>

<script>
(function () {
  var R = 68, CRANK = 28;
  var REAR = { x: 312, y: 425 }, FRONT = { x: 530, y: 425 };
  var BB = { x: 400, y: 435 };
  var HIP = { x: 368, y: 312 };
  var L1 = 82, L2 = 88;

  var spokes = '';
  for (var i = 0; i < 16; i++) {
    var a = i * Math.PI / 8;
    var so = R * 0.17, si = R * 0.9;
    spokes += '<line x1="' + (so * Math.sin(a)).toFixed(2) + '" y1="' + (-so * Math.cos(a)).toFixed(2) +
              '" x2="' + (si * Math.sin(a)).toFixed(2) + '" y2="' + (-si * Math.cos(a)).toFixed(2) + '"/>';
  }

  function wheel(cx, cy, rim) {
    return '<g transform="translate(' + cx + ',' + cy + ')">' +
      '<circle r="' + R + '" fill="none" stroke="#1b1f24" stroke-width="9"/>' +
      '<circle r="' + (R - 6) + '" fill="none" stroke="' + rim + '" stroke-width="3.5"/>' +
      '<g stroke="#eef3f8" stroke-width="2" stroke-linecap="round" opacity="0.92">' + spokes + '</g>' +
      '<circle r="7" fill="#5b636e"/><circle r="3" fill="#2c3138"/></g>';
  }

  document.getElementById('wheels').innerHTML =
    '<g id="wRear">' + wheel(REAR.x, REAR.y, '#3f8fd0') + '</g>' +
    '<g id="wFront">' + wheel(FRONT.x, FRONT.y, '#3f8fd0') + '</g>';

  var wRear = document.getElementById('wRear').firstElementChild;
  var wFront = document.getElementById('wFront').firstElementChild;

  var crankNear = document.getElementById('crankNear');
  var crankFar = document.getElementById('crankFar');
  var platNear = document.getElementById('platNear');
  var platFar = document.getElementById('platFar');
  var legNear = document.getElementById('legNear');
  var legFar = document.getElementById('legFar');
  var thighNear = document.getElementById('thighNear');
  var thighFar = document.getElementById('thighFar');
  var neckGroup = document.getElementById('neckGroup');
  var pouch = document.getElementById('pouch');

  function ik(hx, hy, tx, ty, l1, l2, sign) {
    var dx = tx - hx, dy = ty - hy;
    var d = Math.sqrt(dx * dx + dy * dy);
    d = Math.min(d, l1 + l2 - 0.01);
    var base = Math.atan2(dy, dx);
    var cosA = Math.min(1, Math.max(-1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d)));
    var a = Math.acos(cosA);
    var ang = base + sign * a;
    return { x: hx + l1 * Math.cos(ang), y: hy + l1 * Math.sin(ang) };
  }

  var start = performance.now(), last = start;

  function frame(now) {
    var dt = Math.min(60, now - last) / 1000;
    last = now;
    var t = (now - start) / 1000;

    var wheelA = t * 5.2;
    var crankA = t * 2.05;

    var deg = wheelA * 180 / Math.PI;
    wRear.setAttribute('transform', 'rotate(' + deg.toFixed(2) + ')');
    wFront.setAttribute('transform', 'rotate(' + deg.toFixed(2) + ')');

    var cd = crankA * 180 / Math.PI;
    crankNear.setAttribute('transform', 'rotate(' + cd.toFixed(2) + ')');
    crankFar.setAttribute('transform', 'rotate(' + (cd + 180).toFixed(2) + ')');
    platNear.setAttribute('transform', 'rotate(' + (-cd).toFixed(2) + ')');
    platFar.setAttribute('transform', 'rotate(' + (-(cd + 180)).toFixed(2) + ')');

    var p1 = {
      x: BB.x + CRANK * Math.cos(crankA),
      y: BB.y + CRANK * Math.sin(crankA)
    };
    var p2 = {
      x: BB.x - CRANK * Math.cos(crankA),
      y: BB.y - CRANK * Math.sin(crankA)
    };

    var bob = Math.sin(crankA * 2) * 2.5;

    function leg(el, th, hip, p, sign) {
      var target = { x: p.x, y: p.y - 11 };
      var k = ik(hip.x, hip.y + bob, target.x, target.y, L1, L2, sign);
      th.setAttribute('d', 'M ' + (hip.x) + ' ' + (hip.y + bob) + ' L ' + k.x.toFixed(1) + ' ' + k.y.toFixed(1));
      el.setAttribute('d', 'M ' + k.x.toFixed(1) + ' ' + k.y.toFixed(1) + ' L ' + target.x.toFixed(1) + ' ' + target.y.toFixed(1));
    }
    leg(legNear, thighNear, HIP, p1, -1);
    leg(legFar, thighFar, { x: HIP.x - 14, y: HIP.y + 6 }, p2, -1);

    neckGroup.setAttribute('transform',
      'translate(' + (Math.sin(t * 1.7) * 5).toFixed(2) + ',' + (bob * 0.8).toFixed(2) + ') rotate(' +
      (Math.sin(t * 1.7 + 0.6) * 2.2).toFixed(2) + ' 390 240)');

    var w = Math.sin(t * 6.5) * 7;
    pouch.setAttribute('d',
      'M486 132 Q552 138 600 130 Q' + (596 + w).toFixed(1) + ' ' + (154 + w * 0.5).toFixed(1) + ' ' +
      (560 + w * 0.5).toFixed(1) + ' ' + (176 + w * 1.3).toFixed(1) +
      ' Q' + (516 + w * 0.4).toFixed(1) + ' ' + (174 + w * 1.1).toFixed(1) + ' 486 132 Z');

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
