<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕骑自行车</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17324a;
      --cream: #fff6df;
      --coral: #e86f61;
      --teal: #2b9aa0;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #d9f1ef;
      font-family: ui-rounded, "Avenir Next", "Microsoft YaHei", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .scene {
      width: min(1100px, 100%);
      border: 4px solid var(--ink);
      border-radius: 24px;
      overflow: hidden;
      background: #a8dfe0;
      box-shadow: 0 18px 0 rgba(23, 50, 74, .12), 0 28px 60px rgba(23, 50, 74, .14);
    }

    svg { display: block; width: 100%; height: auto; }

    .cloud { animation: drift 18s linear infinite; }
    .cloud.slow { animation-duration: 25s; animation-delay: -9s; }
    .cloud.tiny { animation-duration: 13s; animation-delay: -4s; }

    .pelican-rider { animation: rider-bob 720ms ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
    .wing { animation: wing-flap 720ms ease-in-out infinite; transform-box: fill-box; transform-origin: 18% 60%; }
    .beak { animation: beak-nod 720ms ease-in-out infinite; transform-box: fill-box; transform-origin: 10% 50%; }
    .pedal-crank { animation: pedal 900ms linear infinite; transform-box: fill-box; transform-origin: center; }
    .wheel { animation: roll 900ms linear infinite; transform-box: fill-box; transform-origin: center; }
    .feather { animation: feather-twitch 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .feather.two { animation-delay: -1.1s; }

    @keyframes drift {
      from { transform: translateX(-90px); }
      to { transform: translateX(1050px); }
    }

    @keyframes rider-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes wing-flap {
      0%, 100% { transform: rotate(5deg); }
      50% { transform: rotate(-18deg); }
    }

    @keyframes beak-nod {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(4deg); }
    }

    @keyframes pedal {
      to { transform: rotate(360deg); }
    }

    @keyframes roll {
      to { transform: rotate(360deg); }
    }

    @keyframes feather-twitch {
      0%, 72%, 100% { transform: rotate(0deg); }
      78% { transform: rotate(7deg); }
      86% { transform: rotate(-4deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .cloud, .pelican-rider, .wing, .beak, .pedal-crank, .wheel, .feather { animation-play-state: paused; }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="一只鹈鹕骑着自行车沿海边前进的动画">
    <svg viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
      <title id="title">鹈鹕骑自行车</title>
      <desc id="desc">一只戴着红色头盔的鹈鹕骑着蓝色自行车，沿着海边道路前进，云朵缓慢飘过。</desc>

      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#77cbd5"/>
          <stop offset="100%" stop-color="#d8f0df"/>
        </linearGradient>
        <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#67c2c4"/>
          <stop offset="100%" stop-color="#318c9e"/>
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#e7b97e"/>
          <stop offset="100%" stop-color="#cd895e"/>
        </linearGradient>
        <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="170%">
          <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#17324a" flood-opacity=".22"/>
        </filter>
        <pattern id="road-lines" width="150" height="34" patternUnits="userSpaceOnUse">
          <path d="M 0 17 H 90" stroke="#ffe8b1" stroke-width="7" stroke-linecap="round"/>
        </pattern>
      </defs>

      <!-- sky and distant landscape -->
      <rect width="1100" height="660" fill="url(#sky)"/>
      <circle cx="860" cy="112" r="54" fill="#ffd875" opacity=".95"/>
      <circle cx="860" cy="112" r="72" fill="none" stroke="#ffe7a1" stroke-width="7" opacity=".45" stroke-dasharray="3 18"/>

      <g class="cloud" fill="#fff9ed" stroke="#17324a" stroke-width="5" stroke-linejoin="round">
        <path d="M-86 154 C-58 113 -13 110 11 140 C27 104 80 104 98 149 C138 144 162 169 163 198 H-99 C-101 178 -98 164 -86 154Z"/>
      </g>
      <g class="cloud slow" fill="#fff9ed" stroke="#17324a" stroke-width="5" stroke-linejoin="round">
        <path d="M-142 242 C-114 202 -77 202 -53 226 C-38 192 7 194 24 231 C54 226 74 247 74 270 H-150 C-153 259 -150 249 -142 242Z"/>
      </g>
      <g class="cloud tiny" fill="#fff9ed" stroke="#17324a" stroke-width="4" stroke-linejoin="round">
        <path d="M-108 87 C-92 62 -64 61 -48 81 C-35 58 -5 62 5 89 H-112Z"/>
      </g>

      <path d="M0 329 Q150 278 307 324 T620 322 T936 324 T1200 302 V442 H0Z" fill="#8ecb9a" stroke="#17324a" stroke-width="6"/>
      <path d="M0 371 Q154 322 315 374 T620 366 T946 372 T1200 347 V468 H0Z" fill="#6bb38d" opacity=".85"/>

      <!-- ocean -->
      <path d="M0 389 Q165 371 335 394 T695 390 T1100 386 V560 H0Z" fill="url(#water)" stroke="#17324a" stroke-width="6"/>
      <g fill="none" stroke="#b8ece0" stroke-width="6" stroke-linecap="round" opacity=".85">
        <path d="M45 438 C95 421 147 421 197 438"/>
        <path d="M260 474 C325 454 379 456 430 474"/>
        <path d="M697 433 C753 416 806 417 858 435"/>
        <path d="M896 484 C953 466 1009 467 1058 482"/>
        <path d="M76 521 C127 505 181 505 226 520"/>
      </g>
      <g fill="#ffe2a1" opacity=".8">
        <circle cx="230" cy="419" r="4"/><circle cx="665" cy="451" r="5"/><circle cx="1020" cy="423" r="4"/>
      </g>

      <!-- road and foreground -->
      <path d="M0 484 Q230 445 442 471 Q690 500 1100 441 V660 H0Z" fill="url(#road)" stroke="#17324a" stroke-width="6"/>
      <path d="M0 533 Q219 492 441 519 Q720 551 1100 483 V568 Q717 624 435 585 Q214 557 0 600Z" fill="url(#road-lines)" opacity=".8"/>
      <path d="M0 611 Q233 570 449 601 Q734 639 1100 566 V660 H0Z" fill="#c87558" opacity=".35"/>

      <!-- little roadside plants -->
      <g stroke="#276d68" stroke-width="6" stroke-linecap="round" fill="none">
        <path d="M92 526 Q84 493 69 476 M92 526 Q98 489 115 475 M92 526 Q72 502 57 501"/>
        <path d="M980 510 Q974 478 958 459 M980 510 Q988 474 1003 462 M980 510 Q1000 485 1018 484"/>
      </g>
      <g fill="#f2a657" stroke="#17324a" stroke-width="4">
        <circle cx="64" cy="472" r="7"/><circle cx="117" cy="471" r="7"/><circle cx="57" cy="498" r="7"/>
        <circle cx="957" cy="456" r="7"/><circle cx="1005" cy="459" r="7"/><circle cx="1018" cy="482" r="7"/>
      </g>

      <!-- bicycle shadow -->
      <ellipse cx="553" cy="584" rx="224" ry="23" fill="#17324a" opacity=".19"/>

      <!-- bicycle -->
      <g class="bike" filter="url(#soft-shadow)" stroke="#17324a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <g class="wheel">
          <circle cx="405" cy="525" r="72" fill="#ebf5e8" stroke="#17324a"/>
          <circle cx="405" cy="525" r="9" fill="#e86f61"/>
          <path d="M405 458 V592 M338 525 H472 M357 477 L453 573 M453 477 L357 573" stroke-width="3" opacity=".7"/>
        </g>
        <g class="wheel">
          <circle cx="704" cy="525" r="72" fill="#ebf5e8" stroke="#17324a"/>
          <circle cx="704" cy="525" r="9" fill="#e86f61"/>
          <path d="M704 458 V592 M637 525 H771 M656 477 L752 573 M752 477 L656 573" stroke-width="3" opacity=".7"/>
        </g>
        <path d="M405 525 L500 510 L588 525 L704 525 L580 401 L500 510 M580 401 L615 371 M580 401 L611 430" stroke="#2b9aa0"/>
        <path d="M615 371 L641 371" stroke="#e86f61" stroke-width="12"/>
        <path d="M588 525 L572 544" stroke="#17324a" stroke-width="7"/>
        <circle cx="588" cy="525" r="19" fill="#f2a657"/>
        <g class="pedal-crank" stroke="#17324a" stroke-width="7">
          <path d="M588 525 L621 495 M588 525 L556 552"/>
          <path d="M619 492 h29 M553 555 h-29" stroke="#e86f61" stroke-width="9"/>
        </g>
        <path d="M500 510 L468 418" stroke="#2b9aa0"/>
        <path d="M454 410 Q472 401 492 407" stroke="#e86f61" stroke-width="11"/>
      </g>

      <!-- pelican rider -->
      <g class="pelican-rider" filter="url(#soft-shadow)" stroke="#17324a" stroke-width="7" stroke-linejoin="round">
        <!-- body -->
        <path d="M456 365 C444 313 462 244 526 225 C594 205 657 231 669 294 C677 339 649 381 595 395 C541 409 469 400 456 365Z" fill="#f7f1dc"/>
        <path d="M503 377 C529 397 596 398 628 375 C608 414 545 431 506 405Z" fill="#d9e1d3"/>
        <!-- tail feathers -->
        <path d="M467 342 L405 322 L430 367 L389 383 L474 389Z" fill="#d9e1d3"/>
        <!-- wing -->
        <path class="wing" d="M508 285 C533 254 585 256 611 292 C593 334 552 353 504 340 C487 329 489 304 508 285Z" fill="#e5e8d9"/>
        <path class="wing" d="M519 301 C547 302 570 317 587 338" fill="none" stroke="#a5b8ad" stroke-width="5"/>
        <path class="wing" d="M513 317 C539 321 557 333 570 347" fill="none" stroke="#a5b8ad" stroke-width="5"/>
        <!-- neck and head -->
        <path d="M526 248 C500 224 501 173 527 148 C550 127 587 134 606 158 C624 181 615 222 591 247Z" fill="#f7f1dc"/>
        <path d="M510 148 Q538 105 592 122 Q623 132 636 162 Q596 143 554 160Z" fill="#e86f61"/>
        <path d="M536 126 Q567 104 598 127" fill="none" stroke="#ffb36f" stroke-width="9"/>
        <circle cx="580" cy="169" r="8" fill="#17324a" stroke="none"/>
        <circle cx="583" cy="166" r="3" fill="#fff9ed" stroke="none"/>
        <!-- beak -->
        <path class="beak" d="M597 182 Q649 170 729 190 Q744 196 729 207 Q670 236 603 216 Q587 201 597 182Z" fill="#f2a657"/>
        <path class="beak" d="M600 206 Q663 209 729 190" fill="none" stroke="#cf704c" stroke-width="5"/>
        <path class="beak" d="M650 215 Q679 231 708 216" fill="none" stroke="#cf704c" stroke-width="4"/>
        <!-- feet -->
        <path d="M526 391 L512 454 L499 503" fill="none" stroke="#e86f61" stroke-width="13"/>
        <path d="M602 391 L596 450 L576 501" fill="none" stroke="#e86f61" stroke-width="13"/>
        <path d="M494 503 Q513 512 532 503 M570 501 Q588 510 608 500" fill="none" stroke="#17324a" stroke-width="7"/>
        <!-- feather accents -->
        <path class="feather" d="M464 278 Q439 265 431 247" fill="none" stroke="#a5b8ad" stroke-width="6"/>
        <path class="feather two" d="M474 295 Q447 288 437 271" fill="none" stroke="#a5b8ad" stroke-width="6"/>
      </g>

      <!-- foreground pebbles and title plaque -->
      <g fill="#f2a657" stroke="#17324a" stroke-width="4">
        <ellipse cx="154" cy="620" rx="20" ry="8"/><ellipse cx="187" cy="612" rx="13" ry="6"/>
        <ellipse cx="900" cy="626" rx="18" ry="7"/><ellipse cx="930" cy="616" rx="12" ry="6"/>
      </g>
      <g transform="translate(55 42)">
        <rect width="248" height="76" rx="18" fill="#fff6df" stroke="#17324a" stroke-width="6"/>
        <text x="124" y="34" text-anchor="middle" fill="#17324a" font-size="22" font-weight="800" letter-spacing="1">海风骑行日</text>
        <text x="124" y="59" text-anchor="middle" fill="#2b9aa0" font-size="14" font-weight="700">PELican on the move</text>
      </g>
    </svg>
  </main>
</body>
</html>
