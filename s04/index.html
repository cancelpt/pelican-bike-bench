<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>鹈鹕的兜风日 · Pelican's little ride</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f1e8;
      --ink: #304f48;
      --muted: #788277;
      --line: #deded0;
      --accent: #da775b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 3px solid #bd8c42; outline-offset: 5px; }
    .page { width: min(1160px, 100%); margin: 0 auto; padding: 32px 36px 25px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 650; letter-spacing: .15em; }
    .brand svg { width: 29px; height: 29px; flex-shrink: 0; }
    .edition { color: var(--muted); font: 11px/1.5 Georgia, serif; letter-spacing: .11em; }
    .intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin: 33px 0 26px; }
    .eyebrow { margin: 0 0 10px; color: #a16d50; font-size: 10px; font-weight: 600; letter-spacing: .25em; }
    h1 { margin: 0; font: 500 clamp(27px, 3.4vw, 42px)/1.35 "Songti SC", "STSong", "SimSun", Georgia, serif; letter-spacing: .08em; }
    .intro-note { margin: 0 0 4px; color: var(--muted); font-size: 12px; line-height: 1.9; letter-spacing: .12em; text-align: right; }
    .illustration { position: relative; overflow: hidden; border: 1px solid #d6dccb; border-radius: 20px; background: #e7edda; }
    .scene { width: 100%; height: auto; display: block; }
    .scene-stamp { position: absolute; top: 25px; left: 28px; display: flex; align-items: center; gap: 8px; color: #608071; font-size: 10px; letter-spacing: .16em; pointer-events: none; }
    .scene-stamp::before { content: ""; width: 5px; height: 5px; background: #769880; border-radius: 50%; }
    .scene-caption { position: absolute; right: 26px; bottom: 19px; color: #7e7d60; font: italic 15px Georgia, serif; letter-spacing: .03em; pointer-events: none; }
    .controls { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 20px 0 18px; border-bottom: 1px solid var(--line); }
    .playback { display: flex; align-items: center; gap: 16px; }
    .play-button { display: inline-flex; justify-content: center; align-items: center; gap: 9px; min-width: 96px; height: 41px; padding: 0 17px; border: 0; border-radius: 24px; background: var(--ink); color: #fffaf0; cursor: pointer; font-size: 12px; transition: background .2s, transform .2s; }
    .play-button:hover { background: #486c5e; transform: translateY(-1px); }
    .play-button:active { transform: translateY(0); }
    .play-button svg { width: 13px; height: 13px; }
    .status { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; letter-spacing: .04em; }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; background: #8a9f73; }
    .status-dot.paused { background: #bd9b72; }
    .speed-control { display: flex; align-items: center; gap: 14px; }
    .speed-label { color: var(--muted); font-size: 11px; }
    .speed-options { display: flex; gap: 3px; padding: 4px; border: 1px solid #e0dfd3; border-radius: 24px; }
    .speed-option { padding: 8px 15px; border: 0; border-radius: 20px; background: transparent; color: #788276; font-size: 11px; cursor: pointer; transition: background .2s, color .2s; white-space: nowrap; }
    .speed-option:hover { background: #eaeade; color: var(--ink); }
    .speed-option[aria-pressed="true"] { background: #e1e6d5; color: #3a5e4b; }
    footer { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-top: 16px; color: #8b8c7e; font-size: 10px; line-height: 1.7; letter-spacing: .07em; }
    .footer-flower { color: #bf8563; margin-right: 6px; font-size: 13px; }
    .footer-en { font: italic 12px Georgia, serif; letter-spacing: .03em; }
    [hidden] { display: none !important; }
    @media (min-width: 1500px) { .page { padding-top: 46px; } .intro { margin-top: 40px; } }
    @media (max-width: 650px) {
      .page { padding: 23px 18px 22px; }
      .intro { margin: 30px 0 22px; gap: 12px; }
      h1 { font-size: clamp(24px, 5.6vw, 34px); letter-spacing: .02em; }
      .eyebrow { font-size: 8px; letter-spacing: .17em; }
      .intro-note { font-size: 10px; letter-spacing: .03em; }
      .illustration { border-radius: 15px; }
      .scene { width: 135%; max-width: none; margin-left: -19%; }
      .scene-stamp { top: 17px; left: 16px; font-size: 8px; }
      .scene-caption { bottom: 12px; right: 15px; font-size: 11px; }
      .controls { padding-top: 17px; gap: 14px; flex-wrap: wrap; }
      .playback { gap: 10px; }
      .play-button { min-width: 80px; height: 39px; padding: 0 12px; }
      .speed-control { gap: 8px; }
      .speed-option { padding: 8px 10px; font-size: 10px; }
      .speed-label { display: none; }
      .status { font-size: 10px; }
      footer { font-size: 9px; letter-spacing: .01em; }
      .footer-en { font-size: 10px; }
    }
    @media (max-width: 390px) { .status { display: none; } .brand { font-size: 10px; } .edition { font-size: 9px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>

    <div class="controls" aria-label="动画控制">
      <div class="playback">
        <button id="play-toggle" class="play-button" type="button" aria-label="暂停动画" aria-controls="scene">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><g id="pause-icon"><rect x="3" y="2" width="3" height="12" rx="1"/><rect x="10" y="2" width="3" height="12" rx="1"/></g><path id="play-icon" d="M4 2.5q0-1 1-.5l9 5.3q1 .7 0 1.4L5 14q-1 .5-1-.5Z" hidden/></svg>
          <span id="play-label">暂停</span>
        </button>
        <span class="status"><span id="status-dot" class="status-dot"></span><span id="status-text" role="status">正在兜风</span></span>
      </div>
      <div class="speed-control" role="group" aria-label="骑行速度">
        <span class="speed-label" aria-hidden="true">骑行速度</span>
        <div class="speed-options">
          <button class="speed-option" data-speed="0.65" aria-pressed="false" aria-label="慢慢骑，0.65 倍速" type="button">慢慢骑</button>
          <button class="speed-option" data-speed="1" aria-pressed="true" aria-label="刚刚好，正常速度" type="button">刚刚好</button>
          <button class="speed-option" data-speed="1.6" aria-pressed="false" aria-label="追海风，1.6 倍速" type="button">追海风</button>
        </div>

    <footer><span><span class="footer-flower" aria-hidden="true">✳</span>不赶路，只感受路。</span><span class="footer-en">A small ride. A little joy.</span></footer>
    <noscript><p>启用 JavaScript 后，鹈鹕就会开始骑行。当前显示的是静态插画。</p></noscript>
  </main>

  <script>
    (() => {
      'use strict';
      // All motion uses one clock, so pausing and changing speed keep the pedals,
      // webbed feet, wheels, scarf, and passing landscape in sync.
      const byId = (id) => document.getElementById(id);
      const nodes = Object.fromEntries([
        'bicycle', 'rider-body', 'rear-spokes', 'front-spokes', 'near-crank',
        'far-crank', 'near-leg-outline', 'near-leg-color', 'far-leg-outline',
        'far-leg-color', 'near-foot', 'far-foot', 'scarf-front', 'scarf-back',
        'pelican-eye', 'flowers', 'coast', 'foreground', 'water-lines',
        'road-lines', 'cloud-a', 'cloud-b', 'cloud-c', 'sailboat', 'sky-birds',
        'sky-bird-one', 'sky-bird-two', 'breeze-a', 'breeze-b', 'bike-shadow',
        'play-toggle', 'play-label', 'pause-icon', 'play-icon', 'status-text', 'status-dot'
      ].map((id) => [id, byId(id)]));
      const speedButtons = Array.from(document.querySelectorAll('.speed-option'));
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const TAU = Math.PI * 2;
      let playing = !motionPreference.matches;
      let speed = 1;
      let elapsed = 0;
      let lastFrame = null;
      let frameId = null;

      const transform = (name, value) => nodes[name].setAttribute('transform', value);
      const path = (name, value) => nodes[name].setAttribute('d', value);
      const fixed = (value) => value.toFixed(2);
      const wrap = (value, width) => ((value % width) + width) % width;

      // Two-segment inverse kinematics keeps each ankle on its rotating pedal.
      function drawLeg(side, phase, bob) {
        const footX = 568 + Math.cos(phase) * 34;
        const footY = 520 + Math.sin(phase) * 34;
        const hipX = side === 'near' ? 555 : 546;
        const hipY = 412 + bob;
        const ankleX = footX - 9;
        const ankleY = footY - 13;
        const dx = ankleX - hipX;
        const dy = ankleY - hipY;
        const upper = 78;
        const lower = 78;
        const distance = Math.max(.001, Math.hypot(dx, dy));
        const bend = Math.acos(Math.max(-1, Math.min(1,
          (upper * upper + distance * distance - lower * lower) / (2 * upper * distance)
        )));
        const kneeAngle = Math.atan2(dy, dx) - bend;
        const kneeX = hipX + Math.cos(kneeAngle) * upper;
        const kneeY = hipY + Math.sin(kneeAngle) * upper;
        const legPath = `M${hipX} ${fixed(hipY)}L${fixed(kneeX)} ${fixed(kneeY)}L${fixed(ankleX)} ${fixed(ankleY)}`;
        path(`${side}-leg-outline`, legPath);
        path(`${side}-leg-color`, legPath);
        nodes[`${side}-crank`].firstElementChild.setAttribute('d', `M568 520L${fixed(footX)} ${fixed(footY)}`);
        transform(`${side}-foot`, `translate(${fixed(footX)} ${fixed(footY)})`);
      }

      function render(time) {
        const travel = time * 228;
        const wheelAngle = travel / 97;
        const crankAngle = wheelAngle / 1.25 - .4;
        const bob = Math.sin(crankAngle * 2) * 1.7;
        const bump = Math.sin(time * 4.8) * .65;
        transform('bicycle', `translate(0 ${fixed(bump)})`);
        transform('rider-body', `translate(0 ${fixed(bob)})`);
        transform('rear-spokes', `rotate(${fixed((wheelAngle * 180 / Math.PI) % 360)})`);
        transform('front-spokes', `rotate(${fixed((wheelAngle * 180 / Math.PI) % 360)})`);
        drawLeg('far', crankAngle + Math.PI, bob);
        drawLeg('near', crankAngle, bob);

        const flutter = Math.sin(time * 5.3) * 5;
        const tail = Math.sin(time * 5.3 - 1.4) * 7;
        path('scarf-back', `M641 277C603 ${279 + flutter} 574 ${254 + flutter} 548 ${267 + tail}Q536 ${272 + tail} 523 ${268 + tail}L528 ${283 + tail}L518 ${289 + tail}C552 ${302 + tail} 582 ${283 + flutter} 608 299L645 300Z`);
        path('scarf-front', `M643 281C611 ${303 - flutter} 584 ${279 - flutter} 557 ${291 - tail}Q546 ${297 - tail} 530 ${293 - tail}L536 ${307 - tail}L526 ${313 - tail}C557 ${322 - tail} 584 ${300 - flutter} 609 311L646 301Z`);
        transform('flowers', `rotate(${fixed(Math.sin(time * 3.1) * 2.3)} 792 416)`);
        const blinkPhase = time % 6.8;
        const eyeScale = blinkPhase > 6.5 ? 1 - Math.sin((blinkPhase - 6.5) / .3 * Math.PI) * .92 : 1;
        transform('pelican-eye', `translate(703 203) scale(1 ${fixed(eyeScale)})`);

        transform('coast', `translate(${-wrap(time * 39, 1300)} 0)`);
        transform('foreground', `translate(${-wrap(travel, 1300)} 0)`);
        nodes['road-lines'].setAttribute('patternTransform', `translate(${-wrap(travel, 230)} 0)`);
        nodes['water-lines'].setAttribute('patternTransform', `translate(${-wrap(time * 15, 380)} 0)`);
        transform('cloud-a', `translate(${wrap(160 - time * 7 + 180, 1500) - 180} 116)`);
        transform('cloud-b', `translate(${wrap(720 - time * 4 + 180, 1500) - 180} 73)`);
        transform('cloud-c', `translate(${wrap(1130 - time * 9 + 180, 1500) - 180} 217)`);
        transform('sailboat', `translate(${wrap(213 - time * 7 + 60, 1320) - 60} ${356 + Math.sin(time * 1.6) * 1.3})`);
        transform('sky-birds', `translate(${wrap(-time * 13 + 440, 1740) - 440} ${Math.sin(time * .7) * 6})`);
        const flap = Math.sin(time * 3.4) * 4;
        path('sky-bird-one', `M318 ${185 + flap}q10 ${-9 - flap} 19 ${-flap}q9 ${-9 + flap} 19 ${flap}`);
        path('sky-bird-two', `M366 ${169 - flap * .7}q7 ${-7 + flap * .7} 14 ${flap * .7}q7 ${-7 - flap * .7} 14 ${-flap * .7}`);
        transform('breeze-a', `translate(${-((time * 24) % 100)} 0)`);
        nodes['breeze-a'].setAttribute('opacity', fixed(.15 + .6 * Math.pow(Math.sin(time * .75), 2)));
        transform('breeze-b', `translate(${-((time * 20) % 90)} 0)`);
        nodes['breeze-b'].setAttribute('opacity', fixed(.1 + .5 * Math.pow(Math.sin(time * .7 + 1.5), 2)));
        nodes['bike-shadow'].setAttribute('rx', fixed(246 + bob * 1.5));
      }

      function frame(timestamp) {
        frameId = null;
        if (!playing || document.hidden) { lastFrame = null; return; }
        if (lastFrame !== null) elapsed += Math.min((timestamp - lastFrame) / 1000, .05) * speed;
        lastFrame = timestamp;
        render(elapsed);
        frameId = requestAnimationFrame(frame);
      }

      function schedule() {
        if (playing && !document.hidden && frameId === null) {
          lastFrame = null;
          frameId = requestAnimationFrame(frame);
        }
      }

      function updatePlayback() {
        nodes['play-label'].textContent = playing ? '暂停' : '继续骑行';
        nodes['play-toggle'].setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        nodes['pause-icon'].toggleAttribute('hidden', !playing);
        nodes['play-icon'].toggleAttribute('hidden', playing);
        nodes['status-text'].textContent = playing ? '正在兜风' : '歇一会儿';
        nodes['status-dot'].classList.toggle('paused', !playing);
        if (!playing && frameId !== null) {
          cancelAnimationFrame(frameId);
          frameId = null;
          lastFrame = null;
        }
        schedule();
      }

      nodes['play-toggle'].addEventListener('click', () => {
        playing = !playing;
        updatePlayback();
      });
      speedButtons.forEach((button) => button.addEventListener('click', () => {
        speed = Number(button.dataset.speed);
        speedButtons.forEach((option) => option.setAttribute('aria-pressed', String(option === button)));
      }));
      document.addEventListener('keydown', (event) => {
        if (event.code !== 'Space' || event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.target.closest('button, input, textarea, select, a, [contenteditable="true"]')) return;
        event.preventDefault();
        playing = !playing;
        updatePlayback();
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && frameId !== null) {
          cancelAnimationFrame(frameId);
          frameId = null;
          lastFrame = null;
        } else schedule();
      });
      motionPreference.addEventListener('change', (event) => {
        if (event.matches) { playing = false; updatePlayback(); }
      });

      render(0);
      updatePlayback();
    })();
  </script>
