<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>骑自行车的鹈鹕</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: grid;
    place-items: center;
    padding: 24px;
    overflow: hidden;
    background: radial-gradient(120% 120% at 22% 8%, #f2fbff 0%, #cfe9f9 40%, #a5cde6 100%);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .stage {
    width: min(100%, 1080px);
    border-radius: 26px;
    overflow: hidden;
    border: 10px solid rgba(255, 255, 255, .55);
    box-shadow: 0 40px 80px -30px rgba(12, 39, 64, .5), 0 12px 30px -14px rgba(12, 39, 64, .3);
  }
  svg { display: block; width: 100%; height: auto; }

  /* ---------- 动画 ---------- */
  .spin-r { transform-box: view-box; transform-origin: 330px 448px; animation: spin 1.1s linear infinite; }
  .spin-f { transform-box: view-box; transform-origin: 600px 448px; animation: spin 1.1s linear infinite; }
  .crank  { transform-box: view-box; transform-origin: 462px 450px; animation: spin 1.1s linear infinite; }

  .rig { animation: bob .55s ease-in-out infinite; }

  .leg-near  { transform-box: view-box; transform-origin: 400px 314px; animation: swing 1.1s ease-in-out infinite; }
  .leg-far   { transform-box: view-box; transform-origin: 394px 310px; animation: swing 1.1s ease-in-out infinite reverse; }
  .shin-near { transform-box: view-box; transform-origin: 438px 380px; animation: shin 1.1s ease-in-out infinite; }
  .shin-far  { transform-box: view-box; transform-origin: 422px 386px; animation: shin 1.1s ease-in-out infinite reverse; }

  .wing       { transform-box: view-box; transform-origin: 424px 234px; animation: flap 1.1s ease-in-out infinite; }
  .head-group { transform-box: view-box; transform-origin: 420px 226px; animation: nod 2.2s ease-in-out infinite; }
  .pouch      { transform-box: view-box; transform-origin: 496px 146px; animation: wobble .8s ease-in-out infinite; }

  .cloud-strip { animation: scroll 36s linear infinite; }
  .hill-far    { animation: scroll 26s linear infinite; }
  .hill-near   { animation: scroll 15s linear infinite; }
  .road-line   { animation: road .75s linear infinite; }

  @keyframes spin   { to { transform: rotate(360deg); } }
  @keyframes bob    { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes swing  { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  @keyframes shin   { 0%, 100% { transform: rotate(13deg); } 50% { transform: rotate(-9deg); } }
  @keyframes flap   { 0%, 100% { transform: rotate(-2.5deg); } 50% { transform: rotate(3deg); } }
  @keyframes nod    { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-3deg); } }
  @keyframes wobble { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(2.5deg); } }
  @keyframes scroll { to { transform: translateX(-900px); } }
  @keyframes road   { to { stroke-dashoffset: 120; } }

  @media (prefers-reduced-motion: reduce) {
    .spin-r, .spin-f, .crank, .rig, .leg-near, .leg-far, .shin-near, .shin-far,
    .wing, .head-group, .pouch, .cloud-strip, .hill-far, .hill-near, .road-line {
      animation: none !important;
    }
  }
</style>
</head>
<body>
<div class="stage">
  <svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车向右行进">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#a8dcf6"/>
        <stop offset="55%" stop-color="#dcf1fd"/>
        <stop offset="100%" stop-color="#fdf4e4"/>
      </linearGradient>
      <radialGradient id="sunGlow">
        <stop offset="0%" stop-color="#ffe9a8" stop-opacity=".95"/>
        <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#8b9aad"/>
        <stop offset="100%" stop-color="#59697d"/>
      </linearGradient>
      <linearGradient id="bodyGrad" x1="0.15" y1="0" x2="0.85" y2="1">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="55%" stop-color="#f3f7fb"/>
        <stop offset="100%" stop-color="#d6e1ec"/>
      </linearGradient>
      <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0.4">
        <stop offset="0%" stop-color="#ffc97e"/>
        <stop offset="100%" stop-color="#ef8a12"/>
      </linearGradient>
      <linearGradient id="pouchGrad" x1="0.1" y1="0" x2="0.4" y2="1">
        <stop offset="0%" stop-color="#ffb75f"/>
        <stop offset="100%" stop-color="#dd6c33"/>
      </linearGradient>
      <linearGradient id="frameGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#25c6b4"/>
        <stop offset="100%" stop-color="#0b7d75"/>
      </linearGradient>

      <g id="cloudShape" fill="#ffffff">
        <ellipse cx="0" cy="0" rx="54" ry="28"/>
        <ellipse cx="44" cy="-14" rx="40" ry="32"/>
        <ellipse cx="88" cy="0" rx="44" ry="24"/>
        <rect x="-46" y="2" width="180" height="24" rx="12"/>
      </g>
    </defs>

    <!-- 天空 -->
    <rect width="900" height="560" fill="url(#sky)"/>

    <!-- 太阳 -->
    <circle cx="762" cy="98" r="112" fill="url(#sunGlow)"/>
    <circle cx="762" cy="98" r="44" fill="#ffdf85"/>
    <circle cx="762" cy="98" r="44" fill="none" stroke="#ffd15c" stroke-width="3" opacity=".7"/>

    <!-- 云层 -->
    <g class="cloud-strip" opacity=".92">
      <g id="cloudSet">
        <use href="#cloudShape" transform="translate(90 112)"/>
        <use href="#cloudShape" transform="translate(358 68) scale(.76)"/>
        <use href="#cloudShape" transform="translate(648 156) scale(1.06)"/>
        <use href="#cloudShape" transform="translate(790 46) scale(.55)"/>
      </g>
      <use href="#cloudSet" x="900"/>
    </g>

    <!-- 远山 -->
    <g class="hill-far">
      <g>
        <path d="M0 442 C 80 400 140 392 210 415 C 280 438 330 366 410 360 C 490 354 530 402 610 394 C 690 386 780 348 900 442 L900 452 L0 452 Z" fill="#a9cebb"/>
        <path d="M900 442 C 980 400 1040 392 1110 415 C 1180 438 1230 366 1310 360 C 1390 354 1430 402 1510 394 C 1590 386 1680 348 1800 442 L1800 452 L900 452 Z" fill="#a9cebb"/>
      </g>
    </g>

    <!-- 近山 -->
    <g class="hill-near">
      <g>
        <path d="M0 428 C 80 404 150 420 220 416 C 300 410 340 428 420 424 C 500 420 560 400 640 406 C 720 412 800 430 900 428 L900 454 L0 454 Z" fill="#6fae91"/>
        <path d="M900 428 C 980 404 1050 420 1120 416 C 1200 410 1240 428 1320 424 C 1400 420 1460 400 1540 406 C 1620 412 1700 430 1800 428 L1800 454 L900 454 Z" fill="#6fae91"/>
        <g fill="#5b9a7f">
          <circle cx="120" cy="424" r="13"/>
          <circle cx="140" cy="430" r="9"/>
          <circle cx="470" cy="428" r="10"/>
          <circle cx="742" cy="418" r="12"/>
          <circle cx="760" cy="426" r="8"/>
        </g>
      </g>
    </g>

    <!-- 公路 -->
    <rect x="0" y="448" width="900" height="112" fill="url(#roadGrad)"/>
    <rect x="0" y="448" width="900" height="5" fill="#b9c6d3" opacity=".55"/>
    <line class="road-line" x1="0" y1="524" x2="900" y2="524" stroke="#f5f8fc" stroke-width="9"
          stroke-linecap="round" stroke-dasharray="64 56" opacity=".85"/>

    <!-- 地面阴影 -->
    <ellipse cx="466" cy="522" rx="186" ry="13" fill="#2f4358" opacity=".18"/>

    <g class="rig">

      <!-- 远侧的腿 -->
      <g class="leg-far">
        <path d="M394 310 L422 386" stroke="#cf7f16" stroke-width="15" stroke-linecap="round" fill="none"/>
        <g class="shin-far">
          <path d="M422 386 L452 468" stroke="#cf7f16" stroke-width="12" stroke-linecap="round" fill="none"/>
          <path d="M444 462 L470 468 L468 478 C458 482 448 478 442 474 Z" fill="#b96f10"/>
        </g>
      </g>

      <!-- 自行车 -->
      <g class="bike">
        <!-- 后轮 -->
        <g class="spin-r">
          <circle cx="330" cy="448" r="72" fill="#e9f1f8" opacity=".55"/>
          <circle cx="330" cy="448" r="72" fill="none" stroke="#22303f" stroke-width="11"/>
          <circle cx="330" cy="448" r="63" fill="none" stroke="#c3cedd" stroke-width="3.5"/>
          <g stroke="#c3cedd" stroke-width="2.6" stroke-linecap="round">
            <line x1="330" y1="448" x2="393" y2="448"/>
            <line x1="330" y1="448" x2="374.5" y2="492.5"/>
            <line x1="330" y1="448" x2="330" y2="511"/>
            <line x1="330" y1="448" x2="285.5" y2="492.5"/>
            <line x1="330" y1="448" x2="267" y2="448"/>
            <line x1="330" y1="448" x2="285.5" y2="403.5"/>
            <line x1="330" y1="448" x2="330" y2="385"/>
            <line x1="330" y1="448" x2="374.5" y2="403.5"/>
          </g>
          <circle cx="330" cy="448" r="8" fill="#22303f"/>
          <circle cx="330" cy="448" r="3" fill="#c3cedd"/>
          <circle cx="330" cy="400" r="4.5" fill="#f59e0b"/>
        </g>

        <!-- 前轮 -->
        <g class="spin-f">
          <circle cx="600" cy="448" r="72" fill="#e9f1f8" opacity=".55"/>
          <circle cx="600" cy="448" r="72" fill="none" stroke="#22303f" stroke-width="11"/>
          <circle cx="600" cy="448" r="63" fill="none" stroke="#c3cedd" stroke-width="3.5"/>
          <g stroke="#c3cedd" stroke-width="2.6" stroke-linecap="round">
            <line x1="600" y1="448" x2="663" y2="448"/>
            <line x1="600" y1="448" x2="644.5" y2="492.5"/>
            <line x1="600" y1="448" x2="600" y2="511"/>
            <line x1="600" y1="448" x2="555.5" y2="492.5"/>
            <line x1="600" y1="448" x2="537" y2="448"/>
            <line x1="600" y1="448" x2="555.5" y2="403.5"/>
            <line x1="600" y1="448" x2="600" y2="385"/>
            <line x1="600" y1="448" x2="644.5" y2="403.5"/>
          </g>
          <circle cx="600" cy="448" r="8" fill="#22303f"/>
          <circle cx="600" cy="448" r="3" fill="#c3cedd"/>
          <circle cx="600" cy="400" r="4.5" fill="#f59e0b"/>
        </g>

        <!-- 链条 -->
        <g stroke="#9aa8b8" stroke-width="3" fill="none">
          <path d="M462 436 L332 442"/>
          <path d="M462 464 L332 454"/>
        </g>

        <!-- 车架 -->
        <g stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round" fill="none">
          <path d="M462 450 L412 344"/>
          <path d="M412 344 L542 322"/>
          <path d="M542 322 L554 382"/>
          <path d="M554 382 L462 450"/>
          <path d="M412 344 L330 448"/>
          <path d="M462 450 L330 448"/>
          <path d="M554 382 L600 448"/>
        </g>
        <g stroke="#0b7d75" stroke-width="3" stroke-linecap="round" fill="none" opacity=".45">
          <path d="M420 344 L534 324"/>
        </g>

        <!-- 座管 + 车座 -->
        <line x1="412" y1="344" x2="406" y2="330" stroke="#22303f" stroke-width="7" stroke-linecap="round"/>
        <path d="M388 332 C 400 322 424 320 436 330 C 424 340 400 342 388 332 Z" fill="#2b3947"/>

        <!-- 车把 -->
        <line x1="542" y1="322" x2="534" y2="304" stroke="#2b3947" stroke-width="8" stroke-linecap="round"/>
        <path d="M506 306 L566 292" stroke="#2b3947" stroke-width="8" stroke-linecap="round" fill="none"/>
        <circle cx="510" cy="306" r="6.5" fill="#1b2530"/>
        <circle cx="563" cy="293" r="6.5" fill="#1b2530"/>

        <!-- 曲柄与脚踏 -->
        <g class="crank">
          <line x1="462" y1="450" x2="462" y2="424" stroke="#3b4a5a" stroke-width="7" stroke-linecap="round"/>
          <line x1="462" y1="450" x2="462" y2="476" stroke="#3b4a5a" stroke-width="7" stroke-linecap="round"/>
          <rect x="446" y="417" width="30" height="9" rx="4" fill="#4d5f72"/>
          <rect x="446" y="474" width="30" height="9" rx="4" fill="#4d5f72"/>
          <circle cx="462" cy="450" r="16" fill="none" stroke="#2b3947" stroke-width="5"/>
          <circle cx="462" cy="450" r="16" fill="none" stroke="#7d8ea1" stroke-width="2" stroke-dasharray="3 3"/>
          <circle cx="462" cy="450" r="5" fill="#c3cedd"/>
        </g>
      </g>

      <!-- 近侧的腿 -->
      <g class="leg-near">
        <path d="M400 314 L438 380" stroke="#f5a02a" stroke-width="15" stroke-linecap="round" fill="none"/>
        <g class="shin-near">
          <path d="M438 380 L460 422" stroke="#f5a02a" stroke-width="12" stroke-linecap="round" fill="none"/>
          <path d="M452 414 L480 420 L478 431 C467 436 456 431 450 426 Z" fill="#e08a12"/>
        </g>
      </g>

      <!-- 鹈鹕 -->
      <g class="pelican">
        <!-- 尾羽 -->
        <path d="M322 256 C300 238 280 232 266 240 C284 250 292 264 296 282 C306 274 314 266 322 256 Z" fill="url(#bodyGrad)"/>

        <!-- 身体 -->
        <ellipse cx="388" cy="266" rx="84" ry="64" fill="url(#bodyGrad)"/>
        <ellipse cx="372" cy="238" rx="46" ry="30" fill="#ffffff" opacity=".75"/>

        <!-- 头颈 -->
        <g class="head-group">
          <path d="M412 226 C424 190 430 162 448 142" stroke="url(#bodyGrad)" stroke-width="46" stroke-linecap="round" fill="none"/>
          <circle cx="472" cy="134" r="30" fill="url(#bodyGrad)"/>
          <path d="M452 108 C458 98 468 96 474 102" stroke="#dbe6ef" stroke-width="5" stroke-linecap="round" fill="none"/>

          <!-- 喉囊 -->
          <path class="pouch" d="M490 138 C548 152 612 152 652 150 C642 192 592 216 542 202 C508 192 486 170 490 138 Z" fill="url(#pouchGrad)"/>
          <path d="M508 160 C540 178 578 188 616 180" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity=".28"/>

          <!-- 上喙 -->
          <path d="M488 110 C556 112 620 126 656 144 C662 147 660 155 652 154 C610 152 548 148 488 140 Z" fill="url(#beakGrad)"/>
          <path d="M508 122 C556 124 602 132 634 142" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".35"/>
          <path d="M516 126 L532 129" stroke="#c97a12" stroke-width="2.5" stroke-linecap="round" opacity=".65"/>

          <!-- 眼睛 -->
          <circle cx="484" cy="122" r="6.2" fill="#22303f"/>
          <circle cx="486.4" cy="119.8" r="2" fill="#ffffff"/>
        </g>

        <!-- 翅膀 -->
        <g class="wing">
          <path d="M418 222 C468 230 504 258 514 296 C504 312 476 316 452 308 C432 312 412 300 408 282 C406 258 410 238 418 222 Z"
                fill="#eef4f9" stroke="#cdd9e6" stroke-width="2"/>
          <g stroke="#c6d2df" stroke-width="2.5" stroke-linecap="round" fill="none">
            <path d="M436 244 C458 262 476 278 488 296"/>
            <path d="M424 260 C446 276 462 290 472 304"/>
            <path d="M416 278 C436 288 450 298 458 306"/>
          </g>
        </g>
      </g>
    </g>
  </svg>
</div>
</body>
</html>
