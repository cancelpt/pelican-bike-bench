<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹈鹕骑自行车</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #87CEEB 0%, #F7F5F1 70%);
            font-family: 'Inter', sans-serif;
        }

        .container {
            position: relative;
            width: 800px;
            height: 600px;
        }

        svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
            <!-- Ground -->
            <rect x="0" y="450" width="800" height="150" fill="#8FBC8F" opacity="0.6"/>

            <!-- Bicycle Group -->
            <g id="bicycle" transform="translate(400, 350)">
                <!-- Back Wheel -->
                <g id="backWheel" transform="translate(-80, 0)">
                    <circle cx="0" cy="0" r="40" fill="none" stroke="#333" stroke-width="3"/>
                    <line x1="-28" y1="-28" x2="28" y2="28" stroke="#333" stroke-width="2">
                        <animateTransform
                            attributeName="transform"
                            type="rotate"
                            from="0 0 0"
                            to="360 0 0"
                            dur="1.5s"
                            repeatCount="indefinite"/>
                    </line>
                    <line x1="28" y1="-28" x2="-28" y2="28" stroke="#333" stroke-width="2">
                        <animateTransform
                            attributeName="transform"
                            type="rotate"
                            from="0 0 0"
                            to="360 0 0"
                            dur="1.5s"
                            repeatCount="indefinite"/>
                    </line>
                    <circle cx="0" cy="0" r="8" fill="#555"/>
                </g>

                <!-- Front Wheel -->
                <g id="frontWheel" transform="translate(80, 0)">
                    <circle cx="0" cy="0" r="40" fill="none" stroke="#333" stroke-width="3"/>
                    <line x1="-28" y1="-28" x2="28" y2="28" stroke="#333" stroke-width="2">
                        <animateTransform
                            attributeName="transform"
                            type="rotate"
                            from="0 0 0"
                            to="360 0 0"
                            dur="1.5s"
                            repeatCount="indefinite"/>
                    </line>
                    <line x1="28" y1="-28" x2="-28" y2="28" stroke="#333" stroke-width="2">
                        <animateTransform
                            attributeName="transform"
                            type="rotate"
                            from="0 0 0"
                            to="360 0 0"
                            dur="1.5s"
                            repeatCount="indefinite"/>
                    </line>
                    <circle cx="0" cy="0" r="8" fill="#555"/>
                </g>

                <!-- Frame -->
                <path d="M -80,0 L -20,-60 L 60,-60 L 80,0" fill="none" stroke="#3C5A78" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M -20,-60 L -80,0" fill="none" stroke="#3C5A78" stroke-width="4"/>
                <path d="M -20,-60 L 20,0" fill="none" stroke="#3C5A78" stroke-width="4"/>

                <!-- Seat -->
                <ellipse cx="-20" cy="-70" rx="20" ry="8" fill="#2E4760"/>

                <!-- Handlebars -->
                <line x1="60" y1="-60" x2="70" y2="-75" stroke="#3C5A78" stroke-width="3"/>
                <line x1="70" y1="-75" x2="55" y2="-75" stroke="#3C5A78" stroke-width="3"/>
                <line x1="70" y1="-75" x2="85" y2="-75" stroke="#3C5A78" stroke-width="3"/>

                <!-- Pedals and Crank -->
                <g id="pedals" transform="translate(20, 0)">
                    <circle cx="0" cy="0" r="6" fill="#555"/>
                    <g id="crankArm">
                        <line x1="0" y1="0" x2="0" y2="25" stroke="#333" stroke-width="3"/>
                        <rect x="-8" y="20" width="16" height="10" rx="2" fill="#333"/>
                        <animateTransform
                            attributeName="transform"
                            type="rotate"
                            from="0 0 0"
                            to="360 0 0"
                            dur="1.5s"
                            repeatCount="indefinite"/>
                    </g>
                </g>
            </g>

            <!-- Pelican Group -->
            <g id="pelican" transform="translate(400, 280)">
                <!-- Body with bounce animation -->
                <g id="pelicanBody">
                    <!-- Body -->
                    <ellipse cx="0" cy="0" rx="45" ry="55" fill="#FFEFD5"/>
                    <ellipse cx="0" cy="0" rx="40" ry="50" fill="#FFE4B5"/>

                    <!-- Wing -->
                    <path d="M -25,-10 Q -60,-5 -70,15 Q -60,25 -30,20 Z" fill="#F5DEB3" opacity="0.9"/>

                    <!-- Neck -->
                    <ellipse cx="15" cy="-40" rx="12" ry="25" fill="#FFE4B5"/>

                    <!-- Head -->
                    <ellipse cx="20" cy="-60" rx="20" ry="22" fill="#FFEFD5"/>

                    <!-- Eye -->
                    <circle cx="28" cy="-65" r="4" fill="#1E2227"/>
                    <circle cx="30" cy="-66" r="1.5" fill="white"/>

                    <!-- Beak (upper) -->
                    <path d="M 30,-55 Q 65,-50 75,-48 Q 70,-42 30,-47 Z" fill="#FF8C00"/>

                    <!-- Beak pouch (lower) -->
                    <path d="M 30,-47 Q 70,-42 75,-48 Q 70,-35 65,-30 Q 50,-38 30,-45 Z" fill="#FFA500" opacity="0.7">
                        <animate
                            attributeName="d"
                            values="M 30,-47 Q 70,-42 75,-48 Q 70,-35 65,-30 Q 50,-38 30,-45 Z;
                                    M 30,-47 Q 70,-42 75,-48 Q 72,-37 67,-32 Q 52,-40 30,-45 Z;
                                    M 30,-47 Q 70,-42 75,-48 Q 70,-35 65,-30 Q 50,-38 30,-45 Z"
                            dur="2s"
                            repeatCount="indefinite"/>
                    </path>

                    <!-- Legs with pedaling animation -->
                    <g id="legs">
                        <g id="leftLeg">
                            <line x1="-10" y1="40" x2="-15" y2="70" stroke="#FF8C00" stroke-width="4" stroke-linecap="round">
                                <animate
                                    attributeName="x2"
                                    values="-15; -5; -15"
                                    dur="1.5s"
                                    repeatCount="indefinite"/>
                                <animate
                                    attributeName="y2"
                                    values="70; 85; 70"
                                    dur="1.5s"
                                    repeatCount="indefinite"/>
                            </line>
                            <circle cx="-15" cy="70" r="4" fill="#FF6347">
                                <animate
                                    attributeName="cx"
                                    values="-15; -5; -15"
                                    dur="1.5s"
                                    repeatCount="indefinite"/>
                                <animate
                                    attributeName="cy"
                                    values="70; 85; 70"
                                    dur="1.5s"
                                    repeatCount="indefinite"/>
                            </circle>
                        </g>

                        <g id="rightLeg">
                            <line x1="10" y1="40" x2="5" y2="85" stroke="#FF8C00" stroke-width="4" stroke-linecap="round">
                                <animate
                                    attributeName="x2"
                                    values="5; 15; 5"
                                    dur="1.5s"
                                    repeatCount="indefinite"/>
                                <animate
                                    attributeName="y2"
                                    values="85; 70; 85"
                                    dur="1.5s"
                                    repeatCount="indefinite"/>
                            </line>
                            <circle cx="5" cy="85" r="4" fill="#FF6347">
                                <animate
                                    attributeName="cx"
                                    values="5; 15; 5"
                                    dur="1.5s"
                                    repeatCount="indefinite"/>
                                <animate
                                    attributeName="cy"
                                    values="85; 70; 85"
                                    dur="1.5s"
                                    repeatCount="indefinite"/>
                            </circle>
                        </g>
                    </g>

                    <!-- Bounce animation for entire pelican body -->
                    <animateTransform
                        attributeName="transform"
                        type="translate"
                        values="0,0; 0,-8; 0,0"
                        dur="1.5s"
                        repeatCount="indefinite"/>
                </g>
            </g>

            <!-- Clouds -->
            <g opacity="0.3">
                <ellipse cx="150" cy="100" rx="40" ry="25" fill="white"/>
                <ellipse cx="180" cy="95" rx="50" ry="30" fill="white"/>
                <ellipse cx="210" cy="100" rx="35" ry="22" fill="white"/>

                <ellipse cx="600" cy="80" rx="45" ry="28" fill="white"/>
                <ellipse cx="635" cy="75" rx="55" ry="32" fill="white"/>
                <ellipse cx="670" cy="80" rx="40" ry="25" fill="white"/>
            </g>
        </svg>
    </div>
</body>
</html>
