<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #87CEEB;
    overflow: hidden;
    font-family: sans-serif;
  }
  .stage {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg {
    width: 100%;
    height: 100%;
    max-width: 900px;
    max-height: 600px;
  }

  /* 车轮旋转 */
  .wheel-spokes {
    transform-origin: center;
    transform-box: fill-box;
    animation: spin 0.8s linear infinite;
  }
  .wheel-spokes.back  { animation-duration: 0.8s; }
  .wheel-spokes.front { animation-duration: 0.8s; }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* 曲柄 + 踏板旋转 */
  .crank {
    transform-origin: 360px 330px;
    transform-box: view-box;
    animation: spin 1.2s linear infinite;
  }

  /* 鹈鹕身体上下轻微颠簸 */
  .pelican-body {
    animation: bob 0.6s ease-in-out infinite alternate;
  }
  @keyframes bob {
    from { transform: translateY(0); }
    to   { transform: translateY(-4px); }
  }

  /* 翅膀拍动 */
  .wing {
    transform-origin: 330px 230px;
    transform-box: view-box;
    animation: flap 0.5s ease-in-out infinite alternate;
  }
  @keyframes flap {
    from { transform: rotate(-6deg); }
    to   { transform: rotate(8deg); }
  }

  /* 头部微微点动 */
  .head-group {
    transform-origin: 380px 200px;
    transform-box: view-box;
    animation: nod 1.4s ease-in-out infinite;
  }
  @keyframes nod {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-5deg); }
  }

  /* 腿跟随踏板 */
  .leg-front {
    transform-origin: 360px 280px;
    transform-box: view-box;
    animation: spin 1.2s linear infinite;
  }

  /* 云朵飘动 */
  .cloud {
    animation: drift linear infinite;
  }
  .cloud.c1 { animation-duration: 40s; }
  .cloud.c2 { animation-duration: 60s; animation-delay: -20s; }
  .cloud.c3 { animation-duration: 50s; animation-delay: -10s; }
  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(-900px); }
  }

  /* 地面线条滚动 */
  .ground-line {
    animation: ground-move 0.6s linear infinite;
  }
  @keyframes ground-move {
    from { transform: translateX(0); }
    to   { transform: translateX(-80px); }
  }

  /* 速度线 */
  .speed-line {
    animation: speed 0.4s linear infinite;
  }
  @keyframes speed {
    from { transform: translateX(0); opacity: 0.8; }
    to   { transform: translateX(-60px); opacity: 0; }
  }

  .title {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    color: #fff;
    font-size: 24px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="title">🐦 鹈鹕骑自行车 🚲</div>
<div class="stage">
<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 天空渐变 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#4FC3F7"/>
      <stop offset="60%" stop-color="#81D4FA"/>
      <stop offset="100%" stop-color="#B3E5FC"/>
    </linearGradient>
    <!-- 太阳 -->
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </radialGradient>
    <!-- 车轮金属 -->
    <radialGradient id="wheel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#90A4AE"/>
      <stop offset="70%" stop-color="#546E7A"/>
      <stop offset="100%" stop-color="#263238"/>
    </radialGradient>
    <!-- 鹈鹕身体渐变 -->
    <linearGradient id="pelicanBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
    <!-- 喉囊渐变 -->
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFAB91"/>
      <stop offset="100%" stop-color="#FF7043"/>
    </linearGradient>
    <!-- 地面 -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8BC34A"/>
      <stop offset="100%" stop-color="#558B2F"/>
    </linearGradient>
  </defs>

  <!-- 天空背景 -->
  <rect x="0" y="0" width="900" height="600" fill="url(#sky)"/>

  <!-- 太阳 -->
  <circle cx="780" cy="100" r="55" fill="url(#sun)"/>
  <g opacity="0.6">
    <line x1="780" y1="20" x2="780" y2="5" stroke="#FFB300" stroke-width="4" stroke-linecap="round"/>
    <line x1="780" y1="180" x2="780" y2="195" stroke="#FFB300" stroke-width="4" stroke-linecap="round"/>
    <line x1="700" y1="100" x2="685" y2="100" stroke="#FFB300" stroke-width="4" stroke-linecap="round"/>
    <line x1="860" y1="100" x2="875" y2="100" stroke="#FFB300" stroke-width="4" stroke-linecap="round"/>
    <line x1="723" y1="43" x2="712" y2="32" stroke="#FFB300" stroke-width="4" stroke-linecap="round"/>
    <line x1="837" y1="157" x2="848" y2="168" stroke="#FFB300" stroke-width="4" stroke-linecap="round"/>
    <line x1="837" y1="43" x2="848" y2="32" stroke="#FFB300" stroke-width="4" stroke-linecap="round"/>
    <line x1="723" y1="157" x2="712" y2="168" stroke="#FFB300" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- 云朵（重复移动） -->
  <g class="cloud c1">
    <g transform="translate(900,80)">
      <ellipse cx="0" cy="0" rx="45" ry="22" fill="#fff"/>
      <ellipse cx="35" cy="-8" rx="35" ry="20" fill="#fff"/>
      <ellipse cx="60" cy="2" rx="30" ry="18" fill="#fff"/>
    </g>
  </g>
  <g class="cloud c2">
    <g transform="translate(1200,150)">
      <ellipse cx="0" cy="0" rx="35" ry="18" fill="#fff" opacity="0.9"/>
      <ellipse cx="28" cy="-6" rx="28" ry="16" fill="#fff" opacity="0.9"/>
      <ellipse cx="50" cy="2" rx="24" ry="14" fill="#fff" opacity="0.9"/>
    </g>
  </g>
  <g class="cloud c3">
    <g transform="translate(1500,60)">
      <ellipse cx="0" cy="0" rx="40" ry="20" fill="#fff" opacity="0.85"/>
      <ellipse cx="32" cy="-7" rx="30" ry="18" fill="#fff" opacity="0.85"/>
    </g>
  </g>

  <!-- 远处小山 -->
  <path d="M0 420 Q 150 360 300 420 T 600 420 T 900 420 L 900 600 L 0 600 Z" fill="#7CB342" opacity="0.6"/>

  <!-- 地面 -->
  <rect x="0" y="440" width="900" height="160" fill="url(#ground)"/>
  <!-- 地面滚动线条 -->
  <g class="ground-line">
    <g>
      <line x1="0" y1="470" x2="40" y2="470" stroke="#33691E" stroke-width="3" stroke-linecap="round"/>
      <line x1="80" y1="470" x2="120" y2="470" stroke="#33691E" stroke-width="3" stroke-linecap="round"/>
      <line x1="160" y1="470" x2="200" y2="470" stroke="#33691E" stroke-width="3" stroke-linecap="round"/>
      <line x1="240" y1="470" x2="280" y2="470" stroke="#33691E" stroke-width="3" stroke-linecap="round"/>
      <line x1="320" y1="470" x2="360" y2="470" stroke="#33691E" stroke-width="3" stroke-linecap="round"/>
      <line x1="400" y1="470" x2="440" y2="470" stroke="#33691E" stroke-width="3" stroke-linecap="round"/>
      <line x1="480" y1="470" x2="520" y2="470" stroke="#33691E" stroke-width="3" stroke-linecap="round"/>
      <line x1="560" y1="470" x2="600" y2="470" stroke="#33691E" stroke-width="3" stroke-linecap="round"/>
      <line x1="640" y1="470" x2="680" y2="470" stroke="#33691E" stroke-width="3" stroke-linecap="round"/>
      <line x1="720" y1="470" x2="760" y2="470" stroke="#33691E" stroke-width="3" stroke-linecap="round"/>
      <line x1="800" y1="470" x2="840" y2="470" stroke="#33691E" stroke-width="3" stroke-linecap="round"/>
      <line x1="880" y1="470" x2="920" y2="470" stroke="#33691E" stroke-width="3" stroke-linecap="round"/>
      <line x1="960" y1="470" x2="1000" y2="470" stroke="#33691E" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 速度线 -->
  <g class="speed-line" style="animation-delay:0s">
    <line x1="550" y1="300" x2="600" y2="300" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="540" y1="330" x2="590" y2="330" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="560" y1="270" x2="610" y2="270" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- ============ 自行车 ============ -->
  <g id="bicycle">
    <!-- 后轮 -->
    <g transform="translate(230,380)">
      <circle r="62" fill="url(#wheel)" stroke="#263238" stroke-width="6"/>
      <circle r="56" fill="none" stroke="#CFD8DC" stroke-width="2"/>
      <g class="wheel-spokes back">
        <line x1="-50" y1="0" x2="50" y2="0" stroke="#ECEFF1" stroke-width="2"/>
        <line x1="0" y1="-50" x2="0" y2="50" stroke="#ECEFF1" stroke-width="2"/>
        <line x1="-35" y1="-35" x2="35" y2="35" stroke="#ECEFF1" stroke-width="2"/>
        <line x1="-35" y1="35" x2="35" y2="-35" stroke="#ECEFF1" stroke-width="2"/>
      </g>
      <circle r="8" fill="#37474F"/>
    </g>

    <!-- 前轮 -->
    <g transform="translate(510,380)">
      <circle r="62" fill="url(#wheel)" stroke="#263238" stroke-width="6"/>
      <circle r="56" fill="none" stroke="#CFD8DC" stroke-width="2"/>
      <g class="wheel-spokes front">
        <line x1="-50" y1="0" x2="50" y2="0" stroke="#ECEFF1" stroke-width="2"/>
        <line x1="0" y1="-50" x2="0" y2="50" stroke="#ECEFF1" stroke-width="2"/>
        <line x1="-35" y1="-35" x2="35" y2="35" stroke="#ECEFF1" stroke-width="2"/>
        <line x1="-35" y1="35" x2="35" y2="-35" stroke="#ECEFF1" stroke-width="2"/>
      </g>
      <circle r="8" fill="#37474F"/>
    </g>

    <!-- 车架 -->
    <g stroke="#E53935" stroke-width="8" stroke-linecap="round" fill="none">
      <!-- 下管: 后轮中心 -> 脚踏中轴 -->
      <line x1="230" y1="380" x2="360" y2="330"/>
      <!-- 座管: 中轴 -> 座垫 -->
      <line x1="360" y1="330" x2="335" y2="250"/>
      <!-- 上管: 座垫 -> 头管 -->
      <line x1="335" y1="250" x2="470" y2="260"/>
      <!-- 立管/头管: 头管 -> 前轮中心 -->
      <line x1="470" y1="260" x2="510" y2="380"/>
      <!-- 后下叉: 中轴 -> 后轮 -->
      <line x1="360" y1="330" x2="230" y2="380"/>
      <!-- 后上叉: 座垫 -> 后轮 -->
      <line x1="335" y1="250" x2="230" y2="380"/>
      <!-- 前叉: 头管 -> 前轮 -->
      <line x1="470" y1="260" x2="510" y2="380"/>
    </g>

    <!-- 座垫 -->
    <ellipse cx="335" cy="244" rx="26" ry="8" fill="#212121"/>
    <rect x="328" y="248" width="14" height="10" fill="#424242"/>

    <!-- 车把 -->
    <g stroke="#212121" stroke-width="6" stroke-linecap="round" fill="none">
      <line x1="470" y1="260" x2="460" y2="215"/>
      <line x1="440" y1="210" x2="485" y2="215"/>
    </g>
    <circle cx="440" cy="210" r="6" fill="#424242"/>
    <circle cx="485" cy="215" r="6" fill="#424242"/>

    <!-- 曲柄 + 踏板（旋转） -->
    <g class="crank">
      <!-- 齿盘 -->
      <circle cx="360" cy="330" r="18" fill="#37474F" stroke="#263238" stroke-width="2"/>
      <circle cx="360" cy="330" r="6" fill="#90A4AE"/>
      <!-- 曲柄臂 -->
      <line x1="360" y1="330" x2="395" y2="365" stroke="#424242" stroke-width="6" stroke-linecap="round"/>
      <!-- 前踏板 -->
      <rect x="385" y="360" width="22" height="8" rx="2" fill="#FFC107"/>
      <!-- 后曲柄（反向） -->
      <line x1="360" y1="330" x2="325" y2="295" stroke="#424242" stroke-width="6" stroke-linecap="round"/>
      <rect x="313" y="288" width="22" height="8" rx="2" fill="#FFC107"/>
    </g>

    <!-- 链条 -->
    <path d="M245 380 L345 340 M375 330 L245 380" stroke="#616161" stroke-width="3" fill="none" opacity="0.7"/>
  </g>

  <!-- ============ 鹈鹕 ============ -->
  <g class="pelican-body">
    <!-- 腿（前腿跟随踏板） -->
    <g class="leg-front">
      <line x1="345" y1="285" x2="360" y2="330" stroke="#FFA726" stroke-width="7" stroke-linecap="round"/>
      <!-- 脚 -->
      <path d="M354 328 q 6 4 12 2 q -2 6 -8 8 q -8 -2 -6 -10 z" fill="#FF9800" stroke="#E65100" stroke-width="1.5"/>
    </g>
    <!-- 后腿（固定，视觉上） -->
    <g>
      <line x1="330" y1="285" x2="335" y2="300" stroke="#FFB74D" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- 身体 -->
    <ellipse cx="340" cy="270" rx="58" ry="42" fill="url(#pelicanBody)" stroke="#BDBDBD" stroke-width="2"/>

    <!-- 尾巴 -->
    <path d="M285 265 q -25 -5 -35 5 q 5 10 30 8 z" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="1.5"/>

    <!-- 翅膀 -->
    <path class="wing" d="M315 245 q 30 -25 60 -10 q -10 25 -45 30 q -20 -2 -15 -20 z"
          fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>

    <!-- 头部组（含头、喙、喉囊） -->
    <g class="head-group">
      <!-- 脖子 -->
      <path d="M375 240 q 15 -30 30 -45" stroke="#FFFFFF" stroke-width="18" fill="none" stroke-linecap="round"/>
      <path d="M375 240 q 15 -30 30 -45" stroke="#BDBDBD" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.3"/>

      <!-- 头 -->
      <circle cx="410" cy="190" r="26" fill="url(#pelicanBody)" stroke="#BDBDBD" stroke-width="1.5"/>

      <!-- 眼睛 -->
      <circle cx="418" cy="183" r="6" fill="#fff"/>
      <circle cx="420" cy="184" r="3.5" fill="#212121"/>
      <circle cx="421" cy="183" r="1.2" fill="#fff"/>

      <!-- 上喙 -->
      <path d="M430 188 q 55 -2 60 10 q -40 4 -58 -2 z" fill="#FFB74D" stroke="#E65100" stroke-width="1.5"/>
      <!-- 下喙 + 喉囊（可装鱼的大口袋） -->
      <path d="M432 196 q 40 30 58 6 q -8 18 -30 22 q -22 0 -32 -16 z" fill="url(#pouch)" stroke="#E64A19" stroke-width="1.5"/>
      <!-- 喉囊纹理 -->
      <path d="M438 205 q 12 12 28 12" stroke="#FF8A65" stroke-width="1.5" fill="none"/>
      <path d="M436 215 q 14 8 30 6" stroke="#FF8A65" stroke-width="1.5" fill="none"/>

      <!-- 喙尖钩 -->
      <path d="M488 198 q 4 2 2 6 q -3 -1 -5 -4 z" fill="#E65100"/>
    </g>

    <!-- 抓车把的翅膀尖/手 -->
    <path d="M370 245 q 20 -30 50 -35" stroke="#F5F5F5" stroke-width="10" fill="none" stroke-linecap="round"/>
    <circle cx="460" cy="208" r="8" fill="#FFA726" stroke="#E65100" stroke-width="1.5"/>
  </g>

  <!-- 小草装饰 -->
  <g fill="#33691E">
    <path d="M50 440 q 4 -12 8 0 z"/>
    <path d="M130 440 q 3 -10 6 0 z"/>
    <path d="M680 440 q 4 -12 8 0 z"/>
    <path d="M820 440 q 3 -10 6 0 z"/>
  </g>
</svg>
</div>
</body>
</html>
