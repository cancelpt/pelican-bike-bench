<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕骑行日记 · SVG 2D 动画</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5f1df;
      --muted: #a8c4c0;
      --line: rgba(228, 239, 224, 0.17);
      --panel: rgba(8, 23, 30, 0.82);
      --accent: #f6a05e;
      --accent-2: #8dd5bc;
      --speed: 1;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      background: #07141c;
      color: var(--ink);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    .app {
      width: min(1180px, 100%);
      min-height: 100vh;
      padding: clamp(18px, 3vw, 34px);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--accent-2);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 720px;
      font-size: clamp(1.65rem, 4vw, 2.65rem);
      line-height: 1.08;
      font-weight: 750;
    }

    .intro {
      max-width: 520px;
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .status {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #d9eee2;
      background: rgba(16, 46, 53, 0.62);
      font-size: 0.78rem;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 0 4px rgba(141, 213, 188, 0.13);
    }

    .status.is-paused .status-dot {
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(246, 160, 94, 0.13);
    }

    .stage-wrap {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(190, 221, 203, 0.22);
      border-radius: 18px;
      background: #0f2a34;
      box-shadow: 0 22px 58px rgba(0, 0, 0, 0.28);
    }

    .stage-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(112deg, rgba(255, 255, 255, 0.07), transparent 28%, transparent 78%, rgba(255, 255, 255, 0.03));
      mix-blend-mode: screen;
    }

    svg.scene {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 12 / 7.6;
      min-height: 360px;
      max-height: 690px;
      background: #173b45;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      backdrop-filter: blur(14px);
    }

    .button-row {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    button {
      min-height: 38px;
      border: 1px solid rgba(232, 240, 221, 0.22);
      border-radius: 8px;
      padding: 0 13px;
      color: var(--ink);
      background: rgba(30, 64, 70, 0.8);
      font: inherit;
      font-size: 0.84rem;
      font-weight: 650;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    button:hover { border-color: rgba(246, 160, 94, 0.74); background: rgba(46, 83, 84, 0.92); }
    button:active { transform: translateY(1px); }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .primary {
      border-color: transparent;
      color: #10262b;
      background: var(--accent);
    }

    .primary:hover { border-color: transparent; background: #ffc080; }

    .button-icon {
      display: inline-block;
      width: 1.1em;
      margin-right: 5px;
      font-weight: 800;
      text-align: center;
    }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: min(330px, 46%);
      color: var(--muted);
      font-size: 0.78rem;
    }

    .speed-control label { white-space: nowrap; }

    input[type="range"] {
      width: 100%;
      height: 4px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .speed-value {
      min-width: 42px;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .caption {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: #789e9e;
      font-size: 0.73rem;
    }

    .caption span:last-child { text-align: right; }

    /* Animation controls are applied to SVG layers so pause/restart stays in sync. */
    .animatable { animation-play-state: running; }
    .is-paused .animatable { animation-play-state: paused; }

    .wheel {
      transform-box: fill-box;
      transform-origin: center;
      animation: wheel-spin calc(2.4s / var(--speed)) linear infinite;
    }

    .ground-dash {
      animation: ground-flow calc(3.8s / var(--speed)) linear infinite;
    }

    .cloud-a { animation: cloud-drift calc(18s / var(--speed)) linear infinite; }
    .cloud-b { animation: cloud-drift-reverse calc(24s / var(--speed)) linear infinite; }
    .water-line { animation: water-shimmer calc(4s / var(--speed)) ease-in-out infinite; }
    .rider { transform-box: fill-box; transform-origin: center bottom; animation: rider-bob calc(1.2s / var(--speed)) ease-in-out infinite; }
    .wing { transform-box: fill-box; transform-origin: 74% 88%; animation: wing-flap calc(1.15s / var(--speed)) ease-in-out infinite; }
    .leg-front { transform-box: fill-box; transform-origin: 20% 14%; animation: pedal-front calc(1.2s / var(--speed)) linear infinite; }
    .leg-back { transform-box: fill-box; transform-origin: 20% 14%; animation: pedal-back calc(1.2s / var(--speed)) linear infinite; }
    .feather { animation: feather-twitch calc(2.7s / var(--speed)) ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }

    @keyframes wheel-spin { to { transform: rotate(360deg); } }
    @keyframes ground-flow { to { transform: translateX(-260px); } }
    @keyframes cloud-drift { to { transform: translateX(150px); } }
    @keyframes cloud-drift-reverse { to { transform: translateX(-130px); } }
    @keyframes water-shimmer { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.78; } }
    @keyframes rider-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes wing-flap { 0%, 100% { transform: rotate(1deg); } 45% { transform: rotate(-8deg); } }
    @keyframes pedal-front { 0% { transform: rotate(0deg); } 50% { transform: rotate(180deg); } 100% { transform: rotate(360deg); } }
    @keyframes pedal-back { 0% { transform: rotate(180deg); } 50% { transform: rotate(360deg); } 100% { transform: rotate(540deg); } }
    @keyframes feather-twitch { 0%, 68%, 100% { transform: rotate(0); } 76% { transform: rotate(4deg); } 84% { transform: rotate(-3deg); } }

    @media (max-width: 680px) {
      .app { padding: 18px 12px 24px; gap: 13px; }
      .topbar { align-items: flex-start; flex-direction: column; gap: 11px; }
      .status { align-self: flex-start; }
      .stage-wrap { border-radius: 13px; }
      svg.scene { min-height: 250px; }
      .controls { align-items: stretch; flex-direction: column; gap: 13px; padding: 12px; }
      .button-row { width: 100%; }
      button { flex: 1; }
      .speed-control { min-width: 0; width: 100%; }
      .caption { flex-direction: column; gap: 5px; }
      .caption span:last-child { text-align: left; }
    }

    @media (prefers-reduced-motion: reduce) {
      .animatable { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>

  <script>
    const scene = document.getElementById('scene');
    const status = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    const toggle = document.getElementById('toggle');
    const toggleText = document.getElementById('toggleText');
    const restart = document.getElementById('restart');
    const speed = document.getElementById('speed');
    const speedValue = document.getElementById('speedValue');
    const animated = () => scene.querySelectorAll('.animatable');

    function setPaused(paused) {
      scene.classList.toggle('is-paused', paused);
      status.classList.toggle('is-paused', paused);
      statusText.textContent = paused ? '已暂停' : '正在骑行';
      toggleText.textContent = paused ? '继续' : '暂停';
      toggle.querySelector('.button-icon').textContent = paused ? '>' : '||';
      toggle.setAttribute('aria-label', paused ? '继续动画' : '暂停动画');
    }

    toggle.addEventListener('click', () => setPaused(!scene.classList.contains('is-paused')));

    speed.addEventListener('input', () => {
      const value = Number(speed.value);
      scene.style.setProperty('--speed', value);
      speedValue.textContent = value.toFixed(2) + '×';
    });

    restart.addEventListener('click', () => {
      const nodes = animated();
      nodes.forEach(node => { node.style.animation = 'none'; });
      void scene.getBoundingClientRect().width;
      nodes.forEach(node => { node.style.animation = ''; });
      setPaused(false);
    });

    setPaused(false);
  </script>
</body>
</html>
