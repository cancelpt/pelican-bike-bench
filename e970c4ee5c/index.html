<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>骑车的鹈鹕 · SVG 动画</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #dcefea;
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    }
    .stage {
      position: relative;
      width: min(1160px, 96vw);
      overflow: hidden;
      border: 8px solid #fffdf7;
      border-radius: 26px;
      box-shadow: 0 20px 55px #315d6550, 0 3px 9px #315d6524;
      background: #bce8f1;
    }
    svg { display: block; width: 100%; height: auto; }
    button {
      position: absolute;
      right: 22px;
      bottom: 21px;
      padding: 10px 17px;
      border: 2px solid #fffdf7;
      border-radius: 999px;
      background: #214c59;
      color: white;
      font: 700 14px/1.2 inherit;
      cursor: pointer;
      box-shadow: 0 3px 10px #173e4b35;
    }
    button:hover { background: #336b74; }
    button:focus-visible { outline: 3px solid #f4a44f; outline-offset: 3px; }
    .cloud-a { animation: drift-a 13s ease-in-out infinite alternate; }
    .cloud-b { animation: drift-b 18s ease-in-out infinite alternate; }
    .sparkle { animation: twinkle 2.2s ease-in-out infinite alternate; }
    #lane { animation: road-flow .75s linear infinite; }
    .paused .cloud-a, .paused .cloud-b,
    .paused .sparkle, .paused #lane { animation-play-state: paused; }
    @keyframes drift-a { to { transform: translateX(27px); } }
    @keyframes drift-b { to { transform: translateX(-35px); } }
    @keyframes twinkle { to { opacity: .3; } }
    @keyframes road-flow { to { stroke-dashoffset: 154; } }
    @media (prefers-reduced-motion: reduce) {
      .cloud-a, .cloud-b, .sparkle, #lane { animation: none; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <svg viewBox="0 0 1000 650" role="img" aria-labelledby="sceneTitle sceneDesc" xmlns="http://www.w3.org/2000/svg">
      <title id="sceneTitle">骑车的鹈鹕</title>
      <desc id="sceneDesc">一只戴蓝色头盔的鹈鹕，在晴朗的海边骑着绿色自行车。车轮和双脚转动，路面向后掠过。</desc>
      <defs>
        <linearGradient id="sky" x2="0" y2="1">
          <stop stop-color="#a8dce8"/>
          <stop offset="1" stop-color="#e8f3dd"/>
        </linearGradient>
        <linearGradient id="sea" x2="0" y2="1">
          <stop stop-color="#82c9c8"/>
          <stop offset="1" stop-color="#b9d9bd"/>
        </linearGradient>
        <linearGradient id="pouch" x1="0" y1="0" x2=".4" y2="1">
          <stop stop-color="#f6bd69"/>
          <stop offset="1" stop-color="#dc824e"/>
        </linearGradient>
        <g id="spokes" stroke="#d7eeea" stroke-width="2.6" stroke-linecap="round">
          <path d="M0 0V-72 M0 0L51-51 M0 0H72 M0 0L51 51 M0 0V72 M0 0L-51 51 M0 0H-72 M0 0L-51-51"/>
        </g>
        <g id="little-flower">
          <path d="M0 0v-18" fill="none" stroke="#578c67" stroke-width="3" stroke-linecap="round"/>
          <circle cy="-21" r="6" fill="#fff8e4"/>
          <circle cy="-21" r="2.6" fill="#f2ab5d"/>
        </g>
      </defs>

      <!-- Seaside backdrop -->
      <path fill="url(#sky)" d="M0 0h1000v650H0z"/>
      <circle cx="810" cy="111" r="56" fill="#fff1b6" opacity=".8"/>
      <circle class="sparkle" cx="810" cy="111" r="42" fill="#fff5ca"/>
      <g class="cloud-a" fill="#fffdf1" opacity=".86">
        <path d="M85 150c-20 0-29-12-24-26 4-12 16-18 30-15 10-23 45-25 57-5 17-10 38 0 39 16 20 0 27 27 10 30z"/>
        <path d="M709 189c-15 0-23-10-20-20 3-10 13-15 24-13 8-18 35-19 45-3 13-8 30 0 31 13 16 0 21 23 8 23z"/>
      </g>
      <g class="cloud-b" fill="#fffdf1" opacity=".72">
        <path d="M337 103c-13 0-19-9-16-18 3-8 11-13 21-11 7-17 31-19 40-4 13-6 27 1 28 14 13 0 19 19 6 19z"/>
        <path d="M846 247c-12 0-18-9-15-17 3-9 12-13 20-11 7-15 30-16 39-2 12-6 24 1 25 13 14 0 17 17 5 17z"/>
      </g>
      <path d="M0 375c108-42 192-45 272-20 85 25 148 21 216-13 79-40 153-32 219-3 100 43 187 12 293-28v210H0z" fill="#bddbc7"/>
      <path d="M0 410c145-30 268-13 355 20 94 35 183 12 259-20 119-50 262-26 386 24v99H0z" fill="url(#sea)"/>
      <path d="M0 451c128-11 221 13 352 7 137-6 219-24 339-8 108 15 213 9 309-10" fill="none" stroke="#e7f4df" stroke-width="5" opacity=".55"/>
      <path d="M0 503c144-24 246-15 361 8 95 19 194 15 303-8 120-26 220-19 336-1v64H0z" fill="#9ecb97"/>
      <g fill="none" stroke="#498986" stroke-width="4" stroke-linecap="round" opacity=".7">
        <path d="M93 449q8-8 17 0m9 5q9-7 18 1M773 435q8-7 16 0m8 4q7-6 15 1"/>
      </g>
      <g fill="#6ba875" opacity=".9">
        <path d="M42 543q8-16 17 0h-6q-4-8-5 0zm161-5q9-18 18 0h-6q-4-8-6 0zm539 3q7-15 15 0h-5q-3-7-5 0zm152-7q10-19 21 0h-7q-4-8-7 0z"/>
      </g>
      <use href="#little-flower" x="167" y="544"/>
      <use href="#little-flower" x="725" y="548"/>
      <use href="#little-flower" x="921" y="539"/>

      <!-- Road -->
      <path d="M0 560h1000v90H0z" fill="#547883"/>
      <path d="M0 560h1000" stroke="#e7eacb" stroke-width="8"/>
      <path d="M0 646h1000" stroke="#365b68" stroke-width="8"/>
      <path id="lane" d="M-100 607h1200" fill="none" stroke="#f8edc9" stroke-width="6" stroke-linecap="round" stroke-dasharray="82 72"/>
      <ellipse cx="330" cy="566" rx="94" ry="11" fill="#244957" opacity=".26"/>
      <ellipse cx="660" cy="566" rx="94" ry="11" fill="#244957" opacity=".26"/>

      <!-- Bicycle wheels -->
      <g fill="none">
        <circle cx="330" cy="470" r="88" stroke="#244a56" stroke-width="15"/>
        <circle cx="330" cy="470" r="77" stroke="#fcf8e7" stroke-width="4"/>
        <circle cx="660" cy="470" r="88" stroke="#244a56" stroke-width="15"/>
        <circle cx="660" cy="470" r="77" stroke="#fcf8e7" stroke-width="4"/>
      </g>
      <g id="rearWheelSpin"><use href="#spokes" x="330" y="470"/></g>
      <g id="frontWheelSpin"><use href="#spokes" x="660" y="470"/></g>
      <circle cx="330" cy="470" r="12" fill="#f0b264" stroke="#274e5a" stroke-width="4"/>
      <circle cx="660" cy="470" r="12" fill="#f0b264" stroke="#274e5a" stroke-width="4"/>

      <!-- Far leg passes behind the frame -->
      <g id="rearLeg" fill="none" stroke="#c67645" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
        <path id="rearLegPath"/>
        <circle id="rearKnee" r="8" fill="#e69b57" stroke="none"/>
      </g>
      <path id="rearFoot" fill="#e39352" stroke="#b86b3f" stroke-width="2"/>

      <!-- Bicycle frame -->
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M330 470 478 354 505 460 330 470M478 354 593 359 505 460 478 354M593 359 660 470" stroke="#204b57" stroke-width="17"/>
        <path d="M330 470 478 354 505 460 330 470M478 354 593 359 505 460 478 354M593 359 660 470" stroke="#54b8ab" stroke-width="10"/>
        <path d="M477 354v-17" stroke="#204b57" stroke-width="9"/>
        <path d="M593 359 607 324h31" stroke="#204b57" stroke-width="10"/>
        <path d="M593 359 607 324h31" stroke="#f5b668" stroke-width="5"/>
        <path d="M637 324q11 1 11 13" stroke="#204b57" stroke-width="9"/>
      </g>
      <path d="M445 342q32-8 67-2 3 8-9 11h-51q-13-2-7-9z" fill="#244a56"/>
      <circle cx="505" cy="460" r="24" fill="#285865" stroke="#f9e6b6" stroke-width="5"/>
      <circle cx="505" cy="460" r="8" fill="#f5b368"/>
      <g id="crankSpin" fill="none" stroke="#263f48" stroke-linecap="round">
        <path d="M463 460h84" stroke-width="7"/>
        <path d="M453 460h27m50 0h27" stroke-width="8"/>
      </g>

      <!-- Pelican -->
      <g id="rider">
        <g fill="#fff6e5" stroke="#d9d6bf" stroke-width="2.5" stroke-linejoin="round">
          <path d="M426 310q-37-20-62-10 24 11 40 25z"/>
          <path d="M424 321q-38-10-58 3 28 5 47 12z"/>
          <path d="M474 281c10-31 21-46 17-65-2-16-18-27-12-42 8-21 37-20 46-3 11 20-8 35-13 48-7 18-3 37 11 62 7 17 0 31-17 38-20 7-44-14-32-38z"/>
          <path d="M440 268c-25 5-37 28-30 57 8 31 35 39 65 35 34-4 54-25 47-56-5-29-40-43-82-36z"/>
        </g>
        <path d="M450 279c-16 6-26 22-22 40 5 19 23 26 39 20 12-4 25-17 31-30-11-22-28-35-48-30z" fill="#e5e6d5"/>
        <g fill="none" stroke="#c8d5c8" stroke-width="3" stroke-linecap="round">
          <path d="M442 307q10 17 25 19M452 293q12 17 31 18"/>
        </g>
        <path d="M505 190c10-7 22-6 28 5-3 13-10 26-12 45" fill="none" stroke="#e0dbc6" stroke-width="3" stroke-linecap="round"/>
        <circle cx="501" cy="159" r="32" fill="#fff8e9" stroke="#dad8c4" stroke-width="2.5"/>
        <path d="M528 191c35-2 86 10 140 11-10 29-38 57-75 57-34 1-54-22-65-68z" fill="url(#pouch)" stroke="#b96d47" stroke-width="2.5"/>
        <path d="M547 212q17 30 43 33" fill="none" stroke="#ffd69b" stroke-width="5" stroke-linecap="round" opacity=".8"/>
        <path d="M520 177c46-4 102 6 163 15 9 2 10 9-1 10-59 1-117-7-161-12z" fill="#efaa64" stroke="#b86c43" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M565 186q55 3 98 11" fill="none" stroke="#ffd49b" stroke-width="3" stroke-linecap="round"/>
        <circle cx="511" cy="156" r="5" fill="#263e46"/>
        <circle cx="513" cy="154" r="1.8" fill="#fff"/>
        <path d="M471 143c6-23 39-30 57-10l-1 14c-17-11-35-11-55 1z" fill="#3d9d9a" stroke="#245e67" stroke-width="2.5"/>
        <path d="M523 144q15-2 26 6-16 8-30 2" fill="#3d9d9a" stroke="#245e67" stroke-width="2.5"/>
        <path d="M487 129q13-8 29 0" fill="none" stroke="#a8ded2" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- Near leg and webbed feet -->
      <g id="frontLeg" fill="none" stroke="#ed9b55" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
        <path id="frontLegPath"/>
        <circle id="frontKnee" r="8.5" fill="#f2ac68" stroke="none"/>
      </g>
      <path id="frontFoot" fill="#f3aa64" stroke="#bb7245" stroke-width="2"/>

      <!-- Small trail accents and title -->
      <g fill="none" stroke="#fff5dd" stroke-width="5" stroke-linecap="round" opacity=".8">
        <path d="M225 390h46M205 411h54M222 433h36"/>
      </g>
      <text x="66" y="84" fill="#24535e" font-size="42" font-weight="800" letter-spacing="2">骑车的鹈鹕</text>
      <text x="68" y="115" fill="#487883" font-size="17" font-weight="600" letter-spacing="2">海风正好，出发！</text>
      <text x="69" y="618" fill="#fff7dd" font-size="13" font-weight="700" letter-spacing="3" opacity=".72">PELICAN PEDALS · SVG ANIMATION</text>
    </svg>
    <button id="toggle" type="button" aria-pressed="false">暂停动画</button>
  </main>
  <script>
    const rearWheel = document.getElementById('rearWheelSpin');
    const frontWheel = document.getElementById('frontWheelSpin');
    const crank = document.getElementById('crankSpin');
    const rider = document.getElementById('rider');
    const toggle = document.getElementById('toggle');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let playing = !reducedMotion;
    let angle = 0;
    let lastTime = 0;
    let frameId = 0;

    function drawLeg(name, hipX, hipY, footX, footY, bend, upper, lower) {
      const dx = footX - hipX;
      const dy = footY - hipY;
      const distance = Math.hypot(dx, dy);
      const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
      const across = Math.sqrt(Math.max(0, upper * upper - along * along));
      const kneeX = hipX + along * dx / distance - bend * across * dy / distance;
      const kneeY = hipY + along * dy / distance + bend * across * dx / distance;
      document.getElementById(name + 'LegPath').setAttribute('d', `M${hipX} ${hipY}L${kneeX} ${kneeY} ${footX} ${footY}`);
      document.getElementById(name + 'Knee').setAttribute('cx', kneeX);
      document.getElementById(name + 'Knee').setAttribute('cy', kneeY);
      document.getElementById(name + 'Foot').setAttribute('d',
        `M${footX - 15} ${footY - 2}Q${footX + 4} ${footY - 9} ${footX + 17} ${footY - 2}L${footX + 27} ${footY + 6}Q${footX + 16} ${footY + 12} ${footX + 2} ${footY + 7}L${footX - 13} ${footY + 7}Z`);
    }

    function draw() {
      const degrees = angle * 180 / Math.PI;
      rearWheel.setAttribute('transform', `rotate(${degrees} 330 470)`);
      frontWheel.setAttribute('transform', `rotate(${degrees} 660 470)`);
      crank.setAttribute('transform', `rotate(${degrees} 505 460)`);
      const bob = Math.sin(angle * 2) * 2;
      rider.setAttribute('transform', `translate(0 ${bob})`);
      const frontX = 505 + Math.cos(angle) * 42;
      const frontY = 460 + Math.sin(angle) * 42;
      const rearX = 505 - Math.cos(angle) * 42;
      const rearY = 460 - Math.sin(angle) * 42;
      drawLeg('rear', 454, 340 + bob, rearX, rearY, 1, 96, 98);
      drawLeg('front', 482, 340 + bob, frontX, frontY, -1, 94, 98);
    }

    function animate(time) {
      if (lastTime) angle += Math.min((time - lastTime) / 1000, .06) * Math.PI * 1.3;
      lastTime = time;
      draw();
      frameId = requestAnimationFrame(animate);
    }

    function setPlaying(next) {
      playing = next;
      document.body.classList.toggle('paused', !playing);
      toggle.textContent = playing ? '暂停动画' : '播放动画';
      toggle.setAttribute('aria-pressed', String(!playing));
      if (playing) {
        lastTime = 0;
        frameId = requestAnimationFrame(animate);
      } else {
        cancelAnimationFrame(frameId);
      }
    }

    toggle.addEventListener('click', () => setPlaying(!playing));
    draw();
    if (playing) frameId = requestAnimationFrame(animate);
    else setPlaying(false);
  </script>
</body>
</html>
