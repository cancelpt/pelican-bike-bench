<title>骑单车的鹈鹕</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 50% 35%, #265146 0%, #15342d 58%, #0a211c 100%);
  }
  .scene {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  .cloud-a { animation: cloud-drift 14s ease-in-out infinite alternate; }
  .cloud-b { animation: cloud-drift 19s ease-in-out -6s infinite alternate-reverse; }
  .cloud-c { animation: cloud-drift 23s ease-in-out -10s infinite alternate; }
  .gulls { animation: gull-float 6s ease-in-out infinite alternate; }
  .boat {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: boat-bob 5s ease-in-out infinite;
  }
  .roadside-scroll {
    animation: roadside-scroll 18s linear infinite;
  }
  .track-line {
    stroke-dasharray: 30 90;
    animation: track-flow .75s linear infinite;
  }
  .wave-a {
    stroke-dasharray: 14 34;
    animation: wave-flow 8s linear infinite;
  }
  .wave-b {
    stroke-dasharray: 20 42;
    animation: wave-flow 11s linear infinite reverse;
  }
  .dust-puff {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: dust-rise 2.4s ease-out infinite;
  }
  .dust-puff:nth-child(2) { animation-delay: .7s; }
  .dust-puff:nth-child(3) { animation-delay: 1.35s; }
  .dust-puff:nth-child(4) { animation-delay: 1.85s; }

  @keyframes cloud-drift {
    from { transform: translateX(-16px); }
    to   { transform: translateX(22px); }
  }
  @keyframes gull-float {
    from { transform: translate(0, 0); }
    to   { transform: translate(14px, -9px); }
  }
  @keyframes boat-bob {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50%      { transform: translateY(-4px) rotate(1.2deg); }
  }
  @keyframes roadside-scroll {
    to { transform: translateX(-1200px); }
  }
  @keyframes track-flow {
    to { stroke-dashoffset: -120; }
  }
  @keyframes wave-flow {
    to { stroke-dashoffset: -240; }
  }
  @keyframes dust-rise {
    0%   { opacity: 0; transform: translate(0, 6px) scale(.35); }
    18%  { opacity: .55; }
    70%  { opacity: .18; }
    100% { opacity: 0; transform: translate(-58px, -24px) scale(1.6); }
  }

  @media (prefers-reduced-motion: reduce) {
    .cloud-a, .cloud-b, .cloud-c, .gulls, .boat,
    .roadside-scroll, .track-line, .wave-a, .wave-b,
    .dust-puff {
      animation: none;
    }
  }
</style>

<script>
(() => {
  const svg = document.getElementById('pelican-scene');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const wheels = [...document.querySelectorAll('.wheel-rotor')];
  const rider = document.getElementById('rider');
  const nearCrank = document.getElementById('nearCrankArm');
  const nearCrankHighlight = document.getElementById('nearCrankArmHighlight');
  const farCrank = document.getElementById('farCrankArm');
  const nearPedal = document.getElementById('nearPedal');
  const farPedal = document.getElementById('farPedal');
  const nearFoot = document.getElementById('nearFoot');
  const farFoot = document.getElementById('farFoot');
  const nearLegOutline = document.getElementById('nearLegOutline');
  const nearLegMain = document.getElementById('nearLegMain');
  const farLegOutline = document.getElementById('farLegOutline');
  const farLegMain = document.getElementById('farLegMain');

  const crank = { x: 566, y: 486, r: 36 };
  const nearHip = { x: 566, y: 373 };
  const farHip = { x: 548, y: 375 };
  const thigh = 76;
  const shin = 94;

  function solveKnee(hip, ankle) {
    const dx = ankle.x - hip.x;
    const dy = ankle.y - hip.y;
    const dist = Math.max(1, Math.hypot(dx, dy));
    const ux = dx / dist;
    const uy = dy / dist;
    const along = (thigh * thigh - shin * shin + dist * dist) / (2 * dist);
    const bend = Math.sqrt(Math.max(0, thigh * thigh - along * along));
    return {
      x: hip.x + ux * along + uy * bend,
      y: hip.y + uy * along - ux * bend
    };
  }

  function setPedal(angle, crankLine, crankHighlight, pedal, hip, foot, legOutline, legMain) {
    const px = crank.x + crank.r * Math.cos(angle);
    const py = crank.y + crank.r * Math.sin(angle);
    crankLine.setAttribute('x2', px.toFixed(2));
    crankLine.setAttribute('y2', py.toFixed(2));
    if (crankHighlight) {
      crankHighlight.setAttribute('x2', px.toFixed(2));
      crankHighlight.setAttribute('y2', py.toFixed(2));
    }
    pedal.setAttribute('transform', `translate(${px.toFixed(2)} ${py.toFixed(2)})`);

    const ankle = { x: px + 1, y: py - 11 };
    const knee = solveKnee(hip, ankle);
    const d = `M${hip.x.toFixed(1)} ${hip.y.toFixed(1)}
               L${knee.x.toFixed(1)} ${knee.y.toFixed(1)}
               L${ankle.x.toFixed(1)} ${ankle.y.toFixed(1)}`;
    legOutline.setAttribute('d', d);
    legMain.setAttribute('d', d);
    foot.setAttribute('transform', `translate(${ankle.x.toFixed(2)} ${ankle.y.toFixed(2)})`);
  }

  function render(phase, wheelAngle) {
    const bob = Math.sin(phase * 2) * 2.3;
    rider.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);

    for (const wheel of wheels) {
      wheel.setAttribute('transform', `rotate(${wheelAngle.toFixed(2)})`);
    }

    setPedal(
      phase,
      nearCrank,
      nearCrankHighlight,
      nearPedal,
      { x: nearHip.x, y: nearHip.y + bob },
      nearFoot,
      nearLegOutline,
      nearLegMain
    );
    setPedal(
      phase + Math.PI,
      farCrank,
      null,
      farPedal,
      { x: farHip.x, y: farHip.y + bob },
      farFoot,
      farLegOutline,
      farLegMain
    );
  }

  const initialPhase = 0.9;
  render(initialPhase, 18);

  if (reduceMotion) {
    if (typeof svg.pauseAnimations === 'function') svg.pauseAnimations();
    return;
  }

  let start = null;
  function tick(now) {
    if (start === null) start = now;
    const t = (now - start) / 1000;
    const phase = initialPhase + t * Math.PI * 2 / 1.25;
    render(phase, (t * 315) % 360);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
