<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0b1220;
    font-family: system-ui, sans-serif;
  }
  #stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .ground-scroll {
    animation: scroll 1.2s linear infinite;
  }
  @keyframes scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-80px); }
  }
</style>
</head>
<body>
<div id="stage">
<svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1b33"/>
      <stop offset="55%" stop-color="#16345c"/>
      <stop offset="100%" stop-color="#1b4a77"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd56a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd56a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#173b3a"/>
      <stop offset="100%" stop-color="#0d2322"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- 天空 -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="650" cy="110" r="130" fill="url(#sun)"/>

  <!-- 远山 -->
  <path d="M0 320 Q 120 240 240 320 T 480 320 T 720 320 T 960 320 L 960 500 L 0 500 Z"
        fill="url(#hill)" opacity="0.6"/>

  <!-- 滚动地面 -->
  <g class="ground-scroll">
    <rect x="-80" y="360" width="1040" height="140" fill="#0a1a1a"/>
    <rect x="-80" y="358" width="1040" height="4" fill="#2a5c5c"/>
    <!-- 重复草丛图案 -->
    <g fill="#14302f">
      <rect x="0"   y="355" width="40" height="6" rx="2"/>
      <rect x="80"  y="355" width="40" height="6" rx="2"/>
      <rect x="160" y="355" width="40" height="6" rx="2"/>
      <rect x="240" y="355" width="40" height="6" rx="2"/>
      <rect x="320" y="355" width="40" height="6" rx="2"/>
      <rect x="400" y="355" width="40" height="6" rx="2"/>
      <rect x="480" y="355" width="40" height="6" rx="2"/>
      <rect x="560" y="355" width="40" height="6" rx="2"/>
      <rect x="640" y="355" width="40" height="6" rx="2"/>
      <rect x="720" y="355" width="40" height="6" rx="2"/>
      <rect x="800" y="355" width="40" height="6" rx="2"/>
      <rect x="880" y="355" width="40" height="6" rx="2"/>
    </g>
  </g>

  <!-- 主体：鹈鹕骑车，整体随节奏上下颠簸 -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -6; 0 0; 0 -3; 0 0" dur="0.8s" repeatCount="indefinite"/>

    <!-- 阴影 -->
    <ellipse cx="420" cy="372" rx="120" ry="10" fill="#000" opacity="0.25"/>

    <!-- ================= 自行车 ================= -->
    <!-- 后轮 -->
    <g>
      <circle cx="330" cy="320" r="52" fill="none" stroke="#111" stroke-width="6"/>
      <circle cx="330" cy="320" r="46" fill="none" stroke="#444" stroke-width="2"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="0 330 320" to="360 330 320" dur="0.9s" repeatCount="indefinite"/>
        <line x1="330" y1="270" x2="330" y2="370" stroke="#666" stroke-width="2"/>
        <line x1="280" y1="320" x2="380" y2="320" stroke="#666" stroke-width="2"/>
        <line x1="295" y1="285" x2="365" y2="355" stroke="#666" stroke-width="2"/>
        <line x1="365" y1="285" x2="295" y2="355" stroke="#666" stroke-width="2"/>
        <circle cx="330" cy="320" r="6" fill="#222"/>
      </g>
    </g>

    <!-- 前轮 -->
    <g>
      <circle cx="510" cy="320" r="52" fill="none" stroke="#111" stroke-width="6"/>
      <circle cx="510" cy="320" r="46" fill="none" stroke="#444" stroke-width="2"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="0 510 320" to="360 510 320" dur="0.9s" repeatCount="indefinite"/>
        <line x1="510" y1="270" x2="510" y2="370" stroke="#666" stroke-width="2"/>
        <line x1="460" y1="320" x2="560" y2="320" stroke="#666" stroke-width="2"/>
        <line x1="475" y1="285" x2="545" y2="355" stroke="#666" stroke-width="2"/>
        <line x1="545" y1="285" x2="475" y2="355" stroke="#666" stroke-width="2"/>
        <circle cx="510" cy="320" r="6" fill="#222"/>
      </g>
    </g>

    <!-- 车架 -->
    <path d="M330 320 L420 280 L510 320"
          fill="none" stroke="#ff6b6b" stroke-width="8" stroke-linecap="round"/>
    <path d="M420 280 L420 240" stroke="#ff6b6b" stroke-width="8" stroke-linecap="round"/>
    <!-- 车座 -->
    <ellipse cx="420" cy="236" rx="22" ry="7" fill="#222"/>
    <!-- 车把 -->
    <path d="M420 240 Q 470 230 500 250"
          fill="none" stroke="#ff6b6b" stroke-width="7" stroke-linecap="round"/>
    <circle cx="502" cy="251" r="5" fill="#222"/>

    <!-- 脚踏 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 420 300" to="360 420 300" dur="0.9s" repeatCount="indefinite"/>
      <line x1="420" y1="300" x2="440" y2="300" stroke="#222" stroke-width="4" stroke-linecap="round"/>
      <rect x="432" y="294" width="18" height="6" rx="2" fill="#333"/>
    </g>

    <!-- ================= 鹈鹕 ================= -->
    <!-- 尾巴 -->
    <path d="M400 220 Q 360 215 350 240 Q 380 240 405 240 Z"
          fill="#f4f4f4"/>

    <!-- 身体 -->
    <ellipse cx="425" cy="210" rx="45" ry="32" fill="#f8f8f8"/>

    <!-- 翅膀 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-8 425 200; 8 425 200; -8 425 200"
        dur="0.9s" repeatCount="indefinite"/>
      <path d="M425 195 Q 460 180 470 215 Q 445 222 425 215 Z"
            fill="#e6e6e6" stroke="#d0d0d0" stroke-width="1.5"/>
    </g>

    <!-- 腿（蹬车动作） -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="12 420 230; -12 420 230; 12 420 230"
        dur="0.45s" repeatCount="indefinite"/>
      <line x1="420" y1="235" x2="430" y2="300"
            stroke="#f1c27d" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-12 415 235; 12 415 235; -12 415 235"
        dur="0.45s" repeatCount="indefinite"/>
      <line x1="415" y1="235" x2="405" y2="300"
            stroke="#e0b070" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- 脖子 + 头 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-4 450 180; 4 450 180; -4 450 180"
        dur="2.0s" repeatCount="indefinite"/>
      <!-- 脖子 -->
      <path d="M455 195 Q 475 160 495 155"
            fill="none" stroke="#f8f8f8" stroke-width="20" stroke-linecap="round"/>
      <!-- 头 -->
      <circle cx="500" cy="150" r="18" fill="#f8f8f8"/>
      <!-- 眼睛 -->
      <circle cx="505" cy="145" r="3.5" fill="#222"/>
      <!-- 长喙 -->
      <path d="M512 150 L 555 158 L 512 162 Z" fill="#ff9f43" stroke="#e0852a" stroke-width="1.5"/>
      <!-- 喉囊 -->
      <path d="M512 158 Q 530 180 515 175 Q 508 168 512 158 Z"
            fill="#ffd166" stroke="#e0a83a" stroke-width="1"/>
    </g>

    <!-- 车把上的手 -->
    <circle cx="502" cy="251" r="6" fill="#f8f8f8" stroke="#e0e0e0"/>
  </g>

  <!-- 速度线 -->
  <g stroke="#7fd3ff" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <line x1="100" y1="200" x2="60" y2="200">
      <animate attributeName="x2" values="60;20;60" dur="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="180" y1="240" x2="140" y2="240">
      <animate attributeName="x2" values="140;100;140" dur="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="140" y1="180" x2="100" y2="180">
      <animate attributeName="x2" values="100;60;100" dur="0.5s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
</div>
</body>
</html>
