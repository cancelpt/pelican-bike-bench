<title>骑自行车的鹈鹕 · SVG 2D 动画</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(1200px 700px at 50% 15%, #1d2a38, #0a0f15 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:24px;font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;color:#cfe3f2;
  }
  .frame{width:min(1120px,95vw)}
  svg{
    width:100%;height:auto;display:block;border-radius:16px;overflow:hidden;
    box-shadow:0 26px 70px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07);
  }
  .bar{display:flex;align-items:center;gap:16px;font-size:13px;letter-spacing:.3px;opacity:.85;flex-wrap:wrap}
  .bar b{font-weight:600;font-size:15px;color:#eaf4ff;letter-spacing:1px}
  button{
    background:#1e2c3a;color:#dceaf6;border:1px solid #33485c;border-radius:8px;
    padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s;
  }
  button:hover{background:#27394a;border-color:#4b6b85}
  input[type=range]{accent-color:#54c6b0;width:130px}
  .hint{opacity:.55;font-size:12px}
</style>
</head>

<div class="bar">

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var DEG = 180 / Math.PI;

  // —— 几何常量 ——
  var GROUND   = 400;
  var CRANK    = {x:485, y:348};
  var REAR     = {x:395, y:348};
  var FRONT    = {x:600, y:348};
  var R_WHEEL  = 52;
  var R_PEDAL  = 24;
  var R_CHAIN  = 21;
  var R_COG    = 10;
  var SPEED    = 220;                       // 地面像素速度 px/s
  var W_ANG    = SPEED / R_WHEEL;          // 车轮角速度 rad/s
  var C_ANG    = W_ANG * (R_COG / R_CHAIN);// 曲柄角速度 rad/s（链条传动）
  var HIP      = {x:425, y:232};
  var L1 = 78, L2 = 78;                    // 大腿 / 小腿长度

  // —— 缓存元素 ——
  var wheelR=$('wheelR'), wheelF=$('wheelF'), crank=$('crank');
  var spokesR=$('spokesR'), spokesF=$('spokesF');
  var pedalA=$('pedalA'), pedalB=$('pedalB'), chainDash=$('chainDash');
  var thighNear=$('thighNear'), shinNear=$('shinNear'), footNear=$('footNear');
  var thighFar =$('thighFar'),  shinFar =$('shinFar'),  footFar =$('footFar');
  var pelican=$('pelican'), tail=$('tail'), head=$('head');
  var wingNear=$('wingNear'), wingFar=$('wingFar'), scarfTail=$('scarfTailPath'), pouch=$('pouch');
  var rider=$('rider');
  var clouds=$('clouds'), hillsFar=$('hillsFar'), hillsNear=$('hillsNear');
  var trees=$('trees'), tufts=$('tufts'), dashes=$('dashes'), speedlines=$('speedlines');
  var sunRays=$('sunRays');

  function setT(el, v){ el.setAttribute('transform', v); }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

  // 双骨 IK：返回膝盖位置（膝盖朝前弯曲）
  function kneeOf(hip, foot){
    var dx = foot.x-hip.x, dy = foot.y-hip.y;
    var d  = Math.hypot(dx,dy);
    d = clamp(d, Math.abs(L1-L2)+0.5, L1+L2-0.5);
    var base = Math.atan2(dy,dx);
    var cosA = (L1*L1 + d*d - L2*L2) / (2*L1*d);
    var A = Math.acos(clamp(cosA,-1,1));
    var k1 = {x: hip.x + L1*Math.cos(base-A), y: hip.y + L1*Math.sin(base-A)};
    var k2 = {x: hip.x + L1*Math.cos(base+A), y: hip.y + L1*Math.sin(base+A)};
    return (k1.x >= k2.x) ? k1 : k2;   // 选更靠前（+x）的膝盖
  }

  function leg(hip, foot, thigh, shin, footEl, footAngle){
    var k = kneeOf(hip, foot);
    thigh.setAttribute('d','M'+hip.x.toFixed(1)+','+hip.y.toFixed(1)+' L'+k.x.toFixed(1)+','+k.y.toFixed(1));
    shin .setAttribute('d','M'+k.x.toFixed(1)+','+k.y.toFixed(1)+' L'+foot.x.toFixed(1)+','+foot.y.toFixed(1));
    footEl.setAttribute('transform','translate('+foot.x.toFixed(1)+','+foot.y.toFixed(1)+') rotate('+footAngle.toFixed(1)+')');
  }

  function render(t){
    var a   = t * C_ANG;          // 曲柄角
    var wa  = t * W_ANG;          // 车轮角
    var ad  = a * DEG, wad = wa * DEG;

    // —— 车轮（只转辐条，胎圈保持静止）——
    setT(spokesR,'rotate('+wad.toFixed(2)+' '+REAR.x+' '+REAR.y+')');
    setT(spokesF,'rotate('+wad.toFixed(2)+' '+FRONT.x+' '+FRONT.y+')');

    // —— 曲柄 + 脚踏（脚踏反向旋转保持水平）——
    setT(crank,'rotate('+ad.toFixed(2)+' '+CRANK.x+' '+CRANK.y+')');
    setT(pedalA,'translate('+(CRANK.x+R_PEDAL)+' '+CRANK.y+') rotate('+(-ad).toFixed(2)+')');
    setT(pedalB,'translate('+(CRANK.x-R_PEDAL)+' '+CRANK.y+') rotate('+(-ad).toFixed(2)+')');
    chainDash.setAttribute('stroke-dashoffset', (-t*30).toFixed(1));

    // —— 身体起伏 / 前后倾 ——
    var bob   = Math.sin(2*a) * 2.4;
    var lean  = Math.sin(2*a) * 1.4;
    var ride  = Math.sin(4*a) * 1.0;
    setT(rider,'rotate('+(ride).toFixed(2)+' 490 400)');
    setT(pelican,'translate(0 '+bob.toFixed(2)+') rotate('+lean.toFixed(2)+' '+HIP.x+' '+HIP.y+')');
    setT(tail,'rotate('+(Math.sin(4*a)*4).toFixed(2)+' 344 190)');

    // —— 头颈 ——
    setT(head,'rotate('+(Math.sin(4*a)*2.5).toFixed(2)+' 486 128)');

    // —— 翅膀拍动 ——
    var flap = Math.sin(2*a) * 17;
    setT(wingNear,'rotate('+flap.toFixed(2)+' 436 172)');
    setT(wingFar ,'rotate('+(flap*0.7).toFixed(2)+' 424 180)');

    // —— 喉囊晃动 ——
    var sag = 172 + 11*Math.sin(t*7.5) + 5*Math.sin(2*a);
    pouch.setAttribute('d','M518,106 L620,108 Q570,'+sag.toFixed(1)+' 518,106 Z');

    // —— 围巾飘动（搭在背上）——
    var w1 = Math.sin(t*9), w2 = Math.sin(t*9-0.9), w3 = Math.sin(t*9-1.7);
    scarfTail.setAttribute('d',
      'M452,168 C428,'+(150+15*w1).toFixed(1)+' 404,'+(162-15*w1).toFixed(1)+' 378,'+(152+12*w2).toFixed(1)+
      ' C352,'+(142+10*w2).toFixed(1)+' 332,'+(154-9*w3).toFixed(1)+' 306,'+(158+7*w1).toFixed(1));

    // —— 腿（IK）——
    var hip = {x:HIP.x, y:HIP.y + bob};
    var fx  = CRANK.x + R_PEDAL*Math.cos(a), fy = CRANK.y + R_PEDAL*Math.sin(a);
    var bx  = CRANK.x - R_PEDAL*Math.cos(a), by = CRANK.y - R_PEDAL*Math.sin(a);
    leg(hip, {x:fx,y:fy}, thighNear, shinNear, footNear, -ad);   // 近侧
    leg({x:hip.x-6, y:hip.y+2}, {x:bx,y:by}, thighFar, shinFar, footFar, -ad); // 远侧

    // —— 背景滚动（视差）——
    setT(clouds,    'translate('+(-(t*12) % 900).toFixed(1)+' 0)');
    setT(hillsFar,  'translate('+(-(t*26) % 900).toFixed(1)+' 0)');
    setT(hillsNear, 'translate('+(-(t*46) % 900).toFixed(1)+' 0)');
    setT(trees,     'translate('+(-(t*SPEED) % 900).toFixed(1)+' 0)');
    setT(tufts,     'translate('+(-(t*SPEED) % 900).toFixed(1)+' 0)');
    setT(dashes,    'translate('+(-(t*SPEED) % 900).toFixed(1)+' 0)');
    setT(speedlines,'translate('+(-(t*SPEED) % 900).toFixed(1)+' 0)');
    setT(sunRays,   'rotate('+(t*4).toFixed(1)+' 770 88)');
  }

  // —— 主循环 ——
  var t = 0, last = performance.now(), paused = false, rate = 1;
  function loop(now){
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    if(!paused) t += dt * rate;
    render(t);
    requestAnimationFrame(loop);
  }

  var btn = $('toggle'), slider = $('rate'), val = $('rateVal');
  btn.addEventListener('click', function(){
    paused = !paused;
    btn.textContent = paused ? '播放' : '暂停';
  });
  slider.addEventListener('input', function(){
    rate = parseFloat(slider.value);
    val.textContent = rate.toFixed(1) + 'x';
  });

  render(0);
  if(!window.matchMedia || !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
