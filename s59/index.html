<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹈鹕骑自行车</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #87CEEB;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        svg {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>
<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <!-- 背景：天空与地面 -->
    <rect width="800" height="600" fill="#87CEEB"/>

    <!-- 太阳 -->
    <g transform="translate(680, 80)">
        <circle r="40" fill="#FFD700">
            <animate attributeName="r" values="40;44;40" dur="3s" repeatCount="indefinite"/>
        </circle>
        <g stroke="#FFD700" stroke-width="4" stroke-linecap="round">
            <line x1="0" y1="-55" x2="0" y2="-70"/>
            <line x1="38" y1="-38" x2="49" y2="-49"/>
            <line x1="55" y1="0" x2="70" y2="0"/>
            <line x1="38" y1="38" x2="49" y2="49"/>
            <line x1="0" y1="55" x2="0" y2="70"/>
            <line x1="-38" y1="38" x2="-49" y2="49"/>
            <line x1="-55" y1="0" x2="-70" y2="0"/>
            <line x1="-38" y1="-38" x2="-49" y2="-49"/>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
        </g>
    </g>

    <!-- 云朵 -->
    <g opacity="0.9">
        <g transform="translate(100, 100)">
            <ellipse cx="0" cy="0" rx="40" ry="25" fill="#FFF"/>
            <ellipse cx="30" cy="-10" rx="35" ry="28" fill="#FFF"/>
            <ellipse cx="60" cy="0" rx="40" ry="25" fill="#FFF"/>
            <animateTransform attributeName="transform" type="translate" from="900 100" to="-150 100" dur="25s" repeatCount="indefinite"/>
        </g>
        <g transform="translate(300, 160)">
            <ellipse cx="0" cy="0" rx="30" ry="18" fill="#FFF"/>
            <ellipse cx="25" cy="-8" rx="28" ry="22" fill="#FFF"/>
            <ellipse cx="50" cy="0" rx="30" ry="18" fill="#FFF"/>
            <animateTransform attributeName="transform" type="translate" from="950 160" to="-150 160" dur="35s" repeatCount="indefinite"/>
        </g>
    </g>

    <!-- 远景山脉 -->
    <path d="M0,450 L150,280 L300,450 L450,320 L600,450 L800,350 L800,450 L0,450" fill="#90EE90" opacity="0.6"/>
    <path d="M0,450 L200,340 L400,450 L600,370 L800,450 L0,450" fill="#32CD32" opacity="0.7"/>

    <!-- 道路 -->
    <rect y="450" width="800" height="150" fill="#555"/>
    <line x1="0" y1="460" x2="800" y2="460" stroke="#777" stroke-width="4"/>
    <line x1="0" y1="590" x2="800" y2="590" stroke="#777" stroke-width="4"/>

    <!-- 路面虚线 -->
    <g stroke="#FFF" stroke-width="8" stroke-dasharray="60 40">
        <line x1="0" y1="525" x2="800" y2="525">
            <animateTransform attributeName="transform" type="translate" from="0 0" to="-100 0" dur="0.8s" repeatCount="indefinite"/>
        </line>
    </g>

    <!-- 自行车 + 鹈鹕整体，添加上下颠簸 -->
    <g transform="translate(300, 360)">
        <animateTransform attributeName="transform" type="translate" values="300,360; 300,355; 300,360" dur="0.6s" repeatCount="indefinite"/>

        <!-- 后轮 -->
        <g transform="translate(0, 90)">
            <circle r="45" fill="none" stroke="#333" stroke-width="6"/>
            <circle r="38" fill="none" stroke="#DDD" stroke-width="2"/>
            <g stroke="#999" stroke-width="2">
                <line x1="0" y1="-38" x2="0" y2="38"/>
                <line x1="-33" y1="-19" x2="33" y2="19"/>
                <line x1="-33" y1="19" x2="33" y2="-19"/>
            </g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1s" repeatCount="indefinite" additive="sum"/>
        </g>

        <!-- 前轮 -->
        <g transform="translate(180, 90)">
            <circle r="45" fill="none" stroke="#333" stroke-width="6"/>
            <circle r="38" fill="none" stroke="#DDD" stroke-width="2"/>
            <g stroke="#999" stroke-width="2">
                <line x1="0" y1="-38" x2="0" y2="38"/>
                <line x1="-33" y1="-19" x2="33" y2="19"/>
                <line x1="-33" y1="19" x2="33" y2="-19"/>
            </g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1s" repeatCount="indefinite" additive="sum"/>
        </g>

        <!-- 车架 -->
        <g stroke="#FF4500" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
            <line x1="0" y1="90" x2="70" y2="90"/>
            <line x1="70" y1="90" x2="110" y2="30"/>
            <line x1="110" y1="30" x2="40" y2="30"/>
            <line x1="40" y1="30" x2="0" y2="90"/>
            <line x1="70" y1="90" x2="40" y2="30"/>
            <line x1="110" y1="30" x2="150" y2="15"/>
            <line x1="150" y1="15" x2="180" y2="90"/>
            <line x1="180" y1="90" x2="160" y2="90"/>
        </g>

        <!-- 车座 -->
        <path d="M25,30 L30,15 L60,15 L55,30" fill="#8B4513" stroke="#8B4513" stroke-width="5" stroke-linejoin="round"/>

        <!-- 车把 -->
        <path d="M145,15 L150,5 L170,5" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round"/>
        <circle cx="170" cy="5" r="5" fill="#333"/>

        <!-- 踏板曲柄和踏板 -->
        <g transform="translate(70, 90)">
            <g>
                <line x1="0" y1="0" x2="0" y2="25" stroke="#555" stroke-width="5" stroke-linecap="round"/>
                <rect x="-10" y="22" width="20" height="8" rx="2" fill="#333"/>
                <line x1="0" y1="0" x2="0" y2="-25" stroke="#555" stroke-width="5" stroke-linecap="round"/>
                <rect x="-10" y="-30" width="20" height="8" rx="2" fill="#333"/>
                <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
            </g>
        </g>

        <!-- 鹈鹕身体 -->
        <g transform="translate(55, -35)">
            <!-- 尾巴 -->
            <path d="M-40,30 L-70,15 L-65,40 Z" fill="#FFF"/>

            <!-- 身体 -->
            <ellipse cx="0" cy="30" rx="55" ry="35" fill="#FFF" stroke="#DDD" stroke-width="1"/>

            <!-- 翅膀 -->
            <path d="M-20,20 Q10,5 50,25 Q30,50 -10,45 Z" fill="#F0F0F0" stroke="#CCC" stroke-width="1"/>

            <!-- 脖子 -->
            <path d="M35,10 Q55,-30 50,-60 Q45,-90 20,-95 Q-5,-90 0,-60 Q5,-30 25,10" fill="#FFF" stroke="#DDD" stroke-width="1"/>

            <!-- 头部 -->
            <ellipse cx="15" cy="-95" rx="22" ry="18" fill="#FFF" stroke="#DDD" stroke-width="1"/>

            <!-- 大嘴 -->
            <path d="M30,-100 Q80,-105 95,-85 Q70,-75 30,-85 Z" fill="#FFA500" stroke="#FF8C00" stroke-width="1"/>
            <path d="M35,-92 Q70,-90 90,-85" fill="none" stroke="#333" stroke-width="1"/>

            <!-- 眼睛 -->
            <circle cx="22" cy="-100" r="5" fill="#000"/>
            <circle cx="24" cy="-102" r="2" fill="#FFF"/>

            <!-- 腿（踩在踏板上） -->
            <path d="M10,55 L25,75 L50,90" fill="none" stroke="#FFA500" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
                <animate attributeName="d" values="M10,55 L25,75 L50,90; M10,55 L30,60 L45,70; M10,55 L25,75 L50,90" dur="1s" repeatCount="indefinite"/>
            </path>
            <path d="M30,55 L45,75 L70,90" fill="none" stroke="#FFA500" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

            <!-- 脚蹼 -->
            <path d="M45,90 L65,90 L60,98 Z" fill="#FFA500">
                <animateTransform attributeName="transform" type="translate" values="0,0; -5,0; 0,0" dur="1s" repeatCount="indefinite"/>
            </path>

            <!-- 白色小帽子更俏皮 -->
            <path d="M-5,-110 L35,-110 L30,-120 L0,-120 Z" fill="#FF4500" stroke="#CC3700" stroke-width="1"/>
            <rect x="-8" y="-112" width="46" height="6" rx="2" fill="#FF4500"/>
        </g>
    </g>
</svg>
</body>
</html>
