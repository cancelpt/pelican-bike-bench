<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车 - SVG 动画</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e2430;
  }
  svg {
    width: min(92vw, 900px);
    height: auto;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }

  /* 车轮与曲柄旋转（transform-origin 为各自组的局部原点） */
  .spin {
    animation: spin 1.1s linear infinite;
    transform-origin: 0px 0px;
  }
  .spin-rev {
    animation: spin-rev 1.1s linear infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes spin     { to { transform: rotate(360deg); } }
  @keyframes spin-rev { to { transform: rotate(-360deg); } }

  /* 骑行时的上下颠簸 */
  .bob { animation: bob 0.55s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }

  /* 路面虚线后退，营造前进感 */
  .road-dash { animation: dash 0.5s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: 60; } }

  /* 云朵飘动 */
  .cloud1 { animation: drift 14s linear infinite; }
  .cloud2 { animation: drift 20s linear infinite; animation-delay: -8s; }
  @keyframes drift {
    from { transform: translateX(880px); }
    to   { transform: translateX(-260px); }
  }

  /* 翅膀扇动 */
  .wing {
    animation: flap 0.55s ease-in-out infinite;
    transform-origin: 335px 200px;
  }
  @keyframes flap {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-9deg); }
  }

  /* 双腿交替踩踏 */
  .leg-near {
    animation: pedal-a 1.1s ease-in-out infinite;
    transform-origin: 352px 262px;
  }
  .leg-far {
    animation: pedal-b 1.1s ease-in-out infinite;
    transform-origin: 352px 262px;
  }
  @keyframes pedal-a {
    0%, 100% { transform: rotate(9deg); }
    50%      { transform: rotate(-9deg); }
  }
  @keyframes pedal-b {
    0%, 100% { transform: rotate(-9deg); }
    50%      { transform: rotate(9deg); }
  }

  /* 速度线 */
  .speed { animation: whoosh 0.8s linear infinite; }
  .speed.s2 { animation-delay: -0.4s; }
  @keyframes whoosh {
    0%   { transform: translateX(0);     opacity: 0; }
    20%  { opacity: .8; }
    100% { transform: translateX(-140px); opacity: 0; }
  }
</style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鹈鹕骑自行车动画">
  <!-- ===== 背景 ===== -->
  <rect width="800" height="500" fill="#aee3f5"/>
  <circle cx="690" cy="80" r="42" fill="#ffd75e"/>
  <circle cx="690" cy="80" r="52" fill="#ffd75e" opacity=".25"/>

  <!-- 远山 -->
  <path d="M0,340 Q140,230 300,340 T620,340 T900,320 L900,420 L0,420 Z" fill="#8fd0a8"/>
  <path d="M-60,380 Q120,290 320,380 T720,370 L800,380 L800,430 L0,430 L0,380 Z" fill="#6cbf8b"/>

  <!-- 云 -->
  <g class="cloud1" fill="#ffffff" opacity=".95">
    <ellipse cx="0"  cy="90"  rx="38" ry="20"/>
    <ellipse cx="34" cy="82"  rx="30" ry="22"/>
    <ellipse cx="-30" cy="84" rx="26" ry="16"/>
  </g>
  <g class="cloud2" fill="#ffffff" opacity=".8">
    <ellipse cx="0"  cy="160" rx="30" ry="15"/>
    <ellipse cx="26" cy="154" rx="22" ry="16"/>
  </g>

  <!-- 路面 -->
  <rect x="0" y="418" width="800" height="82" fill="#4a4f5a"/>
  <line x1="0" y1="460" x2="800" y2="460" stroke="#e8eef5" stroke-width="6"
        stroke-dasharray="40 20" class="road-dash"/>

  <!-- 速度线 -->
  <g stroke="#7fb6d9" stroke-width="5" stroke-linecap="round">
    <line class="speed"    x1="120" y1="250" x2="185" y2="250"/>
    <line class="speed s2" x1="90"  y1="300" x2="150" y2="300"/>
  </g>

  <!-- 车影 -->
  <ellipse cx="385" cy="428" rx="185" ry="12" fill="#000" opacity=".18"/>

  <!-- ===== 鹈鹕 + 自行车 ===== -->
  <g class="bob">

    <!-- 后轮 -->
    <g transform="translate(250,360)">
      <g class="spin">
        <circle r="58" fill="none" stroke="#22262e" stroke-width="9"/>
        <circle r="50" fill="none" stroke="#c8ccd4" stroke-width="3"/>
        <g stroke="#9aa0ac" stroke-width="3">
          <line x1="-50" y1="0" x2="50" y2="0"/>
          <line x1="0" y1="-50" x2="0" y2="50"/>
          <line x1="-35" y1="-35" x2="35" y2="35"/>
          <line x1="-35" y1="35" x2="35" y2="-35"/>
        </g>
        <circle r="7" fill="#5a6070"/>
      </g>
    </g>

    <!-- 前轮 -->
    <g transform="translate(510,360)">
      <g class="spin">
        <circle r="58" fill="none" stroke="#22262e" stroke-width="9"/>
        <circle r="50" fill="none" stroke="#c8ccd4" stroke-width="3"/>
        <g stroke="#9aa0ac" stroke-width="3">
          <line x1="-50" y1="0" x2="50" y2="0"/>
          <line x1="0" y1="-50" x2="0" y2="50"/>
          <line x1="-35" y1="-35" x2="35" y2="35"/>
          <line x1="-35" y1="35" x2="35" y2="-35"/>
        </g>
        <circle r="7" fill="#5a6070"/>
      </g>
    </g>

    <!-- 车架 -->
    <g stroke="#e0453a" stroke-width="9" stroke-linecap="round" fill="none">
      <line x1="250" y1="360" x2="380" y2="360"/>  <!-- 后下叉 -->
      <line x1="250" y1="360" x2="355" y2="255"/>  <!-- 后上叉 -->
      <line x1="380" y1="360" x2="355" y2="255"/>  <!-- 座管 -->
      <line x1="380" y1="360" x2="492" y2="268"/>  <!-- 下管 -->
      <line x1="355" y1="255" x2="492" y2="268"/>  <!-- 上管 -->
      <line x1="492" y1="268" x2="510" y2="360"/>  <!-- 前叉 -->
    </g>
    <!-- 车把 -->
    <path d="M492,268 Q490,240 512,232" stroke="#333a46" stroke-width="8"
          fill="none" stroke-linecap="round"/>
    <!-- 座椅 -->
    <path d="M332,252 Q355,240 378,252 L372,260 L340,260 Z" fill="#333a46"/>

    <!-- 链条与齿盘 -->
    <g stroke="#6b7280" stroke-width="4" fill="none">
      <line x1="250" y1="350" x2="380" y2="342"/>
      <line x1="250" y1="370" x2="380" y2="378"/>
    </g>
    <circle cx="250" cy="360" r="11" fill="none" stroke="#6b7280" stroke-width="4"/>
    <g transform="translate(380,360)">
      <circle r="19" fill="none" stroke="#6b7280" stroke-width="4"/>
      <!-- 曲柄 + 脚踏 -->
      <g class="spin">
        <line x1="0" y1="-28" x2="0" y2="28" stroke="#333a46" stroke-width="7" stroke-linecap="round"/>
        <rect class="spin-rev" x="-13" y="-34" width="26" height="11" rx="4" fill="#22262e"/>
        <rect class="spin-rev" x="-13" y="24"  width="26" height="11" rx="4" fill="#22262e"/>
      </g>
    </g>

    <!-- ===== 鹈鹕 ===== -->
    <!-- 远侧腿（先画，压在身体下） -->
    <g class="leg-far">
      <path d="M352,262 L368,312 L384,352" stroke="#d9832f" stroke-width="11"
            fill="none" stroke-linecap="round"/>
      <path d="M376,352 L398,352 L392,362 L372,360 Z" fill="#d9832f"/>
    </g>

    <!-- 尾羽 -->
    <path d="M262,210 L212,190 L226,222 L206,226 L258,244 Z" fill="#e8e8ee"/>

    <!-- 身体 -->
    <ellipse cx="330" cy="225" rx="76" ry="48" fill="#ffffff" stroke="#c9ccd6" stroke-width="2"/>

    <!-- 颈部 -->
    <path d="M362,222 Q350,150 402,122 L428,140 Q392,170 400,222 Z"
          fill="#ffffff" stroke="#c9ccd6" stroke-width="2"/>

    <!-- 头部 -->
    <circle cx="420" cy="116" r="22" fill="#ffffff" stroke="#c9ccd6" stroke-width="2"/>
    <!-- 喉囊 -->
    <path d="M436,122 Q486,172 530,124 L436,124 Z" fill="#f0a03c"/>
    <!-- 上喙 -->
    <polygon points="434,106 536,121 434,123" fill="#f5b74e"/>
    <line x1="436" y1="115" x2="530" y2="121" stroke="#d9832f" stroke-width="2"/>
    <!-- 眼睛 -->
    <circle cx="426" cy="108" r="4.5" fill="#22262e"/>
    <circle cx="427.5" cy="106.5" r="1.5" fill="#fff"/>
    <!-- 头冠羽 -->
    <path d="M404,98 Q398,84 408,80 Q406,92 414,94 Z" fill="#e8e8ee"/>

    <!-- 翅膀（搭在车把方向） -->
    <g class="wing">
      <path d="M300,205 Q340,180 392,205 Q430,225 470,238 L478,248
               Q420,246 372,232 Q322,222 300,215 Z"
            fill="#eef0f5" stroke="#c9ccd6" stroke-width="2"/>
      <path d="M330,212 Q380,222 440,242" stroke="#c9ccd6" stroke-width="2" fill="none"/>
    </g>

    <!-- 近侧腿 -->
    <g class="leg-near">
      <path d="M352,262 L370,314 L386,354" stroke="#f0a03c" stroke-width="12"
            fill="none" stroke-linecap="round"/>
      <path d="M378,354 L402,354 L396,365 L374,362 Z" fill="#f0a03c"/>
    </g>

  </g>
</svg>

</body>
</html>
