<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑自行车 · SVG 2D 动画</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20344a;
      --blue: #67c7e8;
      --cream: #fff8e7;
      --orange: #ef915e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Trebuchet MS", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: #dff3f4;
    }
    .scene-card {
      width: min(1120px, 100%);
      overflow: hidden;
      border: 1px solid rgba(32, 52, 74, .08);
      border-radius: 28px;
      background: var(--cream);
      box-shadow: 0 24px 70px rgba(44, 82, 96, .18);
    }
    .scene-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 22px 28px 16px;
    }
    .eyebrow {
      margin: 0 0 4px;
      color: #ef8156;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 40px); letter-spacing: -.04em; }
    .hint { margin: 6px 0 0; color: #6e8290; font-size: 14px; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 15px;
      color: var(--ink);
      background: #e8f4f3;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease;
    }
    button:hover { transform: translateY(-2px); background: #d7edeb; }
    button.primary { color: white; background: #ef8156; }
    button.primary:hover { background: #dd6b43; }
    .stage { position: relative; padding: 0 16px 16px; }
    svg { display: block; width: 100%; height: auto; border-radius: 21px; }
    .tag {
      position: absolute;
      left: 36px;
      bottom: 30px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      color: #42687a;
      background: rgba(255, 255, 255, .78);
      font-size: 12px;
      font-weight: 800;
      backdrop-filter: blur(8px);
    }
    .tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #ef8156; box-shadow: 0 0 0 4px rgba(239,129,86,.15); }
    .paused * { animation-play-state: paused !important; }

    .cloud { animation: cloud-drift 18s linear infinite; }
    .cloud.slow { animation-duration: 27s; animation-delay: -9s; }
    .water-line { animation: ripple 3s ease-in-out infinite alternate; transform-origin: center; }
    .bike-rig { animation: ride-bob .72s ease-in-out infinite; transform-origin: 540px 350px; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin .9s linear infinite; }
    .pedal-crank { transform-box: fill-box; transform-origin: center; animation: spin .9s linear infinite; }
    .pelican { animation: rider-bob .72s ease-in-out infinite; transform-origin: 541px 228px; }
    .wing-back { animation: wing-flap .72s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 90%; }
    .leg-front { animation: leg-pedal .9s linear infinite; transform-box: fill-box; transform-origin: 50% 0%; }
    .leg-back { animation: leg-pedal-reverse .9s linear infinite; transform-box: fill-box; transform-origin: 50% 0%; }
    .scarf { animation: scarf-wave .72s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 0 50%; }
    .bird-blink { animation: blink 4.5s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes cloud-drift { from { transform: translateX(-100px); } to { transform: translateX(1180px); } }
    @keyframes ripple { from { transform: scaleX(.94); opacity: .5; } to { transform: scaleX(1.04); opacity: 1; } }
    @keyframes ride-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes rider-bob { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-4px) rotate(1deg); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes wing-flap { 0%,100% { transform: rotate(7deg); } 50% { transform: rotate(-11deg); } }
    @keyframes leg-pedal { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes leg-pedal-reverse { from { transform: rotate(180deg); } to { transform: rotate(540deg); } }
    @keyframes scarf-wave { from { transform: rotate(2deg) scaleX(.96); } to { transform: rotate(-8deg) scaleX(1.05); } }
    @keyframes blink { 0%, 45%, 49%, 100% { transform: scaleY(1); } 47% { transform: scaleY(.12); } }
    @media (max-width: 680px) {
      body { padding: 10px; }
      .scene-head { align-items: flex-start; flex-direction: column; padding: 18px 18px 12px; }
      .controls { justify-content: flex-start; }
      .stage { padding: 0 8px 8px; }
      .tag { left: 24px; bottom: 20px; }
    }
  </style>
</head>
<body>
  <main class="scene-card">
    <header class="scene-head">
      <div>
        <p class="eyebrow">SVG MOTION STUDY · 02D</p>
        <h1>鹈鹕的海风单车</h1>
        <p class="hint">一只戴着围巾的鹈鹕，沿着海边慢悠悠骑车。</p>
      </div>
      <div class="controls" aria-label="动画控制">
        <button class="primary" id="toggleBtn" type="button">暂停动画</button>
        <button id="resetBtn" type="button">重新开始</button>
      </div>
    </header>

    <section class="stage">
      <svg id="scene" viewBox="0 0 1080 610" role="img" aria-label="鹈鹕骑自行车的海边 SVG 动画">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8edcf0"/>
            <stop offset=".68" stop-color="#bde9e4"/>
            <stop offset="1" stop-color="#f8eac5"/>
          </linearGradient>
          <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#56b9ca"/>
            <stop offset="1" stop-color="#3e97b0"/>
          </linearGradient>
          <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
            <stop stop-color="#dba376"/>
            <stop offset=".5" stop-color="#edbd83"/>
            <stop offset="1" stop-color="#d99a6d"/>
          </linearGradient>
          <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
            <feOffset dy="11" result="offset"/>
            <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="tinyShadow" x="-30%" y="-30%" width="160%" height="180%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#29536c" flood-opacity=".18"/>
          </filter>
        </defs>

        <rect width="1080" height="610" rx="22" fill="url(#sky)"/>
        <circle cx="879" cy="118" r="52" fill="#fff5bf" opacity=".85"/>
        <circle cx="879" cy="118" r="72" fill="#fff5bf" opacity=".18"/>

        <g class="cloud" opacity=".82" fill="#fffdf1">
          <path d="M-80 135c22-32 72-30 87 3 28-28 83-10 81 31H-76c-21 0-25-17-4-34Z"/>
        </g>
        <g class="cloud slow" opacity=".7" fill="#fffdf1">
          <path d="M-100 215c18-29 58-26 71 2 25-25 72-8 71 26h-157c-18 0-18-16 15-28Z"/>
        </g>

        <path d="M0 328C175 289 288 329 420 315s286-61 660 3v136H0Z" fill="url(#water)"/>
        <path d="M0 347c145-28 258 6 385-8 145-16 259-75 695-11" fill="none" stroke="#c0f1e6" stroke-width="6" opacity=".5"/>
        <path d="M0 395c171-37 271 7 414-11 171-21 288-71 666-7" fill="none" stroke="#b0e9df" stroke-width="4" opacity=".5"/>
        <g class="water-line" fill="none" stroke="#d2f4e8" stroke-width="3" stroke-linecap="round" opacity=".55">
          <path d="M75 425h102M300 386h88M731 422h116M885 372h74"/>
        </g>

        <path d="M0 453c125-28 273-5 407 3 180 11 363-25 673 4v150H0Z" fill="url(#road)"/>
        <path d="M0 465c172-33 315-10 472-4 172 7 359-22 608 6" fill="none" stroke="#fff2c7" stroke-width="5" stroke-dasharray="26 22" opacity=".7"/>
        <path d="M0 546c191-29 317 2 500 5 185 2 362-27 580 4" fill="none" stroke="#bc795b" stroke-width="4" opacity=".22"/>

        <g fill="#5fa477" opacity=".8">
          <path d="M105 450c4-46 14-76 28-98-5 44-2 76-8 101Z"/>
          <path d="M124 452c12-46 31-69 55-83-21 28-34 60-42 87Z"/>
          <path d="M944 452c-1-45 7-72 22-101-4 40-2 71-8 103Z"/>
          <path d="M969 453c13-37 27-59 49-72-18 26-27 50-34 74Z"/>
        </g>

        <g class="bike-rig" filter="url(#softShadow)">
          <g transform="translate(0,2)">
            <circle class="wheel" cx="445" cy="449" r="64" fill="#fff8e7" stroke="#27465d" stroke-width="8"/>
            <circle class="wheel" cx="700" cy="449" r="64" fill="#fff8e7" stroke="#27465d" stroke-width="8"/>
            <circle cx="445" cy="449" r="7" fill="#ef8156"/>
            <circle cx="700" cy="449" r="7" fill="#ef8156"/>
            <g class="wheel" fill="none" stroke="#8bb5bf" stroke-width="2" opacity=".8">
              <path d="M445 392v114M388 449h114M405 409l80 80M485 409l-80 80"/>
              <path d="M700 392v114M643 449h114M660 409l80 80M740 409l-80 80"/>
            </g>
            <g fill="none" stroke="#27465d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M445 449 518 360l84 89Z"/>
              <path d="M518 360 563 449"/>
              <path d="M602 449 620 343"/>
              <path d="M620 343h42"/>
              <path d="M602 449 700 449"/>
              <path d="M518 360h-24"/>
            </g>
            <path d="M607 360c10-24 25-35 47-38" fill="none" stroke="#ef8156" stroke-width="8" stroke-linecap="round"/>
            <path d="M615 345c19-13 34-13 46-8" fill="none" stroke="#27465d" stroke-width="8" stroke-linecap="round"/>
            <g class="pedal-crank">
              <circle cx="563" cy="449" r="13" fill="#ef8156" stroke="#27465d" stroke-width="5"/>
              <path d="M563 449l-31-18M563 449l30 18" stroke="#27465d" stroke-width="5" stroke-linecap="round"/>
              <rect x="517" y="423" width="19" height="8" rx="4" fill="#ef8156" transform="rotate(-26 517 423)"/>
              <rect x="588" y="463" width="19" height="8" rx="4" fill="#ef8156" transform="rotate(-26 588 463)"/>
            </g>
          </g>

          <g class="pelican" filter="url(#tinyShadow)">
            <path class="wing-back" d="M510 251c-32 4-57 28-74 67 29-6 54 0 74 18l31-44Z" fill="#f4dcb0" stroke="#27465d" stroke-width="7" stroke-linejoin="round"/>
            <path d="M518 263c-20 13-30 29-35 48" fill="none" stroke="#d7b887" stroke-width="7" stroke-linecap="round"/>
            <path d="M537 268c-10 27-11 61 7 87l27-5-8-79Z" fill="#fff1cc" stroke="#27465d" stroke-width="7" stroke-linejoin="round"/>
            <path d="M534 274c-5 22-3 42 6 58" fill="none" stroke="#e0c091" stroke-width="6" stroke-linecap="round"/>
            <ellipse cx="547" cy="217" rx="48" ry="54" fill="#fff3d2" stroke="#27465d" stroke-width="7"/>
            <path d="M520 181c8-25 50-34 71-11-9-1-17 2-23 8 16 4 25 15 28 31-18-9-38-17-61-13Z" fill="#f4dcb0" stroke="#27465d" stroke-width="7" stroke-linejoin="round"/>
            <path d="M568 226c43 3 88 14 117 29-25 24-89 11-122-4Z" fill="#ef9a62" stroke="#27465d" stroke-width="7" stroke-linejoin="round"/>
            <path d="M580 242c24 9 49 12 71 9" fill="none" stroke="#d97850" stroke-width="4" stroke-linecap="round"/>
            <ellipse class="bird-blink" cx="564" cy="210" rx="6" ry="8" fill="#27465d"/>
            <circle cx="566" cy="208" r="2" fill="#fff8e7"/>
            <path d="M524 215c-10 2-16 8-18 16" fill="none" stroke="#efc784" stroke-width="8" stroke-linecap="round"/>
            <path class="scarf" d="M518 260c22 13 47 15 69 4l-1 16c-26 12-49 9-71-5Z" fill="#ef8156" stroke="#27465d" stroke-width="6" stroke-linejoin="round"/>
            <path class="scarf" d="M573 272c21 4 35 13 51 31-18 3-38-3-56-18Z" fill="#ef8156" stroke="#27465d" stroke-width="6" stroke-linejoin="round"/>
            <g stroke="#27465d" stroke-width="9" stroke-linecap="round">
              <path class="leg-front" d="M552 309 563 370l-28 51"/>
              <path class="leg-back" d="M570 314 587 373l29 35"/>
            </g>
            <path d="M529 419h28M608 409h27" stroke="#ef8156" stroke-width="9" stroke-linecap="round"/>
          </g>
        </g>

        <g fill="#fff8e7" opacity=".7">
          <circle cx="243" cy="490" r="4"/><circle cx="270" cy="483" r="3"/><circle cx="813" cy="510" r="4"/>
        </g>
      </svg>
      <div class="tag">海风正好 · 继续出发</div>
    </section>
  </main>
  <script>
    const scene = document.getElementById('scene');
    const toggleBtn = document.getElementById('toggleBtn');
    const resetBtn = document.getElementById('resetBtn');
    let paused = false;

    toggleBtn.addEventListener('click', () => {
      paused = !paused;
      scene.classList.toggle('paused', paused);
      toggleBtn.textContent = paused ? '继续动画' : '暂停动画';
    });

    resetBtn.addEventListener('click', () => {
      scene.classList.remove('paused');
      paused = false;
      toggleBtn.textContent = '暂停动画';
      document.querySelectorAll('#scene *').forEach((node) => {
        node.style.animation = 'none';
        void node.offsetWidth;
        node.style.animation = '';
      });
    });
  </script>
</body>
</html>
