<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鹈鹕骑行记 · SVG 2D 动画</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #15324b;
      --muted: #587086;
      --card: rgba(255, 255, 255, .72);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 14%, rgba(255, 239, 178, .7), transparent 23rem),
        linear-gradient(135deg, #e9f7ff 0%, #c8e8f2 42%, #b7dfd2 100%);
    }

    .stage {
      width: min(1160px, 100%);
      padding: clamp(14px, 3vw, 28px);
      border: 1px solid rgba(255, 255, 255, .78);
      border-radius: 28px;
      background: var(--card);
      box-shadow: 0 24px 70px rgba(42, 90, 108, .2), inset 0 1px rgba(255,255,255,.9);
      backdrop-filter: blur(14px);
    }

    .topline {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      padding: 2px 8px 17px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.25rem, 2.7vw, 2rem);
      letter-spacing: .08em;
      font-weight: 800;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: clamp(.82rem, 1.5vw, .98rem);
      letter-spacing: .08em;
    }

    button {
      border: 0;
      padding: 10px 16px;
      border-radius: 999px;
      color: #fff;
      background: #ef875c;
      box-shadow: 0 6px 14px rgba(214, 100, 61, .24);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      white-space: nowrap;
      transition: transform .2s ease, background .2s ease;
    }

    button:hover { background: #df7047; transform: translateY(-2px); }
    button:focus-visible { outline: 3px solid rgba(21, 50, 75, .35); outline-offset: 3px; }

    .canvas-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      background: #bce6ef;
      box-shadow: 0 10px 30px rgba(37, 84, 104, .15);
    }

    svg { display: block; width: 100%; height: auto; }

    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.05s linear infinite; }
    .rider { transform-box: fill-box; transform-origin: 50% 80%; animation: ride-bob 1.05s ease-in-out infinite; }
    .leg-front, .leg-back { transform-box: fill-box; transform-origin: 50% 0%; }
    .leg-front { animation: pedal-front 1.05s ease-in-out infinite; }
    .leg-back { animation: pedal-back 1.05s ease-in-out infinite; }
    .pedal-crank { transform-box: fill-box; transform-origin: center; animation: spin 1.05s linear infinite; }
    .cloud-a { animation: drift-a 26s linear infinite; }
    .cloud-b { animation: drift-b 34s linear infinite; }
    .cloud-c { animation: drift-c 40s linear infinite; }
    .lane { animation: lane-move 1.25s linear infinite; }
    .flag-wave { transform-box: fill-box; transform-origin: left center; animation: wave 1.4s ease-in-out infinite; }
    .feather-tip { transform-box: fill-box; transform-origin: bottom center; animation: feather-sway 1.6s ease-in-out infinite; }
    .sun-glow { animation: sun-pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

    .paused *, .paused *::before, .paused *::after { animation-play-state: paused !important; }

    .credit {
      margin: 12px 8px 0;
      color: #668197;
      font-size: .78rem;
      letter-spacing: .05em;
      text-align: right;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes ride-bob { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-5px) rotate(1deg); } }
    @keyframes pedal-front { 0%, 100% { transform: rotate(18deg); } 50% { transform: rotate(-28deg); } }
    @keyframes pedal-back { 0%, 100% { transform: rotate(-25deg); } 50% { transform: rotate(20deg); } }
    @keyframes drift-a { from { transform: translateX(-320px); } to { transform: translateX(1160px); } }
    @keyframes drift-b { from { transform: translateX(980px); } to { transform: translateX(-480px); } }
    @keyframes drift-c { from { transform: translateX(-420px); } to { transform: translateX(1380px); } }
    @keyframes lane-move { from { transform: translateX(0); } to { transform: translateX(-250px); } }
    @keyframes wave { 0%, 100% { transform: skewY(0); } 50% { transform: skewY(-5deg); } }
    @keyframes feather-sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(5deg); } }
    @keyframes sun-pulse { 0%, 100% { transform: scale(1); opacity: .6; } 50% { transform: scale(1.14); opacity: .3; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="topline">
      <div>
        <h1>鹈鹕骑行记</h1>
        <p class="subtitle">风从海边来 · 一段轻快的 SVG 2D 动画</p>
      </div>
      <button id="toggle" type="button" aria-pressed="false">暂停动画</button>
    </div>

    <div class="canvas-wrap" id="scene">
      <svg viewBox="0 0 1200 700" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
        <title id="title">一只鹈鹕骑着自行车沿海边前进</title>
        <desc id="desc">蓝天、云朵、海浪和道路背景持续移动，鹈鹕踩动脚踏，自行车车轮旋转。</desc>
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8fd9ec"/>
            <stop offset=".68" stop-color="#d8f2e9"/>
            <stop offset="1" stop-color="#f8e5bd"/>
          </linearGradient>
          <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6b8d99"/>
            <stop offset="1" stop-color="#405f6f"/>
          </linearGradient>
          <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fffdf4"/>
            <stop offset="1" stop-color="#e7ece5"/>
          </linearGradient>
          <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffc85c"/>
            <stop offset="1" stop-color="#ee8751"/>
          </linearGradient>
          <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="180%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
            <feOffset dy="12" result="offset"/>
            <feComponentTransfer><feFuncA type="linear" slope=".25"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
        </defs>

        <!-- sky and atmosphere -->
        <rect width="1200" height="700" fill="url(#sky)"/>
        <ellipse class="sun-glow" cx="1015" cy="118" rx="160" ry="132" fill="#fff4bd" filter="url(#blur)"/>
        <circle cx="1015" cy="118" r="68" fill="#ffe597" opacity=".95"/>
        <circle cx="995" cy="96" r="15" fill="#fff3b0" opacity=".8"/>
        <g class="cloud-a" fill="#fff" opacity=".8">
          <ellipse cx="120" cy="138" rx="76" ry="24"/><ellipse cx="169" cy="120" rx="55" ry="41"/><ellipse cx="220" cy="143" rx="78" ry="28"/>
        </g>
        <g class="cloud-b" fill="#f9ffff" opacity=".68">
          <ellipse cx="940" cy="218" rx="72" ry="22"/><ellipse cx="982" cy="198" rx="48" ry="36"/><ellipse cx="1035" cy="220" rx="71" ry="24"/>
        </g>
        <g class="cloud-c" fill="#fff" opacity=".58">
          <ellipse cx="480" cy="88" rx="58" ry="19"/><ellipse cx="515" cy="73" rx="40" ry="28"/><ellipse cx="560" cy="91" rx="58" ry="20"/>
        </g>

        <!-- distant coastline -->
        <path d="M0 370 Q150 305 300 371 T600 365 T900 365 T1200 352 V540 H0Z" fill="#9bcfc4"/>
        <path d="M0 404 Q170 344 333 399 T665 395 T985 395 T1200 382 V544 H0Z" fill="#74b2ad" opacity=".74"/>
        <path d="M0 465 Q175 423 354 455 T704 453 T1020 454 T1200 441 V563 H0Z" fill="#d1e6c7"/>

        <!-- sea strip -->
        <path d="M0 426 Q100 412 200 426 T400 426 T600 426 T800 426 T1000 426 T1200 426 V548 H0Z" fill="#76c8cd" opacity=".88"/>
        <g fill="none" stroke="#c9f1e8" stroke-width="6" stroke-linecap="round" opacity=".8">
          <path d="M44 460 q44 -15 88 0 t88 0"/><path d="M350 492 q50 -18 100 0 t100 0"/><path d="M890 460 q45 -16 90 0 t90 0"/><path d="M1045 510 q42 -13 84 0 t84 0"/>
        </g>

        <!-- foreground road -->
        <path d="M0 515 Q260 490 510 514 T1000 511 T1200 516 V700 H0Z" fill="url(#road)"/>
        <path d="M0 565 Q300 544 600 563 T1200 559" fill="none" stroke="#94b5b9" stroke-width="4" opacity=".35"/>
        <g class="lane" fill="#f7dc8b" opacity=".95">
          <rect x="10" y="614" width="130" height="12" rx="6"/><rect x="260" y="606" width="130" height="12" rx="6"/><rect x="510" y="614" width="130" height="12" rx="6"/><rect x="760" y="607" width="130" height="12" rx="6"/><rect x="1010" y="615" width="130" height="12" rx="6"/>
        </g>

        <!-- little roadside sign -->
        <g transform="translate(100 322)">
          <path d="M35 78 V230" stroke="#4f6f72" stroke-width="11" stroke-linecap="round"/>
          <g class="flag-wave"><path d="M38 80 H184 L160 137 H38Z" fill="#ef875c"/><path d="M58 102 H142" stroke="#fff3c7" stroke-width="8" stroke-linecap="round" opacity=".9"/><path d="M58 120 H122" stroke="#fff3c7" stroke-width="8" stroke-linecap="round" opacity=".9"/></g>
          <circle cx="34" cy="228" r="14" fill="#355867"/>
        </g>

        <!-- bicycle shadow -->
        <ellipse cx="635" cy="610" rx="260" ry="22" fill="#173c4d" opacity=".23" filter="url(#blur)"/>

        <!-- bicycle -->
        <g filter="url(#soft-shadow)">
          <g class="wheel" stroke="#294f61" stroke-width="9" fill="#b9e2e2">
            <circle cx="460" cy="500" r="88"/>
            <g stroke-width="3" fill="none" opacity=".9">
              <path d="M460 412V588 M372 500H548 M398 438L522 562 M522 438L398 562 M420 418L500 582 M500 418L420 582"/>
            </g>
            <circle cx="460" cy="500" r="10" fill="#ef875c" stroke="none"/>
          </g>
          <g class="wheel" stroke="#294f61" stroke-width="9" fill="#b9e2e2">
            <circle cx="800" cy="500" r="88"/>
            <g stroke-width="3" fill="none" opacity=".9">
              <path d="M800 412V588 M712 500H888 M738 438L862 562 M862 438L738 562 M760 418L840 582 M840 418L760 582"/>
            </g>
            <circle cx="800" cy="500" r="10" fill="#ef875c" stroke="none"/>
          </g>

          <g fill="none" stroke="#e86f4e" stroke-width="11" stroke-linejoin="round" stroke-linecap="round">
            <path d="M460 500 L585 402 L648 500 L460 500"/>
            <path d="M585 402 L718 402 L800 500 L648 500 L585 402"/>
            <path d="M718 402 L735 350"/>
            <path d="M735 350 q27 -14 48 4"/>
          </g>
          <path d="M556 391 Q594 378 630 391" fill="none" stroke="#294f61" stroke-width="13" stroke-linecap="round"/>
          <path d="M636 493 h24" stroke="#294f61" stroke-width="7" stroke-linecap="round"/>
          <g class="pedal-crank" fill="none" stroke="#294f61" stroke-width="8" stroke-linecap="round">
            <circle cx="648" cy="500" r="19"/><path d="M648 500 L670 478 M670 478 h23"/><path d="M648 500 L626 523 M626 523 h-23"/>
          </g>
          <path d="M736 349 q11 -14 25 0" fill="none" stroke="#294f61" stroke-width="7" stroke-linecap="round"/>

          <!-- pelican rider -->
          <g class="rider">
            <path d="M538 301 Q489 290 469 325 Q506 337 543 335" fill="url(#feather)" stroke="#294f61" stroke-width="5"/>
            <ellipse cx="622" cy="298" rx="111" ry="94" fill="url(#feather)" stroke="#294f61" stroke-width="6"/>
            <path d="M560 307 Q601 273 678 294 Q646 352 571 345Z" fill="#d7e4df" stroke="#294f61" stroke-width="5"/>
            <path d="M590 274 Q567 225 602 174 Q628 136 682 153 Q718 166 713 212 Q708 259 674 286Z" fill="url(#feather)" stroke="#294f61" stroke-width="6"/>
            <path d="M685 162 Q745 151 832 182 L872 207 Q819 238 733 218 L681 201Z" fill="url(#beak)" stroke="#294f61" stroke-width="6" stroke-linejoin="round"/>
            <path d="M730 216 Q778 218 827 202 Q799 268 733 248 Q711 241 706 211Z" fill="#f29b67" stroke="#294f61" stroke-width="5"/>
            <path d="M719 200 Q757 204 811 194" fill="none" stroke="#ca674e" stroke-width="5" stroke-linecap="round"/>
            <ellipse cx="684" cy="179" rx="8" ry="10" fill="#294f61"/>
            <circle cx="687" cy="176" r="3" fill="#fff"/>
            <path d="M625 153 Q665 129 699 157" fill="none" stroke="#d7e4df" stroke-width="12" stroke-linecap="round"/>
            <g class="feather-tip" fill="#f8fbf0" stroke="#294f61" stroke-width="4">
              <path d="M616 162 q-34 -37 -4 -62 q28 21 16 57Z"/>
              <path d="M638 153 q-21 -51 17 -65 q22 30 1 67Z"/>
              <path d="M663 153 q-5 -48 36 -54 q11 37 -26 59Z"/>
            </g>
            <path class="leg-back" d="M592 352 L609 432 L639 484" fill="none" stroke="#d37651" stroke-width="12" stroke-linecap="round"/>
            <path class="leg-back" d="M639 484 l-24 2" fill="none" stroke="#294f61" stroke-width="10" stroke-linecap="round"/>
            <path class="leg-front" d="M654 355 L681 428 L670 478" fill="none" stroke="#d37651" stroke-width="12" stroke-linecap="round"/>
            <path class="leg-front" d="M670 478 l24 0" fill="none" stroke="#294f61" stroke-width="10" stroke-linecap="round"/>
            <path d="M653 259 Q691 275 705 310" fill="none" stroke="#c7d9d5" stroke-width="8" stroke-linecap="round"/>
          </g>
        </g>

        <!-- foreground grasses -->
        <g fill="none" stroke="#3c8579" stroke-width="7" stroke-linecap="round" opacity=".75">
          <path d="M30 700 Q39 646 62 623 M61 700 Q70 657 100 642 M108 700 Q119 658 132 637"/>
          <path d="M1110 700 Q1118 653 1138 629 M1140 700 Q1153 666 1184 649 M1170 700 Q1181 664 1198 640"/>
        </g>
      </svg>
    </div>
    <p class="credit">SVG 绘制 · 无外部素材 · 点击按钮控制动画</p>
  </main>

  <script>
    const scene = document.getElementById('scene');
    const toggle = document.getElementById('toggle');
    toggle.addEventListener('click', () => {
      const paused = scene.classList.toggle('paused');
      toggle.textContent = paused ? '继续动画' : '暂停动画';
      toggle.setAttribute('aria-pressed', String(paused));
    });
  </script>
</body>
</html>
