          <polygon points="2,-6 20,1 2,8" fill="#3AADBE" stroke="#1D3557" stroke-width="1.5"/>
        </g>
      </g>

      <path d="M 572 132 Q 584 126 596 133" fill="none" stroke="#1D3557" stroke-width="2.2"/>
      <g id="eye">
        <circle r="9" fill="#fff" stroke="#1D3557" stroke-width="2"/>
        <circle cx="1.6" cy="0.6" r="4.3" fill="#1D3557"/>
        <circle cx="3.2" cy="-1.2" r="1.7" fill="#fff"/>
      </g>
      <ellipse cx="552" cy="160" rx="7" ry="4" fill="#F4B6A8" opacity="0.45"/>
    </g>

    <g id="near-wing">
      <path d="M 438 286 C 520 274, 590 286, 656 304 L 664 318 C 592 310, 512 308, 434 312 C 418 300, 422 290, 438 286 Z" fill="#F7F3EC" stroke="#1D3557" stroke-width="2.8"/>
      <path d="M 500 292 Q 560 286 630 306" fill="none" stroke="#E4D9C8" stroke-width="1.7"/>
      <path d="M 490 302 Q 555 298 628 314" fill="none" stroke="#E4D9C8" stroke-width="1.6"/>
      <path d="M 646 300 L 678 292 L 656 312 Z" fill="#1D3557"/>
      <path d="M 638 310 L 674 314 L 648 324 Z" fill="#1D3557"/>
      <path d="M 652 294 L 682 286 L 660 304 Z" fill="#1D3557"/>
    </g>
  </g>

  <g id="grass"></g>
  <rect width="1200" height="675" fill="url(#vignette)" pointer-events="none"/>
</svg>

<script>
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const WHEEL_R = 62;
  const PERIOD = 1.15;
  const BB = { x: 508, y: 448 };
  const CRANK = 24;
  const L1 = 66;
  const L2 = 68;
  const REAR = { x: 380, y: 458 };
  const FRONT = { x: 660, y: 458 };

  const $ = (id) => document.getElementById(id);

  function el(name, attrs, parent) {
    const node = document.createElementNS(NS, name);
    for (const key in attrs) node.setAttribute(key, attrs[key]);
    if (parent) parent.appendChild(node);
    return node;
  }

  function wrap(x, period) {
    return ((x % period) + period) % period;
  }

  function buildWheel(id, cx, cy, reflector) {
    const wheel = $(id);
    const spokes = wheel.querySelector(".spokes");
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * Math.PI * 2;
      el("line", {
        x1: cx + Math.cos(a) * 11,
        y1: cy + Math.sin(a) * 11,
        x2: cx + Math.cos(a) * 40,
        y2: cy + Math.sin(a) * 40,
        stroke: "#E6EDF2",
        "stroke-width": "1.7"
      }, spokes);
    }
    if (reflector) {
      el("circle", {
        cx: cx + 22,
        cy: cy,
        r: 3.2,
        fill: reflector
      }, spokes);
    }
    const tread = wheel.querySelector(".tread");
    for (let i = 0; i < 7; i++) {
      const a = (i / 7) * Math.PI * 2;
      const x = cx + Math.cos(a) * 57;
      const y = cy + Math.sin(a) * 57;
      el("rect", {
        x: x - 5,
        y: y - 2.5,
        width: 10,
        height: 5,
        rx: 1.4,
        fill: "#2A2A2A",
        transform: "rotate(" + (a * 180 / Math.PI + 90) + " " + x + " " + y + ")"
      }, tread);
    }
  }

  function buildRepeating() {
    const planks = $("planks");
    for (let x = 0; x < 576; x += 48) {
      el("line", {
        x1: x, y1: 526, x2: x, y2: 608,
        stroke: "#A67C49",
        "stroke-width": "2",
        opacity: "0.38"
      }, planks);
      el("circle", { cx: x + 22, cy: 546, r: 1.7, fill: "#8C6239", opacity: "0.45" }, planks);
      el("circle", { cx: x + 22, cy: 586, r: 1.7, fill: "#8C6239", opacity: "0.45" }, planks);
    }
    const posts = $("posts");
    for (let x = 16; x < 600; x += 75) {
      el("rect", {
        x: x, y: 478, width: 7, height: 42, rx: 1.2,
        fill: "#D7BC8A",
        stroke: "#1D3557",
        "stroke-width": "1.4"
      }, posts);
    }
    const grass = $("grass");
    const colors = ["#6FA84A", "#4E8C32", "#8FBF5A", "#3F7A2C"];
    for (let i = 0; i < 18; i++) {
      const x = 20 + i * 40;
      const g = el("g", {}, grass);
      for (let b = 0; b < 5; b++) {
        const bx = x + (b - 2) * 5;
        const h = 28 + ((i * 3 + b * 5) % 7) * 6;
        const lean = (b - 2) * 7;
        el("path", {
          d: "M " + bx + " 668 Q " + (bx + lean) + " " + (668 - h * 0.55) + " " + (bx + lean * 1.3) + " " + (668 - h),
          fill: "none",
          stroke: colors[(i + b) % colors.length],
          "stroke-width": "2.6"
        }, g);
      }
      if (i % 4 === 0) {
        el("circle", { cx: x + 4, cy: 650, r: 2.4, fill: "#FFE08A", stroke: "#1D3557", "stroke-width": "0.6" }, g);
      } else if (i % 4 === 2) {
        el("circle", { cx: x - 2, cy: 654, r: 2.2, fill: "#F7F7F2", stroke: "#1D3557", "stroke-width": "0.6" }, g);
      }
    }

    const rays = $("rays");
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      el("line", {
        x1: 156 + Math.cos(a) * 50,
        y1: 112 + Math.sin(a) * 50,
        x2: 156 + Math.cos(a) * 84,
        y2: 112 + Math.sin(a) * 84,
        stroke: "#FFE29A",
        "stroke-width": "4"
      }, rays);
    }

    const waves = $("sea-waves");
    const specs = [
      { id: "wave-a", color: "#1F7EA6", amp: 7, y: 414, depth: 58, cycles: 3, width: 600, speed: 0.12 },
      { id: "wave-b", color: "#3AA0C4", amp: 5, y: 432, depth: 46, cycles: 4, width: 480, speed: 0.18 },
      { id: "wave-c", color: "#E9F6FB", amp: 4, y: 424, depth: 14, cycles: 4, width: 480, speed: 0.22, opacity: 0.55 }
    ];
    specs.forEach((spec) => {
      const g = el("g", { id: spec.id, opacity: spec.opacity || 1 }, waves);
      g.appendChild(waveShape(spec));
      spec.node = g;
    });
    return specs;
  }

  function waveShape(spec) {
    const steps = spec.cycles * 16;
    let d = "";
    for (let i = 0; i <= steps; i++) {
      const x = (i / steps) * spec.width;
      const y = spec.y + Math.sin((i / steps) * Math.PI * 2 * spec.cycles) * spec.amp;
      d += (i === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1) + " ";
    }
    d += "L " + spec.width + " " + (spec.y + spec.depth) + " L 0 " + (spec.y + spec.depth) + " Z";
    return el("path", { d: d, fill: spec.color });
  }

  function loopPair(node, period) {
    const clone = node.cloneNode(true);
    clone.removeAttribute("id");
    node.after(clone);
    return function place(dist) {
      const x = -wrap(dist, period);
      node.setAttribute("transform", "translate(" + x + " 0)");
      clone.setAttribute("transform", "translate(" + (x + period) + " 0)");
    };
  }

  function solveLeg(hip, target, bend) {
    let dx = target.x - hip.x;
    let dy = target.y - hip.y;
    let dist = Math.hypot(dx, dy);
    const max = L1 + L2 - 0.8;
    const min = Math.abs(L1 - L2) + 0.8;
    if (dist > max) {
      dx *= max / dist;
      dy *= max / dist;
      dist = max;
    } else if (dist < min) {
      dx *= min / dist;
      dy *= min / dist;
      dist = min;
    }
    const aim = Math.atan2(dy, dx);
    const cosA = (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist);
    const kneeBend = Math.acos(Math.max(-1, Math.min(1, cosA)));
    const thigh = aim + bend * kneeBend;
    return {
      x: hip.x + Math.cos(thigh) * L1,
      y: hip.y + Math.sin(thigh) * L1
    };
  }

  function setLine(id, a, b) {
    const line = $(id);
    line.setAttribute("x1", a.x);
    line.setAttribute("y1", a.y);
    line.setAttribute("x2", b.x);
    line.setAttribute("y2", b.y);
  }

  function updateLeg(prefix, hip, ankle, bend) {
    const knee = solveLeg(hip, ankle, bend);
    setLine(prefix + "-thigh-o", hip, knee);
    setLine(prefix + "-shin-o", knee, ankle);
    setLine(prefix + "-thigh", hip, knee);
    setLine(prefix + "-shin", knee, ankle);
    const dot = $(prefix + "-knee");
    dot.setAttribute("cx", knee.x);
    dot.setAttribute("cy", knee.y);
  }

  function ribbon(x0, y0, time, phase, segments, step) {
    let d = "";
    for (let i = 0; i <= segments; i++) {
      const x = x0 - i * step;
      const y = y0 + Math.sin(time * 6.4 - i * 0.62 + phase) * (1.4 + i * 1.35) + i * 1.8;
      d += (i === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1) + " ";
    }
    return d;
  }

  function blinkScale(time) {
    const cycle = time % 4.4;
    if (cycle < 4.18 || cycle > 4.38) return 1;
    const u = (cycle - 4.18) / 0.2;
    const k = u < 0.5 ? u * 2 : (1 - u) * 2;
    return 1 - k * 0.86;
  }

  buildWheel("rear-wheel", REAR.x, REAR.y, "#E63946");
  buildWheel("front-wheel", FRONT.x, FRONT.y, "#FFE08A");
  const waveSpecs = buildRepeating();

  const placePlanks = loopPair($("planks"), 576);
  const placePosts = loopPair($("posts"), 600);
  const placeGrass = loopPair($("grass"), 740);
  const placeBeach = loopPair($("beach-decor"), 1040);
  const placeHills = loopPair($("hills"), 1400);
  const placeWaves = waveSpecs.map((spec) => ({
    place: loopPair(spec.node, spec.width),
    speed: spec.speed
  }));

  const clouds = Array.from(document.querySelectorAll(".cloud")).map((node) => ({
    node: node,
    x: +node.dataset.x,
    y: +node.dataset.y,
    speed: +node.dataset.speed
  }));
  const gulls = Array.from(document.querySelectorAll(".gull")).map((node) => ({
    node: node,
    x: +node.dataset.x,
    y: +node.dataset.y,
    speed: +node.dataset.speed,
    left: node.querySelector(".wing-l"),
    right: node.querySelector(".wing-r")
  }));

  const puffs = [];
  const puffLayer = $("puffs");
  for (let i = 0; i < 6; i++) {
    puffs.push({
      node: el("ellipse", { rx: 6, ry: 3, fill: "#E6C48A", opacity: 0 }, puffLayer),
      age: 1,
      dur: 0.5,
      x: 0,
      y: 0
    });
  }

  const rider = $("rider");
  const head = $("head");
  const eye = $("eye");
  const pouch = $("pouch");
  const fishTail = $("fish-tail");
  const farWing = $("far-wing");
  const tail = $("tail");
  const scarf = $("scarf");
  const scarfO = $("scarf-o");
  const scarf2 = $("scarf2");
  const nearPedal = $("near-pedal");
  const farPedal = $("far-pedal");
  const crankArm = $("crank-arm");
  const chainring = $("chainring");
  const rearWheel = $("rear-wheel");
  const frontWheel = $("front-wheel");
  const starfish = $("starfish");
  const shadow = $("shadow");
  const rays = $("rays");
  const lighthouse = $("lighthouse");
  const beam = $("beam");
  const boat = $("boat");
  const shimmer = $("shimmer");

  let puffTimer = 0.05;
  let last = 0;

  function render(time, dt) {
    const turns = time / PERIOD;
    const angle = turns * Math.PI * 2;
    const deg = turns * 360;
    const dist = angle * WHEEL_R;
    const bob = Math.sin(angle * 2) * 3.2;

    rearWheel.setAttribute("transform", "rotate(" + deg + " " + REAR.x + " " + REAR.y + ")");
    frontWheel.setAttribute("transform", "rotate(" + deg + " " + FRONT.x + " " + FRONT.y + ")");
    chainring.setAttribute("transform", "rotate(" + deg + " " + BB.x + " " + BB.y + ")");

    const near = {
      x: BB.x + Math.cos(angle) * CRANK,
      y: BB.y + Math.sin(angle) * CRANK
    };
    const far = {
      x: BB.x + Math.cos(angle + Math.PI) * CRANK,
      y: BB.y + Math.sin(angle + Math.PI) * CRANK
    };
    nearPedal.setAttribute("transform", "translate(" + near.x + " " + near.y + ")");
    farPedal.setAttribute("transform", "translate(" + far.x + " " + far.y + ")");
    crankArm.setAttribute("x1", far.x);
    crankArm.setAttribute("y1", far.y);
    crankArm.setAttribute("x2", near.x);
    crankArm.setAttribute("y2", near.y);

    const nearHip = { x: 478, y: 332 + bob };
    const farHip = { x: 466, y: 338 + bob };
    updateLeg("near", nearHip, { x: near.x + 1, y: near.y - 12 }, -1);
    updateLeg("far", farHip, { x: far.x + 1, y: far.y - 11 }, -1);

    rider.setAttribute("transform", "translate(0 " + bob.toFixed(2) + ")");
    head.setAttribute("transform", "translate(0 " + (Math.sin(angle * 2 + 0.7) * 1.5).toFixed(2) + ")");
    const pouchScale = 1 + Math.sin(time * 5.2) * 0.035;
    pouch.setAttribute("transform", "translate(682 160) scale(1 " + pouchScale.toFixed(3) + ") translate(-682 -160)");
    fishTail.setAttribute("transform", "rotate(" + (Math.sin(time * 9) * 24).toFixed(2) + " 2 1)");
    eye.setAttribute("transform", "translate(584 144) scale(1 " + blinkScale(time).toFixed(3) + ")");
    farWing.setAttribute("transform", "rotate(" + (Math.sin(time * 4.2) * 8).toFixed(2) + " 372 268)");
    tail.setAttribute("transform", "rotate(" + (Math.sin(time * 3.1) * 2.4).toFixed(2) + " 330 296)");

    const scarfPath = ribbon(446, 196, time, 0, 9, 18);
    scarfO.setAttribute("d", scarfPath);
    scarf.setAttribute("d", scarfPath);
    scarf2.setAttribute("d", ribbon(438, 206, time, 1.3, 7, 16));

    starfish.setAttribute("transform", "translate(718 332) rotate(" + (Math.sin(time * 7) * 8).toFixed(2) + ") translate(-718 -332)");
    shadow.setAttribute("rx", 168 + bob * 1.4);

    rays.setAttribute("transform", "rotate(" + (time * 10).toFixed(2) + " 156 112)");
    beam.setAttribute("transform", "rotate(" + (Math.sin(time * 0.55) * 24).toFixed(2) + " 44 18)");
    const lightX = wrap(1020 - dist * 0.035, 1600) - 180;
    lighthouse.setAttribute("transform", "translate(" + lightX.toFixed(1) + " 300)");
    const boatX = wrap(780 - dist * 0.09, 1500) - 80;
    const boatY = 404 + Math.sin(time * 1.25) * 2.4;
    boat.setAttribute("transform", "translate(" + boatX.toFixed(1) + " " + boatY.toFixed(1) + ")");
    shimmer.setAttribute("opacity", (0.72 + Math.sin(time * 2.1) * 0.28).toFixed(3));

    placePlanks(dist);
    placePosts(dist);
    placeGrass(dist * 1.32);
    placeBeach(dist * 0.2);
    placeHills(dist * 0.03);
    placeWaves.forEach((wave) => wave.place(dist * wave.speed));

    clouds.forEach((cloud) => {
      const x = wrap(cloud.x - dist * cloud.speed, 1500) - 180;
      const y = cloud.y + Math.sin(time * 0.35 + cloud.x * 0.01) * 5;
      cloud.node.setAttribute("transform", "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ")");
    });
    gulls.forEach((gull) => {
      const x = wrap(gull.x - dist * gull.speed, 1500) - 120;
      const y = gull.y + Math.sin(time * 0.8 + gull.x) * 8;
      gull.node.setAttribute("transform", "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ")");
      const flap = Math.sin(time * 6 + gull.x) * 16;
      gull.left.setAttribute("transform", "rotate(" + flap.toFixed(2) + ")");
      gull.right.setAttribute("transform", "rotate(" + (-flap).toFixed(2) + ")");
    });

    if (dt > 0) {
      puffTimer -= dt;
      if (puffTimer <= 0) {
        puffTimer = 0.18;
        const puff = puffs.find((item) => item.age >= 1) || puffs[0];
        puff.age = 0;
        puff.dur = 0.42 + Math.random() * 0.22;
        puff.x = 392;
        puff.y = 516;
      }
      puffs.forEach((puff) => {
        if (puff.age >= 1) return;
        puff.age += dt / puff.dur;
        const k = Math.min(puff.age, 1);
        puff.node.setAttribute("cx", puff.x - k * 62);
        puff.node.setAttribute("cy", puff.y - k * 14);
        puff.node.setAttribute("rx", 5 + k * 11);
        puff.node.setAttribute("ry", 2.4 + k * 4);
        puff.node.setAttribute("opacity", ((1 - k) * 0.4).toFixed(3));
      });
    }
  }

  render(0.22, 0);

  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  const start = performance.now() - 220;
  function frame(now) {
    const time = (now - start) / 1000;
    const dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
    last = now;
    render(time, dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
