<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鹈鹕骑自行车</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #13202c;
    }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    svg {
      width: min(96vw, 150vh);
      height: auto;
      max-height: calc(100vh - 32px);
      border-radius: 18px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
      background: #6ec0d8;
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕正在骑自行车的二维动画">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4fa8cc" />
        <stop offset="42%" stop-color="#9ad4ea" />
        <stop offset="70%" stop-color="#d7eef7" />
        <stop offset="100%" stop-color="#f3e2b8" />
      </linearGradient>
      <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#5eb3c9" />
        <stop offset="45%" stop-color="#2f7f9c" />
        <stop offset="100%" stop-color="#246882" />
      </linearGradient>
      <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#efd7a4" />
        <stop offset="100%" stop-color="#d7b574" />
      </linearGradient>
      <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#6a7380" />
        <stop offset="100%" stop-color="#3e4650" />
      </linearGradient>
      <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffe08a" />
        <stop offset="55%" stop-color="#f0b429" />
        <stop offset="100%" stop-color="#d98a1a" />
      </linearGradient>
      <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f6b26b" />
        <stop offset="100%" stop-color="#e07a32" />
      </linearGradient>
      <linearGradient id="bike" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ef6a55" />
        <stop offset="100%" stop-color="#c43c2e" />
      </linearGradient>
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff4b5" stop-opacity="0.85" />
        <stop offset="70%" stop-color="#ffd36a" stop-opacity="0.2" />
        <stop offset="100%" stop-color="#ffd36a" stop-opacity="0" />
      </radialGradient>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#1b2430" flood-opacity="0.22" />
      </filter>
    </defs>

    <!-- Sky -->
    <rect width="960" height="540" fill="url(#sky)" />
    <circle cx="812" cy="88" r="78" fill="url(#sunGlow)" />
    <circle cx="812" cy="88" r="36" fill="#ffe9a0" />
    <circle cx="800" cy="78" r="10" fill="#fff7d2" opacity="0.55" />

    <!-- Clouds: two copies for a seamless drift -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-960 0" dur="36s" repeatCount="indefinite" />
      <g fill="#ffffff" opacity="0.88">
        <g transform="translate(80,70)">
          <ellipse cx="0" cy="12" rx="38" ry="18" />
          <ellipse cx="28" cy="6" rx="30" ry="20" />
          <ellipse cx="54" cy="14" rx="26" ry="15" />
        </g>
        <g transform="translate(340,46)">
          <ellipse cx="0" cy="14" rx="34" ry="16" />
          <ellipse cx="32" cy="8" rx="36" ry="22" />
          <ellipse cx="64" cy="16" rx="24" ry="14" />
        </g>
        <g transform="translate(620,92)">
          <ellipse cx="0" cy="10" rx="28" ry="14" />
          <ellipse cx="24" cy="4" rx="26" ry="16" />
          <ellipse cx="48" cy="12" rx="22" ry="12" />
        </g>
        <g transform="translate(1040,70)">
          <ellipse cx="0" cy="12" rx="38" ry="18" />
          <ellipse cx="28" cy="6" rx="30" ry="20" />
          <ellipse cx="54" cy="14" rx="26" ry="15" />
        </g>
        <g transform="translate(1300,46)">
          <ellipse cx="0" cy="14" rx="34" ry="16" />
          <ellipse cx="32" cy="8" rx="36" ry="22" />
          <ellipse cx="64" cy="16" rx="24" ry="14" />
        </g>
        <g transform="translate(1580,92)">
          <ellipse cx="0" cy="10" rx="28" ry="14" />
          <ellipse cx="24" cy="4" rx="26" ry="16" />
          <ellipse cx="48" cy="12" rx="22" ry="12" />
        </g>
      </g>
    </g>

    <!-- Distant sailboat -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="980 0" to="-120 0" dur="42s" repeatCount="indefinite" />
      <g transform="translate(0,236)">
        <polygon points="18,0 18,34 46,34" fill="#f7f3ea" />
        <polygon points="16,8 16,34 -8,34" fill="#efe6d2" />
        <rect x="16" y="0" width="3" height="40" fill="#5b4636" />
        <path d="M0,42 Q22,36 50,42 L46,48 L4,48 Z" fill="#c45b3a" />
      </g>
    </g>

    <!-- Ocean -->
    <rect x="0" y="250" width="960" height="150" fill="url(#ocean)" />
    <path fill="#4ea3bb" opacity="0.55">
      <animate attributeName="d" dur="3.6s" repeatCount="indefinite"
        values="M0,262 Q80,250 160,262 T320,262 T480,262 T640,262 T800,262 T960,262 V400 H0 Z;
                M0,262 Q80,274 160,262 T320,262 T480,262 T640,262 T800,262 T960,262 V400 H0 Z;
                M0,262 Q80,250 160,262 T320,262 T480,262 T640,262 T800,262 T960,262 V400 H0 Z" />
    </path>
    <path fill="#d9f1f6" opacity="0.35">
      <animate attributeName="d" dur="2.8s" repeatCount="indefinite"
        values="M0,258 Q60,250 120,258 T240,258 T360,258 T480,258 T600,258 T720,258 T840,258 T960,258 V270 H0 Z;
                M0,258 Q60,266 120,258 T240,258 T360,258 T480,258 T600,258 T720,258 T840,258 T960,258 V270 H0 Z;
                M0,258 Q60,250 120,258 T240,258 T360,258 T480,258 T600,258 T720,258 T840,258 T960,258 V270 H0 Z" />
    </path>

    <!-- Sparkles on water -->
    <g fill="#ffffff" opacity="0.45">
      <ellipse cx="140" cy="300" rx="10" ry="2">
        <animate attributeName="opacity" values="0.15;0.6;0.15" dur="2.2s" repeatCount="indefinite" />
      </ellipse>
      <ellipse cx="410" cy="318" rx="12" ry="2">
        <animate attributeName="opacity" values="0.5;0.1;0.5" dur="1.8s" repeatCount="indefinite" />
      </ellipse>
      <ellipse cx="700" cy="292" rx="9" ry="2">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.6s" repeatCount="indefinite" />
      </ellipse>
    </g>

    <!-- Dunes / beach, scrolling -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-960 0" dur="14s" repeatCount="indefinite" />
      <path fill="url(#sand)" d="M0,368 C70,348 120,378 210,358 C300,338 360,372 460,352 C540,336 620,370 720,350 C820,332 880,366 960,348 L960,478 L0,478 Z" />
      <path fill="#e7c88a" d="M960,368 C1030,348 1080,378 1170,358 C1260,338 1320,372 1420,352 C1500,336 1580,370 1680,350 C1780,332 1840,366 1920,348 L1920,478 L960,478 Z" />
      <g fill="#c9a464">
        <ellipse cx="90" cy="430" rx="10" ry="5" />
        <ellipse cx="310" cy="448" rx="8" ry="4" />
        <ellipse cx="730" cy="438" rx="11" ry="5" />
        <ellipse cx="1050" cy="430" rx="10" ry="5" />
        <ellipse cx="1270" cy="448" rx="8" ry="4" />
        <ellipse cx="1690" cy="438" rx="11" ry="5" />
      </g>
      <!-- grass tufts -->
      <g stroke="#6a9a4e" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M180,390 q6,-18 0,-28 M180,390 q-7,-16 -12,-24 M180,390 q12,-12 16,-22" />
        <path d="M520,400 q6,-16 0,-24 M520,400 q-6,-14 -11,-20 M520,400 q10,-10 14,-18" />
        <path d="M880,386 q6,-18 0,-26 M880,386 q-7,-15 -12,-22 M880,386 q11,-11 15,-20" />
        <path d="M1140,390 q6,-18 0,-28 M1140,390 q-7,-16 -12,-24 M1140,390 q12,-12 16,-22" />
        <path d="M1480,400 q6,-16 0,-24 M1480,400 q-6,-14 -11,-20 M1480,400 q10,-10 14,-18" />
        <path d="M1840,386 q6,-18 0,-26 M1840,386 q-7,-15 -12,-22 M1840,386 q11,-11 15,-20" />
      </g>
    </g>

    <!-- Road -->
    <rect x="0" y="456" width="960" height="84" fill="url(#road)" />
    <rect x="0" y="456" width="960" height="8" fill="#4d5560" />
    <line x1="-80" y1="498" x2="2000" y2="498" stroke="#e8c547" stroke-width="7" stroke-linecap="butt" stroke-dasharray="42 36">
      <animate attributeName="stroke-dashoffset" from="0" to="78" dur="0.45s" repeatCount="indefinite" />
    </line>
    <rect x="0" y="528" width="960" height="12" fill="#323940" />

    <!-- Roadside posts scrolling -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-960 0" dur="6s" repeatCount="indefinite" />
      <g fill="#8d6a44">
        <rect x="40" y="430" width="8" height="36" rx="2" />
        <rect x="320" y="434" width="8" height="32" rx="2" />
        <rect x="610" y="428" width="8" height="38" rx="2" />
        <rect x="860" y="432" width="8" height="34" rx="2" />
        <rect x="1000" y="430" width="8" height="36" rx="2" />
        <rect x="1280" y="434" width="8" height="32" rx="2" />
        <rect x="1570" y="428" width="8" height="38" rx="2" />
        <rect x="1820" y="432" width="8" height="34" rx="2" />
      </g>
    </g>

    <!-- Ground shadow -->
    <ellipse cx="470" cy="478" rx="132" ry="11" fill="#1b2430" opacity="0.22">
      <animate attributeName="rx" values="132;118;132" dur="0.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.22;0.14;0.22" dur="0.4s" repeatCount="indefinite" />
    </ellipse>

    <!-- ===== Bicycle + pelican ===== -->
    <g filter="url(#soft)">
      <!-- Rear wheel -->
      <g transform="translate(368,428)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="0.8s" repeatCount="indefinite" />
          <circle r="52" fill="#2a2c30" />
          <circle r="44" fill="#d9d1c3" />
          <circle r="40" fill="none" stroke="#9a9286" stroke-width="2" />
          <g stroke="#6d675e" stroke-width="1.6">
            <line x1="0" y1="-38" x2="0" y2="38" />
            <line x1="-38" y1="0" x2="38" y2="0" />
            <line x1="-27" y1="-27" x2="27" y2="27" />
            <line x1="27" y1="-27" x2="-27" y2="27" />
          </g>
          <circle r="7" fill="#cfc7b8" stroke="#5c564e" stroke-width="2" />
        </g>
      </g>

      <!-- Front wheel -->
      <g transform="translate(562,428)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="0.8s" repeatCount="indefinite" />
          <circle r="52" fill="#2a2c30" />
          <circle r="44" fill="#d9d1c3" />
          <circle r="40" fill="none" stroke="#9a9286" stroke-width="2" />
          <g stroke="#6d675e" stroke-width="1.6">
            <line x1="0" y1="-38" x2="0" y2="38" />
            <line x1="-38" y1="0" x2="38" y2="0" />
            <line x1="-27" y1="-27" x2="27" y2="27" />
            <line x1="27" y1="-27" x2="-27" y2="27" />
          </g>
          <circle r="7" fill="#cfc7b8" stroke="#5c564e" stroke-width="2" />
        </g>
      </g>

      <!-- Far pedal + far leg (behind frame) -->
      <g transform="translate(458,428)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="180 0 0" to="540 0 0" dur="0.8s" repeatCount="indefinite" />
          <line x1="0" y1="0" x2="0" y2="26" stroke="#2e3136" stroke-width="6" stroke-linecap="round" />
          <g transform="translate(0,26)">
            <animateTransform attributeName="transform" type="rotate" from="-180 0 0" to="-540 0 0" dur="0.8s" repeatCount="indefinite" />
            <rect x="-12" y="-4" width="24" height="8" rx="3" fill="#3a3f46" />
            <!-- webbed far foot -->
            <path d="M-4,-2 Q18,0 22,6 Q8,10 -6,6 Q-12,2 -4,-2 Z" fill="#e0a028" />
          </g>
        </g>
      </g>
      <g transform="translate(438,348)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="18;52;18" dur="0.8s" repeatCount="indefinite" />
          <rect x="-8" y="-4" width="16" height="52" rx="8" fill="#f3ebe0" />
          <g transform="translate(0,46)">
            <animateTransform attributeName="transform" type="rotate" values="16;48;16" dur="0.8s" repeatCount="indefinite" />
            <rect x="-7" y="-2" width="14" height="46" rx="7" fill="#efe4d4" />
          </g>
        </g>
      </g>

      <!-- Frame -->
      <g fill="none" stroke="url(#bike)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M368,428 L458,428 L408,348 Z" />
        <path d="M408,348 L528,352" />
        <path d="M458,428 L528,352" />
        <path d="M528,352 L562,428" />
      </g>
      <circle cx="458" cy="428" r="15" fill="none" stroke="#3a3f46" stroke-width="4" />
      <circle cx="368" cy="428" r="8" fill="none" stroke="#3a3f46" stroke-width="3" />
      <path d="M373,422 Q410,418 448,418 Q452,428 448,438 Q410,438 373,434" fill="none" stroke="#2e3136" stroke-width="2.2" opacity="0.8" />

      <!-- Seat -->
      <path d="M388,344 Q408,332 430,340 Q438,348 422,352 Q400,356 388,348 Z" fill="#3a3f46" />
      <rect x="404" y="348" width="8" height="18" rx="2" fill="#c43c2e" />

      <!-- Handlebars -->
      <path d="M528,352 L536,328 Q548,318 568,322" fill="none" stroke="url(#bike)" stroke-width="7" stroke-linecap="round" />
      <path d="M560,314 L576,334" stroke="#3a3f46" stroke-width="8" stroke-linecap="round" />
      <circle cx="578" cy="336" r="5" fill="#2e3136" />

      <!-- Basket with a fish -->
      <g transform="translate(575,360)">
        <path d="M0,0 L28,4 L26,22 L2,20 Z" fill="#d9a441" stroke="#b7842c" stroke-width="1.5" />
        <path d="M4,8 L24,10 M5,14 L23,16" stroke="#b7842c" stroke-width="1.2" />
        <g transform="translate(8,6)">
          <animateTransform attributeName="transform" type="rotate" values="-6;8;-6" dur="1.6s" repeatCount="indefinite" />
          <ellipse cx="8" cy="6" rx="10" ry="5" fill="#6db3c4" />
          <polygon points="0,6 -6,1 -6,11" fill="#5a9eae" />
          <circle cx="12" cy="5" r="1.1" fill="#1c2430" />
        </g>
      </g>

      <!-- Pelican body bounce -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 3; 0 0" dur="0.4s" repeatCount="indefinite" />

        <!-- Tail -->
        <path d="M350,318 Q328,308 318,328 Q338,338 358,332 Z" fill="#fffdf6" stroke="#e4d8c4" stroke-width="1.2" />

        <!-- Far wing (folded, gentle flap) -->
        <g transform="translate(400,312)">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="-18;-28;-18" dur="1.6s" repeatCount="indefinite" />
            <ellipse cx="0" cy="0" rx="54" ry="18" fill="#fffdf6" stroke="#e4d8c4" stroke-width="1.2" />
            <path d="M28,-8 Q48,-18 62,-4 Q46,8 24,6 Z" fill="#2a3a48" />
          </g>
        </g>

        <!-- Body -->
        <ellipse cx="418" cy="322" rx="68" ry="42" fill="#fffdf6" stroke="#e4d8c4" stroke-width="1.4" />
        <ellipse cx="430" cy="332" rx="46" ry="26" fill="#f2eadc" opacity="0.9" />

        <!-- Near wing holding the handlebar -->
        <g transform="translate(448,308)">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="12;18;12" dur="0.8s" repeatCount="indefinite" />
            <path d="M0,0 Q36,18 78,28 Q70,42 36,32 Q10,20 0,10 Z" fill="#fffdf6" stroke="#e4d8c4" stroke-width="1.3" />
            <path d="M64,24 Q86,22 96,32 Q78,40 62,32 Z" fill="#2a3a48" />
            <path d="M18,10 Q40,24 70,30" fill="none" stroke="#e4d8c4" stroke-width="1.1" />
          </g>
        </g>

        <!-- Neck + head -->
        <g transform="translate(470,300)">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="-4;3;-4" dur="0.8s" repeatCount="indefinite" />
            <path d="M-8,16 C8,-8 28,-4 42,8 C30,18 8,28 -6,24 Z" fill="#fffdf6" stroke="#e4d8c4" stroke-width="1.3" />
            <circle cx="50" cy="6" r="24" fill="#fffdf6" stroke="#e4d8c4" stroke-width="1.3" />
            <circle cx="46" cy="-2" r="7" fill="#fff8e4" />

            <!-- Eye -->
            <g transform="translate(58,-2)">
              <ellipse cx="0" cy="0" rx="6.5" ry="6.5" fill="#f7f7f4" />
              <ellipse cx="1.2" cy="0.4" rx="3.4" ry="3.4" fill="#1c2430">
                <animate attributeName="ry" values="3.4;3.4;3.4;0.35;3.4;3.4" keyTimes="0;0.42;0.46;0.48;0.52;1" dur="3.6s" repeatCount="indefinite" />
              </ellipse>
              <circle cx="2.3" cy="-1" r="1.1" fill="#ffffff" />
            </g>
            <path d="M64,8 Q70,12 78,10" fill="none" stroke="#d7b48a" stroke-width="1.4" stroke-linecap="round" />

            <!-- Beak + pouch -->
            <g transform="translate(68,6)">
              <path d="M0,2 L108,8 Q114,16 106,20 L4,16 Q-4,10 0,2 Z" fill="url(#beak)" stroke="#d49a22" stroke-width="1.1" />
              <path d="M96,9 Q110,8 108,16 Q100,15 96,13 Z" fill="#c67a1c" />
              <line x1="18" y1="7" x2="34" y2="8.5" stroke="#d49a22" stroke-width="1.2" stroke-linecap="round" />
              <path fill="url(#pouch)">
                <animate attributeName="d" dur="0.8s" repeatCount="indefinite"
                  values="M4,16 Q28,64 78,40 Q104,28 106,20 Q70,24 4,16 Z;
                          M4,16 Q32,78 82,46 Q106,30 106,20 Q70,24 4,16 Z;
                          M4,16 Q28,64 78,40 Q104,28 106,20 Q70,24 4,16 Z" />
              </path>
              <path d="M18,22 Q36,48 70,34" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3" stroke-linecap="round">
                <animate attributeName="d" dur="0.8s" repeatCount="indefinite"
                  values="M18,22 Q36,48 70,34;
                          M18,24 Q38,58 74,38;
                          M18,22 Q36,48 70,34" />
              </path>
            </g>
          </g>
        </g>
      </g>

      <!-- Near pedal + near leg (in front) -->
      <g transform="translate(458,428)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="0.8s" repeatCount="indefinite" />
          <line x1="0" y1="0" x2="0" y2="26" stroke="#2e3136" stroke-width="6" stroke-linecap="round" />
          <g transform="translate(0,26)">
            <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="0.8s" repeatCount="indefinite" />
            <rect x="-12" y="-4" width="24" height="8" rx="3" fill="#2a2e34" />
            <path d="M-2,-2 Q20,1 24,7 Q8,12 -6,7 Q-12,2 -2,-2 Z" fill="#e8ad2e" />
            <path d="M6,2 L10,8 M12,2 L15,8 M18,3 L20,8" stroke="#c48c1c" stroke-width="1.1" stroke-linecap="round" />
          </g>
        </g>
      </g>
      <g transform="translate(452,350)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="50;16;50" dur="0.8s" repeatCount="indefinite" />
          <rect x="-8" y="-4" width="16" height="54" rx="8" fill="#fffdf6" stroke="#e4d8c4" stroke-width="1" />
          <g transform="translate(0,48)">
            <animateTransform attributeName="transform" type="rotate" values="48;14;48" dur="0.8s" repeatCount="indefinite" />
            <rect x="-7" y="-2" width="14" height="44" rx="7" fill="#f7f0e4" stroke="#e4d8c4" stroke-width="1" />
          </g>
        </g>
      </g>
    </g>

    <!-- Speed dust near tires -->
    <g fill="#d7d0c4" opacity="0.55">
      <ellipse cx="310" cy="468" rx="10" ry="3">
        <animate attributeName="cx" values="318;290;318" dur="0.4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.5;0.05;0.5" dur="0.4s" repeatCount="indefinite" />
      </ellipse>
      <ellipse cx="292" cy="474" rx="7" ry="2.4">
        <animate attributeName="cx" values="300;270;300" dur="0.5s" repeatCount="indefinite" />
      </ellipse>
    </g>
