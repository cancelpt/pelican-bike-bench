<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车</title>
<style>
  html, body { margin: 0; height: 100%; background: #10202b; }
  body { display: grid; place-items: center; overflow: hidden; }
  svg { display: block; width: min(100vw, calc(100vh * 900 / 520)); aspect-ratio: 900 / 520; height: auto; }
  .ol { stroke: #3f5166; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
</style>
</head>
<body>

    <linearGradient id="pouchG" x1="0" y1="0" x2="0" y2="1">

      <stop offset="1" stop-color="#f27d4d"/>
    </linearGradient>

    <g id="cloud" fill="#fff">

      <use href="#cloud" transform="translate(330 130) scale(.75)"/>
      <use href="#cloud" transform="translate(560 60)"/>

    <g id="tree">

      <circle cx="10" cy="-36" r="12" fill="#2a8d4d"/>

    </g>

  <!-- ===== sky ===== -->

    <g id="fish"><g transform="rotate(-8 566 278)">
      <path class="ol" fill="#ff8a3d" d="M566 238L547 201Q566 214 585 201Z"/>
      <path class="ol" fill="#8fb8d8" d="M566 294C544 285 542 254 566 232C590 254 588 285 566 294Z"/>
      <path d="M557 252C561 245 571 245 575 252M553 262C558 254 574 254 579 262" fill="none" stroke="#d3e6f3" stroke-width="2.2" stroke-linecap="round"/>
    </g></g>
    <path class="ol" fill="#dba760" d="M538 267L596 267L588 297Q587 300 584 300L550 300Q547 300 546 297Z"/>
    <path d="M550 267L552 300M562 267L563 300M574 267L574 300M585 267L583 300M541 277L593 277M543 288L591 288" fill="none" stroke="#b47b3d" stroke-width="1.6"/>
    <path d="M537 267L597 267" stroke="#8b5a2b" stroke-width="4.6" stroke-linecap="round"/>

    <g id="pelican">

      <!-- neck outline + head, drawn behind the body so the neck base tucks in -->

        <!-- crest tufts, pouch and bill sit behind the head so no seam shows at the base -->

        <path class="ol" fill="#fbfdff" d="M452 104C449 95 449 87 452 78C460 84 465 92 466 103Z"/>
        <path id="pouch" class="ol" fill="url(#pouchG)"/>
        <path class="ol" fill="url(#billG)" d="M468 121C512 114 566 126 597 144C601 148 599 153 592 152C556 149 520 146 484 141L468 141Z"/>
        <path d="M486 124C520 124 560 133 588 146" fill="none" stroke="#d98a1f" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
        <path d="M488 129L499 130.4" fill="none" stroke="#b86a16" stroke-width="2" stroke-linecap="round"/>
        <ellipse class="ol" cx="461" cy="124" rx="26" ry="22" fill="#fbfdff"/>
        <g id="eye" transform="translate(471 114)">
          <circle r="6.6" fill="#fff" stroke="#3f5166" stroke-width="1.8"/>
          <circle cx="1.6" cy=".4" r="3.6" fill="#1f2a37"/>

      </g>

      <!-- tail feathers -->
      <path class="ol" fill="#dbe6f0" d="M354 212C336 206 318 200 300 198C306 205 312 210 322 214C312 216 306 222 304 230C320 228 338 232 356 240Z"/>
      <path d="M340 215L312 205M340 226L314 224" fill="none" stroke="#b6c6d6" stroke-width="1.8" stroke-linecap="round"/>

      <!-- body -->
      <path class="ol" fill="url(#bodyG)" d="M424 186C446 196 448 232 426 250C412 264 372 266 352 254C334 244 330 214 344 196C356 178 396 166 424 186Z"/>
      <path d="M426 250C412 264 372 266 352 254C372 256 404 254 426 250Z" fill="#c9d8e6" opacity=".7"/>
      <path d="M356 214q5 6 11 2M372 202q5 6 11 2M350 234q5 6 11 2M366 226q5 6 11 2M384 214q5 6 11 2" fill="none" stroke="#c3d2e0" stroke-width="2" stroke-linecap="round"/>
      <!-- scarf tails stream behind the neck (paths are animated) -->
      <path id="scarfA" fill="#ff5b4a" stroke="#3f5166" stroke-width="1.8" stroke-linejoin="round"/>
      <path id="scarfB" fill="#ffd23f" stroke="#3f5166" stroke-width="1.8" stroke-linejoin="round"/>

      <!-- neck fill, drawn over the body so the neck and torso merge without a seam -->
      <g id="neckFront">
        <path d="M410 202C396 176 404 140 452 124" fill="none" stroke="#fbfdff" stroke-width="22" stroke-linecap="round"/>
      </g>
      <path d="M393 170Q406 177 419 164" fill="none" stroke="#3f5166" stroke-width="12.4" stroke-linecap="round"/>
      <path d="M393 170Q406 177 419 164" fill="none" stroke="#ff5b4a" stroke-width="8.4" stroke-linecap="round"/>
      <path d="M397 172.5l3-6M406 175l2.6-6.4M414 171l2.4-6" fill="none" stroke="#ffd23f" stroke-width="2" stroke-linecap="round"/>

      <!-- near wing reaching forward to the handlebar grip -->

      <g clip-path="url(#wingClip)">
        <path d="M458 182L540 190L540 250L432 250C452 232 462 208 458 182Z" fill="#56667c"/>
        <path d="M414 203C434 208 452 211 470 218M410 211C432 217 456 224 484 229" fill="none" stroke="#c5d3e1" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M478 214L470 238M494 221L488 241M510 228L505 244" fill="none" stroke="#3a4759" stroke-width="1.6" stroke-linecap="round"/>

    <g id="nLeg" fill="none" stroke-linecap="round" stroke-linejoin="round">

      <path id="nShin" stroke="#e8923f" stroke-width="8"/>

      <path id="nThigh" stroke="#eef4fa" stroke-width="15"/>

</svg>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const TAU = Math.PI * 2, DEG = 180 / Math.PI, TILE = 900;
  const f1 = n => n.toFixed(1);

  // Geometry below must match the drawing (rider coordinates).
  const BB = [439, 380];            // bottom bracket (crank centre)
  const CRANK_LEN = 30, WHEEL_R = 62;
  const GEAR = 20 / 13;             // chainring radius / rear sprocket radius
  const CRANK_RATE = 4.4;           // rad/s
  const THIGH = 80, SHIN = 84;
  const HIP = { n: [398, 246], f: [386, 245] };
  const FOOT = [-6, -11.5];         // ankle offset from the pedal centre

  /* ---------- procedural pieces ---------- */

  // Hills are sums of integer harmonics of TILE, so the two-tile-wide path loops seamlessly.
  const hills = (base, comps) => {
    let d = 'M0 432';
    for (let x = 0; x <= TILE * 2; x += 10) {
      let y = base;
      for (const [a, k, p] of comps) y += a * Math.sin(TAU * k * x / TILE + p);
      d += `L${x} ${f1(y)}`;
    }
    return d + `L${TILE * 2} 432Z`;
  };
  $('hillFar').setAttribute('d', hills(372, [[14, 1, .6], [9, 2, 2.1], [4, 5, 1]]));
  $('hillNear').setAttribute('d', hills(396, [[10, 1, 3.1], [6, 3, .4], [3, 6, 2.2]]));

  // 18 laced spokes; alternating lean gives the crossed look of a wire wheel.
  let spokes = '';
  for (let i = 0; i < 18; i++) {
    const a = i * TAU / 18, b = a + (i % 2 ? -.42 : .42);
    spokes += `M${f1(7 * Math.cos(a))} ${f1(7 * Math.sin(a))}L${f1(52 * Math.cos(b))} ${f1(52 * Math.sin(b))}`;
  }
  document.querySelectorAll('.spk').forEach(p => p.setAttribute('d', spokes));

  // Scarf tail: a ribbon whose centre line is a sine wave travelling away from the neck.
  const ribbon = (x0, y0, len, w0, amp, ph, t) => {
    const top = [], bot = [];
    for (let i = 0; i <= 12; i++) {
      const s = i / 12, x = x0 - s * len;
      const y = y0 + s * 6 + Math.sin(s * 6.5 - t * 10 + ph) * amp * s, w = w0 * (1 - .35 * s);
      top.push(`${f1(x)} ${f1(y - w)}`);
      bot.unshift(`${f1(x)} ${f1(y + w)}`);
    }
    return `M${top.join('L')}L${bot.join('L')}Z`;
  };

  // Two-bone IK from hip (h) to ankle (t); the knee bends forward (+x).
  const ik = (hx, hy, tx, ty, a, b) => {
    const dx = tx - hx, dy = ty - hy, d = Math.hypot(dx, dy);
    const r = Math.min(Math.max(d, Math.abs(a - b) + 1), a + b - .5);
    const c = (a * a + r * r - b * b) / (2 * a * r), s = Math.sqrt(1 - c * c);
    const ux = dx / d, uy = dy / d;
    return [hx + a * (ux * c + uy * s), hy + a * (uy * c - ux * s)];
  };
  const leg = p => ({
    shinO: $(p + 'ShinO'), shin: $(p + 'Shin'), foot: $(p + 'Foot'),
    thighO: $(p + 'ThighO'), thigh: $(p + 'Thigh')
  });
  const setLeg = (L, hx, hy, ax, ay) => {
    const [kx, ky] = ik(hx, hy, ax, ay, THIGH, SHIN);
    const shin = `M${f1(kx)} ${f1(ky)}L${f1(ax)} ${f1(ay)}`;
    const thigh = `M${f1(hx)} ${f1(hy)}L${f1(kx)} ${f1(ky)}`;
    L.shinO.setAttribute('d', shin); L.shin.setAttribute('d', shin);
    L.thighO.setAttribute('d', thigh); L.thigh.setAttribute('d', thigh);
    L.foot.setAttribute('transform', `translate(${f1(ax)} ${f1(ay)})`);
  };

  /* ---------- element handles ---------- */
  const layers = [['gClouds', .05], ['gHillFar', .1], ['gHillNear', .22], ['gTrees', .8],
                  ['gGrass', 1], ['gFence', 1], ['gRoad', 1]].map(([id, k]) => [$(id), k]);
  const rSpokes = $('rSpokes'), fSpokes = $('fSpokes'), sprocket = $('sprocket'), ring = $('ring'), chain = $('chain');
  const nCrank = $('nCrank'), fCrank = $('fCrank'), nPedal = $('nPedal'), fPedal = $('fPedal');
  const legN = leg('n'), legF = leg('f');
  const pelican = $('pelican'), neckBack = $('neckBack'), neckFront = $('neckFront');
  const pouch = $('pouch'), eye = $('eye'), scarfA = $('scarfA'), scarfB = $('scarfB'), fish = $('fish');

  /* ---------- animation loop ---------- */
  let last = 0, t = 0;
  const tick = now => {
    requestAnimationFrame(tick);
    if (!last) last = now;
    t += Math.min((now - last) / 1000, .05);   // clamp so a background tab doesn't cause a jump
    last = now;

    const crank = t * CRANK_RATE, wheel = crank * GEAR, dist = wheel * WHEEL_R;   // rolling without slipping

    // scenery: each layer scrolls at its own fraction of the ground speed
    for (const [g, k] of layers) g.setAttribute('transform', `translate(${f1(-((dist * k) % TILE))} 0)`);

    // wheels and drivetrain
    const wd = `rotate(${f1((wheel * DEG) % 360)})`;
    rSpokes.setAttribute('transform', wd);
    fSpokes.setAttribute('transform', wd);
    sprocket.setAttribute('transform', wd);
    ring.setAttribute('transform', `rotate(${f1((crank * DEG) % 360)})`);
    chain.setAttribute('stroke-dashoffset', f1((crank * 20) % 6.5));   // path runs chainring -> sprocket on top; links travel the other way

    // pedals and legs
    const bob = 1.4 * Math.cos(2 * crank);          // body rises as a leg reaches full extension
    const pedalAt = a => [BB[0] + CRANK_LEN * Math.cos(a), BB[1] + CRANK_LEN * Math.sin(a)];
    const pn = pedalAt(crank), pf = pedalAt(crank + Math.PI);
    nCrank.setAttribute('x2', f1(pn[0])); nCrank.setAttribute('y2', f1(pn[1]));
    fCrank.setAttribute('x2', f1(pf[0])); fCrank.setAttribute('y2', f1(pf[1]));
    nPedal.setAttribute('transform', `translate(${f1(pn[0])} ${f1(pn[1])})`);
    fPedal.setAttribute('transform', `translate(${f1(pf[0])} ${f1(pf[1])})`);
    setLeg(legN, HIP.n[0], HIP.n[1] + bob, pn[0] + FOOT[0], pn[1] + FOOT[1]);
    setLeg(legF, HIP.f[0], HIP.f[1] + bob, pf[0] + FOOT[0], pf[1] + FOOT[1]);

    // pelican: body bob, neck sway, pouch wobble, blink, scarf, fish
    pelican.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
    const sway = `rotate(${(1.6 * Math.sin(crank * 2 + .8)).toFixed(2)} 404 190)`;
    neckBack.setAttribute('transform', sway);
    neckFront.setAttribute('transform', sway);

    const k = 1 + .09 * Math.sin(crank * 2 + 1.3);
    pouch.setAttribute('d', `M474 143C500 ${f1(143 + 31 * k)} 556 ${f1(150 + 24 * k)} 593 150L590 146C556 148 520 146 484 141L474 143Z`);

    const ph = t % 3.7, open = ph < .16 ? Math.max(Math.abs(ph - .08) / .08, .06) : 1;
    eye.setAttribute('transform', `translate(471 114) scale(1 ${open.toFixed(2)})`);

    scarfA.setAttribute('d', ribbon(392, 162, 68, 5.5, 6, 0, t));
    scarfB.setAttribute('d', ribbon(394, 169, 50, 4.6, 5, 1.7, t));
    fish.setAttribute('transform', `rotate(${f1(9 * Math.sin(t * 6.5))} 566 278)`);
  };
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
