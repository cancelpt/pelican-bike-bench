<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 - SVG动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #87CEEB;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Microsoft YaHei', sans-serif;
  }
  .scene {
    width: 800px;
    height: 400px;
    position: relative;
    background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 60%, #228B22 60%, #228B22 100%);
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    overflow: hidden;
  }
  svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .title {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 24px;
    font-weight: bold;
    color: #fff;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    pointer-events: none;
    z-index: 10;
  }
  .cloud {
    fill: #FFFFFF;
    opacity: 0.8;
    animation: cloudMove 25s linear infinite;
  }
  .cloud:nth-child(2) { animation-delay: -10s; opacity: 0.6; transform: scale(0.8); }
  .cloud:nth-child(3) { animation-delay: -20s; opacity: 0.5; transform: scale(1.2); }

  @keyframes cloudMove {
    0% { transform: translateX(-150px); }
    100% { transform: translateX(950px); }
  }

  .bike-group {
    animation: bikeRide 3s linear infinite;
  }
  @keyframes bikeRide {
    0% { transform: translateX(0); }
    100% { transform: translateX(-120px); }
  }

  .wheel {
    transform-origin: 110px 300px;
    animation: wheelSpin 0.4s linear infinite;
  }
  @keyframes wheelSpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .pedal-crank {
    transform-origin: 150px 300px;
    animation: pedalSpin 0.8s linear infinite;
  }
  @keyframes pedalSpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .pelican {
    transform-origin: 160px 280px;
    animation: pelicanBob 0.6s ease-in-out infinite alternate;
  }
  @keyframes pelicanBob {
    0% { transform: translateY(0) rotate(-2deg); }
    100% { transform: translateY(-6px) rotate(2deg); }
  }

  .wing {
    transform-origin: 130px 260px;
    animation: wingFlap 0.4s ease-in-out infinite alternate;
  }
  @keyframes wingFlap {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(-25deg); }
  }

  .foot {
    transform-origin: 150px 315px;
    animation: footPedal 0.8s ease-in-out infinite;
  }
  @keyframes footPedal {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    50% { transform: rotate(-15deg) translateY(-4px); }
  }

  .beak {
    transform-origin: 195px 245px;
    animation: beakOpen 1.2s ease-in-out infinite;
  }
  @keyframes beakOpen {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(1.15); }
  }

  .ground-line {
    stroke: #1E6B2E;
    stroke-width: 3;
    animation: groundDash 1.5s linear infinite;
  }
  @keyframes groundDash {
    0% { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: -40; }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="title">🚲 鹈鹕骑自行车</div>

  <svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
    <!-- 远山 -->
    <path d="M0,240 Q200,180 400,240 T800,240 V400 H0 Z" fill="#5B8C5A"/>

    <!-- 云朵 -->
    <g class="cloud">
      <circle cx="100" cy="60" r="25"/>
      <circle cx="135" cy="55" r="30"/>
      <circle cx="170" cy="60" r="25"/>
      <circle cx="150" cy="75" r="28"/>
    </g>
    <g class="cloud">
      <circle cx="450" cy="90" r="22"/>
      <circle cx="490" cy="80" r="28"/>
      <circle cx="530" cy="90" r="22"/>
      <circle cx="510" cy="105" r="26"/>
    </g>
    <g class="cloud">
      <circle cx="700" cy="50" r="30"/>
      <circle cx="740" cy="45" r="35"/>
      <circle cx="780" cy="50" r="30"/>
      <circle cx="760" cy="68" r="32"/>
    </g>

    <!-- 地面虚线 -->
    <line class="ground-line" x1="0" y1="250" x2="800" y2="250" stroke-dasharray="20,20"/>

    <!-- 自行车组 -->
    <g class="bike-group">
      <!-- 车架 -->
      <g id="bike-frame">
        <!-- 后叉 -->
        <line x1="80" y1="300" x2="80" y2="340" stroke="#8B4513" stroke-width="6" stroke-linecap="round"/>
        <!-- 座管 -->
        <line x1="130" y1="250" x2="130" y2="300" stroke="#8B4513" stroke-width="6" stroke-linecap="round"/>
        <!-- 上管 -->
        <line x1="130" y1="250" x2="190" y2="260" stroke="#8B4513" stroke-width="6" stroke-linecap="round"/>
        <!-- 下管 -->
        <line x1="130" y1="300" x2="190" y2="295" stroke="#8B4513" stroke-width="6" stroke-linecap="round"/>
        <!-- 链条轮 -->
        <circle cx="150" cy="300" r="18" fill="none" stroke="#5D4037" stroke-width="4"/>
        <circle cx="150" cy="300" r="6" fill="#5D4037"/>
      </g>

      <!-- 车轮组 -->
      <g id="wheels">
        <!-- 后轮 -->
        <g class="wheel" id="rear-wheel">
          <circle cx="80" cy="300" r="40" fill="none" stroke="#333" stroke-width="5"/>
          <circle cx="80" cy="300" r="36" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="2,8"/>
          <line x1="80" y1="260" x2="80" y2="340" stroke="#555" stroke-width="2"/>
          <line x1="40" y1="300" x2="120" y2="300" stroke="#555" stroke-width="2"/>
          <line x1="57" y1="277" x2="103" y2="323" stroke="#555" stroke-width="2"/>
          <line x1="103" y1="277" x2="57" y2="323" stroke="#555" stroke-width="2"/>
          <circle cx="80" cy="300" r="4" fill="#333"/>
        </g>
        <!-- 前轮 -->
        <g class="wheel" id="front-wheel">
          <circle cx="220" cy="300" r="40" fill="none" stroke="#333" stroke-width="5"/>
          <circle cx="220" cy="300" r="36" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="2,8"/>
          <line x1="220" y1="260" x2="220" y2="340" stroke="#555" stroke-width="2"/>
          <line x1="180" y1="300" x2="260" y2="300" stroke="#555" stroke-width="2"/>
          <line x1="197" y1="277" x2="243" y2="323" stroke="#555" stroke-width="2"/>
          <line x1="243" y1="277" x2="197" y2="323" stroke="#555" stroke-width="2"/>
          <circle cx="220" cy="300" r="4" fill="#333"/>
        </g>
      </g>

      <!-- 踏板和曲柄 -->
      <g class="pedal-crank" id="crank">
        <line x1="150" y1="300" x2="150" y2="330" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/>
        <g class="foot" id="left-foot">
          <circle cx="150" cy="330" r="8" fill="#8B4513"/>
          <rect x="142" y="330" width="16" height="8" fill="#4A3728" rx="2"/>
        </g>
      </g>

      <!-- 前叉和车把 -->
      <g id="front-assembly">
        <line x1="190" y1="260" x2="190" y2="300" stroke="#8B4513" stroke-width="6" stroke-linecap="round"/>
        <line x1="190" y1="255" x2="240" y2="250" stroke="#8B4513" stroke-width="5" stroke-linecap="round"/>
        <line x1="240" y1="250" x2="250" y2="240" stroke="#8B4513" stroke-width="5" stroke-linecap="round"/>
        <circle cx="245" y1="245" cy="245" r="6" fill="#333"/>
      </g>
    </g>

    <!-- 鹈鹕组 -->
    <g class="pelican" id="pelican">
      <!-- 身体 -->
      <ellipse cx="160" cy="270" rx="45" ry="28" fill="#F5F5F5"/>
      <ellipse cx="150" cy="265" rx="35" ry="22" fill="#FFFFFF"/>

      <!-- 翅膀 -->
      <path class="wing" d="M120,260 Q100,250 110,280 Q125,270 135,260" fill="none" stroke="#D4D4D4" stroke-width="8" stroke-linecap="round"/>

      <!-- 头部 -->
      <circle cx="190" cy="245" r="18" fill="#F5F5F5"/>
      <circle cx="185" cy="240" r="14" fill="#FFFFFF"/>

      <!-- 大喙 -->
      <path class="beak" d="M195,245 L225,248 L220,258 L200,255 Z" fill="#FFA500" stroke="#E69500" stroke-width="2"/>
      <!-- 喙下部 -->
      <path d="M195,255 L215,258 L210,268 L200,265 Z" fill="#FFB74D" stroke="#E69500" stroke-width="2"/>

      <!-- 眼睛 -->
      <circle cx="188" cy="242" r="3" fill="#000"/>
      <circle cx="189" cy="241" r="1" fill="#FFF"/>

      <!-- 脖子 -->
      <path d="M165,255 Q175,250 180,248" fill="none" stroke="#F5F5F5" stroke-width="14" stroke-linecap="round"/>

      <!-- 脚 -->
      <g class="foot" id="right-foot">
        <line x1="160" y1="295" x2="160" y2="315" stroke="#FFA500" stroke-width="5" stroke-linecap="round"/>
        <line x1="155" y1="315" x2="165" y2="315" stroke="#FFA500" stroke-width="4" stroke-linecap="round"/>
      </g>

      <!-- 尾巴 -->
      <path d="M115,270 Q100,280 110,300" fill="none" stroke="#D4D4D4" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- 运动速度线 -->
    <g id="speed-lines">
      <line x1="600" y1="240" x2="640" y2="240" stroke="#fff" stroke-width="2" opacity="0.6">
        <animate attributeName="x1" values="600;700" dur="0.1s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="640;740" dur="0.1s" repeatCount="indefinite"/>
      </line>
      <line x1="620" y1="280" x2="660" y2="280" stroke="#fff" stroke-width="2" opacity="0.6">
        <animate attributeName="x1" values="620;720" dur="0.1s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="660;760" dur="0.1s" repeatCount="indefinite"/>
      </line>
    </g>
  </svg>
</div>

</body>
</html>
