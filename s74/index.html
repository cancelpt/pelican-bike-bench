<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b1020;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", "PingFang SC", sans-serif;
  }
  h1 {
    color: #ffe8a3;
    font-weight: 600;
    letter-spacing: 2px;
    margin: 0 0 12px;
  }
  .stage {
    width: min(92vw, 820px);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <h1>🚲 骑自行车的鹈鹕</h1>
  <div class="stage">
    <svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8ad1ff"/>
          <stop offset="1" stop-color="#dff4ff"/>
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5a6473"/>
          <stop offset="1" stop-color="#3a4250"/>
        </linearGradient>
        <radialGradient id="sun" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#fff6c8"/>
          <stop offset="1" stop-color="#ffd54a"/>
        </radialGradient>

        <!-- 一只轮子：所有几何以 (0,0) 为中心，方便通过 translate 复用 -->
        <g id="wheelArt">
          <circle r="66" fill="#1c2230" stroke="#e9eef5" stroke-width="6"/>
          <circle r="58" fill="none" stroke="#cfd8e3" stroke-width="2"/>
          <g stroke="#e9eef5" stroke-width="3">
            <line x1="0" y1="0" x2="0"   y2="-58"/>
            <line x1="0" y1="0" x2="41"  y2="-41"/>
            <line x1="0" y1="0" x2="58"  y2="0"/>
            <line x1="0" y1="0" x2="41"  y2="41"/>
            <line x1="0" y1="0" x2="0"   y2="58"/>
            <line x1="0" y1="0" x2="-41" y2="41"/>
            <line x1="0" y1="0" x2="-58" y2="0"/>
            <line x1="0" y1="0" x2="-41" y2="-41"/>
          </g>
          <circle r="9" fill="#ffd54a" stroke="#1c2230" stroke-width="3"/>
        </g>
      </defs>

      <!-- 背景 -->
      <rect x="0" y="0" width="800" height="520" fill="url(#sky)"/>
      <circle cx="120" cy="90" r="46" fill="url(#sun)"/>

      <!-- 云朵（向左缓慢飘动） -->
      <g fill="#ffffff" opacity="0.9">
        <g>
          <animateTransform attributeName="transform" type="translate"
            values="820 0; -220 0" dur="18s" repeatCount="indefinite"/>
          <ellipse cx="0" cy="120" rx="46" ry="26"/>
          <ellipse cx="40" cy="110" rx="38" ry="24"/>
          <ellipse cx="-38" cy="112" rx="34" ry="22"/>
        </g>
        <g opacity="0.8">
          <animateTransform attributeName="transform" type="translate"
            values="820 0; -260 0" dur="26s" repeatCount="indefinite"/>
          <ellipse cx="0" cy="200" rx="40" ry="22"/>
          <ellipse cx="36" cy="192" rx="30" ry="20"/>
          <ellipse cx="-32" cy="194" rx="28" ry="18"/>
        </g>
      </g>

      <!-- 路面 -->
      <rect x="0" y="430" width="800" height="90" fill="url(#road)"/>
      <line x1="0" y1="430" x2="800" y2="430" stroke="#2b313c" stroke-width="4"/>
      <!-- 路面标记（向左滚动制造前进感） -->
      <line x1="0" y1="470" x2="800" y2="470" stroke="#ffd54a" stroke-width="6"
            stroke-dasharray="60 60">
        <animate attributeName="stroke-dashoffset" from="0" to="-120"
                 dur="0.6s" repeatCount="indefinite"/>
      </line>

      <!-- 自行车（车架不旋转） -->
      <g stroke="#e63946" stroke-width="9" stroke-linecap="round" fill="none">
        <!-- 后上叉、下管、座管、前叉 -->
        <path d="M260,400 L375,330"/>          <!-- 后上叉到座 -->
        <path d="M260,400 L410,400"/>          <!-- 后下叉到中轴 -->
        <path d="M410,400 L375,330"/>          <!-- 座管 -->
        <path d="M410,400 L520,300"/>          <!-- 下管到车把 -->
        <path d="M560,400 L520,300"/>          <!-- 前叉 -->
        <path d="M520,300 L495,318"/>          <!-- 车把 -->
      </g>
      <!-- 车座 -->
      <ellipse cx="372" cy="328" rx="26" ry="9" fill="#2b2b2b"/>
      <!-- 车把握把 -->
      <circle cx="495" cy="318" r="6" fill="#2b2b2b"/>

      <!-- 曲柄 + 踏板（绕中轴 410,400 旋转） -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="0 410 400" to="360 410 400" dur="1.5s" repeatCount="indefinite"/>
        <line x1="410" y1="362" x2="410" y2="438" stroke="#9aa3b0" stroke-width="7" stroke-linecap="round"/>
        <rect x="396" y="356" width="28" height="9" rx="3" fill="#2b2b2b"/>
        <rect x="396" y="435" width="28" height="9" rx="3" fill="#2b2b2b"/>
      </g>

      <!-- 两个轮子（绕各自中心旋转） -->
      <g transform="translate(260,400)">
        <use href="#wheelArt">
          <animateTransform attributeName="transform" type="rotate"
            from="0 0 0" to="360 0 0" dur="1.5s" repeatCount="indefinite"/>
        </use>
      </g>
      <g transform="translate(560,400)">
        <use href="#wheelArt">
          <animateTransform attributeName="transform" type="rotate"
            from="0 0 0" to="360 0 0" dur="1.5s" repeatCount="indefinite"/>
        </use>
      </g>

      <!-- 鹈鹕（整体轻微上下颠簸） -->
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 0 -5; 0 0" dur="0.75s" repeatCount="indefinite"/>

        <!-- 后腿（相位 A） -->
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="16 360 330; -16 360 330; 16 360 330" dur="1.5s" repeatCount="indefinite"/>
          <line x1="362" y1="330" x2="405" y2="405" stroke="#ff9f1c" stroke-width="11" stroke-linecap="round"/>
          <ellipse cx="408" cy="408" rx="14" ry="7" fill="#ff9f1c"/>
        </g>
        <!-- 前腿（相位 B，反相） -->
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="-16 392 332; 16 392 332; -16 392 332" dur="1.5s" begin="-0.75s" repeatCount="indefinite"/>
          <line x1="392" y1="332" x2="420" y2="410" stroke="#f0870a" stroke-width="11" stroke-linecap="round"/>
          <ellipse cx="423" cy="413" rx="14" ry="7" fill="#f0870a"/>
        </g>

        <!-- 身体 -->
        <ellipse cx="370" cy="285" rx="74" ry="58" fill="#fdfdfd" stroke="#d7dde6" stroke-width="3"/>
        <!-- 尾羽 -->
        <path d="M300,300 L255,318 L300,322 Z" fill="#eef1f6" stroke="#d7dde6" stroke-width="2"/>
        <!-- 翅膀（伸向车把） -->
        <path d="M348,268 Q420,250 470,290 Q430,300 392,300 Q360,295 348,268 Z"
              fill="#eef1f6" stroke="#d7dde6" stroke-width="3"/>
        <!-- 手臂搭车把 -->
        <path d="M392,292 Q455,295 492,316" fill="none" stroke="#ff9f1c" stroke-width="9" stroke-linecap="round"/>

        <!-- 头部（轻微点头） -->
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="-3 430 235; 3 430 235; -3 430 235" dur="0.75s" repeatCount="indefinite"/>
          <!-- 脖子 -->
          <path d="M392,250 Q418,225 440,218 L432,250 Z" fill="#fdfdfd" stroke="#d7dde6" stroke-width="2"/>
          <!-- 头 -->
          <circle cx="436" cy="205" r="27" fill="#fdfdfd" stroke="#d7dde6" stroke-width="3"/>
          <!-- 上喙 -->
          <path d="M455,198 L590,236 L456,216 Z" fill="#ffb703" stroke="#e08a00" stroke-width="2"/>
          <!-- 喉囊 -->
          <path d="M456,216 C500,292 575,270 590,238 L456,216 Z"
                fill="#ffd166" stroke="#e0a800" stroke-width="2"/>
          <!-- 眼睛 -->
          <circle cx="444" cy="198" r="5" fill="#1c2230"/>
          <circle cx="446" cy="196" r="1.6" fill="#ffffff"/>
        </g>
      </g>
    </svg>
  </div>
</body>
</html>
