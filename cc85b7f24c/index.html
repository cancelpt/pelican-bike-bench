<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>海边骑行 · Pelican on a Bicycle</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 12%, rgba(129, 190, 178, 0.3), transparent 46%),
        linear-gradient(160deg, #163c3b 0%, #0b2526 100%);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .poster {
      position: relative;
      width: min(96vw, 1380px);
      width: min(96vw, 1380px, calc(96svh * 1.5));
      overflow: hidden;
      border-radius: clamp(12px, 1.8vw, 26px);
      background: #f4c8a1;
      box-shadow:
        inset 0 3px 0 rgba(255, 255, 255, 0.16),
        0 40px 90px rgba(0, 0, 0, 0.46),
        0 10px 30px rgba(0, 0, 0, 0.24);
      line-height: 0;
    }

    .poster::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      box-shadow:
        inset 0 0 0 1px rgba(62, 49, 43, 0.09),
        inset 0 0 80px rgba(71, 38, 20, 0.08);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .cloud {
      animation: cloud-drift linear infinite;
      will-change: transform;
    }

    .cloud--one {
      animation-duration: 122s;
      animation-delay: -87s;
    }

    .cloud--two {
      animation-duration: 92s;
      animation-delay: -38s;
    }

    .cloud--three {
      animation-duration: 148s;
      animation-delay: -72s;
    }

    @keyframes cloud-drift {
      to {
        transform: translateX(-1850px);
      }
    }

    .wave {
      animation: wave-flow var(--flow, 9s) linear infinite;
      animation-delay: var(--delay, 0s);
    }

    @keyframes wave-flow {
      to {
        stroke-dashoffset: -160;
      }
    }

    .boat {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: boat-bob 6.8s ease-in-out infinite;
    }

    @keyframes boat-bob {
      0%,
      100% {
        transform: translateY(0) rotate(-0.6deg);
      }
      50% {
        transform: translateY(-5px) rotate(0.8deg);
      }
    }

    .speed-line {
      animation: zip 3s linear infinite;
    }

    .speed-line:nth-child(2) {
      animation-duration: 4.1s;
      animation-delay: -1.8s;
    }

    .speed-line:nth-child(3) {
      animation-duration: 2.5s;
      animation-delay: -0.7s;
    }

    @keyframes zip {
      to {
        stroke-dashoffset: -190;
      }
    }

    .rider-bob {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: rider-bob 2.5s ease-in-out infinite;
    }

    @keyframes rider-bob {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-2px);
      }
    }

    .pelican-head {
      transform-box: fill-box;
      transform-origin: 18% 88%;
      animation: head-nod 3.7s ease-in-out infinite;
    }

    @keyframes head-nod {
      0%,
      100% {
        transform: translateY(0) rotate(-0.35deg);
      }
      50% {
        transform: translateY(-1.2px) rotate(0.6deg);
      }
    }

    .pouch {
      transform-box: fill-box;
      transform-origin: 12% 9%;
      animation: pouch-wobble 2.4s ease-in-out infinite;
    }

    @keyframes pouch-wobble {
      0%,
      100% {
        transform: rotate(0deg) scaleY(1);
      }
      38% {
        transform: rotate(0.9deg) scaleY(1.018);
      }
      68% {
        transform: rotate(-0.55deg) scaleY(0.992);
      }
    }

    .scarf-tails {
      transform-box: fill-box;
      transform-origin: 100% 24%;
      animation: scarf-flutter 2.05s ease-in-out infinite;
    }

    @keyframes scarf-flutter {
      0%,
      100% {
        transform: rotate(-1.4deg) translateY(0);
      }
      38% {
        transform: rotate(3.2deg) translateY(-1px);
      }
      72% {
        transform: rotate(-0.4deg) translateY(1px);
      }
    }

    .tail-feathers {
      transform-box: fill-box;
      transform-origin: 100% 50%;
      animation: tail-sway 2.8s ease-in-out infinite;
    }

    @keyframes tail-sway {
      0%,
      100% {
        transform: rotate(-1.2deg);
      }
      50% {
        transform: rotate(1.9deg);
      }
    }

    .bell-ring {
      animation: bell-ring 5.2s ease-out infinite;
    }

    @keyframes bell-ring {
      0%,
      82%,
      100% {
        opacity: 0;
      }
      86% {
        opacity: 0.9;
      }
      93% {
        opacity: 0.16;
      }
    }

    .chain {
      animation: chain-move 0.62s linear infinite;
    }

    @keyframes chain-move {
      to {
        stroke-dashoffset: -22;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cloud,
      .wave,
      .boat,
      .speed-line,
      .rider-bob,
      .pelican-head,
      .pouch,
      .scarf-tails,
      .tail-feathers,
      .bell-ring,
      .chain {
        animation: none !important;
      }
    }
  </style>
</head>

  <script>
    (() => {
      const BB = { x: 615, y: 545 };
      const CRANK_RADIUS = 43;
      const rearSpin = document.getElementById("rearSpin");
      const frontSpin = document.getElementById("frontSpin");

      const near = {
        hip: { x: 597, y: 374 },
        lengths: [104, 120],
        outline: document.getElementById("nearLegOutline"),
        fill: document.getElementById("nearLegFill"),
        knee: document.getElementById("nearKnee"),
        pedal: document.getElementById("nearPedal"),
        foot: document.getElementById("nearFoot"),
        crankOutline: document.getElementById("nearCrankOutline"),
        crankFill: document.getElementById("nearCrankFill")
      };

      const far = {
        hip: { x: 586, y: 372 },
        lengths: [104, 120],
        outline: document.getElementById("farLegOutline"),
        fill: document.getElementById("farLegFill"),
        knee: document.getElementById("farKnee"),
        pedal: document.getElementById("farPedal"),
        foot: document.getElementById("farFoot"),
        crankOutline: document.getElementById("farCrankOutline"),
        crankFill: document.getElementById("farCrankFill")
      };

      function solveKnee(hip, ankle, upper, lower) {
        const dx = ankle.x - hip.x;
        const dy = ankle.y - hip.y;
        const rawDistance = Math.hypot(dx, dy);
        const distance = Math.min(rawDistance, upper + lower - 0.01);
        const ux = dx / rawDistance;
        const uy = dy / rawDistance;
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const height = Math.sqrt(Math.max(0, upper * upper - along * along));
        const baseX = hip.x + ux * along;
        const baseY = hip.y + uy * along;
        const optionA = { x: baseX - uy * height, y: baseY + ux * height };
        const optionB = { x: baseX + uy * height, y: baseY - ux * height };
        return optionA.x > optionB.x ? optionA : optionB;
      }

      function positionLeg(leg, angle) {
        const pedalX = BB.x + Math.cos(angle) * CRANK_RADIUS;
        const pedalY = BB.y + Math.sin(angle) * CRANK_RADIUS;
        const ankle = { x: pedalX + 1, y: pedalY - 3 };
        const knee = solveKnee(leg.hip, ankle, leg.lengths[0], leg.lengths[1]);
        const path = [
          "M", leg.hip.x, leg.hip.y,
          "L", knee.x.toFixed(2), knee.y.toFixed(2),
          "L", ankle.x.toFixed(2), ankle.y.toFixed(2)
        ].join(" ");
        const crank = [
          "M", BB.x, BB.y,
          "L", pedalX.toFixed(2), pedalY.toFixed(2)
        ].join(" ");

        leg.outline.setAttribute("d", path);
        leg.fill.setAttribute("d", path);
        leg.knee.setAttribute("cx", knee.x.toFixed(2));
        leg.knee.setAttribute("cy", knee.y.toFixed(2));
        leg.pedal.setAttribute("transform", `translate(${pedalX.toFixed(2)} ${pedalY.toFixed(2)})`);
        leg.foot.setAttribute("transform", `translate(${pedalX.toFixed(2)} ${pedalY.toFixed(2)})`);
        leg.crankOutline.setAttribute("d", crank);
        leg.crankFill.setAttribute("d", crank);
      }

      function render(t) {
        const pedalAngle = t * 2.4;
        positionLeg(near, pedalAngle);
        positionLeg(far, pedalAngle + Math.PI);

        const wheelAngle = (t * 300) % 360;
        rearSpin.setAttribute("transform", `rotate(${wheelAngle.toFixed(2)})`);
        frontSpin.setAttribute("transform", `rotate(${wheelAngle.toFixed(2)})`);
      }

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (reduceMotion) {
        render(0.48);
      } else {
        const start = performance.now();
        function frame(now) {
          render((now - start) / 1000);
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }
    })();
  </script>
