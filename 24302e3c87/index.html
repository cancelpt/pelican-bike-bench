<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>鹈鹕骑行日</title>
  <style>
    :root{--ink:#17313a;--paper:#fffdf8;--line:#d6e3df;--teal:#287d7c;--coral:#e36e52;--yellow:#f2c14e}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#f0f6f4;color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Microsoft YaHei",system-ui,sans-serif}
    body{display:grid;place-items:center;min-height:100svh}
    .page{width:min(1180px,100%);padding:28px;display:flex;flex-direction:column;gap:20px}
    .top{display:flex;align-items:end;justify-content:space-between;gap:20px;z-index:2}
    h1{font-size:40px;line-height:1.2;margin:0;letter-spacing:0;font-weight:900;color:#18424a}
    .sub{margin:9px 0 0;font-size:13px;letter-spacing:0;color:#527076}
    .controls{display:flex;align-items:center;gap:10px;padding:8px 0}
    button{width:40px;height:40px;border:1px solid #c5d9d3;border-radius:8px;background:#fff;color:var(--ink);font:inherit;cursor:pointer;display:grid;place-items:center;transition:.15s transform,.15s background}
    button:hover{transform:translateY(-2px);background:#eef8f3} button:active{transform:translateY(0)}
    button svg{width:17px;height:17px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .range{display:flex;align-items:center;gap:7px;font-size:11px;color:#628086;margin-left:2px}.range input{width:108px;accent-color:var(--teal)}
    button:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:4px}
    .frame{position:relative;aspect-ratio:1100/620;overflow:hidden;border-radius:8px;background:#d9eef0}
    svg{display:block;width:100%;height:100%}
    .float{animation:float 3.8s ease-in-out infinite}.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
    .cloud{animation:drift 25s linear infinite}.cloud.c2{animation-duration:34s;animation-delay:-13s}.cloud.c3{animation-duration:42s;animation-delay:-27s}
    .wheel{animation:spin 1.08s linear infinite}
    .roadmark{animation:road 1.5s linear infinite}
    .wing{transform-box:fill-box;transform-origin:28% 12%;animation:wing 1.08s ease-in-out infinite}.tail{transform-box:fill-box;transform-origin:100% 60%;animation:tail 1.08s ease-in-out infinite}
    .paused *{animation-play-state:paused!important}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}} @keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.08)}}
    @keyframes drift{from{transform:translateX(-110px)}to{transform:translateX(1100px)}} @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pedal{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(34deg)}} @keyframes wing{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-9deg)}} @keyframes tail{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg)}}
    @keyframes road{from{transform:translateX(0)}to{transform:translateX(-150px)}}
    .caption{display:flex;justify-content:space-between;color:#6c7d79;font-size:11px;letter-spacing:0;padding:0 4px}.badge{color:#287d7c;font-weight:800}
    @media(max-width:650px){.page{padding:20px 16px;gap:16px}.top{align-items:start;flex-direction:column;gap:8px}h1{font-size:30px}.controls{align-self:stretch;justify-content:flex-end}.frame{aspect-ratio:650/620}.range input{width:110px}.caption{font-size:10px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="top"><div><h1>鹈鹕骑行日</h1><p class="sub">海风正好，沿着堤岸慢慢晃</p></div>
      <div class="controls" role="group" aria-label="动画控制">
        <button id="toggle" aria-label="暂停动画" title="暂停动画" aria-pressed="false"><svg id="toggleIcon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></button>
        <div class="range"><span>慢</span><input id="speed" type="range" min="0.55" max="1.7" value="1" step="0.05" aria-label="动画速度"><span>快</span></div>
      </div>
    </header>
    <section class="frame" id="stage" aria-label="鹈鹕骑自行车的 SVG 动画">
      <svg id="scene" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
        <title id="title">一只鹈鹕在海边骑自行车</title><desc id="desc">扁平插画风格的鹈鹕骑着橙色自行车沿海岸前进，车轮、腿、翅膀和云朵持续运动。</desc>
        <defs>
          <g id="bicycle-wheel">
            <circle r="60" fill="#d9eef0" stroke="#17313a" stroke-width="9"/>
            <circle r="51" fill="none" stroke="#fffdf8" stroke-width="3"/>
            <g class="wheel" stroke="#779c9b" stroke-width="2">
              <path d="M-50 0H50M0-50V50M-35-35 35 35M-35 35 35-35M-46-19 46 19M-19-46 19 46M-46 19 46-19M-19 46 19-46"/>
              <path d="M-18-47-9-49" stroke="#f2c14e" stroke-width="5" stroke-linecap="round"/>
            </g>
            <circle r="7" fill="#17313a"/>
          </g>
        </defs>
        <rect width="1100" height="620" fill="#d9eef0"/><circle cx="880" cy="112" r="52" fill="#f2c14e"/>
        <g class="cloud c1" fill="#fffdf8"><path d="M80 135c0-21 18-38 40-38 8 0 15 2 22 6 8-23 29-38 54-38 30 0 55 23 58 52 5-2 10-3 16-3 22 0 40 18 40 40H80z" opacity=".92"/></g>
        <g class="cloud c2" fill="#fffdf8" opacity=".8"><path d="M665 178c0-18 15-32 33-32 7 0 13 2 18 5 7-19 24-31 44-31 25 0 45 19 47 43 5-2 9-2 14-2 18 0 33 14 33 31H665z"/></g>
        <g class="cloud c3" fill="#fffdf8" opacity=".6"><path d="M390 72c0-14 12-26 26-26 5 0 10 1 14 4 6-15 19-25 36-25 20 0 36 15 38 34 4-1 7-2 11-2 15 0 27 12 27 26H390z"/></g>
        <path d="M0 300 Q150 252 300 302 T600 296 T900 300 T1200 276 V420H0z" fill="#8cc4bd"/><path d="M0 350 Q170 320 350 352 T700 346 T1100 350 V460H0z" fill="#5aa19e"/>
        <path d="M0 405 Q180 377 360 408 T720 402 T1100 396 V620H0z" fill="#e6c98b"/>
        <path d="M0 467 Q170 440 350 468 T700 462 T1100 458" fill="none" stroke="#f9e7b5" stroke-width="7" opacity=".75"/>
        <path d="M0 500 Q170 486 350 500 T700 496 T1100 489 V620H0z" fill="#315b59"/>
        <g fill="#f2d18e" class="roadmark"><path d="M0 570h72v7H0zM150 570h72v7h-72zM300 570h72v7h-72zM450 570h72v7h-72zM600 570h72v7h-72zM750 570h72v7h-72zM900 570h72v7h-72zM1050 570h72v7h-72zM1200 570h72v7h-72z"/></g>
        <ellipse cx="548" cy="545" rx="218" ry="12" fill="#17313a" opacity=".18"/>
        <g transform="translate(565 302)">
          <use href="#bicycle-wheel" x="-142" y="180"/>
          <use href="#bicycle-wheel" x="112" y="180"/>
          <path id="backLeg" d="M-28 68Q50 126-30 180" fill="none" stroke="#c98130" stroke-width="12" stroke-linecap="round"/>
          <path id="backFoot" d="M-36 180h20" fill="none" stroke="#c98130" stroke-width="10" stroke-linecap="round"/>
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M-142 180-50 110-6 180h-136M-50 110 83 96-6 180M83 96l29 84" stroke="#17313a" stroke-width="13"/>
            <path d="M-142 180-50 110-6 180h-136M-50 110 83 96-6 180M83 96l29 84" stroke="#e36e52" stroke-width="7"/>
            <path d="M-50 110-59 87M83 96 74 60q-3-12 10-13h20" stroke="#17313a" stroke-width="7"/>
            <path d="M-83 84h46M98 46h13" stroke="#17313a" stroke-width="12"/>
            <path d="M-146 171-6 163a17 17 0 0 1 0 34l-140-8a9 9 0 0 1 0-18Z" stroke="#17313a" stroke-width="3"/>
          </g>
          <circle cx="-6" cy="180" r="18" fill="#f0f6f4" stroke="#17313a" stroke-width="5"/>
          <path id="crank" d="M-30 180h48" fill="none" stroke="#17313a" stroke-width="6" stroke-linecap="round"/>
          <path id="frontLeg" d="M-28 68Q74 126 18 180" fill="none" stroke="#e9a13b" stroke-width="12" stroke-linecap="round"/>
          <path id="frontFoot" d="M12 180h20" fill="none" stroke="#e9a13b" stroke-width="10" stroke-linecap="round"/>
          <path id="frontPedal" d="M8 186h26" fill="none" stroke="#17313a" stroke-width="5" stroke-linecap="round"/>
          <g class="tail"><path d="M-67 88l-75 31 59-56z" fill="#d8e4df" stroke="#17313a" stroke-width="6" stroke-linejoin="round"/></g>
          <path d="M-87 18c-12-50 20-84 74-73 45 9 65 55 47 102-12 31-46 50-76 42-27-8-38-39-45-71z" fill="#eef3ed" stroke="#17313a" stroke-width="7"/>
          <path d="M-74 1C-34-16-4 33 94 48c12 2 17 15 2 19L-13 59C-64 74-91 43-74 1Z" fill="#c1d6cf" stroke="#17313a" stroke-width="6" stroke-linejoin="round"/>
          <path d="M-51 19Q-33 40 9 46M-48 34Q-34 48-18 48" fill="none" stroke="#8aa69f" stroke-width="4" stroke-linecap="round"/>
          <path d="M-13-58c-4-48 13-83 48-89 29-5 56 14 58 42 1 20-12 40-30 49l33 21c9 6 5 20-7 21L6-16c-10 1-17-6-19-16z" fill="#f2f3e8" stroke="#17313a" stroke-width="7"/>
          <path d="M78-72 236-41 109-5C81 4 52-17 60-46Z" fill="#ef9e50" stroke="#17313a" stroke-width="6" stroke-linejoin="round"/>
          <path d="M80-75 238-44Q247-39 232-36L67-42Z" fill="#f2c14e" stroke="#17313a" stroke-width="6" stroke-linejoin="round"/>
          <path d="M79-31q4 23 28 17" fill="none" stroke="#ffd0a0" stroke-width="5" stroke-linecap="round"/>
          <ellipse class="blink" cx="64" cy="-89" rx="6" ry="8" fill="#17313a"/>
          <path d="M20-127Q49-169 80-133L91-126 23-118Z" fill="#e36e52" stroke="#17313a" stroke-width="5" stroke-linejoin="round"/>
          <path d="M28-122 38-104" stroke="#17313a" stroke-width="4" stroke-linecap="round"/>
          <g class="tail"><path d="M-12-55-64-58-52-43-75-32-13-37Z" fill="#287d7c" stroke="#17313a" stroke-width="4" stroke-linejoin="round"/></g>
          <path d="M-20 28q-10 15-2 30" fill="none" stroke="#8aa69f" stroke-width="5" stroke-linecap="round"/>
        </g>
        <g fill="#17313a" opacity=".72"><path d="M188 427l7-28 7 28zM210 430l9-37 9 37zM972 424l8-34 8 34zM1002 424l6-27 7 27z"/><circle cx="197" cy="397" r="7"/><circle cx="1010" cy="397" r="7"/></g>
      </svg>
    </section>
    <footer class="caption"><span>COASTAL LOOP / 海岸环线</span><span class="badge">今日宜兜风</span></footer>
  </main>
  <script>
    const stage=document.getElementById('stage');
    const toggle=document.getElementById('toggle');
    const icon=document.getElementById('toggleIcon');
    const speed=document.getElementById('speed');
    const scene=document.getElementById('scene');
    const frontLeg=document.getElementById('frontLeg');
    const backLeg=document.getElementById('backLeg');
    const frontFoot=document.getElementById('frontFoot');
    const backFoot=document.getElementById('backFoot');
    const crank=document.getElementById('crank');
    const frontPedal=document.getElementById('frontPedal');
    const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
    const narrowScreen=matchMedia('(max-width: 650px)');
    let paused=reducedMotion.matches;
    let phase=0;
    let lastTime=null;
    let frameId=null;
    function fitScene(){scene.setAttribute('viewBox',narrowScreen.matches?'240 0 650 620':'0 0 1100 620');}
    fitScene();
    narrowScreen.addEventListener('change',fitScene);
    // Solve a two-segment leg so each foot stays attached to its pedal.
    function poseLeg(path,foot,angle){
      const x=-6+24*Math.cos(angle),y=180+24*Math.sin(angle);
      const hx=-28,hy=68,dx=x-hx,dy=y-hy,d=Math.hypot(dx,dy);
      const upper=77,lower=73;
      const along=(upper*upper-lower*lower+d*d)/(2*d);
      const bend=Math.sqrt(Math.max(0,upper*upper-along*along));
      const kx=hx+along*dx/d+bend*dy/d,ky=hy+along*dy/d-bend*dx/d;
      path.setAttribute('d',`M${hx} ${hy}L${kx} ${ky} ${x} ${y}`);
      foot.setAttribute('d',`M${x-7} ${y}h20`);
      return {x,y};
    }
    function drawRider(){
      const front=poseLeg(frontLeg,frontFoot,phase);
      const back=poseLeg(backLeg,backFoot,phase+Math.PI);
      crank.setAttribute('d',`M${back.x} ${back.y}L${front.x} ${front.y}`);
      frontPedal.setAttribute('d',`M${front.x-9} ${front.y+6}h27`);
    }
    function tick(time){
      if(lastTime!==null)phase=(phase+Math.min(time-lastTime,50)*Number(speed.value)*Math.PI*2/1080)%(Math.PI*2);
      lastTime=time;
      drawRider();
      frameId=requestAnimationFrame(tick);
    }
    function syncPlayback(){
      cancelAnimationFrame(frameId);
      lastTime=null;
      const stopped=paused||document.hidden;
      stage.classList.toggle('paused',stopped);
      toggle.setAttribute('aria-label',paused?'播放动画':'暂停动画');
      toggle.setAttribute('title',paused?'播放动画':'暂停动画');
      toggle.setAttribute('aria-pressed',String(paused));
      icon.innerHTML=paused?'<polygon points="6 3 20 12 6 21 6 3"/>':'<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
      if(!stopped)frameId=requestAnimationFrame(tick);
    }
    toggle.addEventListener('click',()=>{paused=!paused;syncPlayback();});
    document.addEventListener('visibilitychange',syncPlayback);
    reducedMotion.addEventListener('change',event=>{paused=event.matches;syncPlayback();});
    speed.addEventListener('input',()=>{
      // Playback rate preserves the position of every CSS animation.
      stage.getAnimations({subtree:true}).forEach(animation=>animation.updatePlaybackRate(Number(speed.value)));
    });
    drawRider();
    syncPlayback();
  </script>
</body>
</html>
