<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;
    background:radial-gradient(circle at 50% 0%,#233343,#0d141b 70%);
    display:flex;align-items:center;justify-content:center;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  .stage{
    width:min(96vw,1000px);
    border-radius:18px;overflow:hidden;
    box-shadow:0 30px 60px rgba(0,0,0,.5);
  }
  svg{display:block;width:100%;height:auto}

  .cloud{animation:drift 34s linear infinite}
  .cloud.c2{animation-duration:48s;animation-delay:-14s}
  .cloud.c3{animation-duration:26s;animation-delay:-21s}
  @keyframes drift{from{transform:translateX(950px)}to{transform:translateX(-320px)}}

  .dash{animation:dashmove .5s linear infinite}
  @keyframes dashmove{to{stroke-dashoffset:-120}}

  .whoosh line{animation:whoosh .85s linear infinite}
  .whoosh line:nth-child(2){animation-delay:.28s}
  .whoosh line:nth-child(3){animation-delay:.56s}
  @keyframes whoosh{
    0%{opacity:0;transform:translateX(70px)}
    25%{opacity:.8}
    100%{opacity:0;transform:translateX(-200px)}
  }

  .sun{transform-box:fill-box;transform-origin:center;animation:pulse 4s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.07)}}
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车的二维动画">
  <defs>
    <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fc4ef"/>
      <stop offset="1" stop-color="#e9f8ff"/>
    </linearGradient>
    <radialGradient id="g-sun">
      <stop offset="0" stop-color="#fff8cf"/>
      <stop offset="0.45" stop-color="#ffe066" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffe066" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dde6f0"/>
    </linearGradient>
    <linearGradient id="g-wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8fc"/>
      <stop offset="1" stop-color="#c9d6e4"/>
    </linearGradient>
    <linearGradient id="g-beak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd071"/>
      <stop offset="1" stop-color="#ef8f27"/>
    </linearGradient>
    <radialGradient id="g-pouch" cx="0.3" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#ffe3a3"/>
      <stop offset="1" stop-color="#f2a13c"/>
    </radialGradient>
    <linearGradient id="g-road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a616c"/>
      <stop offset="1" stop-color="#414751"/>
    </linearGradient>
  </defs>

  <!-- ================= 天空 ================= -->
  <rect width="900" height="500" fill="url(#g-sky)"/>
  <circle class="sun" cx="782" cy="82" r="86" fill="url(#g-sun)"/>
  <circle class="sun" cx="782" cy="82" r="34" fill="#ffe066"/>

  <g fill="#ffffff" opacity=".9">
    <g class="cloud c1" opacity=".95">
      <ellipse cx="0" cy="0" rx="44" ry="24"/>
      <ellipse cx="36" cy="8" rx="34" ry="18"/>
      <ellipse cx="-32" cy="9" rx="28" ry="15"/>
      <rect x="-46" y="4" width="88" height="18" rx="9"/>
    </g>
    <g class="cloud c2" opacity=".75">
      <ellipse cx="0" cy="0" rx="34" ry="18"/>
      <ellipse cx="28" cy="6" rx="26" ry="14"/>
      <ellipse cx="-24" cy="7" rx="22" ry="12"/>
      <rect x="-36" y="3" width="70" height="14" rx="7"/>
    </g>
    <g class="cloud c3" opacity=".6">
      <ellipse cx="0" cy="0" rx="26" ry="14"/>
      <ellipse cx="22" cy="5" rx="20" ry="11"/>
      <ellipse cx="-18" cy="6" rx="17" ry="9"/>
      <rect x="-28" y="2" width="54" height="11" rx="5"/>
    </g>
  </g>

  <text x="34" y="56" font-size="24" font-weight="700" fill="#1d6a96" opacity=".55" letter-spacing="2">PELICAN CYCLING</text>
  <text x="34" y="80" font-size="14" fill="#1d6a96" opacity=".4" letter-spacing="4">鹈 鹕 骑 行 中</text>

  <!-- ================= 远景 ================= -->
  <ellipse cx="170" cy="412" rx="240" ry="78" fill="#8ec37e"/>
  <ellipse cx="640" cy="418" rx="290" ry="70" fill="#7fb56f"/>
  <g fill="#5f9d54">
    <ellipse cx="80" cy="400" rx="46" ry="18"/>
    <ellipse cx="150" cy="402" rx="30" ry="13"/>
    <ellipse cx="828" cy="400" rx="52" ry="20"/>
  </g>

  <!-- ================= 地面 / 公路 ================= -->
  <rect x="0" y="400" width="900" height="100" fill="#79ac67"/>
  <rect x="0" y="400" width="900" height="48" fill="url(#g-road)"/>
  <rect x="0" y="400" width="900" height="4" fill="#6b7480"/>
  <rect x="0" y="446" width="900" height="5" fill="#353a43"/>
  <line class="dash" x1="-140" y1="424" x2="1040" y2="424"
        stroke="#f6d76e" stroke-width="5" stroke-dasharray="70 50" stroke-linecap="round"/>

  <!-- 速度线 -->
  <g class="whoosh" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".8">
    <line x1="120" y1="238" x2="196" y2="238"/>
    <line x1="88"  y1="286" x2="182" y2="286"/>
    <line x1="132" y1="332" x2="200" y2="332"/>
  </g>

  <!-- 车下阴影 -->
  <ellipse cx="392" cy="401" rx="182" ry="9" fill="#000000" opacity=".22"/>

  <!-- ================= 鹈鹕 + 自行车 ================= -->
  <g id="rig">

    <!-- 远侧腿 / 脚 -->
    <polyline id="legFar" fill="none" stroke="#d98824" stroke-width="9"
              stroke-linecap="round" stroke-linejoin="round" points="330,272 380,310 390,355"/>
    <path id="footFar" fill="#d98824" transform="translate(390 355)"
          d="M-12,-4 Q-16,-4 -16,0 L-16,4 Q-16,7 -11,7 L15,7 Q20,7 20,3 L20,0 Q20,-4 15,-4 Z"/>
    <line id="armFar" x1="390" y1="355" x2="390" y2="381" stroke="#b8482c" stroke-width="7" stroke-linecap="round"/>
    <g id="pedalFar"><rect x="-13" y="-4" width="26" height="8" rx="3" fill="#25292f"/></g>

    <!-- 车轮 -->
    <g>
      <g id="wheelRear">
        <circle cx="255" cy="355" r="45" fill="none" stroke="#2b3038" stroke-width="9"/>
        <circle cx="255" cy="355" r="38" fill="none" stroke="#dfe5ec" stroke-width="3"/>
        <g id="spokesRear"></g>
        <circle cx="255" cy="355" r="5" fill="#2b3038"/>
      </g>
      <g id="wheelFront">
        <circle cx="525" cy="355" r="45" fill="none" stroke="#2b3038" stroke-width="9"/>
        <circle cx="525" cy="355" r="38" fill="none" stroke="#dfe5ec" stroke-width="3"/>
        <g id="spokesFront"></g>
        <circle cx="525" cy="355" r="5" fill="#2b3038"/>
      </g>
    </g>

    <!-- 链条 -->
    <g stroke="#8d949e" stroke-width="3" fill="none">
      <path d="M255,348 L390,337"/>
      <path d="M255,362 L390,373"/>
    </g>
    <circle cx="255" cy="355" r="8" fill="none" stroke="#8d949e" stroke-width="4"/>

    <!-- 车架 -->
    <g stroke="#e94f37" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M255,355 L390,355"/>
      <path d="M390,355 L336,274"/>
      <path d="M255,355 L336,274"/>
      <path d="M390,355 L478,270"/>
      <path d="M336,274 L478,270"/>
      <path d="M478,270 L525,355"/>
      <path d="M478,270 L486,254"/>
    </g>
    <!-- 车把 -->
    <path d="M468,248 Q486,242 502,251" stroke="#2b3038" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="503" cy="252" r="7" fill="#1d2126"/>
    <!-- 坐垫 -->
    <path d="M310,272 Q334,258 358,268 Q348,280 330,281 Q314,281 310,272 Z" fill="#25292f"/>

    <!-- 牙盘 -->
    <g id="chainring">
      <circle cx="390" cy="355" r="19" fill="none" stroke="#c3cad3" stroke-width="4"/>
      <circle cx="390" cy="355" r="19" fill="none" stroke="#aeb6c0" stroke-width="8"
              stroke-dasharray="3 6"/>
      <circle cx="390" cy="355" r="6" fill="#2b3038"/>
    </g>
    <line id="armNear" x1="390" y1="355" x2="390" y2="329" stroke="#ff6b4a" stroke-width="8" stroke-linecap="round"/>
    <g id="pedalNear"><rect x="-14" y="-4.5" width="28" height="9" rx="3" fill="#1d2126"/></g>

    <!-- ================= 鹈鹕 ================= -->
    <g id="pelican">
      <!-- 尾羽 -->
      <path d="M244,244 Q202,236 188,254 Q214,272 246,268 Z" fill="#cfdae6"/>
      <!-- 身体 -->
      <ellipse cx="300" cy="245" rx="64" ry="46" fill="url(#g-body)"/>
      <!-- 后侧翅膀（扇动） -->
      <g id="wingBack">
        <path d="M296,230 Q346,214 364,242 Q338,272 296,258 Q276,250 296,230 Z"
              fill="url(#g-wing)" stroke="#b9c8d8" stroke-width="2"/>
        <path d="M300,244 Q330,236 352,250" stroke="#b9c8d8" stroke-width="2" fill="none"/>
      </g>
      <!-- 围巾 -->
      <g id="scarf">
        <path d="M348,198 Q308,200 274,224 Q300,222 316,214 Q334,206 350,214 Z" fill="#e94f37"/>
        <path d="M348,198 Q330,204 320,216 Q336,220 352,214 Z" fill="#c93c26"/>
      </g>
      <!-- 脖子 + 头 -->
      <g id="neckHead">
        <path d="M336,224 C368,216 378,182 400,152" stroke="url(#g-body)" stroke-width="30"
              fill="none" stroke-linecap="round"/>
        <ellipse cx="410" cy="146" rx="26" ry="24" fill="url(#g-body)"/>
        <!-- 头盔 -->
        <path d="M385,145 A26,28 0 0 1 435,146 Q410,155 385,145 Z" fill="#2f8fd8"/>
        <path d="M398,126 Q410,120 422,127" stroke="#1c6da8" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M411,128 L411,140 M404,131 L404,142 M419,131 L419,142" stroke="#1c6da8" stroke-width="3" stroke-linecap="round"/>
        <path d="M392,150 Q400,158 404,162" stroke="#1c6da8" stroke-width="3" fill="none" stroke-linecap="round"/>
        <!-- 眼睛 -->
        <circle cx="419" cy="150" r="7" fill="#ffffff" stroke="#dfe6ee" stroke-width="1"/>
        <circle cx="420.5" cy="150" r="3.4" fill="#1d2126"/>
        <circle cx="418.4" cy="148.2" r="1.3" fill="#ffffff"/>
        <!-- 上喙 -->
        <path d="M428,132 Q480,133 521,147 Q525,150 518,153 L430,152 Z" fill="url(#g-beak)"/>
        <!-- 喉袋 -->
        <path d="M429,148 Q452,204 497,193 Q523,177 518,152 L430,150 Z" fill="url(#g-pouch)"/>
        <path d="M436,158 Q462,192 494,183" stroke="#e08a2e" stroke-width="2.5" fill="none" opacity=".7"/>
        <path d="M428,132 Q436,126 444,131" stroke="#e08a2e" stroke-width="0" fill="none"/>
        <!-- 袋里的小鱼 -->
        <g transform="rotate(-18 498 166)">
          <ellipse cx="498" cy="166" rx="17" ry="8" fill="#9fd6ea"/>
          <path d="M481,166 L468,157 L468,175 Z" fill="#7cc0da"/>
          <circle cx="505" cy="163" r="1.8" fill="#1d2126"/>
        </g>
      </g>
      <!-- 前侧翅膀：搭在车把上 -->
      <path d="M330,236 C392,224 452,238 494,250" stroke="url(#g-body)" stroke-width="21"
            fill="none" stroke-linecap="round"/>
      <path d="M340,232 C396,222 450,234 490,246" stroke="#e7eef6" stroke-width="6"
            fill="none" stroke-linecap="round" opacity=".8"/>
      <circle cx="497" cy="251" r="10" fill="#f3f7fb" stroke="#cbd7e4" stroke-width="2"/>
    </g>

    <!-- 近侧腿 / 脚 -->
    <polyline id="legNear" fill="none" stroke="#f0a03c" stroke-width="10"
              stroke-linecap="round" stroke-linejoin="round" points="330,272 380,300 390,329"/>
    <path id="footNear" fill="#f0a03c" transform="translate(390 329)"
          d="M-12,-4 Q-16,-4 -16,0 L-16,4 Q-16,7 -11,7 L15,7 Q20,7 20,3 L20,0 Q20,-4 15,-4 Z"/>
  </g>
</svg>
</div>

<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var $ = function (id) { return document.getElementById(id); };

  var HIP   = { x: 330, y: 272 };
  var CRANK = { x: 390, y: 355 };
  var RC = 26;      // 曲柄半径
  var L1 = 62;      // 大腿
  var L2 = 72;      // 小腿
  var WHEEL_R = 45;

  var rig = $("rig"), pelican = $("pelican");
  var wheelRear = $("wheelRear"), wheelFront = $("wheelFront"), chainring = $("chainring");
  var armNear = $("armNear"), armFar = $("armFar");
  var pedalNear = $("pedalNear"), pedalFar = $("pedalFar");
  var legNear = $("legNear"), legFar = $("legFar");
  var footNear = $("footNear"), footFar = $("footFar");
  var wingBack = $("wingBack"), scarf = $("scarf"), neckHead = $("neckHead");

  // 生成辐条
  function spokes(id, cx, cy, r) {
    var g = $(id);
    for (var i = 0; i < 12; i++) {
      var a = (i * Math.PI * 2) / 12;
      var ln = document.createElementNS(NS, "line");
      ln.setAttribute("x1", cx);
      ln.setAttribute("y1", cy);
      ln.setAttribute("x2", (cx + Math.cos(a) * r).toFixed(2));
      ln.setAttribute("y2", (cy + Math.sin(a) * r).toFixed(2));
      ln.setAttribute("stroke", i % 3 === 0 ? "#b9c2cc" : "#d3dae2");
      ln.setAttribute("stroke-width", "2");
      g.appendChild(ln);
    }
  }
  spokes("spokesRear", 255, 355, 38);
  spokes("spokesFront", 525, 355, 38);

  // 两节腿的反向运动学求膝盖位置
  function knee(hx, hy, fx, fy) {
    var dx = fx - hx, dy = fy - hy;
    var d = Math.hypot(dx, dy);
    d = Math.min(L1 + L2 - 0.01, Math.max(Math.abs(L1 - L2) + 0.01, d));
    var base = Math.atan2(dy, dx);
    var cosA = (d * d + L1 * L1 - L2 * L2) / (2 * d * L1);
    var a = Math.acos(Math.min(1, Math.max(-1, cosA)));
    var ang = base - a;
    return { x: hx + Math.cos(ang) * L1, y: hy + Math.sin(ang) * L1 };
  }

  function setLeg(leg, foot, hx, hy, f) {
    var k = knee(hx, hy, f.x, f.y);
    leg.setAttribute("points", hx + "," + hy + " " + k.x.toFixed(1) + "," + k.y.toFixed(1) + " " + f.x.toFixed(1) + "," + f.y.toFixed(1));
    foot.setAttribute("transform", "translate(" + f.x.toFixed(1) + " " + f.y.toFixed(1) + ")");
  }

  function tick(now) {
    var t = now / 1000;
    var th = t * 3.6;                       // 曲柄角
    var deg = (th * 180) / Math.PI;

    // 车轮 / 牙盘转动
    var wheelDeg = deg * 1.7;
    wheelRear.setAttribute("transform", "rotate(" + wheelDeg.toFixed(2) + " 255 355)");
    wheelFront.setAttribute("transform", "rotate(" + wheelDeg.toFixed(2) + " 525 355)");
    chainring.setAttribute("transform", "rotate(" + deg.toFixed(2) + " 390 355)");

    // 两个脚踏位置
    var p1 = { x: CRANK.x + Math.cos(th) * RC, y: CRANK.y + Math.sin(th) * RC };
    var p2 = { x: CRANK.x - Math.cos(th) * RC, y: CRANK.y - Math.sin(th) * RC };

    armNear.setAttribute("x2", p1.x.toFixed(1));
    armNear.setAttribute("y2", p1.y.toFixed(1));
    armFar.setAttribute("x2", p2.x.toFixed(1));
    armFar.setAttribute("y2", p2.y.toFixed(1));
    pedalNear.setAttribute("transform", "translate(" + p1.x.toFixed(1) + " " + p1.y.toFixed(1) + ")");
    pedalFar.setAttribute("transform", "translate(" + p2.x.toFixed(1) + " " + p2.y.toFixed(1) + ")");

    // 车身 / 身体的上下起伏
    var bob = Math.sin(th * 2) * 2;
    var pb  = Math.sin(th * 2 + 0.7) * 2.6;
    rig.setAttribute("transform", "translate(0 " + bob.toFixed(2) + ")");
    pelican.setAttribute("transform", "translate(0 " + pb.toFixed(2) + ")");

    // 蹬踏的腿
    setLeg(legFar, footFar, HIP.x, HIP.y + pb, { x: p2.x, y: p2.y - 3 });
    setLeg(legNear, footNear, HIP.x, HIP.y + pb, { x: p1.x, y: p1.y - 3 });

    // 翅膀扇动 / 围巾飘动 / 头部轻摆
    wingBack.setAttribute("transform", "rotate(" + (-6 + Math.sin(t * 5) * 7).toFixed(2) + " 300 232)");
    scarf.setAttribute("transform", "rotate(" + (-6 + Math.sin(t * 5 + 1) * 9).toFixed(2) + " 348 202)");
    neckHead.setAttribute("transform", "rotate(" + (Math.sin(t * 5 + 1.6) * 2.2).toFixed(2) + " 336 226)");

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
