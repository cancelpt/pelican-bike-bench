<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: linear-gradient(160deg, #0e1c2e 0%, #16283d 60%, #1b3049 100%);
    font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  figure.stage { width: min(96vw, 980px); margin: 24px; }
  svg {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 18px;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
  }
  figcaption {
    text-align: center;
    margin-top: 14px;
    color: #8fa8bf;
    font-size: 14px;
    letter-spacing: .12em;
  }
</style>
</head>
<body>
<figure class="stage">
<svg viewBox="0 0 900 560" role="img" aria-label="一只鹈鹕骑着自行车的2D动画">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">

    <path id="birdShape" d="M -9 0 Q -4 -6 0 -1 Q 4 -6 9 0"

    <g id="hillBackTile">
      <path fill="#b9dfa0" d="M 0 490 L 0 432 Q 70 386 150 424 Q 225 458 310 440 Q 400 368 495 416 Q 560 448 640 442 Q 720 384 800 424 Q 850 448 900 438 L 900 490 Z"/>
    </g>

      <path fill="#93cf6d" d="M 0 490 L 0 452 Q 90 408 190 446 Q 260 472 340 462 Q 430 402 520 444 Q 590 476 660 468 Q 750 420 830 452 Q 870 468 900 462 L 900 490 Z"/>
      <rect x="147" y="414" width="6" height="28" fill="#8a5f3f"/>
      <circle cx="150" cy="404" r="15" fill="#57a84e"/>
      <circle cx="138" cy="411" r="11" fill="#57a84e"/>
      <circle cx="163" cy="411" r="11" fill="#57a84e"/>
      <rect x="657" y="444" width="6" height="26" fill="#8a5f3f"/>
      <circle cx="660" cy="435" r="14" fill="#57a84e"/>
      <circle cx="648" cy="441" r="10" fill="#57a84e"/>
      <circle cx="672" cy="441" r="10" fill="#57a84e"/>
    </g>
  </defs>

  <!-- ===== 天空 ===== -->
  <rect x="0" y="0" width="900" height="560" fill="url(#skyGrad)"/>
  <circle cx="108" cy="92" r="46" fill="#ffd75e" opacity="0.25"/>
  <circle cx="108" cy="92" r="33" fill="#ffd75e"/>

    <line x1="166" y1="92" x2="154" y2="92"/>
    <line x1="149" y1="133" x2="140" y2="124"/>
    <line x1="108" y1="150" x2="108" y2="138"/>
    <line x1="67"  y1="133" x2="76"  y2="124"/>
    <line x1="50"  y1="92"  x2="62"  y2="92"/>
    <line x1="67"  y1="51"  x2="76"  y2="60"/>
  </g>
  <g opacity="0.55">
    <g id="bird0"><use href="#birdShape"/></g>
    <g id="bird1"><use href="#birdShape" transform="scale(0.75)"/></g>
  </g>
  <g opacity="0.92">
    <g id="cloud0"><use href="#cloudShape"/></g>
    <g id="cloud1"><use href="#cloudShape"/></g>
    <g id="cloud2"><use href="#cloudShape"/></g>

  <!-- ===== 远山（视差滚动） ===== -->
  <g id="hillsBack"><use href="#hillBackTile"/><use href="#hillBackTile" x="900"/></g>
  <g id="hillsFront"><use href="#hillFrontTile"/><use href="#hillFrontTile" x="900"/></g>

  <!-- ===== 路肩草地与公路 ===== -->

  <!-- 车轮投影 -->

  <ellipse cx="560" cy="487" rx="60" ry="6.5" fill="#464d5c" opacity="0.7"/>

  <!-- 速度线与尾尘 -->

    <line x1="415" y1="442" x2="370" y2="328" stroke-width="7"/>
    <line x1="372" y1="332" x2="514" y2="334" stroke-width="7"/>
    <line x1="415" y1="442" x2="524" y2="362" stroke-width="8"/>
    <line x1="512" y1="328" x2="528" y2="366" stroke-width="9"/>

  <circle cx="415" cy="442" r="18" fill="none" stroke="#454a54" stroke-width="4.5"/>

  <circle cx="560" cy="430" r="43"   fill="none" stroke="#ccd3dc" stroke-width="4"/>
  <g id="spokesF" stroke="#b9c1cc" stroke-width="2.5"></g>
  <circle cx="560" cy="430" r="7" fill="#d9dde4" stroke="#454a54" stroke-width="2"/>
  <path d="M 528 366 Q 548 398 560 430" fill="none" stroke="#d94b4a" stroke-width="6" stroke-linecap="round"/>
  <!-- 车把 -->

  <path d="M 506 302 Q 496 290 470 296" fill="none" stroke="#46505e" stroke-width="6" stroke-linecap="round"/>
  <circle cx="470" cy="296" r="5.5" fill="#7a5237"/>
  <!-- 前车筐 + 小鱼 -->

  <polygon points="538,302 594,302 588,336 544,336" fill="#c99a5f"/>
  <g id="fish">
    <ellipse cx="568" cy="292" rx="15" ry="7.5" fill="#62b8cf" stroke="#3d7f92" stroke-width="2"
             transform="rotate(-20 568 292)"/>
    <path d="M 556 300 L 544 292 L 548 304 Z" fill="#62b8cf" stroke="#3d7f92" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="576" cy="287" r="1.9" fill="#20333a"/>
    <circle cx="576.8" cy="286.2" r="0.7" fill="#fff"/>
  </g>
  <g>
    <polygon points="539,306 593,306 588,336 544,336" fill="#d9a869" stroke="#8a6534" stroke-width="2"/>
    <g stroke="#b98d52" stroke-width="1.6">
      <line x1="541" y1="316" x2="591" y2="316"/>
      <line x1="542" y1="326" x2="590" y2="326"/>
      <line x1="553" y1="306" x2="555" y2="336"/>
      <line x1="566" y1="306" x2="566" y2="336"/>
      <line x1="579" y1="306" x2="577" y2="336"/>
    </g>
    <line x1="537" y1="305" x2="595" y2="305" stroke="#8a6534" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- 座管 + 车座 -->
  <line x1="371" y1="330" x2="368" y2="316" stroke="#46505e" stroke-width="5"/>
  <path d="M 336 318 Q 334 309 344 307 L 382 304 Q 393 305 391 312 Q 381 319 359 320 Q 344 321 336 318 Z"
        fill="#7a5237" stroke="#4a3527" stroke-width="1.5"/>

  <!-- ===== 鹈鹕（身体组：上下起伏 + 轻微俯仰） ===== -->
  <g id="rider">
    <path d="M 356 262 Q 398 246 444 272" fill="none" stroke="#e7ddc8" stroke-width="11" stroke-linecap="round"/>
    <path d="M 320 262 C 304 250 288 244 270 245 Q 265 253 274 259 Q 259 260 256 269 Q 262 277 273 276 Q 265 284 273 290 Q 288 294 302 287 C 310 283 316 278 318 274 Z"
          fill="#f3ecdc" stroke="#4a423a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 306 268 C 330 230 358 212 398 212 C 432 212 456 236 460 266 C 462 294 438 318 404 323 C 374 328 350 324 342 313 C 320 298 306 284 306 268 Z"
          fill="#fbf6ea" stroke="#4a423a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 342 313 C 360 322 390 326 404 323 C 438 318 460 296 460 268 C 456 292 432 310 402 315 C 376 320 354 318 342 313 Z"
          fill="#ece2cd" opacity="0.8"/>
    <path d="M 414 240 C 448 232 466 208 466 176 C 466 152 472 138 487 127"
          fill="none" stroke="#4a423a" stroke-width="25" stroke-linecap="round"/>
    <path d="M 414 240 C 448 232 466 208 466 176 C 466 152 472 138 487 127"

    <!-- 喉囊（会跟着颠簸微微抖动） -->

          fill="#ff9a76" stroke="#4a423a" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- 上喙 -->
    <path d="M 494 112 C 540 114 582 132 616 154 L 612 162 C 578 146 534 130 493 128 Z"
          fill="#ffb347" stroke="#4a423a" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="486" cy="124" r="17" fill="#fbf6ea" stroke="#4a423a" stroke-width="2.5"/>
    <path d="M 480 111 Q 462 100 465 85 Q 472 91 474 99 Q 473 87 480 80 Q 484 91 482 101 Q 483 106 480 111 Z"
          fill="#f3ecdc" stroke="#4a423a" stroke-width="2" stroke-linejoin="round"/>
    <ellipse id="eye" cx="492" cy="117" rx="3" ry="3" fill="#332c26"/>
    <circle id="glint" cx="493.2" cy="115.8" r="1" fill="#ffffff"/>
  </g>

  <!-- ===== 近侧曲柄 / 踏板 / 腿 / 翅膀（在车架前面） ===== -->
  <path id="nCrank" stroke="#3d424c" stroke-width="7" stroke-linecap="round" fill="none" d=""/>
  <circle cx="415" cy="442" r="4.5" fill="#22262c"/>
  <g id="nPedal"><rect x="-13" y="-3.5" width="26" height="7" rx="3" fill="#3d424c" stroke="#22262c" stroke-width="1.5"/></g>
  <path id="nThighU" stroke="#4a423a" stroke-width="20"  stroke-linecap="round" fill="none" d=""/>
  <path id="nThighO" stroke="#fbf6ea" stroke-width="15"  stroke-linecap="round" fill="none" d=""/>
  <path id="nShinU"  stroke="#4a423a" stroke-width="13"  stroke-linecap="round" fill="none" d=""/>
  <path id="nShinO"  stroke="#f2a65a" stroke-width="8.5" stroke-linecap="round" fill="none" d=""/>
  <g id="nFoot">
    <path fill="#f2a65a" stroke="#4a423a" stroke-width="2.4" stroke-linejoin="round"
          d="M -3 -3 C 3 -7 11 -8 17 -6 L 30 0 Q 35 4 30 8 L 22 7 Q 25 11 20 13 L 13 11 Q 14 15 9 15 L 0 11 Q -6 4 -3 -3 Z"/>
  </g>
  <path id="wingU" stroke="#4a423a" stroke-width="20"   stroke-linecap="round" fill="none" d=""/>
  <path id="wingO" stroke="#f3ecdc" stroke-width="14.5" stroke-linecap="round" fill="none" d=""/>
  <path d="M 456 288 Q 466 279 478 285 Q 487 291 484 300 Q 481 307 474 305 Q 477 298 471 296 Q 473 306 464 306 Q 457 305 459 297 Q 452 293 456 288 Z"
        fill="#f3ecdc" stroke="#4a423a" stroke-width="2.2" stroke-linejoin="round"/>
</svg>
<figcaption>鹈鹕骑自行车 · Pelican on a Bicycle</figcaption>
</figure>

<script>
(function () {
  'use strict';
  var TAU = Math.PI * 2;
  var CADENCE = 2.4;              // 曲柄转一圈的秒数
  var GEAR = 2.0;                 // 轮 / 曲柄传动比
  var WHEEL_R = 55;
  var SPEED = TAU * WHEEL_R / (CADENCE / GEAR);   // 地面滚动速度 px/s ≈ 288
  var BB = [415, 442];            // 五通（曲柄轴心）
  var CRANK = 34;
  var HIP = [368, 310];
  var L1 = 96, L2 = 88;           // 大腿 / 小腿长度
  var GRIP = [470, 296];
  var SHOULDER = [404, 240];
  var CHAIN_SPEED = (TAU / CADENCE) * 18;         // 链条线速度

  function $(id) { return document.getElementById(id); }
  var svgns = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, parent) {
    var e = document.createElementNS(svgns, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  }

  /* ---- 生成辐条 ---- */
  function buildSpokes(group, cx, cy) {
    for (var i = 0; i < 8; i++) {
      var a = i * TAU / 8;
      el('line', {
        x1: cx, y1: cy,
        x2: cx + 42 * Math.cos(a), y2: cy + 42 * Math.sin(a)
      }, group);
    }
    el('circle', { cx: cx + 37, cy: cy, r: 3, fill: '#e8b64c', stroke: 'none' }, group);
  }
  buildSpokes($('spokesR'), 300, 430);
  buildSpokes($('spokesF'), 560, 430);

  /* ---- 生成路面虚线（1300px 覆盖，周期 100） ---- */
  var dashG = $('dashes');
  for (var d = -1; d < 12; d++) {
    el('rect', { x: d * 100, y: 518, width: 46, height: 7, rx: 3.5 }, dashG);
  }

  /* ---- 生成路肩草丛与小花（两块 900px 的拼板） ---- */
  var tuftG = $('tufts');
  var tuftXs = [40, 260, 380, 560, 640, 830];
  var flowerXs = [130, 430, 720];
  for (var k = 0; k < 3; k++) {
    var ox = k * 900;
    tuftXs.forEach(function (x) {
      el('path', {
        d: 'M ' + (ox + x) + ' 486 q -4 -10 -7 -13 M ' + (ox + x) + ' 486 q 0 -12 1 -15 M ' + (ox + x) + ' 486 q 5 -9 8 -12',
        stroke: '#57a83f', 'stroke-width': 2.5, 'stroke-linecap': 'round', fill: 'none'
      }, tuftG);
    });
    flowerXs.forEach(function (x) {
      el('line', { x1: ox + x, y1: 486, x2: ox + x, y2: 473, stroke: '#57a83f', 'stroke-width': 2.2 }, tuftG);
      el('circle', { cx: ox + x, cy: 470.5, r: 4.2, fill: '#ff8fb1' }, tuftG);
      el('circle', { cx: ox + x, cy: 470.5, r: 1.8, fill: '#fff6da' }, tuftG);
    });
  }

  /* ---- 引用缓存 ---- */
  var refs = {};
  ['sunRays','bird0','bird1','cloud0','cloud1','cloud2','hillsBack','hillsFront',
   'tufts','dashes','sl0','sl1','sl2','puff0','puff1','puff2',
   'fCrank','fPedal','fThigh','fShin','fFoot',
   'spokesR','spokesF','chainT','chainB',
   'rider','pouch','eye','glint','fish',
   'nCrank','nPedal','nThighU','nThighO','nShinU','nShinO','nFoot',
   'wingU','wingO'].forEach(function (id) { refs[id] = $(id); });

  /* ---- 双骨骼 IK：由髋与脚踝求膝盖位置 ---- */
  function knee(hx, hy, ax, ay) {
    var dx = ax - hx, dy = ay - hy;
    var dist = Math.hypot(dx, dy);
    dist = Math.max(9, Math.min(dist, L1 + L2 - 0.6));
    var a = (L1 * L1 - L2 * L2 + dist * dist) / (2 * dist);
    var h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    var ux = dx / dist, uy = dy / dist;
    return [hx + a * ux + h * uy, hy + a * uy - h * ux];  // 膝盖朝前
  }

  function setLeg(phase, hip, crankEl, pedalEl, thighEls, shinEls, footEl) {
    var px = BB[0] + CRANK * Math.cos(phase);
    var py = BB[1] + CRANK * Math.sin(phase);
    crankEl.setAttribute('d', 'M ' + BB[0] + ' ' + BB[1] + ' L ' + px + ' ' + py);
    pedalEl.setAttribute('transform', 'translate(' + px + ',' + py + ')');
    var ax = px - 2, ay = py - 12;                     // 脚踝略高于踏板
    var kp = knee(hip[0], hip[1], ax, ay);
    var thighD = 'M ' + hip[0] + ' ' + hip[1] + ' L ' + kp[0] + ' ' + kp[1];
    var shinD  = 'M ' + kp[0] + ' ' + kp[1] + ' L ' + ax + ' ' + ay;
    thighEls.forEach(function (e) { e.setAttribute('d', thighD); });
    shinEls.forEach(function (e) { e.setAttribute('d', shinD); });
    var rot = -6 + 10 * Math.sin(phase - 0.7);         // 踝关节摆动
    footEl.setAttribute('transform', 'translate(' + ax + ',' + ay + ') rotate(' + rot + ')');
  }

  var cloudCfg = [
    { y: 70,  s: 1.1,  sp: 22, off: 150 },
    { y: 132, s: 0.8,  sp: 30, off: 560 },
    { y: 44,  s: 0.62, sp: 16, off: 880 }
  ];

  function update(t) {
    var th = TAU * t / CADENCE;                        // 曲柄角
    var wheelDeg = th * GEAR * 180 / Math.PI;

    /* 车轮与链条 */
    refs.spokesR.setAttribute('transform', 'rotate(' + wheelDeg + ' 300 430)');
    refs.spokesF.setAttribute('transform', 'rotate(' + wheelDeg + ' 560 430)');
    var chainOff = -((CHAIN_SPEED * t) % 9);
    refs.chainT.setAttribute('stroke-dashoffset', chainOff);
    refs.chainB.setAttribute('stroke-dashoffset', chainOff);

    /* 场景滚动（近快远慢的视差） */
    refs.dashes.setAttribute('transform', 'translate(' + (-((SPEED * t) % 100)) + ',0)');
    refs.tufts.setAttribute('transform',  'translate(' + (-((SPEED * t) % 900)) + ',0)');
    refs.hillsFront.setAttribute('transform', 'translate(' + (-((55 * t) % 900)) + ',0)');
    refs.hillsBack.setAttribute('transform',  'translate(' + (-((30 * t) % 900)) + ',0)');
    for (var i = 0; i < 3; i++) {
      var c = cloudCfg[i];
      var x = 1000 - ((c.sp * t + c.off) % 1160) - 130;
      refs['cloud' + i].setAttribute('transform', 'translate(' + x + ',' + c.y + ') scale(' + c.s + ')');
    }
    refs.sunRays.setAttribute('transform', 'rotate(' + ((360 * t / 70) % 360) + ' 108 92)');
    for (i = 0; i < 2; i++) {
      var bx = 980 - ((34 * t + i * 300) % 1400);
      var by = 138 + 16 * Math.sin(0.8 * t + i * 2);
      refs['bird' + i].setAttribute('transform', 'translate(' + bx + ',' + by + ')');
    }

    /* 身体起伏 + 俯仰 */
    var bob = 2.2 * Math.sin(2 * th - 0.4);
    var pitch = 0.9 * Math.sin(2 * th - 1.0);
    refs.rider.setAttribute('transform',
      'translate(0,' + bob + ') rotate(' + pitch + ' ' + HIP[0] + ' ' + HIP[1] + ')');
    var hip = [HIP[0], HIP[1] + bob];

    /* 两条腿（远侧相位差 180°） */
    setLeg(th + Math.PI, hip, refs.fCrank, refs.fPedal, [refs.fThigh], [refs.fShin], refs.fFoot);
    setLeg(th, hip, refs.nCrank, refs.nPedal,
      [refs.nThighU, refs.nThighO], [refs.nShinU, refs.nShinO], refs.nFoot);

    /* 翅膀：从（随身体运动的）肩部搭到固定的车把 */
    var rad = pitch * Math.PI / 180;
    var dx = SHOULDER[0] - HIP[0], dy = SHOULDER[1] - HIP[1];
    var sx = HIP[0] + dx * Math.cos(rad) - dy * Math.sin(rad);
    var sy = HIP[1] + dx * Math.sin(rad) + dy * Math.cos(rad) + bob;
    var cxp = (sx + GRIP[0]) / 2 - 4;
    var cyp = (sy + GRIP[1]) / 2 - 18 + 1.5 * Math.sin(2 * th);
    var wd = 'M ' + sx + ' ' + sy + ' Q ' + cxp + ' ' + cyp + ' ' + GRIP[0] + ' ' + GRIP[1];
    refs.wingU.setAttribute('d', wd);
    refs.wingO.setAttribute('d', wd);

    /* 喉囊抖动、眨眼、鱼的摇摆 */
    var ps = 1 + 0.05 * Math.sin(2 * th + 0.6);
    refs.pouch.setAttribute('transform',
      'translate(500,130) scale(1,' + ps + ') translate(-500,-130)');
    var blink = (t % 4.1) < 0.13;
    refs.eye.setAttribute('ry', blink ? 0.5 : 3);
    refs.glint.setAttribute('opacity', blink ? 0 : 1);
    refs.fish.setAttribute('transform', 'rotate(' + (7 * Math.sin(1.3 * t)) + ' 560 300)');

    /* 尾尘与速度线 */
    for (i = 0; i < 3; i++) {
      var life = 1.15;
      var age = (t + i * 0.42) % life;
      var p = refs['puff' + i];
      p.setAttribute('cx', 282 - 68 * age);
      p.setAttribute('cy', 480 - 30 * age);
      p.setAttribute('r', 2.5 + 8 * age);
      p.setAttribute('opacity', Math.max(0, 0.3 * (1 - age / life)));
      refs['sl' + i].setAttribute('opacity',
        0.08 + 0.13 * (0.5 + 0.5 * Math.sin(3.1 * t + i * 2.1)));
    }
  }

  var reduced = window.matchMedia &&
                window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) {
    update(0.65);               // 静止定格一帧
  } else {
    function frame(now) {
      update(now / 1000);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
