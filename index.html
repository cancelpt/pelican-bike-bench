</div>`;

const P3="创建新目录来实现：用 Three.js 制作一个电影级实时渲染风格的三维展示场景，内容是一只写实鹈鹕骑着自行车在海边公路上高速前进。重点突出高精度角色建模、复杂机械细节与高级实时光影效果：鹈鹕需拥有真实可信的长喙、喉囊、羽毛结构和身体比例，骑行动作自然且富有表演性；自行车需具备完整精细的机械结构，包括车架、轮组、链条传动、踏板、刹车和把手细节。材质采用高质量 PBR，羽毛、金属、橡胶、塑料和沥青路面都应体现明显而准确的材质差异。画面设置为室外 cinematic scene，使用 HDRI 天空环境、低角度太阳光、长阴影、轮廓光、地面反射和空气透视，辅以景深、Bloom、Motion Blur、SSAO、体积雾等后处理，构建具有强烈速度感、空间层次感与视觉冲击力的演示效果。";
const copyTxt=async (k,btn)=>{
  const t=k==="p3"?P3:P2;
  try{await navigator.clipboard.writeText(t);}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();}
  if(btn){const o=btn.textContent;btn.textContent="已复制";setTimeout(()=>btn.textContent=o,1200);}
};
const astra3d=()=>`<div class="card mb-3">
  <div class="card-body py-3">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2">
      <div>
        <span class="fw-semibold">3D 鹈鹕 · 逐风海岸</span>
        <span class="time font-monospace ms-2">47分15秒</span>
        <span class="badge text-bg-secondary ms-1">$12</span>
        <button type="button" class="btn btn-sm btn-outline-secondary ms-1" data-copy="p3">复制提示词</button>
      </div>
      <a class="btn btn-sm btn-outline-info flex-shrink-0" href="./3d/" target="_blank">打开 3D</a>
    </div>
    <div class="blurb text-secondary mt-2 mb-0">${esc(P3)}</div>
  </div>
</div>`;
function vis(ms, md){ return open.has(md)||ms.length<=CAP?ms:ms.slice(0,CAP); }
// 公告栏/更新日志：由 data/notice.json 驱动，控制台可编辑（顺序与取舍由作者定）
const RECENT=[{"d": " {b}{m} 在 Codebuddy、Kimi Code（官方API）、OpenCode（Go套餐）上的测试", "model": "kimi-k3.1-pro", "t": "增加"}, {"d": "这种 auto 模型", "model": "big-pickle", "t": "测试大量 OpenCode Go 套餐以及 Free 内含的模型，包括 {b}{m} "}, {"d": "", "model": "deepseek-v4.1-flash-1017", "t": "大量不同渠道和 harness 测试 "}, {"d": "{b}{m} 官方订阅的测试", "model": "minimax-m3.1-flash", "t": "增加 "}], INTRO="**本测试纯属个人自娱自乐，无任何实验科研、厂商打钱、专业榜单的目的和需求。**\n\n模型**发布日期**为厂商**官方口径**（博客/新闻稿/文档所述发布日历日；国模为北京日，其他模型为官方标注日），与 OpenRouter 上架日不一致时**以官方为准**。\n\n与 OR 差异：qwen-3.8-max 官方 08-03（OR 的 0902 为 9 月快照）；seed-2.1-turbo/pro 06-23、seed-code 02-14（OR 8 月才上架）；longcat-2.0 06-30；glm-5.3 08-14；gpt-6-astra 09-03；gpt-5.5 04-23；step-5-preview 官方 09-20（OR 10-08）。";
const recent=()=>RECENT.map(c=>({c, r:D.find(x=>x.model===c.model)})).filter(x=>x.r);
function render(){
  const inFam=D.filter(x=>x.family===fam);
  const mods=[...new Set(inFam.map(x=>x.model))];
  if(model && !mods.includes(model)) model="";
  const shown=model?mods.filter(m=>m===model):mods;
  document.getElementById("rn").innerHTML=recent().map(({c, r:x})=>{
    const n=c;
    // 短标/描述里可以写 {b} 徽标、{m} 模型名，位置自己定；
    // 都没写就按默认 短标 徽标 模型 描述 拼。
    const ic=img(x.family,"ico"), md=`<span class="fw-medium">${esc(x.model)}</span>`;
    const fill=v=>fillNotice(v,{b:ic,m:md});
    const tOK=hasNoticeToken(n.t), dOK=hasNoticeToken(n.d);
    const t=tOK?fill(n.t):(n.t?`<span class="name">${esc(n.t)}</span>`:"");
    const d=dOK?fill(n.d):(n.d?`<span class="text-secondary">${esc(n.d)}</span>`:"");
    const mid=tOK||dOK?"":`${ic}${md}`;      // 占位符没写，徽标和模型名按默认位置补
    return `<button type="button" class="btn btn-sm chip nchip btn-outline-secondary" data-g="${esc(x.family)}" data-m="${esc(x.model)}">${t}${mid}${d}</button>`;
  }).join("");
  // 两段说明文字也是可编辑数据（notice.json 的 intro/orNote），不再焊在模板里。
  // 换行保留：用户写多行就显示多行。
  document.getElementById("intro").innerHTML=mdInline(INTRO||"");
  document.getElementById("f").innerHTML=fams.map(f=>{
    const n=D.filter(x=>x.family===f).length;
    return chip(LAB[f]||f,n,f===fam,`data-f="${esc(f)}"`,f);
  }).join("");
  document.getElementById("g").innerHTML=`<section class="region">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
      <div class="d-flex align-items-center gap-2">${img(fam,"ico-lg")}<h2 class="h5 mb-0">${esc(LAB[fam]||fam)}</h2><span class="badge rounded-pill text-bg-secondary">${inFam.length}次</span></div>
      <div class="d-flex flex-wrap gap-2" id="m">${chip("全部",inFam.length,!model,'data-m=""')}${mods.map(md=>{
        const n=inFam.filter(x=>x.model===md).length;
        return chip(md,n,model===md,`data-m="${esc(md)}"`,null,(inFam.find(x=>x.model===md)||{}).released);
      }).join("")}</div>
    </div>
    ${shown.map(md=>{
      const ms=inFam.filter(x=>x.model===md);
      const vs=vis(ms,md);
      const rest=ms.length-vs.length;
      return `<div class="model-block">
        <div class="d-flex align-items-center gap-2 mb-2">
          <h3 class="h6 mb-0">${esc(md)}</h3>
          ${ms[0]&&ms[0].released?`<span class="text-secondary">${esc(ms[0].released)}</span>`:""}
          <span class="badge rounded-pill text-bg-secondary">${ms.length}次</span>
        </div>
        ${md==="gpt-6-astra"?astra3d():""}
        <div class="grid">${vs.map(card).join("")}</div>
        ${rest?`<button type="button" class="btn btn-sm btn-light w-100 mt-2 more-btn" data-x="${esc(md)}">
          <i class="bi bi-chevron-down me-1"></i>展开其余 ${rest} 次</button>`:""}
        ${open.has(md)&&ms.length>CAP?`<button type="button" class="btn btn-sm btn-light w-100 mt-2 more-btn" data-c="${esc(md)}">
          <i class="bi bi-chevron-up me-1"></i>收起</button>`:""}
      </div>`;
    }).join("")}
  </section>`;
}
document.getElementById("f").onclick=e=>{const b=e.target.closest("button[data-f]");if(!b)return;fam=b.dataset.f;model="";open.clear();render();};
document.body.addEventListener("click",e=>{
  const cp=e.target.closest("[data-copy]");
  if(cp){e.preventDefault();e.stopPropagation();copyTxt(cp.dataset.copy,cp);return;}
  const m=e.target.closest("button[data-m]");
  if(m){const g=m.dataset.g;if(g&&g!==fam){fam=g;open.clear();}model=m.dataset.m;open.clear();render();return;}
  const x=e.target.closest("button[data-x]");
  if(x){open.add(x.dataset.x);render();return;}
  const c=e.target.closest("button[data-c]");
  if(c){open.delete(c.dataset.c);render();}
});
render();
</script></body></html>
