<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹈鹕骑自行车</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
        }
        svg {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <style>
                .wheel {
                    transform-origin: center;
                    animation: rotate 2s linear infinite;
                }
                .pedal-group {
                    transform-origin: center;
                    animation: rotate 2s linear infinite;
                }
                .leg-left {
                    transform-origin: 320px 380px;
                    animation: pedal-left 2s linear infinite;
                }
                .leg-right {
                    transform-origin: 320px 380px;
                    animation: pedal-right 2s linear infinite;
                }
                .beak {
                    transform-origin: 290px 280px;
                    animation: beak-move 3s ease-in-out infinite;
                }
                .wing {
                    transform-origin: 310px 310px;
                    animation: wing-flap 1.5s ease-in-out infinite;
                }
                @keyframes rotate {
                    from { transform: rotate(0deg); }
                    to { transform: rotate(360deg); }
                }
                @keyframes pedal-left {
                    0% { transform: rotate(0deg); }
                    25% { transform: rotate(-30deg); }
                    50% { transform: rotate(0deg); }
                    75% { transform: rotate(30deg); }
                    100% { transform: rotate(0deg); }
                }
                @keyframes pedal-right {
                    0% { transform: rotate(0deg); }
                    25% { transform: rotate(30deg); }
                    50% { transform: rotate(0deg); }
                    75% { transform: rotate(-30deg); }
                    100% { transform: rotate(0deg); }
                }
                @keyframes beak-move {
                    0%, 100% { transform: rotate(0deg); }
                    50% { transform: rotate(5deg); }
                }
                @keyframes wing-flap {
                    0%, 100% { transform: rotate(0deg); }
                    50% { transform: rotate(-15deg); }
                }
            </style>
        </defs>
        
        <rect width="800" height="600" fill="url(#skyGradient)"/>
        
        <line x1="0" y1="500" x2="800" y2="500" stroke="#8B7355" stroke-width="4"/>
        
        <g class="wheel" style="transform-origin: 200px 460px;">
            <circle cx="200" cy="460" r="60" fill="none" stroke="#333" stroke-width="4"/>
            <circle cx="200" cy="460" r="10" fill="#333"/>
            <line x1="200" y1="400" x2="200" y2="520" stroke="#666" stroke-width="2"/>
            <line x1="140" y1="460" x2="260" y2="460" stroke="#666" stroke-width="2"/>
            <line x1="158" y1="418" x2="242" y2="502" stroke="#666" stroke-width="2"/>
            <line x1="242" y1="418" x2="158" y2="502" stroke="#666" stroke-width="2"/>
        </g>
        
        <g class="wheel" style="transform-origin: 440px 460px;">
            <circle cx="440" cy="460" r="60" fill="none" stroke="#333" stroke-width="4"/>
            <circle cx="440" cy="460" r="10" fill="#333"/>
            <line x1="440" y1="400" x2="440" y2="520" stroke="#666" stroke-width="2"/>
            <line x1="380" y1="460" x2="500" y2="460" stroke="#666" stroke-width="2"/>
            <line x1="398" y1="418" x2="482" y2="502" stroke="#666" stroke-width="2"/>
            <line x1="482" y1="418" x2="398" y2="502" stroke="#666" stroke-width="2"/>
        </g>
        
        <g id="bike-frame">
            <line x1="200" y1="460" x2="320" y2="400" stroke="#FF4500" stroke-width="6"/>
            <line x1="320" y1="400" x2="320" y2="350" stroke="#FF4500" stroke-width="6"/>
            <line x1="320" y1="400" x2="440" y2="460" stroke="#FF4500" stroke-width="6"/>
            <line x1="320" y1="350" x2="340" y2="340" stroke="#8B4513" stroke-width="8"/>
            <line x1="440" y1="460" x2="430" y2="350" stroke="#FF4500" stroke-width="6"/>
            <line x1="430" y1="350" x2="450" y2="340" stroke="#333" stroke-width="4"/>
            <line x1="450" y1="340" x2="460" y2="340" stroke="#333" stroke-width="3"/>
            <line x1="450" y1="340" x2="440" y2="340" stroke="#333" stroke-width="3"/>
        </g>
        
        <g class="pedal-group" style="transform-origin: 320px 400px;">
            <line x1="320" y1="400" x2="320" y2="430" stroke="#333" stroke-width="3"/>
            <rect x="310" y="430" width="20" height="5" fill="#666"/>
            <line x1="320" y1="400" x2="320" y2="370" stroke="#333" stroke-width="3"/>
            <rect x="310" y="365" width="20" height="5" fill="#666"/>
        </g>
        
        <ellipse cx="310" cy="310" rx="35" ry="45" fill="#F5F5DC"/>
        
        <path class="wing" d="M 310 310 Q 280 300 270 320 Q 275 340 290 335 Z" fill="#E8E8D0" stroke="#D3D3C0" stroke-width="1"/>
        
        <g class="leg-left">
            <line x1="320" y1="340" x2="320" y2="380" stroke="#FFA500" stroke-width="4"/>
            <ellipse cx="320" cy="385" rx="8" ry="4" fill="#FFA500"/>
        </g>
        
        <g class="leg-right">
            <line x1="320" y1="340" x2="320" y2="380" stroke="#FFA500" stroke-width="4"/>
            <ellipse cx="320" cy="385" rx="8" ry="4" fill="#FFA500"/>
        </g>
        
        <path d="M 290 290 Q 280 260 290 240" fill="none" stroke="#F5F5DC" stroke-width="20" stroke-linecap="round"/>
        
        <circle cx="290" cy="280" r="20" fill="#F5F5DC"/>
        
        <circle cx="290" cy="275" r="12" fill="white"/>
        <circle cx="292" cy="273" r="6" fill="#333"/>
        <circle cx="294" cy="271" r="2" fill="white"/>
        
        <g class="beak">
            <path d="M 290 280 L 340 275 L 340 285 L 290 285 Z" fill="#FFA500"/>
            <path d="M 290 285 L 340 285 L 335 290 L 290 288 Z" fill="#FF8C00"/>
        </g>
        
        <ellipse cx="300" cy="340" rx="25" ry="15" fill="#E8E8D0"/>
        
        <circle cx="200" cy="460" r="5" fill="#FF0000"/>
        <circle cx="440" cy="460" r="5" fill="#FF0000"/>
    </svg>
</body>
</html>
