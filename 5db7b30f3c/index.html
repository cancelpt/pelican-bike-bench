<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #dff1e9;
  }
  body {
    display: grid;
    place-items: center;
  }
  #scene {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  .cloud {
    animation: drift 42s linear infinite;
    will-change: transform;
  }
  .cloud.c2 { animation-duration: 58s; animation-delay: -19s; }
  .cloud.c3 { animation-duration: 50s; animation-delay: -33s; }
  @keyframes drift {
    from { transform: translateX(-260px); }
    to   { transform: translateX(1320px); }
  }
  .road-lines {
    animation: roadMove 0.85s linear infinite;
  }
  @keyframes roadMove {
    from { transform: translateX(0); }
    to   { transform: translateX(-160px); }
  }
  .speed-line {
    animation: speedPulse 1.15s ease-in-out infinite;
  }
  .speed-line:nth-child(2) { animation-delay: 0.18s; }
  .speed-line:nth-child(3) { animation-delay: 0.36s; }
  @keyframes speedPulse {
    0%, 100% { opacity: 0.15; transform: translateX(0); }
    45%      { opacity: 0.65; transform: translateX(-14px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .cloud, .road-lines, .speed-line { animation: none; }
  }
</style>
</head>

<script>
(() => {
  const rearSpin = document.getElementById('rearSpin');
  const frontSpin = document.getElementById('frontSpin');
  const crankArms = document.getElementById('crankArms');
  const pelicanBody = document.getElementById('pelicanBody');

  const nearLegPath = document.getElementById('nearLegPath');
  const nearKnee = document.getElementById('nearKnee');
  const nearPedal = document.getElementById('nearPedal');
  const nearFoot = document.getElementById('nearFoot');

  const farLegPath = document.getElementById('farLegPath');
  const farKnee = document.getElementById('farKnee');
  const farPedal = document.getElementById('farPedal');
  const farFoot = document.getElementById('farFoot');

  const crank = { x: 560, y: 470, radius: 36 };
  const nearHip = { x: 552, y: 344 };
  const farHip = { x: 532, y: 340 };
  const upperLeg = 92;
  const lowerLeg = 90;

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const start = performance.now();

  function solveKnee(hip, foot) {
    const dx = foot.x - hip.x;
    const dy = foot.y - hip.y;
    const distance = Math.hypot(dx, dy) || 1;
    const base = Math.atan2(dy, dx);
    const cosine = Math.max(-1, Math.min(1,
      (upperLeg * upperLeg + distance * distance - lowerLeg * lowerLeg) /
      (2 * upperLeg * distance)
    ));
    const offset = Math.acos(cosine);
    const angle = base - offset;
    return {
      x: hip.x + Math.cos(angle) * upperLeg,
      y: hip.y + Math.sin(angle) * upperLeg
    };
  }

  function setLeg(path, kneeDot, hip, foot) {
    const knee = solveKnee(hip, foot);
    path.setAttribute('d',
      `M ${hip.x.toFixed(1)} ${hip.y.toFixed(1)} ` +
      `L ${knee.x.toFixed(1)} ${knee.y.toFixed(1)} ` +
      `L ${foot.x.toFixed(1)} ${foot.y.toFixed(1)}`
    );
    kneeDot.setAttribute('cx', knee.x.toFixed(1));
    kneeDot.setAttribute('cy', knee.y.toFixed(1));
  }

  function setPedal(pedalGroup, footGroup, point) {
    pedalGroup.setAttribute('transform', `translate(${point.x.toFixed(1)} ${point.y.toFixed(1)})`);
    footGroup.setAttribute('transform', `translate(${point.x.toFixed(1)} ${(point.y - 7).toFixed(1)})`);
  }

  function render(now) {
    const elapsed = reducedMotion ? 0 : (now - start) / 1000;
    const wheelAngle = (elapsed * 340) % 360;
    const crankAngle = (elapsed * 250) % 360;
    const crankRad = crankAngle * Math.PI / 180;

    rearSpin.setAttribute('transform', `rotate(${wheelAngle.toFixed(2)})`);
    frontSpin.setAttribute('transform', `rotate(${wheelAngle.toFixed(2)})`);
    crankArms.setAttribute('transform', `rotate(${crankAngle.toFixed(2)})`);

    const bob = Math.sin(crankRad * 2) * 2.4;
    pelicanBody.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);

    const nearPoint = {
      x: crank.x + Math.cos(crankRad) * crank.radius,
      y: crank.y + Math.sin(crankRad) * crank.radius
    };
    const farPoint = {
      x: crank.x + Math.cos(crankRad + Math.PI) * crank.radius,
      y: crank.y + Math.sin(crankRad + Math.PI) * crank.radius
    };

    setPedal(nearPedal, nearFoot, nearPoint);
    setPedal(farPedal, farFoot, farPoint);

    const nearFootTarget = { x: nearPoint.x, y: nearPoint.y - 7 };
    const farFootTarget = { x: farPoint.x, y: farPoint.y - 7 };
    const nearHipNow = { x: nearHip.x, y: nearHip.y + bob };
    const farHipNow = { x: farHip.x, y: farHip.y + bob };

    setLeg(nearLegPath, nearKnee, nearHipNow, nearFootTarget);
    setLeg(farLegPath, farKnee, farHipNow, farFootTarget);

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
})();
</script>
