<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹈鹕骑自行车动画</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(180deg, #87ceeb 0%, #87ceeb 60%, #90ee90 60%, #228b22 100%);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .container {
            width: 800px;
            height: 500px;
        }
        svg { width: 100%; height: 100%; }

        /* 自行车移动动画 */
        .bike-group {
            animation: ride 12s linear infinite;
        }
        @keyframes ride {
            0% { transform: translateX(-200px); }
            100% { transform: translateX(900px); }
        }

        /* 车轮旋转 */
        .wheel {
            animation: spin 0.8s linear infinite;
            transform-origin: center;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 踏板旋转 */
        .pedals {
            animation: pedal 0.8s linear infinite;
        }
        @keyframes pedal {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 云朵飘动 */
        .cloud1 { animation: float 25s linear infinite; }
        .cloud2 { animation: float 30s linear infinite; animation-delay: -10s; }
        .cloud3 { animation: float 20s linear infinite; animation-delay: -5s; }
        @keyframes float {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(900px); }
        }

        /* 鹈鹕嘴巴微动 */
        .beak {
            animation: beak-move 2s ease-in-out infinite alternate;
        }
        @keyframes beak-move {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(5deg); }
        }

        /* 地面线条移动 */
        .ground-lines {
            animation: ground-move 0.5s linear infinite;
        }
        @keyframes ground-move {
            0% { transform: translateX(0); }
            100% { transform: translateX(-20px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- 天空 -->
            <rect width="800" height="300" fill="#87ceeb"/>

            <!-- 太阳 -->
            <circle cx="680" cy="80" r="50" fill="#ffd700" opacity="0.9"/>
            <circle cx="680" cy="80" r="60" fill="#ffd700" opacity="0.3"/>

            <!-- 云朵 -->
            <g class="cloud1">
                <ellipse cx="150" cy="100" rx="40" ry="25" fill="white" opacity="0.8"/>
                <ellipse cx="180" cy="90" rx="35" ry="20" fill="white" opacity="0.8"/>
                <ellipse cx="120" cy="95" rx="30" ry="18" fill="white" opacity="0.8"/>
            </g>
            <g class="cloud2">
                <ellipse cx="400" cy="130" rx="45" ry="28" fill="white" opacity="0.7"/>
                <ellipse cx="440" cy="120" rx="38" ry="22" fill="white" opacity="0.7"/>
                <ellipse cx="360" cy="125" rx="32" ry="20" fill="white" opacity="0.7"/>
            </g>
            <g class="cloud3">
                <ellipse cx="600" cy="80" rx="38" ry="22" fill="white" opacity="0.75"/>
                <ellipse cx="635" cy="72" rx="30" ry="18" fill="white" opacity="0.75"/>
                <ellipse cx="570" cy="75" rx="28" ry="16" fill="white" opacity="0.75"/>
            </g>

            <!-- 地面 -->
            <rect y="300" width="800" height="200" fill="#90ee90"/>
            <rect y="300" width="800" height="10" fill="#228b22"/>

            <!-- 地面道路 -->
            <rect y="340" width="800" height="60" fill="#696969"/>
            <g class="ground-lines">
                <rect x="0" y="365" width="40" height="5" fill="#ffd700"/>
                <rect x="60" y="365" width="40" height="5" fill="#ffd700"/>
                <rect x="120" y="365" width="40" height="5" fill="#ffd700"/>
                <rect x="180" y="365" width="40" height="5" fill="#ffd700"/>
                <rect x="240" y="365" width="40" height="5" fill="#ffd700"/>
                <rect x="300" y="365" width="40" height="5" fill="#ffd700"/>
                <rect x="360" y="365" width="40" height="5" fill="#ffd700"/>
                <rect x="420" y="365" width="40" height="5" fill="#ffd700"/>
                <rect x="480" y="365" width="40" height="5" fill="#ffd700"/>
                <rect x="540" y="365" width="40" height="5" fill="#ffd700"/>
                <rect x="600" y="365" width="40" height="5" fill="#ffd700"/>
                <rect x="660" y="365" width="40" height="5" fill="#ffd700"/>
                <rect x="720" y="365" width="40" height="5" fill="#ffd700"/>
                <rect x="780" y="365" width="40" height="5" fill="#ffd700"/>
                <rect x="840" y="365" width="40" height="5" fill="#ffd700"/>
            </g>

            <!-- 草地装饰 -->
            <ellipse cx="100" cy="320" rx="60" ry="15" fill="#32cd32"/>
            <ellipse cx="300" cy="315" rx="80" ry="12" fill="#32cd32"/>
            <ellipse cx="500" cy="318" rx="70" ry="14" fill="#32cd32"/>
            <ellipse cx="700" cy="316" rx="65" ry="13" fill="#32cd32"/>

            <!-- 自行车和鹈鹕组合 -->
            <g class="bike-group">
                <!-- 后轮 -->
                <g transform="translate(200, 280)">
                    <g class="wheel" style="transform-origin: 0 0;">
                        <circle cx="0" cy="0" r="40" fill="none" stroke="#333" stroke-width="4"/>
                        <circle cx="0" cy="0" r="35" fill="none" stroke="#666" stroke-width="1"/>
                        <!-- 辐条 -->
                        <line x1="0" y1="-35" x2="0" y2="35" stroke="#888" stroke-width="1.5"/>
                        <line x1="-35" y1="0" x2="35" y2="0" stroke="#888" stroke-width="1.5"/>
                        <line x1="-25" y1="-25" x2="25" y2="25" stroke="#888" stroke-width="1.5"/>
                        <line x1="25" y1="-25" x2="-25" y2="25" stroke="#888" stroke-width="1.5"/>
                    </g>
                </g>

                <!-- 前轮 -->
                <g transform="translate(360, 280)">
                    <g class="wheel" style="transform-origin: 0 0;">
                        <circle cx="0" cy="0" r="40" fill="none" stroke="#333" stroke-width="4"/>
                        <circle cx="0" cy="0" r="35" fill="none" stroke="#666" stroke-width="1"/>
                        <!-- 辐条 -->
                        <line x1="0" y1="-35" x2="0" y2="35" stroke="#888" stroke-width="1.5"/>
                        <line x1="-35" y1="0" x2="35" y2="0" stroke="#888" stroke-width="1.5"/>
                        <line x1="-25" y1="-25" x2="25" y2="25" stroke="#888" stroke-width="1.5"/>
                        <line x1="25" y1="-25" x2="-25" y2="25" stroke="#888" stroke-width="1.5"/>
                    </g>
                </g>

                <!-- 车架 -->
                <path d="M 200 280 L 250 220 L 330 220 L 360 280" fill="none" stroke="#4169e1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M 250 220 L 280 280 L 360 280" fill="none" stroke="#4169e1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M 280 280 L 250 220" fill="none" stroke="#4169e1" stroke-width="5" stroke-linecap="round"/>

                <!-- 车把 -->
                <path d="M 330 220 L 340 190 L 360 195" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round"/>

                <!-- 车座 -->
                <ellipse cx="245" cy="215" rx="25" ry="8" fill="#8b4513"/>
                <rect x="240" y="215" width="10" height="10" fill="#666"/>

                <!-- 中轴和踏板 -->
                <g transform="translate(280, 280)">
                    <circle cx="0" cy="0" r="8" fill="#555"/>
                    <g class="pedals" style="transform-origin: 0 0;">
                        <!-- 踏板臂 -->
                        <line x1="0" y1="0" x2="-20" y2="15" stroke="#555" stroke-width="4" stroke-linecap="round"/>
                        <line x1="0" y1="0" x2="20" y2="-15" stroke="#555" stroke-width="4" stroke-linecap="round"/>
                        <!-- 踏板 -->
                        <rect x="-28" y="12" width="16" height="6" fill="#333" rx="2"/>
                        <rect x="12" y="-18" width="16" height="6" fill="#333" rx="2"/>
                    </g>
                </g>

                <!-- 鹈鹕身体 -->
                <ellipse cx="250" cy="180" rx="35" ry="45" fill="#f5f5f5" transform="rotate(-10 250 180)"/>
                <!-- 身体纹理 -->
                <ellipse cx="250" cy="185" rx="28" ry="35" fill="#e8e8e8" transform="rotate(-10 250 185)"/>

                <!-- 鹈鹕脖子 -->
                <path d="M 250 140 Q 260 110 270 95" fill="none" stroke="#f5f5f5" stroke-width="20" stroke-linecap="round"/>
                <path d="M 250 140 Q 260 110 270 95" fill="none" stroke="#e8e8e8" stroke-width="15" stroke-linecap="round"/>

                <!-- 鹈鹕头部 -->
                <circle cx="275" cy="90" r="22" fill="#f5f5f5"/>

                <!-- 鹈鹕眼睛 -->
                <circle cx="280" cy="85" r="5" fill="white"/>
                <circle cx="281" cy="85" r="3" fill="#333"/>
                <circle cx="282" cy="84" r="1" fill="white"/>

                <!-- 鹈鹕嘴巴（上喙） -->
                <path d="M 295 88 L 340 95 L 295 100" fill="#ff8c00"/>

                <!-- 鹈鹕喉囊 -->
                <g class="beak" style="transform-origin: 295 100;">
                    <path d="M 295 100 L 335 105 Q 320 130 290 108" fill="#ffa500" opacity="0.8"/>
                </g>

                <!-- 鹈鹕翅膀（握着车把） -->
                <path d="M 260 160 Q 300 170 345 190" fill="none" stroke="#d3d3d3" stroke-width="12" stroke-linecap="round"/>
                <path d="M 260 160 Q 300 170 345 190" fill="none" stroke="#e8e8e8" stroke-width="8" stroke-linecap="round"/>

                <!-- 鹈鹕另一只翅膀 -->
                <path d="M 240 165 Q 220 180 210 195" fill="none" stroke="#d3d3d3" stroke-width="10" stroke-linecap="round"/>

                <!-- 鹈鹕脚（踩踏板） -->
                <path d="M 250 220 L 265 260 L 260 295" fill="none" stroke="#ff8c00" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- 脚蹼 -->
                <ellipse cx="262" cy="298" rx="10" ry="5" fill="#ff8c00"/>

                <!-- 另一只脚 -->
                <path d="M 240 215 L 230 245 L 240 275" fill="none" stroke="#ff8c00" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                <ellipse cx="242" cy="278" rx="10" ry="5" fill="#ff8c00"/>

                <!-- 鹈鹕尾巴 -->
                <path d="M 215 185 L 190 175 L 195 185 L 185 195 L 200 195 L 210 205" fill="#d3d3d3" stroke="#bbb" stroke-width="1"/>
            </g>
        </svg>
    </div>
</body>
</html>
