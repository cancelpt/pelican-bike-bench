<!DOCTYPE html>

<head>

  <title>乘风慢游 · 鹈鹕的海岸骑行</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f0e8;
      --ink: #21433e;
      --muted: #6f7f75;
      --line: rgba(33, 67, 62, 0.14);
      --accent: #df7657;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 0%, rgba(255, 255, 255, 0.9), transparent 32rem),
        var(--paper);
      color: var(--ink);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    .page {
      width: min(1240px, 100%);
      margin: 0 auto;
      padding: 38px 28px 26px;
    }

    .masthead {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 26px;
      height: 2px;
      background: var(--accent);
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 4.5vw, 56px);
      font-weight: 750;
      letter-spacing: -0.055em;
      line-height: 1.05;
    }

    h1 span { color: var(--accent); }

    .toggle {
      flex: 0 0 auto;
      min-width: 112px;
      padding: 12px 18px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.58);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease;
    }

    .toggle:hover { background: #fff; }
    .toggle:active { transform: scale(0.97); }
    .toggle:focus-visible { outline: 3px solid rgba(223, 118, 87, 0.3); outline-offset: 3px; }

    .scene-frame {
      overflow: hidden;
      border: 1px solid rgba(33, 67, 62, 0.1);
      border-radius: 28px;
      background: #dce9df;
      box-shadow: 0 22px 60px rgba(50, 68, 54, 0.1), 0 2px 5px rgba(50, 68, 54, 0.05);
    }

    .scene {
      display: block;
      width: 100%;
      height: auto;
    }

    .caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 4px 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    .ride-status { display: inline-flex; align-items: center; gap: 8px; }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #5e9274;
      box-shadow: 0 0 0 4px rgba(94, 146, 116, 0.12);
    }

    .is-paused .status-dot { background: #a8a69a; box-shadow: none; }

    @media (max-width: 640px) {
      .page { padding: 24px 14px 18px; }
      .masthead { align-items: center; margin-bottom: 18px; }
      .eyebrow { font-size: 9px; letter-spacing: 0.14em; }
      .toggle { min-width: auto; padding: 10px 14px; font-size: 12px; }
      .scene-frame { border-radius: 18px; }
      .caption { align-items: flex-start; font-size: 10px; }
    }
  </style>
</head>

    const toggle = document.getElementById('toggle');
    const caption = document.getElementById('caption');
    const status = document.getElementById('status');
    let paused = false;

    function setPaused(nextPaused) {
      paused = nextPaused;
      if (paused) {
        scene.pauseAnimations();
      } else {
        scene.unpauseAnimations();
      }
      toggle.textContent = paused ? '继续动画' : '暂停动画';
      toggle.setAttribute('aria-pressed', String(paused));
      caption.classList.toggle('is-paused', paused);
      status.textContent = paused ? '停下来看看海' : '正在沿海岸前行';
    }

    toggle.addEventListener('click', () => setPaused(!paused));

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      setPaused(true);
    }
  </script>
</body>
</html>
