<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 🚴</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #1d3557 0%, #2b4a78 100%);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1 {
    color: #f1faee;
    font-weight: 600;
    letter-spacing: 2px;
    margin: 0 0 16px;
  }
  .stage {
    width: min(90vw, 860px);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  svg { display: block; width: 100%; height: auto; }

  /* 公路虚线向左移动,营造前进感 */
  .lane-dash {
    stroke-dasharray: 40 30;
    animation: roadMove .6s linear infinite;
  }
  @keyframes roadMove { to { stroke-dashoffset: 70; } }

  /* 链条转动 */
  .chain {
    stroke-dasharray: 6 5;
    animation: chainMove .35s linear infinite;
  }
  @keyframes chainMove { to { stroke-dashoffset: -11; } }

  /* 身后的速度线 */
  .speed-lines line {
    stroke: rgba(255,255,255,.75);
    stroke-width: 4;
    stroke-linecap: round;
    animation: whoosh .7s linear infinite;
  }
  .speed-lines line:nth-child(2) { animation-delay: .25s; }
  .speed-lines line:nth-child(3) { animation-delay: .45s; }
  @keyframes whoosh {
    0%   { transform: translateX(0);     opacity: 0; }
    20%  { opacity: .9; }
    100% { transform: translateX(-90px); opacity: 0; }
  }
</style>
</head>
<body>
  <h1>🚴 鹈鹕骑自行车</h1>
  <div class="stage">
  <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕正在骑自行车的动画">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8ecae6"/>
        <stop offset="1" stop-color="#d0f0fd"/>
      </linearGradient>
      <g id="cloud">
        <ellipse cx="0"  cy="0"  rx="42" ry="18" fill="#ffffff" opacity=".92"/>
        <ellipse cx="30" cy="8"  rx="30" ry="14" fill="#ffffff" opacity=".92"/>
        <ellipse cx="-28" cy="9" rx="26" ry="12" fill="#ffffff" opacity=".92"/>
      </g>
      <g id="bush">
        <ellipse cx="0"  cy="0" rx="26" ry="16" fill="#588157"/>
        <ellipse cx="20" cy="4" rx="18" ry="11" fill="#6a994e"/>
        <ellipse cx="-18" cy="5" rx="16" ry="10" fill="#6a994e"/>
      </g>
    </defs>

    <!-- 天空 -->
    <rect width="800" height="500" fill="url(#sky)"/>

    <!-- 太阳(光芒缓慢旋转) -->
    <g transform="translate(690,78)">
      <g stroke="#ffd166" stroke-width="5" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
        <line x1="0" y1="-52" x2="0" y2="-64"/><line x1="0" y1="52" x2="0" y2="64"/>
        <line x1="-52" y1="0" x2="-64" y2="0"/><line x1="52" y1="0" x2="64" y2="0"/>
        <line x1="-37" y1="-37" x2="-46" y2="-46"/><line x1="37" y1="37" x2="46" y2="46"/>
        <line x1="-37" y1="37" x2="-46" y2="46"/><line x1="37" y1="-37" x2="46" y2="-46"/>
      </g>
      <circle r="38" fill="#ffd166"/>
      <circle r="30" fill="#ffe08a"/>
    </g>

    <!-- 飘动的云 -->
    <use href="#cloud">
      <animateTransform attributeName="transform" type="translate"
        values="900 80; -150 80" dur="20s" repeatCount="indefinite"/>
    </use>
    <use href="#cloud" transform="scale(.7)">
      <animateTransform attributeName="transform" type="translate"
        values="950 170; -180 170" dur="13s" repeatCount="indefinite"/>
    </use>

    <!-- 草地与公路 -->
    <rect y="440" width="800" height="60" fill="#7cb56b"/>
    <rect y="458" width="800" height="42" fill="#4a4a4a"/>
    <line class="lane-dash" x1="0" y1="480" x2="800" y2="480" stroke="#f1faee" stroke-width="5"/>

    <!-- 掠过的灌木,增强速度感 -->
    <use href="#bush">
      <animateTransform attributeName="transform" type="translate"
        values="880 448; -80 448" dur="3.2s" repeatCount="indefinite"/>
    </use>
    <use href="#bush" transform="scale(.7)">
      <animateTransform attributeName="transform" type="translate"
        values="900 452; -70 452" dur="4.5s" begin="-2s" repeatCount="indefinite"/>
    </use>

    <!-- 速度线 -->
    <g class="speed-lines">
      <line x1="230" y1="250" x2="290" y2="250"/>
      <line x1="215" y1="295" x2="285" y2="295"/>
      <line x1="240" y1="340" x2="300" y2="340"/>
    </g>

    <!-- ======== 远侧腿(在车架后面),与踏板同步的 8 帧踩踏动画 ======== -->
    <path fill="none" stroke="#d98324" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" dur="1s" repeatCount="indefinite" calcMode="linear" values="
        M395,310 L433.3,349.4 L389,382;
        M395,310 L443.8,335.4 L396.6,363.6;
        M395,310 L449.9,313.5 L415,356;
        M395,310 L450.0,311.2 L433.4,363.6;
        M395,310 L447.2,327.3 L441,382;
        M395,310 L437.0,345.5 L433.4,400.4;
        M395,310 L427.4,354.4 L415,408;
        M395,310 L427.1,354.6 L396.6,400.4;
        M395,310 L433.3,349.4 L389,382"/>
    </path>
    <ellipse rx="10" ry="4.5" fill="#d98324" stroke="#333" stroke-width="2">
      <animate attributeName="cx" dur="1s" repeatCount="indefinite" calcMode="linear"
        values="389;396.6;415;433.4;441;433.4;415;396.6;389"/>
      <animate attributeName="cy" dur="1s" repeatCount="indefinite" calcMode="linear"
        values="382;363.6;356;363.6;382;400.4;408;400.4;382"/>
    </ellipse>

    <!-- ======== 自行车 ======== -->
    <!-- 后轮 -->
    <g>
      <circle cx="300" cy="403" r="55" fill="none" stroke="#2b2b2b" stroke-width="9"/>
      <circle cx="300" cy="403" r="55" fill="none" stroke="#888" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0 300 403" to="360 300 403" dur="1s" repeatCount="indefinite"/>
        <line x1="300" y1="348" x2="300" y2="458"/>
        <line x1="245" y1="403" x2="355" y2="403"/>
        <line x1="261" y1="364" x2="339" y2="442"/>
        <line x1="261" y1="442" x2="339" y2="364"/>
      </g>
      <circle cx="300" cy="403" r="7" fill="#555"/>
    </g>
    <!-- 前轮 -->
    <g>
      <circle cx="520" cy="403" r="55" fill="none" stroke="#2b2b2b" stroke-width="9"/>
      <circle cx="520" cy="403" r="55" fill="none" stroke="#888" stroke-width="2"/>
      <g stroke="#9a9a9a" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0 520 403" to="360 520 403" dur="1s" repeatCount="indefinite"/>
        <line x1="520" y1="348" x2="520" y2="458"/>
        <line x1="465" y1="403" x2="575" y2="403"/>
        <line x1="481" y1="364" x2="559" y2="442"/>
        <line x1="481" y1="442" x2="559" y2="364"/>
      </g>
      <circle cx="520" cy="403" r="7" fill="#555"/>
    </g>

    <!-- 链条 -->
    <line class="chain" x1="414" y1="370" x2="300" y2="395" stroke="#3d3d3d" stroke-width="3.5"/>
    <line class="chain" x1="414" y1="394" x2="300" y2="411" stroke="#3d3d3d" stroke-width="3.5"/>

    <!-- 车架 -->
    <g stroke="#e63946" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="415" y1="382" x2="393" y2="312"/>   <!-- 座管 -->
      <line x1="395" y1="318" x2="500" y2="318"/>   <!-- 上管 -->
      <line x1="415" y1="382" x2="503" y2="320"/>   <!-- 下管 -->
      <line x1="415" y1="382" x2="300" y2="403"/>   <!-- 后下叉 -->
      <line x1="395" y1="318" x2="300" y2="403"/>   <!-- 后上叉 -->
      <line x1="503" y1="318" x2="520" y2="403"/>   <!-- 前叉 -->
      <line x1="503" y1="318" x2="493" y2="286"/>   <!-- 立管 -->
    </g>
    <!-- 车座与车把 -->
    <path d="M372,306 Q392,298 414,306 Q392,312 372,306 Z" fill="#2b2b2b"/>
    <line x1="493" y1="286" x2="474" y2="282" stroke="#2b2b2b" stroke-width="7" stroke-linecap="round"/>
    <circle cx="474" cy="282" r="5" fill="#2b2b2b"/>
    <!-- 牙盘 -->
    <circle cx="415" cy="382" r="13" fill="none" stroke="#333" stroke-width="4"/>

    <!-- 曲柄与踏板(整体旋转,踏板反向旋转保持水平) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 415 382" to="360 415 382" dur="1s" repeatCount="indefinite"/>
      <line x1="415" y1="382" x2="441" y2="382" stroke="#333" stroke-width="5" stroke-linecap="round"/>
      <line x1="415" y1="382" x2="389" y2="382" stroke="#333" stroke-width="5" stroke-linecap="round"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 441 382" to="-360 441 382" dur="1s" repeatCount="indefinite"/>
        <rect x="432" y="378" width="18" height="8" rx="3" fill="#222"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 389 382" to="-360 389 382" dur="1s" repeatCount="indefinite"/>
        <rect x="380" y="378" width="18" height="8" rx="3" fill="#222"/>
      </g>
    </g>

    <!-- ======== 近侧腿(车架前面) ======== -->
    <path fill="none" stroke="#f9a03f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" dur="1s" repeatCount="indefinite" calcMode="linear" values="
        M395,310 L447.2,327.3 L441,382;
        M395,310 L437.0,345.5 L433.4,400.4;
        M395,310 L427.4,354.4 L415,408;
        M395,310 L427.1,354.6 L396.6,400.4;
        M395,310 L433.3,349.4 L389,382;
        M395,310 L443.8,335.4 L396.6,363.6;
        M395,310 L449.9,313.5 L415,356;
        M395,310 L450.0,311.2 L433.4,363.6;
        M395,310 L447.2,327.3 L441,382"/>
    </path>
    <ellipse rx="10" ry="4.5" fill="#f9a03f" stroke="#333" stroke-width="2">
      <animate attributeName="cx" dur="1s" repeatCount="indefinite" calcMode="linear"
        values="441;433.4;415;396.6;389;396.6;415;433.4;441"/>
      <animate attributeName="cy" dur="1s" repeatCount="indefinite" calcMode="linear"
        values="382;400.4;408;400.4;382;363.6;356;363.6;382"/>
    </ellipse>

    <!-- ======== 鹈鹕 ======== -->
    <!-- 尾羽(轻微摆动) -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 350 262; 7 350 262; 0 350 262; -4 350 262; 0 350 262" dur="1s" repeatCount="indefinite"/>
      <path d="M350,252 L306,232 L318,258 L302,262 L322,274 Z" fill="#f8f5f0" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
    </g>

    <!-- 身体 -->
    <ellipse cx="385" cy="265" rx="54" ry="38" fill="#f8f5f0" stroke="#333" stroke-width="3" transform="rotate(-10 385 265)"/>
    <path d="M352,272 Q378,290 410,278" fill="none" stroke="#d8d0c4" stroke-width="3" stroke-linecap="round"/>

    <!-- 脖子 + 头 + 大嘴(整体轻微点头) -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 420 250; 2.5 420 250; 0 420 250; -2 420 250; 0 420 250" dur="1.6s" repeatCount="indefinite"/>
      <!-- 脖子 -->
      <path d="M406,252 C438,242 446,216 446,186 L464,186 C464,222 452,250 424,266 Z"
            fill="#f8f5f0" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
      <!-- 大嘴上喙 -->
      <path d="M452,172 L552,184 L550,191 L452,183 Z" fill="#f9a03f" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- 喉囊(会随节奏微微鼓动) -->
      <path fill="#f4a261" stroke="#333" stroke-width="2.5" stroke-linejoin="round">
        <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear" values="
          M452,182 Q498,224 550,190 Q500,202 452,182 Z;
          M452,182 Q498,234 550,190 Q500,206 452,182 Z;
          M452,182 Q498,224 550,190 Q500,202 452,182 Z"/>
      </path>
      <!-- 头 -->
      <circle cx="455" cy="176" r="17" fill="#f8f5f0" stroke="#333" stroke-width="3"/>
      <circle cx="461" cy="171" r="3.6" fill="#222"/>
      <circle cx="462.4" cy="169.6" r="1.2" fill="#fff"/>
    </g>

    <!-- 翅膀:伸向车把,像手臂一样扶着 -->
    <path d="M388,244 C432,246 468,266 490,282 L485,292 C460,278 426,264 386,262 Z"
          fill="#f8f5f0" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  </svg>
  </div>
</body>
</html>
