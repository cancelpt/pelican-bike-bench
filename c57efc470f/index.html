<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>骑自行车的鹈鹕 · SVG 2D 动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    background: radial-gradient(1200px 700px at 50% 30%, #24344f, #131a28);
    font-family: "PingFang SC", "Microsoft YaHeai", system-ui, sans-serif;
  }
  .stage {
    width: min(94vw, 980px);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
  }
  svg { display: block; width: 100%; height: auto; }
  .caption {
    color: #93a7c4;
    font-size: 13px;
    letter-spacing: .35em;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 1s linear infinite; }

  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .bob { animation: bob .5s ease-in-out infinite; }

  @keyframes drift { to { transform: translateX(-900px); } }
  .hills-far  { animation: drift 16s linear infinite; }
  .hills-near { animation: drift 10s linear infinite; }
  .trees      { animation: drift 5.5s linear infinite; }
  .flowers    { animation: drift 2.24s linear infinite; }

  @keyframes cloudDrift { from { transform: translateX(980px); } to { transform: translateX(-280px); } }
  .cloud-a { animation: cloudDrift 36s linear infinite; }
  .cloud-b { animation: cloudDrift 52s linear infinite; animation-delay: -18s; }
  .cloud-c { animation: cloudDrift 64s linear infinite; animation-delay: -40s; }
  .birds   { animation: cloudDrift 70s linear infinite; animation-delay: -30s; }

  @keyframes dashMove { to { stroke-dashoffset: -408; } }
  .road-dash { stroke-dasharray: 60 42; animation: dashMove 1s linear infinite; }

  @keyframes chainTop    { to { stroke-dashoffset: -96; } }
  @keyframes chainBottom { to { stroke-dashoffset: 96; } }
  .chain-top    { stroke-dasharray: 10 6; animation: chainTop 1s linear infinite; }
  .chain-bottom { stroke-dasharray: 10 6; animation: chainBottom 1s linear infinite; }

  @keyframes glow { 0%, 100% { opacity: .5; transform: scale(1); } 50% { opacity: .85; transform: scale(1.07); } }
  .sun-glow { transform-box: fill-box; transform-origin: center; animation: glow 3.2s ease-in-out infinite; }

  @keyframes jiggle { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06, 1.09); } }
  .pouch { transform-box: view-box; transform-origin: 478px 226px; animation: jiggle .9s ease-in-out infinite; }

  @keyframes whoosh {
    0%   { transform: translateX(160px); opacity: 0; }
    12%  { opacity: .75; }
    100% { transform: translateX(-360px); opacity: 0; }
  }
  .speedline { animation: whoosh 1.05s linear infinite; }
  .speedline.s2 { animation-delay: .35s; }
  .speedline.s3 { animation-delay: .7s; }

  @media (prefers-reduced-motion: reduce) {
    .spin, .bob, .hills-far, .hills-near, .trees, .flowers,
    .cloud-a, .cloud-b, .cloud-c, .birds, .road-dash,
    .chain-top, .chain-bottom, .sun-glow, .pouch, .speedline { animation: none; }
  }
</style>
</head>
<body>
