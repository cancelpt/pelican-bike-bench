<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕骑自行车</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(to bottom, #0A0D12 0%, #161D2B 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .scene {
      width: 100%;
      max-width: 800px;
      height: 600px;
    }

    /* 自行车轮子旋转 */
    .wheel {
      transform-origin: center;
      animation: rotate 1.2s linear infinite;
    }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    /* 车轮辐条 */
    .spoke {
      animation: rotate 1.2s linear infinite;
      transform-origin: center;
    }

    /* 脚踏板旋转 */
    .pedal-group {
      transform-origin: 380px 340px;
      animation: rotate 1.2s linear infinite;
    }

    /* 鹈鹕腿部蹬踏 */
    .leg-left {
      transform-origin: 360px 280px;
      animation: pedal-left 1.2s ease-in-out infinite;
    }

    .leg-right {
      transform-origin: 360px 280px;
      animation: pedal-right 1.2s ease-in-out infinite;
    }

    @keyframes pedal-left {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(25deg); }
    }

    @keyframes pedal-right {
      0%, 100% { transform: rotate(25deg); }
      50% { transform: rotate(0deg); }
    }

    /* 鹈鹕轻微上下浮动 */
    .pelican-body {
      animation: bob 1.2s ease-in-out infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    /* 翅膀扇动 */
    .wing {
      transform-origin: 350px 260px;
      animation: flap 0.8s ease-in-out infinite;
    }

    @keyframes flap {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-8deg); }
    }

    /* 背景云朵移动 */
    .cloud {
      animation: cloud-drift 20s linear infinite;
    }

    @keyframes cloud-drift {
      from { transform: translateX(0); }
      to { transform: translateX(-100px); }
    }

    /* 地面移动营造前进感 */
    .ground-line {
      animation: ground-move 2s linear infinite;
    }

    @keyframes ground-move {
      from { transform: translateX(0); }
      to { transform: translateX(-40px); }
    }
  </style>
</head>
<body>
  <svg class="scene" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- 渐变定义 -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#1E2636;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#38BDF8;stop-opacity:0.3" />
      </linearGradient>

      <radialGradient id="sunGrad">
        <stop offset="0%" style="stop-color:#E9A568;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#E9A568;stop-opacity:0" />
      </radialGradient>
    </defs>

    <!-- 天空背景 -->
    <rect width="800" height="600" fill="url(#skyGrad)" />

    <!-- 太阳 -->
    <circle cx="650" cy="120" r="50" fill="url(#sunGrad)" opacity="0.6" />
    <circle cx="650" cy="120" r="35" fill="#E9A568" />

    <!-- 云朵 -->
    <g class="cloud">
      <ellipse cx="150" cy="100" rx="40" ry="25" fill="#1E2636" opacity="0.4" />
      <ellipse cx="180" cy="95" rx="50" ry="30" fill="#1E2636" opacity="0.4" />
      <ellipse cx="210" cy="100" rx="35" ry="22" fill="#1E2636" opacity="0.4" />
    </g>

    <g class="cloud" style="animation-delay: -10s;">
      <ellipse cx="500" cy="140" rx="35" ry="20" fill="#1E2636" opacity="0.3" />
      <ellipse cx="525" cy="137" rx="45" ry="25" fill="#1E2636" opacity="0.3" />
      <ellipse cx="550" cy="140" rx="30" ry="18" fill="#1E2636" opacity="0.3" />
    </g>

    <!-- 地面 -->
    <rect x="0" y="450" width="800" height="150" fill="#0F131C" />
    <line x1="0" y1="450" x2="800" y2="450" stroke="#38BDF8" stroke-width="2" opacity="0.3" />

    <!-- 地面装饰线条（营造运动感） -->
    <g class="ground-line">
      <line x1="0" y1="480" x2="100" y2="480" stroke="#38BDF8" stroke-width="3" opacity="0.2" stroke-linecap="round" />
      <line x1="150" y1="480" x2="250" y2="480" stroke="#38BDF8" stroke-width="3" opacity="0.2" stroke-linecap="round" />
      <line x1="300" y1="480" x2="400" y2="480" stroke="#38BDF8" stroke-width="3" opacity="0.2" stroke-linecap="round" />
      <line x1="450" y1="480" x2="550" y2="480" stroke="#38BDF8" stroke-width="3" opacity="0.2" stroke-linecap="round" />
      <line x1="600" y1="480" x2="700" y2="480" stroke="#38BDF8" stroke-width="3" opacity="0.2" stroke-linecap="round" />
      <line x1="750" y1="480" x2="850" y2="480" stroke="#38BDF8" stroke-width="3" opacity="0.2" stroke-linecap="round" />
    </g>

    <!-- 自行车 -->
    <g class="bicycle">
      <!-- 后轮 -->
      <g class="wheel">
        <circle cx="300" cy="400" r="45" fill="none" stroke="#6EE7B7" stroke-width="4" />
        <circle cx="300" cy="400" r="5" fill="#6EE7B7" />
        <!-- 辐条 -->
        <g class="spoke">
          <line x1="300" y1="400" x2="300" y2="355" stroke="#6EE7B7" stroke-width="2" opacity="0.6" />
          <line x1="300" y1="400" x2="332" y2="368" stroke="#6EE7B7" stroke-width="2" opacity="0.6" />
          <line x1="300" y1="400" x2="345" y2="400" stroke="#6EE7B7" stroke-width="2" opacity="0.6" />
          <line x1="300" y1="400" x2="332" y2="432" stroke="#6EE7B7" stroke-width="2" opacity="0.6" />
          <line x1="300" y1="400" x2="268" y2="432" stroke="#6EE7B7" stroke-width="2" opacity="0.6" />
          <line x1="300" y1="400" x2="255" y2="400" stroke="#6EE7B7" stroke-width="2" opacity="0.6" />
          <line x1="300" y1="400" x2="268" y2="368" stroke="#6EE7B7" stroke-width="2" opacity="0.6" />
        </g>
      </g>

      <!-- 前轮 -->
      <g class="wheel">
        <circle cx="460" cy="400" r="45" fill="none" stroke="#6EE7B7" stroke-width="4" />
        <circle cx="460" cy="400" r="5" fill="#6EE7B7" />
        <!-- 辐条 -->
        <g class="spoke">
          <line x1="460" y1="400" x2="460" y2="355" stroke="#6EE7B7" stroke-width="2" opacity="0.6" />
          <line x1="460" y1="400" x2="492" y2="368" stroke="#6EE7B7" stroke-width="2" opacity="0.6" />
          <line x1="460" y1="400" x2="505" y2="400" stroke="#6EE7B7" stroke-width="2" opacity="0.6" />
          <line x1="460" y1="400" x2="492" y2="432" stroke="#6EE7B7" stroke-width="2" opacity="0.6" />
          <line x1="460" y1="400" x2="428" y2="432" stroke="#6EE7B7" stroke-width="2" opacity="0.6" />
          <line x1="460" y1="400" x2="415" y2="400" stroke="#6EE7B7" stroke-width="2" opacity="0.6" />
          <line x1="460" y1="400" x2="428" y2="368" stroke="#6EE7B7" stroke-width="2" opacity="0.6" />
        </g>
      </g>

      <!-- 车架 -->
      <line x1="300" y1="400" x2="380" y2="340" stroke="#E9A568" stroke-width="5" stroke-linecap="round" />
      <line x1="380" y1="340" x2="460" y2="400" stroke="#E9A568" stroke-width="5" stroke-linecap="round" />
      <line x1="380" y1="340" x2="420" y2="290" stroke="#E9A568" stroke-width="5" stroke-linecap="round" />
      <line x1="420" y1="290" x2="460" y2="340" stroke="#E9A568" stroke-width="5" stroke-linecap="round" />
      <line x1="460" y1="340" x2="460" y2="400" stroke="#E9A568" stroke-width="5" stroke-linecap="round" />
      <line x1="300" y1="400" x2="340" y2="360" stroke="#E9A568" stroke-width="5" stroke-linecap="round" />

      <!-- 座位 -->
      <ellipse cx="360" cy="320" rx="25" ry="8" fill="#38BDF8" />
      <line x1="360" y1="320" x2="380" y2="340" stroke="#38BDF8" stroke-width="4" />

      <!-- 把手 -->
      <line x1="460" y1="340" x2="470" y2="310" stroke="#E9A568" stroke-width="4" stroke-linecap="round" />
      <line x1="470" y1="310" x2="455" y2="305" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" />
      <line x1="470" y1="310" x2="485" y2="305" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" />

      <!-- 脚踏板组 -->
      <g class="pedal-group">
        <circle cx="380" cy="340" r="8" fill="#E9A568" />
        <line x1="380" y1="340" x2="380" y2="370" stroke="#E9A568" stroke-width="4" />
        <rect x="370" y="370" width="20" height="8" rx="4" fill="#38BDF8" />
        <line x1="380" y1="340" x2="380" y2="310" stroke="#E9A568" stroke-width="4" />
        <rect x="370" y="302" width="20" height="8" rx="4" fill="#38BDF8" />
      </g>
    </g>

    <!-- 鹈鹕 -->
    <g class="pelican-body">
      <!-- 身体 -->
      <ellipse cx="360" cy="270" rx="45" ry="55" fill="#F0F0F0" stroke="#0A0D12" stroke-width="2" />

      <!-- 翅膀 -->
      <g class="wing">
        <ellipse cx="330" cy="260" rx="35" ry="20" fill="#E0E0E0" stroke="#0A0D12" stroke-width="2" />
      </g>

      <!-- 头部 -->
      <circle cx="360" cy="230" r="28" fill="#F0F0F0" stroke="#0A0D12" stroke-width="2" />

      <!-- 眼睛 -->
      <circle cx="368" cy="225" r="5" fill="#0A0D12" />
      <circle cx="370" cy="223" r="2" fill="#F0F0F0" />

      <!-- 喙部（鹈鹕标志性长喙） -->
      <path d="M 375 235 Q 420 240 440 245 Q 420 250 375 248 Z" fill="#E9A568" stroke="#0A0D12" stroke-width="2" />

      <!-- 喉囊 -->
      <path d="M 375 248 Q 390 265 375 270 Q 365 268 375 248" fill="#F4A460" opacity="0.6" stroke="#0A0D12" stroke-width="1" />

      <!-- 尾巴 -->
      <path d="M 320 290 Q 300 300 310 310 Q 315 305 320 300 Z" fill="#E0E0E0" stroke="#0A0D12" stroke-width="2" />

      <!-- 左腿（前） -->
      <g class="leg-left">
        <line x1="360" y1="310" x2="370" y2="365" stroke="#E9A568" stroke-width="4" stroke-linecap="round" />
        <circle cx="370" cy="368" r="4" fill="#E9A568" />
      </g>

      <!-- 右腿（后） -->
      <g class="leg-right">
        <line x1="360" y1="310" x2="370" y2="305" stroke="#E9A568" stroke-width="4" stroke-linecap="round" />
        <circle cx="370" cy="302" r="4" fill="#E9A568" />
      </g>
    </g>
  </svg>
</body>
</html>
