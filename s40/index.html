<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
  body {
    margin: 0;
    background: linear-gradient(180deg, #87CEEB 0%, #B0E0E6 60%, #90EE90 60%, #228B22 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }
  svg {
    width: 900px;
    height: 500px;
  }
</style>
</head>
<body>
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Road markings -->
    <pattern id="road" x="0" y="0" width="120" height="20" patternUnits="userSpaceOnUse">
      <rect width="60" height="6" fill="#FFFF00" y="7"/>
    </pattern>

    <!-- Spinning wheel animation -->
    <style>
      /* Bike moves left-right cycling */
      .bike-group {
        animation: ride 4s linear infinite;
      }
      @keyframes ride {
        0%   { transform: translateX(0px); }
        100% { transform: translateX(0px); }
      }

      /* Wheel spin */
      .wheel-spin {
        animation: spin 0.6s linear infinite;
        transform-origin: center;
      }

      /* Pedal rotation */
      .pedal-spin {
        animation: spin 0.6s linear infinite;
        transform-origin: 450px 340px;
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }

      /* Pelican body bob */
      .pelican-bob {
        animation: bob 0.6s ease-in-out infinite alternate;
      }
      @keyframes bob {
        from { transform: translateY(0px); }
        to   { transform: translateY(-4px); }
      }

      /* Wing flap */
      .wing-left {
        transform-origin: 435px 295px;
        animation: flap-left 0.6s ease-in-out infinite alternate;
      }
      @keyframes flap-left {
        from { transform: rotate(-10deg); }
        to   { transform: rotate(15deg); }
      }
      .wing-right {
        transform-origin: 465px 295px;
        animation: flap-right 0.6s ease-in-out infinite alternate;
      }
      @keyframes flap-right {
        from { transform: rotate(10deg); }
        to   { transform: rotate(-15deg); }
      }

      /* Pouch sway */
      .pouch {
        transform-origin: 493px 330px;
        animation: pouch-sway 0.6s ease-in-out infinite alternate;
      }
      @keyframes pouch-sway {
        from { transform: rotate(-5deg); }
        to   { transform: rotate(5deg); }
      }

      /* Clouds drift */
      .cloud1 {
        animation: cloud-move1 12s linear infinite;
      }
      .cloud2 {
        animation: cloud-move2 18s linear infinite;
      }
      @keyframes cloud-move1 {
        from { transform: translateX(0px); }
        to   { transform: translateX(-950px); }
      }
      @keyframes cloud-move2 {
        from { transform: translateX(200px); }
        to   { transform: translateX(-750px); }
      }

      /* Road scroll */
      .road-anim {
        animation: road-scroll 2s linear infinite;
      }
      @keyframes road-scroll {
        from { transform: translateX(0px); }
        to   { transform: translateX(-120px); }
      }
    </style>
  </defs>

  <!-- Sky background -->
  <rect width="900" height="300" fill="#87CEEB"/>
  <!-- Ground -->
  <rect y="300" width="900" height="200" fill="#4a7c59"/>
  <!-- Road surface -->
  <rect y="360" width="900" height="80" fill="#555"/>
  <!-- Road dashes - scrolling -->
  <g class="road-anim">
    <rect x="0"   y="397" width="80" height="6" fill="#FFE000" rx="2"/>
    <rect x="120" y="397" width="80" height="6" fill="#FFE000" rx="2"/>
    <rect x="240" y="397" width="80" height="6" fill="#FFE000" rx="2"/>
    <rect x="360" y="397" width="80" height="6" fill="#FFE000" rx="2"/>
    <rect x="480" y="397" width="80" height="6" fill="#FFE000" rx="2"/>
    <rect x="600" y="397" width="80" height="6" fill="#FFE000" rx="2"/>
    <rect x="720" y="397" width="80" height="6" fill="#FFE000" rx="2"/>
    <rect x="840" y="397" width="80" height="6" fill="#FFE000" rx="2"/>
    <rect x="960" y="397" width="80" height="6" fill="#FFE000" rx="2"/>
  </g>
  <!-- Road edges -->
  <rect y="360" width="900" height="5" fill="#888"/>
  <rect y="435" width="900" height="5" fill="#888"/>

  <!-- Clouds -->
  <g class="cloud1">
    <ellipse cx="150" cy="80" rx="60" ry="30" fill="white" opacity="0.9"/>
    <ellipse cx="120" cy="90" rx="40" ry="25" fill="white" opacity="0.9"/>
    <ellipse cx="185" cy="88" rx="45" ry="22" fill="white" opacity="0.9"/>
    <!-- repeat cloud shifted 900px right for seamless loop -->
    <ellipse cx="1050" cy="80" rx="60" ry="30" fill="white" opacity="0.9"/>
    <ellipse cx="1020" cy="90" rx="40" ry="25" fill="white" opacity="0.9"/>
    <ellipse cx="1085" cy="88" rx="45" ry="22" fill="white" opacity="0.9"/>
  </g>
  <g class="cloud2">
    <ellipse cx="600" cy="60" rx="70" ry="28" fill="white" opacity="0.85"/>
    <ellipse cx="565" cy="72" rx="50" ry="22" fill="white" opacity="0.85"/>
    <ellipse cx="640" cy="70" rx="55" ry="20" fill="white" opacity="0.85"/>
    <ellipse cx="-300" cy="60" rx="70" ry="28" fill="white" opacity="0.85"/>
    <ellipse cx="-335" cy="72" rx="50" ry="22" fill="white" opacity="0.85"/>
    <ellipse cx="-260" cy="70" rx="55" ry="20" fill="white" opacity="0.85"/>
  </g>

  <!-- Sun -->
  <circle cx="800" cy="80" r="45" fill="#FFD700" opacity="0.95"/>
  <g stroke="#FFD700" stroke-width="3" opacity="0.7">
    <line x1="800" y1="22" x2="800" y2="10"/>
    <line x1="800" y1="138" x2="800" y2="150"/>
    <line x1="742" y1="80" x2="730" y2="80"/>
    <line x1="858" y1="80" x2="870" y2="80"/>
    <line x1="759" y1="39" x2="750" y2="30"/>
    <line x1="841" y1="121" x2="850" y2="130"/>
    <line x1="841" y1="39" x2="850" y2="30"/>
    <line x1="759" y1="121" x2="750" y2="130"/>
  </g>

  <!-- ========== BICYCLE + PELICAN GROUP ========== -->
  <g>
    <!-- BICYCLE FRAME -->
    <!-- Rear wheel -->
    <g class="wheel-spin" style="transform-origin: 370px 400px;">
      <circle cx="370" cy="400" r="55" fill="none" stroke="#333" stroke-width="5"/>
      <circle cx="370" cy="400" r="10" fill="#555"/>
      <!-- spokes -->
      <line x1="370" y1="345" x2="370" y2="455" stroke="#555" stroke-width="2.5"/>
      <line x1="315" y1="400" x2="425" y2="400" stroke="#555" stroke-width="2.5"/>
      <line x1="331" y1="361" x2="409" y2="439" stroke="#555" stroke-width="2.5"/>
      <line x1="409" y1="361" x2="331" y2="439" stroke="#555" stroke-width="2.5"/>
      <line x1="331" y1="381" x2="409" y2="419" stroke="#555" stroke-width="1.5" opacity="0.5"/>
      <line x1="331" y1="419" x2="409" y2="381" stroke="#555" stroke-width="1.5" opacity="0.5"/>
    </g>
    <!-- Front wheel -->
    <g class="wheel-spin" style="transform-origin: 540px 400px;">
      <circle cx="540" cy="400" r="55" fill="none" stroke="#333" stroke-width="5"/>
      <circle cx="540" cy="400" r="10" fill="#555"/>
      <line x1="540" y1="345" x2="540" y2="455" stroke="#555" stroke-width="2.5"/>
      <line x1="485" y1="400" x2="595" y2="400" stroke="#555" stroke-width="2.5"/>
      <line x1="501" y1="361" x2="579" y2="439" stroke="#555" stroke-width="2.5"/>
      <line x1="579" y1="361" x2="501" y2="439" stroke="#555" stroke-width="2.5"/>
      <line x1="501" y1="381" x2="579" y2="419" stroke="#555" stroke-width="1.5" opacity="0.5"/>
      <line x1="501" y1="419" x2="579" y2="381" stroke="#555" stroke-width="1.5" opacity="0.5"/>
    </g>
    <!-- Tires highlight -->
    <circle cx="370" cy="400" r="55" fill="none" stroke="#111" stroke-width="7" stroke-dasharray="8 6" opacity="0.15"/>
    <circle cx="540" cy="400" r="55" fill="none" stroke="#111" stroke-width="7" stroke-dasharray="8 6" opacity="0.15"/>

    <!-- Frame: main triangle -->
    <!-- Chain stay: rear axle -> bottom bracket -->
    <line x1="370" y1="400" x2="450" y2="340" stroke="#E63946" stroke-width="8" stroke-linecap="round"/>
    <!-- Seat tube: bottom bracket -> seat -->
    <line x1="450" y1="340" x2="430" y2="265" stroke="#E63946" stroke-width="8" stroke-linecap="round"/>
    <!-- Down tube: bottom bracket -> head tube -->
    <line x1="450" y1="340" x2="510" y2="290" stroke="#E63946" stroke-width="8" stroke-linecap="round"/>
    <!-- Top tube: seat -> head -->
    <line x1="430" y1="265" x2="510" y2="275" stroke="#E63946" stroke-width="8" stroke-linecap="round"/>
    <!-- Seat stay: rear axle -> seat -->
    <line x1="370" y1="400" x2="430" y2="265" stroke="#E63946" stroke-width="5" stroke-linecap="round"/>
    <!-- Fork: head -> front axle -->
    <line x1="510" y1="290" x2="540" y2="400" stroke="#E63946" stroke-width="7" stroke-linecap="round"/>

    <!-- Seat post -->
    <line x1="430" y1="265" x2="428" y2="240" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <!-- Saddle -->
    <ellipse cx="428" cy="236" rx="30" ry="8" fill="#222" rx="4"/>

    <!-- Handlebar stem -->
    <line x1="510" y1="280" x2="512" y2="255" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <!-- Handlebar -->
    <path d="M490,250 Q512,248 535,255" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round"/>

    <!-- Chainring -->
    <circle cx="450" cy="340" r="22" fill="none" stroke="#888" stroke-width="4"/>
    <circle cx="450" cy="340" r="6" fill="#666"/>

    <!-- Pedals (spinning around bottom bracket) -->
    <g class="pedal-spin">
      <line x1="450" y1="340" x2="450" y2="318" stroke="#333" stroke-width="4"/>
      <rect x="443" y="314" width="14" height="5" fill="#222" rx="2"/>
      <line x1="450" y1="340" x2="450" y2="362" stroke="#333" stroke-width="4"/>
      <rect x="443" y="361" width="14" height="5" fill="#222" rx="2"/>
    </g>

    <!-- ========== PELICAN ========== -->
    <g class="pelican-bob">
      <!-- Pelican body (sitting on saddle) -->
      <ellipse cx="445" cy="220" rx="38" ry="30" fill="white" stroke="#ddd" stroke-width="1.5"/>

      <!-- Wing left -->
      <g class="wing-left">
        <ellipse cx="415" cy="215" rx="28" ry="13" fill="#f0f0f0" stroke="#ccc" stroke-width="1" transform="rotate(-20, 430, 210)"/>
      </g>
      <!-- Wing right -->
      <g class="wing-right">
        <ellipse cx="475" cy="215" rx="28" ry="13" fill="#f0f0f0" stroke="#ccc" stroke-width="1" transform="rotate(20, 460, 210)"/>
      </g>

      <!-- Tail feathers -->
      <ellipse cx="415" cy="240" rx="18" ry="9" fill="#e0e0e0" transform="rotate(-30, 415, 235)"/>

      <!-- Neck -->
      <ellipse cx="460" cy="195" rx="16" ry="22" fill="white" stroke="#ddd" stroke-width="1"/>

      <!-- Head -->
      <circle cx="475" cy="175" r="22" fill="white" stroke="#ddd" stroke-width="1.5"/>

      <!-- Eye -->
      <circle cx="483" cy="170" r="5" fill="#FF8C00"/>
      <circle cx="484" cy="169" r="3" fill="#222"/>
      <circle cx="485" cy="168" r="1" fill="white"/>

      <!-- Beak (upper) -->
      <path d="M485,180 Q520,175 530,185 Q518,188 485,185 Z" fill="#FF8C00"/>
      <!-- Beak tip hook -->
      <path d="M527,185 Q535,185 532,192" fill="none" stroke="#E65C00" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Pouch (throat sac) -->
      <g class="pouch">
        <path d="M487,185 Q510,190 515,205 Q510,218 495,220 Q485,218 485,205 Z" fill="#FFDDA0" stroke="#E8AA60" stroke-width="1.5"/>
      </g>

      <!-- Crown feathers -->
      <path d="M467,154 Q470,140 473,135" fill="none" stroke="#ddd" stroke-width="3" stroke-linecap="round"/>
      <path d="M472,152 Q478,137 480,132" fill="none" stroke="#ddd" stroke-width="3" stroke-linecap="round"/>
      <path d="M477,153 Q485,140 487,136" fill="none" stroke="#ddd" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Feet on pedals -->
      <!-- Left foot -->
      <path d="M437,248 L437,270 Q437,275 425,278 L418,278" stroke="#FF8C00" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- Right foot -->
      <path d="M453,248 L453,268 Q453,273 465,276 L472,276" stroke="#FF8C00" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Title -->
  <text x="450" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c5f2e">🐦 鹈鹕骑自行车</text>
</svg>
</body>
</html>
