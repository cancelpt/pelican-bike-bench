<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #eef4f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  svg { width: min(94vw, 940px); height: auto; border-radius: 18px; box-shadow: 0 14px 40px rgba(24,48,72,.18); }
</style>
</head>
<body>
<svg viewBox="0 0 800 500" role="img" aria-label="鹈鹕骑自行车的二维SVG动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe9f7"/>
      <stop offset="1" stop-color="#eaf8fc"/>
    </linearGradient>
  </defs>
  <style>
    .w-spokes { transform-box: view-box; transform-origin: 250px 380px; animation: spin .9s linear infinite; }
    .w-spokes.front { transform-origin: 505px 380px; }
    .crank { transform-box: view-box; transform-origin: 368px 375px; animation: spin 1.1s linear infinite; }
    .rider { animation: bob 1.1s ease-in-out infinite; }
    .wing { transform-box: view-box; transform-origin: 300px 234px; animation: flap 1.1s ease-in-out infinite; }
    .eye { transform-box: view-box; transform-origin: 377px 185px; animation: blink 4.4s linear infinite; }
    .sun-halo { transform-box: view-box; transform-origin: 90px 80px; animation: halo 3.4s ease-in-out infinite; }
    .cloud1 { animation: drift1 26s linear infinite; }
    .cloud2 { animation: drift2 34s linear infinite; }
    .hills { animation: pan 16s linear infinite; }
    .tufts { animation: pan 2.05s linear infinite; }
    .ground-dash { animation: dashmove .55s linear infinite; }
    .chain { stroke-dasharray: 5 4; animation: dashchain .3s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes flap { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(4deg); } }
    @keyframes blink { 0%,92% { transform: scaleY(1); } 95% { transform: scaleY(.08); } 98%,100% { transform: scaleY(1); } }
    @keyframes drift1 { from { transform: translateX(860px); } to { transform: translateX(-220px); } }
    @keyframes drift2 { from { transform: translateX(900px); } to { transform: translateX(-260px); } }
    @keyframes pan { from { transform: translateX(0); } to { transform: translateX(-800px); } }
    @keyframes dashmove { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -52px; } }
    @keyframes dashchain { from { stroke-dashoffset: 18; } to { stroke-dashoffset: 0; } }
    @keyframes halo { 0%,100% { opacity: .28; transform: scale(1); } 50% { opacity: .5; transform: scale(1.08); } }
  </style>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle class="sun-halo" cx="90" cy="80" r="52" fill="#ffd75e"/>
  <circle cx="90" cy="80" r="34" fill="#ffd75e"/>

  <g class="cloud1">
    <ellipse cx="0" cy="96" rx="46" ry="18" fill="#ffffff" opacity=".9"/>
    <ellipse cx="-36" cy="104" rx="30" ry="13" fill="#ffffff" opacity=".9"/>
    <ellipse cx="38" cy="104" rx="27" ry="12" fill="#ffffff" opacity=".9"/>
  </g>
  <g class="cloud2" opacity=".8">
    <ellipse cx="0" cy="150" rx="34" ry="13" fill="#ffffff"/>
    <ellipse cx="-26" cy="156" rx="22" ry="10" fill="#ffffff"/>
    <ellipse cx="28" cy="156" rx="20" ry="9" fill="#ffffff"/>
  </g>

  <g class="hills" opacity=".92">
    <g id="hillset">
      <path d="M-60,428 Q90,352 240,428 Z" fill="#d5eed9"/>
      <path d="M180,428 Q330,372 480,428 Z" fill="#c3e6cd"/>
      <path d="M430,428 Q570,360 710,428 Z" fill="#d5eed9"/>
      <path d="M660,428 Q760,390 860,428 Z" fill="#c3e6cd"/>
    </g>
    <use href="#hillset" x="800"/>
  </g>

  <rect x="0" y="428" width="800" height="72" fill="#e8d7a8"/>
  <line class="ground-dash" x1="0" y1="431" x2="800" y2="431" stroke="#bfa469" stroke-width="3" stroke-dasharray="28 24" stroke-linecap="round"/>

  <g class="tufts" stroke="#7fa863" stroke-width="2.5" stroke-linecap="round" fill="none">
    <g id="tuftset">
      <path d="M60,434 l-3,-10 M64,434 l0,-12 M68,434 l3,-9"/>
      <path d="M180,434 l-3,-8 M184,434 l0,-10 M188,434 l2,-8"/>
      <path d="M310,434 l-3,-10 M315,434 l1,-12 M320,434 l3,-8"/>
      <path d="M470,434 l-3,-9 M474,434 l0,-11 M478,434 l3,-8"/>
      <path d="M590,434 l-3,-8 M594,434 l1,-10 M598,434 l2,-9"/>
      <path d="M730,434 l-3,-10 M734,434 l0,-12 M738,434 l3,-9"/>
    </g>
    <use href="#tuftset" x="800"/>
  </g>

  <g>
    <circle cx="250" cy="380" r="52" fill="none" stroke="#3a3a44" stroke-width="8"/>
    <circle cx="250" cy="380" r="44" fill="none" stroke="#98a0aa" stroke-width="3"/>
    <g class="w-spokes" stroke="#b9bfc7" stroke-width="2.5">
      <line x1="208" y1="380" x2="292" y2="380"/>
      <line x1="214" y1="359" x2="286" y2="401"/>
      <line x1="227" y1="341" x2="273" y2="419"/>
      <line x1="250" y1="338" x2="250" y2="422"/>
      <line x1="214" y1="401" x2="286" y2="359"/>
      <line x1="227" y1="419" x2="273" y2="341"/>
    </g>
    <circle cx="250" cy="380" r="9" fill="none" stroke="#4a4a52" stroke-width="3"/>
    <circle cx="250" cy="380" r="7" fill="#5a5f66"/>
  </g>

  <line class="chain" x1="250" y1="371" x2="368" y2="351" stroke="#4a4a52" stroke-width="3"/>
  <line class="chain" x1="250" y1="389" x2="368" y2="399" stroke="#4a4a52" stroke-width="3"/>

  <g stroke="#2a9d8f" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M368,375 L474,296"/>
    <path d="M368,375 L322,272"/>
    <path d="M324,276 L470,294"/>
    <path d="M322,278 L250,380"/>
    <path d="M368,375 L250,380"/>
    <path d="M474,296 L505,380" stroke-width="6"/>
    <path d="M474,296 L478,266" stroke-width="6"/>
  </g>
  <g stroke="#46464e" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M462,262 Q480,254 488,266"/>
  </g>
  <circle cx="490" cy="270" r="4.5" fill="#f2c14e" stroke="#c9962d"/>
  <path d="M318,264 L322,272" stroke="#4a4a52" stroke-width="4"/>
  <rect x="300" y="256" width="42" height="11" rx="5" fill="#53535b"/>

  <path fill="none" stroke="#c07d22" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
        d="M310,288 Q352,320 346,375 L356,382">
    <animate attributeName="d" dur="1.1s" repeatCount="indefinite"
      values="M310,288 Q352,320 346,375 L356,382;
              M310,288 Q356,306 368,353 L378,361;
              M310,288 Q356,316 390,375 L400,382;
              M310,288 Q352,322 368,397 L378,404;
              M310,288 Q352,320 346,375 L356,382"/>
  </path>

  <g class="crank">
    <circle cx="368" cy="375" r="24" fill="none" stroke="#4a4a52" stroke-width="4"/>
    <line x1="368" y1="375" x2="390" y2="375" stroke="#4a4a52" stroke-width="5" stroke-linecap="round"/>
    <line x1="368" y1="375" x2="346" y2="375" stroke="#8e8e96" stroke-width="5" stroke-linecap="round"/>
    <rect x="382" y="370" width="16" height="8" rx="2.5" fill="#333333"/>
    <rect x="338" y="370" width="16" height="8" rx="2.5" fill="#6d6d75"/>
  </g>

  <g>
    <circle cx="505" cy="380" r="52" fill="none" stroke="#3a3a44" stroke-width="8"/>
    <circle cx="505" cy="380" r="44" fill="none" stroke="#98a0aa" stroke-width="3"/>
    <g class="w-spokes front" stroke="#b9bfc7" stroke-width="2.5">
      <line x1="463" y1="380" x2="547" y2="380"/>
      <line x1="469" y1="359" x2="541" y2="401"/>
      <line x1="482" y1="341" x2="528" y2="419"/>
      <line x1="505" y1="338" x2="505" y2="422"/>
      <line x1="469" y1="401" x2="541" y2="359"/>
      <line x1="482" y1="419" x2="528" y2="341"/>
    </g>
    <circle cx="505" cy="380" r="7" fill="#5a5f66"/>
  </g>

  <g class="rider">
    <path fill="none" stroke="#e5484d" stroke-width="7" stroke-linecap="round" d="M342,200 Q322,190 306,198">
      <animate attributeName="d" dur="0.9s" repeatCount="indefinite"
        values="M342,200 Q322,190 306,198; M342,200 Q322,202 304,192; M342,200 Q322,190 306,198"/>
    </path>
    <path d="M300,246 L266,240 L278,258 L260,262 L280,268 L276,277 Q290,276 298,268 Z"
          fill="#fdfdf7" stroke="#d3ccbb" stroke-width="2"/>
    <ellipse cx="322" cy="228" rx="48" ry="42" fill="#fdfdf7" stroke="#d3ccbb" stroke-width="2.5"
             transform="rotate(-6 322 228)"/>
    <ellipse cx="306" cy="222" rx="26" ry="20" fill="#ffffff" opacity=".7"/>
    <g class="wing">
      <path d="M296,214 Q266,238 292,264 Q322,258 330,232 Q322,210 296,214 Z"
            fill="#ece6d5" stroke="#d3ccbb" stroke-width="2"/>
      <path d="M298,226 Q282,242 296,252" fill="none" stroke="#d3ccbb" stroke-width="1.8"/>
      <path d="M306,224 Q292,242 304,256" fill="none" stroke="#d3ccbb" stroke-width="1.8"/>
    </g>
    <path d="M344,204 Q356,190 372,188" stroke="#d3ccbb" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M344,204 Q356,190 372,188" stroke="#fdfdf7" stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M338,200 Q354,210 368,204" fill="none" stroke="#e5484d" stroke-width="9" stroke-linecap="round"/>
    <circle cx="376" cy="188" r="17" fill="#fdfdf7" stroke="#d3ccbb" stroke-width="2.5"/>
    <path d="M372,171 q-4,-7 -9,-8 M375,170 q0,-9 -3,-10 M378,171 q3,-7 8,-8"
          fill="none" stroke="#d3ccbb" stroke-width="2" stroke-linecap="round"/>
    <g class="eye">
      <circle cx="377" cy="185" r="4.6" fill="#2e2a28"/>
      <circle cx="378.6" cy="183.4" r="1.4" fill="#ffffff"/>
    </g>
    <path d="M384,182 Q432,177 468,194 Q450,199 388,199 Z"
          fill="#ffb64f" stroke="#e08b1f" stroke-width="1.5" stroke-linejoin="round"/>
    <path fill="#ef8f31" stroke="#d97a1f" stroke-width="1.5" stroke-linejoin="round"
          d="M386,200 Q430,224 464,194 Q450,200 388,201 Z">
      <animate attributeName="d" dur="2.6s" repeatCount="indefinite" keyTimes="0;0.4;0.52;0.66;1"
        values="M386,200 Q430,224 464,194 Q450,200 388,201 Z;
                M386,200 Q430,224 464,194 Q450,200 388,201 Z;
                M386,202 Q434,244 466,196 Q450,202 388,203 Z;
                M386,200 Q430,224 464,194 Q450,200 388,201 Z;
                M386,200 Q430,224 464,194 Q450,200 388,201 Z"/>
    </path>
  </g>

  <path fill="none" stroke="#f4a63c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
        d="M316,286 Q365,315 390,375 L400,382">
    <animate attributeName="d" dur="1.1s" repeatCount="indefinite"
      values="M316,286 Q365,315 390,375 L400,382;
              M316,286 Q360,320 368,397 L378,404;
              M316,286 Q358,318 346,375 L356,382;
              M316,286 Q366,305 368,353 L378,361;
              M316,286 Q365,315 390,375 L400,382"/>
  </path>

  <g>
    <line x1="470" y1="264" x2="464" y2="314" stroke="#a67c3b" stroke-width="3"/>
    <line x1="480" y1="258" x2="500" y2="314" stroke="#a67c3b" stroke-width="3"/>
    <path d="M462,314 L504,314 L496,344 L470,344 Z" fill="#d9a05b" stroke="#b07a34" stroke-width="2" stroke-linejoin="round"/>
    <path d="M466,324 L500,324 M468,334 L498,334 M476,314 L474,344 M484,314 L483,344 M492,314 L491,344"
          stroke="#b07a34" stroke-width="1.5" fill="none" opacity=".6"/>
    <g>
      <path d="M492,306 L479,296 L480,314 Z" fill="#9fb2bc"/>
      <ellipse cx="500" cy="303" rx="15" ry="7" fill="#b8c9d2" stroke="#8fa2ad" stroke-width="1.5"
               transform="rotate(-12 500 303)"/>
      <circle cx="507" cy="299" r="1.6" fill="#33454e"/>
    </g>
  </g>
</svg>
</body>
</html>
