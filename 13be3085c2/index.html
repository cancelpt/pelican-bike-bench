<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕的单车旅行</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      background: #dfeeea;
    }

    main {
      width: min(1200px, 100%);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(38, 70, 83, 0.18);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .cloud-a { animation: cloud-a 42s linear infinite; animation-delay: -14s; }
    .cloud-b { animation: cloud-b 55s linear infinite; animation-delay: -38s; }
    .cloud-c { animation: cloud-c 48s linear infinite; animation-delay: -7s; }
    .road-flow { animation: road-flow 0.58s linear infinite; }
    .chain { animation: chain-flow 0.32s linear infinite; }
    .speed-line { animation: speed-line 1.1s ease-in infinite; }
    .speed-line:nth-child(2) { animation-delay: -0.38s; }
    .speed-line:nth-child(3) { animation-delay: -0.72s; }

    @keyframes cloud-a {
      from { transform: translateX(1300px); }
      to { transform: translateX(-360px); }
    }
    @keyframes cloud-b {
      from { transform: translateX(1750px); }
      to { transform: translateX(-520px); }
    }
    @keyframes cloud-c {
      from { transform: translateX(1400px); }
      to { transform: translateX(-420px); }
    }
    @keyframes road-flow {
      to { transform: translateX(-320px); }
    }
    @keyframes chain-flow {
      to { stroke-dashoffset: -18; }
    }
    @keyframes speed-line {
      0% { transform: translateX(45px); opacity: 0; }
      25% { opacity: 0.7; }
      100% { transform: translateX(-65px); opacity: 0; }
    }

    @media (max-width: 640px) {
      body { padding: 0; }
      main { border-radius: 0; }
    }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 1200 700" role="img" aria-labelledby="scene-title scene-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="scene-title">鹈鹕骑自行车</title>
      <desc id="scene-desc">一只戴头盔、系围巾的鹈鹕在乡间公路上骑自行车。车轮转动，双脚踩踏板，围巾随风摆动，云朵和道路不断向后移动。</desc>

      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#a9dfe5"/>
          <stop offset="0.72" stop-color="#e9f3df"/>
          <stop offset="1" stop-color="#f8e9bf"/>
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#55717a"/>
          <stop offset="1" stop-color="#364f5a"/>
        </linearGradient>
        <linearGradient id="body-fill" x1="0.2" y1="0" x2="0.8" y2="1">
          <stop offset="0" stop-color="#fffdf4"/>
          <stop offset="0.62" stop-color="#f7f3e7"/>
          <stop offset="1" stop-color="#dce5df"/>
        </linearGradient>
        <linearGradient id="bill-fill" x1="0" y1="0" x2="0.8" y2="1">
          <stop offset="0" stop-color="#ffc65c"/>
          <stop offset="1" stop-color="#ed8b3c"/>
        </linearGradient>
        <linearGradient id="pouch-fill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f7ae62"/>
          <stop offset="1" stop-color="#ed7f62"/>
        </linearGradient>
        <radialGradient id="sun-glow">
          <stop offset="0" stop-color="#fff4ae" stop-opacity="0.75"/>
          <stop offset="1" stop-color="#fff4ae" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft-shadow" x="-30%" y="-100%" width="160%" height="300%">
          <feGaussianBlur stdDeviation="8"/>
        </filter>
        <clipPath id="road-clip">
          <rect x="0" y="585" width="1200" height="115"/>
        </clipPath>

        <g id="cloud" fill="#fffdf4">
          <ellipse cx="0" cy="14" rx="75" ry="23"/>
          <circle cx="-34" cy="0" r="31"/>
          <circle cx="10" cy="-17" r="43"/>
          <circle cx="52" cy="5" r="28"/>
        </g>

        <g id="wheel">
          <circle r="105" fill="#f7fbf5" fill-opacity="0.12" stroke="#263f49" stroke-width="11"/>
          <circle r="96" fill="none" stroke="#d5e3de" stroke-width="3"/>
          <g stroke="#91a9ab" stroke-width="2">
            <line x1="0" y1="-94" x2="0" y2="94"/>
            <line x1="0" y1="-94" x2="0" y2="94" transform="rotate(30)"/>
            <line x1="0" y1="-94" x2="0" y2="94" transform="rotate(60)"/>
            <line x1="0" y1="-94" x2="0" y2="94" transform="rotate(90)"/>
            <line x1="0" y1="-94" x2="0" y2="94" transform="rotate(120)"/>
            <line x1="0" y1="-94" x2="0" y2="94" transform="rotate(150)"/>
          </g>
          <circle r="13" fill="#e5eeea" stroke="#263f49" stroke-width="4"/>
          <circle r="4" fill="#263f49"/>
          <rect x="-6" y="-83" width="12" height="25" rx="5" fill="#ffd75e" stroke="#263f49" stroke-width="2"/>
        </g>
      </defs>

      <!-- 天空与远景 -->
      <rect width="1200" height="700" fill="url(#sky)"/>
      <circle cx="984" cy="126" r="112" fill="url(#sun-glow)"/>
      <circle cx="984" cy="126" r="55" fill="#ffe58a"/>
      <circle cx="968" cy="108" r="34" fill="#fff0ac" opacity="0.65"/>

      <g opacity="0.83" transform="translate(0 112)">
        <g class="cloud-a"><use href="#cloud"/></g>
      </g>
      <g opacity="0.63" transform="translate(0 210) scale(0.7)">
        <g class="cloud-b"><use href="#cloud"/></g>
      </g>
      <g opacity="0.5" transform="translate(0 62) scale(0.52)">
        <g class="cloud-c"><use href="#cloud"/></g>
      </g>

      <g fill="none" stroke="#699da0" stroke-width="3" stroke-linecap="round" opacity="0.55">

        <path d="M220 171q8-9 16 0q8-9 16 0"/>
      </g>

      <path d="M0 415L106 321L183 379L300 262L401 370L506 292L640 409L766 287L872 376L1001 252L1200 405V535H0Z" fill="#b7d7c3"/>
      <path d="M0 447L140 373L239 432L381 340L496 426L629 351L746 438L910 345L1031 417L1139 361L1200 395V548H0Z" fill="#91c2a7"/>

      <circle cx="790" cy="478" r="10" fill="#dce8e2" stroke="#263f49" stroke-width="4"/>

      <!-- 车把与车座 -->

      <!-- 牙盘与曲柄 -->
      <g transform="translate(560 478)">
        <circle r="30" fill="#f3ead6" stroke="#344c53" stroke-width="4"/>
        <circle r="21" fill="none" stroke="#8ba09e" stroke-width="3" stroke-dasharray="4 4"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.05s" repeatCount="indefinite"/>
          <path d="M-31 0H31" stroke="#344c53" stroke-width="7" stroke-linecap="round"/>
          <circle cx="31" r="6" fill="#e9b44f" stroke="#344c53" stroke-width="2"/>
          <circle cx="-31" r="6" fill="#e9b44f" stroke="#344c53" stroke-width="2"/>
        </g>
        <circle r="7" fill="#344c53"/>
      </g>

      <!-- 远侧腿 -->
      <path d="M503 337L545 403L529 478" fill="none" stroke="#d98b43" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="d" dur="1.05s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="
          M503 337L545 403L529 478;
          M503 337L553 383L538 456;
          M503 337L568 378L560 447;
          M503 337L581 392L582 456;
          M503 337L576 407L591 478;
          M503 337L574 416L582 500;
          M503 337L559 417L560 509;
          M503 337L540 414L538 500;
          M503 337L545 403L529 478"/>
      </path>

      <!-- 远侧脚踏与脚 -->
      <g transform="translate(560 478)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.05s" repeatCount="indefinite"/>
          <g transform="translate(-31 0)">
            <g>
              <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.05s" repeatCount="indefinite"/>
              <path d="M-14 4H14" stroke="#263f49" stroke-width="5" stroke-linecap="round"/>
              <path d="M-13-6C-7-10 2-10 9-6L24-2L13 1L25 6L7 6L-9 3Z" fill="#dfa04d" stroke="#654f3b" stroke-width="2" stroke-linejoin="round"/>
            </g>
          </g>
        </g>
      </g>

      <!-- 近侧腿 -->
      <path d="M528 337L579 400L591 478" fill="none" stroke="#f2a84d" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="d" dur="1.05s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="
          M528 337L579 400L591 478;
          M528 337L588 410L582 500;
          M528 337L587 414L560 509;
          M528 337L568 418L538 500;
          M528 337L548 409L529 478;
          M528 337L552 385L538 456;
          M528 337L577 379L560 447;
          M528 337L592 385L582 456;
          M528 337L579 400L591 478"/>
      </path>

      <!-- 近侧脚踏与脚 -->
      <g transform="translate(560 478)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.05s" repeatCount="indefinite"/>
          <g transform="translate(31 0)">
            <g>
              <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.05s" repeatCount="indefinite"/>
              <path d="M-14 4H14" stroke="#263f49" stroke-width="5" stroke-linecap="round"/>
              <path d="M-13-6C-7-10 2-10 9-6L24-2L13 1L25 6L7 6L-9 3Z" fill="#f4ad4e" stroke="#654f3b" stroke-width="2" stroke-linejoin="round"/>
              <path d="M7-4L17-2M7 0L17 4" fill="none" stroke="#d77c3e" stroke-width="1.5" stroke-linecap="round"/>
            </g>
          </g>
        </g>
      </g>

      <!-- 鹈鹕身体、头部和翅膀一起轻轻起伏 -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" keyTimes="0;0.5;1" dur="0.525s" repeatCount="indefinite"/>

        <!-- 尾羽 -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-3 447 282;4 447 282;-3 447 282" dur="0.8s" repeatCount="indefinite"/>
          <path d="M457 272Q416 253 385 219Q391 259 438 292Z" fill="#e7ece3" stroke="#40565a" stroke-width="3" stroke-linejoin="round"/>
          <path d="M459 284Q412 280 374 259Q397 296 447 305Z" fill="#f7f4e9" stroke="#40565a" stroke-width="3" stroke-linejoin="round"/>
          <path d="M452 292L395 276" stroke="#b9c9c1" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- 握车把的翅膀 -->

      <!-- 前景小石子 -->
      <g fill="#263f49" opacity="0.35">
        <ellipse cx="371" cy="594" rx="9" ry="3"/>
        <ellipse cx="839" cy="601" rx="7" ry="2.5"/>

  </main>
</body>
</html>
