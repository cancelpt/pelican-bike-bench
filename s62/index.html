<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(#87ceeb 0%, #cfeefb 55%, #fef9e7 100%);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
  }
  h1 {
    color: #1a5276;
    font-size: clamp(20px, 4vw, 34px);
    letter-spacing: .12em;
    margin-bottom: 6px;
    text-shadow: 0 2px 0 rgba(255,255,255,.7);
  }
  p.sub { color: #5d7a8a; font-size: 14px; margin-bottom: 14px; letter-spacing: .08em; }
  .stage {
    width: min(96vw, 900px);
    filter: drop-shadow(0 18px 18px rgba(26,82,118,.18));
  }
  svg { width: 100%; height: auto; display: block; }

  /* ===== 动画定义 ===== */
  /* 车轮自转 */
  @keyframes spin { to { transform: rotate(360deg); } }
  .wheel { animation: spin 1.1s linear infinite; }
  .wheel-rear  { transform-origin: 235px 378px; }
  .wheel-front { transform-origin: 565px 378px; }

  /* 曲柄 / 脚踏自转（与车轮同速视觉协调，略快） */
  .crank { animation: spin 0.9s linear infinite; transform-origin: 385px 378px; }

  /* 整体骑行上下颠簸 */
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }
  .rider { animation: bob .45s ease-in-out infinite; }

  /* 鹈鹕身体轻微前倾摇摆 */
  @keyframes lean {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(1.4deg); }
  }
  .pelican-body { animation: lean .9s ease-in-out infinite; transform-origin: 390px 250px; }

  /* 翅膀扇动（扶把的那只做小幅摆动） */
  @keyframes wingFlap {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-7deg); }
  }
  .wing { animation: wingFlap .9s ease-in-out infinite; transform-origin: 360px 235px; }

  /* 喉囊晃动 */
  @keyframes pouch {
    0%, 100% { transform: rotate(0deg) scale(1); }
    50%      { transform: rotate(2deg) scale(1.03, .97); }
  }
  .pouch { animation: pouch .9s ease-in-out infinite; transform-origin: 478px 168px; }

  /* 头部点动 */
  @keyframes headBob {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    50%      { transform: translate(2px, 3px) rotate(1.5deg); }
  }
  .head { animation: headBob .9s ease-in-out infinite; transform-origin: 470px 150px; }

  /* 腿踩踏：前后交替伸缩 */
  @keyframes pedalLegA {
    0%, 100% { transform: rotate(14deg); }
    50%      { transform: rotate(-18deg); }
  }
  @keyframes pedalLegB {
    0%, 100% { transform: rotate(-18deg); }
    50%      { transform: rotate(14deg); }
  }
  .leg-a { animation: pedalLegA .9s ease-in-out infinite; transform-origin: 388px 292px; }
  .leg-b { animation: pedalLegB .9s ease-in-out infinite; transform-origin: 398px 292px; }

  /* 地面 / 景物向后流动，营造前进感 */
  @keyframes scrollGround { to { transform: translateX(-240px); } }
  .ground-move { animation: scrollGround 1.2s linear infinite; }
  @keyframes scrollCloud { to { transform: translateX(-1000px); } }
  .clouds { animation: scrollCloud 26s linear infinite; }
  .clouds-fast { animation: scrollCloud 17s linear infinite; }

  /* 太阳光晕 */
  @keyframes sunPulse {
    0%, 100% { transform: scale(1); opacity: .55; }
    50%      { transform: scale(1.12); opacity: .35; }
  }
  .sun-halo { animation: sunPulse 3s ease-in-out infinite; transform-origin: 770px 82px; }

  /* 速度线 */
  @keyframes speed {
    0%   { transform: translateX(30px); opacity: 0; }
    25%  { opacity: .8; }
    100% { transform: translateX(-120px); opacity: 0; }
  }
  .speed line { animation: speed .7s linear infinite; }
  .speed line:nth-child(2) { animation-delay: .22s; }
  .speed line:nth-child(3) { animation-delay: .44s; }

  /* 小旗帜飘动 */
  @keyframes flag {
    0%, 100% { transform: skewY(0deg); }
    50%      { transform: skewY(-6deg); }
  }
  .flag { animation: flag .5s ease-in-out infinite; transform-origin: 218px 268px; }
</style>
</head>
<body>
  <h1>🚲 鹈鹕骑行记 🪶</h1>
  <p class="sub">纯 SVG + CSS 2D 动画 · 车轮转动 · 脚踏踩踏 · 翅膀扇动 · 景物后移</p>

  <div class="stage">
  <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只白色鹈鹕骑着橙色自行车">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7ec8f2"/>
        <stop offset=".6" stop-color="#cfeefb"/>
        <stop offset="1" stop-color="#fef6d8"/>
      </linearGradient>
      <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="1" stop-color="#e8eef2"/>
      </linearGradient>
      <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ffb347"/>
        <stop offset="1" stop-color="#ff8c1a"/>
      </linearGradient>
      <clipPath id="sceneClip"><rect x="0" y="0" width="800" height="500" rx="18"/></clipPath>
    </defs>

    <g clip-path="url(#sceneClip)">
      <rect width="800" height="500" fill="url(#sky)"/>

      <!-- 太阳 -->
      <circle class="sun-halo" cx="770" cy="82" r="52" fill="#ffe27a"/>
      <circle cx="770" cy="82" r="36" fill="#ffd93b" stroke="#f5b921" stroke-width="3"/>

      <!-- 远山 -->
      <path d="M0 330 L120 250 L240 330 L360 240 L500 330 L620 260 L760 330 L800 300 L800 500 L0 500 Z" fill="#a8d5a2" opacity=".55"/>

      <!-- 云朵（后移循环，两组错位） -->
      <g class="clouds" fill="#ffffff" opacity=".95">
        <g>
          <ellipse cx="120" cy="80" rx="46" ry="20"/><ellipse cx="155" cy="68" rx="34" ry="18"/><ellipse cx="88" cy="70" rx="26" ry="14"/>
          <ellipse cx="480" cy="55" rx="52" ry="20"/><ellipse cx="518" cy="43" rx="34" ry="17"/>
          <ellipse cx="900" cy="80" rx="46" ry="20"/><ellipse cx="935" cy="68" rx="34" ry="18"/><ellipse cx="1280" cy="55" rx="52" ry="20"/>
        </g>
      </g>
      <g class="clouds-fast" fill="#ffffff" opacity=".75">
        <ellipse cx="650" cy="130" rx="38" ry="15"/><ellipse cx="680" cy="120" rx="26" ry="13"/>
        <ellipse cx="1450" cy="130" rx="38" ry="15"/><ellipse cx="1480" cy="120" rx="26" ry="13"/>
      </g>

      <!-- 地面 -->
      <rect x="0" y="418" width="800" height="82" fill="#8bc98a"/>
      <rect x="0" y="418" width="800" height="10" fill="#6fb873"/>
      <rect x="0" y="440" width="800" height="34" fill="#d9c9a3"/>
      <g class="ground-move" stroke="#b8a678" stroke-width="5" stroke-linecap="round">
        <line x1="40" y1="458" x2="130" y2="458"/><line x1="280" y1="458" x2="370" y2="458"/>
        <line x1="520" y1="458" x2="610" y2="458"/><line x1="760" y1="458" x2="850" y2="458"/>
        <line x1="1000" y1="458" x2="1090" y2="458"/>
      </g>
      <g class="ground-move" fill="#5da864">
        <path d="M60 425 l6-14 6 14 z"/><path d="M300 425 l6-14 6 14 z"/><path d="M540 425 l6-14 6 14 z"/><path d="M780 425 l6-14 6 14 z"/><path d="M1020 425 l6-14 6 14 z"/>
      </g>

      <!-- 速度线 -->
      <g class="speed" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
        <line x1="200" y1="200" x2="130" y2="200"/>
        <line x1="180" y1="255" x2="95"  y2="255"/>
        <line x1="210" y1="310" x2="140" y2="310"/>
      </g>

      <!-- ============ 骑行整体（颠簸） ============ -->
      <g class="rider">

        <!-- ===== 自行车 ===== -->
        <g stroke-linecap="round" stroke-linejoin="round">
          <!-- 后轮 -->
          <g class="wheel wheel-rear">
            <circle cx="235" cy="378" r="52" fill="none" stroke="#34495e" stroke-width="7"/>
            <circle cx="235" cy="378" r="44" fill="none" stroke="#bdc3c7" stroke-width="2"/>
            <g stroke="#7f8c8d" stroke-width="3">
              <line x1="235" y1="334" x2="235" y2="422"/><line x1="191" y1="378" x2="279" y2="378"/>
              <line x1="204" y1="347" x2="266" y2="409"/><line x1="266" y1="347" x2="204" y2="409"/>
            </g>
            <circle cx="235" cy="378" r="8" fill="#34495e"/>
          </g>
          <!-- 前轮 -->
          <g class="wheel wheel-front">
            <circle cx="565" cy="378" r="52" fill="none" stroke="#34495e" stroke-width="7"/>
            <circle cx="565" cy="378" r="44" fill="none" stroke="#bdc3c7" stroke-width="2"/>
            <g stroke="#7f8c8d" stroke-width="3">
              <line x1="565" y1="334" x2="565" y2="422"/><line x1="521" y1="378" x2="609" y2="378"/>
              <line x1="534" y1="347" x2="596" y2="409"/><line x1="596" y1="347" x2="534" y2="409"/>
            </g>
            <circle cx="565" cy="378" r="8" fill="#34495e"/>
          </g>

          <!-- 车架 -->
          <g fill="none" stroke="#e67e22" stroke-width="9">
            <path d="M235 378 L385 378 L300 268 Z"/>       <!-- 后三角 + 下管 -->
            <path d="M385 378 L520 285 L565 378"/>          <!-- 上管/前叉意向 -->
            <path d="M300 268 L385 378"/>
          </g>
          <path d="M520 285 L565 378" fill="none" stroke="#d35400" stroke-width="8"/> <!-- 前叉 -->
          <!-- 车座 -->
          <path d="M278 262 q22 -10 44 0 q-6 10 -22 10 q-16 0 -22 -10" fill="#5d4037"/>
          <line x1="300" y1="268" x2="300" y2="282" stroke="#5d4037" stroke-width="6"/>
          <!-- 车把 -->
          <path d="M505 268 q28 -16 42 2 q-20 4 -30 12" fill="none" stroke="#34495e" stroke-width="7"/>
          <line x1="520" y1="285" x2="512" y2="266" stroke="#34495e" stroke-width="7"/>
          <!-- 曲柄脚踏 -->
          <g class="crank">
            <circle cx="385" cy="378" r="11" fill="#34495e"/>
            <line x1="385" y1="378" x2="408" y2="352" stroke="#34495e" stroke-width="6"/>
            <line x1="385" y1="378" x2="362" y2="404" stroke="#34495e" stroke-width="6"/>
            <rect x="396" y="344" width="26" height="8" rx="4" fill="#2c3e50"/>
            <rect x="350" y="404" width="26" height="8" rx="4" fill="#2c3e50"/>
          </g>
          <!-- 后座小旗 -->
          <line x1="218" y1="330" x2="218" y2="268" stroke="#7f8c8d" stroke-width="4"/>
          <path class="flag" d="M218 268 L252 278 L218 290 Z" fill="#e74c3c"/>
          <!-- 车筐里的鱼 -->
          <path d="M528 300 h64 l-10 34 h-44 z" fill="#a0522d" opacity=".9"/>
          <path d="M540 282 q14 -12 26 0 q-13 8 -26 0" fill="#5dade2"/>
          <circle cx="560" cy="278" r="2.5" fill="#1a5276"/>
        </g>

        <!-- ===== 鹈鹕 ===== -->
        <g class="pelican-body">
          <!-- 尾巴 -->
          <path d="M292 238 q-38 -14 -52 8 q22 20 52 10 z" fill="#dfe8ee" stroke="#b9cbd6" stroke-width="2"/>
          <!-- 远侧腿 -->
          <g class="leg-b">
            <path d="M398 292 q6 30 -4 52" fill="none" stroke="#f39c3a" stroke-width="9" stroke-linecap="round"/>
            <path d="M394 344 l20 4 -18 7 z" fill="#ff8c1a"/>
          </g>

          <!-- 身体 -->
          <ellipse cx="385" cy="245" rx="98" ry="62" fill="url(#bodyGrad)" stroke="#b9cbd6" stroke-width="2.5"/>
          <ellipse cx="360" cy="262" rx="62" ry="34" fill="#f4f8fa"/>

          <!-- 脖子 + 头 -->
          <g class="head">
            <path d="M448 218 q-6 -44 22 -66 q16 -13 30 -2 q-24 16 -26 40 q-1 20 8 34 z" fill="url(#bodyGrad)" stroke="#b9cbd6" stroke-width="2.5"/>
            <!-- 头冠翎毛 -->
            <path d="M472 140 q-8 -16 -22 -18 q10 10 8 20 M482 136 q-2 -18 -14 -24 q6 12 4 22" fill="none" stroke="#dfe8ee" stroke-width="4" stroke-linecap="round"/>
            <circle cx="482" cy="152" r="24" fill="url(#bodyGrad)" stroke="#b9cbd6" stroke-width="2.5"/>
            <!-- 眼睛 + 眼斑 -->
            <circle cx="492" cy="148" r="9" fill="#ffe9b8"/>
            <circle cx="494" cy="149" r="4.5" fill="#1c2833"/>
            <circle cx="496" cy="147" r="1.6" fill="#fff"/>
            <!-- 长喙 -->
            <path d="M498 152 L592 168 L500 170 Z" fill="url(#beakGrad)" stroke="#d35400" stroke-width="2" stroke-linejoin="round"/>
            <path d="M592 168 l14 3 -13 5 z" fill="#c0392b"/>
            <!-- 喉囊 -->
            <path class="pouch" d="M500 168 q44 6 84 4 q-14 26 -44 28 q-32 1 -40 -32" fill="#ffb347" stroke="#e67e22" stroke-width="2" opacity=".95"/>
          </g>

          <!-- 翅膀（扶把） -->
          <g class="wing">
            <path d="M340 218 q70 -26 118 22 q22 22 58 34 l-6 14 q-44 -8 -72 -34 q-42 -36 -98 -22 z" fill="#eef4f7" stroke="#b9cbd6" stroke-width="2.5"/>
            <path d="M360 240 q50 -10 84 18" fill="none" stroke="#c8d8e0" stroke-width="3" stroke-linecap="round"/>
            <!-- 翼尖“手”握把 -->
            <circle cx="516" cy="282" r="9" fill="#f7b731"/>
          </g>

          <!-- 近侧腿（踩踏） -->
          <g class="leg-a">
            <path d="M388 292 q-4 30 8 52" fill="none" stroke="#ffb347" stroke-width="10" stroke-linecap="round"/>
            <path d="M396 344 l22 4 -20 8 z" fill="#ff8c1a" stroke="#d35400" stroke-width="1.5"/>
          </g>
        </g>
      </g>

      <!-- 前景花草掠过 -->
      <g class="ground-move" font-size="20">
        <text x="150" y="492">🌼</text><text x="430" y="496">🌷</text><text x="700" y="492">🌼</text><text x="950" y="496">🌷</text>
      </g>
    </g>
  </svg>
  </div>

  <p class="sub" style="margin-top:12px">用浏览器打开即可播放 · 动画自动循环，无需任何脚本</p>
</body>
</html>
