<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #5aa7dd, #bde3f7);
    font-family: "Comic Sans MS", "Microsoft YaHei", sans-serif;
  }
  svg {
    width: 95%;
    max-width: 900px;
    height: auto;
    border-radius: 18px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    display: block;
  }

  /* 云朵飘动（整组周期 1000px 无缝循环） */
  #clouds { animation: drift 55s linear infinite; }
  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(-1000px); }
  }

  /* 太阳光晕呼吸 */
  .halo { animation: glow 4s ease-in-out infinite; }
  @keyframes glow { 50% { opacity: 0.35; } }

  /* 路面虚线滚动：周期 90px / 地速 215px/s ≈ 0.42s */
  .roaddash {
    stroke-dasharray: 42 48;
    animation: dashmove 0.42s linear infinite;
  }
  @keyframes dashmove { to { stroke-dashoffset: -90; } }

  /* 速度线 */
  .mline {
    stroke-linecap: round;
    animation: mline 0.85s linear infinite;
  }
  .mline:nth-of-type(2) { animation-delay: 0.28s; }
  .mline:nth-of-type(3) { animation-delay: 0.56s; }
  @keyframes mline {
    0%   { opacity: 0; transform: translateX(24px); }
    30%  { opacity: 0.8; }
    100% { opacity: 0; transform: translateX(-64px); }
  }

  /* 喉囊随踩踏微晃 */
  #pouch {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    animation: pouchJiggle 0.63s ease-in-out infinite;
  }
  @keyframes pouchJiggle {
    0%, 100% { transform: scaleY(1); }
    50%      { transform: scaleY(1.07); }
  }
</style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只戴头盔的鹈鹕在乡间公路上骑自行车">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#eaf9ff"/>
    </linearGradient>
    <linearGradient id="bodyGrad" gradientUnits="userSpaceOnUse" x1="0" y1="95" x2="0" y2="262">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe7ee"/>
    </linearGradient>
  </defs>

  <!-- ============ 天空 ============ -->
  <rect x="0" y="0" width="800" height="500" fill="url(#skyGrad)"/>

  <!-- 太阳 -->
  <circle class="halo" cx="700" cy="80" r="55" fill="#ffd93b" opacity="0.45"/>
  <circle cx="700" cy="80" r="38" fill="#ffd93b"/>

  <!-- 云朵（两份内容错开 1000px，实现无缝滚动） -->

    <g>
      <ellipse cx="100" cy="90" rx="42" ry="18"/>
      <ellipse cx="130" cy="78" rx="30" ry="16"/>
      <ellipse cx="65"  cy="80" rx="26" ry="13"/>
      <ellipse cx="380" cy="140" rx="34" ry="14"/>
      <ellipse cx="405" cy="130" rx="22" ry="11"/>
      <ellipse cx="640" cy="62" rx="40" ry="16"/>
      <ellipse cx="668" cy="52" rx="26" ry="12"/>
      <ellipse cx="610" cy="54" rx="24" ry="11"/>
    </g>
    <g>
      <ellipse cx="1100" cy="90" rx="42" ry="18"/>
      <ellipse cx="1130" cy="78" rx="30" ry="16"/>
      <ellipse cx="1065" cy="80" rx="26" ry="13"/>
      <ellipse cx="1380" cy="140" rx="34" ry="14"/>
      <ellipse cx="1405" cy="130" rx="22" ry="11"/>
      <ellipse cx="1640" cy="62" rx="40" ry="16"/>
      <ellipse cx="1668" cy="52" rx="26" ry="12"/>
      <ellipse cx="1610" cy="54" rx="24" ry="11"/>

  <!-- 远处小丘 -->
  <ellipse cx="140" cy="432" rx="220" ry="48" fill="#b7e2a0"/>
  <ellipse cx="640" cy="438" rx="280" ry="60" fill="#a8d88a"/>

  <!-- ============ 地面 ============ -->
  <rect x="0" y="417" width="800" height="83" fill="#7ec850"/>

  <line class="roaddash" x1="0" y1="440" x2="800" y2="440" stroke="#f4f6f8" stroke-width="4"/>

  <!-- 草丛与小花 -->

  <g>
    <circle cx="150" cy="480" r="3.5" fill="#ff8fb1"/><circle cx="150" cy="480" r="1.3" fill="#fff"/>
    <circle cx="390" cy="478" r="3.5" fill="#ffd166"/><circle cx="390" cy="478" r="1.3" fill="#fff"/>
    <circle cx="580" cy="484" r="3.5" fill="#ff8fb1"/><circle cx="580" cy="484" r="1.3" fill="#fff"/>
    <circle cx="720" cy="480" r="3.5" fill="#b388ff"/><circle cx="720" cy="480" r="1.3" fill="#fff"/>
  </g>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="4" fill="none">
    <line class="mline" x1="150" y1="180" x2="205" y2="180"/>
    <line class="mline" x1="120" y1="228" x2="185" y2="228"/>
    <line class="mline" x1="150" y1="275" x2="200" y2="275"/>

  <!-- 整车阴影 -->

  <!-- ============ 远侧腿与曲柄（画在车架后面） ============ -->
  <path id="legFar" d="M 362 252 L 398.7 323.1 L 353.2 388.9"
        fill="none" stroke="#d18a15" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <line id="crankFar" x1="378" y1="372" x2="353.2" y2="388.9"
        stroke="#2f3640" stroke-width="5" stroke-linecap="round"/>
  <g id="pedalFar" transform="translate(353.2 388.9)">
    <rect x="-11" y="-3.5" width="22" height="7" rx="2" fill="#222"/>
    <path d="M -7 -8 L 13 -8 L 18 -5 L 13 -3 L -7 -3 Z" fill="#d18a15"/>
  </g>

  <!-- ============ 自行车 ============ -->
  <g>
    <!-- 后轮 -->
    <circle cx="215" cy="354" r="63" fill="none" stroke="#2d3436" stroke-width="9"/>
    <circle cx="215" cy="354" r="55" fill="none" stroke="#b2bec3" stroke-width="3"/>
    <g id="spokesRear" stroke="#9aa4ad" stroke-width="1.6">
      <line x1="215" y1="354" x2="269" y2="354"/>
      <line x1="215" y1="354" x2="253.2" y2="392.2"/>
      <line x1="215" y1="354" x2="215" y2="408"/>
      <line x1="215" y1="354" x2="176.8" y2="392.2"/>
      <line x1="215" y1="354" x2="161" y2="354"/>
      <line x1="215" y1="354" x2="176.8" y2="315.8"/>
      <line x1="215" y1="354" x2="215" y2="300"/>
      <line x1="215" y1="354" x2="253.2" y2="315.8"/>
      <circle cx="255" cy="354" r="4.5" fill="#f39c12" stroke="none"/>
    </g>
    <circle cx="215" cy="354" r="5.5" fill="#2d3436"/>

    <!-- 前轮 -->
    <circle cx="545" cy="354" r="63" fill="none" stroke="#2d3436" stroke-width="9"/>
    <circle cx="545" cy="354" r="55" fill="none" stroke="#b2bec3" stroke-width="3"/>
    <g id="spokesFront" stroke="#9aa4ad" stroke-width="1.6">
      <line x1="545" y1="354" x2="599" y2="354"/>
      <line x1="545" y1="354" x2="583.2" y2="392.2"/>
      <line x1="545" y1="354" x2="545" y2="408"/>
      <line x1="545" y1="354" x2="506.8" y2="392.2"/>
      <line x1="545" y1="354" x2="491" y2="354"/>
      <line x1="545" y1="354" x2="506.8" y2="315.8"/>
      <line x1="545" y1="354" x2="545" y2="300"/>
      <line x1="545" y1="354" x2="583.2" y2="315.8"/>
      <circle cx="585" cy="354" r="4.5" fill="#f39c12" stroke="none"/>
    </g>
    <circle cx="545" cy="354" r="5.5" fill="#2d3436"/>

    <!-- 车架（红色） -->
    <g stroke="#e74c3c" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M 215 354 L 378 372"/>                       <!-- 后下叉 -->
      <path d="M 215 354 L 305 250"/>                       <!-- 后上叉 -->
      <path d="M 378 372 L 300 244"/>                       <!-- 座管 -->
      <path d="M 378 372 L 505 244"/>                       <!-- 下管 -->
      <path d="M 305 250 L 502 240"/>                       <!-- 上管 -->
      <path d="M 498 232 L 510 252"/>                       <!-- 头管 -->
      <path d="M 508 250 Q 520 300 545 354"/>               <!-- 前叉 -->
      <path d="M 502 240 L 498 226 Q 496 218 488 218"/>     <!-- 车把 -->
    </g>

    <!-- 车座 / 车铃 / 链条 / 牙盘 -->
    <ellipse cx="298" cy="240" rx="20" ry="6" fill="#2f3640"/>
    <circle cx="500" cy="233" r="4.5" fill="#f1c40f" stroke="#b7950b" stroke-width="1.5"/>
    <g stroke="#2d3436" stroke-width="3.5" opacity="0.85">
      <line x1="378" y1="355" x2="215" y2="347"/>
      <line x1="378" y1="389" x2="215" y2="361"/>
    </g>
    <circle cx="215" cy="354" r="7" fill="none" stroke="#2d3436" stroke-width="2.5"/>
    <circle cx="378" cy="372" r="17" fill="none" stroke="#2f3640" stroke-width="3"/>
    <circle cx="378" cy="372" r="4.5" fill="#2f3640"/>

    <!-- 车筐与小鱼 -->
    <line x1="512" y1="234" x2="506" y2="236" stroke="#555" stroke-width="3"/>
    <g>
      <ellipse cx="534" cy="231" rx="13" ry="5.5" fill="#7fd4e8" stroke="#58b7cc" stroke-width="1.2"
               transform="rotate(-15 534 231)"/>
      <polygon points="545,228 556,220 554,232" fill="#6fc6dc"/>
      <circle cx="526" cy="229" r="1.3" fill="#23414d"/>
    </g>
    <polygon points="512,228 556,228 550,252 518,252" fill="#c6862c" stroke="#a8741c" stroke-width="1.5"/>
    <g stroke="#a8741c" stroke-width="1.5" opacity="0.8">
      <line x1="514" y1="236" x2="554" y2="236"/>
      <line x1="515" y1="244" x2="552" y2="244"/>
      <line x1="525" y1="228" x2="523" y2="252"/>
      <line x1="535" y1="228" x2="534" y2="252"/>
      <line x1="545" y1="228" x2="545" y2="252"/>
    </g>
  </g>

  <!-- ============ 鹈鹕（整体随踩踏轻微起伏） ============ -->
  <g id="pelican">
    <!-- 尾羽 -->
    <path d="M 268 190 L 216 172 L 262 194 L 210 190 L 264 204 L 222 210 L 268 216 Z"
          fill="#eef2f6" stroke="#cfd8e0" stroke-width="1.5"/>

    <!-- 身体 -->
    <ellipse cx="330" cy="212" rx="74" ry="46" fill="url(#bodyGrad)" stroke="#cfd8e0" stroke-width="1.5"
             transform="rotate(-8 330 212)"/>

    <!-- 脖子 -->
    <path d="M 356 208 C 398 202 420 172 428 136" fill="none" stroke="#f4f7fa"
          stroke-width="26" stroke-linecap="round"/>

    <!-- 头 / 眼睛 -->
    <circle cx="437" cy="120" r="21" fill="url(#bodyGrad)" stroke="#cfd8e0" stroke-width="1.5"/>
    <circle cx="442" cy="112" r="3.2" fill="#222"/>
    <circle cx="443" cy="111" r="1.1" fill="#fff"/>

    <!-- 头盔 -->
    <g transform="rotate(-8 437 104)">
      <ellipse cx="437" cy="103" rx="22" ry="10.5" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
      <path d="M 428 96 q 9 -4 18 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <path d="M 425 101 q 12 -5 24 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <path d="M 424 108 Q 432 124 446 124" fill="none" stroke="#c0392b" stroke-width="1.5"/>

    <!-- 大嘴 + 喉囊 -->
    <path d="M 446 108 L 534 130 L 450 122 Z" fill="#f5a623" stroke="#d68f12" stroke-width="1"/>
    <g id="pouch">
      <path d="M 450 122 Q 468 162 505 152 Q 526 143 534 130 L 450 122 Z"
            fill="#ee8f1d" stroke="#d68f12" stroke-width="1"/>
    </g>
    <line x1="458" y1="112" x2="505" y2="122" stroke="#d68f12" stroke-width="1.2"/>

    <!-- 翅膀（伸向车把） -->
    <path d="M 350 196 C 396 186 448 196 484 214 C 490 217 490 224 483 225 C 446 227 396 222 352 224 C 341 223 340 200 350 196 Z"
          fill="#f8fafc" stroke="#cfd8e0" stroke-width="1.5"/>
    <g stroke="#d8e0e7" stroke-width="1.3" fill="none">
      <path d="M 380 206 L 460 216"/>
      <path d="M 370 214 L 450 221"/>
    </g>
  </g>

  <!-- ============ 近侧曲柄、踏板与腿（画在最前） ============ -->
  <line id="crankNear" x1="378" y1="372" x2="402.8" y2="355.1"
        stroke="#2f3640" stroke-width="5" stroke-linecap="round"/>
  <g id="pedalNear" transform="translate(402.8 355.1)">
    <rect x="-11" y="-3.5" width="22" height="7" rx="2" fill="#222"/>
    <path d="M -7 -8 L 13 -8 L 18 -5 L 13 -3 L -7 -3 Z" fill="#f6a52d"/>
  </g>
  <path id="legNear" d="M 352 248 L 426 278.4 L 402.8 355.1"
        fill="none" stroke="#f6a52d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 标题 -->
  <text x="400" y="44" text-anchor="middle" font-size="30" font-weight="bold"
        fill="#2c5f8a" font-family="'Comic Sans MS','Microsoft YaHei',sans-serif">🚴 鹈鹕骑行中</text>
</svg>

<script>
  // ============ 几何常量 ============
  const BB      = { x: 378, y: 372 };   // 五通（曲柄中心）
  const REAR    = { x: 215, y: 354 };   // 后轮心
  const FRONT   = { x: 545, y: 354 };   // 前轮心
  const WHEEL_R = 63;
  const CRANK_R = 30;                   // 曲柄长度
  const HIP_N   = { x: 352, y: 248 };   // 近侧髋关节
  const HIP_F   = { x: 362, y: 252 };   // 远侧髋关节
  const L1 = 80, L2 = 80;               // 大腿 / 小腿长度

  const CRANK_W = 2 * Math.PI / 1.25;   // 曲柄角速度：1.25 秒/圈
  const SPEED   = 215;                  // 地面速度 px/s（与路面虚线一致）

  // ============ DOM 引用 ============
  const $ = id => document.getElementById(id);
  const spokesRear  = $('spokesRear'),  spokesFront = $('spokesFront');
  const crankNear   = $('crankNear'),   crankFar    = $('crankFar');
  const pedalNear   = $('pedalNear'),   pedalFar    = $('pedalFar');
  const legNear     = $('legNear'),     legFar      = $('legFar');
  const pelican     = $('pelican');

  // 两连杆逆运动学：给定髋和踏板位置，求膝盖（取更靠前即 x 更大的解）
  function solveKnee(hip, foot) {
    let dx = foot.x - hip.x, dy = foot.y - hip.y;
    let d = Math.hypot(dx, dy);
    d = Math.min(Math.max(d, Math.abs(L1 - L2) + 0.01), L1 + L2 - 0.01);
    const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(L1 * L1 - a * a, 0));
    const ux = dx / d, uy = dy / d;
    const mx = hip.x + a * ux, my = hip.y + a * uy;
    const k1 = { x: mx - h * uy, y: my + h * ux };
    const k2 = { x: mx + h * uy, y: my - h * ux };
    return k1.x > k2.x ? k1 : k2; // 膝盖朝前
  }

  function updateLeg(pathEl, hip, foot) {
    const k = solveKnee(hip, foot);
    pathEl.setAttribute('d',
      `M ${hip.x} ${hip.y} L ${k.x.toFixed(1)} ${k.y.toFixed(1)} L ${foot.x.toFixed(1)} ${foot.y.toFixed(1)}`);
  }

  let crank = -0.6, wheelAngle = 0, last = performance.now();

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    crank += CRANK_W * dt;
    wheelAngle += (SPEED / WHEEL_R) * dt;

    const deg = wheelAngle * 180 / Math.PI;
    spokesRear.setAttribute('transform',  `rotate(${deg.toFixed(2)} ${REAR.x} ${REAR.y})`);
    spokesFront.setAttribute('transform', `rotate(${deg.toFixed(2)} ${FRONT.x} ${FRONT.y})`);

    // 曲柄与踏板（近侧相位 crank，远侧相差 180°）
    const nx = BB.x + CRANK_R * Math.cos(crank), ny = BB.y + CRANK_R * Math.sin(crank);
    const fx = BB.x - CRANK_R * Math.cos(crank), fy = BB.y - CRANK_R * Math.sin(crank);
    crankNear.setAttribute('x2', nx); crankNear.setAttribute('y2', ny);
    crankFar.setAttribute('x2', fx);  crankFar.setAttribute('y2', fy);
    pedalNear.setAttribute('transform', `translate(${nx.toFixed(1)} ${ny.toFixed(1)})`);
    pedalFar.setAttribute('transform',  `translate(${fx.toFixed(1)} ${fy.toFixed(1)})`);

    // 腿部 IK
    updateLeg(legNear, HIP_N, { x: nx, y: ny });
    updateLeg(legFar,  HIP_F, { x: fx, y: fy });

    // 身体随踩踏起伏（每圈两次）
    const bob = 2.2 * Math.sin(2 * crank);
    pelican.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
