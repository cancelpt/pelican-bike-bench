<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 - SVG 2D 动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, #87CEEB 0%, #E0F0FF 40%, #90EE90 60%, #228B22 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  svg { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 太阳光芒 -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7A0"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <!-- 地面渐变 -->
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
  </defs>

  <!-- ===== 天空背景 ===== -->
  <rect x="0" y="0" width="800" height="350" fill="#87CEEB"/>

  <!-- 太阳 -->
  <circle cx="700" cy="80" r="50" fill="url(#sunGlow)"/>
  <circle cx="700" cy="80" r="35" fill="#FFD700"/>
  <!-- 太阳笑脸 -->
  <circle cx="690" cy="75" r="3" fill="#E6A800"/>
  <circle cx="710" cy="75" r="3" fill="#E6A800"/>
  <path d="M690 90 Q700 100 710 90" stroke="#E6A800" stroke-width="2" fill="none"/>

  <!-- ===== 云朵 ===== -->
  <g opacity="0.9">
    <ellipse cx="120" cy="80" rx="40" ry="20" fill="white">
      <animateTransform attributeName="transform" type="translate" values="0,0; 15,0; 0,0" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="150" cy="75" rx="30" ry="18" fill="white">
      <animateTransform attributeName="transform" type="translate" values="0,0; 15,0; 0,0" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="100" cy="85" rx="25" ry="15" fill="white">
      <animateTransform attributeName="transform" type="translate" values="0,0; 15,0; 0,0" dur="8s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <g opacity="0.7">
    <ellipse cx="500" cy="60" rx="35" ry="18" fill="white">
      <animateTransform attributeName="transform" type="translate" values="0,0; -20,0; 0,0" dur="10s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="530" cy="55" rx="28" ry="15" fill="white">
      <animateTransform attributeName="transform" type="translate" values="0,0; -20,0; 0,0" dur="10s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- ===== 远山 ===== -->
  <polygon points="0,280 100,200 200,260 300,190 400,240 500,200 600,250 700,210 800,280 800,350 0,350" fill="#66BB6A" opacity="0.4"/>

  <!-- ===== 地面 ===== -->
  <rect x="0" y="340" width="800" height="160" fill="url(#groundGrad)"/>

  <!-- ===== 小路 ===== -->
  <path d="M0,380 Q200,370 400,385 Q600,400 800,375" stroke="#D2B48C" stroke-width="30" fill="none" opacity="0.6"/>
  <path d="M0,380 Q200,370 400,385 Q600,400 800,375" stroke="#C4A46C" stroke-width="2" fill="none" stroke-dasharray="10,15" opacity="0.8"/>

  <!-- ===== 草丛装饰（背景） ===== -->
  <g opacity="0.6">
    <ellipse cx="80" cy="365" rx="20" ry="8" fill="#388E3C"/>
    <ellipse cx="250" cy="375" rx="15" ry="6" fill="#43A047"/>
    <ellipse cx="600" cy="368" rx="18" ry="7" fill="#388E3C"/>
    <ellipse cx="750" cy="372" rx="22" ry="9" fill="#43A047"/>
  </g>

  <!-- ===== 花朵 ===== -->
  <g>
    <!-- 左边花 -->
    <line x1="50" y1="370" x2="50" y2="350" stroke="#228B22" stroke-width="2"/>
    <circle cx="50" cy="347" r="5" fill="#FF6B6B"/>
    <circle cx="50" cy="347" r="2" fill="#FFD700"/>
    <!-- 右边花 -->
    <line x1="720" y1="375" x2="720" y2="355" stroke="#228B22" stroke-width="2"/>
    <circle cx="720" cy="352" r="5" fill="#FF80AB"/>
    <circle cx="720" cy="352" r="2" fill="#FFD700"/>
    <!-- 中间花 -->
    <line x1="450" y1="390" x2="450" y2="373" stroke="#228B22" stroke-width="2"/>
    <circle cx="450" cy="370" r="4" fill="#CE93D8"/>
    <circle cx="450" cy="370" r="1.5" fill="#FFD700"/>
  </g>

  <!-- ===== 远景小树 ===== -->
  <g opacity="0.5">
    <rect x="155" y="310" width="8" height="30" fill="#5D4037"/>
    <ellipse cx="159" cy="300" rx="18" ry="22" fill="#388E3C"/>
  </g>
  <g opacity="0.4">
    <rect x="625" y="315" width="6" height="25" fill="#5D4037"/>
    <ellipse cx="628" cy="308" rx="14" ry="18" fill="#43A047"/>
  </g>

  <!-- ============================================================ -->
  <!-- ===== 自行车 + 鹈鹕 ===== 整体左右微晃 ===== -->
  <!-- ============================================================ -->
  <g id="bikeAndRider">
    <!-- 整体轻微上下弹跳 -->
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-3; 0,0" dur="0.5s" repeatCount="indefinite"/>

    <!-- ===== 自行车 ===== -->
    <!-- 后轮 -->
    <g transform="translate(340,370)">
      <circle cx="0" cy="0" r="28" fill="none" stroke="#555" stroke-width="3"/>
      <circle cx="0" cy="0" r="26" fill="none" stroke="#888" stroke-width="1"/>
      <!-- 辐条 -->
      <g>
        <line x1="0" y1="-25" x2="0" y2="25" stroke="#999" stroke-width="1"/>
        <line x1="-25" y1="0" x2="25" y2="0" stroke="#999" stroke-width="1"/>
        <line x1="-17" y1="-17" x2="17" y2="17" stroke="#999" stroke-width="1"/>
        <line x1="17" y1="-17" x2="-17" y2="17" stroke="#999" stroke-width="1"/>
        <!-- 旋转动画 -->
        <animateTransform attributeName="transform" type="rotate"
          values="0; 360" dur="0.6s" repeatCount="indefinite"/>
      </g>
      <circle cx="0" cy="0" r="3" fill="#666"/>
    </g>

    <!-- 前轮 -->
    <g transform="translate(460,370)">
      <circle cx="0" cy="0" r="28" fill="none" stroke="#555" stroke-width="3"/>
      <circle cx="0" cy="0" r="26" fill="none" stroke="#888" stroke-width="1"/>
      <g>
        <line x1="0" y1="-25" x2="0" y2="25" stroke="#999" stroke-width="1"/>
        <line x1="-25" y1="0" x2="25" y2="0" stroke="#999" stroke-width="1"/>
        <line x1="-17" y1="-17" x2="17" y2="17" stroke="#999" stroke-width="1"/>
        <line x1="17" y1="-17" x2="-17" y2="17" stroke="#999" stroke-width="1"/>
        <animateTransform attributeName="transform" type="rotate"
          values="0; 360" dur="0.6s" repeatCount="indefinite"/>
      </g>
      <circle cx="0" cy="0" r="3" fill="#666"/>
    </g>

    <!-- 车架 -->
    <g stroke="#E53935" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- 后叉 → 曲柄中心 -->
      <line x1="340" y1="370" x2="395" y2="385"/>
      <!-- 下管：曲柄中心 → 前叉底 -->
      <line x1="395" y1="385" x2="458" y2="370"/>
      <!-- 上管：座管顶 → 头管顶 -->
      <line x1="370" y1="330" x2="448" y2="335"/>
      <!-- 座管 -->
      <line x1="370" y1="330" x2="395" y2="385"/>
      <!-- 头管（前叉上端到前轮） -->
      <line x1="448" y1="335" x2="458" y2="370"/>
      <!-- 前叉延长线 -->
      <line x1="448" y1="335" x2="460" y2="370"/>
    </g>

    <!-- 座垫 -->
    <ellipse cx="368" cy="326" rx="12" ry="4" fill="#333" rx="12"/>

    <!-- 车把 -->
    <path d="M445,332 Q455,320 465,332" stroke="#444" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- 车把套 -->
    <circle cx="445" cy="333" r="3" fill="#222"/>
    <circle cx="465" cy="333" r="3" fill="#222"/>

    <!-- 踏板曲柄组 -->
    <g transform="translate(395,385)">
      <circle cx="0" cy="0" r="4" fill="#555"/>
      <!-- 曲柄臂旋转 -->
      <g>
        <line x1="0" y1="0" x2="0" y2="14" stroke="#666" stroke-width="3" stroke-linecap="round"/>
        <rect x="-5" y="12" width="10" height="4" rx="1" fill="#888"/>
        <line x1="0" y1="0" x2="0" y2="-14" stroke="#666" stroke-width="3" stroke-linecap="round"/>
        <rect x="-5" y="-16" width="10" height="4" rx="1" fill="#888"/>
        <animateTransform attributeName="transform" type="rotate"
          values="0; 360" dur="0.6s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- ===== 鹈鹕 ===== -->
    <g id="pelican">
      <!-- 身体晃动（配合踩踏） -->
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 0,-2; 0,0; 0,1; 0,0" dur="0.6s" repeatCount="indefinite"/>

      <!-- ===== 尾巴 ===== -->
      <path d="M315,310 Q295,295 290,310 Q295,305 305,310" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="1"/>
      <path d="M318,315 Q298,305 293,318 Q298,310 310,315" fill="#EEEEEE" stroke="#BDBDBD" stroke-width="0.5"/>

      <!-- ===== 身体 ===== -->
      <ellipse cx="355" cy="330" rx="40" ry="22" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
      <!-- 身体纹理 -->
      <ellipse cx="365" cy="328" rx="30" ry="16" fill="none" stroke="#EEEEEE" stroke-width="0.5"/>

      <!-- ===== 翅膀 ===== -->
      <g>
        <!-- 左翅（后方） -->
        <path d="M335,320 Q320,310 315,325 Q320,318 335,325" fill="#E8E8E8" stroke="#CCC" stroke-width="0.5"/>
        <!-- 右翅（前方，带动画） -->
        <path d="M345,318 Q330,300 325,322 Q332,310 345,322" fill="#F0F0F0" stroke="#DDD" stroke-width="0.8">
          <animateTransform attributeName="transform" type="rotate"
            values="-2,345,325; 3,345,325; -2,345,325" dur="0.6s" repeatCount="indefinite"/>
        </path>
        <!-- 翅尖羽毛 -->
        <path d="M328,315 L320,308 L325,318" fill="#E0E0E0"/>
      </g>

      <!-- ===== 脖子 ===== -->
      <path d="M370,318 Q385,290 380,265 Q378,255 375,250" stroke="#F5F5F5" stroke-width="14" fill="none" stroke-linecap="round"/>
      <path d="M370,318 Q385,290 380,265 Q378,255 375,250" stroke="#E8E8E8" stroke-width="12" fill="none" stroke-linecap="round"/>
      <!-- 脖子白色内侧 -->
      <path d="M372,316 Q384,292 380,268 Q378,258 376,252" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.5"/>

      <!-- ===== 头 ===== -->
      <ellipse cx="372" cy="245" rx="16" ry="14" fill="white" stroke="#E0E0E0" stroke-width="1"/>
      <!-- 头顶小羽冠 -->
      <path d="M370,232 L368,222 L374,228 L372,220 L378,226" fill="white" stroke="#DDD" stroke-width="0.5"/>

      <!-- ===== 眼睛 ===== -->
      <circle cx="378" cy="241" r="4.5" fill="white" stroke="#CCC" stroke-width="0.5"/>
      <circle cx="379" cy="241" r="2.5" fill="#222"/>
      <circle cx="380" cy="240" r="0.8" fill="white"/>
      <!-- 眉毛 -->
      <path d="M374,236 Q378,234 383,236" stroke="#888" stroke-width="1" fill="none"/>

      <!-- ===== 大嘴巴/鹈鹕喙 ===== -->
      <!-- 上喙 -->
      <path d="M385,245 L415,248 L418,252 L385,250" fill="#FF8F00" stroke="#E65100" stroke-width="1"/>
      <!-- 喙尖弯钩 -->
      <path d="M415,248 Q420,250 418,255 Q416,253 415,250" fill="#F57C00"/>
      <!-- 上喙鼻孔 -->
      <ellipse cx="408" cy="248" rx="2" ry="1" fill="#E65100" opacity="0.5"/>

      <!-- 下喙 + 喉囊 -->
      <path d="M385,252 Q410,255 415,252 Q418,260 410,268 Q395,272 385,258"
        fill="#FFB74D" stroke="#E65100" stroke-width="0.8" opacity="0.9"/>
      <!-- 喉囊纹理 -->
      <path d="M390,256 Q400,262 390,268" stroke="#FF9800" stroke-width="0.5" fill="none" opacity="0.5"/>
      <path d="M396,255 Q406,263 396,270" stroke="#FF9800" stroke-width="0.5" fill="none" opacity="0.5"/>

      <!-- 喉囊开合动画 -->
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 1,1; 0,0; -1,0; 0,0" dur="1.2s" repeatCount="indefinite"/>

      <!-- ===== 脚（踩踏板） ===== -->
      <!-- 左脚 -->
      <g>
        <path d="M395,396 Q395,404 400,406 Q402,404 398,398" fill="#FF8F00" stroke="#E65100" stroke-width="0.8"/>
        <!-- 腿（从身体到踏板） -->
        <line x1="365" y1="345" x2="395" y2="396" stroke="#FF8F00" stroke-width="4" stroke-linecap="round"/>
      </g>
      <!-- 右脚 -->
      <g>
        <path d="M395,374 Q395,366 390,364 Q388,366 392,372" fill="#FF8F00" stroke="#E65100" stroke-width="0.8"/>
        <line x1="375" y1="345" x2="395" y2="374" stroke="#FF8F00" stroke-width="4" stroke-linecap="round"/>
      </g>
    </g>

    <!-- ===== 手握车把 ===== -->
    <!-- 从鹈鹕身体前端到车把的连接手臂 -->
    <path d="M380,320 Q420,310 445,330" stroke="#F5F5F5" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M380,320 Q420,310 445,330" stroke="#E0E0E0" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- 翅尖小手 -->
    <circle cx="445" cy="332" r="3" fill="#E8E8E8" stroke="#DDD" stroke-width="0.5"/>
  </g>

  <!-- ===== 前景装饰小石子 ===== -->
  <ellipse cx="200" cy="400" rx="5" ry="3" fill="#A0896C"/>
  <ellipse cx="550" cy="395" rx="4" ry="2.5" fill="#8B7355"/>
  <ellipse cx="680" cy="388" rx="6" ry="3" fill="#9C8A6E"/>

  <!-- ===== 飞翔的小鸟（远景装饰） ===== -->
  <g opacity="0.5">
    <path d="M100,150 Q105,145 110,150" stroke="#555" stroke-width="1.5" fill="none">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 100,-20; 200,0; 300,-10; 400,5; 500,-15; 600,0; 700,-20; 800,-10"
        dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M150,140 Q155,135 160,140" stroke="#555" stroke-width="1.2" fill="none">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 80,-10; 160,5; 240,-15; 320,0; 400,-10; 480,5; 560,-5; 640,-15; 720,-5"
        dur="14s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ===== 标题 ===== -->
  <text x="400" y="460" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="22" fill="#2E7D32" font-weight="bold" opacity="0.8">
    🚲 鹈鹕的自行车之旅 🦩
  </text>
</svg>
</body>
</html>
