<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <style>
    :root { color-scheme: light; --ink: #29493e; --muted: #7c8879; --paper: #f6f2e8; --orange: #d7764e; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    button { font: inherit; }
    .page { width: min(1240px, calc(100% - 72px)); margin: 0 auto; padding: 34px 0 24px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 12px; font-weight: 700; letter-spacing: .18em; }
    .brand svg { width: 28px; height: 28px; }
    .edition { color: var(--muted); font-size: 11px; letter-spacing: .13em; }
    .intro { display: flex; align-items: center; justify-content: space-between; gap: 28px; margin: 36px 0 27px; }
    h1 { font-family: "Songti SC", "Noto Serif CJK SC", "SimSun", serif; font-size: clamp(30px, 3.1vw, 44px); font-weight: 500; letter-spacing: .04em; margin: 0 0 10px; }
    .intro p { margin: 0; color: var(--muted); font-size: 13px; letter-spacing: .08em; line-height: 1.8; }
    .stamp { display: grid; place-items: center; flex: 0 0 78px; width: 78px; height: 78px; border: 1px solid #d58b61; border-radius: 50%; outline: 1px solid #d58b61; outline-offset: -5px; color: #b9744d; transform: rotate(10deg); }
    .stamp span { text-align: center; font-size: 11px; line-height: 1.7; letter-spacing: .12em; }
    .scene { position: relative; overflow: hidden; aspect-ratio: 1440 / 820; border-radius: 18px; border: 1px solid #d7d9c8; background: #f9edd1; box-shadow: 0 14px 44px #384a3010; }
    .art { display: block; width: 100%; height: 100%; }
    .scene-label { position: absolute; left: 26px; top: 22px; color: #687e68; font-size: 10px; letter-spacing: .18em; line-height: 1.8; pointer-events: none; }
    .scene-label b { display: block; color: #3b5848; font-weight: 500; font-size: 12px; letter-spacing: .1em; }
    .footer { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 20px 2px 0; }
    .caption { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; letter-spacing: .05em; }
    .caption::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #8ba07d; }
    .controls { display: flex; align-items: center; gap: 8px; }
    button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 37px; padding: 8px 14px; border: 1px solid #d9dfcf; border-radius: 24px; background: #fbf9f1; color: var(--ink); cursor: pointer; font-size: 11px; }
    button:hover { background: #e9eddf; border-color: #a9b79a; }
    button:focus-visible { outline: 2px solid var(--orange); outline-offset: 4px; }
    button svg { width: 12px; height: 12px; }
    #speed-label { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 27px; }
    .stroke { stroke: #2d4a3f; stroke-linecap: round; stroke-linejoin: round; }
    .cloud { animation: cloud-float 12s ease-in-out infinite alternate; }
    .cloud.second { animation-duration: 17s; animation-delay: -8s; }
    .coast-track { animation: travel 72s linear infinite; }
    .plant-track { animation: travel 10s linear infinite; }
    .road-track { animation: travel 5s linear infinite; }
    .water-light { animation: water-shimmer 5s ease-in-out infinite alternate; }
    .water-light.second { animation-delay: -3s; }
    .rider { animation: road-bob 1.4s ease-in-out infinite; }
    .bird-head { transform-origin: 747px 325px; animation: head-bob 2.8s ease-in-out infinite; }
    .pouch { transform-origin: 821px 242px; animation: pouch-sway 2.8s ease-in-out infinite; }
    .scarf-tail { transform-origin: 715px 310px; animation: scarf-flutter .7s ease-in-out infinite alternate; }
    .flower-top { transform-origin: 976px 455px; animation: flower-sway 1.4s ease-in-out infinite alternate; }
    .breeze { animation: breeze 2.8s ease-in-out infinite; }
    .breeze.second { animation-delay: -1.4s; }
    @keyframes travel { to { transform: translateX(-1440px); } }
    @keyframes cloud-float { to { transform: translateX(28px); } }
    @keyframes water-shimmer { from { opacity: .35; transform: translateX(-8px); } to { opacity: .8; transform: translateX(12px); } }
    @keyframes road-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
    @keyframes head-bob { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(1deg); } }
    @keyframes pouch-sway { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(1.5deg); } }
    @keyframes scarf-flutter { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }
    @keyframes flower-sway { from { transform: rotate(-2deg); } to { transform: rotate(3deg); } }
    @keyframes breeze { 0%, 100% { opacity: .2; transform: translateX(0); } 50% { opacity: .6; transform: translateX(-12px); } }
    @media (max-width: 700px) {
      .page { width: calc(100% - 28px); padding-top: 23px; }
      .edition { font-size: 9px; letter-spacing: .06em; }
      .brand { font-size: 10px; letter-spacing: .11em; gap: 7px; }
      .intro { margin: 29px 4px 22px; gap: 12px; }
      h1 { font-size: clamp(24px, 6vw, 34px); }
      .intro p { font-size: 11px; letter-spacing: .02em; }
      .stamp { flex-basis: 62px; width: 62px; height: 62px; }
      .stamp span { font-size: 9px; }
      .scene { aspect-ratio: 4 / 5; max-height: 670px; border-radius: 13px; }
      .scene-label { top: 17px; left: 18px; font-size: 8px; }
      .scene-label b { font-size: 10px; }
      .footer { padding-top: 16px; gap: 8px; }
      .caption { font-size: 10px; letter-spacing: 0; gap: 6px; }
      .controls { gap: 5px; }
      button { padding: 8px 10px; gap: 6px; font-size: 10px; }
    }
  </style>
</head>

    <footer class="footer">
      <span class="caption">风很轻，今天没有目的地。</span>
      <div class="controls" aria-label="动画控制">
        <button id="play-toggle" type="button" aria-label="暂停动画"><svg id="play-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 2v8M9 2v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span id="play-label">暂停</span></button>
        <button id="speed-toggle" type="button" aria-label="切换骑行速度，当前 1 倍速"><span id="speed-label">1×</span><span>速度</span></button>
      </div>
    </footer>
  </main>

  <script>
    (() => {
      const get = id => document.getElementById(id);
      const nearLeg = [get('near-leg-outline'), get('near-leg')];
      const farLeg = [get('far-leg-outline'), get('far-leg')];
      const nearFoot = get('near-foot');
      const farFoot = get('far-foot');
      const frontWheel = get('front-wheel');
      const rearWheel = get('rear-wheel');
      const crank = get('crank');
      const playButton = get('play-toggle');
      const speedButton = get('speed-toggle');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const speeds = [1, 1.5, 0.65];
      let speedIndex = 0;
      let paused = reducedMotion.matches;
      let time = 0;
      let lastFrame = null;
      let frameRequest = null;

      // 两段逆向运动学：腿弯曲时，脚掌仍准确落在曲柄端点上。
      function positionLeg(angle, paths, foot) {
        const hipX = 690, hipY = 449;
        const footX = 737 + Math.cos(angle) * 40;
        const footY = 632 + Math.sin(angle) * 40;
        const dx = footX - hipX, dy = footY - hipY;
        const distance = Math.hypot(dx, dy);
        const upper = 118, lower = 120;
        const bend = Math.acos(Math.max(-1, Math.min(1, (upper * upper + distance * distance - lower * lower) / (2 * upper * distance))));
        const direction = Math.atan2(dy, dx) - bend;
        const kneeX = hipX + Math.cos(direction) * upper;
        const kneeY = hipY + Math.sin(direction) * upper;
        const path = `M${hipX} ${hipY}L${kneeX.toFixed(2)} ${kneeY.toFixed(2)}L${footX.toFixed(2)} ${footY.toFixed(2)}`;
        paths.forEach(element => element.setAttribute('d', path));
        foot.setAttribute('transform', `translate(${footX.toFixed(2)} ${footY.toFixed(2)})`);
      }

      function draw() {
        const angle = time * Math.PI * 2 / 1.4;
        const degrees = (angle * 180 / Math.PI) % 360;
        positionLeg(angle, nearLeg, nearFoot);
        positionLeg(angle + Math.PI, farLeg, farFoot);
        crank.setAttribute('transform', `rotate(${degrees})`);
        const wheelRotation = `rotate(${(degrees * 2) % 360})`;
        frontWheel.setAttribute('transform', wheelRotation);
        rearWheel.setAttribute('transform', wheelRotation);
      }

      function tick(now) {
        if (paused) { frameRequest = null; return; }
        if (lastFrame !== null) time += Math.min((now - lastFrame) / 1000, .05) * speeds[speedIndex];
        lastFrame = now;
        draw();
        frameRequest = requestAnimationFrame(tick);
      }

      function synchronize() {
        document.getAnimations().forEach(animation => {
          animation.updatePlaybackRate(speeds[speedIndex]);
          if (paused) animation.pause();
          else animation.play();
        });
        get('play-label').textContent = paused ? '继续' : '暂停';
        playButton.setAttribute('aria-label', paused ? '继续动画' : '暂停动画');
        get('play-icon').innerHTML = paused
          ? '<path d="M3 1.5 10 6 3 10.5Z" fill="currentColor"/>'
          : '<path d="M3 2v8M9 2v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';
        get('speed-label').textContent = `${speeds[speedIndex]}×`;
        speedButton.setAttribute('aria-label', `切换骑行速度，当前 ${speeds[speedIndex]} 倍速`);
        if (paused && frameRequest !== null) { cancelAnimationFrame(frameRequest); frameRequest = null; }
        if (!paused && frameRequest === null) { lastFrame = null; frameRequest = requestAnimationFrame(tick); }
      }

      playButton.addEventListener('click', () => { paused = !paused; synchronize(); });
      speedButton.addEventListener('click', () => { speedIndex = (speedIndex + 1) % speeds.length; synchronize(); });
      reducedMotion.addEventListener('change', event => { paused = event.matches; synchronize(); });
      document.addEventListener('visibilitychange', () => { lastFrame = null; });
      draw();
      synchronize();
    })();
  </script>
