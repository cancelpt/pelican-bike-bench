<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican Coastal Ride</title>
<style>
  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    overflow: hidden;
    background: linear-gradient(180deg, #63c5e8 0%, #bce9f2 62%, #f8eccf 100%);
  }

  .scene {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  .scene::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 140px rgba(16, 76, 99, 0.16);
  }

  svg { display: block; width: 100%; height: 100%; }

  .cloud-a { animation: cloud-drift-a 13s ease-in-out infinite alternate; }
  .cloud-b { animation: cloud-drift-b 19s ease-in-out infinite alternate; }
  .cloud-c { animation: cloud-drift-c 16s ease-in-out infinite alternate; }
  .gull { animation: gull-bob 5.5s ease-in-out infinite alternate; }
  .shore-break { animation: shore-shimmer 7s ease-in-out infinite alternate; }
  .speed-line { animation: speed-flicker 1.4s ease-in-out infinite; }
  .speed-line:nth-child(2) { animation-delay: -0.55s; }
  .speed-line:nth-child(3) { animation-delay: -0.95s; }

  .pouch-jiggle {
    transform-box: view-box;
    transform-origin: 752px 198px;
    animation: pouch-jiggle 2.8s ease-in-out infinite;
  }

  .scarf-tail {
    transform-box: view-box;
    transform-origin: 632px 252px;
    animation: scarf-flutter 2.4s ease-in-out infinite;
  }

  .scarf-tip {
    transform-box: view-box;
    transform-origin: 560px 274px;
    animation: scarf-flutter-tip 2.1s ease-in-out infinite alternate;
  }

  .fish-tail {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: fish-wiggle 1.7s ease-in-out infinite;
  }

  .sway {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: grass-sway 3.8s ease-in-out infinite alternate;
  }

  .sway-slow { animation-duration: 5.2s; animation-delay: -1.4s; }

  .road-dash { animation: road-flow 1.15s linear infinite; }

  .puff {
    transform-box: fill-box;
    transform-origin: center;
    animation: dust-puff 1.8s ease-out infinite;
  }
  .puff:nth-child(2) { animation-delay: -0.6s; }
  .puff:nth-child(3) { animation-delay: -1.2s; }

  @keyframes cloud-drift-a {
    from { transform: translate(0, 0); }
    to { transform: translate(30px, 5px); }
  }
  @keyframes cloud-drift-b {
    from { transform: translate(0, 0); }
    to { transform: translate(-24px, 7px); }
  }
  @keyframes cloud-drift-c {
    from { transform: translate(0, 0); }
    to { transform: translate(18px, -4px); }
  }
  @keyframes gull-bob {
    from { transform: translateY(0); }
    to { transform: translateY(9px); }
  }
  @keyframes shore-shimmer {
    from { opacity: 0.35; transform: translateX(-8px); }
    to { opacity: 0.8; transform: translateX(12px); }
  }
  @keyframes pouch-jiggle {
    0%, 100% { transform: rotate(-1.2deg); }
    50% { transform: rotate(1.4deg); }
  }
  @keyframes scarf-flutter {
    0%, 100% { transform: rotate(-2.5deg) skewY(-1.5deg); }
    50% { transform: rotate(2.5deg) skewY(2deg); }
  }
  @keyframes scarf-flutter-tip {
    from { transform: rotate(-4deg); }
    to { transform: rotate(5deg); }
  }
  @keyframes fish-wiggle {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }
  @keyframes grass-sway {
    from { transform: skewX(-3deg); }
    to { transform: skewX(4deg); }
  }
  @keyframes road-flow {
    to { stroke-dashoffset: -150; }
  }
  @keyframes speed-flicker {
    0%, 100% { opacity: 0; transform: translateX(12px); }
    45% { opacity: 0.65; }
    70% { opacity: 0; transform: translateX(-30px); }
  }
  @keyframes dust-puff {
    0% { opacity: 0; transform: translate(0, 4px) scale(0.4); }
    25% { opacity: 0.6; }
    100% { opacity: 0; transform: translate(-50px, -15px) scale(1.6); }
  }
</style>
</head>

<script>
(() => {
  const sceneSvg = document.querySelector(".scene svg");
  const rearSpin = document.getElementById("rearSpin");
  const frontSpin = document.getElementById("frontSpin");
  const crankSpin = document.getElementById("crankSpin");
  const nearPedal = document.getElementById("nearPedal");
  const farPedal = document.getElementById("farPedal");
  const rider = document.getElementById("rider");

  const nearLeg = {
    under: document.getElementById("nearLegUnder"),
    line: document.getElementById("nearLegLine"),
    knee: document.getElementById("nearKnee"),
    hip: { x: 556, y: 399 },
    upper: 132,
    lower: 146
  };

  const farLeg = {
    under: document.getElementById("farLegUnder"),
    line: document.getElementById("farLegLine"),
    knee: document.getElementById("farKnee"),
    hip: { x: 521, y: 397 },
    upper: 128,
    lower: 143
  };

  const bottomBracket = { x: 585, y: 612 };
  const crankRadius = 46;

  function fitScene() {
    const portrait = window.innerWidth / window.innerHeight < 0.9;
    sceneSvg.setAttribute(
      "preserveAspectRatio",
      portrait ? "xMidYMid meet" : "xMidYMid slice"
    );
  }

  fitScene();
  window.addEventListener("resize", fitScene);

  function solveKnee(hip, foot, upper, lower) {
    const dx = foot.x - hip.x;
    const dy = foot.y - hip.y;
    const rawDistance = Math.hypot(dx, dy) || 1;
    const distance = Math.min(
      Math.max(rawDistance, Math.abs(upper - lower) + 0.01),
      upper + lower - 0.01
    );
    const ux = dx / rawDistance;
    const uy = dy / rawDistance;
    const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
    const offset = Math.sqrt(Math.max(0, upper * upper - along * along));
    return {
      x: hip.x + along * ux + offset * uy,
      y: hip.y + along * uy - offset * ux
    };
  }

  function drawLeg(leg, hip, foot) {
    const knee = solveKnee(hip, foot, leg.upper, leg.lower);
    const path = `M${hip.x.toFixed(2)} ${hip.y.toFixed(2)} L${knee.x.toFixed(2)} ${knee.y.toFixed(2)} L${foot.x.toFixed(2)} ${foot.y.toFixed(2)}`;
    leg.under.setAttribute("d", path);
    leg.line.setAttribute("d", path);
    leg.knee.setAttribute("cx", knee.x.toFixed(2));
    leg.knee.setAttribute("cy", knee.y.toFixed(2));
  }

  function setPedal(pedal, point) {
    pedal.setAttribute("transform", `translate(${point.x.toFixed(2)} ${point.y.toFixed(2)})`);
  }

  const start = performance.now();

  function animate(now) {
    const time = (now - start) / 1000;
    const wheelAngle = (time * 235) % 360;
    const crankDegrees = (time * 105) % 360;
    const crankAngle = (crankDegrees * Math.PI) / 180;

    rearSpin.setAttribute("transform", `rotate(${wheelAngle.toFixed(2)})`);
    frontSpin.setAttribute("transform", `rotate(${wheelAngle.toFixed(2)})`);
    crankSpin.setAttribute("transform", `rotate(${crankDegrees.toFixed(2)})`);

    const nearFoot = {
      x: bottomBracket.x + crankRadius * Math.cos(crankAngle),
      y: bottomBracket.y + crankRadius * Math.sin(crankAngle)
    };
    const farFoot = {
      x: bottomBracket.x + crankRadius * Math.cos(crankAngle + Math.PI),
      y: bottomBracket.y + crankRadius * Math.sin(crankAngle + Math.PI)
    };

    setPedal(nearPedal, nearFoot);
    setPedal(farPedal, farFoot);

    const bob = Math.sin(time * 4.8) * 1.8 + Math.sin(time * 2.3 + 1) * 0.8;
    rider.setAttribute("transform", `translate(0 ${bob.toFixed(2)})`);

    drawLeg(
      nearLeg,
      { x: nearLeg.hip.x, y: nearLeg.hip.y + bob },
      nearFoot
    );

    drawLeg(
      farLeg,
      { x: farLeg.hip.x, y: farLeg.hip.y + bob },
      farFoot
    );

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
})();
</script>
