<!DOCTYPE html>

<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0e141b;
    color: #9aa4b2;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stage {
    margin: 0;
    width: min(96vw, calc(92vh * 16 / 9));
  }
  svg {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 18px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
    cursor: pointer;
    user-select: none;
  }
  figcaption {
    margin-top: 12px;
    font-size: 13px;
    letter-spacing: .02em;
    text-align: center;
    opacity: .8;
  }
  /* 远处海鸟扇翅、帆船摇晃：纯 CSS */
  .bird  { transform-box: fill-box; transform-origin: center; animation: flap .9s ease-in-out infinite alternate; }
  .bird:nth-child(2) { animation-delay: -.3s; }
  .bird:nth-child(3) { animation-delay: -.6s; }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(-.8); } }
  .boat  { transform-box: fill-box; transform-origin: 50% 100%; animation: rock 3.2s ease-in-out infinite alternate; }
  @keyframes rock { from { transform: rotate(-3deg) translateY(0); } to { transform: rotate(3deg) translateY(1.5px); } }
  .glow  { animation: pulse 5s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity: .35; } to { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) {
    .bird, .boat, .glow { animation: none; }
  }
</style>
</head>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $  = id => document.getElementById(id);

  // ---------- 几何常量（与 SVG 中的静态坐标一致） ----------
  const WHEEL_R = 58;
  const REAR  = { x: 352, y: 374 };
  const FRONT = { x: 566, y: 374 };
  const BB    = { x: 440, y: 382 };      // 中轴
  const CRANK = 28;                      // 曲柄长度
  const RING_R = 22, COG_R = 14;         // 牙盘 / 飞轮半径
  const HIP   = { x: 414, y: 280 };      // 髋关节（藏在身体里）
  const THIGH = 71, SHIN = 71;           // 大腿 / 小腿
  const TILE  = 960;

  // ---------- 运动参数：踏频决定一切，车轮与路面速度由传动比推出 ----------
  const CADENCE = 0.5;                                   // 圈 / 秒
  const OMEGA_C = 2 * Math.PI * CADENCE;                 // 曲柄角速度 rad/s
  const OMEGA_W = OMEGA_C * RING_R / COG_R;              // 车轮角速度
  const V       = OMEGA_W * WHEEL_R;                     // 地面速度 px/s
  const CHAIN_PERIOD = 4 + 2.4;                          // 链条虚线周期

  // 视差图层：越近越快
  const layers = [
    { el: $('far'),       f: 0.05 },
    { el: $('waves'),     f: 0.18 },
    { el: $('dunesFar'),  f: 0.30 },
    { el: $('dunesNear'), f: 0.55 },
    { el: $('verge'),     f: 1.15 },
  ];

  // ---------- 生成辐条 ----------
  document.querySelectorAll('.spokes').forEach(g => {
    for (let i = 0; i < 16; i++) {
      const a = i * Math.PI * 2 / 16;
      const l = document.createElementNS(NS, 'line');
      l.setAttribute('x1', (7 * Math.cos(a)).toFixed(2));
      l.setAttribute('y1', (7 * Math.sin(a)).toFixed(2));
      l.setAttribute('x2', (47 * Math.cos(a)).toFixed(2));
      l.setAttribute('y2', (47 * Math.sin(a)).toFixed(2));
      g.appendChild(l);
    }
  });

  const deg = r => (r * 180 / Math.PI);
  const f1  = n => n.toFixed(1);

  // ---------- 两骨骼反向运动学：给定髋与踝，求膝 ----------
  function ik(hip, ankle, L1, L2) {
    let dx = ankle.x - hip.x, dy = ankle.y - hip.y;
    let d = Math.hypot(dx, dy);
    const dMax = L1 + L2 - 0.5, dMin = Math.abs(L1 - L2) + 0.5;
    if (d > dMax || d < dMin) {                 // 够不到时沿方向夹紧
      const s = (d > dMax ? dMax : dMin) / d;
      dx *= s; dy *= s; d = Math.hypot(dx, dy);
      ankle = { x: hip.x + dx, y: hip.y + dy };
    }
    const phi = Math.atan2(dy, dx);
    const a   = Math.acos((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d));
    const k   = phi - a;                        // 减去 → 膝盖朝前（车头方向）
    return { knee: { x: hip.x + L1 * Math.cos(k), y: hip.y + L1 * Math.sin(k) }, ankle };
  }

  function setLeg(side, th, hip) {
    const px = BB.x + CRANK * Math.cos(th);
    const py = BB.y + CRANK * Math.sin(th);
    const crank = $(side + 'Crank');
    crank.setAttribute('x2', f1(px));
    crank.setAttribute('y2', f1(py));
    $(side + 'Pedal').setAttribute('transform', `translate(${f1(px)} ${f1(py)})`);

    const { knee, ankle } = ik(hip, { x: px - 3, y: py - 7 }, THIGH, SHIN);
    $(side + 'Thigh').setAttribute('d', `M${f1(hip.x)} ${f1(hip.y)} L${f1(knee.x)} ${f1(knee.y)}`);
    $(side + 'Shin').setAttribute('d',  `M${f1(knee.x)} ${f1(knee.y)} L${f1(ankle.x)} ${f1(ankle.y)}`);
    const footAng = 10 * Math.sin(th) + 3;      // 下踩时脚尖略朝下
    $(side + 'Foot').setAttribute('transform', `translate(${f1(ankle.x)} ${f1(ankle.y)}) rotate(${f1(footAng)})`);
  }

  const pouchPath = s =>
    `M514 176 C552 176 588 182 616 187 C612 ${f1(196 + s * .6)} 590 ${f1(214 + s)} 556 ${f1(214 + s)} C532 ${f1(214 + s)} 512 ${f1(206 + s * .7)} 506 188 Z`;

  const speedLines = $('speed').querySelectorAll('line');

  // ---------- 每帧渲染 ----------
  function render(t) {
    const thC = OMEGA_C * t, thW = OMEGA_W * t, dist = V * t;
    const rotW = f1(deg(thW) % 360), rotC = f1(deg(thC) % 360);

    $('wheelRear').setAttribute('transform',  `translate(${REAR.x} ${REAR.y}) rotate(${rotW})`);
    $('wheelFront').setAttribute('transform', `translate(${FRONT.x} ${FRONT.y}) rotate(${rotW})`);
    $('ring').setAttribute('transform',       `translate(${BB.x} ${BB.y}) rotate(${rotC})`);
    $('chain').style.strokeDashoffset = f1((thC * RING_R) % CHAIN_PERIOD);
    $('roadDash').style.strokeDashoffset = f1(dist % 64);
    for (const L of layers) L.el.setAttribute('transform', `translate(${f1(-((dist * L.f) % TILE))} 0)`);

    // 身体随蹬踏轻微起伏，头略有滞后
    const bob = 1.6 * Math.sin(2 * thC);
    $('rider').setAttribute('transform', `translate(0 ${f1(bob)})`);
    const hip = { x: HIP.x, y: HIP.y + bob };
    setLeg('near', thC, hip);
    setLeg('far',  thC + Math.PI, hip);

    const nod = 1.6 * Math.sin(2 * thC - 0.7);
    $('head').setAttribute('transform',      `rotate(${f1(nod)} 450 222)`);
    $('headParts').setAttribute('transform', `rotate(${f1(nod)} 450 222)`);
    $('pouch').setAttribute('d', pouchPath(2.4 * Math.sin(2 * thC + 1.2)));
    $('tail').setAttribute('transform',  `rotate(${f1(3 * Math.sin(t * 6))} 358 236)`);
    $('crest').setAttribute('transform', `rotate(${f1(5 * Math.sin(t * 7 + 1))} 488 154)`);
    $('fish').setAttribute('transform',  `rotate(${f1(10 * Math.sin(t * 9))} 590 183)`);

    // 身后的速度线
    speedLines.forEach((ln, i) => {
      const p = (t * 1.6 + i * 0.33) % 1;
      const x = 318 - p * 90, y = 236 + i * 22;
      ln.setAttribute('x1', f1(x - 30)); ln.setAttribute('x2', f1(x));
      ln.setAttribute('y1', y);          ln.setAttribute('y2', y);
      ln.setAttribute('stroke-opacity', f1((1 - p) * 0.55));
    });
  }

  // ---------- 主循环 ----------
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t = reduced ? 0.45 : 0, paused = reduced, last = null;

  function frame(now) {
    if (last === null) last = now;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) t += dt;
    render(t);
    requestAnimationFrame(frame);
  }
  render(t);
  requestAnimationFrame(frame);

  const toggle = () => { paused = !paused; };
  $('scene').addEventListener('click', toggle);
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } });
})();
</script>
</body>
</html>
