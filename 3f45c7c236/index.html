<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: radial-gradient(ellipse at top, #2c3a55 0%, #161c2a 70%);
    font-family: system-ui, -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #e8ecf3;
  }
  h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 4px;
    opacity: .9;
  }
  .stage {
    width: min(95vw, 1000px);
    aspect-ratio: 8 / 5;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .06);
  }
  svg { width: 100%; height: 100%; display: block; cursor: pointer; }
  .controls {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 14px;
    opacity: .9;
  }
  .controls label { display: flex; align-items: center; gap: 10px; }
  input[type="range"] { width: 180px; accent-color: #2a9d8f; }
  #speedVal { width: 3.2em; font-variant-numeric: tabular-nums; }
  button {
    background: #2a9d8f;
    color: #fff;
    border: 0;
    border-radius: 8px;
    padding: 6px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #33b3a3; }
</style>
</head>

    <!-- 近侧曲柄、腿 -->

    <!-- 翅膀握把 -->

      <path d="M298,206 C325,186 380,188 412,206 C442,222 470,234 492,241 L499,250 C472,257 440,256 410,252 C372,249 332,251 302,242 C284,236 283,216 298,206 Z" fill="#efeae1" stroke="#cfc6b6" stroke-width="2" stroke-linejoin="round"/>
      <path d="M310,222 C350,212 400,218 440,232" fill="none" stroke="#ddd5c7" stroke-width="1.5"/>

<div class="controls">
  <label>速度 <input type="range" id="speed" min="0" max="2.5" step="0.05" value="1"> <span id="speedVal">1.0x</span></label>
  <button id="toggle">暂停</button>
</div>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const f1 = n => n.toFixed(1);
  const f2 = n => n.toFixed(2);

  const B = { x: 365, y: 385 };          // 中轴
  const WHEEL_R = 70;
  const CRANK_LEN = 28;
  const GEAR = 9 / 20;                   // 飞轮 / 牙盘
  const BASE_SPEED = 170;                // px/s
  const THIGH = 80, SHIN = 78;
  const TILE = 800;
  const HIP_N = { x: 346, y: 256 }, HIP_F = { x: 336, y: 254 };

  // 辐条
  document.querySelectorAll('.spokes').forEach(g => {
    for (let i = 0; i < 20; i++) {
      const a = (i / 20) * Math.PI * 2;
      const t = (i % 2 ? 1 : -1) * 0.28;
      const l = document.createElementNS(NS, 'line');
      l.setAttribute('x1', f1(Math.cos(a) * 5));
      l.setAttribute('y1', f1(Math.sin(a) * 5));
      l.setAttribute('x2', f1(Math.cos(a + t) * 62));
      l.setAttribute('y2', f1(Math.sin(a + t) * 62));
      g.appendChild(l);
    }
  });

  // 太阳光芒
  const rays = $('rays');
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', f1(670 + Math.cos(a) * 46));
    l.setAttribute('y1', f1(85 + Math.sin(a) * 46));
    l.setAttribute('x2', f1(670 + Math.cos(a) * 60));
    l.setAttribute('y2', f1(85 + Math.sin(a) * 60));
    rays.appendChild(l);
  }

  // 云
  const clouds = [
    { x: 90, y: 70, s: 1, drift: 10, o: .95 },
    { x: 380, y: 45, s: 0.7, drift: 6, o: .85 },
    { x: 560, y: 160, s: 0.85, drift: 8, o: .9 },
    { x: 820, y: 95, s: 1.1, drift: 12, o: .95 },
  ].map(c => {
    const u = document.createElementNS(NS, 'use');
    u.setAttribute('href', '#cloud');
    u.setAttribute('opacity', c.o);
    $('clouds').appendChild(u);
    return { ...c, el: u };
  });

  // 鸟
  const birds = [
    { x: 520, y: 60, s: 1, off: 0 },
    { x: 555, y: 78, s: 0.75, off: 1.3 },
  ].map(b => {
    const p = document.createElementNS(NS, 'path');
    $('birds').appendChild(p);
    return { ...b, el: p };
  });

  // 尘土粒子池
  const dust = [];
  for (let i = 0; i < 16; i++) {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('r', 0);
    $('dust').appendChild(c);
    dust.push({ el: c, life: 1, max: 1, x: 0, y: 0, vx: 0, vy: 0 });
  }

  const els = {
    spinR: $('spinR'), spinF: $('spinF'), ring: $('ring'), chain: $('chain'),
    farHills: $('farHills'), nearHills: $('nearHills'), treeLayer: $('treeLayer'), roadLayer: $('roadLayer'),
    crankN: $('crankN'), crankF: $('crankF'), pedalN: $('pedalN'), pedalF: $('pedalF'),
    upper: $('upper'), wing: $('wing'), headBack: $('headBack'), pHead: $('pHead'),
    pouch: $('pouch'), eye: $('eye'), scarf1: $('scarf1'), scarf2: $('scarf2'),
    speedLines: $('speedLines'),
  };
  const legN = { thigh: $('thighN'), shin: $('shinN'), knee: $('kneeN'), foot: $('footN'), puff: $('puffN') };
  const legF = { thigh: $('thighF'), shin: $('shinF'), knee: $('kneeF'), foot: $('footF'), puff: $('puffF') };

  function setLine(el, a, b) {
    el.setAttribute('x1', f1(a.x)); el.setAttribute('y1', f1(a.y));
    el.setAttribute('x2', f1(b.x)); el.setAttribute('y2', f1(b.y));
  }

  // 两段式反向运动学，膝盖朝前
  function solveLeg(hip, target) {
    const dx = target.x - hip.x, dy = target.y - hip.y;
    const d = Math.max(1, Math.min(Math.hypot(dx, dy), THIGH + SHIN - 0.5));
    const a = Math.atan2(dy, dx);
    const cb = (THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d);
    const ka = a - Math.acos(Math.max(-1, Math.min(1, cb)));
    const knee = { x: hip.x + THIGH * Math.cos(ka), y: hip.y + THIGH * Math.sin(ka) };
    const sa = Math.atan2(target.y - knee.y, target.x - knee.x);
    const ankle = { x: knee.x + SHIN * Math.cos(sa), y: knee.y + SHIN * Math.sin(sa) };
    return { knee, ankle, ka };
  }

  function drawLeg(leg, hip, pedal, c) {
    const { knee, ankle, ka } = solveLeg(hip, { x: pedal.x - 9, y: pedal.y - 8 });
    setLine(leg.thigh, hip, knee);
    setLine(leg.shin, knee, ankle);
    leg.knee.setAttribute('cx', f1(knee.x));
    leg.knee.setAttribute('cy', f1(knee.y));
    const footRot = 6 * Math.sin(c + 0.5) - 3;
    leg.foot.setAttribute('transform', `translate(${f1(ankle.x)} ${f1(ankle.y)}) rotate(${f1(footRot)})`);
    leg.puff.setAttribute('transform', `translate(${f1(hip.x)} ${f1(hip.y)}) rotate(${f1(ka * 180 / Math.PI - 90)})`);
  }

  function placeCrank(arm, pedalEl, angle) {
    const p = { x: B.x + CRANK_LEN * Math.cos(angle), y: B.y + CRANK_LEN * Math.sin(angle) };
    arm.setAttribute('x2', f1(p.x));
    arm.setAttribute('y2', f1(p.y));
    pedalEl.setAttribute('x', f1(p.x - 11));
    pedalEl.setAttribute('y', f1(p.y - 3));
    return p;
  }

  // 飘动的围巾：沿中心线逐段积累角度，再向两侧偏移出宽度
  function scarfPath(phase, off, y0, len, width, flow) {
    const n = 12, seg = len / n;
    const base = Math.PI * (0.6 + 0.38 * flow);
    let x = 380, y = y0, ang = base;
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const k = i / n;
      if (i > 0) {
        ang = base + Math.sin(phase - i * 0.6 + off) * (0.06 + 0.4 * k) * (0.35 + 0.65 * flow);
        x += Math.cos(ang) * seg;
        y += Math.sin(ang) * seg;
      }
      pts.push([x, y, ang, width * (1 - 0.45 * k)]);
    }
    let top = '', bot = '';
    pts.forEach(([px, py, a, w], i) => {
      const nx = -Math.sin(a) * w / 2, ny = Math.cos(a) * w / 2;
      top += (i ? 'L' : 'M') + f1(px + nx) + ',' + f1(py + ny);
      bot = 'L' + f1(px - nx) + ',' + f1(py - ny) + bot;
    });
    const [ex, ey, ea] = pts[n];
    const notch = 'L' + f1(ex - Math.cos(ea) * 5) + ',' + f1(ey - Math.sin(ea) * 5);
    return top + notch + bot + 'Z';
  }

  const state = {
    dist: 0, time: 0, speed: 1, paused: false,
    scarf: 0, nextBlink: 2.5, blinkT: -1, dustAcc: 0,
  };
  let last = performance.now();

  function tick(now) {
    let dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (state.paused) dt = 0;

    const sp = state.speed;
    state.time += dt;
    state.dist += BASE_SPEED * sp * dt;
    const d = state.dist;

    const wheelAng = d / WHEEL_R;
    const c = wheelAng * GEAR;
    const wheelDeg = (wheelAng * 180 / Math.PI) % 360;
    els.spinR.setAttribute('transform', `rotate(${f2(wheelDeg)})`);
    els.spinF.setAttribute('transform', `rotate(${f2(wheelDeg)})`);
    els.ring.setAttribute('transform', `rotate(${f2((c * 180 / Math.PI) % 360)} ${B.x} ${B.y})`);
    els.chain.setAttribute('stroke-dashoffset', f2((c * 20) % 6.5));

    // 视差滚动
    for (const [el, k] of [[els.farHills, 0.06], [els.nearHills, 0.2], [els.treeLayer, 0.45], [els.roadLayer, 1]]) {
      el.setAttribute('transform', `translate(${f2(-((d * k) % TILE))} 0)`);
    }

    for (const cl of clouds) {
      cl.x -= (BASE_SPEED * sp * 0.03 + cl.drift) * dt;
      if (cl.x < -140) cl.x += 1080;
      cl.el.setAttribute('transform', `translate(${f1(cl.x)} ${cl.y}) scale(${cl.s})`);
    }

    for (const b of birds) {
      b.x -= (BASE_SPEED * sp * 0.05 + 18) * dt;
      if (b.x < -40) b.x += 880;
      const flap = 6 * Math.sin(state.time * 9 + b.off);
      const w = 10 * b.s;
      b.el.setAttribute('d', `M${f1(b.x - w)},${b.y} Q${f1(b.x - w / 2)},${f1(b.y - flap * b.s)} ${f1(b.x)},${b.y} Q${f1(b.x + w / 2)},${f1(b.y - flap * b.s)} ${f1(b.x + w)},${b.y}`);
    }

    rays.setAttribute('transform', `rotate(${f2((state.time * 8) % 360)} 670 85)`);

    // 曲柄与腿
    const pN = placeCrank(els.crankN, els.pedalN, c);
    const pF = placeCrank(els.crankF, els.pedalF, c + Math.PI);

    const bob = Math.sin(c * 2) * 1.6;
    drawLeg(legN, { x: HIP_N.x, y: HIP_N.y + bob }, pN, c);
    drawLeg(legF, { x: HIP_F.x, y: HIP_F.y + bob }, pF, c + Math.PI);

    els.upper.setAttribute('transform', `translate(0 ${f2(bob)})`);
    els.wing.setAttribute('transform', `translate(0 ${f2(bob * 0.5)})`);
    const nod = `rotate(${f2(Math.sin(c * 2 + 1) * 2.5)} 392 122)`;
    els.headBack.setAttribute('transform', nod);
    els.pHead.setAttribute('transform', nod);

    const sag = 168 + Math.sin(c * 2 + 1.8) * 3.5;
    els.pouch.setAttribute('d', `M409,117 Q466,121 519,130 Q497,${f1(sag)} 456,${f1(sag - 3)} Q422,${f1(sag - 10)} 410,124 Z`);

    state.scarf += dt * (3 + 8 * sp);
    const flow = Math.min(1, sp / 1.2);
    els.scarf1.setAttribute('d', scarfPath(state.scarf, 0, 171, 95, 12, flow));
    els.scarf2.setAttribute('d', scarfPath(state.scarf, 1.7, 176, 75, 10, flow));

    // 眨眼
    if (state.time > state.nextBlink) {
      state.blinkT = 0;
      state.nextBlink = state.time + 2 + Math.random() * 3.5;
    }
    let eyeScale = 1;
    if (state.blinkT >= 0) {
      state.blinkT += dt;
      const k = state.blinkT / 0.16;
      if (k >= 1) state.blinkT = -1;
      else eyeScale = Math.max(0.08, Math.abs(1 - 2 * k));
    }
    els.eye.setAttribute('transform', `translate(403 103) scale(1 ${f2(eyeScale)}) translate(-403 -103)`);

    // 后轮扬起的尘土
    state.dustAcc += dt * sp;
    if (state.dustAcc > 0.07) {
      state.dustAcc = 0;
      const p = dust.find(q => q.life >= q.max);
      if (p) {
        p.x = 244 + Math.random() * 10;
        p.y = 452 - Math.random() * 3;
        p.vx = -(60 + Math.random() * 60) * sp - 20;
        p.vy = -(10 + Math.random() * 25);
        p.life = 0;
        p.max = 0.6 + Math.random() * 0.4;
      }
    }
    for (const p of dust) {
      if (p.life >= p.max) { p.el.setAttribute('r', 0); continue; }
      p.life += dt;
      const k = Math.min(1, p.life / p.max);
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 20 * dt;
      p.el.setAttribute('cx', f1(p.x));
      p.el.setAttribute('cy', f1(p.y));
      p.el.setAttribute('r', f1(2 + k * 9));
      p.el.setAttribute('opacity', f2(0.45 * (1 - k)));
    }

    els.speedLines.setAttribute('stroke-dashoffset', f1((d * 0.9) % 200));
    els.speedLines.setAttribute('opacity', f2(Math.min(1, sp) * 0.7));

    requestAnimationFrame(tick);
  }

  // 控件
  const speedInput = $('speed'), speedVal = $('speedVal'), toggle = $('toggle');
  speedInput.addEventListener('input', () => {
    state.speed = parseFloat(speedInput.value);
    speedVal.textContent = state.speed.toFixed(1) + 'x';
  });
  function togglePause() {
    state.paused = !state.paused;
    toggle.textContent = state.paused ? '继续' : '暂停';
  }
  toggle.addEventListener('click', togglePause);
  $('scene').addEventListener('click', togglePause);
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  });

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
