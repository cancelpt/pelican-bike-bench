<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · Pelican Riding a Bicycle</title>
<style>
  :root { --outline: #1f2a37; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: radial-gradient(120% 120% at 50% 0%, #1b2634 0%, #0d131b 70%);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #cfe0ef;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px;
  }
  .card {
    width: min(960px, 100%);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
    background: #7ec8f2;
    line-height: 0;
  }
  svg.scene { display: block; width: 100%; height: auto; }
  h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .12em;
    margin: 0;
    opacity: .75;
  }
  p.hint { font-size: 12px; opacity: .4; margin: 0; }

  /* ---------- 滚动的景物（纯平移，无需 transform-origin） ---------- */
  .drift  { animation: slide var(--dur, 30s) linear infinite; animation-delay: var(--dly, 0s); }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-900px); } }

  /* ---------- 骑行者的轻微颠簸 ---------- */
  .bob { animation: bob 1.125s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }

  /* ---------- 路面标线 ---------- */
  .dash {
    stroke-dashoffset: 0;
    animation: dashmove .242s linear infinite;
  }
  @keyframes dashmove { to { stroke-dashoffset: 110px; } }

  /* ---------- 速度线 ---------- */
  .speed { opacity: 0; animation: streak .8s linear infinite; }
  .s1 { animation-delay: 0s; }
  .s2 { animation-delay: .27s; }
  .s3 { animation-delay: .54s; }
  @keyframes streak {
    0%   { transform: translateX(70px);  opacity: 0; }
    22%  { opacity: .8; }
    100% { transform: translateX(-280px); opacity: 0; }
  }
</style>
</head>
<body>

<div class="card">
<svg class="scene" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="一只鹈鹕骑着自行车的二维动画">
  <title>鹈鹕骑自行车</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#4fb0e8"/>
      <stop offset="55%" stop-color="#9ad7f5"/>
      <stop offset="100%" stop-color="#e2f5ff"/>
    </linearGradient>

    <!-- 云 -->
    <g id="cloudA" fill="#ffffff" opacity=".92">
      <ellipse cx="0"   cy="0"  rx="54" ry="23"/>
      <ellipse cx="-36" cy="8"  rx="34" ry="16"/>
      <ellipse cx="38"  cy="9"  rx="38" ry="15"/>
      <ellipse cx="4"   cy="-16" rx="32" ry="19"/>
    </g>
    <g id="cloudB" fill="#ffffff" opacity=".85">
      <ellipse cx="0"   cy="0"  rx="38" ry="16"/>
      <ellipse cx="-26" cy="6"  rx="24" ry="11"/>
      <ellipse cx="26"  cy="6"  rx="26" ry="11"/>
      <ellipse cx="2"   cy="-10" rx="22" ry="13"/>
    </g>

    <!-- 远山 -->
    <path id="hillFar" d="M0,442 L0,394 C58,354 118,346 178,374 C228,398 258,390 300,362
      C350,328 420,332 470,370 C510,400 546,406 590,380 C650,346 700,342 750,372
      C800,402 850,400 900,370 L900,442 Z" fill="#a3d5ad"/>
    <!-- 近山 -->
    <path id="hillNear" d="M0,444 L0,414 C70,392 120,404 176,418 C236,432 286,414 340,398
      C400,380 456,394 512,414 C566,432 620,424 676,406 C736,386 796,396 850,416
      C872,424 888,428 900,430 L900,444 Z" fill="#77c287"/>

    <!-- 灌木丛 -->
    <g id="bushRow" fill="#4fae63">
      <ellipse cx="40"  cy="438" rx="26" ry="15"/>
      <ellipse cx="66"  cy="440" rx="18" ry="11"/>
      <ellipse cx="180" cy="441" rx="20" ry="12"/>
      <ellipse cx="330" cy="439" rx="28" ry="16"/>
      <ellipse cx="358" cy="442" rx="18" ry="10"/>
      <ellipse cx="520" cy="440" rx="22" ry="13"/>
      <ellipse cx="700" cy="438" rx="30" ry="17"/>
      <ellipse cx="730" cy="442" rx="20" ry="11"/>
      <ellipse cx="840" cy="441" rx="18" ry="11"/>
    </g>
  </defs>

  <!-- ================= 天空 ================= -->
  <rect width="900" height="520" fill="url(#sky)"/>

  <!-- 太阳 -->
  <g>
    <circle cx="110" cy="86" r="70" fill="#fff3b0" opacity=".35"/>
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 110 86" to="360 110 86" dur="70s" repeatCount="indefinite"/>
      <g stroke="#ffd166" stroke-width="7" stroke-linecap="round">
        <line x1="110" y1="24"  x2="110" y2="6"/>
        <line x1="110" y1="148" x2="110" y2="166"/>
        <line x1="48"  y1="86"  x2="30"  y2="86"/>
        <line x1="172" y1="86"  x2="190" y2="86"/>
        <line x1="66"  y1="42"  x2="53"  y2="29"/>
        <line x1="154" y1="130" x2="167" y2="143"/>
        <line x1="154" y1="42"  x2="167" y2="29"/>
        <line x1="66"  y1="130" x2="53"  y2="143"/>
      </g>
    </g>
    <circle cx="110" cy="86" r="44" fill="#ffd166"/>
    <circle cx="110" cy="86" r="44" fill="none" stroke="#f7b733" stroke-width="3"/>
  </g>

  <!-- 云（两份首尾相接，无缝循环） -->
  <g transform="translate(150,78)">
    <g class="drift" style="--dur:38s;--dly:-6s">
      <use href="#cloudA"/>
      <use href="#cloudA" transform="translate(900,0)"/>
    </g>
  </g>
  <g transform="translate(520,132)">
    <g class="drift" style="--dur:29s;--dly:-19s">
      <use href="#cloudB"/>
      <use href="#cloudB" transform="translate(900,0)"/>
    </g>
  </g>
  <g transform="translate(760,58)">
    <g class="drift" style="--dur:44s;--dly:-31s">
      <use href="#cloudB"/>
      <use href="#cloudB" transform="translate(900,0)"/>
    </g>
  </g>

  <!-- 远处飞鸟 -->
  <g fill="none" stroke="#3d5666" stroke-width="3" stroke-linecap="round" opacity=".55">
    <path d="M640,112 q9,-8 17,0 q8,-8 17,0"/>
    <path d="M700,96  q7,-6 13,0 q6,-6 13,0"/>
  </g>

  <!-- ================= 地面 ================= -->
  <rect x="0" y="436" width="900" height="34" fill="#66bd72"/>

  <!-- 远山 -->
  <g class="drift" style="--dur:17s">
    <use href="#hillFar"/>
    <use href="#hillFar" transform="translate(900,0)"/>
  </g>
  <!-- 近山 -->
  <g class="drift" style="--dur:9s;--dly:-4s">
    <use href="#hillNear"/>
    <use href="#hillNear" transform="translate(900,0)"/>
  </g>
  <!-- 灌木 -->
  <g class="drift" style="--dur:6s;--dly:-2.2s">
    <use href="#bushRow"/>
    <use href="#bushRow" transform="translate(900,0)"/>

  <!-- 马路 -->

  <!-- ================= 速度线 ================= -->

    <rect class="speed s2" x="70"  y="318" width="76" height="6" rx="3"/>
    <rect class="speed s3" x="170" y="186" width="64" height="6" rx="3"/>
  </g>

  <!-- 扬尘（后轮） -->
  <g fill="#cfd8dc" opacity=".7">
    <circle cx="272" cy="462" r="1">
      <animate attributeName="cx" values="272;214" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="462;436" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="r"  values="2;17"    dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".75;0" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="272" cy="462" r="1">

      <animate attributeName="r"  values="2;12"    dur="1.1s" begin="-0.74s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0" dur="1.1s" begin="-0.74s" repeatCount="indefinite"/>
    </circle>

  <!-- ================= 远侧腿（在车架之后） ================= -->
  <g transform="translate(385,292)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-39.61;-48.60;-62.51;-80.47;-92.17;-86.03;-66.94;-44.75;-39.61"
        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        calcMode="spline"
        keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"
        dur="2.25s" repeatCount="indefinite"/>
      <path d="M0,0 L0,74" stroke="#1f2a37" stroke-width="20" stroke-linecap="round" fill="none"/>
      <path d="M0,0 L0,74" stroke="#dd8a3a" stroke-width="13" stroke-linecap="round" fill="none"/>
      <g transform="translate(0,74)">
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="30.62;60.37;88.28;105.11;101.97;80.86;51.44;23.94;30.62"
            keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
            calcMode="spline"
            keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"
            dur="2.25s" repeatCount="indefinite"/>
          <path d="M0,0 L0,82" stroke="#1f2a37" stroke-width="18" stroke-linecap="round" fill="none"/>
          <path d="M0,0 L0,82" stroke="#dd8a3a" stroke-width="12" stroke-linecap="round" fill="none"/>
          <g transform="translate(0,82)">
            <g>
              <animateTransform attributeName="transform" type="rotate"
                values="8.99;-11.77;-25.77;-24.64;-9.79;5.17;15.50;20.80;8.99"
                keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
                calcMode="spline"
                keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"
                dur="2.25s" repeatCount="indefinite"/>
              <rect x="-16" y="3" width="36" height="9" rx="4" fill="#3c4a54" stroke="#1f2a37" stroke-width="2.5"/>
              <path d="M-9,-8 Q2,-13 12,-6 L20,4 Q10,12 -7,8 Z" fill="#e08a2e" stroke="#1f2a37" stroke-width="3" stroke-linejoin="round"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- ================= 自行车 ================= -->
  <g id="bike">
    <!-- 车轮 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 320 400" to="360 320 400" dur="0.9s" repeatCount="indefinite"/>
      <circle cx="320" cy="400" r="65" fill="none" stroke="#232a31" stroke-width="10"/>
      <circle cx="320" cy="400" r="57" fill="none" stroke="#cdd5dd" stroke-width="4"/>
      <g stroke="#e2e8ef" stroke-width="2.6">
        <line x1="320" y1="345" x2="320" y2="455"/>
        <line x1="265" y1="400" x2="375" y2="400"/>
        <line x1="281" y1="361" x2="359" y2="439"/>
        <line x1="281" y1="439" x2="359" y2="361"/>
        <line x1="297" y1="350" x2="343" y2="450"/>
        <line x1="270" y1="377" x2="370" y2="423"/>
        <line x1="297" y1="450" x2="343" y2="350"/>
        <line x1="270" y1="423" x2="370" y2="377"/>
      </g>
      <circle cx="320" cy="400" r="13" fill="#90a4ae" stroke="#1f2a37" stroke-width="2.5"/>
      <circle cx="320" cy="400" r="4"  fill="#546e7a"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 560 400" to="360 560 400" dur="0.9s" repeatCount="indefinite"/>
      <circle cx="560" cy="400" r="65" fill="none" stroke="#232a31" stroke-width="10"/>
      <circle cx="560" cy="400" r="57" fill="none" stroke="#cdd5dd" stroke-width="4"/>
      <g stroke="#e2e8ef" stroke-width="2.6">
        <line x1="560" y1="345" x2="560" y2="455"/>
        <line x1="505" y1="400" x2="615" y2="400"/>
        <line x1="521" y1="361" x2="599" y2="439"/>
        <line x1="521" y1="439" x2="599" y2="361"/>
        <line x1="537" y1="350" x2="583" y2="450"/>
        <line x1="510" y1="377" x2="610" y2="423"/>
        <line x1="537" y1="450" x2="583" y2="350"/>
        <line x1="510" y1="423" x2="610" y2="377"/>
      </g>
      <circle cx="560" cy="400" r="7" fill="#90a4ae" stroke="#1f2a37" stroke-width="2.5"/>
      <circle cx="560" cy="400" r="2.6" fill="#546e7a"/>
    </g>

    <!-- 链条 -->
    <g stroke="#8fa3ad" stroke-width="3.5" fill="none" stroke-linecap="round">
      <path d="M445,368 L320,387"/>
      <path d="M445,432 L320,413"/>
    </g>

    <!-- 车架 -->
    <g stroke="#e63946" stroke-width="9" stroke-linecap="round" fill="none">
      <line x1="320" y1="400" x2="445" y2="400"/>   <!-- 链支 -->
      <line x1="445" y1="400" x2="386" y2="300"/>   <!-- 座管 -->
      <line x1="320" y1="400" x2="386" y2="306"/>   <!-- 座支 -->
      <line x1="388" y1="300" x2="547" y2="296"/>   <!-- 上管 -->
      <line x1="445" y1="400" x2="550" y2="322"/>   <!-- 下管 -->
      <line x1="552" y1="325" x2="546" y2="294"/>   <!-- 头管 -->
      <line x1="552" y1="325" x2="560" y2="400"/>   <!-- 前叉 -->
    </g>
    <g stroke="#b02334" stroke-width="3" stroke-linecap="round" fill="none" opacity=".55">
      <line x1="388" y1="300" x2="547" y2="296"/>
      <line x1="445" y1="400" x2="550" y2="322"/>
    </g>

    <!-- 车把 -->
    <g stroke="#37474f" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="546" y1="294" x2="550" y2="272"/>
      <path d="M550,271 Q566,261 574,272"/>

    <circle cx="575" cy="273" r="6" fill="#263238"/>

      <circle cx="445" cy="400" r="8" fill="#546e7a" stroke="#1f2a37" stroke-width="2.5"/>
    </g>
  </g>

  <!-- ================= 鹈鹕 ================= -->
  <g class="bob">

    <!-- 远侧翅膀（扶车把） -->
    <path d="M430,240 C476,231 528,242 566,261 C573,265 571,275 562,276
             C536,277 500,269 470,265 C452,262 436,259 428,255 Z"
          fill="#dfe5ec" stroke="#1f2a37" stroke-width="3" stroke-linejoin="round"/>

    <!-- 尾羽 -->
    <path d="M346,234 L298,212 L305,238 L290,252 L348,264 Z"
          fill="#eaeef3" stroke="#1f2a37" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#c3ccd6" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M338,240 L310,224"/>
      <path d="M338,252 L304,246"/>

    <!-- 脖子 -->
    <path d="M436,236 C452,206 462,178 490,164" fill="none" stroke="#1f2a37" stroke-width="34" stroke-linecap="round"/>
    <path d="M436,236 C452,206 462,178 490,164" fill="none" stroke="#fbfbf6" stroke-width="27" stroke-linecap="round"/>

    <!-- 头 -->
    <circle cx="496" cy="156" r="27" fill="#fbfbf6" stroke="#1f2a37" stroke-width="3.5"/>

    <!-- 喙 + 喉囊 -->
    <path d="M503,138 C548,136 606,148 646,163 L652,170
             C640,175 626,176 610,174 C575,170 528,163 502,157 Z"

    <path d="M506,157 C514,213 566,235 612,213 C632,203 645,185 649,171

          fill="#ffc247" stroke="#1f2a37" stroke-width="3" stroke-linejoin="round"/>
    <path d="M528,150 C556,152 586,157 612,163" fill="none" stroke="#e07b1a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 眼睛（会眨） -->
    <path d="M497,135 Q507,129 517,135" fill="none" stroke="#1f2a37" stroke-width="3" stroke-linecap="round"/>
    <circle cx="506" cy="148" r="7.5" fill="#1f2a37"/>
    <circle cx="508.5" cy="145.5" r="2.6" fill="#ffffff"/>
    <ellipse cx="506" cy="148" rx="8.6" ry="0" fill="#fbfbf6">
      <animate attributeName="ry" values="0;0;8.6;0" keyTimes="0;0.9;0.94;1"
               dur="4.5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- 近侧翅膀 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-4 432 226;5 432 226;-4 432 226"
        keyTimes="0;0.5;1" calcMode="spline"
        keySplines="0.4 0 0.6 1;0.4 0 0.6 1"
        dur="1.6s" repeatCount="indefinite"/>
      <path d="M428,228 C452,250 450,288 416,300 C384,311 352,296 348,270
               C344,246 372,222 404,219 C416,218 422,222 428,228 Z"
            fill="#eaeef3" stroke="#1f2a37" stroke-width="3.5" stroke-linejoin="round"/>
      <g stroke="#c3ccd6" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M424,286 C404,294 378,290 360,278"/>
        <path d="M430,266 C410,274 384,270 366,258"/>
        <path d="M428,246 C410,254 388,250 374,240"/>
      </g>
    </g>

    <!-- 围巾 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-5 438 206;5 438 206;-5 438 206"
        keyTimes="0;0.5;1" calcMode="spline"
        keySplines="0.35 0 0.65 1;0.35 0 0.65 1"
        dur="0.7s" repeatCount="indefinite"/>
      <path d="M436,202 C400,220 366,194 322,202 C342,213 338,232 312,238
               C356,247 402,232 446,224 Z"
            fill="#e63946" stroke="#1f2a37" stroke-width="3" stroke-linejoin="round"/>
