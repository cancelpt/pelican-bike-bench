<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕的海风骑行</title>
  <style>
    :root {
      --ink: #17364a;
      --cream: #fff9e9;
      --coral: #ff6b5f;
      --orange: #f7a33c;
      --teal: #087f8c;
      --road: #43606a;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #a7e1e7;
      font-family: ui-rounded, "Nunito", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #9edee8;
      isolation: isolate;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .controls {
      position: absolute;
      z-index: 10;
      top: clamp(14px, 2.5vw, 28px);
      right: clamp(14px, 2.5vw, 30px);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .control-button {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 44px;
      padding: 0 17px;
      color: var(--ink);
      background: rgba(255, 249, 233, .88);
      border: 2px solid rgba(23, 54, 74, .12);
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(22, 73, 88, .14);
      backdrop-filter: blur(8px);
      cursor: pointer;
      font: 800 14px/1 inherit;
      letter-spacing: .03em;
      transition: transform .18s ease, background .18s ease;
    }

    .control-button:hover { transform: translateY(-2px); background: #fffdf4; }
    .control-button:active { transform: translateY(0); }
    .control-button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    .control-icon {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      font-size: 13px;
    }

    .title-card {
      position: absolute;
      z-index: 8;
      left: clamp(18px, 4vw, 54px);
      top: clamp(18px, 6vh, 52px);
      pointer-events: none;
      color: var(--ink);
      text-shadow: 0 2px 0 rgba(255,255,255,.25);
    }

    .title-card h1 {
      margin: 0;
      font-size: clamp(24px, 4.4vw, 58px);
      line-height: .96;
      letter-spacing: -.045em;
      font-weight: 950;
    }

    .title-card p {
      margin: 10px 0 0 3px;
      font-size: clamp(11px, 1.3vw, 16px);
      letter-spacing: .22em;
      font-weight: 800;
      color: rgba(23,54,74,.68);
    }

    .cloud-track { animation: clouds 28s linear infinite; }
    .far-track { animation: far-land 22s linear infinite; }
    .near-track { animation: near-land 10s linear infinite; }
    .wave-track { animation: waves 7s ease-in-out infinite alternate; }
    .sun-rays { animation: sun-turn 26s linear infinite; transform-origin: 835px 116px; }
    .bike-bob { animation: bike-bob .62s ease-in-out infinite alternate; }
    .rider-bob { animation: rider-bob .62s ease-in-out infinite alternate; transform-origin: 470px 340px; }
    .wheel-spin { animation: wheel-turn .82s linear infinite; }
    .pedal-spin { animation: wheel-turn .82s linear infinite; transform-origin: 497px 468px; }
    .leg-front { animation: leg-front .82s ease-in-out infinite; transform-origin: 470px 340px; }
    .leg-back { animation: leg-back .82s ease-in-out infinite; transform-origin: 444px 342px; }
    .wing { animation: wing .86s ease-in-out infinite alternate; transform-origin: 425px 274px; }
    .head { animation: head-nod 2.25s ease-in-out infinite; transform-origin: 545px 215px; }
    .scarf-tail-a { animation: scarf-a .72s ease-in-out infinite alternate; transform-origin: 509px 230px; }
    .scarf-tail-b { animation: scarf-b .58s ease-in-out infinite alternate-reverse; transform-origin: 510px 236px; }
    .pouch { animation: pouch 2.25s ease-in-out infinite; transform-origin: 618px 196px; }
    .eye-glint { animation: blink 4.6s ease-in-out infinite; transform-origin: 574px 157px; }
    .road-lines { animation: lane-move .82s linear infinite; }
    .road-specks { animation: specks .82s linear infinite; }
    .reed { animation: reed-sway 1.7s ease-in-out infinite alternate; transform-origin: bottom; }
    .bird-one { animation: bird-fly 2.2s ease-in-out infinite alternate; }
    .bird-two { animation: bird-fly 1.8s .4s ease-in-out infinite alternate-reverse; }

    @keyframes clouds { to { transform: translateX(-520px); } }
    @keyframes far-land { to { transform: translateX(-360px); } }
    @keyframes near-land { to { transform: translateX(-420px); } }
    @keyframes waves { to { transform: translateX(-24px); } }
    @keyframes sun-turn { to { transform: rotate(360deg); } }
    @keyframes wheel-turn { to { transform: rotate(360deg); } }
    @keyframes bike-bob { to { transform: translateY(-2.5px) rotate(-.15deg); } }
    @keyframes rider-bob { to { transform: translateY(-4px) rotate(.45deg); } }
    @keyframes leg-front {
      0%, 100% { transform: rotate(7deg); }
      50% { transform: rotate(-8deg); }
    }
    @keyframes leg-back {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(7deg); }
    }
    @keyframes wing { to { transform: rotate(-6deg) translateY(-3px); } }
    @keyframes head-nod {
      0%, 42%, 100% { transform: rotate(0); }
      50%, 66% { transform: rotate(3deg) translateY(1px); }
    }
    @keyframes scarf-a { to { transform: rotate(8deg) scaleX(.93); } }
    @keyframes scarf-b { to { transform: rotate(-7deg) scaleX(1.04); } }
    @keyframes pouch {
      0%, 42%, 100% { transform: scaleY(1); }
      55%, 68% { transform: scaleY(1.05); }
    }
    @keyframes blink {
      0%, 42%, 46%, 100% { transform: scaleY(1); }
      44% { transform: scaleY(.08); }
    }
    @keyframes lane-move { to { stroke-dashoffset: 92; } }
    @keyframes specks { to { transform: translateX(-160px); } }
    @keyframes reed-sway { to { transform: rotate(3deg); } }
    @keyframes bird-fly { to { transform: translateY(-6px); } }

    body.is-paused * { animation-play-state: paused !important; }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
      .control-button { display: none; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="一只鹈鹕迎着海风骑自行车的循环动画">
    <div class="title-card" aria-hidden="true">
      <h1>海风骑行</h1>
      <p>PELICAN ON WHEELS</p>

    <div class="controls">

        <span class="control-label">暂停</span>
      </button>
    </div>

    <svg viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="sceneTitle sceneDesc">

        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">

          <stop offset="1" stop-color="#f8e6bd"/>

        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#55c5cf"/>
          <stop offset="1" stop-color="#188fa1"/>
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#55727a"/>
          <stop offset="1" stop-color="#2f4d59"/>
        </linearGradient>
        <linearGradient id="pouchFill" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffd070"/>
          <stop offset="1" stop-color="#f28b38"/>
        </linearGradient>
        <linearGradient id="wingFill" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fffdf2"/>
          <stop offset="1" stop-color="#e9dfc8"/>
        </linearGradient>
        <radialGradient id="sunGlow">
          <stop offset="0" stop-color="#fff7bd" stop-opacity=".9"/>
          <stop offset=".45" stop-color="#ffe47d" stop-opacity=".36"/>
          <stop offset="1" stop-color="#ffe47d" stop-opacity="0"/>
        </radialGradient>
        <filter id="softShadow" x="-40%" y="-50%" width="180%" height="220%">
          <feGaussianBlur stdDeviation="7"/>
        </filter>
        <filter id="bikeShadow" x="-30%" y="-100%" width="160%" height="300%">
          <feGaussianBlur stdDeviation="6"/>
        </filter>
        <clipPath id="roadClip">
          <path d="M0 411H1000V620H0Z"/>
        </clipPath>
      </defs>

      <!-- Sky and sun -->
      <rect width="1000" height="620" fill="url(#sky)"/>
      <circle cx="835" cy="116" r="118" fill="url(#sunGlow)"/>
      <g class="sun-rays" fill="#ffe377" opacity=".72">
        <rect x="831" y="23" width="8" height="25" rx="4"/>
        <rect x="831" y="184" width="8" height="25" rx="4"/>
        <rect x="742" y="112" width="25" height="8" rx="4"/>
        <rect x="903" y="112" width="25" height="8" rx="4"/>
        <rect x="773" y="48" width="8" height="23" rx="4" transform="rotate(-45 777 59.5)"/>
        <rect x="889" y="162" width="8" height="23" rx="4" transform="rotate(-45 893 173.5)"/>
        <rect x="775" y="160" width="8" height="23" rx="4" transform="rotate(45 779 171.5)"/>
        <rect x="887" y="49" width="8" height="23" rx="4" transform="rotate(45 891 60.5)"/>

        </g>
        <g transform="translate(1335 94) scale(.72)">
          <ellipse cx="0" cy="15" rx="51" ry="18"/>
          <circle cx="-28" cy="3" r="21"/>
          <circle cx="4" cy="-7" r="31"/>
          <circle cx="34" cy="5" r="23"/>
        </g>
      </g>

      <!-- Tiny seabirds -->

        <circle cx="792" cy="464" r="2.8"/><circle cx="865" cy="557" r="2"/><circle cx="946" cy="506" r="3"/>
        <circle cx="1054" cy="494" r="3"/><circle cx="1133" cy="546" r="2"/><circle cx="1194" cy="460" r="2.6"/>
      </g>

      <!-- Foreground grass -->
      <g class="near-track">
        <g class="reed" fill="none" stroke="#355f58" stroke-linecap="round">

          <path d="M44 359q-5-15 4-23q10 9-3 24M94 367q5-15-4-23q-10 9 3 24M17 388q-5-13 3-20q9 8-2 22" fill="#d39a55" stroke="none"/>

      <!-- Bicycle + rider -->

        <!-- Wheels -->

          <!-- Neck and head -->

  <script>
    const toggle = document.querySelector('#motionToggle');
    const icon = toggle.querySelector('.control-icon');
    const label = toggle.querySelector('.control-label');

    function setPaused(paused) {
      document.body.classList.toggle('is-paused', paused);
      toggle.setAttribute('aria-pressed', String(paused));
      toggle.setAttribute('aria-label', paused ? '继续动画' : '暂停动画');
      icon.textContent = paused ? '▶' : 'Ⅱ';
      label.textContent = paused ? '继续' : '暂停';
    }

    toggle.addEventListener('click', () => {
      setPaused(!document.body.classList.contains('is-paused'));
    });

    window.addEventListener('keydown', (event) => {
      if (event.code === 'Space' && event.target === document.body) {
        event.preventDefault();
        toggle.click();
      }
    });
  </script>
