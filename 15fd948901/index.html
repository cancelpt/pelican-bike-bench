<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f1e8">
  <title>Pelican Cycle Club — 一路好风光</title>
  <style>
    :root {
      --paper: #f5f1e8;
      --ink: #193f3d;
      --muted: #6d7a6e;
      --orange: #ee7947;
      --line: #d7d9cb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--paper);
      font-family: "Trebuchet MS", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(1440px, 100%);
      min-height: 100svh;
      margin: 0 auto;
      padding: 0 5.4vw;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      min-height: 92px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      text-decoration: none;
    }

    .brand svg { width: 37px; height: 37px; }

    .brand-name {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2.4px;
    }

    .edition {
      display: flex;
      align-items: center;
      gap: 20px;
      color: #667369;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .edition span:first-child {
      padding-right: 20px;
      border-right: 1px solid var(--line);
    }

    .intro {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 32px;
      padding: 38px 0 20px;
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 11px;
      color: var(--orange);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2.8px;
    }

    .eyebrow::before {
      content: "";
      width: 22px;
      height: 2px;
      background: currentColor;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(52px, 6.2vw, 91px);
      font-weight: 400;
      line-height: .95;
      letter-spacing: -4.7px;
    }

    h1 em {
      color: var(--orange);
      font-weight: 400;
    }

    .intro-note {
      width: 218px;
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.9;
      letter-spacing: 1px;
    }

    .intro-note strong {
      display: block;
      margin-bottom: 4px;
      color: var(--ink);
      font-size: 11px;
      letter-spacing: 1.8px;
    }

    .scene {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .footer {
      min-height: 76px;
      margin-top: -5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-top: 1px solid var(--line);
    }

    .motto {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #788074;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.9px;
    }

    .motto-dot {
      width: 7px;
      height: 7px;
      background: var(--orange);
      border-radius: 50%;
    }

    .controls { display: flex; align-items: center; gap: 25px; }

    .speed {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #758074;
      font-size: 10px;
      letter-spacing: 1px;
    }

    .speed button {
      padding: 5px 3px;
      border: 0;
      color: inherit;
      background: none;
      font: inherit;
      cursor: pointer;
      transition: color .2s;
    }

    .speed button:hover, .speed button[aria-pressed="true"] { color: var(--orange); }
    .speed button:focus-visible, .pause:focus-visible { outline: 2px solid var(--orange); outline-offset: 4px; }

    .pause {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-width: 112px;
      padding: 11px 17px;
      border: 1px solid var(--ink);
      border-radius: 100px;
      background: transparent;
      color: var(--ink);
      font: 700 10px/1 "Trebuchet MS", "PingFang SC", sans-serif;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background .2s, color .2s;
    }

    .pause:hover { background: var(--ink); color: var(--paper); }
    .pause svg { width: 11px; height: 11px; }
    .play-icon { display: none; }
    .pause[aria-pressed="true"] .play-icon { display: block; }
    .pause[aria-pressed="true"] .pause-icon { display: none; }

    /* All motion stays inside the illustration. */
    .rider { animation: rider-bob 4.84s ease-in-out infinite; }
    .body-feathers { animation: feather-breathe 2.4s ease-in-out infinite; transform-origin: 493px 341px; }
    .scarf-tail { animation: scarf-wave .85s ease-in-out infinite alternate; transform-origin: 528px 214px; }
    .pouch { animation: pouch-sway 4.84s ease-in-out infinite; transform-origin: 623px 187px; }
    .cloud-one { animation: cloud-drift 32s linear infinite; }
    .cloud-two { animation: cloud-drift 43s linear infinite; animation-delay: -20s; }
    .far-bird { animation: bird-glide 8s ease-in-out infinite; }
    .water-lines { animation: water-slide 4s linear infinite; }
    .road-dashes { animation: road-roll 1.1s linear infinite; }
    .road-speckles { animation: road-roll 1.1s linear infinite; }
    .grass-left { animation: grass-pass 7s linear infinite; }
    .grass-right { animation: grass-pass 7s linear infinite; animation-delay: -3.5s; }
    .flower { animation: flower-nod 2s ease-in-out infinite alternate; transform-origin: bottom; transform-box: fill-box; }
    .wheel-shine { animation: shine 2s ease-in-out infinite; }

    @keyframes rider-bob {
      0%, 50%, 100% { transform: translateY(0) rotate(-.3deg); }
      25%, 75% { transform: translateY(-4px) rotate(.3deg); }
    }
    @keyframes feather-breathe { 50% { transform: rotate(-2deg); } }
    @keyframes scarf-wave { to { transform: rotate(6deg) scaleY(.9); } }
    @keyframes pouch-sway { 50% { transform: rotate(1.6deg); } }
    @keyframes cloud-drift { from { transform: translateX(-250px); } to { transform: translateX(1450px); } }
    @keyframes bird-glide { 50% { transform: translate(16px, -8px); } }
    @keyframes water-slide { to { transform: translateX(-60px); } }
    @keyframes road-roll { to { transform: translateX(-140px); } }
    @keyframes grass-pass { from { transform: translateX(1400px); } to { transform: translateX(-300px); } }
    @keyframes flower-nod { to { transform: rotate(5deg); } }
    @keyframes shine { 50% { opacity: .35; } }

    .paused .scene *, .paused .scene { animation-play-state: paused !important; }

    @media (min-width: 1600px) {
      .page { padding-inline: 76px; }
    }

    @media (max-width: 800px) {
      .page { padding-inline: 6vw; }
      .topbar { min-height: 76px; }
      .intro { padding-top: 30px; gap: 20px; }
      h1 { letter-spacing: -3px; }
      .intro-note { width: 160px; font-size: 11px; }
      .intro-note strong { font-size: 10px; }
      .edition span:first-child { display: none; }
      .scene { width: calc(100% + 8vw); margin-left: -4vw; }
      .speed { display: none; }
    }

    @media (max-width: 540px) {
      .page { padding-inline: 22px; }
      .topbar { min-height: 70px; }
      .brand-name { font-size: 10px; letter-spacing: 1.8px; }
      .brand svg { width: 31px; height: 31px; }
      .edition { font-size: 8px; letter-spacing: 1.4px; }
      .intro { display: block; padding: 32px 0 12px; }
      .eyebrow { font-size: 8px; letter-spacing: 2px; }
      h1 { font-size: clamp(49px, 15.5vw, 76px); letter-spacing: -2.8px; }
      .intro-note { width: auto; margin: 17px 0 0; line-height: 1.6; }
      .intro-note strong { display: inline; margin-right: 8px; }
      .intro-note br { display: none; }
      .scene { width: 170%; max-width: none; margin-left: -35%; }
      .footer { min-height: 75px; margin-top: 0; }
      .motto { max-width: 160px; font-size: 8px; line-height: 1.8; letter-spacing: 1.3px; }
      .pause { min-width: 93px; padding: 10px 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene *, .scene { animation: none !important; }
      .pause { display: none; }
      .speed { display: none; }
    }
  </style>
</head>
<body>
  <main class="page" id="page">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Pelican Cycle Club 首页">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="18.5" fill="none" stroke="currentColor" stroke-width="1"/>
          <path d="M11 21c1-6 6-10 11-8 4 1 5 5 3 8l9 1-9 4c-5 5-14 2-14-5Z" fill="currentColor"/>
          <circle cx="23" cy="17" r="1.2" fill="#f5f1e8"/>
          <path d="m22 24 12-2-8 5" fill="#ee7947"/>
        </svg>
        <span class="brand-name">PELICAN CYCLE CLUB</span>
      </a>
      <div class="edition">
        <span>EST. BY THE SEA</span>
        <span>ISSUE Nº 001</span>
      </div>

    <section class="intro" aria-labelledby="title">

      <p class="intro-note"><strong>不赶时间，只追风。</strong><br>和鹈鹕皮皮一起，沿着海岸慢慢骑。</p>

      <defs>

          <circle cx="578" cy="162" r="3.3" fill="#193f3d"/>
          <circle cx="579" cy="161" r=".9" fill="#fffdf5"/>
          <path d="M568 151q8-4 15 0" fill="none" stroke="#193f3d" stroke-width="2" stroke-linecap="round"/>
          <ellipse cx="568" cy="181" rx="9" ry="5" fill="#efb5a0" opacity=".65" transform="rotate(-15 568 181)"/>
          <path d="M692 165q7-2 8-1" fill="none" stroke="#193f3d" stroke-width="2" stroke-linecap="round"/>

          <!-- fluttering neck scarf -->
          <path d="M521 208q17 11 42 7l5 12q-28 8-51-6Z" fill="#e56844" stroke="#193f3d" stroke-width="2" stroke-linejoin="round"/>
          <g class="scarf-tail">
            <path d="M529 215c-23 1-36-13-58-11-16 2-28 13-47 9l10 16c23 5 37-10 52-8 18 2 28 11 44 7Z" fill="#e56844" stroke="#193f3d" stroke-width="2" stroke-linejoin="round"/>
            <path d="m429 215-10 14m17-12-8 13" stroke="#f5b18a" stroke-width="2"/>
            <path d="M463 214q20-5 38 5" fill="none" stroke="#f5b18a" stroke-width="1.5"/>
          </g>

          <!-- wing reaches for the handlebar -->
          <path d="M465 261c15-16 42-12 58 4l57 47 63-67 13 11-58 84q-8 11-22 2l-92-52c-15-8-23-18-19-29Z" fill="#f8f7ed" stroke="#193f3d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M491 270q32 27 74 55m-53-32 53 34m-11-15 30 18" fill="none" stroke="#c9d3c7" stroke-width="2" stroke-linecap="round"/>
          <path d="m640 250 14-8m-9 15 15-8m-8 15 13-8" fill="none" stroke="#193f3d" stroke-width="2" stroke-linecap="round"/>

          <!-- far leg -->
          <g id="far-leg" opacity=".82">
            <path id="far-thigh" d="M457 321 489 343" fill="none" stroke="#d78346" stroke-width="10" stroke-linecap="round"/>
            <path id="far-calf" d="M489 343 523 369" fill="none" stroke="#d78346" stroke-width="7" stroke-linecap="round"/>
            <g id="far-foot" transform="translate(523 369)">
              <path d="M-4 0c8 1 12-1 18-1l17 7c4 3 2 8-3 8H4C-4 13-10 8-4 0Z" fill="#e99a50" stroke="#193f3d" stroke-width="2" stroke-linejoin="round"/>
              <path d="m11 3-1 9m9-8-1 9" stroke="#c8743e" stroke-width="1.3"/>
            </g>
          </g>
          <!-- near leg -->
          <g id="near-leg">
            <path id="near-thigh" d="M456 325 514 341" fill="none" stroke="#e99a50" stroke-width="11" stroke-linecap="round"/>
            <path id="near-calf" d="M514 341 573 369" fill="none" stroke="#e99a50" stroke-width="7.5" stroke-linecap="round"/>
            <circle id="near-knee" cx="514" cy="341" r="5" fill="#e99a50"/>
            <g id="near-foot" transform="translate(573 369)">
              <path d="M-4 0c8 1 12-1 18-1l17 7c4 3 2 8-3 8H4C-4 13-10 8-4 0Z" fill="#f3a958" stroke="#193f3d" stroke-width="2" stroke-linejoin="round"/>
              <path d="m11 3-1 9m9-8-1 9" stroke="#c8743e" stroke-width="1.3"/>
            </g>
          </g>
        </g>

        <!-- crank and pedals stay on the bicycle plane -->
        <g transform="translate(548 369)">
          <circle r="24" fill="#e8e4d7" stroke="#193f3d" stroke-width="3"/>
          <circle r="18" fill="none" stroke="#80968b" stroke-width="2" stroke-dasharray="2 3"/>
          <g id="crank">
            <path d="M-25 0H25" stroke="#193f3d" stroke-width="4" stroke-linecap="round"/>
            <path d="M-32-4h14m36 0h14" stroke="#193f3d" stroke-width="5" stroke-linecap="round"/>
          </g>
          <circle r="5" fill="#193f3d"/>
          <circle r="2" fill="#e8e4d7"/>
        </g>

        <!-- flowers passing in the foreground -->
        <g class="grass-left" transform="translate(0 0)">
          <g transform="translate(0 390)">
            <path d="M0 28q1-19 9-30M7 28q-1-22-13-32M13 28q6-19 19-22" fill="none" stroke="#6e9176" stroke-width="2.5" stroke-linecap="round"/>
            <g class="flower" transform="translate(8 -2)">
              <path d="M0 32V4" stroke="#6e9176" stroke-width="2"/>
              <circle cy="0" r="5" fill="#efbe62"/><circle cx="-5" cy="3" r="5" fill="#faf8f1"/><circle cx="5" cy="3" r="5" fill="#faf8f1"/><circle cy="7" r="5" fill="#faf8f1"/><circle cy="3" r="3" fill="#ee7947"/>
            </g>
          </g>
        </g>
        <g class="grass-right">
          <g transform="translate(0 410) scale(.8)">
            <path d="M0 28q1-19 9-30M7 28q-1-22-13-32M13 28q6-19 19-22" fill="none" stroke="#6e9176" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="9" cy="-2" r="7" fill="#ee7947"/><circle cx="9" cy="-2" r="2.5" fill="#f5d899"/>
          </g>
        </g>
      </g>

      <!-- illustration annotations -->
      <g font-family="Trebuchet MS, sans-serif" fill="#66796c">
        <g transform="translate(86 151)">
          <circle r="14" fill="none" stroke="#a8b6a5"/>
          <path d="M0-8V8M-8 0H8" stroke="#a8b6a5"/>
          <text x="25" y="4" font-size="9" letter-spacing="2">COASTAL ROUTE</text>
        </g>
        <g transform="translate(1030 282)">
          <text text-anchor="middle" font-size="9" letter-spacing="2">SALT IN THE AIR</text>
          <path d="M-45 13h90" stroke="#a8b6a5"/>
          <text text-anchor="middle" y="30" font-size="8" letter-spacing="1.5">WIND IN MY FEATHERS</text>
        </g>
      </g>
    </svg>

    <footer class="footer">
      <div class="motto"><span class="motto-dot"></span><span>GO SLOW. GO FAR. GO HAPPY.</span></div>
      <div class="controls">
        <div class="speed" aria-label="动画速度">
          <span>SPEED</span>
          <button type="button" data-speed="0.5" aria-pressed="false" aria-label="半速">½</button>
          <button type="button" data-speed="1" aria-pressed="true" aria-label="正常速度">1×</button>
          <button type="button" data-speed="2" aria-pressed="false" aria-label="双倍速度">2×</button>
        </div>
        <button class="pause" id="pause" type="button" aria-pressed="false" aria-label="暂停动画">
          <svg class="pause-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 2v8M9 2v8" stroke="currentColor" stroke-width="2"/></svg>
          <svg class="play-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="m3 1 8 5-8 5Z" fill="currentColor"/></svg>
          <span id="pause-label">暂停兜风</span>
        </button>
      </div>
    </footer>
  </main>

  <script>
    (() => {
      const page = document.getElementById('page');
      const pauseButton = document.getElementById('pause');
      const pauseLabel = document.getElementById('pause-label');
      const rearSpokes = document.querySelector('.rear-spokes');
      const frontSpokes = document.querySelector('.front-spokes');
      const crank = document.getElementById('crank');
      const speedButtons = document.querySelectorAll('[data-speed]');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const legs = [
        {
          thigh: document.getElementById('near-thigh'),
          calf: document.getElementById('near-calf'),
          knee: document.getElementById('near-knee'),
          foot: document.getElementById('near-foot'),
          hip: [456, 325],
          phase: 0
        },
        {
          thigh: document.getElementById('far-thigh'),
          calf: document.getElementById('far-calf'),
          knee: document.getElementById('far-knee'),
          foot: document.getElementById('far-foot'),
          hip: [457, 321],
          phase: Math.PI
        }
      ];

      let paused = false;
      let speed = 1;
      let angle = 0;
      let lastTime = 0;
      let frameId = null;
      const riderBob = () => -2 + 2 * Math.cos((angle * Math.PI / 180) * 2);

      // A small two-link IK rig keeps each webbed foot attached to its pedal.
      function positionLeg(leg, pedalAngle) {
        const pedalX = 548 + 25 * Math.cos(pedalAngle);
        const pedalY = 369 + 25 * Math.sin(pedalAngle) - riderBob();
        const hipX = leg.hip[0];
        const hipY = leg.hip[1];
        const dx = pedalX - hipX;
        const dy = pedalY - hipY;
        const upper = 60;
        const lower = 65;
        const distance = Math.min(Math.hypot(dx, dy), upper + lower - .01);
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const height = Math.sqrt(Math.max(0, upper * upper - along * along));
        const kneeX = hipX + along * dx / distance + height * dy / distance;
        const kneeY = hipY + along * dy / distance - height * dx / distance;

        leg.thigh.setAttribute('d', `M${hipX} ${hipY} ${kneeX} ${kneeY}`);
        leg.calf.setAttribute('d', `M${kneeX} ${kneeY} ${pedalX} ${pedalY}`);
        leg.foot.setAttribute('transform', `translate(${pedalX} ${pedalY})`);
        if (leg.knee) {
          leg.knee.setAttribute('cx', kneeX);
          leg.knee.setAttribute('cy', kneeY);
        }
      }

      function draw() {
        rearSpokes.setAttribute('transform', `rotate(${angle})`);
        frontSpokes.setAttribute('transform', `rotate(${angle})`);
        crank.setAttribute('transform', `rotate(${angle})`);
        legs.forEach(leg => positionLeg(leg, (angle * Math.PI / 180) + leg.phase));
      }

      function animate(time) {
        if (paused || reducedMotion.matches || document.hidden) {
          frameId = null;
          lastTime = 0;
          return;
        }
        if (lastTime) {
          const delta = Math.min(time - lastTime, 40);
          angle = (angle + delta * .13 * speed) % 360;
          draw();
        }
        lastTime = time;
        frameId = requestAnimationFrame(animate);
      }

      function startAnimation() {
        if (!frameId && !paused && !reducedMotion.matches && !document.hidden) {
          lastTime = 0;
          frameId = requestAnimationFrame(animate);
        }
      }

      pauseButton.addEventListener('click', () => {
        paused = !paused;
        page.classList.toggle('paused', paused);
        pauseButton.setAttribute('aria-pressed', String(paused));
        pauseButton.setAttribute('aria-label', paused ? '继续动画' : '暂停动画');
        pauseLabel.textContent = paused ? '继续兜风' : '暂停兜风';
        if (paused && frameId) {
          cancelAnimationFrame(frameId);
          frameId = null;
          lastTime = 0;
        } else {
          startAnimation();
        }
      });

      speedButtons.forEach(button => {
        button.addEventListener('click', () => {
          speed = Number(button.dataset.speed);
          speedButtons.forEach(item => item.setAttribute('aria-pressed', String(item === button)));
          document.querySelector('.rider').style.animationDuration = `${4.84 / speed}s`;
          document.querySelectorAll('.road-dashes, .road-speckles, .grass-left, .grass-right')
            .forEach(element => {
              const onRoad = element.classList.contains('road-dashes') || element.classList.contains('road-speckles');
              element.style.animationDuration = `${(onRoad ? .88 : 7) / speed}s`;
            });
        });
      });

      document.addEventListener('visibilitychange', startAnimation);
      reducedMotion.addEventListener('change', () => {
        if (reducedMotion.matches && frameId) {
          cancelAnimationFrame(frameId);
          frameId = null;
          lastTime = 0;
        } else {
          startAnimation();
        }
      });

      draw();
      startAnimation();
    })();
  </script>
</body>
</html>
