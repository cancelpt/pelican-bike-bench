<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鹈鹕骑自行车 · SVG 2D 动画</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17324a;
      --paper: #fff7e9;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 15% 10%, rgba(255, 255, 255, .72), transparent 28%),
        linear-gradient(145deg, #f4c4a2 0%, #8fc9d4 52%, #436e8e 100%);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    .scene-card {
      width: min(1180px, 100%);
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, .65);
      border-radius: 28px;
      background: rgba(255, 250, 239, .74);
      box-shadow: 0 30px 70px rgba(25, 47, 67, .27), inset 0 1px 0 rgba(255, 255, 255, .8);
      backdrop-filter: blur(12px);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: hidden;
      border-radius: 20px;
      background: var(--paper);
    }

    .cloud {
      animation: cloud-drift 26s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .cloud--slow {
      animation-duration: 36s;
      animation-delay: -15s;
    }

    .cloud--tiny {
      animation-duration: 20s;
      animation-delay: -8s;
    }

    .sun-glow {
      animation: sun-pulse 4s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .road-dashes {
      animation: road-scroll 1.15s linear infinite;
    }

    .wheel-spokes,
    .pedal-crank {
      transform-box: fill-box;
      transform-origin: center;
    }

    .rider {
      animation: rider-bob .92s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center bottom;
    }

    .wing {
      animation: wing-flap 1.55s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: 565px 350px;
    }

    .leg-front {
      animation: leg-front .92s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: 585px 423px;
    }

    .leg-back {
      animation: leg-back .92s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: 625px 423px;
    }

    .feather-shimmer {
      animation: feather-shimmer 2.6s ease-in-out infinite;
    }

    @keyframes cloud-drift {
      0% { transform: translateX(-160px); }
      100% { transform: translateX(1380px); }
    }

    @keyframes sun-pulse {
      0%, 100% { opacity: .58; transform: scale(1); }
      50% { opacity: .86; transform: scale(1.08); }
    }

    @keyframes road-scroll {
      to { stroke-dashoffset: -190; }
    }

    @keyframes rider-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes wing-flap {
      0%, 100% { transform: rotate(0deg); }
      45% { transform: rotate(-5deg); }
      72% { transform: rotate(2deg); }
    }

    @keyframes leg-front {
      0%, 100% { transform: rotate(-9deg); }
      50% { transform: rotate(18deg); }
    }

    @keyframes leg-back {
      0%, 100% { transform: rotate(17deg); }
      50% { transform: rotate(-11deg); }
    }

    @keyframes feather-shimmer {
      0%, 100% { opacity: .4; }
      50% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="scene-card">
    <svg viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
      <title id="title">鹈鹕骑着自行车沿海边公路前进</title>

      <defs>
