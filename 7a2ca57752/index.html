<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#edf5ed" />
    <title>鹈鹕，出发！</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
        color: #27484a;
        background: #edf5ed;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 38px 24px;
        background:
          radial-gradient(ellipse at 12% 15%, #fff9e8 0, transparent 31%),
          radial-gradient(ellipse at 90% 82%, #d7eee5 0, transparent 34%),
          #edf5ed;
      }

      .page {
        width: min(1120px, 100%);
      }

      .topline,
      .bottomline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }

      .topline {
        margin: 0 8px 20px;
      }

      .intro {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .sun-mark {
        position: relative;
        width: 46px;
        height: 46px;
        flex: 0 0 46px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #f5bf6b;
        box-shadow: inset -5px -4px 0 #e9a556;
      }

      .sun-mark::before,
      .sun-mark::after {
        position: absolute;
        content: "";
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #fff4d8;
      }

      .sun-mark::before {
        top: 11px;
        left: 11px;
      }

      .sun-mark::after {
        right: 9px;
        bottom: 10px;
      }

      .eyebrow {
        margin: 0 0 3px;
        color: #71918a;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #24484a;
        font-family: Georgia, "Songti SC", "Noto Serif CJK SC", serif;
        font-size: clamp(25px, 4vw, 38px);
        font-weight: 700;
        letter-spacing: -0.055em;
        line-height: 1.1;
      }

      .edition {
        padding: 10px 14px;
        border: 1px solid #d7e7dc;
        border-radius: 999px;
        color: #6c8882;
        background: rgb(255 255 255 / 58%);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.13em;
        white-space: nowrap;
      }

      .scene-card {
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 82%);
        border-radius: 28px;
        background: #ccebed;
        box-shadow:
          0 28px 70px rgb(61 103 88 / 12%),
          0 5px 16px rgb(61 103 88 / 7%);
      }

      .scene {
        display: block;
        width: 100%;
        height: auto;
      }

      .bottomline {
        margin: 17px 8px 0;
        color: #78918a;
        font-size: 12px;
      }

      .caption {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .caption-mark {
        width: 22px;
        height: 1px;
        background: #e99a68;
      }

      .loop-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .loop-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #e98d63;
        box-shadow: 0 0 0 4px rgb(233 141 99 / 14%);
        animation: pulse 2s ease-in-out infinite;
      }

      .cloud {
        animation: cloud-drift 24s ease-in-out infinite alternate;
      }

      .cloud.cloud-two {
        animation-duration: 31s;
        animation-direction: alternate-reverse;
      }

      .wheel-spokes {
        transform-box: fill-box;
        transform-origin: center;
        animation: spin 1.6s linear infinite;
      }

      .crank-spin {
        transform-box: fill-box;
        transform-origin: center;
        animation: spin 1.25s linear infinite;
      }

      .pelican {
        transform-box: fill-box;
        transform-origin: center;
        animation: rider-bob 2.3s ease-in-out infinite;
      }

      .rear-wing {
        transform-box: fill-box;
        transform-origin: 75% 80%;
        animation: wing-flutter 2.8s ease-in-out infinite;
      }

      .water-shimmer {
        animation: shimmer 4.5s ease-in-out infinite alternate;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes rider-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }

      @keyframes wing-flutter {
        0%, 100% { transform: rotate(0); }
        45% { transform: rotate(-3deg); }
        70% { transform: rotate(1deg); }
      }

      @keyframes cloud-drift {
        from { transform: translateX(-12px); }
        to { transform: translateX(18px); }
      }

      @keyframes shimmer {
        from { opacity: 0.48; transform: translateX(-7px); }
        to { opacity: 0.9; transform: translateX(7px); }
      }

      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 4px rgb(233 141 99 / 13%); }
        50% { box-shadow: 0 0 0 7px rgb(233 141 99 / 5%); }
      }

      @media (max-width: 600px) {
        body {
          padding: 22px 14px;
        }

        .topline {
          margin: 0 3px 14px;
        }

        .intro {
          gap: 10px;
        }

        .sun-mark {
          width: 38px;
          height: 38px;
          flex-basis: 38px;
        }

        .edition {
          padding: 8px 10px;
          font-size: 8px;
          letter-spacing: 0.08em;
        }

        .scene-card {
          border-radius: 19px;
        }

        .bottomline {
          margin: 13px 3px 0;
          font-size: 10px;
        }
      }

      @media (max-width: 390px) {
        .edition { display: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topline">
        <div class="intro">
          <span class="sun-mark" aria-hidden="true"></span>
          <div>
            <p class="eyebrow">一段海岸边的小旅程</p>
            <h1>鹈鹕，出发！</h1>
          </div>
        </div>
        <div class="edition">SVG · LOOPING ANIMATION</div>
      </header>

      <section class="scene-card" aria-label="鹈鹕骑自行车的动画插画">
        <svg class="scene" viewBox="0 0 1000 620" role="img" aria-labelledby="scene-title scene-description">
          <title id="scene-title">鹈鹕骑着自行车沿海岸兜风</title>
          <desc id="scene-description">一只戴着珊瑚色头盔的白色鹈鹕，在蓝绿色海岸边踩着自行车前进。车轮和脚踏持续转动，云朵缓缓飘过。</desc>
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#b9e5e8" />
              <stop offset="1" stop-color="#e0f0d9" />
            </linearGradient>
            <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#5dc1be" />
              <stop offset="1" stop-color="#76c9bc" />
            </linearGradient>
            <linearGradient id="promenade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#efa66f" />
              <stop offset="1" stop-color="#e58a61" />
            </linearGradient>
            <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fffdf2" />
              <stop offset="1" stop-color="#f0dfbd" />
            </linearGradient>
            <filter id="soft-shadow" x="-30%" y="-80%" width="160%" height="260%">
              <feGaussianBlur stdDeviation="10" />
            </filter>
          </defs>

          <!-- Sky, sunlight and drifting clouds -->
          <rect width="1000" height="620" fill="url(#sky)" />
          <circle cx="816" cy="112" r="76" fill="#ffedb9" opacity="0.3" />
          <circle cx="816" cy="112" r="49" fill="#f9cb74" />
          <circle cx="800" cy="97" r="10" fill="#ffe8a7" opacity="0.8" />

          <g class="cloud" fill="#f6fbec" opacity="0.88">
            <path d="M128 142c-21 0-37-13-37-30 0-16 14-29 32-30 7-22 29-37 54-33 21 3 36 19 39 39 18 1 32 13 32 29 0 14-13 25-30 25H128Z" />
            <path d="M291 180c-13 0-23-8-23-18 0-9 8-17 19-18 4-13 17-22 32-20 12 2 21 11 23 23 11 1 19 8 19 17 0 9-8 16-18 16h-52Z" opacity="0.66" />
          </g>
          <g class="cloud cloud-two" fill="#f6fbec" opacity="0.72">
            <path d="M682 203c-16 0-28-10-28-22 0-12 10-22 24-23 5-16 21-27 39-24 16 2 27 14 29 29 14 1 24 10 24 21 0 11-10 19-23 19h-65Z" />
          </g>

          <!-- Distant headland and sea -->

          <path d="M0 342c105-23 165-21 245-6 62 12 104 0 160-14 55-14 104-14 158 0 66 17 121 19 193 1 93-24 156-13 244 5v145H0Z" fill="url(#sea)" />
          <g fill="none" stroke="#d6f0d4" stroke-linecap="round" opacity="0.74">
            <path class="water-shimmer" d="M73 374h86" stroke-width="4" />
            <path class="water-shimmer" d="M240 398h48" stroke-width="3" style="animation-delay: -1s" />

            <path d="M142 434h37m27 0h18m425-45h29m-389 23h72" stroke-width="2" opacity="0.55" />
          </g>
          <path d="M0 451c158-10 297-5 431 0 161 7 329-10 569-1v170H0Z" fill="url(#promenade)" />
          <path d="M0 451c158-10 297-5 431 0 161 7 329-10 569-1" fill="none" stroke="#fff1ce" stroke-width="7" opacity="0.8" />
          <path d="M0 541c225 11 477 5 682 0 115-3 219 0 318 9v70H0Z" fill="#f3d89f" />
          <path d="M0 541c225 11 477 5 682 0 115-3 219 0 318 9" fill="none" stroke="#f8e9c6" stroke-width="5" opacity="0.9" />
          <path d="M97 497h93m35 0h58m433 0h83m39 0h31" stroke="#ffe8b5" stroke-width="5" stroke-linecap="round" stroke-dasharray="31 18" opacity="0.9" />

          <ellipse cx="487" cy="499" rx="326" ry="16" fill="#315e5b" opacity="0.2" filter="url(#soft-shadow)" />

          <!-- Rear wheel -->
          <g transform="translate(298 419)">
            <circle r="75" fill="#f3f5e9" stroke="#25464b" stroke-width="9" />
            <circle r="65" fill="none" stroke="#fff2cb" stroke-width="2.5" />
            <circle r="59" fill="none" stroke="#7d9e91" stroke-width="1.4" opacity="0.55" />
            <g class="wheel-spokes" fill="none" stroke="#607d79" stroke-width="1.7" opacity="0.85">
              <path d="M0-64V64m-55.4-32 110.8 64m-110.8 0 110.8-64M-64 0h128m-45.3-45.3 90.6 90.6m-90.6 0 90.6-90.6" />
            </g>
            <circle r="8" fill="#ec9a63" stroke="#25464b" stroke-width="3" />
          </g>

          <!-- Front wheel -->
          <g transform="translate(674 419)">
            <circle r="75" fill="#f3f5e9" stroke="#25464b" stroke-width="9" />
            <circle r="65" fill="none" stroke="#fff2cb" stroke-width="2.5" />
            <circle r="59" fill="none" stroke="#7d9e91" stroke-width="1.4" opacity="0.55" />
            <g class="wheel-spokes" fill="none" stroke="#607d79" stroke-width="1.7" opacity="0.85">
              <path d="M0-64V64m-55.4-32 110.8 64m-110.8 0 110.8-64M-64 0h128m-45.3-45.3 90.6 90.6m-90.6 0 90.6-90.6" />
            </g>
            <circle r="8" fill="#ec9a63" stroke="#25464b" stroke-width="3" />
          </g>

          <!-- Bicycle frame, chain, seat and handlebars -->
          <g fill="none" stroke="#27565c" stroke-linecap="round" stroke-linejoin="round">
            <path d="M298 419 402 302 480 419 298 419Z" stroke-width="8" />

            <path d="M402 302 397 286" stroke-width="6" />

            <path d="M588 307 596 280 626 280" stroke-width="6" />

          <circle cx="298" cy="419" r="17" fill="none" stroke="#e6b56b" stroke-width="3" />
          <circle cx="480" cy="419" r="21" fill="none" stroke="#e6b56b" stroke-width="3" />

          <!-- Cycling legs: the two feet trade places around the crank -->
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M460 286 C478 315 485 332 480 348 C469 371 458 398 450 419" stroke="#d9844e" stroke-width="9">
              <animate attributeName="d" dur="1.25s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.25;0.5;0.75;1" values="M460 286 C478 315 485 332 480 348 C469 371 458 398 450 419;M460 286 C470 316 464 333 462 348 C465 363 477 377 480 390;M460 286 C470 316 486 334 490 348 C497 374 506 398 510 419;M460 286 C479 315 492 329 490 347 C490 378 486 417 480 448;M460 286 C478 315 485 332 480 348 C469 371 458 398 450 419" />
            </path>
            <path d="M446 285 C436 320 440 335 448 345 C462 369 485 398 510 419" stroke="#f0a25c" stroke-width="10">
              <animate attributeName="d" dur="1.25s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.25;0.5;0.75;1" values="M446 285 C436 320 440 335 448 345 C462 369 485 398 510 419;M446 285 C448 321 461 338 470 348 C478 374 482 419 480 448;M446 285 C457 319 476 335 475 343 C467 371 452 397 450 419;M446 285 C436 320 439 332 449 340 C454 362 472 377 480 390;M446 285 C436 320 440 335 448 345 C462 369 485 398 510 419" />
            </path>
            <path d="M446 285 C436 320 440 335 448 345 C462 369 485 398 510 419" stroke="#ffd08a" stroke-width="3" opacity="0.85">
              <animate attributeName="d" dur="1.25s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.25;0.5;0.75;1" values="M446 285 C436 320 440 335 448 345 C462 369 485 398 510 419;M446 285 C448 321 461 338 470 348 C478 374 482 419 480 448;M446 285 C457 319 476 335 475 343 C467 371 452 397 450 419;M446 285 C436 320 439 332 449 340 C454 362 472 377 480 390;M446 285 C436 320 440 335 448 345 C462 369 485 398 510 419" />
            </path>
            <path d="M448 419q8-6 15 0m-15 3q8 5 16 0" stroke="#d9844e" stroke-width="5">
              <animate attributeName="d" dur="1.25s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.25;0.5;0.75;1" values="M448 419q8-6 15 0m-15 3q8 5 16 0;M478 390q8-6 15 0m-15 3q8 5 16 0;M508 419q8-6 15 0m-15 3q8 5 16 0;M478 448q8-6 15 0m-15 3q8 5 16 0;M448 419q8-6 15 0m-15 3q8 5 16 0" />
            </path>
            <path d="M508 419q8-6 16 0m-16 3q8 5 16 0" stroke="#f0a25c" stroke-width="5">
              <animate attributeName="d" dur="1.25s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.25;0.5;0.75;1" values="M508 419q8-6 16 0m-16 3q8 5 16 0;M478 448q8-6 15 0m-15 3q8 5 16 0;M448 419q8-6 15 0m-15 3q8 5 16 0;M478 390q8-6 15 0m-15 3q8 5 16 0;M508 419q8-6 16 0m-16 3q8 5 16 0" />
            </path>
          </g>

          <!-- Rotating crank and pedals -->
          <g class="crank-spin" transform="translate(480 419)" fill="none" stroke="#25464b" stroke-linecap="round">
            <path d="M0 0 30 0M0 0-30 0" stroke-width="6" />
            <path d="M22-7h17m-17 14h17M-39-7h17m-17 14h17" stroke-width="5" />
            <circle r="7" fill="#e7a55f" stroke-width="3" />

          <!-- The rider -->

            <!-- tail feathers and far wing -->

            <!-- neck, body and rider's outstretched wing -->

          <!-- A few tiny coastal grasses in the foreground -->
          <g fill="none" stroke-linecap="round">
            <path d="M81 549q-6-18-2-28m2 18q8-13 15-15m-13 24q-8-8-15-9" stroke="#719d79" stroke-width="3" />

          <circle cx="94" cy="544" r="4" fill="#f1a36b" />
          <circle cx="914" cy="547" r="4" fill="#f1a36b" />

      </section>

      <footer class="bottomline">
        <div class="caption"><span class="caption-mark" aria-hidden="true"></span>沿着海岸线，慢慢骑一圈</div>
        <div class="loop-label"><span class="loop-dot" aria-hidden="true"></span>循环播放中</div>
      </footer>
    </main>
  </body>
</html>
