<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e5f1f5">
  <title>&#28023;&#39118;&#39569;&#34892; | Pelican Ride</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      color: #29484b;
      background: #e5f1f5;
      font-synthesis: none;
      letter-spacing: 0;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button, label { touch-action: manipulation; }
    button:focus-visible, input:focus-visible + span {
      outline: 3px solid #368b80;
      outline-offset: 4px;
    }

    .experience {
      position: relative;
      width: 100%;
      min-height: 620px;
      height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background: #e5f1f5;
    }

    .masthead {
      position: absolute;
      z-index: 3;
      top: max(34px, env(safe-area-inset-top));
      left: 42px;
      right: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .identity { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 42px; height: 42px; flex: none; }
    h1 { margin: 0; font-size: 19px; line-height: 1.3; font-weight: 750; }
    .eyebrow { margin: 4px 0 0; font-size: 10px; font-weight: 600; color: #658084; }
    .edition { display: flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 600; }
    .edition-number { padding: 9px 0 9px 12px; border-left: 1px solid #b5ced0; font-size: 17px; }

    .sun {
      position: absolute;
      top: 19%;
      left: 75%;
      width: 90px;
      height: 90px;
    }

    .cloud { position: absolute; color: #fff; }
    .cloud-a { width: 149px; height: 55px; top: 24%; left: 13%; }
    .cloud-b { width: 103px; height: 38px; top: 15%; left: 57%; opacity: .78; }
    .cloud-c { width: 177px; height: 66px; top: 36%; left: 82%; opacity: .85; }
    .ocean { position: absolute; top: 49%; left: 0; width: 100%; height: 23%; }
    .lighthouse { position: absolute; left: 10%; top: calc(49% - 79px); width: 104px; height: 104px; }
    .road { position: absolute; top: 70%; left: 0; width: 100%; height: 30%; }

    .rider {
      position: absolute;
      width: min(1000px, 94%, 103svh);
      height: auto;
      aspect-ratio: 1000 / 670;
      left: 50%;
      bottom: calc(28% - 12px);
      transform: translateX(-50%);
      overflow: visible;
    }

    .footer {
      position: absolute;
      z-index: 3;
      bottom: max(30px, env(safe-area-inset-bottom));
      left: 42px;
      right: 42px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      gap: 20px;
    }

    .route-label { font-size: 10px; line-height: 1.8; color: #887a79; }
    .route-label strong { display: block; font-weight: 650; font-size: 12px; color: #4b5c5b; }
    .route-end { justify-self: end; text-align: right; }
    .route-end svg { display: block; width: 46px; height: 20px; margin-left: auto; margin-bottom: 5px; }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      background: #fffdf8;
      border: 1px solid #e7dcd5;
      border-radius: 8px;
      box-shadow: 0 4px 0 #29484b05, 0 8px 24px #5f535509;
    }

    .icon-button {
      position: relative;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: #496062;
      cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }

    .icon-button:hover { background: #edf3ed; }
    .icon-button.primary { background: #294c4c; color: #fffdf8; }
    .icon-button.primary:hover { background: #386665; }
    .icon-button svg { width: 17px; height: 17px; }
    .icon-button [hidden] { display: none; }
    .icon-button::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 14px);
      left: 50%;
      padding: 7px 10px;
      border-radius: 4px;
      background: #29484b;
      color: white;
      font-size: 11px;
      line-height: 1.4;
      white-space: nowrap;
      transform: translate(-50%, 3px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s ease, transform .15s ease;
    }
    .icon-button:hover::after, .icon-button:focus-visible::after { opacity: 1; transform: translate(-50%, 0); }
    .divider { width: 1px; height: 22px; margin: 0 3px; background: #e3e7df; }
    .pace { display: flex; gap: 3px; padding: 0; margin: 0; border: 0; }
    .pace label { position: relative; cursor: pointer; }
    .pace input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .pace span {
      display: grid;
      place-items: center;
      width: 45px;
      height: 36px;
      border-radius: 4px;
      color: #81908b;
      font-size: 12px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      transition: color .15s ease, background .15s ease;
    }
    .pace input:checked + span { color: #aa503b; background: #f9e8df; }
    .pace label:hover span { color: #29484b; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (min-width: 1600px) { .rider { width: min(1160px, 76%, 103svh); } }
    @media (max-width: 700px) {
      .masthead { top: max(25px, env(safe-area-inset-top)); left: 23px; right: 23px; }
      h1 { font-size: 17px; }
      .brand-mark { width: 36px; height: 36px; }
      .eyebrow { font-size: 9px; }
      .edition { font-size: 9px; gap: 8px; }
      .edition-number { font-size: 15px; padding-left: 8px; }
      .sun { width: 68px; height: 68px; left: 73%; top: 24%; }
      .cloud-a { left: 9%; top: 30%; width: 112px; height: 42px; }
      .cloud-b { left: 46%; top: 18%; width: 75px; height: 28px; }
      .cloud-c { left: 87%; top: 43%; width: 94px; height: 35px; }
      .lighthouse { width: 63px; height: 63px; left: 7%; top: calc(49% - 48px); }
      .rider { width: 108%; bottom: calc(28% - 5px); }
      .footer { left: 23px; right: 23px; bottom: max(24px, env(safe-area-inset-bottom)); grid-template-columns: 1fr auto; row-gap: 23px; }
      .controls { grid-column: 1 / -1; grid-row: 1; justify-self: center; }
      .route-label { font-size: 9px; }
      .route-label strong { font-size: 11px; }
      .route-end { grid-column: 2; }
    }

    @media (max-height: 650px) and (min-width: 701px) {
      .experience { min-height: 460px; }
      .rider { width: min(720px, 74%, 112svh); bottom: calc(23% - 12px); }
      .masthead { top: 20px; }
      .footer { bottom: 18px; }
      .sun { top: 17%; width: 60px; height: 60px; }
      .ocean { top: 52%; height: 23%; }
      .road { top: 75%; height: 25%; }
      .lighthouse { top: calc(52% - 79px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>

        <path id="near-crank" d="M480 526 516 535" fill="none" stroke="#29484b" stroke-width="8"/>
        <path id="near-crank-highlight" d="M480 526 516 535" fill="none" stroke="#b4c1ad" stroke-width="3"/>
        <circle cx="480" cy="526" r="5" fill="#29484b"/>
        <g id="near-pedal" transform="translate(516 535)">
          <rect x="-22" y="-3" width="44" height="9" rx="3" fill="#29484b"/>
          <path d="M-14 0h7m8 0h7" stroke="#f4ca73" stroke-width="2"/>
        </g>
        <use id="near-foot" href="#webbed-foot" color="#f4c568" transform="translate(508 518)"/>
      </g>
    </svg>

    <footer class="footer">
      <div class="route-label"><strong>&#28023;&#39118;&#39569;&#34892;</strong>A SLOW DAY BY THE SEA</div>
      <div class="controls" role="group" aria-label="&#21160;&#30011;&#25511;&#21046;">
        <!-- Lucide icons, ISC license: https://lucide.dev/license -->
        <button id="playback" class="icon-button primary" type="button" aria-label="&#26242;&#20572;&#21160;&#30011;" data-tooltip="&#26242;&#20572;">
          <svg id="pause-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></svg>
          <svg id="play-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>
        </button>
        <button id="restart" class="icon-button" type="button" aria-label="&#37325;&#26032;&#25773;&#25918;" data-tooltip="&#37325;&#26032;&#25773;&#25918;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <span class="divider" aria-hidden="true"></span>
        <fieldset class="pace">
          <legend class="sr-only">&#39569;&#34892;&#36895;&#24230;</legend>
          <label><input type="radio" name="speed" value="0.5" aria-label="0.5 &#20493;&#36895;"><span>0.5&times;</span></label>
          <label><input type="radio" name="speed" value="1" aria-label="1 &#20493;&#36895;" checked><span>1&times;</span></label>
          <label><input type="radio" name="speed" value="1.5" aria-label="1.5 &#20493;&#36895;"><span>1.5&times;</span></label>
        </fieldset>
      </div>
      <div class="route-label route-end" aria-hidden="true">
        <svg viewBox="0 0 50 22" fill="none" stroke="#7c9183" stroke-width="1.5" stroke-linecap="round"><path d="M2 7q6-6 12 0t12 0 12 0 10 0M2 15q6-6 12 0t12 0 12 0 10 0"/></svg>
        NICE &amp; EASY
      </div>
    </footer>
  </main>

  <script>
    (() => {
      const byId = (id) => document.getElementById(id);
      const parts = Object.fromEntries([
        'rear-spokes', 'front-spokes', 'chainring', 'bird-body', 'tail-feathers',
        'pelican-eye', 'scarf-tail', 'rider-shadow', 'sea-ripples', 'road-markings',
        'far-leg-outline', 'far-leg-color', 'near-leg-outline', 'near-leg-color',
        'far-crank', 'near-crank', 'near-crank-highlight', 'far-pedal', 'near-pedal',
        'far-foot', 'near-foot'
      ].map((id) => [id, byId(id)]));
      const clouds = [...document.querySelectorAll('.cloud')];
      const playback = byId('playback');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !reducedMotion.matches;
      let speed = 1;
      let time = 0;
      let lastFrame = null;
      let frameId = null;

      function transform(id, value) {
        parts[id].setAttribute('transform', value);
      }

      // Two-bone inverse kinematics keeps both ankles attached to the pedals.
      function drawLeg(side, phase, hipX, hipY) {
        const pedalX = 480 + Math.cos(phase) * 36;
        const pedalY = 526 + Math.sin(phase) * 36;
        const ankleX = pedalX - 8;
        const ankleY = pedalY - 17;
        const dx = ankleX - hipX;
        const dy = ankleY - hipY;
        const distance = Math.hypot(dx, dy);
        const upperLength = 121;
        const lowerLength = 119;
        const along = (upperLength ** 2 - lowerLength ** 2 + distance ** 2) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, upperLength ** 2 - along ** 2));
        const kneeX = hipX + (dx * along + dy * bend) / distance;
        const kneeY = hipY + (dy * along - dx * bend) / distance;
        const path = `M${hipX} ${hipY}Q${kneeX - 3} ${kneeY - 4} ${kneeX} ${kneeY}L${ankleX} ${ankleY}`;
        parts[`${side}-leg-outline`].setAttribute('d', path);
        parts[`${side}-leg-color`].setAttribute('d', path);
        const crankPath = `M480 526L${pedalX} ${pedalY}`;
        parts[`${side}-crank`].setAttribute('d', crankPath);
        if (side === 'near') parts['near-crank-highlight'].setAttribute('d', crankPath);
        transform(`${side}-pedal`, `translate(${pedalX} ${pedalY})`);
        transform(`${side}-foot`, `translate(${ankleX} ${ankleY})`);
      }

      function render(t) {
        const phase = t * Math.PI * 2 / 1.55 + .3;
        const bob = Math.sin(phase * 2) * 2.2;
        const sway = Math.sin(phase) * 1.1;
        const wheelAngle = (t * 205) % 360;
        transform('rear-spokes', `rotate(${wheelAngle})`);
        transform('front-spokes', `rotate(${wheelAngle})`);
        transform('chainring', `rotate(${phase * 180 / Math.PI})`);
        transform('bird-body', `translate(${sway} ${bob})`);
        transform('tail-feathers', `rotate(${Math.sin(t * 5) * 2} 348 278)`);
        drawLeg('far', phase + Math.PI, 422 + sway, 334 + bob);
        drawLeg('near', phase, 447 + sway, 331 + bob);

        const flutter = Math.sin(t * 7) * 5;
        parts['scarf-tail'].setAttribute('d', `M556 166c-22-10-48 ${-8 + flutter}-74 ${3 + flutter}l-22-2 9 12-8 12c32-19 59 ${-21 - flutter} 87 ${-13 - flutter}Z`);
        const blink = t % 5.4;
        const eyeScale = blink > 5.16 ? Math.max(.08, Math.abs(blink - 5.28) / .12) : 1;
        transform('pelican-eye', `scale(1 ${eyeScale})`);
        parts['rider-shadow'].setAttribute('rx', 305 - bob * 1.5);

        transform('road-markings', `translate(${-((t * 255) % 270)} 0)`);
        transform('sea-ripples', `translate(${-((t * 17) % 320)} 0)`);
        clouds.forEach((cloud, index) => {
          cloud.style.transform = `translateX(${Math.sin(t * .12 + index * 2) * (12 + index * 5)}px)`;
        });
      }

      function tick(now) {
        if (!playing || document.hidden) { frameId = null; return; }
        if (lastFrame !== null) time += Math.min((now - lastFrame) / 1000, .08) * speed;
        lastFrame = now;
        render(time);
        frameId = requestAnimationFrame(tick);
      }

      function syncPlayback() {
        if (frameId !== null) cancelAnimationFrame(frameId);
        frameId = null;
        lastFrame = null;
        byId('pause-icon').toggleAttribute('hidden', !playing);
        byId('play-icon').toggleAttribute('hidden', playing);
        playback.setAttribute('aria-label', playing ? '\u6682\u505c\u52a8\u753b' : '\u64ad\u653e\u52a8\u753b');
        playback.dataset.tooltip = playing ? '\u6682\u505c' : '\u64ad\u653e';
        if (playing && !document.hidden) frameId = requestAnimationFrame(tick);
      }

      playback.addEventListener('click', () => {
        playing = !playing;
        syncPlayback();
      });

      byId('restart').addEventListener('click', () => {
        time = 0;
        render(time);
        playing = true;
        syncPlayback();
      });

      document.querySelectorAll('input[name="speed"]').forEach((input) => {
        input.addEventListener('change', () => { speed = Number(input.value); });
      });

      document.addEventListener('visibilitychange', syncPlayback);
      reducedMotion.addEventListener('change', (event) => {
        playing = !event.matches;
        syncPlayback();
      });

      render(0);
      syncPlayback();
    })();
  </script>
</body>
</html>
