<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · Pelican Ride</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: linear-gradient(160deg, #d7edf8 0%, #f2fbff 60%, #e6f6ee 100%);
    font-family: system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px 12px;
  }

  h1 {
    color: #14536b;
    font-size: clamp(20px, 3.4vw, 30px);
    letter-spacing: 2px;
  }

  .sub {
    color: #5d7a8a;
    font-size: 13px;
    margin-top: -6px;
    letter-spacing: 1px;
  }

  .stage {
    width: min(1000px, 94vw);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(16, 62, 92, 0.28), 0 4px 14px rgba(16, 62, 92, 0.15);
    background: #bfe6f7;
  }

  svg { display: block; width: 100%; height: auto; }

  footer {
    color: #8aa2b0;
    font-size: 12px;
    letter-spacing: 1px;
  }

  /* ---------- 背景滚动（平移动画，与 transform-origin 无关，安全） ---------- */
  .drift-clouds-a  { animation: drift 42s linear infinite; }
  .drift-clouds-b  { animation: drift 64s linear infinite; }
  .drift-hills-far { animation: drift 24s linear infinite; }
  .drift-hills-near{ animation: drift 15s linear infinite; }
  .drift-bushes    { animation: drift 1.7s linear infinite; }
  @keyframes drift { to { transform: translateX(-900px); } }

  /* 路面虚线：dashoffset 增大 → 虚线向 -x 移动 */
  .road-dash {
    stroke-dashoffset: 0;
    animation: roadmove 0.13s linear infinite;
  }
  @keyframes roadmove { to { stroke-dashoffset: 80; } }

  /* 链条流动：dashoffset 减小 → 沿路径方向流动 */
  .chain {
    stroke-dashoffset: 0;
    animation: chainmove 0.1s linear infinite;
  }
  @keyframes chainmove { to { stroke-dashoffset: -10; } }

  /* ---------- 鹈鹕本体动作 ---------- */
  #bob {
    animation: bob 1.1s ease-in-out infinite; /* 与踏频同步 */
  }
  @keyframes bob { 50% { transform: translateY(-3.5px); } }

  .blink {
    transform-box: view-box;
    transform-origin: 511px 170px;
    animation: blink 4.6s linear infinite;
  }
  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    93%           { transform: scaleY(0.06); }
    96%           { transform: scaleY(1); }
  }

  .pouch {
    transform-box: view-box;
    transform-origin: 519px 186px;
    animation: jiggle 1.4s ease-in-out infinite;
  }
  @keyframes jiggle { 50% { transform: scaleY(1.06); } }

  /* 速度线 */
  .streak {
    animation: streak 1.35s linear infinite;
    opacity: 0;
  }
  .streak.s2 { animation-delay: 0.45s; }
  .streak.s3 { animation-delay: 0.9s; }
  @keyframes streak {
    0%   { transform: translateX(90px);  opacity: 0; }
    18%  { opacity: 0.8; }
    100% { transform: translateX(-170px); opacity: 0; }
  }
</style>
</head>
<body>

<footer>Pure SVG / CSS / SMIL / JS · 单文件 · 无外部依赖</footer>

<script>
(() => {
  // 曲柄中心、半径与踏频
  const CRANK = { x: 435, y: 455, r: 32 };
  const CADENCE = 2 * Math.PI / 1.1; // rad/s，与身体起伏周期一致

  const legs = [
    { hip: { x: 392, y: 313 }, thigh: 92, shin: 92, phase: Math.PI,
      leg: document.getElementById('leg-far'),   foot: document.getElementById('foot-far'),
      arm: document.getElementById('arm-far'),   pedal: document.getElementById('pedal-far') },
    { hip: { x: 401, y: 318 }, thigh: 92, shin: 92, phase: 0,
      leg: document.getElementById('leg-near'), foot: document.getElementById('foot-near'),
      arm: document.getElementById('arm-near'), pedal: document.getElementById('pedal-near') },
  ];

  // 两骨逆向运动学：已知髋、踝，求膝（取更靠前即 x 更大的解）
  function solveKnee(hx, hy, ax, ay, l1, l2) {
    let dx = ax - hx, dy = ay - hy;
    let d = Math.hypot(dx, dy) || 0.001;
    const dc = Math.min(Math.max(d, Math.abs(l1 - l2) + 0.01), l1 + l2 - 0.01);
    const s = dc / d; dx *= s; dy *= s; d = dc;
    const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    const mx = hx + a * dx / d, my = hy + a * dy / d;
    const k1x = mx + h * dy / d, k1y = my - h * dx / d;
    const k2x = mx - h * dy / d, k2y = my + h * dx / d;
    return k1x > k2x ? { x: k1x, y: k1y } : { x: k2x, y: k2y };
  }

  function frame(now) {
    const t = now / 1000;
    for (const L of legs) {
      const ang = t * CADENCE + L.phase;
      const px = CRANK.x + CRANK.r * Math.cos(ang);
      const py = CRANK.y + CRANK.r * Math.sin(ang);
      const k = solveKnee(L.hip.x, L.hip.y, px, py, L.thigh, L.shin);

      L.leg.setAttribute('d',
        `M ${L.hip.x} ${L.hip.y} L ${k.x.toFixed(1)} ${k.y.toFixed(1)} L ${px.toFixed(1)} ${py.toFixed(1)}`);
      L.arm.setAttribute('x2', px.toFixed(1));
      L.arm.setAttribute('y2', py.toFixed(1));
      L.pedal.setAttribute('transform', `translate(${px.toFixed(1)} ${py.toFixed(1)})`);

      // 脚掌平踏在踏板上，随曲柄角度轻微摆动
      const tilt = Math.sin(ang) * 8;
      L.foot.setAttribute('transform',
        `translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${tilt.toFixed(1)})`);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
