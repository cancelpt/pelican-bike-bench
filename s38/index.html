<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #eef6fb;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  h1 {
    color: #2b3a42;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: .5px;
    margin: 0 0 14px;
  }

  .scene-wrap {
    width: 92vw;
    max-width: 900px;
    aspect-ratio: 16 / 9;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.15);
    background: #8ec9f0;
  }

  svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: hidden;
  }

  /* background drift */
  .cloud-layer-far  { animation: drift 48s linear infinite; }
  .cloud-layer-near { animation: drift 24s linear infinite; }
  .road-dashes      { animation: drift .8s linear infinite; }
  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(-800px); }
  }

  /* wheels + crank spin around their own hub (local origin) */
  .wheel-spin, .crank-spin { animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* wing flap */
  .wing { animation: flap .5s ease-in-out infinite; }
  @keyframes flap {
    0%, 100% { transform: rotate(-6deg); }
    50%      { transform: rotate(20deg); }
  }

  /* pedaling legs, phase-shifted by half a cycle so they alternate */
  .leg-a { animation: pedal-rot 1.1s linear infinite; }
  .leg-b { animation: pedal-rot 1.1s linear infinite; animation-delay: -0.55s; }
  @keyframes pedal-rot {
    0%   { transform: rotate(-10deg); }
    50%  { transform: rotate(25deg); }
    100% { transform: rotate(-10deg); }
  }

  /* gentle ride bob */
  .rider-bike { animation: bob .55s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }
</style>
</head>
<body>
  <h1>鹈鹕骑自行车</h1>
  <div class="scene-wrap">
    <svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img">
      <title>一只鹈鹕骑着自行车的二维动画</title>
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8ec9f0"/>
          <stop offset="1" stop-color="#dff3fb"/>
        </linearGradient>
        <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6b6f76"/>
          <stop offset="1" stop-color="#4b4f55"/>
        </linearGradient>
        <g id="cloud-shape">
          <ellipse cx="-20" cy="6"  rx="22" ry="15"/>
          <ellipse cx="2"   cy="-8" rx="28" ry="20"/>
          <ellipse cx="24"  cy="6"  rx="20" ry="14"/>
          <ellipse cx="4"   cy="12" rx="34" ry="13"/>
        </g>
        <rect id="dash" width="50" height="8" rx="3"/>
      </defs>

      <!-- sky -->
      <rect x="0" y="0" width="800" height="450" fill="url(#sky)"/>
      <circle cx="700" cy="70" r="40" fill="#ffe27a"/>

      <!-- clouds (two parallax layers, each tiled twice for a seamless loop) -->
      <g class="cloud-layer-far" fill="#ffffff" opacity="0.85">
        <use href="#cloud-shape" transform="translate(120,70) scale(0.7)"/>
        <use href="#cloud-shape" transform="translate(420,50) scale(0.55)"/>
        <use href="#cloud-shape" transform="translate(650,95) scale(0.65)"/>
        <use href="#cloud-shape" transform="translate(920,70) scale(0.7)"/>
        <use href="#cloud-shape" transform="translate(1220,50) scale(0.55)"/>
        <use href="#cloud-shape" transform="translate(1450,95) scale(0.65)"/>
      </g>
      <g class="cloud-layer-near" fill="#ffffff" opacity="0.95">
        <use href="#cloud-shape" transform="translate(200,110) scale(1.1)"/>
        <use href="#cloud-shape" transform="translate(600,130) scale(0.9)"/>
        <use href="#cloud-shape" transform="translate(1000,110) scale(1.1)"/>
        <use href="#cloud-shape" transform="translate(1400,130) scale(0.9)"/>
      </g>

      <!-- ground -->
      <rect x="0" y="330" width="800" height="120" fill="#8fc76b"/>
      <rect x="0" y="345" width="800" height="65" fill="url(#roadGrad)"/>
      <g class="road-dashes" fill="#f5f0dc" opacity="0.85">
        <use href="#dash" x="0"    y="373"/>
        <use href="#dash" x="100"  y="373"/>
        <use href="#dash" x="200"  y="373"/>
        <use href="#dash" x="300"  y="373"/>
        <use href="#dash" x="400"  y="373"/>
        <use href="#dash" x="500"  y="373"/>
        <use href="#dash" x="600"  y="373"/>
        <use href="#dash" x="700"  y="373"/>
        <use href="#dash" x="800"  y="373"/>
        <use href="#dash" x="900"  y="373"/>
        <use href="#dash" x="1000" y="373"/>
        <use href="#dash" x="1100" y="373"/>
        <use href="#dash" x="1200" y="373"/>
        <use href="#dash" x="1300" y="373"/>
        <use href="#dash" x="1400" y="373"/>
        <use href="#dash" x="1500" y="373"/>
      </g>

      <!-- bicycle + pelican -->
      <g class="rider-bike">

        <!-- rear wheel -->
        <g transform="translate(290,360)">
          <g class="wheel-spin">
            <circle r="50" fill="none" stroke="#1c1c1c" stroke-width="7"/>
            <line x1="0" y1="0" x2="50"    y2="0"     stroke="#555" stroke-width="2.5"/>
            <line x1="0" y1="0" x2="35.4"  y2="35.4"  stroke="#555" stroke-width="2.5"/>
            <line x1="0" y1="0" x2="0"     y2="50"    stroke="#555" stroke-width="2.5"/>
            <line x1="0" y1="0" x2="-35.4" y2="35.4"  stroke="#555" stroke-width="2.5"/>
            <line x1="0" y1="0" x2="-50"   y2="0"     stroke="#555" stroke-width="2.5"/>
            <line x1="0" y1="0" x2="-35.4" y2="-35.4" stroke="#555" stroke-width="2.5"/>
            <line x1="0" y1="0" x2="0"     y2="-50"   stroke="#555" stroke-width="2.5"/>
            <line x1="0" y1="0" x2="35.4"  y2="-35.4" stroke="#555" stroke-width="2.5"/>
            <circle r="7" fill="#1c1c1c"/>
          </g>
        </g>

        <!-- front wheel -->
        <g transform="translate(490,360)">
          <g class="wheel-spin">
            <circle r="50" fill="none" stroke="#1c1c1c" stroke-width="7"/>
            <line x1="0" y1="0" x2="50"    y2="0"     stroke="#555" stroke-width="2.5"/>
            <line x1="0" y1="0" x2="35.4"  y2="35.4"  stroke="#555" stroke-width="2.5"/>
            <line x1="0" y1="0" x2="0"     y2="50"    stroke="#555" stroke-width="2.5"/>
            <line x1="0" y1="0" x2="-35.4" y2="35.4"  stroke="#555" stroke-width="2.5"/>
            <line x1="0" y1="0" x2="-50"   y2="0"     stroke="#555" stroke-width="2.5"/>
            <line x1="0" y1="0" x2="-35.4" y2="-35.4" stroke="#555" stroke-width="2.5"/>
            <line x1="0" y1="0" x2="0"     y2="-50"   stroke="#555" stroke-width="2.5"/>
            <line x1="0" y1="0" x2="35.4"  y2="-35.4" stroke="#555" stroke-width="2.5"/>
            <circle r="7" fill="#1c1c1c"/>
          </g>
        </g>

        <!-- frame -->
        <g stroke="#262626" stroke-width="7" stroke-linecap="round">
          <line x1="290" y1="360" x2="380" y2="348"/>
          <line x1="290" y1="360" x2="335" y2="255"/>
          <line x1="380" y1="348" x2="335" y2="255"/>
          <line x1="335" y1="255" x2="450" y2="238"/>
          <line x1="380" y1="348" x2="450" y2="238"/>
          <line x1="450" y1="238" x2="490" y2="360"/>
        </g>

        <!-- crank + pedals -->
        <g transform="translate(380,348)">
          <g class="crank-spin">
            <line x1="0" y1="0" x2="28"  y2="0" stroke="#1c1c1c" stroke-width="6" stroke-linecap="round"/>
            <line x1="0" y1="0" x2="-28" y2="0" stroke="#1c1c1c" stroke-width="6" stroke-linecap="round"/>
            <rect x="21"  y="-5" width="14" height="10" rx="2" fill="#111"/>
            <rect x="-35" y="-5" width="14" height="10" rx="2" fill="#111"/>
            <circle r="9" fill="#1c1c1c"/>
          </g>
        </g>

        <!-- seat -->
        <g transform="translate(322,250) rotate(-15)">
          <ellipse rx="18" ry="8" fill="#262626"/>
        </g>

        <!-- handlebar -->
        <g stroke="#262626" stroke-width="5" stroke-linecap="round" fill="none">
          <line x1="450" y1="238" x2="432" y2="213"/>
          <path d="M410,208 Q431,200 452,203"/>
        </g>
        <circle cx="413" cy="208" r="6" fill="#1c1c1c"/>

        <!-- tail -->
        <path d="M302,266 Q275,258 264,244 Q270,262 268,282 Q272,292 282,296 Q292,282 302,266 Z"
              fill="#f2f2f0" stroke="#cfcfcb" stroke-width="1.5"/>

        <!-- back leg (behind body) -->
        <g transform="translate(335,258)">
          <g class="leg-b">
            <path d="M0,0 L26,44 L38,88" fill="none" stroke="#637075"
                  stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
            <g transform="translate(38,88) rotate(15)">
              <ellipse rx="11" ry="6" fill="#4a5559"/>
            </g>
          </g>
        </g>

        <!-- body -->
        <ellipse cx="365" cy="228" rx="58" ry="42" fill="#fbfbf9" stroke="#d9d9d5"
                  stroke-width="2" transform="rotate(-25 365 228)"/>
        <ellipse cx="402" cy="220" rx="30" ry="27" fill="#fbfbf9"/>

        <!-- neck -->
        <ellipse cx="418" cy="190" rx="24" ry="32" fill="#fbfbf9" stroke="#d9d9d5"
                  stroke-width="2" transform="rotate(-40 418 190)"/>

        <!-- wing -->
        <g transform="translate(378,200)">
          <g class="wing">
            <path d="M0,0 C14,-16 42,-22 66,-8 C52,2 34,10 18,14 C8,16 0,10 -2,2 Z"
                  fill="#e7e7e3" stroke="#c7c7c2" stroke-width="1.5"/>
            <path d="M34,-10 C46,-18 58,-14 66,-8 C58,-2 46,4 36,8 C32,2 32,-4 34,-10 Z"
                  fill="#2c2c2c"/>
          </g>
        </g>

        <!-- front leg (in front of body) -->
        <g transform="translate(335,258)">
          <g class="leg-a">
            <path d="M0,0 L26,44 L38,88" fill="none" stroke="#8b98a0"
                  stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
            <g transform="translate(38,88) rotate(15)">
              <ellipse rx="11" ry="6" fill="#5a6569"/>
            </g>
          </g>
        </g>

        <!-- head -->
        <circle cx="462" cy="158" r="25" fill="#fbfbf9" stroke="#d9d9d5" stroke-width="2"/>

        <!-- pouch + beak -->
        <path d="M498,158 C512,172 528,182 545,182 C558,182 566,174 572,160 C556,172 522,172 498,158 Z"
              fill="#f6c96b"/>
        <path d="M482,148 L590,138 L598,148 L500,160 Z"
              fill="#f5a623" stroke="#d68a12" stroke-width="1.5" stroke-linejoin="round"/>

        <!-- eye -->
        <circle cx="472" cy="150" r="3.5" fill="#202020"/>
        <circle cx="473.2" cy="148.8" r="1" fill="#ffffff"/>

      </g>
    </svg>
  </div>
</body>
</html>
