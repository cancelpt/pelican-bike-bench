  html, body {
    margin: 0;

    background: #6eb7d6;
    overflow: hidden;
  }
  svg {
    width: 100vw;
    height: 100vh;
    display: block;
  }
  .cloud1 { animation: drift 52s linear infinite; }
  .cloud2 { animation: drift 70s linear infinite; animation-delay: -26s; }
  .cloud3 { animation: drift 60s linear infinite; animation-delay: -41s; }
  .bird1 { animation: fly 34s linear infinite; }
  .bird2 { animation: fly 46s linear infinite; animation-delay: -19s; }
  @keyframes drift {
    from { transform: translateX(1080px); }
    to { transform: translateX(-420px); }
  }
  @keyframes fly {
    from { transform: translateX(1040px); }
    to { transform: translateX(-180px); }
  }
  @keyframes sunpulse {
    50% { opacity: 0.16; }
  }
  #sun-glow { animation: sunpulse 7s ease-in-out infinite; }
</style>

      <ellipse cx="530" cy="158" rx="22" ry="20" fill="url(#bodyGrad)" stroke="#E4D3C0" stroke-width="1.1"/>
      <path d="M 546 148 C 590 142, 634 152, 656 166 C 662 170, 654 176, 646 173 C 608 164, 568 160, 546 158 Z" fill="url(#beakGrad)"/>
      <path d="M 646 162 C 664 164, 666 176, 650 180 C 644 174, 640 166, 646 162 Z" fill="#E07A4A"/>
      <path d="M 552 151 C 600 148, 638 156, 654 166" fill="none" stroke="#FFD7A4" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
      <path d="M 558 154 L 568 156.5" fill="none" stroke="#C47A32" stroke-width="1.1" stroke-linecap="round"/>
      <g id="pouch">
        <g id="fish">
          <path d="M 604 200 C 612 198, 616 204, 610 208 C 614 210, 612 216, 604 212 C 606 208, 606 204, 604 200 Z" fill="#C5D8E0"/>
          <path d="M 610 206 L 624 198 L 618 208 L 624 218 Z" fill="#A9C6D2"/>
        </g>
        <path d="M 544 160 C 562 190, 598 214, 640 208 C 656 204, 658 186, 648 174 C 612 190, 572 186, 546 166 Z" fill="url(#pouchGrad)" stroke="#E09A3C" stroke-width="1"/>
        <path d="M 566 176 C 596 170, 630 178, 646 190" fill="none" stroke="#FFE7A8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
        <path d="M 574 188 C 600 196, 626 196, 642 188" fill="none" stroke="#E09A3C" stroke-width="0.7" opacity="0.45" stroke-linecap="round"/>
      </g>
      <circle cx="540" cy="154" r="7" fill="#F3D07A"/>
      <circle cx="540" cy="154" r="5.1" fill="#fff"/>
      <circle cx="542.2" cy="154.2" r="2.7" fill="#1B2A4A"/>
      <circle cx="543.2" cy="153.1" r="1" fill="#fff"/>
      <path d="M 532 145 Q 539 142.5, 548 146" fill="none" stroke="#E4D0BC" stroke-width="1.2" stroke-linecap="round"/>
      <ellipse id="eyelid" cx="540" cy="142" rx="8" ry="5.5" fill="#FFFDF9"/>
    </g>
  </g>

  <path id="wing-arm" d="" fill="#FFFDF9" stroke="#E4D3C0" stroke-width="1.2" stroke-linejoin="round"/>
  <path id="wing-tip" d="" fill="#243447"/>
</svg>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var rearSpin = $("spokes-rear");
  var frontSpin = $("spokes-front");
  var cogSpin = $("cog-spin");
  var ringSpin = $("ring-spin");
  var crank = $("crank");
  var chainTop = $("chain-top");
  var chainBot = $("chain-bot");
  var legFar = $("leg-far");
  var legNear = $("leg-near");
  var kneeFar = $("knee-far");
  var kneeNear = $("knee-near");
  var footFar = $("foot-far");
  var footNear = $("foot-near");
  var pedalFar = $("pedal-far");
  var pedalNear = $("pedal-near");
  var rider = $("rider");
  var neck = $("neck");
  var headgroup = $("headgroup");
  var pouch = $("pouch");
  var fish = $("fish");
  var tail = $("tail");
  var wingArm = $("wing-arm");
  var wingTip = $("wing-tip");
  var eyelid = $("eyelid");
  var groundNear = $("ground-near");
  var groundFar = $("ground-far");
  var wave1 = $("wave1");
  var wave2 = $("wave2");
  var wave3 = $("wave3");
  var shadow = $("shadow");
  var sunReflect = $("sun-reflect");
  var dust = [$("dust-0"), $("dust-1"), $("dust-2")];

  var bb = { x: 436, y: 392 };
  var crankLen = 26;
  var wheelR = 52;
  var gear = 1.65;
  var crankOmega = Math.PI * 2 / 1.15;
  var hipNear0 = { x: 398, y: 306 };
  var hipFar0 = { x: 386, y: 310 };
  var thigh = 66;
  var shin = 62;
  var grip = { x: 500, y: 286 };

  function pick(a, b) {
    if (Math.abs(a.y - b.y) < 2) return a.x >= b.x ? a : b;
    return a.y < b.y ? a : b;
  }

  function knee(hip, foot, L1, L2) {
    var dx = foot.x - hip.x;
    var dy = foot.y - hip.y;
    var raw = Math.hypot(dx, dy) || 0.001;
    var max = L1 + L2 - 0.8;
    var min = Math.abs(L1 - L2) + 0.8;
    var dist = Math.min(max, Math.max(min, raw));
    var ux = dx / raw;
    var uy = dy / raw;
    var a = (L1 * L1 - L2 * L2 + dist * dist) / (2 * dist);
    var h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    var mx = hip.x + ux * a;
    var my = hip.y + uy * a;
    return pick(
      { x: mx - uy * h, y: my + ux * h },
      { x: mx + uy * h, y: my - ux * h }
    );
  }

  function wave(y, amp, len, phase) {
    var d = "";
    for (var x = -30; x <= 990; x += 14) {
      var yy = y + Math.sin((x + phase) / len) * amp;
      d += (x === -30 ? "M " : " L ") + x + " " + yy.toFixed(1);
    }
    return d;
  }

  function tick(now) {
    var t = now / 1000;
    var crankA = t * crankOmega;
    var wheelA = crankA * gear;
    var bob = Math.sin(crankA * 2) * 1.6;
    var deg = function (r) { return r * 180 / Math.PI; };

    rearSpin.setAttribute("transform", "rotate(" + deg(wheelA) + ")");
    frontSpin.setAttribute("transform", "rotate(" + deg(wheelA) + ")");
    cogSpin.setAttribute("transform", "rotate(" + deg(wheelA) + ")");
    ringSpin.setAttribute("transform", "rotate(" + deg(crankA) + ")");
    crank.setAttribute("transform", "translate(" + bb.x + "," + bb.y + ") rotate(" + deg(crankA) + ")");

    var dash = (wheelA * 9) % 5.6;
    chainTop.setAttribute("stroke-dashoffset", String(-dash));
    chainBot.setAttribute("stroke-dashoffset", String(dash));

    var near = {
      x: bb.x + Math.cos(crankA) * crankLen,
      y: bb.y + Math.sin(crankA) * crankLen
    };
    var far = {
      x: bb.x + Math.cos(crankA + Math.PI) * crankLen - 3,
      y: bb.y + Math.sin(crankA + Math.PI) * crankLen + 1
    };
    var hipN = { x: hipNear0.x, y: hipNear0.y + bob };
    var hipF = { x: hipFar0.x, y: hipFar0.y + bob };
    var kN = knee(hipN, near, thigh, shin);
    var kF = knee(hipF, far, thigh, shin);

    legNear.setAttribute("d", "M " + hipN.x + " " + hipN.y + " L " + kN.x.toFixed(1) + " " + kN.y.toFixed(1) + " L " + near.x.toFixed(1) + " " + near.y.toFixed(1));
    legFar.setAttribute("d", "M " + hipF.x + " " + hipF.y + " L " + kF.x.toFixed(1) + " " + kF.y.toFixed(1) + " L " + far.x.toFixed(1) + " " + far.y.toFixed(1));
    kneeNear.setAttribute("cx", kN.x.toFixed(1));
    kneeNear.setAttribute("cy", kN.y.toFixed(1));
    kneeFar.setAttribute("cx", kF.x.toFixed(1));
    kneeFar.setAttribute("cy", kF.y.toFixed(1));

    var ankleN = Math.sin(crankA) * 14;
    var ankleF = Math.sin(crankA + Math.PI) * 14;
    footNear.setAttribute("transform", "translate(" + near.x.toFixed(1) + "," + near.y.toFixed(1) + ") rotate(" + ankleN.toFixed(1) + ")");
    footFar.setAttribute("transform", "translate(" + far.x.toFixed(1) + "," + far.y.toFixed(1) + ") rotate(" + ankleF.toFixed(1) + ") scale(0.92)");
    pedalNear.setAttribute("transform", "translate(" + near.x.toFixed(1) + "," + near.y.toFixed(1) + ")");
    pedalFar.setAttribute("transform", "translate(" + far.x.toFixed(1) + "," + far.y.toFixed(1) + ")");

    rider.setAttribute("transform", "translate(0," + bob.toFixed(2) + ")");
    var stable = "translate(0," + (-bob * 0.5).toFixed(2) + ")";
    neck.setAttribute("transform", stable);
    headgroup.setAttribute("transform", stable);

    var sag = 1 + Math.sin(t * 3.1) * 0.04;
    pouch.setAttribute("transform", "translate(548,164) scale(1," + sag.toFixed(3) + ") translate(-548,-164)");
    fish.setAttribute("transform", "rotate(" + (Math.sin(t * 7) * 11).toFixed(1) + " 612 206)");

    tail.setAttribute("transform", "rotate(" + (Math.sin(t * 2.3) * 3).toFixed(2) + " 372 266)");

    var sx = 448;
    var sy = 262 + bob;
    var gx = grip.x;
    var gy = grip.y;
    wingArm.setAttribute("d",
      "M " + (sx - 4) + " " + (sy - 6) +
      " C " + (sx + 28) + " " + (sy - 2) + ", " + (gx - 48) + " " + (gy - 16) + ", " + (gx - 4) + " " + (gy - 4) +
      " C " + (gx + 8) + " " + (gy - 1) + ", " + (gx + 5) + " " + (gy + 7) + ", " + (gx - 10) + " " + (gy + 6) +
      " C " + (gx - 42) + " " + (gy + 8) + ", " + (sx + 18) + " " + (sy + 16) + ", " + (sx - 8) + " " + (sy + 10) +
      " Z"
    );
    wingTip.setAttribute("d",
      "M " + (gx - 22) + " " + (gy - 5) +
      " L " + (gx + 2) + " " + (gy - 1) +
      " L " + (gx - 4) + " " + (gy + 7) +
      " L " + (gx - 18) + " " + (gy + 5) +
      " Z"
    );

    var m = t % 3.8;
    var closed = 0;
    if (m < 0.09) closed = m / 0.09;
    else if (m < 0.16) closed = 1 - (m - 0.09) / 0.07;
    else if (m > 0.28 && m < 0.36) closed = (m - 0.28) / 0.08;
    else if (m >= 0.36 && m < 0.44) closed = 1 - (m - 0.36) / 0.08;
    eyelid.setAttribute("cy", (142 + closed * 14).toFixed(2));

    var dist = wheelA * wheelR;
    groundNear.setAttribute("transform", "translate(" + (-(dist % 960)) + ",0)");
    groundFar.setAttribute("transform", "translate(" + (-((dist * 0.38) % 960)) + ",0)");

    wave1.setAttribute("d", wave(330, 4.5, 42, t * 46));
    wave2.setAttribute("d", wave(346, 3.4, 30, t * 28 + 18));
    wave3.setAttribute("d", wave(358, 2.6, 22, t * 20 + 8));
    sunReflect.setAttribute("opacity", (0.16 + Math.sin(t * 1.5) * 0.06).toFixed(3));
    shadow.setAttribute("rx", (122 + Math.sin(crankA * 2) * 5).toFixed(1));

    for (var i = 0; i < 3; i++) {
      var age = (t * 1.7 + i / 3) % 1;
      dust[i].setAttribute("cx", (338 - age * 46).toFixed(1));
      dust[i].setAttribute("cy", (446 - Math.sin(age * Math.PI) * 11).toFixed(1));
      dust[i].setAttribute("r", (1.4 + age * 3.6).toFixed(1));
      dust[i].setAttribute("opacity", ((1 - age) * 0.3).toFixed(3));
    }
  }

  tick(performance.now());
  requestAnimationFrame(function loop(now) {
    tick(now);
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
