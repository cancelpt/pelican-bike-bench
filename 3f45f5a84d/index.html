<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:24px 16px;
    background:radial-gradient(1200px 600px at 50% 0%,#20364f 0%,#0e1a26 70%);
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    color:#cfe3f5;
  }
  h1{
    margin:0;
    font-size:20px;
    font-weight:600;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:#eaf4ff;
  }
  h1 span{display:block;font-size:12px;letter-spacing:.5em;opacity:.55;margin-top:6px}
  .stage{
    width:min(100%,1000px);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);
    line-height:0;
  }
  svg{display:block;width:100%;height:auto}

  /* ---------- 环境滚动 ---------- */
  .strip{transform-box:view-box}
  .far    {animation:scrollFar 90s linear infinite}
  .mid    {animation:scrollMid 34s linear infinite}
  .hedge  {animation:scrollHedge 11s linear infinite}
  .cloudA {animation:scrollFar 62s linear infinite}
  .cloudB {animation:scrollFar 40s linear infinite}
  .birds  {animation:scrollFar 22s linear infinite}
  .dash   {animation:scrollDash .8s linear infinite}

  @keyframes scrollFar   {from{transform:translateX(0)}      to{transform:translateX(-900px)}}
  @keyframes scrollMid   {from{transform:translateX(0)}      to{transform:translateX(-900px)}}
  @keyframes scrollHedge {from{transform:translateX(0)}      to{transform:translateX(-160px)}}
  @keyframes scrollDash  {from{transform:translateX(0)}      to{transform:translateX(-120px)}}

  /* ---------- 车轮 ---------- */
  .wheel{transform-box:view-box;animation:spin .8s linear infinite}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

  /* ---------- 鹈鹕 ---------- */
  #pelican{transform-box:view-box;transform-origin:378px 205px;animation:bob .40s ease-in-out infinite alternate}
  @keyframes bob{from{transform:translateY(1px) rotate(-1.5deg)}to{transform:translateY(-3.5px) rotate(1.5deg)}}

  #neck{transform-box:view-box;transform-origin:424px 180px;animation:neckBob .46s ease-in-out infinite alternate-reverse}
  @keyframes neckBob{from{transform:rotate(-3deg)}to{transform:rotate(2.5deg)}}

  #head{transform-box:view-box;transform-origin:452px 130px;animation:headBob .38s ease-in-out infinite alternate}
  @keyframes headBob{from{transform:rotate(-2.4deg) translateY(0)}to{transform:rotate(2.4deg) translateY(-1.5px)}}

  #pouch{transform-box:view-box;transform-origin:498px 130px;animation:pouch .40s ease-in-out infinite alternate}
  @keyframes pouch{from{transform:scaleY(1) scaleX(1)}to{transform:scaleY(1.14) scaleX(.95)}}

  #wing{transform-box:view-box;transform-origin:334px 192px;animation:flap .8s ease-in-out infinite alternate}
  @keyframes flap{from{transform:rotate(-5deg)}to{transform:rotate(4deg)}}

  #tail{transform-box:view-box;transform-origin:322px 196px;animation:wag .8s ease-in-out infinite alternate}
  @keyframes wag{from{transform:rotate(-3.5deg)}to{transform:rotate(3.5deg)}}

  /* ---------- 速度线 ---------- */
  #speed{animation:speed .8s linear infinite;transform-box:view-box}
  #speed line{animation:speedLine .8s ease-in infinite}
  #speed line:nth-child(2){animation-delay:-.26s}
  #speed line:nth-child(3){animation-delay:-.52s}
  @keyframes speed{from{opacity:.85;transform:translateX(0)}to{opacity:.85;transform:translateX(-70px)}}
  @keyframes speedLine{0%{opacity:0}30%{opacity:1}100%{opacity:0}}

  .sun{transform-box:view-box;transform-origin:768px 82px;animation:pulse 6s ease-in-out infinite alternate}
  @keyframes pulse{from{transform:scale(1);opacity:.95}to{transform:scale(1.06);opacity:1}}

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important}
  }
</style>
</head>

<p style="margin:0;font-size:12px;letter-spacing:.14em;opacity:.5">纯 SVG + CSS/JS 动画 · 视差滚动 · 双骨逆向运动学踩踏</p>

<script>
(function () {
  var SCENE = document.getElementById('scene');
  var BB = { x: 410, y: 300 };      // 中轴（曲柄中心）
  var R  = 20;                      // 脚踏半径
  var L1 = 62, L2 = 60;             // 大腿 / 小腿长度
  var PERIOD = 0.8;                 // 一圈脚踏所需秒数（与车轮转速一致）

  var crankNear = document.getElementById('crankNear');
  var crankFar  = document.getElementById('crankFar');
  var pedalNear = document.getElementById('pedalNear');
  var pedalFar  = document.getElementById('pedalFar');
  var thighNear = document.getElementById('thighNear');
  var shinNear  = document.getElementById('shinNear');
  var thighFar  = document.getElementById('thighFar');
  var shinFar   = document.getElementById('shinFar');

  var hipNear = { x: 384, y: 212 };
  var hipFar  = { x: 366, y: 214 };

  // 两骨逆向运动学：鹈鹕的可见关节向后弯
  function solve(hip, foot, thigh, shin) {
    var dx = foot.x - hip.x, dy = foot.y - hip.y;
    var d = Math.hypot(dx, dy);
    var max = L1 + L2 - 0.5, min = Math.abs(L1 - L2) + 0.5;
    if (d > max) { var s = max / d; dx *= s; dy *= s; d = max; }
    if (d < min) { var s2 = min / d; dx *= s2; dy *= s2; d = min; }

    var a0 = Math.atan2(dy, dx);
    var cosA = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
    var alpha = Math.acos(Math.max(-1, Math.min(1, cosA)));
    var t1 = a0 + alpha;                       // 关节向后（鸟类）
    var kx = hip.x + L1 * Math.cos(t1);
    var ky = hip.y + L1 * Math.sin(t1);
    var t2 = Math.atan2(foot.y - ky, foot.x - kx) - t1;

    thigh.setAttribute('transform', 'rotate(' + (t1 * 180 / Math.PI) + ' ' + hip.x + ' ' + hip.y + ')');
    shin.setAttribute('transform', 'translate(' + kx + ' ' + ky + ') rotate(' + (t2 * 180 / Math.PI) + ')');
  }

  var t0 = null;
  function frame(now) {
    if (t0 === null) t0 = now;
    var t = (now - t0) / 1000;
    var deg = (t / PERIOD) * 360;
    var a = deg * Math.PI / 180;

    var rot = 'rotate(' + deg + ' ' + BB.x + ' ' + BB.y + ')';
    crankNear.setAttribute('transform', rot);
    crankFar.setAttribute('transform', rot);
    pedalNear.setAttribute('transform', 'rotate(' + (-deg) + ' 430 300)');   // 脚踏保持水平
    pedalFar.setAttribute('transform', 'rotate(' + (-deg) + ' 390 300)');

    var c = Math.cos(a), s = Math.sin(a);
    solve(hipNear, { x: BB.x + R * c, y: BB.y + R * s }, thighNear, shinNear);
    solve(hipFar,  { x: BB.x - R * c, y: BB.y - R * s }, thighFar,  shinFar);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
