<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#edf1e9">
  <title>鹈鹕的沿海骑行</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #213d46;
      --muted: #688087;
      --paper: #edf1e9;
      --white: #fffdf6;
      --accent: #df704f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.9), transparent 30%),
        radial-gradient(circle at 88% 82%, rgba(190, 215, 199, 0.45), transparent 32%),
        var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(1180px, 100%);
    }

    .heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin: 0 4px 20px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 42px);
      font-weight: 750;
      letter-spacing: -0.045em;
      line-height: 1.12;
    }

    .motion-toggle {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 44px;
      padding: 10px 17px;
      border: 1px solid rgba(33, 61, 70, 0.15);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255, 253, 246, 0.72);
      box-shadow: 0 4px 14px rgba(33, 61, 70, 0.05);
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    .motion-toggle:hover {
      background: var(--white);
      transform: translateY(-1px);
    }

    .motion-toggle:focus-visible {
      outline: 3px solid rgba(223, 112, 79, 0.3);
      outline-offset: 3px;
    }

    .motion-toggle svg {
      width: 16px;
      height: 16px;
    }

    .icon-play,
    .motion-toggle[data-paused="true"] .icon-pause {
      display: none;
    }

    .motion-toggle[data-paused="true"] .icon-play {
      display: block;
    }

    .canvas {
      overflow: hidden;
      border: 1px solid rgba(33, 61, 70, 0.1);
      border-radius: 28px;
      background: #dce9df;
      box-shadow:
        0 24px 60px rgba(43, 71, 70, 0.12),
        0 3px 10px rgba(43, 71, 70, 0.06);
    }

    #pelican-scene {
      display: block;
      width: 100%;
      height: auto;
    }

    .caption {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin: 14px 6px 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    @media (max-width: 640px) {
      body {
        padding: 18px;
      }

      .heading {
        align-items: center;
        margin-bottom: 14px;
      }

      .motion-toggle {
        width: 44px;
        padding: 10px;
        justify-content: center;
      }

      .motion-toggle span {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      .canvas {
        border-radius: 20px;
      }

      .caption span:last-child {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .motion-toggle {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="heading">

        <h1>鹈鹕，沿海骑行。</h1>

          <rect x="9.5" y="2" width="3.5" height="12" rx="1"></rect>

        <svg class="icon-play" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M4 2.8c0-.9 1-1.5 1.8-1L13.2 7a1.2 1.2 0 0 1 0 2L5.8 14.2c-.8.5-1.8-.1-1.8-1V2.8Z"></path>
        </svg>
        <span id="motion-label">暂停动画</span>

  <script>
    const scene = document.getElementById('pelican-scene');
    const toggle = document.getElementById('motion-toggle');
    const label = document.getElementById('motion-label');
    let paused = false;

    function updateMotion() {
      toggle.dataset.paused = String(paused);
      toggle.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
      label.textContent = paused ? '继续骑行' : '暂停动画';

      if (paused) {
        scene.pauseAnimations();
      } else {
        scene.unpauseAnimations();
      }
    }

    toggle.addEventListener('click', () => {
      paused = !paused;
      updateMotion();
    });

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      paused = true;
      updateMotion();
    }
  </script>
