<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #d9effb; font-family: sans-serif; }
  .card { background: #eaf7ff; border-radius: 28px; padding: 16px; box-shadow: 0 16px 48px rgba(30, 90, 140, .25); }
  svg { display: block; border-radius: 18px; overflow: hidden; }
</style>
</head>
<body>
<div class="card">
<svg width="820" height="540" viewBox="0 0 820 540" xmlns="http://www.w3.org/2000/svg">
  <rect width="820" height="540" fill="#bfe9f7"/>
  <circle cx="730" cy="88" r="42" fill="#ffd23f"/>
  <g fill="#ffffff" opacity=".92">
    <ellipse cx="150" cy="120" rx="72" ry="24"/>
    <ellipse cx="196" cy="106" rx="52" ry="20"/>
  </g>
  <g fill="#ffffff" opacity=".85">
    <ellipse cx="660" cy="66" rx="58" ry="19"/>
    <ellipse cx="696" cy="58" rx="42" ry="15"/>
  </g>
  <rect x="0" y="420" width="820" height="120" fill="#8fd06f"/>
  <path d="M0 420 Q 410 404 820 420" stroke="#7cc463" stroke-width="6" fill="none"/>

  <g>
    <circle cx="180" cy="350" r="70" fill="#ffffff" stroke="#222222" stroke-width="8"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 180 350" to="360 180 350" dur="1.2s" repeatCount="indefinite"/>
      <line x1="180" y1="350" x2="180" y2="280" stroke="#222222" stroke-width="5"/>
      <line x1="180" y1="350" x2="180" y2="420" stroke="#222222" stroke-width="5"/>
      <line x1="180" y1="350" x2="110" y2="350" stroke="#222222" stroke-width="5"/>
      <line x1="180" y1="350" x2="250" y2="350" stroke="#222222" stroke-width="5"/>
      <circle cx="180" cy="350" r="7" fill="#222222"/>
    </g>
  </g>

  <g>
    <circle cx="540" cy="350" r="70" fill="#ffffff" stroke="#222222" stroke-width="8"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 540 350" to="360 540 350" dur="1.2s" repeatCount="indefinite"/>
      <line x1="540" y1="350" x2="540" y2="280" stroke="#222222" stroke-width="5"/>
      <line x1="540" y1="350" x2="540" y2="420" stroke="#222222" stroke-width="5"/>
      <line x1="540" y1="350" x2="470" y2="350" stroke="#222222" stroke-width="5"/>
      <line x1="540" y1="350" x2="610" y2="350" stroke="#222222" stroke-width="5"/>
    </g>
  </g>

  <g stroke="#222222" stroke-width="6" fill="none" stroke-linecap="round">
    <line x1="180" y1="350" x2="238" y2="196"/>
    <line x1="238" y1="196" x2="250" y2="158" stroke-width="5"/>
    <line x1="238" y1="196" x2="306" y2="154"/>
    <line x1="198" y1="240" x2="306" y2="154"/>
    <line x1="306" y1="154" x2="316" y2="186"/>
  </g>
  <line x1="540" y1="350" x2="312" y2="186" stroke="#222222" stroke-width="6" stroke-linecap="round"/>
  <rect x="252" y="144" width="38" height="11" rx="5" fill="#555555"/>
  <line x1="316" y1="186" x2="292" y2="158" stroke="#222222" stroke-width="6" stroke-linecap="round"/>
  <line x1="252" y1="151" x2="336" y2="147" stroke="#222222" stroke-width="9" stroke-linecap="round"/>

  <circle cx="198" cy="240" r="16" fill="none" stroke="#555555" stroke-width="4"/>
  <circle cx="180" cy="304" r="6" fill="#555555"/>
  <line x1="198" y1="224" x2="180" y2="298" stroke="#999999" stroke-width="3" stroke-linecap="round"/>
  <line x1="198" y1="256" x2="180" y2="356" stroke="#999999" stroke-width="3" stroke-linecap="round"/>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 198 250" to="360 198 250" dur="1.6s" repeatCount="indefinite"/>
    <line x1="198" y1="250" x2="228" y2="250" stroke="#222222" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="228" cy="250" rx="10" ry="6" fill="#f6a93b"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -3" dur="0.45s" repeatCount="indefinite"/>
    <ellipse cx="252" cy="286" rx="11" ry="7" fill="#f6a93b"/>
    <ellipse cx="298" cy="245" rx="38" ry="48" fill="#2b2b2b"/>
    <ellipse cx="314" cy="250" rx="22" ry="30" fill="#ffffff"/>
    <circle cx="304" cy="178" r="24" fill="#2b2b2b"/>
    <circle cx="306" cy="168" r="4" fill="#ffffff"/>
    <circle cx="315" cy="173" r="4" fill="#ffffff"/>
    <circle cx="307" cy="168" r="2" fill="#111111"/>
    <circle cx="316" cy="173" r="2" fill="#111111"/>
    <ellipse cx="328" cy="171" rx="10" ry="6" fill="#f6a93b" transform="rotate(-18 328 171)"/>
    <ellipse cx="266" cy="245" rx="10" ry="24" fill="#2b2b2b" transform="rotate(16 266 245)"/>
    <ellipse cx="336" cy="245" rx="10" ry="24" fill="#2b2b2b" transform="rotate(-16 336 245)"/>
  </g>
</svg>
</div>
</body>
</html>
