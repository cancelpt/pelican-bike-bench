<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pelican Express</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17324d;
        --muted: #5c7489;
        --cream: #fff8e9;
        --coral: #f47863;
        --orange: #f7a443;
        --teal: #36b4ac;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        overflow-x: hidden;
        padding: 28px;
        background:
          radial-gradient(circle at 8% 12%, rgba(255, 255, 255, 0.72) 0 2px, transparent 3px),
          linear-gradient(135deg, #f8f0dc 0%, #dcebea 100%);
        color: var(--ink);
        font-family: "Trebuchet MS", "Avenir Next", sans-serif;
      }

      .poster {
        position: relative;
        width: min(1120px, 100%);
        overflow: hidden;
        border: 1px solid rgba(23, 50, 77, 0.1);
        border-radius: 30px;
        background: #bde6e3;
        box-shadow: 0 24px 70px rgba(38, 71, 82, 0.18);
      }

      .poster::before,
      .poster::after {
        position: absolute;
        z-index: 2;
        pointer-events: none;
        content: "";
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 50%;
      }

      .poster::before {
        width: 360px;
        height: 360px;
        top: -242px;
        right: -112px;
      }

      .poster::after {
        width: 220px;
        height: 220px;
        bottom: -164px;
        left: -90px;
      }

      .topline {
        position: absolute;
        z-index: 4;
        top: 28px;
        left: 34px;
        display: flex;
        align-items: center;
        gap: 12px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .topline .mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 12px;
        background: var(--coral);
        color: white;
        font-size: 18px;
        box-shadow: 0 6px 12px rgba(244, 120, 99, 0.3);
      }

      .topline span:last-child {
        color: rgba(23, 50, 77, 0.68);
        font-size: 11px;
        font-weight: 800;
      }

      .caption {
        position: absolute;
        z-index: 4;
        right: 35px;
        bottom: 28px;
        width: min(252px, calc(100% - 70px));
        padding: 17px 19px 16px;
        border: 1px solid rgba(23, 50, 77, 0.12);
        border-radius: 17px;
        background: rgba(255, 255, 255, 0.65);
        box-shadow: 0 9px 24px rgba(38, 71, 82, 0.08);
        backdrop-filter: blur(10px);
      }

      .caption h1 {
        margin: 0 0 4px;
        color: var(--ink);
        font-size: clamp(20px, 3vw, 29px);
        letter-spacing: -0.04em;
        line-height: 1;
      }

      .caption p {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1.5;
      }

      svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .cloud {
        animation: cloud-drift 17s ease-in-out infinite alternate;
        transform-box: fill-box;
        transform-origin: center;
      }

      .cloud--slow {
        animation-duration: 24s;
        animation-delay: -8s;
      }

      .sun-glow {
        animation: sun-pulse 4s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .road-dash {
        animation: road-slide 1.1s linear infinite;
      }

      .wheel {
        animation: wheel-spin 0.9s linear infinite;
        transform-box: fill-box;
      }

      .wheel--rear {
        transform-origin: 472px 549px;
      }

      .wheel--front {
        transform-origin: 759px 549px;
      }

      .pedal-crank {
        animation: crank-spin 0.9s linear infinite;
        transform-box: fill-box;
        transform-origin: 615px 548px;
      }

      .rider {
        animation: rider-bob 0.45s ease-in-out infinite alternate;
        transform-box: fill-box;
        transform-origin: center bottom;
      }

      .leg {
        transform-box: fill-box;
        transform-origin: center top;
      }

      .leg--front {
        animation: leg-front 0.9s ease-in-out infinite;
      }

      .leg--back {
        animation: leg-back 0.9s ease-in-out infinite;
      }

      .feather {
        animation: feather-flutter 1.35s ease-in-out infinite alternate;
        transform-box: fill-box;
        transform-origin: left center;
      }

      @keyframes cloud-drift {
        from {
          transform: translateX(-10px);
        }
        to {
          transform: translateX(26px);
        }
      }

      @keyframes sun-pulse {
        0%,
        100% {
          opacity: 0.48;
          transform: scale(0.96);
        }
        50% {
          opacity: 0.82;
          transform: scale(1.05);
        }
      }

      @keyframes road-slide {
        to {
          stroke-dashoffset: -96;
        }
      }

      @keyframes wheel-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes crank-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes rider-bob {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(4px);
        }
      }

      @keyframes leg-front {
        0%,
        100% {
          transform: rotate(12deg);
        }
        50% {
          transform: rotate(-15deg);
        }
      }

      @keyframes leg-back {
        0%,
        100% {
          transform: rotate(-14deg);
        }
        50% {
          transform: rotate(15deg);
        }
      }

      @keyframes feather-flutter {
        from {
          transform: rotate(-1deg);
        }
        to {
          transform: rotate(4deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }

      @media (max-width: 620px) {
        body {
          padding: 10px;
        }

        .poster {
          border-radius: 22px;
        }

        .topline {
          top: 18px;
          left: 19px;
          gap: 8px;
        }

        .topline .mark {
          width: 28px;
          height: 28px;
          border-radius: 9px;
          font-size: 15px;
        }

        .topline span:last-child {
          font-size: 9px;
        }

        .caption {
          right: 18px;
          bottom: 18px;
          padding: 12px 14px;
        }

        .caption h1 {
          font-size: 19px;
        }

        .caption p {
          font-size: 9px;
        }
      }
    </style>
  </head>
  <body>
