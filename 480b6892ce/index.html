<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pelican Express — A Coastal Ride</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #204b4a;
      --gold: #f2c24d;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #a9dbe2;
      font-family: "Segoe UI", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    }

    .scene {
      position: fixed;
      inset: 0;
    }

    .scene svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 52% 46%, transparent 42%, rgba(18, 62, 65, 0.16) 100%),
        linear-gradient(180deg, rgba(255, 252, 235, 0.08), transparent 24%);
    }

    .brand {
      position: fixed;
      top: clamp(20px, 4vw, 42px);
      left: clamp(20px, 4.5vw, 56px);
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: none;
      color: var(--ink);
      opacity: 0.9;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .brand-mark {
      width: 11px;
      height: 11px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--gold);
      box-shadow:
        0 0 0 4px rgba(242, 194, 77, 0.22),
        0 2px 7px rgba(83, 65, 20, 0.2);
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand-title {
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.28em;
      line-height: 1;
      white-space: nowrap;
    }

    .brand-sub {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.55;
      white-space: nowrap;
    }

    .track {
      will-change: transform;
    }

    .track--clouds-far { animation: track-slide 145s linear infinite; }
    .track--clouds-near { animation: track-slide 92s linear infinite; }
    .track--hills { animation: track-slide 82s linear infinite; }
    .track--trees { animation: track-slide 38s linear infinite; }
    .track--fence { animation: track-slide 27s linear infinite; }
    .track--foreground { animation: track-slide 6.5s linear infinite; }

    .lane {
      animation: lane-slide 1.05s linear infinite;
    }

    .chain {
      animation: chain-slide 0.55s linear infinite;
    }

    .sun-glow {
      transform-box: view-box;
      transform-origin: 982px 154px;
      animation: sun-breathe 10s ease-in-out infinite;
    }

    .bird {
      animation: bird-bob 5.5s ease-in-out infinite alternate;
    }

    .bird--2 { animation-duration: 6.8s; animation-delay: -2.1s; }
    .bird--3 { animation-duration: 7.4s; animation-delay: -4.4s; }

    .head-bob {
      transform-box: view-box;
      transform-origin: 695px 226px;
      animation: head-bob 3.4s ease-in-out infinite;
    }

    .pouch-bob {
      transform-box: view-box;
      transform-origin: 742px 218px;
      animation: pouch-sway 3.4s ease-in-out infinite;
    }

    .eyelid {
      transform-box: fill-box;
      transform-origin: center;
      transform: scaleY(0);
      animation: blink 5.6s ease-in-out infinite;
    }

    .scarf-tail {
      transform-box: view-box;
      animation: scarf-flutter 2.1s ease-in-out infinite;
    }

    .scarf-tail--1 { transform-origin: 600px 300px; }
    .scarf-tail--2 {
      transform-origin: 602px 311px;
      animation-duration: 2.65s;
      animation-delay: -0.8s;
    }

    .puff {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      animation: puff-away 1.9s ease-out infinite;
    }

    .puff--2 { animation-delay: 0.48s; }
    .puff--3 { animation-delay: 0.96s; }
    .puff--4 { animation-delay: 1.44s; }

    @keyframes track-slide {
      to { transform: translateX(-1200px); }
    }

    @keyframes lane-slide {
      to { stroke-dashoffset: 120; }
    }

    @keyframes chain-slide {
      to { stroke-dashoffset: -18; }
    }

    @keyframes sun-breathe {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.035); opacity: 1; }
    }

    @keyframes bird-bob {
      from { transform: translateY(0); }
      to { transform: translateY(-7px); }
    }

    @keyframes head-bob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-2.5px) rotate(-1.1deg); }
    }

    @keyframes pouch-sway {
      0%, 100% { transform: rotate(0deg) scaleY(1); }
      50% { transform: rotate(1.4deg) scaleY(1.012); }
    }

    @keyframes scarf-flutter {
      0%, 100% { transform: rotate(0deg) skewX(0deg); }
      35% { transform: rotate(-4deg) skewX(-1.8deg); }
      70% { transform: rotate(2.6deg) skewX(1.2deg); }
    }

    @keyframes blink {
      0%, 91%, 100% { transform: scaleY(0); }
      93.5%, 96% { transform: scaleY(1); }
    }

    @keyframes puff-away {
      0% { transform: translate(0, 0) scale(0.35); opacity: 0.5; }
      30% { opacity: 0.42; }
      100% { transform: translate(-96px, -38px) scale(1.65); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .track,
      .lane,
      .chain,
      .sun-glow,
      .bird,
      .head-bob,
      .pouch-bob,
      .eyelid,
      .scarf-tail,
      .puff {
        animation: none !important;
      }

      .eyelid { transform: scaleY(0); }
      .puff { opacity: 0; }
    }

    @media (max-width: 620px) {
      .brand-sub { display: none; }
      .brand-title { font-size: 10.5px; letter-spacing: 0.22em; }
      .brand { gap: 10px; }
    }
  </style>
</head>

  <script>
    (() => {
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const $ = (id) => document.getElementById(id);
      const rearSpin = $('rearSpin');
      const frontSpin = $('frontSpin');
      const farCrank = $('farCrank');
      const nearCrank = $('nearCrank');
      const farPedal = $('farPedal');
      const nearPedal = $('nearPedal');
      const farFoot = $('farFoot');
      const nearFoot = $('nearFoot');
      const farLeg = $('farLeg');
      const nearLeg = $('nearLeg');
      const farLegOutline = $('farLegOutline');
      const nearLegOutline = $('nearLegOutline');
      const farKnee = $('farKnee');
      const nearKnee = $('nearKnee');
      const chainringSpin = $('chainringSpin');

      const BB = { x: 610, y: 682 };
      const CRANK_RADIUS = 46;
      const WHEEL_SPEED = 360;   // degrees per second
      const CRANK_SPEED = 272;   // degrees per second

      const hips = {
        far: { x: 565, y: 448 },
        near: { x: 592, y: 462 }
      };

      const initialCrankDeg = 205;

      // The leg uses a soft backward bow rather than a strict two-bone solve, so
      // it stays compact and bird-like while the webbed foot follows the pedal.
      function getJoint(hip, foot, bendAmount, fraction) {
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const length = Math.hypot(dx, dy) || 1;

        return {
          x: hip.x + dx * fraction - (dy / length) * bendAmount,
          y: hip.y + dy * fraction + (dx / length) * bendAmount
        };
      }

      function legPath(hip, knee, ankle) {
        return `M${hip.x.toFixed(1)} ${hip.y.toFixed(1)} L${knee.x.toFixed(1)} ${knee.y.toFixed(1)} L${ankle.x.toFixed(1)} ${ankle.y.toFixed(1)}`;
      }

      function poseLeg(hip, target, bendAmount, legEl, outlineEl, kneeEl, footEl) {
        const knee = getJoint(hip, target, bendAmount, 0.46);
        const path = legPath(hip, knee, target);

        legEl.setAttribute('d', path);
        outlineEl.setAttribute('d', path);
        kneeEl.setAttribute('cx', knee.x.toFixed(1));
        kneeEl.setAttribute('cy', knee.y.toFixed(1));
        footEl.setAttribute('transform', `translate(${target.x.toFixed(1)} ${target.y.toFixed(1)})`);
      }

      function render(t) {
        const wheelDeg = (t * WHEEL_SPEED) % 360;
        const crankDeg = (initialCrankDeg + t * CRANK_SPEED) % 360;
        const crankRad = crankDeg * Math.PI / 180;

        rearSpin.setAttribute('transform', `rotate(${wheelDeg.toFixed(2)})`);
        frontSpin.setAttribute('transform', `rotate(${wheelDeg.toFixed(2)})`);
        chainringSpin.setAttribute('transform', `rotate(${crankDeg.toFixed(2)})`);

        nearCrank.setAttribute('transform', `rotate(${crankDeg.toFixed(2)})`);
        farCrank.setAttribute('transform', `rotate(${(crankDeg + 180) % 360})`);

        const nearPedalPos = {
          x: BB.x + Math.cos(crankRad) * CRANK_RADIUS,
          y: BB.y + Math.sin(crankRad) * CRANK_RADIUS
        };
        const farPedalPos = {
          x: BB.x - Math.cos(crankRad) * CRANK_RADIUS,
          y: BB.y - Math.sin(crankRad) * CRANK_RADIUS
        };

        nearPedal.setAttribute('transform', `translate(${nearPedalPos.x.toFixed(1)} ${nearPedalPos.y.toFixed(1)})`);
        farPedal.setAttribute('transform', `translate(${farPedalPos.x.toFixed(1)} ${farPedalPos.y.toFixed(1)})`);

        const nearFootTarget = { x: nearPedalPos.x, y: nearPedalPos.y - 4 };
        const farFootTarget = { x: farPedalPos.x, y: farPedalPos.y - 4 };

        poseLeg(hips.near, nearFootTarget, 34, nearLeg, nearLegOutline, nearKnee, nearFoot);
        poseLeg(hips.far, farFootTarget, 27, farLeg, farLegOutline, farKnee, farFoot);
      }

      if (reduceMotion) {
        render(0.7);
      } else {
        const start = performance.now();

        const tick = (now) => {
          render((now - start) / 1000);
          requestAnimationFrame(tick);
        };

        requestAnimationFrame(tick);
      }
    })();
  </script>
</body>
</html>
