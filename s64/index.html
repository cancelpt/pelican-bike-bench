<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 🚴🐦</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  h1 {
    color: #ffd866;
    font-size: clamp(18px, 3vw, 30px);
    margin: 10px 0 4px;
    text-shadow: 0 2px 12px rgba(255, 200, 60, .45);
    letter-spacing: 2px;
  }
  .subtitle {
    color: #8fa3c8;
    font-size: clamp(11px, 1.4vw, 14px);
    margin-bottom: 10px;
  }
  .stage {
    width: min(94vw, 900px);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 24px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
  }
  svg { display: block; width: 100%; height: auto; }
  .controls {
    margin-top: 14px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  button {
    background: linear-gradient(135deg, #ff9a3c, #ff6b35);
    color: #fff;
    border: none;
    padding: 10px 26px;
    font-size: 15px;
    font-weight: 700;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(255, 122, 58, .4);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  button:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 10px 26px rgba(255,122,58,.55); }
  button:active { transform: scale(.97); }
</style>
</head>
<body>

<h1>🐦 鹈鹕骑自行车 🚴</h1>
<div class="subtitle">一只快乐的鹈鹕，沿着乡间小路骑行 —— 纯 SVG 动画</div>

<div class="stage">
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ec9ee"/>
      <stop offset="55%" stop-color="#c8e6f7"/>
      <stop offset="100%" stop-color="#fdeec9"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a8f98"/>
      <stop offset="100%" stop-color="#6d7278"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6c9"/>
      <stop offset="60%" stop-color="#ffe27a"/>
      <stop offset="100%" stop-color="#ffc94d"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dfe6ee"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9f43"/>
      <stop offset="100%" stop-color="#f07b2d"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb35c"/>
      <stop offset="100%" stop-color="#f28a35"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f7fb"/>
      <stop offset="100%" stop-color="#c3cddd"/>
    </linearGradient>

    <!-- 远处的小树（复制用） -->
    <g id="tree">
      <rect x="-4" y="0" width="8" height="26" rx="3" fill="#7a5230"/>
      <circle cx="0" cy="-12" r="20" fill="#4d8f4a"/>
      <circle cx="-12" cy="-2" r="14" fill="#5da359"/>
      <circle cx="12" cy="-4" r="15" fill="#4d8f4a"/>
    </g>

    <!-- 车轮（复制用） -->
    <g id="wheel">
      <circle r="34" fill="none" stroke="#3a3f47" stroke-width="7"/>
      <circle r="29" fill="none" stroke="#9aa3ad" stroke-width="3"/>
      <g stroke="#c9d2dc" stroke-width="2">
        <line x1="0" y1="-29" x2="0" y2="29"/>
        <line x1="-29" y1="0" x2="29" y2="0"/>
        <line x1="-20.5" y1="-20.5" x2="20.5" y2="20.5"/>
        <line x1="20.5" y1="-20.5" x2="-20.5" y2="20.5"/>
        <line x1="-11" y1="-26.8" x2="11" y2="26.8"/>
        <line x1="11" y1="-26.8" x2="-11" y2="26.8"/>
        <line x1="-26.8" y1="-11" x2="26.8" y2="11"/>
        <line x1="26.8" y1="-11" x2="-26.8" y2="11"/>
      </g>
      <circle r="5" fill="#5b636e"/>
      <circle r="2" fill="#2f343b"/>
    </g>

    <!-- 云朵（复制用） -->
    <g id="cloud" fill="#ffffff" opacity="0.95">
      <ellipse cx="0" cy="0" rx="30" ry="18"/>
      <ellipse cx="24" cy="-8" rx="24" ry="16"/>
      <ellipse cx="-26" cy="-6" rx="20" ry="13"/>
      <ellipse cx="6" cy="8" rx="34" ry="14"/>
    </g>
  </defs>

  <!-- ===== 背景 ===== -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- 太阳 -->
  <g transform="translate(665, 90)">
    <circle r="46" fill="url(#sunGlow)">
      <animate attributeName="r" values="44;48;44" dur="4s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#ffd766" stroke-width="4" stroke-linecap="round" opacity="0.8">
      <line x1="0" y1="-58" x2="0" y2="-70"/>
      <line x1="41" y1="-41" x2="50" y2="-50"/>
      <line x1="58" y1="0" x2="70" y2="0"/>
      <line x1="41" y1="41" x2="50" y2="50"/>
      <line x1="0" y1="58" x2="0" y2="70"/>
      <line x1="-41" y1="41" x2="-50" y2="50"/>
      <line x1="-58" y1="0" x2="-70" y2="0"/>
      <line x1="-41" y1="-41" x2="-50" y2="-50"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 云（漂移） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 60 0; 0 0" dur="38s" repeatCount="indefinite"/>
    <use href="#cloud" x="130" y="80" transform="translate(130,80)"/>
  </g>
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0; -80 0; 0 0" dur="50s" repeatCount="indefinite"/>
    <use href="#cloud" transform="translate(500,130) scale(0.75)"/>
  </g>

  <!-- 远山 -->
  <path d="M0,300 Q120,190 260,285 T560,275 T800,260 L800,500 L0,500 Z" fill="#a8c69f" opacity="0.7"/>
  <path d="M0,330 Q160,240 340,320 T700,310 L800,320 L800,500 L0,500 Z" fill="#8fb287" opacity="0.8"/>

  <!-- 草地 -->
  <rect x="0" y="330" width="800" height="60" fill="#79b36b"/>
  <rect x="0" y="380" width="800" height="120" fill="#5f9e52"/>

  <!-- 树（远近两排） -->
  <g opacity="0.55">
    <animateTransform attributeName="transform" type="translate" values="0 0; -460 0; 0 0" dur="14s" repeatCount="indefinite"/>
    <use href="#tree" transform="translate(90,322) scale(0.9)"/>
    <use href="#tree" transform="translate(300,318) scale(1.05)"/>
    <use href="#tree" transform="translate(520,322) scale(0.85)"/>
    <use href="#tree" transform="translate(720,320) scale(1)"/>
    <use href="#tree" transform="translate(1010,322) scale(0.9)"/>
    <use href="#tree" transform="translate(1220,318) scale(1.05)"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; -640 0; 0 0" dur="10s" repeatCount="indefinite"/>
    <use href="#tree" transform="translate(160,345) scale(1.25)"/>
    <use href="#tree" transform="translate(450,350) scale(1.4)"/>
    <use href="#tree" transform="translate(800,346) scale(1.3)"/>
    <use href="#tree" transform="translate(1090,350) scale(1.4)"/>
  </g>

  <!-- 路边小花（向后移动） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; -420 0; 0 0" dur="4.5s" repeatCount="indefinite"/>
    <g id="flower">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#4c8a3f" stroke-width="2"/>
      <circle cx="0" cy="-4" r="4" fill="#ff6b81"/>
      <circle cx="-4" cy="0" r="3.4" fill="#ff8fa3"/>
      <circle cx="4" cy="0" r="3.4" fill="#ff8fa3"/>
      <circle cx="0" cy="0" r="2.4" fill="#ffd866"/>
    </g>
    <use href="#flower" transform="translate(120,420)"/>
    <use href="#flower" transform="translate(230,432) scale(0.85)"/>
    <use href="#flower" transform="translate(355,418)"/>
    <use href="#flower" transform="translate(470,428) scale(0.9)"/>
    <use href="#flower" transform="translate(590,420)"/>
    <use href="#flower" transform="translate(705,432) scale(0.85)"/>
    <use href="#flower" transform="translate(840,420)"/>
    <use href="#flower" transform="translate(950,432) scale(0.9)"/>
    <use href="#flower" transform="translate(1075,418)"/>
    <use href="#flower" transform="translate(1190,428) scale(0.85)"/>
    <use href="#flower" transform="translate(1260,420)"/>
  </g>

  <!-- 路面 -->
  <rect x="0" y="398" width="800" height="64" fill="url(#road)"/>
  <rect x="0" y="396" width="800" height="4" fill="#a7adb6"/>
  <!-- 车道虚线（向后滚动） -->
  <g fill="#f5f0dc" opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0; -160 0; 0 0" dur="0.7s" repeatCount="indefinite"/>
    <rect x="0" y="426" width="80" height="7" rx="3.5"/>
    <rect x="160" y="426" width="80" height="7" rx="3.5"/>
    <rect x="320" y="426" width="80" height="7" rx="3.5"/>
    <rect x="480" y="426" width="80" height="7" rx="3.5"/>
    <rect x="640" y="426" width="80" height="7" rx="3.5"/>
    <rect x="800" y="426" width="80" height="7" rx="3.5"/>
    <rect x="960" y="426" width="80" height="7" rx="3.5"/>
  </g>

  <!-- 速度线（快速向后移动） -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <animateTransform attributeName="transform" type="translate" values="0 0; -360 0; 0 0" dur="0.45s" repeatCount="indefinite"/>
    <line x1="120" y1="200" x2="230" y2="200"/>
    <line x1="60" y1="250" x2="180" y2="250"/>
    <line x1="180" y1="160" x2="310" y2="160"/>
    <line x1="480" y1="200" x2="590" y2="200"/>
    <line x1="440" y1="250" x2="560" y2="250"/>
    <line x1="540" y1="160" x2="670" y2="160"/>
    <line x1="840" y1="200" x2="950" y2="200"/>
    <line x1="800" y1="250" x2="920" y2="250"/>
    <line x1="900" y1="160" x2="1030" y2="160"/>
  </g>

  <!-- 地面影子 -->
  <ellipse cx="400" cy="446" rx="150" ry="12" fill="#00000022">
    <animate attributeName="rx" values="150;138;150" dur="0.9s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ================= 自行车 + 鹈鹕（整体轻微上下颠） ================= -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="0.9s" repeatCount="indefinite"/>

    <!-- 车轮（转动） -->
    <g transform="translate(290, 390)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
        <use href="#wheel"/>
      </g>
    </g>
    <g transform="translate(510, 390)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
        <use href="#wheel"/>
      </g>
    </g>

    <!-- 远侧曲柄 + 踏板（反向，相位差 180°） -->
    <g transform="translate(400, 372)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="0.9s" repeatCount="indefinite"/>
        <rect x="0" y="-3" width="34" height="6" rx="3" fill="#8f979f"/>
        <rect x="28" y="-8" width="16" height="9" rx="2" fill="#6d747c"/>
        <!-- 远侧腿 -->
        <g stroke="#e8b23f" stroke-width="9" stroke-linecap="round" fill="none">
          <polyline points="376,322 421,346 425,363">
            <animate attributeName="points" dur="0.9s" repeatCount="indefinite"
              values="376,322 421,346 425,363;
                      377,328 424,350 428,365;
                      378,334 427,354 430,366;
                      378,340 430,357 431,367;
                      377,346 433,360 431,367;
                      375,351 435,362 430,367;
                      373,356 436,364 428,366;
                      371,360 438,366 426,364;
                      370,363 438,367 424,362;
                      370,365 438,367 423,360;
                      371,363 436,366 423,359;
                      372,359 435,364 424,359;
                      373,355 432,362 425,360;
                      374,350 429,359 426,361;
                      375,344 426,355 427,362;
                      376,338 423,352 427,363;
                      376,332 421,348 427,363"/>
          </polyline>
        </g>
        <circle cx="376" cy="322" r="7" fill="#e8b23f"/>
      </g>
    </g>

    <!-- 链条 -->
    <g stroke="#4a5058" stroke-width="3" fill="none">
      <path d="M290 378 L400 366"/>
      <path d="M290 402 L400 378"/>
    </g>

    <!-- 车架 -->
    <g stroke="#e0455a" stroke-width="8" stroke-linecap="round" fill="none">
      <line x1="290" y1="390" x2="400" y2="372"/>   <!-- 后下叉 -->
      <line x1="290" y1="390" x2="352" y2="318"/>   <!-- 后上叉 -->
      <line x1="400" y1="372" x2="352" y2="318"/>   <!-- 座管 -->
      <line x1="352" y1="318" x2="472" y2="308"/>   <!-- 上管 -->
      <line x1="400" y1="372" x2="478" y2="330"/>   <!-- 下管 -->
    </g>
    <!-- 前叉 + 车把 -->
    <g stroke="#c93548" stroke-width="8" stroke-linecap="round" fill="none">
      <line x1="510" y1="390" x2="478" y2="330"/>
      <line x1="478" y1="330" x2="462" y2="292"/>
    </g>
    <path d="M462 292 q0 -14 16 -14 l26 0" stroke="#3a3f47" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="508" y="276" r="7" fill="#2f343b"/>
    <!-- 车座 -->
    <path d="M332 318 q20 -12 40 0 q-6 8 -20 8 q-14 0 -20 -8" fill="#3a3f47"/>

    <!-- 牙盘 -->
    <circle cx="400" cy="372" r="13" fill="none" stroke="#7d858e" stroke-width="5"/>
    <circle cx="400" cy="372" r="4" fill="#5b636e"/>

    <!-- ===== 鹈鹕 ===== -->
    <!-- 尾羽 -->
    <g transform="translate(316, 268)">
      <animateTransform attributeName="transform" type="rotate" values="-6; 6; -6" dur="1.8s" repeatCount="indefinite"/>
      <path d="M0 0 q-30 -6 -44 -16 q18 2 26 -2 q-14 -10 -22 -22 q18 12 30 16 q-4 -14 -2 -26 q10 20 16 30 q2 -16 8 -26 q2 24 -4 46" fill="#eef2f7" stroke="#c3cddd" stroke-width="1.5"/>
    </g>

    <!-- 远侧翅膀（后面那扇，扇动幅度小） -->
    <g transform="translate(372, 258)" opacity="0.85">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-28; -6; -28" dur="1.2s" repeatCount="indefinite"/>
        <path d="M0 0 q-26 4 -44 16 q-14 10 -10 22 q10 -8 22 -10 q14 -2 24 4 q-8 -10 -6 -22 q2 -8 14 -10" fill="#c3cddd"/>
      </g>
    </g>

    <!-- 身体 -->
    <ellipse cx="360" cy="262" rx="52" ry="38" fill="url(#bodyGrad)" stroke="#c3cddd" stroke-width="2" transform="rotate(-8 360 262)"/>

    <!-- 脖子 + 头 -->
    <path d="M396 244 q30 -30 44 -66" stroke="#f4f7fb" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M396 244 q30 -30 44 -66" stroke="#dfe6ee" stroke-width="24" stroke-linecap="round" fill="none" opacity="0.3"/>
    <!-- 头 -->
    <circle cx="446" cy="172" r="24" fill="url(#bodyGrad)" stroke="#c3cddd" stroke-width="2"/>
    <!-- 头顶小羽冠 -->
    <path d="M434 152 q4 -14 12 -16 q-2 10 2 16 q6 -8 12 -8 q-6 8 -8 12" fill="#eef2f7" stroke="#c3cddd" stroke-width="1.5"/>

    <!-- 眼睛 -->
    <circle cx="454" cy="166" r="5.5" fill="#2f343b"/>
    <circle cx="456" cy="164" r="2" fill="#ffffff"/>

    <!-- 喙：上喙 -->
    <g transform="translate(464, 176) rotate(8)">
      <path d="M0 -6 q44 -10 78 2 q4 2 0 6 q-38 6 -78 -2 Z" fill="url(#beakGrad)" stroke="#d96f1f" stroke-width="1.5"/>
      <path d="M8 -4 q36 -6 62 1" stroke="#d96f1f" stroke-width="1.5" fill="none" opacity="0.6"/>
      <!-- 喉囊（会晃动） -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-5; 7; -5" dur="1.6s" repeatCount="indefinite"/>
        <path d="M2 0 q26 26 52 6 q-4 26 -30 30 q-28 -4 -22 -36" fill="url(#pouchGrad)" stroke="#e07f2a" stroke-width="1.5" opacity="0.95"/>
        <!-- 喉囊里的小鱼尾巴 -->
        <g transform="translate(46, 26)">
          <animateTransform attributeName="transform" type="rotate" values="14; -18; 14" dur="0.8s" repeatCount="indefinite"/>
          <path d="M0 0 q10 -6 16 -2 q-6 2 -8 6 q6 -2 12 2 q-8 6 -16 0 q-4 -3 -4 -6" fill="#7ec8e3"/>
        </g>
      </g>
      <!-- 下喙线 -->
      <path d="M4 2 q40 4 74 -2" stroke="#d96f1f" stroke-width="2" fill="none"/>
    </g>

    <!-- 围巾（向后飘动） -->
    <g transform="translate(398, 224)">
      <path d="M0 0 q-22 -6 -44 -2 q14 8 18 20 q-16 -2 -28 4 q16 10 34 4 q10 -4 20 -6" fill="#ff5a5f" stroke="#d94348" stroke-width="1.5">
        <animate attributeName="d" dur="0.7s" repeatCount="indefinite"
          values="M0 0 q-22 -6 -44 -2 q14 8 18 20 q-16 -2 -28 4 q16 10 34 4 q10 -4 20 -6;
                  M0 0 q-24 -2 -50 4 q16 6 22 18 q-14 0 -26 8 q18 6 36 0 q10 -6 18 -10;
                  M0 0 q-22 -6 -44 -2 q14 8 18 20 q-16 -2 -28 4 q16 10 34 4 q10 -4 20 -6"/>
      </path>
      <path d="M4 2 q-18 4 -30 16 q12 -2 20 2 q-8 8 -6 16 q10 -12 16 -20 q4 -6 2 -14" fill="#ff7b7f" opacity="0.9">
        <animate attributeName="d" dur="0.55s" repeatCount="indefinite"
          values="M4 2 q-18 4 -30 16 q12 -2 20 2 q-8 8 -6 16 q10 -12 16 -20 q4 -6 2 -14;
                  M4 2 q-22 0 -36 10 q14 0 24 4 q-10 6 -12 14 q12 -8 22 -14 q4 -4 -4 -14;
                  M4 2 q-18 4 -30 16 q12 -2 20 2 q-8 8 -6 16 q10 -12 16 -20 q4 -6 2 -14"/>
      </path>
    </g>

    <!-- 近侧腿 + 踏板（联动曲柄） -->
    <g transform="translate(400, 372)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0; 360" dur="0.9s" repeatCount="indefinite"/>
        <rect x="0" y="-3" width="34" height="6" rx="3" fill="#aab2bb"/>
        <rect x="28" y="-9" width="18" height="10" rx="2" fill="#4a5058"/>
        <circle cx="0" cy="0" r="6" fill="#8f979f"/>
      </g>
    </g>
    <!-- 近侧腿（多边形点动画，模拟踩踏） -->
    <g stroke="#f2c14e" stroke-width="10" stroke-linecap="round" fill="none">
      <polyline points="382,296 418,330 434,364">
        <animate attributeName="points" dur="0.9s" repeatCount="indefinite"
          values="382,296 418,330 434,364;
                  383,302 421,334 436,365;
                  383,308 424,338 437,366;
                  383,314 427,342 437,367;
                  382,320 430,346 436,367;
                  381,326 432,349 435,367;
                  379,332 434,352 433,366;
                  377,337 436,354 431,365;
                  376,341 437,356 429,363;
                  375,344 437,357 428,361;
                  375,346 437,357 427,360;
                  376,344 436,356 427,360;
                  377,340 435,354 428,361;
                  378,335 433,352 430,363;
                  379,330 431,349 431,364;
                  380,324 427,345 433,365;
                  381,318 424,341 434,365;
                  382,312 421,337 435,366;
                  382,306 419,333 435,365;
                  382,296 418,330 434,364"/>
      </polyline>
    </g>
    <!-- 近侧翅膀（握住车把 + 扇动） -->
    <g transform="translate(398, 252)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-8; 10; -8" dur="1.2s" repeatCount="indefinite"/>
        <path d="M0 0 q34 10 62 30 q22 14 44 8 q-8 10 -22 10 q-20 2 -38 -8 q-30 -12 -46 -26 Z" fill="url(#wingGrad)" stroke="#b6c1cd" stroke-width="2"/>
        <path d="M14 10 q30 16 56 30" stroke="#b6c1cd" stroke-width="1.5" fill="none"/>
        <path d="M10 16 q26 18 48 32" stroke="#b6c1cd" stroke-width="1.5" fill="none"/>
        <circle cx="54" cy="41" r="8" fill="#eef2f7" stroke="#b6c1cd" stroke-width="2"/>
      </g>
    </g>
  </g>

  <!-- 前景草叶（向后掠过） -->
  <g stroke="#4c8a3f" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9">

<div class="controls">
  <button id="toggle">⏸ 暂停 / 播放</button>
</div>

<script>
  const svg = document.querySelector('svg');
  const btn = document.getElementById('toggle');
  btn.addEventListener('click', () => {
    if (svg.animationsPaused()) {
      svg.unpauseAnimations();
      svg.setCurrentTime(svg.getCurrentTime());
      btn.textContent = '⏸ 暂停 / 播放';
    } else {
      svg.pauseAnimations();
      btn.textContent = '▶ 播放动画';
    }
  });
</script>
