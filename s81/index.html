<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: linear-gradient(to bottom, #87ceeb 0%, #b0e0e6 60%, #f5deb3 60%, #d2b48c 100%);
    overflow: hidden;
    font-family: sans-serif;
  }
  .stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg {
    width: 100%;
    height: 100%;
    max-height: 100vh;
  }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 太阳 -->
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="100%" stop-color="#fbc02d"/>
    </radialGradient>
    <!-- 云 -->
    <symbol id="cloud" viewBox="0 0 120 40">
      <ellipse cx="30" cy="25" rx="25" ry="14" fill="#ffffff"/>
      <ellipse cx="60" cy="20" rx="30" ry="18" fill="#ffffff"/>
      <ellipse cx="90" cy="26" rx="22" ry="13" fill="#ffffff"/>
    </symbol>
  </defs>

  <!-- 背景：太阳 -->
  <circle cx="680" cy="90" r="45" fill="url(#sunGrad)"/>

  <!-- 飘动的云 -->
  <g>
    <use href="#cloud" x="40" y="60" width="120" height="40">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 60,0; 0,0" dur="14s" repeatCount="indefinite"/>
    </use>
    <use href="#cloud" x="260" y="40" width="100" height="34" opacity="0.85">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; -40,0; 0,0" dur="18s" repeatCount="indefinite"/>
    </use>
    <use href="#cloud" x="480" y="100" width="110" height="36" opacity="0.9">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 50,0; 0,0" dur="16s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- 远处的山 -->
  <path d="M0,300 L120,220 L220,280 L340,210 L460,275 L580,225 L720,290 L800,260 L800,340 L0,340 Z"
        fill="#a8c4a2" opacity="0.75"/>
  <path d="M0,320 L100,260 L200,300 L320,250 L440,300 L560,260 L680,310 L800,280 L800,360 L0,360 Z"
        fill="#8fb38a" opacity="0.85"/>

  <!-- 地面（向后移动） -->
  <g>
    <rect x="0" y="350" width="800" height="150" fill="#c9a26d"/>
    <g>
      <rect x="0" y="355" width="1600" height="6" fill="#8b6b3d"/>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; -800,0" dur="2s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="60"  cy="430" r="4" fill="#6b4a22"/>
      <circle cx="180" cy="460" r="3" fill="#6b4a22"/>
      <circle cx="320" cy="440" r="4" fill="#6b4a22"/>
      <circle cx="460" cy="470" r="3" fill="#6b4a22"/>
      <circle cx="600" cy="435" r="4" fill="#6b4a22"/>
      <circle cx="740" cy="465" r="3" fill="#6b4a22"/>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; -800,0" dur="2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 草 -->
  <g>
    <path d="M0,355 q5,-10 10,0 q5,-8 10,0 q5,-12 10,0 q5,-9 10,0 z" fill="#7cb342"/>
    <path d="M150,355 q5,-10 10,0 q5,-8 10,0 q5,-12 10,0 q5,-9 10,0 z" fill="#7cb342"/>
    <path d="M300,355 q5,-10 10,0 q5,-8 10,0 q5,-12 10,0 q5,-9 10,0 z" fill="#7cb342"/>
    <path d="M450,355 q5,-10 10,0 q5,-8 10,0 q5,-12 10,0 q5,-9 10,0 z" fill="#7cb342"/>
    <path d="M600,355 q5,-10 10,0 q5,-8 10,0 q5,-12 10,0 q5,-9 10,0 z" fill="#7cb342"/>
    <path d="M750,355 q5,-10 10,0 q5,-8 10,0 q5,-12 10,0 q5,-9 10,0 z" fill="#7cb342"/>
  </g>

  <!-- 自行车 + 鹈鹕：整体轻微上下颠簸 -->
  <g id="rider">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-3; 0,0; 0,-2; 0,0"
      keyTimes="0;0.25;0.5;0.75;1"
      dur="0.6s" repeatCount="indefinite"/>

    <!-- 自行车：后轮 -->
    <g transform="translate(280,360)">
      <circle r="42" fill="none" stroke="#222" stroke-width="4"/>
      <circle r="6" fill="#555"/>
      <g>
        <line x1="0" y1="-42" x2="0" y2="42" stroke="#888" stroke-width="1.5"/>
        <line x1="-42" y1="0" x2="42" y2="0" stroke="#888" stroke-width="1.5"/>
        <line x1="-30" y1="-30" x2="30" y2="30" stroke="#888" stroke-width="1.5"/>
        <line x1="-30" y1="30" x2="30" y2="-30" stroke="#888" stroke-width="1.5"/>
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- 自行车：前轮 -->
    <g transform="translate(520,360)">
      <circle r="42" fill="none" stroke="#222" stroke-width="4"/>
      <circle r="6" fill="#555"/>
      <g>
        <line x1="0" y1="-42" x2="0" y2="42" stroke="#888" stroke-width="1.5"/>
        <line x1="-42" y1="0" x2="42" y2="0" stroke="#888" stroke-width="1.5"/>
        <line x1="-30" y1="-30" x2="30" y2="30" stroke="#888" stroke-width="1.5"/>
        <line x1="-30" y1="30" x2="30" y2="-30" stroke="#888" stroke-width="1.5"/>
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- 自行车：车架 -->
    <line x1="280" y1="360" x2="400" y2="320" stroke="#c0392b" stroke-width="6" stroke-linecap="round"/>
    <line x1="400" y1="320" x2="520" y2="360" stroke="#c0392b" stroke-width="6" stroke-linecap="round"/>
    <line x1="400" y1="320" x2="400" y2="240" stroke="#c0392b" stroke-width="6" stroke-linecap="round"/>
    <line x1="400" y1="240" x2="520" y2="360" stroke="#c0392b" stroke-width="6" stroke-linecap="round"/>
    <line x1="400" y1="240" x2="340" y2="295" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>

    <!-- 座椅 -->
    <ellipse cx="340" cy="290" rx="22" ry="6" fill="#222"/>
    <rect x="335" y="290" width="2" height="10" fill="#444"/>

    <!-- 车把 -->
    <line x1="510" y1="260" x2="540" y2="240" stroke="#222" stroke-width="5" stroke-linecap="round"/>
    <line x1="540" y1="240" x2="565" y2="250" stroke="#222" stroke-width="5" stroke-linecap="round"/>
    <circle cx="540" cy="240" r="5" fill="#222"/>

    <!-- 踏板曲柄（旋转） -->
    <g transform="translate(400,320)">
      <g>
        <line x1="-20" y1="0" x2="20" y2="0" stroke="#444" stroke-width="4" stroke-linecap="round"/>
        <circle cx="-20" cy="0" r="4" fill="#222"/>
        <circle cx="20" cy="0" r="4" fill="#222"/>
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        <!-- 左脚 -->
        <g>
          <circle cx="-20" cy="0" r="6" fill="#f1c27d"/>
          <animateTransform attributeName="transform" type="rotate"
            from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
        </g>
        <!-- 右脚 -->
        <g>
          <circle cx="20" cy="0" r="6" fill="#f1c27d"/>
          <animateTransform attributeName="transform" type="rotate"
            from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>

    <!-- 链条简单表示 -->
    <line x1="280" y1="365" x2="400" y2="325" stroke="#666" stroke-width="1" stroke-dasharray="3,2" opacity="0.7"/>

    <!-- 鹈鹕身体 -->
    <g>
      <!-- 翅膀（拍动） -->
      <g transform="translate(400,250)">
        <path d="M0,0 Q-40,-30 -70,-10 Q-50,10 0,5 Z" fill="#e0e0e0" stroke="#9aa0a6" stroke-width="2">
          <animateTransform attributeName="transform" type="rotate"
            values="-5; 15; -5" dur="0.6s" repeatCount="indefinite"
            additive="sum"/>
        </path>
      </g>

      <!-- 身体 -->
      <ellipse cx="400" cy="260" rx="55" ry="40" fill="#fafafa" stroke="#9aa0a6" stroke-width="2"/>
      <!-- 肚子阴影 -->
      <ellipse cx="400" cy="275" rx="40" ry="20" fill="#eceff1"/>

      <!-- 头/颈 -->
      <path d="M430,235 Q470,210 510,220 Q500,240 470,250 Q445,255 430,250 Z"
            fill="#fafafa" stroke="#9aa0a6" stroke-width="2"/>

      <!-- 喙（上） -->
      <path d="M505,222 Q560,215 580,225 Q560,230 510,232 Z"
            fill="#ffb300" stroke="#c47a00" stroke-width="1.5"/>
      <!-- 喙（下/喉囊） -->
      <path d="M505,232 Q540,260 575,235 Q555,242 510,240 Z"
            fill="#ffcc80" stroke="#c47a00" stroke-width="1.5"/>
      <!-- 喉囊内侧 -->
      <path d="M520,238 Q540,250 555,238 Q540,247 522,243 Z" fill="#ffb74d" opacity="0.7"/>

      <!-- 眼睛 -->
      <circle cx="495" cy="220" r="4" fill="#fff" stroke="#333" stroke-width="1"/>
      <circle cx="496" cy="221" r="2.2" fill="#222"/>
      <circle cx="496.8" cy="220.2" r="0.7" fill="#fff"/>

      <!-- 腿（两条，脚连到踏板） -->
      <line x1="385" y1="295" x2="385" y2="318" stroke="#f1c27d" stroke-width="5" stroke-linecap="round"/>
      <line x1="415" y1="295" x2="415" y2="318" stroke="#f1c27d" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
</div>
</body>
</html>
