<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 20px;
    background:
      radial-gradient(120% 90% at 70% 0%, #3a1848 0%, transparent 55%),
      radial-gradient(90% 70% at 10% 100%, #122033 0%, #0b1018 70%);
    color: #ecd9c7;
    font: 14px/1.5 ui-sans-serif, system-ui, "PingFang SC", "Noto Sans SC", sans-serif;
  }
  .stage {
    width: min(96vw, 1120px);
    aspect-ratio: 16 / 9;
    position: relative;
    border-radius: 22px;
    overflow: hidden;
    cursor: pointer;
    box-shadow:
      0 30px 80px rgba(0,0,0,.5),
      inset 0 0 0 1px rgba(255,255,255,.1);
  }
  svg { display: block; width: 100%; height: 100%; }
  .bar {
    display: flex;
    flex-wrap: wrap;
    gap: 14px 18px;
    align-items: center;
    justify-content: center;
  }
  button {
    font: inherit;
    color: #fff4e6;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 999px;
    padding: 6px 18px;
    cursor: pointer;
  }
  button:hover { background: rgba(255,255,255,.16); }
  label { display: flex; align-items: center; gap: 8px; opacity: .82; font-size: 13px; }
  input[type=range] { width: 160px; accent-color: #2ec4b6; }
  .hint { opacity: .48; font-size: 12.5px; text-align: center; }

  .glow { transform-origin: 980px 148px; animation: glow 6.5s ease-in-out infinite alternate; }
  @keyframes glow { from { transform: scale(1); opacity: .85; } to { transform: scale(1.08); opacity: 1; } }

  .crest { transform-origin: 0 0; animation: crest 1.2s ease-in-out infinite alternate; }
  @keyframes crest { from { transform: rotate(-8deg); } to { transform: rotate(9deg); } }

  .tailA { transform-origin: 0 0; animation: tail 1.45s ease-in-out infinite alternate; }
  .tailB { transform-origin: 0 0; animation: tail 1.45s ease-in-out infinite alternate -.4s; }
  .tailC { transform-origin: 0 0; animation: tail 1.45s ease-in-out infinite alternate -.8s; }
  @keyframes tail { from { transform: rotate(-6deg); } to { transform: rotate(7deg); } }

  .fish { transform-origin: 12px 4px; animation: fish .45s ease-in-out infinite alternate; }
  @keyframes fish { from { transform: rotate(-18deg); } to { transform: rotate(20deg); } }

  .basketFish { transform-origin: 18px 8px; animation: fish .7s ease-in-out infinite alternate; }

  .gull { transform-origin: 0 0; animation: flap .55s ease-in-out infinite alternate; }
  .gull:nth-child(2) { animation-delay: -.2s; }
  .gull:nth-child(3) { animation-delay: -.4s; }
  @keyframes flap { from { transform: scaleY(.35); } to { transform: scaleY(1.05); } }

  .boat { transform-origin: 0 8px; animation: rock 3.4s ease-in-out infinite alternate; }
  @keyframes rock { from { transform: rotate(-4deg) translateY(0); } to { transform: rotate(4deg) translateY(2px); } }

  .paused * { animation-play-state: paused !important; }

  @media (prefers-reduced-motion: reduce) {
    .glow, .crest, .tailA, .tailB, .tailC, .fish, .basketFish, .gull, .boat { animation: none; }
  }
</style>
</head>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const el = (n, a = {}) => {
    const e = document.createElementNS(NS, n);
    for (const k in a) e.setAttribute(k, a[k]);
    return e;
  };

  const REAR = { x: 365, y: 500 };
  const FRONT = { x: 655, y: 500 };
  const BB = { x: 475, y: 510 };
  const R_WHEEL = 58;
  const CRANK = 36;
  const RING = 21;
  const COG = 8.2;
  const GEAR = RING / COG;
  const THIGH = 84;
  const SHANK = 78;
  const UPARM = 92;
  const FOREARM = 86;
  const GRIP = { x: 568, y: 332 };
  const GRIP_FAR = { x: 560, y: 326 };

  let seed = 46;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const rr = (a, b) => a + rnd() * (b - a);

  const spokes = $('spokes');
  for (let i = 0; i < 16; i++) {
    spokes.appendChild(el('line', { x1: 0, y1: 0, x2: 0, y2: -47, transform: `rotate(${i * 22.5})` }));
  }

  const layers = [];
  function layer(hostId, tileW, factor, draw) {
    const host = $(hostId);
    const inner = el('g');
    const n = Math.ceil(1200 / tileW) + 2;
    for (let i = 0; i < n; i++) {
      const t = el('g', { transform: `translate(${i * tileW},0)` });
      draw(t, i);
      inner.appendChild(t);
    }
    host.appendChild(inner);
    layers.push({ inner, tileW, factor });
  }

  layer('lClouds', 480, 0.045, (g) => {
    for (let k = 0; k < 2; k++) {
      const x = rr(30, 380), y = rr(48, 150), s = rr(.75, 1.55);
      const c = el('g', {
        transform: `translate(${x},${y}) scale(${s})`,
        opacity: rr(.5, .88).toFixed(2)
      });
      c.appendChild(el('path', {
        d: 'M0,0 C-8,-22 16,-34 34,-24 C44,-42 74,-40 82,-20 C104,-24 112,-6 100,4 Z',
        fill: '#fff6ea'
      }));
      c.appendChild(el('path', { d: 'M4,2 C26,-4 74,-4 98,3 Z', fill: '#f0d3c0', opacity: '.45' }));
      g.appendChild(c);
    }
  });

  layer('lHills', 900, 0.12, (g, i) => {
    g.appendChild(el('path', {
      d: 'M0,318 C80,268 140,278 220,250 C300,222 340,268 420,248 C520,222 580,268 700,238 C800,216 860,268 900,318 Z',
      fill: i % 2 ? '#6a4458' : '#5a3a52'
    }));
    const light = el('g', { transform: 'translate(140,214)' });
    light.appendChild(el('rect', { x: -8, y: -52, width: 16, height: 52, fill: '#f4efe4', stroke: '#6a4a38', 'stroke-width': '1.6' }));
    light.appendChild(el('rect', { x: -8, y: -38, width: 16, height: 8, fill: '#d94a3d' }));
    light.appendChild(el('rect', { x: -8, y: -18, width: 16, height: 8, fill: '#d94a3d' }));
    light.appendChild(el('polygon', { points: '-14,-52 14,-52 0,-68', fill: '#d94a3d', stroke: '#6a4a38', 'stroke-width': '1.4' }));
    light.appendChild(el('circle', { cx: 0, cy: -58, r: 3, fill: '#ffe8a0' }));
    g.appendChild(light);
  });

  layer('lSpark', 280, 0.22, (g) => {
    for (let k = 0; k < 7; k++) {
      g.appendChild(el('path', {
        d: `M${rr(10, 260)},${rr(330, 392)} q ${rr(12, 28)} ${rr(-4, 4)} ${rr(24, 48)} 0`,
        fill: 'none',
        stroke: '#d7f4fa',
        'stroke-width': rr(1, 2.2).toFixed(1),
        opacity: rr(.25, .7).toFixed(2)
      }));
    }
  });

  {
    const wrap = el('g');
    const b = el('g', { transform: 'translate(820,312)' });
    const inner = el('g', { class: 'boat' });
    inner.appendChild(el('path', { d: 'M0,0 L0,-48 L32,-8 Z', fill: '#fff7ea', stroke: '#c9b8a0', 'stroke-width': '1.3' }));
    inner.appendChild(el('path', { d: 'M-4,0 L-4,-40 L-26,-6 Z', fill: '#f3d4bc', stroke: '#c9a88c', 'stroke-width': '1.3' }));
    inner.appendChild(el('path', { d: 'M-32,0 L36,0 L26,12 L-24,12 Z', fill: '#a8452f' }));
    b.appendChild(inner);
    wrap.appendChild(b);
    $('boatWrap').appendChild(wrap);
    layers.push({ inner: wrap, tileW: 1400, factor: 0.18 });
  }

  {
    const host = $('lGulls');
    const inner = el('g');
    const gulls = [
      [180, 210, .9], [460, 168, 1.15], [740, 196, .8]
    ];
    gulls.forEach(([x, y, s], i) => {
      const g = el('g', { class: 'gull', transform: `translate(${x},${y}) scale(${s})` });
      g.appendChild(el('path', {
        d: 'M-16,0 Q-8,-10 0,0 Q8,-10 16,0',
        fill: 'none', stroke: '#f7f1e6', 'stroke-width': '2.4', 'stroke-linecap': 'round'
      }));
      inner.appendChild(g);
    });
    host.appendChild(inner);
    layers.push({ inner, tileW: 900, factor: 0.16 });
  }

  layer('lDuneFar', 520, 0.32, (g) => {
    g.appendChild(el('path', {
      d: 'M-20,418 C60,368 140,378 220,356 C320,330 390,372 540,418 Z',
      fill: 'url(#duneFar)'
    }));
  });

  layer('lDuneNear', 420, 0.55, (g) => {
    g.appendChild(el('path', {
      d: 'M-10,478 C70,438 150,448 230,428 C310,410 360,448 440,478 Z',
      fill: '#c9966c',
      opacity: '.85'
    }));
    g.appendChild(el('path', {
      d: `M${rr(40, 300)},478 C${rr(60, 140)},448 ${rr(160, 260)},452 ${rr(240, 380)},478`,
      fill: 'none', stroke: '#e8c39e', 'stroke-width': '2', opacity: '.35'
    }));
  });

  layer('lDash', 72, 1, (g) => {
    g.appendChild(el('rect', { x: 8, y: 522, width: 38, height: 7, rx: 2, fill: '#f2d24a' }));
  });

  layer('lPosts', 210, 1.05, (g) => {
    g.appendChild(el('rect', { x: 24, y: 430, width: 10, height: 128, rx: 2, fill: '#6b4a32' }));
    g.appendChild(el('rect', { x: 21, y: 426, width: 16, height: 10, rx: 2, fill: '#8a6242' }));
    g.appendChild(el('path', {
      d: 'M29,448 C80,438 140,458 210,446',
      fill: 'none', stroke: '#c4a882', 'stroke-width': '3'
    }));
  });

  layer('lFore', 160, 1.7, (g) => {
    for (let k = 0; k < 5; k++) {
      const x = rr(4, 140);
      g.appendChild(el('path', {
        d: `M${x},675 C${x - 6},${rr(600, 640)} ${x + 8},${rr(580, 630)} ${x + rr(-10, 10)},${rr(560, 610)}`,
        fill: 'none',
        stroke: k % 2 ? '#6a8a3a' : '#4f6e2c',
        'stroke-width': rr(2, 4).toFixed(1),
        'stroke-linecap': 'round'
      }));
    }
  });

  function ik(ax, ay, bx, by, l1, l2, sign) {
    let dx = bx - ax, dy = by - ay;
    let d = Math.hypot(dx, dy);
    const max = l1 + l2 - 0.05;
    const min = Math.abs(l1 - l2) + 0.05;
    if (d < 1e-4) { dx = 1; dy = 0; d = 1; }
    const d2 = Math.max(min, Math.min(max, d));
    const nx = dx / d, ny = dy / d;
    const a = (l1 * l1 - l2 * l2 + d2 * d2) / (2 * d2);
    const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    return { x: ax + nx * a - ny * h * sign, y: ay + ny * a + nx * h * sign };
  }

  function bez(p, t) {
    const u = 1 - t, tt = t * t, uu = u * u;
    return {
      x: uu * u * p[0] + 3 * uu * t * p[2] + 3 * u * tt * p[4] + tt * t * p[6],
      y: uu * u * p[1] + 3 * uu * t * p[3] + 3 * u * tt * p[5] + tt * t * p[7]
    };
  }
  function bezD(p, t) {
    const u = 1 - t;
    return {
      x: 3 * u * u * (p[2] - p[0]) + 6 * u * t * (p[4] - p[2]) + 3 * t * t * (p[6] - p[4]),
      y: 3 * u * u * (p[3] - p[1]) + 6 * u * t * (p[5] - p[3]) + 3 * t * t * (p[7] - p[5])
    };
  }
  function thickBez(p, w0, w1, steps = 14) {
    const L = [], R = [];
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const pt = bez(p, t);
      const d = bezD(p, t);
      const len = Math.hypot(d.x, d.y) || 1;
      const w = w0 + (w1 - w0) * t;
      const nx = -d.y / len, ny = d.x / len;
      L.push([pt.x + nx * w, pt.y + ny * w]);
      R.push([pt.x - nx * w, pt.y - ny * w]);
    }
    let s = `M${L[0][0].toFixed(1)},${L[0][1].toFixed(1)}`;
    for (let i = 1; i < L.length; i++) s += `L${L[i][0].toFixed(1)},${L[i][1].toFixed(1)}`;
    for (let i = R.length - 1; i >= 0; i--) s += `L${R[i][0].toFixed(1)},${R[i][1].toFixed(1)}`;
    return s + 'Z';
  }

  function setLine(id, x1, y1, x2, y2) {
    const e = $(id);
    e.setAttribute('x1', x1.toFixed(2));
    e.setAttribute('y1', y1.toFixed(2));
    e.setAttribute('x2', x2.toFixed(2));
    e.setAttribute('y2', y2.toFixed(2));
  }

  let playing = true;
  let crank = 0;
  let wheel = 0;
  let travel = 0;
  let last = 0;
  let blinkT = 2.8;
  let blinkPhase = -1;

  const scene = $('scene');
  const btn = $('btn');
  const spd = $('spd');

  function toggle() {
    playing = !playing;
    btn.textContent = playing ? '暂停' : '继续';
    scene.classList.toggle('paused', !playing);
  }
  btn.addEventListener('click', e => { e.stopPropagation(); toggle(); });
  $('stage').addEventListener('click', toggle);
  window.addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    e.preventDefault();
    toggle();
  });

  function legs(prefix, th, hipX, hipY, crankId, pedalId, footId) {
    const px = BB.x + Math.cos(th) * CRANK;
    const py = BB.y + Math.sin(th) * CRANK;
    setLine(crankId, BB.x, BB.y, px, py);
    const footAng = Math.sin(th) * 12;
    $(pedalId).setAttribute('transform', `translate(${px.toFixed(2)},${py.toFixed(2)}) rotate(${(footAng * .25).toFixed(1)})`);
    const ankX = px + Math.cos(th) * 6;
    const ankY = py + 2;
    const knee = ik(hipX, hipY, ankX, ankY, THIGH, SHANK, 1);
    setLine(prefix + 'ThighO', hipX, hipY, knee.x, knee.y);
    setLine(prefix + 'Thigh',  hipX, hipY, knee.x, knee.y);
    setLine(prefix + 'ShankO', knee.x, knee.y, ankX, ankY);
    setLine(prefix + 'Shank',  knee.x, knee.y, ankX, ankY);
    $(footId).setAttribute('transform', `translate(${ankX.toFixed(2)},${ankY.toFixed(2)}) rotate(${footAng.toFixed(1)})`);
  }

  function arm(sx, sy, gx, gy, uO, u, fO, f, hand) {
    const elb = ik(sx, sy, gx, gy, UPARM, FOREARM, -1);
    setLine(uO, sx, sy, elb.x, elb.y);
    setLine(u,  sx, sy, elb.x, elb.y);
    setLine(fO, elb.x, elb.y, gx, gy);
    setLine(f,  elb.x, elb.y, gx, gy);
    if (hand) {
      const ang = Math.atan2(gy - elb.y, gx - elb.x) * 180 / Math.PI;
      hand.setAttribute('transform', `translate(${gx.toFixed(2)},${gy.toFixed(2)}) rotate(${ang.toFixed(1)})`);
    }
  }

  function draw(now, dt) {
    const cadence = parseFloat(spd.value);
    const omega = cadence * Math.PI * 1.7;
    crank += omega * dt;
    wheel += omega * GEAR * dt;
    travel += omega * GEAR * R_WHEEL * dt;

    const bob = Math.sin(crank * 2) * 3.2;
    const lean = Math.sin(crank * 2 + .4) * 1.1;
    $('bodyG').setAttribute('transform', `translate(0,${bob.toFixed(2)}) rotate(${lean.toFixed(2)},450,340)`);
    $('tailG').setAttribute('transform', `translate(${(-bob * .3).toFixed(2)},${(bob * .4).toFixed(2)})`);
    const headBob = Math.sin(crank * 2 + .7) * 2.4;
    const headNod = Math.sin(crank * 2 + 1.1) * 1.6;
    $('headG').setAttribute('transform', `translate(0,${(bob * .45 + headBob).toFixed(2)}) rotate(${headNod.toFixed(2)},560,210)`);
    $('shadow').setAttribute('rx', (200 + Math.sin(crank * 2) * 8).toFixed(1));

    const pouchDrop = 6 + Math.sin(crank * 2 + .5) * 5;
    $('pouch').setAttribute('d',
      `M575,236 C630,${(258 + pouchDrop * .2).toFixed(1)} 690,${(282 + pouchDrop * .3).toFixed(1)} 728,272
       C690,${(318 + pouchDrop).toFixed(1)} 628,${(336 + pouchDrop).toFixed(1)} 586,${(308 + pouchDrop * .4).toFixed(1)}
       C560,288 556,252 575,236 Z`);

    const n0x = 492, n0y = 300 + bob;
    const n3x = 548, n3y = 226 + bob * .45 + headBob;
    $('neck').setAttribute('d', thickBez(
      [n0x, n0y, 508, 268 + bob, 500, 238 + headBob, n3x, n3y],
      22, 13
    ));

    const hipN = { x: 452, y: 402 + bob };
    const hipF = { x: 440, y: 408 + bob };
    legs('near', crank,          hipN.x, hipN.y, 'crankNear', 'pedalNear', 'nearFoot');
    legs('far',  crank + Math.PI, hipF.x, hipF.y, 'crankFar',  'pedalFar',  'farFoot');

    const shN = { x: 498, y: 328 + bob };
    const shF = { x: 486, y: 334 + bob };
    arm(shN.x, shN.y, GRIP.x, GRIP.y + bob * .15, 'nearArmUO', 'nearArmU', 'nearArmFO', 'nearArmF', $('nearHand'));
    arm(shF.x, shF.y, GRIP_FAR.x, GRIP_FAR.y + bob * .15, 'farArmUO', 'farArmU', 'farArmFO', 'farArmF', null);

    const wdeg = wheel * 180 / Math.PI;
    const rdeg = crank * 180 / Math.PI;
    $('wheelR').setAttribute('transform', `translate(${REAR.x},${REAR.y}) rotate(${wdeg.toFixed(2)})`);
    $('wheelF').setAttribute('transform', `translate(${FRONT.x},${FRONT.y}) rotate(${wdeg.toFixed(2)})`);
    $('cogG').setAttribute('transform', `translate(${REAR.x},${REAR.y}) rotate(${wdeg.toFixed(2)})`);
    $('ringG').setAttribute('transform', `translate(${BB.x},${BB.y}) rotate(${rdeg.toFixed(2)})`);

    const chainOff = -((travel * RING / R_WHEEL) % 12);
    $('chainTop').setAttribute('stroke-dashoffset', chainOff.toFixed(2));
    $('chainBot').setAttribute('stroke-dashoffset', chainOff.toFixed(2));

    for (const L of layers) {
      const x = -((travel * L.factor) % L.tileW);
      L.inner.setAttribute('transform', `translate(${x.toFixed(2)},0)`);
    }

    blinkT -= dt;
    if (blinkPhase < 0 && blinkT <= 0) blinkPhase = 0;
    if (blinkPhase >= 0) {
      blinkPhase += dt / 0.14;
      if (blinkPhase >= 1) {
        blinkPhase = -1;
        blinkT = 2.2 + Math.random() * 2.6;
      }
    }
    const close = blinkPhase < 0 ? 0 : Math.sin(blinkPhase * Math.PI);
    $('pupil').setAttribute('ry', (3.6 * (1 - close * 0.92)).toFixed(2));
  }

  function frame(now) {
    if (!last) last = now;
    const dt = Math.min(.05, (now - last) / 1000);
    last = now;
    if (playing) draw(now, dt);
    requestAnimationFrame(frame);
  }
  draw(0, 0);
  requestAnimationFrame(frame);
})();
</script>
