<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(#aee3f5, #e8f7ee); }
  svg { width: 800px; max-width: 95vw; }
</style>
</head>
<body>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aee3f5"/>
      <stop offset="1" stop-color="#e8f7ee"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- 远处的云（移动） -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="translate" from="900 0" to="-300 0" dur="18s" repeatCount="indefinite"/>
      <ellipse cx="150" cy="80" rx="45" ry="18"/>
      <ellipse cx="185" cy="72" rx="35" ry="15"/>
      <ellipse cx="115" cy="74" rx="30" ry="13"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="900 0" to="-300 0" dur="26s" repeatCount="indefinite"/>
      <ellipse cx="400" cy="130" rx="50" ry="18"/>
      <ellipse cx="440" cy="120" rx="35" ry="14"/>
    </g>
  </g>

  <!-- 地面 -->
  <rect y="430" width="800" height="70" fill="#8ec97e"/>
  <line x1="0" y1="430" x2="800" y2="430" stroke="#6aa85c" stroke-width="3"/>

  <!-- 地面虚线（滚动） -->
  <g stroke="#ffffff" stroke-width="4" stroke-dasharray="40 40">
    <line x1="0" y1="470" x2="800" y2="470">
      <animate attributeName="stroke-dashoffset" from="0" to="80" dur="0.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 整体上下颠簸（骑行弹跳） -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -8; 0 0; 0 -4; 0 0" dur="0.7s" repeatCount="indefinite"/>

    <!-- 后轮 -->
    <g transform="translate(310,420)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
        <circle r="55" fill="none" stroke="#333" stroke-width="8"/>
        <circle r="46" fill="none" stroke="#888" stroke-width="2"/>
        <g stroke="#555" stroke-width="3">
          <line x1="0" y1="-46" x2="0" y2="46"/>
          <line x1="-46" y1="0" x2="46" y2="0"/>
          <line x1="-32.5" y1="-32.5" x2="32.5" y2="32.5"/>
          <line x1="-32.5" y1="32.5" x2="32.5" y2="-32.5"/>
        </g>
        <circle r="7" fill="#333"/>
        <!-- 后轮脚踏连接点由JS更新 -->
        <circle id="pedalBack" r="5" fill="#c0392b"/>
      </g>
    </g>

    <!-- 前轮 -->
    <g transform="translate(510,420)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
        <circle r="55" fill="none" stroke="#333" stroke-width="8"/>
        <circle r="46" fill="none" stroke="#888" stroke-width="2"/>
        <g stroke="#555" stroke-width="3">
          <line x1="0" y1="-46" x2="0" y2="46"/>
          <line x1="-46" y1="0" x2="46" y2="0"/>
          <line x1="-32.5" y1="-32.5" x2="32.5" y2="32.5"/>
          <line x1="-32.5" y1="32.5" x2="32.5" y2="-32.5"/>
        </g>
        <circle r="7" fill="#333"/>
      </g>
    </g>

    <!-- 车架 -->
    <g stroke="#e67e22" stroke-width="9" fill="none" stroke-linecap="round">
      <line x1="310" y1="420" x2="370" y2="330"/>   <!-- 后下叉 -->
      <line x1="370" y1="330" x2="330" y2="330"/>   <!-- 座管横 -->
      <line x1="370" y1="330" x2="455" y2="355"/>   <!-- 下管 -->
      <line x1="455" y1="355" x2="510" y2="420"/>   <!-- 前下叉 -->
      <line x1="455" y1="355" x2="470" y2="300"/>   <!-- 头管 -->
      <line x1="330" y1="330" x2="315" y2="290"/>   <!-- 座管 -->
    </g>
    <!-- 车座 -->
    <line x1="295" y1="288" x2="340" y2="288" stroke="#222" stroke-width="10" stroke-linecap="round"/>
    <!-- 车把 -->
    <path d="M470 300 L480 285 L455 278" stroke="#222" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="452" cy="277" r="6" fill="#222"/>
    <circle cx="483" cy="284" r="6" fill="#222"/>

    <!-- 脚踏曲柄（JS旋转） -->
    <g transform="translate(455,355)">
      <g id="crank">
        <line x1="0" y1="0" x2="0" y2="-34" stroke="#555" stroke-width="7" stroke-linecap="round"/>
        <line x1="0" y1="0" x2="0" y2="34" stroke="#555" stroke-width="7" stroke-linecap="round"/>
        <circle id="pedalTop" cx="0" cy="-38" r="7" fill="#c0392b"/>
        <circle id="pedalBottom" cx="0" cy="38" r="7" fill="#c0392b"/>
      </g>
      <circle r="9" fill="#333"/>
    </g>

    <!-- 鹈鹕腿（JS更新，脚固定在脚踏上） -->
    <path id="legBack" stroke="#d68910" stroke-width="9" fill="none" stroke-linecap="round" stroke-opacity="0.85"/>
    <path id="legFront" stroke="#b9770e" stroke-width="9" fill="none" stroke-linecap="round"/>

    <!-- 鹈鹕身体 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-3 320 290; 3 320 290; -3 320 290" dur="0.7s" repeatCount="indefinite"/>
      <!-- 身体 -->
      <ellipse cx="330" cy="235" rx="78" ry="58" fill="#f5f0e6" stroke="#d5cdb8" stroke-width="3"/>
      <!-- 翅膀（扑动） -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0 330 220; -18 330 220; 0 330 220; 10 330 220; 0 330 220" dur="0.7s" repeatCount="indefinite"/>
        <ellipse cx="322" cy="228" rx="55" ry="34" fill="#e6dfcc" stroke="#cfc6ad" stroke-width="3"/>
        <path d="M280 215 Q320 245 365 235" stroke="#cfc6ad" stroke-width="3" fill="none"/>
      </g>
      <!-- 尾巴 -->
      <path d="M262 235 L225 215 L238 250 Z" fill="#f5f0e6" stroke="#d5cdb8" stroke-width="3"/>
      <!-- 脖子 -->
      <path d="M395 215 Q425 195 430 150" stroke="#f5f0e6" stroke-width="26" fill="none" stroke-linecap="round"/>
      <!-- 头 -->
      <circle cx="432" cy="140" r="30" fill="#f5f0e6" stroke="#d5cdb8" stroke-width="3"/>
      <!-- 冠羽 -->
      <path d="M412 118 Q400 100 385 98" stroke="#d5cdb8" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- 大嘴（含喉囊，轻微张合） -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0 458 138; 4 458 138; 0 458 138" dur="1.4s" repeatCount="indefinite"/>
        <path d="M455 128 L545 122 L548 132 Q500 160 458 148 Z" fill="#f0a13a" stroke="#d68910" stroke-width="3"/>
        <path d="M455 128 L545 122" stroke="#d68910" stroke-width="4" stroke-linecap="round"/>
      </g>
      <!-- 眼睛 -->
      <circle cx="440" cy="130" r="6" fill="#222"/>
      <circle cx="442" cy="128" r="2" fill="#fff"/>
    </g>
  </g>

<script>
//<![CDATA[
(function () {
  var cx = 455, cy = 355, r = 38, speed = 0.28; // rad per frame
  var crank = document.getElementById('crank');
  var legFront = document.getElementById('legFront');
  var legBack = document.getElementById('legBack');
  var pedalTop = document.getElementById('pedalTop');
  var pedalBottom = document.getElementById('pedalBottom');
  var pedalBack = document.getElementById('pedalBack');
  var angle = 0;

  function buildLeg(path, hipX, hipY, footX, footY) {
    var mx = (hipX + footX) / 2 + (footY - hipY) * 0.35;
    var my = (hipY + footY) / 2 - (footX - hipX) * 0.35;
    path.setAttribute('d',
      'M' + hipX + ' ' + hipY + ' Q' + mx.toFixed(1) + ' ' + my.toFixed(1) +
      ' ' + footX.toFixed(1) + ' ' + footY.toFixed(1));
  }

  function tick() {
    angle += speed;
    var a = angle * 180 / Math.PI;
    crank.setAttribute('transform', 'rotate(' + a.toFixed(1) + ')');

    var fx = cx + r * Math.sin(angle), fy = cy - r * Math.cos(angle);
    var bx = 310 + r * Math.sin(angle), by = 420 - r * Math.cos(angle);
    pedalTop.setAttribute('cx', fx.toFixed(1)); pedalTop.setAttribute('cy', fy.toFixed(1));
    pedalBack.setAttribute('cx', (r * Math.sin(angle)).toFixed(1));
    pedalBack.setAttribute('cy', (-r * Math.cos(angle)).toFixed(1));
    buildLeg(legFront, 350, 268, fx, fy);
    buildLeg(legBack, 338, 266, bx, by);
    requestAnimationFrame(tick);
  }
  tick();
})();
//]]>
</script>
</svg>
</body>
</html>
